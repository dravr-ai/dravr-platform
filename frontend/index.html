<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dravr-favicon.svg" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to resolve
         non-zero on notched iOS — it activates the bottom-bar / drawer / content
         safe-area padding already in the tree. Never add user-scalable=no /
         maximum-scale (breaks pinch-zoom, WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00241a" />
    <meta name="description" content="Dravr — fitness intelligence for athletes and coaches." />
    <!-- Add-to-Home-Screen: the web app manifest <link> is injected at build by
         vite-plugin-pwa. iOS Safari ignores the manifest's display/icons, so the
         apple-* tags below are required for a standalone home-screen launch with
         the brand icon and a translucent status bar that respects safe-area. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dravr" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Dravr</title>
    <script>
      // Dark-first brand. Apply `.dark` on <html> before React boots so the
      // first paint already matches the resolved theme (no light→dark
      // flash for the default case). Mirrors useTheme.tsx semantics.
      (function () {
        try {
          var stored = localStorage.getItem('dravr.theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          var resolved;
          if (pref === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            resolved = pref;
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
