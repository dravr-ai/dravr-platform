# ABOUTME: Test voice input button interactions
# ABOUTME: Converted from voiceInput.test.js "VoiceButton interactions" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# The app lands on the conversation list; open a thread to get a composer
- runFlow:
    file: ../helpers/new-chat.yaml

# Voice recognition requires native speech APIs which are unavailable
# in Expo Go (no native module bundled). VoiceButton returns null when
# isAvailable is false. These assertions only run when voice is available.

# Test: should respond to tap (only when voice is available)
- runFlow:
    when:
      visible:
        id: "voice-input-button"
    commands:
      - tapOn:
          id: "voice-input-button"
      # The button should still be visible (may have changed state)
      - assertVisible:
          id: "voice-input-button"

# Verify the chat input is always accessible
- assertVisible:
    id: "message-input"
