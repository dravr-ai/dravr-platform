# ABOUTME: Test voice input button visibility
# ABOUTME: Converted from voiceInput.test.js "VoiceButton visibility" tests

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Voice recognition requires native speech APIs which are unavailable
# in Expo Go (no native module bundled). VoiceButton returns null when
# isAvailable is false. These assertions only run when voice is available.

# Test: should show voice input button on chat screen (when available)
- runFlow:
    when:
      visible:
        id: "voice-input-button"
    commands:
      - assertVisible:
          id: "voice-input-button"
      - assertVisible:
          id: "message-input"

# Verify the chat input area renders regardless of voice availability
- assertVisible:
    id: "message-input"
