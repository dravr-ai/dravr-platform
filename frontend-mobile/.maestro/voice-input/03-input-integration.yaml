# ABOUTME: Test voice input integration with text input
# ABOUTME: Converted from voiceInput.test.js "Input integration" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# The app lands on the conversation list; open a thread to get a composer
- runFlow:
    file: ../helpers/new-chat.yaml

# Test: should not interfere with manual text input
- runFlow:
    file: ../helpers/focus-message-input.yaml
- inputText: "Hello Pierre"

# Voice button visibility depends on native speech recognition availability.
# In Expo Go, the native module is not bundled so the button is hidden.
- runFlow:
    when:
      visible:
        id: "voice-input-button"
    commands:
      - assertVisible:
          id: "voice-input-button"

# Send button testID switches to send-button when canSend is true.
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Clear for next test
- eraseText

# Test: should keep voice button enabled with text in input
- runFlow:
    file: ../helpers/focus-message-input.yaml
- inputText: "Testing"

# Verify input still works regardless of voice availability
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000
