# ABOUTME: Test Social Settings screen display
# ABOUTME: Social settings navigation is not yet wired in the main settings screen

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Social Feed via Insights tab
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 10000

# Verify the social feed is displayed
- assertVisible: "Feed"

# Test: should display Find Friends button
- extendedWaitUntil:
    visible: "Find Friends"
    timeout: 5000
- assertVisible: "Find Friends"
