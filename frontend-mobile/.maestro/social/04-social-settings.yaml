# ABOUTME: Test Social Feed screen display and interaction
# ABOUTME: Verifies social feed loads correctly with items or empty state

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Social Feed via Insights tab
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 15000

# Verify the social feed header is displayed
- assertVisible: "Feed"

# Test: feed shows either items or empty state
- runFlow:
    when:
      visible:
        id: "feed-list"
    commands:
      - assertVisible:
          id: "feed-list"

- runFlow:
    when:
      visible: "No Insights Yet"
    commands:
      - assertVisible: "No Insights Yet"
