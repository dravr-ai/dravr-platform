# ABOUTME: Test social feed empty state and interaction
# ABOUTME: Social settings toggle is not yet accessible via UI navigation

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Social Feed via Insights tab
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 10000

# In CI, fresh user has no insights — verify empty state
- runFlow:
    when:
      visible: "No Insights Yet"
    commands:
      - assertVisible: "No Insights Yet"

# Verify feed list exists when there are insights
- runFlow:
    when:
      visible:
        id: "feed-list"
    commands:
      - assertVisible:
          id: "feed-list"
