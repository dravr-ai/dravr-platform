# ABOUTME: Test Share Insight flow from suggestions banner
# ABOUTME: Share button is inside conditional suggestions banner

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Share Insight via Insights tab
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 10000

# The share button is inside a suggestions banner that only appears
# when there are shareable suggestions. Guard with when:visible.
- runFlow:
    when:
      visible:
        id: "share-suggestion-button"
    commands:
      - tapOn:
          id: "share-suggestion-button"
      - extendedWaitUntil:
          visible:
            id: "share-insight-screen"
          timeout: 5000
      - assertVisible: "Share Insight"
      # Verify content input exists
      - assertVisible:
          id: "insight-content-input"
      # Go back
      - back

# If no suggestions banner, verify the feed screen is still stable
- assertVisible:
    id: "social-feed-screen"
