# ABOUTME: Visual tests for agent store
# ABOUTME: Converted from mobile-visual.test.js "Coach Store" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to store via Discover tab
- tapOn:
    text: "Découvrir|Discover"

# Test: store - displays agent grid
- extendedWaitUntil:
    visible:
      id: "store-screen"
    timeout: 5000

# Test: store - category tabs filter content
- runFlow:
    when:
      visible: "Training"
    commands:
      - tapOn: "Training"
      - tapOn: "Nutrition"
      - runFlow:
          when:
            visible: "Recovery"
          commands:
            - tapOn: "Recovery"

# Test: store - search agents works
- runFlow:
    when:
      visible: "Search agents...|Rechercher des agents…"
    commands:
      - tapOn: "Search agents...|Rechercher des agents…"
      - inputText: "training"
      - eraseText
