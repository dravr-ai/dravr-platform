# ABOUTME: Visual tests for chat tab
# ABOUTME: Converted from mobile-visual.test.js "Chat Tab" tests

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Test: chat - tab icon visible and tappable
- assertVisible:
    id: "tab-chat"
- tapOn:
    id: "tab-chat"

# Test: chat - displays chat screen
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 5000

# Test: chat - message input accepts text
- runFlow:
    when:
      visible:
        id: "message-input"
    commands:
      - tapOn:
          id: "message-input"
      - inputText: "Test message"
      - eraseText
