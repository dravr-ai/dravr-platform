# ABOUTME: Visual tests for the chat tab: the conversation list it lands on and the thread opened from it
# ABOUTME: Converted from mobile-visual.test.js "Chat Tab" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Test: chat - tab icon visible and tappable
- assertVisible:
    id: "tab-chat"
- tapOn:
    id: "tab-chat"

# Test: chat - the tab shows the conversation list with its "+"
- extendedWaitUntil:
    visible:
      id: "conversations-screen"
    timeout: 5000
# The one "+" lives in the tab bar, not the header.
- assertNotVisible:
    id: "chat-plus-button"

# Test: chat - a new thread carries the composer
- runFlow:
    file: ../helpers/new-chat.yaml
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 5000

# Test: chat - message input accepts text
- tapOn:
    id: "message-input"
- inputText: "Test message"
- eraseText
