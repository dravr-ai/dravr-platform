# ABOUTME: Visual tests for the Settings tab — the tab opens, the profile section shows, the Connections pane opens and is captured
# ABOUTME: Ids only past the tab tap: the Settings root, its profile section, the pane row, the Connections root

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Test: settings - tab icon visible and tappable
- runFlow:
    when:
      visible:
        text: "Réglages|Settings"
    commands:
      - tapOn:
          text: "Réglages|Settings"

# If no tab, navigate via bottom tab bar "Settings"
- runFlow:
    when:
      notVisible:
        text: "Réglages|Settings"
    commands:
      - tapOn: "Settings"

# Test: settings - displays screen
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000

# Test: settings - displays profile section (use testID for reliable matching)
- extendedWaitUntil:
    visible:
      id: "settings-profile-section"
    timeout: 10000

- takeScreenshot: settings-tab

# Test: settings - the Connections pane opens from its row
- tapOn:
    id: "settings-pane-connections"

- extendedWaitUntil:
    visible:
      id: "connections-screen"
    timeout: 5000

- takeScreenshot: settings-connections

# Back to Settings
- runFlow:
    file: ../helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
