# ABOUTME: Visual tests for social settings accessibility
# ABOUTME: Social settings is not yet navigable from main settings screen

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings tab
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# Test: settings displays Privacy section
- scrollUntilVisible:
    element:
      text: "Privacy"
    direction: DOWN
    timeout: 10000
- assertVisible: "Privacy"

# Test: settings displays About section
- scrollUntilVisible:
    element:
      text: "About"
    direction: DOWN
    timeout: 10000
- assertVisible: "About"
