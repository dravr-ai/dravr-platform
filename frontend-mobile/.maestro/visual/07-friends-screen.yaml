# ABOUTME: Visual tests for friends screen
# ABOUTME: Converted from mobile-visual.test.js "Friends Screen" tests

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Social Feed via Insights tab
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 15000

# Verify social feed displays
- assertVisible: "Feed"

# The seeded test user may have friends and feed items. Test what is actually
# visible rather than assuming empty state.
- runFlow:
    when:
      visible: "Find Friends"
    commands:
      - tapOn: "Find Friends"
      - extendedWaitUntil:
          visible:
            id: "friends-screen"
          timeout: 10000
      - assertVisible: "Friends"

- runFlow:
    when:
      notVisible: "Find Friends"
    commands:
      # Feed has items — verify feed screen works
      - assertVisible:
          id: "social-feed-screen"
