# ABOUTME: Visual tests for authentication screens
# ABOUTME: Converted from mobile-visual.test.js "Authentication" tests

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# Test: login - displays email input
- assertVisible:
    id: "email-input"

# Test: login - displays password input
- assertVisible:
    id: "password-input"

# The submit control sits below the fold on a short screen (CI's emulator is
# shorter than a Pixel 6), so reach it by scrolling rather than assuming it is
# already on screen — 2026-09-06.
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "login-button"

# Scrolling to the button left the viewport at the bottom of the form, which put
# the fields the rest of this flow drives off the top. Scroll back before going on.
- scrollUntilVisible:
    element:
      id: "email-input"
    direction: UP
    timeout: 20000

# Test: login - password is masked
- tapOn:
    id: "password-input"
- inputText: "TestPassword"
- assertVisible:
    id: "password-input"
- eraseText

# Test: login - shows error for invalid credentials
- tapOn:
    id: "email-input"
- eraseText
- inputText: "wrong@email.com"
- tapOn:
    id: "password-input"
- eraseText
- inputText: "wrongpassword"
# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,20%"
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# Wait for error or stay on login screen
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 5000
