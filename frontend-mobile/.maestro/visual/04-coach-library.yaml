# ABOUTME: Visual tests for the coach library, reached from Discover since the Coaches tab folded into it
# ABOUTME: Converted from mobile-visual.test.js "Coaches Tab" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Test: there is no Coaches tab; the library is a section of Discover
- assertNotVisible:
    id: "tab-coaches"
- tapOn:
    id: "tab-discover"
- extendedWaitUntil:
    visible:
      id: "installed-coaches-strip"
    timeout: 15000

# Test: Manage opens the full library
- tapOn:
    id: "manage-coaches-button"
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 15000

# Test: library - search input works
- tapOn:
    id: "coach-search-input"
- inputText: "training"
- eraseText

# Test: library - category filters visible
- assertVisible: "All"
- assertVisible: "Training"
