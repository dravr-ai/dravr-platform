# ABOUTME: Visual tests for social feed
# ABOUTME: Converted from mobile-visual.test.js "Social Feed" tests

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Feed via Insights tab
- tapOn:
    id: "tab-insights"

# Test: feed - displays screen
- extendedWaitUntil:
    visible:
      id: "social-feed-screen"
    timeout: 15000

# Verify the header
- assertVisible: "Feed"

# Test: feed - displays feed list or empty state
- runFlow:
    when:
      visible:
        id: "feed-list"
    commands:
      - assertVisible:
          id: "feed-list"

- runFlow:
    when:
      visible: "No Insights Yet"
    commands:
      - assertVisible: "No Insights Yet"

# Test: feed - share button visible (inside suggestions banner, may not appear)
- runFlow:
    when:
      visible:
        id: "share-suggestion-button"
    commands:
      - assertVisible:
          id: "share-suggestion-button"
