# ABOUTME: Visual test for the Connections pane — opens it from Settings, waits for the first provider row, captures it
# ABOUTME: Ids only: the pane row on Settings, the Connections root, the Strava-branded sciotte row the seeded stack always lists

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# Test: connections - opens from settings
- tapOn:
    id: "settings-pane-connections"

- extendedWaitUntil:
    visible:
      id: "connections-screen"
    timeout: 5000

# Test: connections - lists the first provider as a row
- assertVisible:
    id: "provider-row-sciotte"

- takeScreenshot: connections-pane
