# ABOUTME: The tab bar carries no Insights, Coaches or Groups tab — Home, Chat, Discover, Settings only
# ABOUTME: Relocated from visual/06-no-insights-tab.yaml (Boreal v2.2 Phase 6); a regression guard for retired tabs, not a render check, so it does not fold into visual/00-capture.yaml

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# The athlete lands on Home; the bar offers exactly the surviving tabs.
- extendedWaitUntil:
    visible:
      text: "Discussion|Chat"
    timeout: 15000
- assertVisible:
    text: "Accueil|Home"
- assertVisible:
    text: "Découvrir|Discover"
- assertVisible:
    text: "Réglages|Settings"

# Test: no Insights tab, no feed, no Coaches tab. Unconditional — the retired
# flows reached the feed behind `when: visible` guards, which is how a deleted
# tab could keep passing.
- assertNotVisible:
    id: "tab-insights"
- assertNotVisible:
    id: "tab-coaches"
# Group management lives in the group's own chat header now; the tab is gone.
- assertNotVisible:
    id: "tab-groups"
- assertNotVisible:
    id: "social-feed-screen"
- assertNotVisible: "Insights"
- assertNotVisible: "Find Friends"
