# ABOUTME: Test the chat landing after login: the conversation list, then a thread opened from its "+"
# ABOUTME: Converted from chat.test.js basic visibility tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Test: the app lands on the conversation list, with its "+" in the header
- assertVisible:
    id: "conversations-screen"
- assertVisible:
    id: "conversations-title"
- assertVisible:
    id: "chat-plus-button"

# Test: a new chat opens a thread over the list
- runFlow:
    file: ../helpers/new-chat.yaml
- assertVisible:
    id: "chat-screen"

# Test: should show header elements with proper visibility (safe area handling)
- assertVisible:
    id: "back-button"
- assertVisible:
    id: "chat-title"
- assertVisible:
    id: "notification-bell"

# The thread's header carries no "+". Starting something belongs to the tab
# bar's, which is the app's one entry point for it and the one a thumb reaches.
- assertNotVisible:
    id: "chat-plus-button"

# Test: should show message input area
- assertVisible:
    id: "message-input"
