# ABOUTME: Test going back from a thread to the conversation list it was opened from
# ABOUTME: Converted from chat.test.js "should open navigation drawer" — the list is the chat tab's index

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# The list is the chat tab's index; the app lands on Home
- runFlow:
    file: ../helpers/navigate-to-chat.yaml
- assertVisible:
    id: "conversations-screen"

# Open a thread over it
- runFlow:
    file: ../helpers/new-chat.yaml

# Test: the thread's back button returns to the conversation list
- runFlow:
    file: ../helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "conversations-screen"
    timeout: 5000
- assertVisible: "Chats|Discussions"
