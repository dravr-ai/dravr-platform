# ABOUTME: Test sending message and verifying it appears in chat
# ABOUTME: Converted from chat.test.js "should send message and receive response"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Start fresh conversation
- runFlow:
    file: ../helpers/new-chat.yaml

# Type and send a message
- tapOn:
    id: "message-input"
- inputText: "What is my fitness level?"
- tapOn:
    id: "send-button"

# Verify the sent message appears in the chat.
# CI has no LLM configured, so we verify the message was sent (not the response).
- extendedWaitUntil:
    visible: "What is my fitness level?"
    timeout: 10000
