# ABOUTME: Test sending message and verifying it appears in chat
# ABOUTME: Converted from chat.test.js "should send message and receive response"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Start fresh conversation
- runFlow:
    file: ../helpers/new-chat.yaml

# Wait for message input to be ready
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 10000

# Tap the input to focus it
- tapOn:
    id: "message-input"

# Type a message using eraseText+inputText pattern.
# eraseText first ensures the field is in a clean state for inputText.
- eraseText: 10
- inputText: "Hello Pierre"

# Wait a moment for React state to sync
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Tap send button.
# If the button is disabled (React state didn't sync), the tap is a no-op
# and the test will time out at the next step.
- tapOn:
    id: "send-button"

# Verify the sent message appears in the chat list.
# The message should appear as a user message bubble.
# CI has no LLM configured, so we verify the message was sent (not the response).
# Use 15s timeout - if send worked, message appears immediately in the list.
- extendedWaitUntil:
    visible: "Hello Pierre"
    timeout: 15000
