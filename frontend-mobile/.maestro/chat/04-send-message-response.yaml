# ABOUTME: Test sending message and verifying it appears in chat
# ABOUTME: Converted from chat.test.js "should send message and receive response"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Start fresh conversation
- runFlow:
    file: ../helpers/new-chat.yaml

# Wait for message input to be ready
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 10000

# Tap the input to focus it
- tapOn:
    id: "message-input"

# Type a message. inputText triggers onChangeText on RN controlled inputs,
# enabling the send button via canSend check.
- inputText: "Hello Pierre"

# Wait for send button to become enabled (testID switches from
# send-button-disabled to send-button once React state updates).
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Dismiss keyboard before tapping send. On iOS, the first tap outside
# the TextInput dismisses the keyboard instead of triggering onPress.
# The inputText state persists after keyboard dismissal.
- tapOn:
    point: "50%,15%"

# Re-verify send button is still enabled after keyboard dismissal
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Tap send button (keyboard is now dismissed, tap will trigger onPress)
- tapOn:
    id: "send-button"

# Wait for the FlashList to mount. The MessageList component transitions
# from a ScrollView (empty state) to a FlashList when messages are added.
# This testID only appears on the FlashList wrapper, confirming the
# component has rendered the message list.
- extendedWaitUntil:
    visible:
      id: "messages-list"
    timeout: 15000

# Dismiss keyboard so the message list is fully visible.
# On iOS, the keyboard stays up after send, hiding the chat messages.
- tapOn:
    point: "50%,15%"

# Verify the sent message appears in the chat list.
# Use extendedWaitUntil (not scrollUntilVisible) because the FlashList
# auto-scrolls to the bottom via onContentSizeChange.
- extendedWaitUntil:
    visible: "Hello Pierre"
    timeout: 30000
