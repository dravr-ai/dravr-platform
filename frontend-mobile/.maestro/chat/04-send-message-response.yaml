# ABOUTME: Test sending message and verifying it appears in chat
# ABOUTME: Converted from chat.test.js "should send message and receive response"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Start fresh conversation
- runFlow:
    file: ../helpers/new-chat.yaml

# Wait for message input to be ready
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 10000

# Type a message
- tapOn:
    id: "message-input"
- inputText: "xcheck42"

# Verify text was entered into the input
- extendedWaitUntil:
    visible: "xcheck42"
    timeout: 5000

# Dismiss keyboard so send button is fully tappable on all screen sizes
- tapOn:
    point: "50%,20%"

- tapOn:
    id: "send-button"

# Verify the sent message appears in the chat.
# CI has no LLM configured, so we verify the message was sent (not the response).
- extendedWaitUntil:
    visible: "xcheck42"
    timeout: 30000
