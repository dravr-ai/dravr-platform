# ABOUTME: Test creating new chat from the tab bar quick action
# ABOUTME: Converted from chat.test.js "should create new chat when + button is pressed"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Wait for message input to be ready
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 10000

# Send a message first to create a conversation
- tapOn:
    id: "message-input"
- inputText: "Test message"

# Wait for send button to become enabled (testID switches from
# send-button-disabled to send-button once React state updates).
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Dismiss keyboard before tapping send. On iOS, the first tap outside
# the TextInput dismisses the keyboard instead of triggering onPress.
# The inputText state persists after keyboard dismissal.
- tapOn:
    point: "50%,15%"

# Re-verify send button is still enabled after keyboard dismissal
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Tap send button (keyboard is now dismissed, tap will trigger onPress)
- tapOn:
    id: "send-button"

# Wait for the FlashList to mount (transition from empty ScrollView).
- extendedWaitUntil:
    visible:
      id: "messages-list"
    timeout: 15000

# Dismiss keyboard so the message list is fully visible.
- tapOn:
    point: "50%,15%"

# Wait for sent message to appear. The FlashList auto-scrolls via
# onContentSizeChange so the message should be visible without scrolling.
- extendedWaitUntil:
    visible: "Test message"
    timeout: 30000

# Now create new chat via the floating tab bar
- runFlow:
    file: ../helpers/new-chat.yaml

# Should show New Chat title
- assertVisible:
    id: "chat-title"
