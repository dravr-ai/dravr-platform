# ABOUTME: Test creating new chat from the tab bar quick action
# ABOUTME: Converted from chat.test.js "should create new chat when + button is pressed"

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Send a message first to create a conversation
- tapOn:
    id: "message-input"
- inputText: "Test message"
- tapOn:
    id: "send-button"

# Verify the sent message appears in the chat.
# CI has no LLM configured, so we verify the message was sent (not the response).
- extendedWaitUntil:
    visible: "Test message"
    timeout: 10000

# Now create new chat via the floating tab bar
- runFlow:
    file: ../helpers/new-chat.yaml

# Should show New Chat title
- assertVisible:
    id: "chat-title"
