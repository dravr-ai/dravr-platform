# ABOUTME: The unified conversation list — one flat row per thread, search, and the "+" empty state
# ABOUTME: Replaces the grouped list retired in b460057d3 — no per-persona headers, no bucket, one row each

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# The chat tab lands on the list itself
- extendedWaitUntil:
    visible:
      id: "conversations-screen"
    timeout: 15000
- assertVisible:
    id: "conversations-title"
# Starting something belongs to the tab bar's "+", never the header's.
- assertNotVisible:
    id: "chat-plus-button"
- assertVisible:
    id: "conversations-list"

# The grouping is gone. Both strings below are the literals the deleted code
# rendered — the bucket label hardcoded in the grouped ConversationsScreen, and
# the picker heading hardcoded in MessageList — so they are the only spellings a
# revert or a copy-paste of that code could put back on screen. Written in the
# new vocabulary they would name text no build has ever produced, and "Your
# agents" is now the live title of the /agent list card, which a row preview can
# legitimately carry.
- assertNotVisible: "Without a coach"
- assertNotVisible: "Your Coaches"

# The search field is pinned above the list and filters the rows.
- assertVisible:
    id: "conversation-search-input"
- tapOn:
    id: "conversation-search-input"
- inputText: "zzz-no-such-conversation"
- extendedWaitUntil:
    visible:
      id: "conversations-empty"
    timeout: 5000

# Clearing the search brings the list back.
- eraseText
- hideKeyboard
- assertVisible:
    id: "conversations-list"
