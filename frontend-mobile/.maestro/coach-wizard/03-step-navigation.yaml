# ABOUTME: Test coach editor scrollable sections
# ABOUTME: Verifies system prompt section is expanded and tags section is accessible

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# System prompt section should be expanded by default
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "system-prompt-input"

# Tags section should be visible (collapsed by default)
- scrollUntilVisible:
    element:
      id: "tags-section"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "tags-section"

# Expand the tags section
- tapOn:
    id: "tags-section-toggle"

# Tag input should now be visible
- extendedWaitUntil:
    visible:
      id: "tag-input"
    timeout: 3000

- back
