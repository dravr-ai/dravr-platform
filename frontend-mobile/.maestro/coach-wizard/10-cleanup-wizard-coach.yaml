# ABOUTME: Cleanup - delete the coach created in the editor flow test
# ABOUTME: Navigates to coach detail screen and uses the delete button

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to user-created coaches only. This reduces FlashList items
# so the target coach renders faster in FlashList v2.
- tapOn:
    id: "source-filter-user"

# Use scrollUntilVisible to find the coach in the FlashList.
- scrollUntilVisible:
    element:
      text: "E2E Editor Coach"
    direction: DOWN
    timeout: 30000

# Tap to navigate to the detail screen. This is more reliable than
# long-press on FlashList items which can fail due to cell recycling.
- tapOn: "E2E Editor Coach"

# Wait for the detail screen to load
- extendedWaitUntil:
    visible:
      id: "coach-detail-screen"
    timeout: 15000

# Scroll to ensure the delete button is visible. On smaller screens
# or iOS, the button may be below the fold of the detail screen.
- scrollUntilVisible:
    element:
      id: "delete-button"
    direction: DOWN
    timeout: 10000

# Tap the delete button on the detail screen
- tapOn:
    id: "delete-button"

# Confirm deletion in the alert dialog.
# Native iOS Alerts can take time to animate in, especially on simulator.
- extendedWaitUntil:
    visible: "Delete"
    timeout: 15000
- tapOn: "Delete"

# Wait to return to library after deletion
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 15000

# Verify coach is deleted
- extendedWaitUntil:
    notVisible: "E2E Editor Coach"
    timeout: 10000

# Reset filter
- tapOn:
    id: "source-filter-all"
