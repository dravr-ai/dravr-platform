# ABOUTME: Cleanup - delete the coach created in the editor flow test
# ABOUTME: Uses long-press action menu to delete the test coach

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Wait for initial load to complete, then pull-to-refresh to ensure data is fresh.
# The refresh path keeps FlashList mounted (unlike initial load which swaps to ActivityIndicator).
- swipe:
    start: "50%,30%"
    end: "50%,70%"
    duration: 500

# Find the test coach (scroll down if needed)
- scrollUntilVisible:
    element:
      text: "E2E Editor Coach"
    direction: DOWN
    timeout: 20000

- longPressOn: "E2E Editor Coach"

- extendedWaitUntil:
    visible:
      text: "Delete"
    timeout: 3000

- tapOn: "Delete"

# Confirm deletion
- extendedWaitUntil:
    visible:
      text: "Delete"
    timeout: 3000
- tapOn: "Delete"

# Verify coach is deleted
- extendedWaitUntil:
    notVisible:
      text: "E2E Editor Coach"
    timeout: 5000
