# ABOUTME: Cleanup - delete the coach created in the editor flow test
# ABOUTME: Uses long-press action menu to delete the test coach

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to user-created coaches only. This reduces FlashList items
# so the target coach renders faster in FlashList v2.
- tapOn:
    id: "source-filter-user"

# Use scrollUntilVisible to find the coach in the FlashList.
# scrollUntilVisible actively scrolls, triggering FlashList v2 cell rendering.
- scrollUntilVisible:
    element:
      text: "E2E Editor Coach"
    direction: DOWN
    timeout: 30000

# Ensure the coach card is fully rendered before long-pressing.
# On iOS, FlashList cells may not be interactable immediately after scrolling.
- extendedWaitUntil:
    visible: "E2E Editor Coach"
    timeout: 5000

- longPressOn: "E2E Editor Coach"

- extendedWaitUntil:
    visible: "Delete"
    timeout: 10000

- tapOn: "Delete"

# Confirm deletion in the alert dialog
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"

# Verify coach is deleted
- extendedWaitUntil:
    notVisible: "E2E Editor Coach"
    timeout: 10000

# Reset filter
- tapOn:
    id: "source-filter-all"
