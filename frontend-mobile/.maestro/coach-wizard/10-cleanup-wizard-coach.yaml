# ABOUTME: Cleanup - delete the coach created in the editor flow test
# ABOUTME: Uses long-press action menu to delete the test coach

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Wait for the coach to appear after initial load (useFocusEffect fetches fresh data).
# The new coach sorts to the top (newest updated_at), so it's in the viewport.
# 30s timeout covers API latency + FlashList rendering.
- extendedWaitUntil:
    visible:
      text: "E2E Editor Coach"
    timeout: 30000

- longPressOn: "E2E Editor Coach"

- extendedWaitUntil:
    visible:
      text: "Delete"
    timeout: 3000

- tapOn: "Delete"

# Confirm deletion
- extendedWaitUntil:
    visible:
      text: "Delete"
    timeout: 3000
- tapOn: "Delete"

# Verify coach is deleted
- extendedWaitUntil:
    notVisible:
      text: "E2E Editor Coach"
    timeout: 5000
