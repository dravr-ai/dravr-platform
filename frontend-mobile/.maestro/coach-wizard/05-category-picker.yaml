# ABOUTME: Test category picker functionality in coach editor
# ABOUTME: Verifies selecting a category from the modal picker

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Category picker should be visible (shows default "Custom")
- assertVisible:
    id: "category-picker"

# Tap category picker to show modal
- tapOn:
    id: "category-picker"

# Wait for the modal to appear with category options
- extendedWaitUntil:
    visible:
      text: "Select Category"
    timeout: 5000

# Select Training category via testID
- tapOn:
    id: "category-option-training"

# Verify category is selected (modal dismissed, selected-category shows Training)
- extendedWaitUntil:
    visible:
      id: "selected-category"
    timeout: 3000

- back
