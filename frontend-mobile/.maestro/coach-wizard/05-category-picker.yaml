# ABOUTME: Test category picker functionality in coach editor
# ABOUTME: Verifies selecting a category from the action sheet

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Category picker should be visible (shows default "Custom")
- assertVisible:
    id: "category-picker"

# Tap category picker to show action sheet
- tapOn:
    id: "category-picker"

# Wait for the action sheet to fully animate in
- extendedWaitUntil:
    visible:
      text: "Training"
    timeout: 5000

# Select Training category
- tapOn: "Training"

# Verify category is selected (allow time for action sheet dismiss animation)
- extendedWaitUntil:
    visible:
      id: "selected-category"
    timeout: 3000

- back
