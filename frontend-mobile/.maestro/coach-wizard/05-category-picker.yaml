# ABOUTME: Test category picker functionality in coach editor
# ABOUTME: Verifies selecting a category from the modal picker

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to category picker (may be below fold on smaller screens)
- scrollUntilVisible:
    element:
      id: "category-picker"
    direction: DOWN
    timeout: 10000

# Wait for category-picker to be fully rendered and interactable.
# On iOS, scrollUntilVisible can stop with the element partially off-screen,
# and the view needs time to settle before touch events register.
- extendedWaitUntil:
    visible:
      id: "category-picker"
    timeout: 5000

# Tap category picker to show modal
- tapOn:
    id: "category-picker"

# Wait for the modal to appear with category options.
# Modal animation can take time on iOS — generous timeout.
- extendedWaitUntil:
    visible: "Select Category"
    timeout: 15000

# Select Training category via testID
- tapOn:
    id: "category-option-training"

# Verify category is selected (modal dismissed, selected-category shows Training)
- extendedWaitUntil:
    visible:
      id: "selected-category"
    timeout: 5000

- back
