# ABOUTME: Test category picker functionality in coach editor
# ABOUTME: Verifies selecting a category from the action sheet

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Category picker should be visible
- assertVisible:
    id: "category-picker"

# Tap category picker
- tapOn:
    id: "category-picker"

# Should show action sheet with category options
- extendedWaitUntil:
    visible:
      text: "Training"
    timeout: 3000

# Select Training category
- tapOn: "Training"

# Verify category is selected
- assertVisible:
    id: "selected-category"

- back
