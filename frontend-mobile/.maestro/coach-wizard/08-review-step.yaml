# ABOUTME: Test token counter visibility in coach editor
# ABOUTME: Verifies the token counter appears when system prompt has content

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to system prompt input
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000

# Type some content to show token count
- tapOn:
    id: "system-prompt-input"
- inputText: "You are a helpful running coach specialized in marathon training."

# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,20%"

# Token counter should be visible
- scrollUntilVisible:
    element:
      id: "token-counter"
    direction: DOWN
    timeout: 3000
- assertVisible:
    id: "token-counter"
- assertVisible:
    id: "token-count-text"

- back
