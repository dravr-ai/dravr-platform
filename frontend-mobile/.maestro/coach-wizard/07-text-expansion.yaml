# ABOUTME: Test text expansion modal for system prompt
# ABOUTME: Verifies the expand button opens a fullscreen editing modal

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Scroll to system prompt section (expanded by default)
- scrollUntilVisible:
    element:
      id: "expand-prompt-button"
    direction: DOWN
    timeout: 5000

# Test: should open full-screen modal for system prompt
- tapOn:
    id: "expand-prompt-button"

# Modal should be visible
- extendedWaitUntil:
    visible:
      id: "expanded-modal"
    timeout: 3000

- assertVisible:
    id: "modal-text-input"

# Type in modal
- tapOn:
    id: "modal-text-input"
- inputText: "Testing expanded view"

# Close modal
- tapOn:
    id: "modal-done-button"

# Should be back on the editor
- assertVisible:
    id: "coach-editor-screen"

- back
