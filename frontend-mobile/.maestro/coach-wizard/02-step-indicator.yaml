# ABOUTME: Test coach editor layout shows form elements
# ABOUTME: Verifies title input, category picker, and description are visible

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"

- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Check that form elements are visible
- assertVisible:
    id: "coach-title-input"
- assertVisible:
    id: "category-picker"
- assertVisible:
    id: "coach-description-input"

# Check save button in header (testID is save-button-disabled with empty fields)
- assertVisible:
    id: "save-button-disabled"

- back
