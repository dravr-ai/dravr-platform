# ABOUTME: Test coach editor navigation from coach library
# ABOUTME: Taps create button and verifies the editor screen opens

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Test: should open editor when create button is tapped
- tapOn:
    id: "create-coach-button"

- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

- assertVisible: "Create Coach"

# Go back
- back
