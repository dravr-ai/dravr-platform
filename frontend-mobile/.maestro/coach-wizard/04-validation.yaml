# ABOUTME: Test coach editor validation errors
# ABOUTME: Verifies title and system prompt validation on save attempt

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Test: should show error when title is empty and Save is tapped
- tapOn:
    id: "save-button"

# Should show title error
- assertVisible:
    id: "title-error"
- assertVisible: "Title is required"

# Fix the title
- tapOn:
    id: "coach-title-input"
- inputText: "Validation Test"

# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,5%"

# Tap save again — system prompt error should appear
- tapOn:
    id: "save-button"

# Should show system prompt error
- scrollUntilVisible:
    element:
      id: "prompt-error"
    direction: DOWN
    timeout: 3000
- assertVisible:
    id: "prompt-error"
- assertVisible: "System prompt is required"

- back
