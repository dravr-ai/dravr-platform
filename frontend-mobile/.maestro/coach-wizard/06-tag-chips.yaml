# ABOUTME: Test tag chips add/remove functionality in coach editor
# ABOUTME: Verifies adding and removing tags via the collapsible tags section

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to tags section (collapsed by default)
- scrollUntilVisible:
    element:
      id: "tags-section"
    direction: DOWN
    timeout: 10000

# Expand the tags section
- tapOn:
    id: "tags-section-toggle"

- extendedWaitUntil:
    visible:
      id: "tag-input"
    timeout: 5000

# Test: should add tag when input is submitted
- tapOn:
    id: "tag-input"
- inputText: "intervals"

# Scroll to add-tag-button. keyboardShouldPersistTaps="handled" on the
# ScrollView allows tapping buttons without dismissing the keyboard first.
# Dismissing keyboard by tapping 50%,15% risks hitting tags-section-toggle
# when KeyboardAvoidingView compresses the layout, which collapses the
# section and unmounts add-tag-button.
- scrollUntilVisible:
    element:
      id: "add-tag-button"
    direction: DOWN
    timeout: 5000

# Tap the add button to create the tag
- tapOn:
    id: "add-tag-button"

# Fallback: if tag wasn't created (first tap may dismiss keyboard instead
# of triggering onPress), re-scroll and tap again.
- runFlow:
    when:
      notVisible:
        id: "tag-chip-intervals"
    commands:
      - scrollUntilVisible:
          element:
            id: "add-tag-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "add-tag-button"

# Tag should appear as a chip
- extendedWaitUntil:
    visible:
      id: "tag-chip-intervals"
    timeout: 5000

# Test: should remove tag when X is tapped
- scrollUntilVisible:
    element:
      id: "remove-tag-intervals"
    direction: DOWN
    timeout: 5000

- tapOn:
    id: "remove-tag-intervals"

# Tag should be gone
- extendedWaitUntil:
    notVisible:
      id: "tag-chip-intervals"
    timeout: 5000

- back
