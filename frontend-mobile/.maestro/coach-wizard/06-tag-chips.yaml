# ABOUTME: Test tag chips add/remove functionality in coach editor
# ABOUTME: Verifies adding and removing tags via the collapsible tags section

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to tags section (collapsed by default)
- scrollUntilVisible:
    element:
      id: "tags-section"
    direction: DOWN
    timeout: 10000

# Expand the tags section
- tapOn:
    id: "tags-section-toggle"

- extendedWaitUntil:
    visible:
      id: "tag-input"
    timeout: 5000

# Test: should add tag when input is submitted
- tapOn:
    id: "tag-input"
- inputText: "intervals"

# Tap the add-tag-button directly (visible next to tag-input in same row).
# pressKey Enter does not reliably trigger onSubmitEditing on iOS in Expo Go.
# ScrollView has keyboardShouldPersistTaps="handled" so tapping add-tag-button
# works while keyboard is still open.
- tapOn:
    id: "add-tag-button"

# Tag should appear as a chip
- extendedWaitUntil:
    visible:
      id: "tag-chip-intervals"
    timeout: 5000

# Test: should remove tag when X is tapped
- tapOn:
    id: "remove-tag-intervals"

# Tag should be gone
- extendedWaitUntil:
    notVisible:
      id: "tag-chip-intervals"
    timeout: 5000

- back
