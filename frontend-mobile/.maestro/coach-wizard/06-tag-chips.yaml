# ABOUTME: Test tag chips add/remove functionality in coach editor
# ABOUTME: Verifies adding and removing tags via the collapsible tags section

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to tags section (collapsed by default)
- scrollUntilVisible:
    element:
      id: "tags-section"
    direction: DOWN
    timeout: 10000

# Expand the tags section
- tapOn:
    id: "tags-section-toggle"

- extendedWaitUntil:
    visible:
      id: "tag-input"
    timeout: 5000

# Test: should add tag when input is submitted
- tapOn:
    id: "tag-input"
- inputText: "intervals"

# Dismiss keyboard so add-tag-button is visible and not behind the keyboard.
# On iOS, KeyboardAvoidingView can push the content up and the button may
# end up behind the keyboard or scrolled out of view.
- tapOn:
    point: "50%,15%"

# Scroll to ensure the add-tag-button is visible after keyboard dismiss
- scrollUntilVisible:
    element:
      id: "add-tag-button"
    direction: DOWN
    timeout: 5000

# Tap the add-tag-button to submit the tag
- tapOn:
    id: "add-tag-button"

# Tag should appear as a chip
- extendedWaitUntil:
    visible:
      id: "tag-chip-intervals"
    timeout: 5000

# Test: should remove tag when X is tapped
- tapOn:
    id: "remove-tag-intervals"

# Tag should be gone
- extendedWaitUntil:
    notVisible:
      id: "tag-chip-intervals"
    timeout: 5000

- back
