# ABOUTME: Test tag chips add/remove functionality in coach editor
# ABOUTME: Verifies adding and removing tags via the collapsible tags section

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Scroll to tags section (collapsed by default)
- scrollUntilVisible:
    element:
      id: "tags-section"
    direction: DOWN
    timeout: 10000

# Expand the tags section
- tapOn:
    id: "tags-section-toggle"

- extendedWaitUntil:
    visible:
      id: "tag-input"
    timeout: 5000

# Test: should add tag when input is submitted
- tapOn:
    id: "tag-input"
- inputText: "intervals"

# Submit the tag via the keyboard return key (onSubmitEditing calls addTag).
# This avoids keyboard dismiss + scroll issues with the add-tag-button on iOS.
- pressKey: "Enter"

# Tag should appear as a chip
- extendedWaitUntil:
    visible:
      id: "tag-chip-intervals"
    timeout: 5000

# Dismiss keyboard before testing remove (keyboard may cover tag chips)
- tapOn:
    point: "50%,15%"

# Test: should remove tag when X is tapped
- scrollUntilVisible:
    element:
      id: "remove-tag-intervals"
    direction: DOWN
    timeout: 5000

- tapOn:
    id: "remove-tag-intervals"

# Tag should be gone
- extendedWaitUntil:
    notVisible:
      id: "tag-chip-intervals"
    timeout: 5000

- back
