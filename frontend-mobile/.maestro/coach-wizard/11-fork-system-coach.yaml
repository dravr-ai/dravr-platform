# ABOUTME: Test fork option for system coaches
# ABOUTME: Verifies that system coaches show a Fork option in the action menu

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to system coaches only
- tapOn:
    id: "source-filter-system"

# Wait for system coaches to appear
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 5000

# Enable showing hidden coaches (system coaches may be hidden by default)
- tapOn:
    id: "show-hidden-toggle"

# Long press on first visible system coach to show action menu
# Use the Marathon Coach which is a seeded system coach
- runFlow:
    when:
      visible: "Marathon Coach"
    commands:
      - longPressOn: "Marathon Coach"
      # Should see Fork option in action menu
      - extendedWaitUntil:
          visible:
            text: "Fork"
          timeout: 3000
      # Dismiss the menu by going back
      - back

# Reset filters
- tapOn:
    id: "show-hidden-toggle"
- tapOn:
    id: "source-filter-all"
