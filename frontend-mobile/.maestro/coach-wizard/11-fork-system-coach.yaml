# ABOUTME: Test fork option for system coaches
# ABOUTME: Verifies that system coaches show a Fork option in the action menu

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to system coaches only
- tapOn:
    id: "source-filter-system"

# Wait for system coaches to appear
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 5000

# Enable showing hidden coaches (system coaches may be hidden by default)
- extendedWaitUntil:
    visible:
      id: "show-hidden-toggle"
    timeout: 15000
- tapOn:
    id: "show-hidden-toggle"

# Wait for Marathon Coach to appear in the FlashList after toggling.
# FlashList v2 defers cell rendering, so the card may not be visible
# immediately after the toggle tap.
- scrollUntilVisible:
    element:
      text: "Marathon Coach"
    direction: DOWN
    timeout: 15000

# Long press on Marathon Coach to show action menu
- longPressOn: "Marathon Coach"

# Wait for action menu modal to animate in. On iOS CI, modal animations
# can be slow — generous timeout avoids flaky failures.
- extendedWaitUntil:
    visible: "Fork (create my copy)"
    timeout: 10000

# Fallback: if menu didn't appear, long press again. On iOS, the first
# long press may not register on a FlashList cell that was still settling.
- runFlow:
    when:
      notVisible: "Fork (create my copy)"
    commands:
      - longPressOn: "Marathon Coach"
      - extendedWaitUntil:
          visible: "Fork (create my copy)"
          timeout: 10000

# Dismiss the action menu
- back

# Reset filters
- tapOn:
    id: "show-hidden-toggle"
- tapOn:
    id: "source-filter-all"
