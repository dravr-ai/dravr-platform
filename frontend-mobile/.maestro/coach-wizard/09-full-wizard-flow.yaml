# ABOUTME: Test complete coach editor flow to create a coach
# ABOUTME: Fills required fields in the single-page editor and saves

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

# Fill title
- tapOn:
    id: "coach-title-input"
- inputText: "E2E Editor Coach"

# Dismiss keyboard by tapping the header area. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,15%"

# Scroll to system prompt (expanded by default)
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000

# Fill system prompt (required field)
- tapOn:
    id: "system-prompt-input"
- inputText: "You are an E2E test coach."

# Dismiss keyboard
- tapOn:
    point: "50%,15%"

# Wait for save button to become enabled (testID switches from
# save-button-disabled to save-button once title and systemPrompt
# React state updates propagate).
- extendedWaitUntil:
    visible:
      id: "save-button"
    timeout: 10000

# Scroll back up to make save button accessible
- scrollUntilVisible:
    element:
      id: "save-button"
    direction: UP
    timeout: 5000

# Save the coach
- tapOn:
    id: "save-button"

# Should return to library (long timeout for CI API latency)
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 30000

# Filter to user-created coaches only. This reduces FlashList items,
# making FlashList v2 render the target item faster (fewer cells to measure).
# The new coach is the only user-created coach in a clean test DB.
- tapOn:
    id: "source-filter-user"

# Use scrollUntilVisible to find the new coach in the FlashList.
# scrollUntilVisible actively scrolls the list, which triggers FlashList v2
# to render cells that extendedWaitUntil alone may miss due to deferred rendering.
- scrollUntilVisible:
    element:
      text: "E2E Editor Coach"
    direction: DOWN
    timeout: 30000

# Reset filter so subsequent tests see all coaches
- tapOn:
    id: "source-filter-all"
