# ABOUTME: Test complete coach editor flow to create a coach
# ABOUTME: Fills all fields in the single-page editor and saves

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Fill title
- tapOn:
    id: "coach-title-input"
- inputText: "E2E Editor Coach"

# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,5%"

# Select category
- tapOn:
    id: "category-picker"
- extendedWaitUntil:
    visible:
      text: "Training"
    timeout: 3000
- tapOn: "Training"

# Fill description
- tapOn:
    id: "coach-description-input"
- inputText: "Created via E2E test"

# Dismiss keyboard
- tapOn:
    point: "50%,5%"

# Scroll to system prompt (expanded by default)
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000

# Fill system prompt
- tapOn:
    id: "system-prompt-input"
- inputText: "You are an E2E test coach created by Maestro."

# Dismiss keyboard
- tapOn:
    point: "50%,5%"

# Save the coach (save button is in header, always visible)
- tapOn:
    id: "save-button"

# Should return to library (increase timeout for CI API latency)
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 30000

# Verify coach appears in list
- scrollUntilVisible:
    element:
      text: "E2E Editor Coach"
    direction: DOWN
    timeout: 5000
- assertVisible: "E2E Editor Coach"
