# ABOUTME: Test complete coach editor flow to create a coach
# ABOUTME: Fills required fields in the single-page editor and saves

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Open editor
- tapOn:
    id: "create-coach-button"
- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 5000

# Fill title
- tapOn:
    id: "coach-title-input"
- inputText: "E2E Editor Coach"

# Dismiss keyboard by tapping the header area. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,15%"

# Scroll to system prompt (expanded by default)
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000

# Fill system prompt (required field)
- tapOn:
    id: "system-prompt-input"
- inputText: "You are an E2E test coach."

# Dismiss keyboard
- tapOn:
    point: "50%,15%"

# Scroll back up to make save button accessible
- scrollUntilVisible:
    element:
      id: "save-button"
    direction: UP
    timeout: 5000

# Save the coach
- tapOn:
    id: "save-button"

# Should return to library (long timeout for CI API latency)
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 30000

# Screenshot after navigating back — diagnose what's on screen
- takeScreenshot: 09-after-save

# Force a tab focus cycle to ensure useFocusEffect triggers loadCoaches.
# In Expo Router, popping a stack screen should trigger focus, but cycling tabs
# guarantees a fresh focus event and data reload.
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 5000
- tapOn:
    id: "tab-coaches"
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 5000

# Wait for API to respond after focus-triggered loadCoaches
- swipe:
    start: "50%,50%"
    end: "50%,51%"
    duration: 5000

# Screenshot after tab cycle — should show coach list with data
- takeScreenshot: 09-after-tab-cycle

# Verify coach appears in list
- extendedWaitUntil:
    visible:
      text: "E2E Editor Coach"
    timeout: 20000
