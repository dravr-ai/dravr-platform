# ABOUTME: Test coach card long press action menu
# ABOUTME: Verifies action menu appears with expected options on long press

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to system coaches only to reduce the list and ensure
# Marathon Coach is visible. System coaches may be hidden by default.
- tapOn:
    id: "source-filter-system"

# Enable showing hidden coaches (system coaches may be hidden by default)
- extendedWaitUntil:
    visible:
      id: "show-hidden-toggle"
    timeout: 15000
- tapOn:
    id: "show-hidden-toggle"

# Scroll to find Marathon Coach (a seeded system coach)
- scrollUntilVisible:
    element:
      text: "Marathon Coach"
    direction: DOWN
    timeout: 15000

# Long press on the coach card
- longPressOn: "Marathon Coach"

# Should see action menu with Add to favorites option
- extendedWaitUntil:
    visible: "Add to favorites"
    timeout: 10000

# Close menu by tapping outside
- tapOn:
    id: "coach-library-screen"

# Reset filters
- tapOn:
    id: "show-hidden-toggle"
- tapOn:
    id: "source-filter-all"
