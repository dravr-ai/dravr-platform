# ABOUTME: Test coach card long press action menu
# ABOUTME: Verifies action menu appears with expected options on long press

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to user-created coaches for faster FlashList rendering
- tapOn:
    id: "source-filter-user"

# Scroll to find E2E Test Coach (created in test 06)
- scrollUntilVisible:
    element:
      text: "E2E Test Coach"
    direction: DOWN
    timeout: 30000

# Long press on the coach card
- longPressOn: "E2E Test Coach"

# Should see action menu with options
- extendedWaitUntil:
    visible:
      text: "Add to favorites"
    timeout: 3000

# Close menu by tapping outside
- tapOn:
    id: "coach-library-screen"

# Reset filter
- tapOn:
    id: "source-filter-all"
