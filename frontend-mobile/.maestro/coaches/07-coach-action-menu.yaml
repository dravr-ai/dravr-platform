# ABOUTME: Test coach card long press action menu
# ABOUTME: Verifies action menu appears with expected options on long press

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Test the action menu on a system coach visible at the top of the list.
# System coaches render immediately without FlashList scrolling, avoiding
# cell lifecycle issues that make long-press unreliable after scrollUntilVisible.
- extendedWaitUntil:
    visible: "Marathon Coach"
    timeout: 10000

# Long press on the coach card
- longPressOn: "Marathon Coach"

# Should see action menu with Add to favorites option
- extendedWaitUntil:
    visible: "Add to favorites"
    timeout: 10000

# Close menu by tapping outside
- tapOn:
    id: "coach-library-screen"
