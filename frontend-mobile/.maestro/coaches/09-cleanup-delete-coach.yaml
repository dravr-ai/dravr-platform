# ABOUTME: Cleanup - delete the test coach created in test 06
# ABOUTME: Uses long-press action menu to delete the test coach

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Filter to user-created coaches for faster FlashList rendering
- tapOn:
    id: "source-filter-user"

# Scroll to find the test coach. If it doesn't exist (test 06 failed), skip.
- scrollUntilVisible:
    element:
      text: "E2E Test Coach"
    direction: DOWN
    timeout: 30000

# Long press to show action menu
- longPressOn: "E2E Test Coach"

# Wait for Delete option in the action menu
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000

# Tap Delete
- tapOn: "Delete"

# Confirm deletion in dialog
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"

# Verify coach is deleted
- extendedWaitUntil:
    notVisible: "E2E Test Coach"
    timeout: 10000

# Reset filter
- tapOn:
    id: "source-filter-all"
