# ABOUTME: Test coach card interactions (create, tap to detail, verify)
# ABOUTME: Creates a test coach, verifies it in the library, taps to detail screen

appId: com.pierre.fitness

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to coach library
- runFlow:
    file: ../helpers/navigate-to-coaches.yaml

# Create a test coach
- tapOn:
    id: "create-coach-button"

- extendedWaitUntil:
    visible:
      id: "coach-editor-screen"
    timeout: 15000

- tapOn:
    id: "coach-title-input"
- inputText: "E2E Test Coach"

# Dismiss keyboard by tapping the header area
- tapOn:
    point: "50%,15%"

# Scroll to system prompt (expanded by default)
- scrollUntilVisible:
    element:
      id: "system-prompt-input"
    direction: DOWN
    timeout: 5000

- tapOn:
    id: "system-prompt-input"
- inputText: "You are a helpful test coach."

# Dismiss keyboard
- tapOn:
    point: "50%,15%"

# Wait for save button to become enabled (testID switches from
# save-button-disabled to save-button once title and systemPrompt
# React state updates propagate).
- extendedWaitUntil:
    visible:
      id: "save-button"
    timeout: 10000

# Scroll back up to save button
- scrollUntilVisible:
    element:
      id: "save-button"
    direction: UP
    timeout: 5000

- tapOn:
    id: "save-button"

# Wait for save API call to complete. Micro-swipe acts as a delay
# since Maestro has no native sleep command. 5s accounts for CI latency.
- swipe:
    start: "50%,50%"
    end: "50%,48%"
    duration: 5000

# router.replace('/(app)/(tabs)/(coaches)') is unreliable on iOS Expo Go.
# If it fired, we're on the library. If not, we're still on the editor.
# Tapping tab-coaches is a no-op when already inside the (coaches) group
# (ExpandableTabBar.handleTabPress skips navigation when activeIndex matches),
# so we use back-button to pop the editor from the stack instead.
- runFlow:
    when:
      visible:
        id: "coach-editor-screen"
    commands:
      - tapOn:
          id: "back-button"

# Wait for coach library screen
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 15000

# Filter to user-created coaches for faster FlashList rendering
- tapOn:
    id: "source-filter-user"

# Scroll to find the new coach in the FlashList
- scrollUntilVisible:
    element:
      text: "E2E Test Coach"
    direction: DOWN
    timeout: 30000

# Tap the coach to navigate to detail screen
- tapOn: "E2E Test Coach"

# Should see coach detail screen (generous timeout for navigation transition)
- extendedWaitUntil:
    visible:
      id: "coach-detail-screen"
    timeout: 15000

# Verify the edit button is available (user-created coach)
- assertVisible:
    id: "edit-button"

# Navigate back to library
- back

# Wait for library to reload
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 15000

# Reset filter
- tapOn:
    id: "source-filter-all"
