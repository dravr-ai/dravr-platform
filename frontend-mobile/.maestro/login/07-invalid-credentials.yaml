# ABOUTME: Wrong but well-formed credentials are rejected — the login screen stays up, the athlete is not let through
# ABOUTME: Also pins that the password field stays clear of the keyboard while it is typed into, on a short screen too (carnet#353)

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

- tapOn:
    id: "email-input"
- inputText: "wrong@email.com"
# Dismiss the keyboard by tapping the header, as login/06 does: hideKeyboard
# fails in Expo Go v55, and on a short screen the password field sits under
# the keyboard the email field raised, where no tap can reach it.
- tapOn:
    point: "50%,20%"
- tapOn:
    id: "password-input"
- inputText: "wrongpassword"
# The field being typed into is on screen, above the keyboard. Maestro reads
# visibility from the accessibility tree, which marks a view under the IME
# window as not visible, so this fails when the form does not avoid the
# keyboard — on a 1080x1600 screen the field sat entirely behind it before
# FormScrollView (carnet#353).
- assertVisible:
    id: "password-input"
# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,20%"
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# The rejection is a native alert, whose window hides the React Native tree on
# both platforms; its OK button is the system's own label, the same in every
# locale, and dismissing it is what makes the screen behind it readable again.
- extendedWaitUntil:
    visible: "OK"
    timeout: 45000
- tapOn: "OK"

# Wrong credentials do not let the athlete through: the login screen is still there.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 5000
