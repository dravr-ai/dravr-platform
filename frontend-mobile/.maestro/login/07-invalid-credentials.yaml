# ABOUTME: Wrong but well-formed credentials are refused on the hosted login page — the athlete is not let through
# ABOUTME: The page answers the wrong password itself; closing it returns to the app's login screen, still signed out

appId: ai.dravr.app

---
# A browser still signed in to the server would skip the page and sign in.
- runFlow:
    file: ../helpers/reset-browser-session.yaml

# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# The password is typed on the server's page, never into the app (carnet#787).
- runFlow:
    file: ../helpers/open-hosted-sign-in.yaml
- runFlow:
    file: ../helpers/submit-hosted-sign-in.yaml
    env:
      EMAIL: "wrong@email.com"
      PASSWORD: "wrongpassword"

# The refusal is the page's own (server HTML in the app's language, matched
# in all five locales): no code is issued, so nothing returns to the app.
- extendedWaitUntil:
    visible: "Sign-in failed|La connexion a échoué|No se pudo iniciar sesión|Anmeldung fehlgeschlagen|Não foi possível entrar"
    timeout: 45000
- assertVisible: "Back to sign in|Retour à la connexion|Volver al inicio de sesión|Zurück zur Anmeldung|Voltar ao início de sessão"

- runFlow:
    file: ../helpers/close-hosted-sign-in.yaml

# Wrong credentials do not let the athlete through: the login screen is still
# there, with nothing over it — a closed browser is not reported as an error.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertNotVisible:
    id: "home-screen"
