# ABOUTME: Wrong but well-formed credentials are rejected — the login screen stays up, the athlete is not let through
# ABOUTME: Relocated from visual/01-authentication.yaml (Boreal v2.2 Phase 6); the input/button-visibility checks it also carried are already pinned by 02/03, and its password-input-visible-after-typing check (broken by carnet#353 on a short screen) was dropped rather than moved

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

- tapOn:
    id: "email-input"
- inputText: "wrong@email.com"
- tapOn:
    id: "password-input"
- inputText: "wrongpassword"
# Dismiss keyboard. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,20%"
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# Wrong credentials do not let the athlete through: the login screen is still there.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 5000
