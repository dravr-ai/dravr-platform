# ABOUTME: Test validation error for empty email
# ABOUTME: Converted from login.test.js "should show validation error for empty email"

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# Clear any pre-filled values
- tapOn:
    id: "email-input"
- eraseText

# Dismiss keyboard so password input is visible on all screen sizes
- tapOn:
    point: "50%,20%"

- tapOn:
    id: "password-input"
- eraseText

# Dismiss keyboard so login button is visible. hideKeyboard fails in Expo Go v55.
- tapOn:
    point: "50%,20%"
# The submit control sits below the fold on a short screen (CI's emulator is
# shorter than a Pixel 6), so reach it by scrolling rather than assuming it is
# already on screen — 2026-09-06.
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# Verify validation error is shown
- assertVisible: "Email is required"
