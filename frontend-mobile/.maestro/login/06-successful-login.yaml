# ABOUTME: Test successful sign-in with valid credentials on the server's hosted login page
# ABOUTME: The app opens the page in the system browser, redeems the returned code, and lands on Home
# ABOUTME: NOTE: This test requires the Dravr backend server running with test user

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# Sign in on the server's hosted page in the system browser (carnet#787),
# with the credentials of the CI user seed. The app then redeems the code the
# page returns with. A Chrome Custom Tab already signed in to the server
# returns without showing the page, so the form is filled only when it is up.
- runFlow:
    file: ../helpers/open-hosted-sign-in.yaml
- runFlow:
    when:
      visible: "Password|Mot de passe|Contraseña|Passwort|Palavra-passe"
    file: ../helpers/submit-hosted-sign-in.yaml
    env:
      EMAIL: "mobiletest@pierre.dev"
      PASSWORD: "MobileTest1234"

# After successful login, should navigate away from login screen.
# 45s timeout accounts for slow CI servers (sign-in can take 20s+).
- extendedWaitUntil:
    notVisible:
      id: "login-screen"
    timeout: 45000

# Capture screenshot for debugging what appears after login
- takeScreenshot: "test06-after-login"

# Dismiss iOS "Save Password?" native dialog if present. It arrives seconds
# after the login screen has gone, so it is watched for while Home is awaited.
- runFlow:
    file: ../helpers/wait-for-home-after-login.yaml

# Verify we landed on Home, the first tab: today's plan and the latest
# activities. 60s timeout for Expo Router transition and the screen's mount.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- assertVisible:
    id: "home-title"
