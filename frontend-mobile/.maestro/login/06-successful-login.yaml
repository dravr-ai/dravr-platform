# ABOUTME: Test successful login with valid credentials
# ABOUTME: Converted from login.test.js "should login successfully with valid credentials"
# ABOUTME: NOTE: This test requires the Dravr backend server running with test user

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# Enter test credentials (hardcoded to match CI user seed).
# Fields are empty after fresh launch, no eraseText needed.
- tapOn:
    id: "email-input"
- inputText: "mobiletest@pierre.dev"

# Dismiss keyboard by tapping header area. hideKeyboard fails in Expo Go v55.
# Needed on Android where keyboard covers the password field.
- tapOn:
    point: "50%,20%"

- tapOn:
    id: "password-input"
- inputText: "MobileTest1234"

# Dismiss keyboard before tapping login button to ensure it's fully visible.
- tapOn:
    point: "50%,20%"

# Tap the Sign In button (testID="login-button" on Button component).
# The submit control sits below the fold on a short screen — CI's emulator is
# shorter than a Pixel 6 and could not find login-button at all (2026-09-06,
# 8 of 10 critical flows). Scroll to it the way a user would rather than
# assuming it is on screen.
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# After successful login, should navigate away from login screen.
# 45s timeout accounts for slow CI servers (login API can take 20s+).
- extendedWaitUntil:
    notVisible:
      id: "login-screen"
    timeout: 45000

# Capture screenshot for debugging what appears after login
- takeScreenshot: "test06-after-login"

# Dismiss iOS "Save Password?" native dialog if present.
- runFlow:
    when:
      visible: "Save Password?"
    file: ../helpers/dismiss-save-password.yaml

# Verify we landed on the chat tab: the conversation list.
# 60s timeout for Expo Router transition and the list's mount.
- extendedWaitUntil:
    visible:
      id: "conversations-screen"
    timeout: 60000
