# ABOUTME: Test that sign in button is visible
# ABOUTME: Converted from login.test.js "should show sign in button"

appId: ai.dravr.app

---
# Launch app fresh
- runFlow:
    file: ../helpers/launch-app.yaml

# The submit control sits below the fold on a short screen (CI's emulator is
# shorter than a Pixel 6), so reach it by scrolling rather than assuming it is
# already on screen — 2026-09-06.
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "login-button"
