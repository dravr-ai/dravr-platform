# ABOUTME: Test the Privacy and About rows open their panes, and the quiet sign-out closes the settings list
# ABOUTME: Every element is found by id — the pane rows, the pane screens, the sign-out row — never by copy

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# Test: the Privacy row opens the privacy pane
- scrollUntilVisible:
    element:
      id: "settings-pane-privacy"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-pane-privacy"
- extendedWaitUntil:
    visible:
      id: "privacy-settings-screen"
    timeout: 5000
- runFlow:
    file: ../helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000

# Test: the About row opens the about pane
- scrollUntilVisible:
    element:
      id: "settings-pane-about"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-pane-about"
- extendedWaitUntil:
    visible:
      id: "about-screen"
    timeout: 5000
- runFlow:
    file: ../helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000

# Test: the sign-out row ends the list (not tapped here)
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "settings-sign-out"
