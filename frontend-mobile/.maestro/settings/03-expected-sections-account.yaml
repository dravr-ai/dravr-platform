# ABOUTME: Test Account section is visible with expected elements
# ABOUTME: Converted from settings.test.js "expected sections - data from backend"

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# Scroll to Account section (below profile and data sections)
- scrollUntilVisible:
    element:
      id: "settings-account-section"
    direction: DOWN
    timeout: 10000

# Test: should show Account section header
- assertVisible:
    id: "settings-account-section"

# Test: should show Personal Information option
- assertVisible:
    id: "settings-personal-info-button"

# Test: should show Change Password option
- assertVisible:
    id: "settings-change-password-button"

# Test: should show Connected Apps option
# MCP Tokens is deliberately absent here: that row is gated on the `api_tokens`
# feature flag, which defaults off, so on a stock tenant it does not render.
- scrollUntilVisible:
    element:
      id: "settings-connected-apps-button"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "settings-connected-apps-button"
- assertNotVisible:
    id: "settings-mcp-tokens-button"
