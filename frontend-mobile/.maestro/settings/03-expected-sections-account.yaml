# ABOUTME: Test the Account pane opens from the settings list and shows every section the shared declaration groups under it
# ABOUTME: Status, usage, security, connected apps and sign-out — each found by id, never by copy

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# Open the Account pane from its row. Account is the last pane row and sits
# under the tab bar until the list is scrolled to its end, so the scroll
# targets the sign-out row below it: a row that is only partly visible
# counts as visible, and a tap on its centre lands on the tab bar instead.
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-pane-account"
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 5000

# Test: the status and usage sections lead the pane
- assertVisible:
    id: "account-section-account-status"
- assertVisible:
    id: "account-section-usage"

# Test: security holds the change-password row
- scrollUntilVisible:
    element:
      id: "account-section-security"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "account-section-security"
- assertVisible:
    id: "account-change-password-button"

# Test: the connected apps row is there
- scrollUntilVisible:
    element:
      id: "account-connected-apps-button"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "account-connected-apps-button"

# Test: sign-out closes the pane (not tapped here)
- scrollUntilVisible:
    element:
      id: "account-section-sign-out"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "account-section-sign-out"

# Back to the settings list
- runFlow:
    file: ../helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
