# ABOUTME: The Connections pane lists the data providers — Settings → Connections → a provider row, then back to Settings
# ABOUTME: Ids only: the pane row on Settings, the Connections root, the Strava-branded sciotte row the seeded stack always lists

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# Open the Connections pane
- tapOn:
    id: "settings-pane-connections"

- extendedWaitUntil:
    visible:
      id: "connections-screen"
    timeout: 5000

# The seeded stack always lists the Strava-branded sciotte provider
- assertVisible:
    id: "provider-row-sciotte"

# Back to Settings
- runFlow:
    file: ../helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
