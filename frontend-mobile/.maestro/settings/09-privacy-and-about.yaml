# ABOUTME: The Settings screen reaches its Privacy and About panes; Privacy carries the analytics-consent control
# ABOUTME: Relocated from visual/08-settings-privacy.yaml (Boreal v2.2 Phase 6); a specific-control assertion, not a render check, so it does not fold into visual/00-capture.yaml (which does not visit either pane)

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings tab
- tapOn:
    text: "Réglages|Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# Test: the Privacy pane opens and carries the analytics-consent control.
# Rows are found by id, never by their label: the label is translated and the
# flow runs in whichever language the device is set to.
- scrollUntilVisible:
    element:
      id: "settings-pane-privacy"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-pane-privacy"
- extendedWaitUntil:
    visible:
      id: "privacy-settings-screen"
    timeout: 10000
- assertVisible:
    id: "analytics-consent-switch"
- runFlow:
    file: ../helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# Test: the About pane opens
- scrollUntilVisible:
    element:
      id: "settings-pane-about"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-pane-about"
- extendedWaitUntil:
    visible:
      id: "about-screen"
    timeout: 10000
- runFlow:
    file: ../helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
