# ABOUTME: Navigation into the Connections pane and back — the Settings row pushes it, the header back returns
# ABOUTME: Ids only: the pane row on Settings, the Connections root, the Settings root

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Settings
- runFlow:
    file: ../helpers/navigate-to-settings.yaml

# The Connections row pushes the pane
- tapOn:
    id: "settings-pane-connections"

- extendedWaitUntil:
    visible:
      id: "connections-screen"
    timeout: 5000

# Navigate back via the header back button (not hardware back which may not work on iOS)
- runFlow:
    file: ../helpers/go-back.yaml

# Should be back on settings
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
