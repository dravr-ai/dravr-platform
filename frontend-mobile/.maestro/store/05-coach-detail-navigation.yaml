# ABOUTME: Test navigation to agent detail from Discover
# ABOUTME: Converted from store.test.js "coach detail navigation" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# Ensure agents are loaded
- extendedWaitUntil:
    visible:
      id: "coach-list"
    timeout: 5000

# Try to find any agent card and tap it
# Note: This requires at least one agent in the store
- runFlow:
    when:
      visible:
        id: "coach-card-0"
    commands:
      - tapOn:
          id: "coach-card-0"

      # Should see agent detail screen
      - extendedWaitUntil:
          visible:
            id: "store-coach-detail-screen"
          timeout: 5000

      # Wait for agent detail data to load. The screen testID appears on
      # mount, but the Install button renders only after async fetch of
      # agent detail and installation status completes.
      - extendedWaitUntil:
          visible: "Install Agent"
          timeout: 15000

      # Navigate back
      - tapOn:
          id: "back-button"
