# ABOUTME: Test basic Discover/Store screen rendering
# ABOUTME: Converted from store.test.js "basic rendering" tests

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# Test: should show store screen
- assertVisible:
    id: "store-screen"

# Test: should show Discover title
- assertVisible: "Discover"

# Test: should show search input
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Search agents...|Rechercher des agents…"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ".*:id/search_button"

# Test: should show category text tabs
- assertVisible: "All"
- assertVisible: "Training"
- assertVisible: "Nutrition"

# Test: sort lives behind the header's sliders button, not an inline chip row
- assertVisible:
    id: "discover-sort-button"
- assertNotVisible: "Sort by:"
