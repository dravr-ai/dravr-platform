# ABOUTME: Sort lives behind the header's sliders button as a native menu, not an inline chip row
# ABOUTME: Converted from store.test.js "sort options" tests to the Boreal v2.2 Phase 5 shape (D7/P5.2)

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000

# Test: the sort menu offers the three choices
- tapOn:
    id: "discover-sort-button"
- assertVisible: "(?i)Popular|Populaires"
- assertVisible: "(?i)Newest|Plus récents"
- assertVisible: "A-Z"

# Test: picking Newest reloads the catalogue rather than crashing it
- tapOn: "(?i)Newest|Plus récents"
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000

# Test: the menu re-opens for a second sort, alphabetically this time
- tapOn:
    id: "discover-sort-button"
- tapOn: "A-Z"
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000
