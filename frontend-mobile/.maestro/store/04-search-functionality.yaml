# ABOUTME: Search in Discover filters the list — a matchless term empties it, clearing restores it
# ABOUTME: Asserts the effect of searching, not merely that the list container survived it

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# The seeded store publishes system agents, so a first card is a precondition
# this environment guarantees. Assert it rather than guarding on it: if it is
# missing the store is broken and every assertion below is meaningless.
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000

# A term no agent title or description can match must empty the list. This is
# the assertion the flow existed for and never made: waiting for `coach-list`
# proved nothing, because the container is present before the search too.
- tapOn:
    id: "search-input"
- eraseText
- inputText: "zzqqxx-no-such-agent"

# Dismiss the keyboard before asserting. The search bar floats at the bottom of
# the screen, so with the keyboard up it sits over the list and the centred
# empty state is not in the visible hierarchy — the assertion below fails on a
# screen that is rendering correctly. `hideKeyboard` is unreliable in Expo Go
# v55, so this taps a non-interactive area to blur the field, the same
# workaround helpers/login.yaml documents for its own inputs.
- tapOn:
    point: "50%,20%"

- extendedWaitUntil:
    visible: "No agents found"
    timeout: 10000
- assertNotVisible:
    id: "coach-card-0"

# Clearing the term brings the catalogue back.
- tapOn:
    id: "search-input"
- eraseText
- tapOn:
    point: "50%,20%"

- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000
- assertNotVisible: "No agents found"
