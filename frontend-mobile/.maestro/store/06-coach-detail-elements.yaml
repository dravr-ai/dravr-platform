# ABOUTME: The agent detail screen shows title, category, install count and the prompt section
# ABOUTME: The first card is asserted, not guarded, so an empty store fails instead of skipping

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000

- tapOn:
    id: "coach-card-0"
- extendedWaitUntil:
    visible:
      id: "store-coach-detail-screen"
    timeout: 5000

# Every element the detail screen promises.
- assertVisible:
    id: "coach-title"
- assertVisible:
    id: "category-badge"
- assertVisible:
    id: "install-count"
- assertVisible: "System Prompt"

# Navigate back
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 5000
