# ABOUTME: Pull to refresh in Discover reloads the catalogue and keeps it rendered
# ABOUTME: Asserts a card is present after the refresh, not just that the list container exists

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# A card before the refresh, so the assertion after it means something.
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000

# Pull down from the top of the list to trigger the refresh.
- swipe:
    direction: DOWN
    duration: 400

# The catalogue is back after refetching. Waiting on `coach-list` alone would
# have passed with an empty list, which is what a broken refresh looks like.
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000
- assertVisible:
    id: "search-input"
