# ABOUTME: Pull to refresh in Discover reloads the catalogue and keeps it rendered
# ABOUTME: Asserts a card is present after the refresh, not just that the list container exists

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# A card before the refresh, so the assertion after it means something.
#
# 30s, not 10s: this is a network round trip (browse + translate + grade)
# through Android's 10.0.2.2 emulator NAT alias, the same shape of wait
# login.yaml:55-58 gives 45s and login.yaml:75-78 gives 60s for a comparable
# reason. 10s failed this wait on every Android CI run regardless of the row
# implementation across several redesigns — under-provisioned, not a bug in
# the row or the data path.
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 30000

# Pull down from the top of the list to trigger the refresh.
- swipe:
    direction: DOWN
    duration: 400

# The catalogue is back after refetching. Waiting on `coach-list` alone would
# have passed with an empty list, which is what a broken refresh looks like.
# Same 30s margin as the pre-refresh wait above, for the same reason.
- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Search agents...|Rechercher des agents…"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ".*:id/search_button"
