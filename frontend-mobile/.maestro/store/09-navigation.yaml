# ABOUTME: Test navigation from Discover to the coach library and back
# ABOUTME: Converted from store.test.js "navigation" tests; the library sits under Discover, not a tab

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# Test: should open the coach library from the installed-coaches strip
- extendedWaitUntil:
    visible:
      id: "manage-coaches-button"
    timeout: 15000
- tapOn:
    id: "manage-coaches-button"

# Should see coach library
- extendedWaitUntil:
    visible:
      id: "coach-library-screen"
    timeout: 5000

# Navigate back to the store with the library's back button
- tapOn:
    id: "back-button"

- extendedWaitUntil:
    visible:
      id: "store-screen"
    timeout: 5000
