# ABOUTME: Uninstalling an agent confirms, reports, and returns the listing to installable
# ABOUTME: The install state is established first, so the assertions below run on every device

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

- extendedWaitUntil:
    visible:
      id: "coach-card-0"
    timeout: 10000
- tapOn:
    id: "coach-card-0"
- extendedWaitUntil:
    visible:
      id: "store-coach-detail-screen"
    timeout: 5000

# SETUP, conditional by necessity: install the agent if this device does not
# already have it, so there is something to uninstall. Everything after this
# runs unconditionally — the previous version guarded the uninstall itself and
# so passed, asserting nothing, on any device where the agent was absent.
- runFlow:
    when:
      visible: "Install Agent"
    commands:
      - tapOn: "Install Agent"
      - extendedWaitUntil:
          visible:
            id: "post-install-hint"
          timeout: 5000

# The agent is installed, so the listing offers to remove it.
- extendedWaitUntil:
    visible: "Uninstall"
    timeout: 10000
- tapOn: "Uninstall"

# Removal asks before it acts, and says so afterwards.
- extendedWaitUntil:
    visible: "Uninstall Agent?"
    timeout: 3000
- tapOn: "Uninstall"
- extendedWaitUntil:
    visible: "Uninstalled"
    timeout: 5000
- tapOn: "OK"

# The listing is installable again, which is the state the removal promised.
- extendedWaitUntil:
    visible: "Install Agent"
    timeout: 10000
- assertNotVisible: "Uninstall Agent?"
