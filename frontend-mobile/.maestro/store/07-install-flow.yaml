# ABOUTME: Test agent install flow from the store — install ends with the hint, and Open chat lands in a thread
# ABOUTME: The hint teaches /agent add @handle; there is no agent library to send the athlete to

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# Navigate to an agent that can be installed
- runFlow:
    when:
      visible:
        id: "coach-card-0"
    commands:
      - tapOn:
          id: "coach-card-0"
      - extendedWaitUntil:
          visible:
            id: "store-coach-detail-screen"
          timeout: 5000

      # Check if Install button is visible (not already installed)
      - runFlow:
          when:
            visible: "Install Agent"
          commands:
            # Tap install
            - tapOn: "Install Agent"

            # The post-install hint replaces the old alert: it names the
            # command that binds the agent to any chat
            - extendedWaitUntil:
                visible:
                  id: "post-install-hint"
                timeout: 5000
            - assertVisible: "Use it in any chat: /agent add @.*"
            # /coach add still WORKS when an athlete types it — it is a
            # permanent alias, not a shim — but the hint must teach the
            # canonical spelling. A half-reverted rename leaves the command
            # resolving either way and the hint teaching the old one, which no
            # server test can see: this is the only place that spelling is
            # asserted where an athlete actually reads it.
            - assertNotVisible: "Use it in any chat: /coach add @.*"
            # The two halves of the alert the hint replaced, spelled as that
            # alert spelled them. Both were hardcoded English literals deleted
            # in b460057d3; a revert brings them back verbatim, so renaming one
            # half would leave the pair unable to catch it.
            - assertNotVisible: "Installed!"
            - assertNotVisible: "View My Coaches"

            # The listing is now an installed copy: editable, uninstallable
            - assertVisible:
                id: "edit-coach-button"
            - assertVisible: "Installed"

            # Open chat leaves the store for a fresh thread
            - tapOn:
                id: "post-install-open-chat"
            - extendedWaitUntil:
                visible:
                  id: "chat-screen"
                timeout: 10000
