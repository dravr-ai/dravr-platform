# ABOUTME: Test coach install flow from the store — install ends with the hint, and Open chat lands in a thread
# ABOUTME: The hint teaches /coach add @handle; there is no coach library to send the athlete to

appId: ai.dravr.app

---
# Launch and login
- runFlow:
    file: ../helpers/launch-app.yaml
- runFlow:
    file: ../helpers/login.yaml

# Navigate to Discover
- runFlow:
    file: ../helpers/navigate-to-discover.yaml

# Navigate to a coach that can be installed
- runFlow:
    when:
      visible:
        id: "coach-card-0"
    commands:
      - tapOn:
          id: "coach-card-0"
      - extendedWaitUntil:
          visible:
            id: "store-coach-detail-screen"
          timeout: 5000

      # Check if Install button is visible (not already installed)
      - runFlow:
          when:
            visible: "Install Coach"
          commands:
            # Tap install
            - tapOn: "Install Coach"

            # The post-install hint replaces the old alert: it names the
            # command that binds the coach to any chat
            - extendedWaitUntil:
                visible:
                  id: "post-install-hint"
                timeout: 5000
            - assertVisible: "Use it in any chat: /coach add @.*"
            - assertNotVisible: "Installed!"
            - assertNotVisible: "View My Coaches"

            # The listing is now an installed copy: editable, uninstallable
            - assertVisible:
                id: "edit-coach-button"
            - assertVisible: "Installed"

            # Open chat leaves the store for a fresh thread
            - tapOn:
                id: "post-install-open-chat"
            - extendedWaitUntil:
                visible:
                  id: "chat-screen"
                timeout: 10000
