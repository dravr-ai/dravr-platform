# ABOUTME: Helper flow to log out of the application
# ABOUTME: Navigates to Settings, taps the quiet sign-out row at the end of the list, then confirms the alert

appId: ai.dravr.app

---
# Navigate to Settings
- runFlow:
    file: navigate-to-settings.yaml

# The sign-out row sits after the pane list
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
    timeout: 5000

# Tap the sign-out row
- tapOn:
    id: "settings-sign-out"

# Confirm the alert. Its title and its confirm button carry the same words
# (`common.logout`, fr/en), so the second match — the button below the
# message — is the one to tap.
- runFlow:
    when:
      visible: "Se déconnecter|Sign Out"
    commands:
      - tapOn:
          text: "Se déconnecter|Sign Out"
          index: 1

# Verify we're back on login screen
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 5000
