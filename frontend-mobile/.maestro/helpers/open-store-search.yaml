# ABOUTME: Helper flow that focuses the Discover screen's native header search field, in either app language
# ABOUTME: iOS shows the field with its placeholder; Android's app-bar search is an icon until tapped

appId: ai.dravr.app

---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Search agents...|Rechercher des agents…"
- runFlow:
    when:
      platform: Android
    commands:
      # Three runs have ended with Expo Go's developer menu on screen and no
      # app view in the tree, each time with the tap before it reported
      # COMPLETED -- first on :id/search_button, then on the magnifier's
      # contentDescription. What none of them established is whether the menu
      # is a consequence of the tap or was already there: Maestro dumps the
      # hierarchy only on failure, and the failure came after.
      #
      # This screenshot and this assertion answer that. The assertion is one
      # the flow wants anyway -- you cannot search a screen that is not in
      # front of you -- and when the sheet is up the app views are absent
      # from the tree, so it fails there and dumps the tree at that moment.
      - assertVisible:
          id: "store-screen"
      # Tap the magnifier by position, not by any selector. The selector is
      # what has been wrong all along: `.*:id/search_button` and the
      # contentDescription both resolved to Expo Go's own chrome, and tapping
      # it raises the developer menu. The run that proved it is c8804f8f7 --
      # the assertVisible above PASSED, so the app's views were in the tree and
      # the menu was not, and the menu is in the tree captured right after the
      # tap. A point inside this app's app bar cannot match Expo Go's chrome.
      #
      # The magnifier sits at the trailing edge of the Discover app bar, the
      # row carrying the large title.
      - tapOn:
          point: "92%,8%"
      - extendedWaitUntil:
          visible: "Search agents...|Rechercher des agents…"
          timeout: 10000
