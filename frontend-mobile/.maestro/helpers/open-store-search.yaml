# ABOUTME: Helper flow that focuses the Discover screen's native header search field, in either app language
# ABOUTME: iOS shows the field with its placeholder; Android's app-bar search is an icon until tapped

appId: ai.dravr.app

---
- runFlow:
    when:
      platform: iOS
    commands:
      # The corpus spells both placeholders with three periods
      # (packages/i18n discover.searchAgentsPlaceholder); `.` matches them.
      - tapOn: "Search agents...|Rechercher des agents..."
- runFlow:
    when:
      platform: Android
    commands:
      # You cannot search a screen that is not in front of you, and when Expo
      # Go's developer menu is up the app's views are absent from the tree, so
      # this fails there and dumps the tree at that moment.
      - assertVisible:
          id: "store-screen"
      # Expo Go (SDK 55) draws a floating "Tools" button over the app at the
      # top-right corner, and on CI's 320x640 emulator its touch container
      # spans x=232..304, y=16..110 -- the same corner as the app bar's
      # magnifier, `:id/search_button` at x=272..320, y=28..76. Anything that
      # lands in the overlap opens the developer menu instead of the search
      # field: tapping the id (centre x=296) did, and so did the point
      # `92%,8%` (x=294) in run 35099882108, whose failure hierarchy holds the
      # menu and whose earlier dump holds the overlay's bounds.
      #
      # So tap the magnifier's trailing sliver, right of the overlay: x=313 is
      # inside the magnifier and 9px clear of the overlay's edge.
      #
      # Height: SDK 57's taller header moved the magnifier to y=52..100
      # (run 36213845671's hierarchy; SDK 55 had y=28..76), so the old 8%
      # (y=51) landed one pixel above it. 12% (y=77) is its vertical centre,
      # clear of both edges on the 640-high emulator, and the Expo Go 57 gear
      # (label at x=265..291) stays left of x=313.
      - tapOn:
          point: "98%,12%"
      # The expanded SearchView exposes its EditText as `:id/search_src_text`.
      # Wait on that id, not on the placeholder: the hint depends on the app
      # language, and the id proves the field expanded and took focus, which
      # is what the caller's `eraseText`/`inputText` need.
      - extendedWaitUntil:
          visible:
            id: ".*:id/search_src_text"
          timeout: 10000
