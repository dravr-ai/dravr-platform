# ABOUTME: Helper flow to send a chat message
# ABOUTME: Types a message and sends it, optionally waits for response

appId: com.pierre.fitness

---
# Type message in the input field
- tapOn:
    id: "message-input"
- inputText: ${MESSAGE}

# Wait for send button to become enabled (testID switches from
# send-button-disabled to send-button once React state updates).
- extendedWaitUntil:
    visible:
      id: "send-button"
    timeout: 5000

# Tap send button
- tapOn:
    id: "send-button"
