# ABOUTME: Helper to dismiss iOS "Save Password?" native dialog after login
# ABOUTME: Swipes the bottom sheet down since dialog buttons lack accessibility labels

appId: host.exp.Exponent

---
# The "Save Password?" dialog is a native iOS bottom sheet that appears after
# form submission with secureTextEntry fields. Its buttons ("Save Password",
# "Not Now") lack accessibility text labels in the XCUITest tree, so we
# dismiss by swiping the sheet downward.
- swipe:
    start: "50%,80%"
    end: "50%,99%"
    duration: 300
