# ABOUTME: Helper to dismiss iOS "Save Password?" native dialog after login
# ABOUTME: Taps "Not Now" when the sheet exposes its buttons, swipes it down when it does not

appId: host.exp.Exponent

---
# The "Save Password?" dialog is a native iOS sheet that appears after form
# submission with secureTextEntry fields. On iOS 17.4 (iPhone 15 Pro simulator,
# 2026-09-14) its buttons ("Save Password", "Not Now") carry accessibility labels
# and the sheet is an alert-style card a downward swipe does not close — the
# swipe alone left it over the conversation list. Older runtimes expose no
# labels, so the swipe stays as the path for a tree that has no "Not Now".
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Save Password"
      notVisible: "Not Now"
    commands:
      - swipe:
          start: "50%,80%"
          end: "50%,99%"
          duration: 300
