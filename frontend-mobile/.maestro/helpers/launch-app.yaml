# ABOUTME: Helper flow to launch the Dravr app fresh in Expo Go for E2E testing, on iOS and Android
# ABOUTME: Branches on platform: keychain-only reset and 127.0.0.1 on iOS, full state reset and 10.0.2.2 on Android

appId: host.exp.Exponent

---
# iOS: stop, clear the keychain (auth tokens in SecureStore), relaunch.
# clearKeychain preserves UserDefaults (including EXDevMenuIsOnboardingFinished flag),
# while clearing JWT tokens from SecureStore so the app shows the login screen.
# clearState would wipe UserDefaults, causing Expo Go's dev menu overlay to reappear.
# Launching Expo Go first, THEN opening the deep link, forwards the URL directly to
# the app without the iOS "Open in Expo Go?" confirmation dialog on iOS 18. iOS 27
# asks anyway, so the dialog is answered when it is there — one immediate check,
# not a slot in the loop below, where every optional miss costs a lookup budget.
# A link that reaches Expo Go before it has finished starting is not opened at all;
# the loop below sends it again while the login screen has not appeared.
- runFlow:
    when:
      platform: iOS
    commands:
      - stopApp
      - clearKeychain
      - launchApp
      - openLink: "exp://127.0.0.1:8082"
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"

# Android: the Expo Go package is lowercase and there is no keychain, so clearState
# is the reset. 10.0.2.2 is the emulator's alias for the host machine. Expo Go needs a
# moment after clearState before it registers its URL handler; a deep link sent
# earlier is dropped silently, so a 3-second settle precedes the openLink.
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp: host.exp.exponent
      - clearState: host.exp.exponent
      - launchApp: host.exp.exponent
      - swipe:
          start: "50%,50%"
          end: "50%,52%"
          duration: 3000
      - openLink: "exp://10.0.2.2:8082"

# Expo Go puts two native sheets over the app after a deep link, and both hide the
# React Native accessibility tree: the developer-menu onboarding ("Continue", every
# launch after clearState on Android, first launch on iOS) and the v55 project-info
# sheet ("Close"). When they appear depends on how long the bundle takes, so a fixed
# sequence of taps and delays loses the race on a loaded machine (2026-09-05: three
# flows failed at the 120 s login-screen wait with "Continue" still on screen). This
# loop instead keeps dismissing until the login screen is actually in the tree. Each tap
# is optional: a missing button is the normal case, and Maestro spends its 7 s optional
# lookup budget on each miss, so a round in which neither sheet is present costs ~16 s,
# not the swipe's 2 s — 6 rounds is the practical ceiling before the 120 s login-screen
# wait. The tap at 50%,10% closes the full developer menu, which opens after "Continue".
#
# On iOS each round ends by sending the deep link again while the login screen is still
# absent. The first link, sent the moment launchApp returns, can reach Expo Go before it
# is ready for one, and Expo Go then stays on its own home screen with the app never
# started: no sheet to dismiss, so every round missed and the flow failed at the 120 s
# wait. That was the iOS lane's one recurring failure, on main and on branches alike,
# hitting a different flow on each attempt: during those flows the server never received
# the GET /api/i18n/<locale> the app sends as its root layout loads (2026-09-25, runs
# 36077391246 and 36096724222). By the end of a round Expo Go has been up for 15 s or
# more, so the link opens the app; when the app is already running under a sheet, Expo Go
# hands the link to it as a deep link into the running project. The link is sent at the
# end of a round and not at its start, where the app may still be loading from the last one.
- swipe:
    start: "50%,30%"
    end: "50%,31%"
    duration: 3000
- repeat:
    times: 6
    while:
      notVisible:
        id: "login-screen"
    commands:
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,10%"
          optional: true
      - swipe:
          start: "50%,30%"
          end: "50%,32%"
          duration: 2000
      - runFlow:
          when:
            platform: iOS
            notVisible:
              id: "login-screen"
          commands:
            - openLink: "exp://127.0.0.1:8082"
            - runFlow:
                when:
                  visible: "Open"
                commands:
                  - tapOn: "Open"

# Wait for React Native to load and render login screen.
# 120s timeout accounts for JS bundle compilation on cold start in CI.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 120000

# One more dismiss after login-screen loads (race condition with Expo Go startup).
- runFlow:
    when:
      visible: "Close"
    file: dismiss-dev-panel.yaml

# Confirm the login form is interactable (overlay is fully dismissed).
# 30s timeout to handle slow CI environments.
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000
