# ABOUTME: Helper flow to navigate from any tab to the chat tab's conversation list
# ABOUTME: Uses the bottom tab bar; the app lands on Home, so every flow that starts from the list comes through here

appId: ai.dravr.app

---
# Tap the Chat tab in bottom navigation (the seeded tester runs in French).
# With something unread the tab's accessible text carries the count after
# its name ("Discussion, 2 …" on Android's native badge), so the name is
# matched as the start of that text, never as all of it.
- tapOn:
    text: "(Discussion|Chat).*"

# Wait for the conversation list to load
- extendedWaitUntil:
    visible:
      id: "conversations-screen"
    timeout: 10000
