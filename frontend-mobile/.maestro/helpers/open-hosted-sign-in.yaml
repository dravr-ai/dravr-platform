# ABOUTME: Helper that taps the app's sign-in button and waits for the server's hosted login page in the system browser
# ABOUTME: iOS waits once for the page and fails on a sheet whose web process never launched; Android answers Chrome's first-run screens

appId: host.exp.Exponent

---
# The app has no password field (carnet#787): its sign-in button opens the
# server's /oauth2/login page in an auth session — ASWebAuthenticationSession
# on iOS, a Chrome Custom Tab on Android. The button sits below the fold on a
# short screen (CI's emulator is shorter than a Pixel 6, 2026-09-06), so it is
# scrolled to the way a user would.
- scrollUntilVisible:
    element:
      id: "login-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "login-button"

# iOS: one tap, one wait. The sheet draws its page once WebKit has launched a
# web content process for it, and on the CI simulator that launch can stall:
# runningboardd accepts it ("Submitting extension overlay") and a stalled one
# takes 16 s to more than 7 min, where every other launch completed within
# 1.1 s (carnet#869, runs 38402697100 and 38392431568). Until it completes,
# the sheet is blank — its BrowserView reads WebViewProcessID=0 — and
# nothing reaches the server. SafariViewService, one process for the whole run,
# launches these processes one at a time, so a sheet opened during a stall
# launches nothing of its own: it queues behind the stuck launch, and a
# cancelled sheet's queued launch carries into the next flow (onboarding/02
# waited 7+ min on one issued for a sheet chat/11 had dismissed). Cancelling
# and tapping again therefore never gets a fresh process, and a short wait
# cancels sheets that are still loading: healthy sheets drew 3-9 s after the
# tap in one run and up to 18 s in the other. The single wait outlasts the
# 25.7 s, 67 s and 182 s stalls measured; the 336 s and 7+ min ones still fail,
# here, under their cause rather than at the caller's Email wait.
#
# The app's session is ephemeral, which iOS does not ask about; the
# '"Expo Go" Wants to Use "<host>" to Sign In' alert is answered for a runtime
# that asks anyway. It is shown before the sheet, so it is looked for once,
# right after the tap.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: ".*Wants to Use.*to Sign In.*"
          commands:
            - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Password|Mot de passe|Contraseña|Passwort|Palavra-passe"
          timeout: 240000
          optional: true
      # Maestro matches `id` against the element's resource-id, the whole of
      # it: "BrowserView?IsPageLoaded=true&WebViewProcessID=0" on every blank
      # sheet of both runs, a real pid once the process is up.
      - assertNotVisible:
          id: "BrowserView.*WebViewProcessID=0(&.*)?"
          label: "hosted sign-in: the sheet's web content process never launched (simulator process-launch stall, carnet#869)"

# Android: Chrome on a fresh emulator (or after clearState) runs its first-run
# screens inside the Custom Tab: terms, sign-in to Chrome, notifications. Each
# check is a `when`, not an optional tap, so a round with nothing to answer
# costs no lookup budget. The loop ends when the page's password field label
# is on screen, or when no page comes at all — a browser already signed in to
# the authorization server returns to the app at once, which the caller's Home
# wait then sees.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          while:
            notVisible: "Password|Mot de passe|Contraseña|Passwort|Palavra-passe"
          commands:
            - extendedWaitUntil:
                visible: "Password|Mot de passe|Contraseña|Passwort|Palavra-passe"
                timeout: 4000
                optional: true
            - runFlow:
                when:
                  visible: "Accept & continue"
                commands:
                  - tapOn: "Accept & continue"
            - runFlow:
                when:
                  visible: "Use without an account"
                commands:
                  - tapOn: "Use without an account"
            - runFlow:
                when:
                  visible: "No thanks"
                commands:
                  - tapOn: "No thanks"
            - runFlow:
                when:
                  visible: "No, thanks"
                commands:
                  - tapOn: "No, thanks"
