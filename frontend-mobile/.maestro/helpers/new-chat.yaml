# ABOUTME: Helper flow to start a fresh chat conversation
# ABOUTME: Expands the floating tab bar and taps the New Chat quick action

appId: host.exp.Exponent

---
# Expand the floating tab bar menu
- tapOn:
    id: "expandable-tab-bar-plus"

# Wait for the New Chat quick action to appear (animated entrance)
- extendedWaitUntil:
    visible:
      id: "quick-action-new-chat"
    timeout: 3000

# Tap the New Chat quick action
- tapOn:
    id: "quick-action-new-chat"

# Verify we're in a new chat
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 5000
