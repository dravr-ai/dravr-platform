# ABOUTME: Helper that signs the seeded tester (mobiletest@pierre.dev) in with a seeded session and waits for Home, the tab the app lands on
# ABOUTME: For flows that are not testing sign-in: no hosted sign-in sheet; the login/ flows open the page through open-hosted-sign-in.yaml

appId: host.exp.Exponent

---
# The tester is the account both CI lanes create with `pierre-cli user
# create`; sign-in-seeded.yaml signs it in without the hosted page (carnet#1201).
- runFlow:
    file: sign-in-seeded.yaml
    env:
      EMAIL: "mobiletest@pierre.dev"

# Home is the first tab and where the app lands after a sign-in. A flow that
# needs the conversation list goes there with navigate-to-chat.yaml; one that
# needs the composer opens a thread with new-chat.yaml, which takes the chat
# tab first when it starts on Home.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
