// ABOUTME: Gradle build of the local dravr-health Expo module — Health Connect read access for the device health sync
// ABOUTME: connect-client 1.1.0 is the current stable release on Google's Maven; it needs minSdk 26 and compileSdk 36

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.dravr.health'
version = '1.0.0'

android {
  namespace 'ai.dravr.health'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.health.connect:connect-client:1.1.0'
}
