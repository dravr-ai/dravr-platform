<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Dravr favicon</title>
  <desc>Compact web favicon — forest-green rounded square with a centred node motif.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00241a"/>
      <stop offset="100%" style="stop-color:#0d3b2e"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="10" fill="url(#bgGrad)"/>

  <!-- Simplified network: 5 nodes + connecting lines, centred -->
  <g stroke="#a3d0be" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <line x1="17" y1="15" x2="22" y2="20"/>
    <line x1="22" y1="20" x2="30" y2="18"/>
    <line x1="22" y1="20" x2="20" y2="28"/>
    <line x1="20" y1="28" x2="31" y2="26"/>
    <line x1="20" y1="28" x2="24" y2="35"/>
  </g>

  <circle cx="17" cy="15" r="2.6" fill="#a3d0be"/>
  <circle cx="30" cy="18" r="2" fill="#a3d0be"/>
  <circle cx="22" cy="20" r="2" fill="#a3d0be"/>
  <circle cx="20" cy="28" r="2.8" fill="#ffffff"/>
  <circle cx="31" cy="26" r="2" fill="#8f6a2e"/>
  <circle cx="24" cy="35" r="2.2" fill="#5e7a82"/>
</svg>
