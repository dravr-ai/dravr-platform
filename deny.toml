# ABOUTME: Security and dependency validation configuration for cargo-deny
# ABOUTME: Replaces custom cargo-audit bash scripting with native cargo-deny tool

# ============================================================================
# Dependency graph - every feature, so the PostgreSQL build is judged too
# ============================================================================
# The default graph is the workspace's default features, which build SQLite
# only: sqlx-postgres and everything behind the `postgresql` features never
# reached a check, though the deployed server is built with them. Set here,
# not as a flag, so every caller of `cargo deny` (the security-audit lane, the
# weekly dependency check, lint-and-test.sh, a hand run) judges the same graph.
[graph]
all-features = true

# ============================================================================
# Advisory Database - Security Vulnerability Scanning
# ============================================================================
# Replaces: cargo audit --no-fetch --color always
[advisories]
version = 2
# Ignored advisories with risk assessment and mitigation plans
ignore = [
    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0192: ttf-parser 0.25.1 is unmaintained (no vulnerability)
    # -------------------------------------------------------------------------
    # Pulled by lopdf 0.42 <- pdf-extract 0.12.1, the lab-report text extractor
    # (carnet#1544), which only the `pierre-pdf-text` child binary links.
    # ttf-parser is a mandatory lopdf dependency in every release
    # pdf-extract can use, with no feature that turns it off, and no maintained
    # Rust PDF text extractor keeps the line layout barrage's lab rules read
    # (lopdf's own extract_text yields 0 results on owl's synthetic reports;
    # pdf-extract yields their truth on all 12 measured).
    # Reach: lopdf calls ttf_parser only in FontData::new, its PDF *writing*
    # API (Document::add_font). pdf-extract only reads, and never builds a
    # FontData, so no uploaded byte reaches ttf-parser.
    # The separate lopdf stack-overflow advisory is fixed by lopdf 0.42: its
    # parser stops past 100 nested arrays or dictionaries (MAX_NESTING_DEPTH).
    # Whatever an uploaded PDF still does to the parser ends the child
    # process, never the server.
    # Mitigation: drop this entry when lopdf replaces ttf-parser or
    # pdf-extract moves off it.
    # Next Review: 2026-12-21
    "RUSTSEC-2026-0192",

    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0194 + RUSTSEC-2026-0195: quick-xml 0.26 parser DoS
    # -------------------------------------------------------------------------
    # Severity: DoS only (quadratic duplicate-attribute check; unbounded
    # namespace-declaration allocation in NsReader). Both are XML *parsing*
    # paths fed by attacker-controlled input.
    # Affected in-tree version: quick-xml 0.26.0, dev-dependencies ONLY
    # (pprof -> inferno flamegraph writer for criterion benches). It never
    # compiles into the shipped binary, and the bench path only *writes* SVG —
    # no untrusted XML is ever parsed.
    # Upgrade blocked on upstream: fix is quick-xml >= 0.41; pprof 0.15 (latest)
    # still pins inferno 0.11, which requires quick-xml ^0.26.
    # Remove when pprof ships an inferno with quick-xml >= 0.41.
    #
    # Reviewed: 2026-10-23 — lock still shows quick-xml 0.26.0 under
    #   pprof 0.15.0 (latest) -> inferno 0.11.21, i.e. the upstream chain is
    #   unchanged and the dep is still dev-only (never in the shipped binary).
    # Reviewed: 2026-11-24 — pprof 0.15.0 is still the latest and still asks
    #   inferno ^0.11 (crates.io), and the lock still resolves quick-xml
    #   0.26.0, dev-only; unchanged.
    # Next Review: 2026-12-24
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite < 3.54.0 returns
    # uninitialized page-cache memory for a crafted database + -wal pair
    # -------------------------------------------------------------------------
    # Crate: libsqlite3-sys 0.30.1, through sqlx-sqlite 0.8.6
    # Issue: opening a database file together with a sibling -wal file whose
    # page size differs can make queries return stale process memory. The
    # attacker must write both files and the victim must open them.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0459
    #
    # Risk Assessment: NONE reachable in production
    # - Production (dev) runs on Cloud SQL PostgreSQL. With a PostgreSQL
    #   DATABASE_URL the archive-import stores also use PostgreSQL
    #   (crates/pierre-server/src/services/archive_import/mod.rs), so the
    #   server opens no SQLite file there.
    # - SQLite files are opened only in tests, local development and the
    #   Cloud SQL-disabled fallback, and always files the server itself
    #   created. No route accepts a SQLite file from a user.
    #
    # Upgrade blocked on upstream: the fix is libsqlite3-sys >= 0.39, and
    # sqlx 0.9.0 (latest) still requires libsqlite3-sys < 0.38.
    # Remove when an sqlx release accepts libsqlite3-sys >= 0.39.
    #
    # Reviewed: 2026-11-09
    # Next Review: 2026-12-09
    "RUSTSEC-2026-0459",

    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0543: chrono unmaintained
    # -------------------------------------------------------------------------
    # Severity: none; a maintenance notice, not a vulnerability.
    # Crate: chrono 0.4.45 (the only version in Cargo.lock)
    # Issue: RustSec lists chrono as unmaintained, citing the upstream issue
    # "Soft-deprecating chrono and chrono-tz" opened by a chrono maintainer;
    # every version is affected and no safe upgrade exists.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0543
    # Upstream issue: https://github.com/chronotope/chrono/issues/1768
    #
    # Risk Assessment: no known defect today
    # - carnet#1620 moved the platform and the satellites to dravr-tronc's
    #   date types, and chrono-tz left the graph with it (its notice,
    #   RUSTSEC-2026-0555, is no longer ignored). chrono remains only through
    #   fitparser, the FIT decoder, which hands its timestamps over as chrono
    #   values, and dravr-barrage's private edge that reads them.
    # - The exposure is forward-looking: a vulnerability found in chrono from
    #   now on has no upstream fix.
    #
    # Mitigation:
    # - cargo-deny still reports any vulnerability advisory filed against
    #   chrono; only this notice is ignored.
    # - No chrono type crosses dravr-barrage's public API, so replacing the
    #   FIT decoder is barrage's change alone.
    #
    # Reviewed: 2026-11-22
    # Next Review: 2026-12-22
    "RUSTSEC-2026-0543",
]

# Warn on yanked crates
yanked = "warn"

# ============================================================================
# License Validation - Ensure Only Approved Open Source Licenses
# ============================================================================
[licenses]
# Allow OSI-approved permissive licenses used by dependencies
allow = [
    "MIT",                    # Most common permissive license
    "Apache-2.0",             # Apache license
    "Unicode-3.0",            # ICU Unicode libraries
    "ISC",                    # ring/untrusted crypto libraries
    "CDLA-Permissive-2.0",    # webpki-roots TLS certificates
    "BSD-3-Clause",           # BSD license (crypto: curve25519, ed25519, redis, subtle, instant)
    "MPL-2.0",                # Mozilla Public License (option-ext)
    "Zlib",                   # zlib license (foldhash)
    "OpenSSL",                # OpenSSL license (aws-lc-sys crypto backend)
    "CC0-1.0",                # Creative Commons Zero (dunce path canonicalization)
    "MIT-0",                  # MIT No Attribution (dunce path canonicalization)
    "Apache-2.0 WITH LLVM-exception",  # LLVM runtime (ring crypto backend)
    "0BSD",                   # Zero-clause BSD (lettre email dependencies)
]
# Confidence threshold for license detection
confidence-threshold = 0.93
# Allow certain licenses for exceptions (if needed in future)
exceptions = []

# ============================================================================
# Dependency Bans - Prevent Problematic Dependencies
# ============================================================================
[bans]
# Warn on multiple versions of the same dependency (bloats binary).
#
# Note: dravr-* duplicates are gated separately and HARD-FAILED by the
# `dravr-* duplicate check` step in .github/workflows/ci-backend.yml's
# security-audit job (cargo tree -d filtered for dravr-*). The general
# `multiple-versions = "warn"` setting here keeps non-dravr drift visible
# without blocking on transitive splits we cannot fix; the dravr ecosystem
# is held to a stricter standard via the dedicated CI step.
multiple-versions = "warn"
# Deny wildcard dependencies (bad for reproducibility)
wildcards = "deny"
# Highlight dependencies that are not on crates.io
highlight = "all"
# Workspace-wide dependency management
workspace-default-features = "allow"
# External default features
external-default-features = "allow"
# Allow wildcard versions for git/path dependencies in private crates
# (embacle is an internal git dep without a crates.io version)
allow-wildcard-paths = true
# Allow build dependencies
allow = []
# Deny specific crates (if needed)
deny = []
# Skip these dependencies from multiple-version checking.
skip = []
# Skip tree checking for these dependencies
skip-tree = []

# ============================================================================
# Source Validation - Only Allow Trusted Registries
# ============================================================================
[sources]
# Deny unknown Git repositories (prevent supply chain attacks)
unknown-git = "deny"
# Deny unknown registries (only allow crates.io)
unknown-registry = "deny"
# Allow these specific Git repositories (if needed for specific deps)
allow-git = [
    "https://github.com/dravr-ai/dravr-embacle.git",
    "https://github.com/dravr-ai/dravr-cageux.git",
    "https://github.com/dravr-ai/dravr-sciotte.git",
    "https://github.com/dravr-ai/dravr-canot.git",
    "https://github.com/dravr-ai/dravr-commere.git",
    "https://github.com/dravr-ai/dravr-tronc.git",
    "https://github.com/dravr-ai/dravr-equilibre.git",
    "https://github.com/dravr-ai/dravr-riviere.git",
    "https://github.com/dravr-ai/dravr-enforme.git",
    "https://github.com/dravr-ai/dravr-meteo.git",
    "https://github.com/dravr-ai/dravr-stripe.git",
    "https://github.com/dravr-ai/dravr-contremaitre.git",
    "https://github.com/dravr-ai/dravr-photograveur.git",
    "https://github.com/dravr-ai/dravr-barrage.git",
]
# Allow these specific registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
