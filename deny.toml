# ABOUTME: Security and dependency validation configuration for cargo-deny
# ABOUTME: Replaces custom cargo-audit bash scripting with native cargo-deny tool

# ============================================================================
# Advisory Database - Security Vulnerability Scanning
# ============================================================================
# Replaces: cargo audit --ignore RUSTSEC-2023-0071 --no-fetch --color always
[advisories]
version = 2
# Ignored advisories with risk assessment and mitigation plans
ignore = [
    # -------------------------------------------------------------------------
    # RUSTSEC-2023-0071: RSA 0.9.x - Marvin Attack (timing sidechannel)
    # -------------------------------------------------------------------------
    # Severity: 5.9/10 (Medium)
    # Crate: rsa 0.9.8
    # Issue: Potential key recovery through timing sidechannels during decryption
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2023-0071
    #
    # Risk Assessment: LOW for our usage
    # - Only used for JWT signing/verification (RS256) in
    #   crates/pierre-auth/src/admin/jwks.rs
    # - NOT used for decryption operations (primary attack vector)
    # - Admin-only feature with limited attack surface
    # - 4096-bit RSA keys provide additional security margin
    #
    # Mitigation:
    # - Monitor for rsa 0.10.0 stable release (currently RC)
    # - Upgrade to 0.10.0 when stable (fixes this vulnerability)
    # - Consider Ed25519 migration for future admin tokens (faster, smaller keys)
    #
    # Status: Accepted risk until stable fix available
    # Reviewed: 2026-08-12 — Cargo.lock still pins rsa 0.9.10, so 0.10 stable
    #   has not been adopted; the assessment above is unchanged.
    # Next Review: 2026-11-12
    "RUSTSEC-2023-0071",

    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0097: rand unsound with a custom `log` logger using rand::rng()
    # -------------------------------------------------------------------------
    # Severity: Unsound (UB only under very specific conditions)
    # Affected in-tree version: rand 0.8.6 (transitive via jsonwebtoken, rsa,
    # dravr-enforme). We use `tracing` + `tracing-subscriber`, not a custom
    # `log::Log` impl, so the preconditions for the unsoundness are not met.
    # Upgrade blocked on upstream crates (jsonwebtoken rand-0.9, rsa 0.10 stable).
    #
    # Reviewed: 2026-08-12 — `cargo tree -i rand@0.8.6` still shows jsonwebtoken
    #   (now 10.3.0) as the sole first-hop dependent, so the named blocker is
    #   unchanged despite the major-version bump. rand 0.9.4 and 0.10.2 are also
    #   in the lock for other consumers; only the 0.8.x line is affected.
    # Next Review: 2026-11-12
    "RUSTSEC-2026-0097",

    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0194 + RUSTSEC-2026-0195: quick-xml 0.26 parser DoS
    # -------------------------------------------------------------------------
    # Severity: DoS only (quadratic duplicate-attribute check; unbounded
    # namespace-declaration allocation in NsReader). Both are XML *parsing*
    # paths fed by attacker-controlled input.
    # Affected in-tree version: quick-xml 0.26.0, dev-dependencies ONLY
    # (pprof -> inferno flamegraph writer for criterion benches). It never
    # compiles into the shipped binary, and the bench path only *writes* SVG —
    # no untrusted XML is ever parsed.
    # Upgrade blocked on upstream: fix is quick-xml >= 0.41; pprof 0.15 (latest)
    # still pins inferno 0.11, which requires quick-xml ^0.26.
    # Remove when pprof ships an inferno with quick-xml >= 0.41.
    #
    # Reviewed: 2026-08-12 — lock still shows quick-xml 0.26.0 under
    #   pprof 0.15.0 -> inferno 0.11.21, i.e. the upstream chain is unchanged
    #   and the dep is still dev-only (never in the shipped binary).
    # Next Review: 2026-11-12
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

# Warn on yanked crates
yanked = "warn"

# ============================================================================
# License Validation - Ensure Only Approved Open Source Licenses
# ============================================================================
[licenses]
# Allow OSI-approved permissive licenses used by dependencies
allow = [
    "MIT",                    # Most common permissive license
    "Apache-2.0",             # Apache license
    "Unicode-3.0",            # ICU Unicode libraries
    "ISC",                    # ring/untrusted crypto libraries
    "CDLA-Permissive-2.0",    # webpki-roots TLS certificates
    "BSD-3-Clause",           # BSD license (crypto: curve25519, ed25519, redis, subtle, instant)
    "MPL-2.0",                # Mozilla Public License (option-ext)
    "Zlib",                   # zlib license (foldhash)
    "OpenSSL",                # OpenSSL license (aws-lc-sys crypto backend)
    "CC0-1.0",                # Creative Commons Zero (dunce path canonicalization)
    "MIT-0",                  # MIT No Attribution (dunce path canonicalization)
    "Apache-2.0 WITH LLVM-exception",  # LLVM runtime (ring crypto backend)
    "0BSD",                   # Zero-clause BSD (lettre email dependencies)
]
# Confidence threshold for license detection
confidence-threshold = 0.93
# Allow certain licenses for exceptions (if needed in future)
exceptions = []

# ============================================================================
# Dependency Bans - Prevent Problematic Dependencies
# ============================================================================
[bans]
# Warn on multiple versions of the same dependency (bloats binary).
#
# Note: dravr-* duplicates are gated separately and HARD-FAILED by the
# `dravr-* duplicate check` step in .github/workflows/ci-backend.yml's
# security-audit job (cargo tree -d filtered for dravr-*). The general
# `multiple-versions = "warn"` setting here keeps non-dravr drift visible
# without blocking on transitive splits we cannot fix; the dravr ecosystem
# is held to a stricter standard via the dedicated CI step.
multiple-versions = "warn"
# Deny wildcard dependencies (bad for reproducibility)
wildcards = "deny"
# Highlight dependencies that are not on crates.io
highlight = "all"
# Workspace-wide dependency management
workspace-default-features = "allow"
# External default features
external-default-features = "allow"
# Allow wildcard versions for git/path dependencies in private crates
# (embacle is an internal git dep without a crates.io version)
allow-wildcard-paths = true
# Allow build dependencies
allow = []
# Deny specific crates (if needed)
deny = []
# Skip these dependencies from multiple-version checking.
# winnow: cron 0.15 uses winnow 0.6, dravr-sciotte's toml 0.8 uses winnow 0.7.
skip = [
    { crate = "winnow", reason = "transitive version split between cron and toml_edit" },
]
# Skip tree checking for these dependencies
skip-tree = []

# ============================================================================
# Source Validation - Only Allow Trusted Registries
# ============================================================================
[sources]
# Deny unknown Git repositories (prevent supply chain attacks)
unknown-git = "deny"
# Deny unknown registries (only allow crates.io)
unknown-registry = "deny"
# Allow these specific Git repositories (if needed for specific deps)
allow-git = [
    "https://github.com/dravr-ai/dravr-embacle.git",
    "https://github.com/dravr-ai/dravr-cageux.git",
    "https://github.com/dravr-ai/dravr-sciotte.git",
    "https://github.com/dravr-ai/dravr-canot.git",
    "https://github.com/dravr-ai/dravr-commere.git",
    "https://github.com/dravr-ai/dravr-tronc.git",
    "https://github.com/dravr-ai/dravr-equilibre.git",
    "https://github.com/dravr-ai/dravr-riviere.git",
    "https://github.com/dravr-ai/dravr-enforme.git",
    "https://github.com/dravr-ai/dravr-meteo.git",
    "https://github.com/dravr-ai/dravr-stripe.git",
    "https://github.com/dravr-ai/dravr-contremaitre.git",
    "https://github.com/dravr-ai/dravr-photograveur.git",
]
# Allow these specific registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
