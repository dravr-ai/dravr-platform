  - name: satellite-drift-gate-scheduled
    surface: .github/workflows/satellite-drift.yml
    current: split. The offline half (satellites.toml vs the manifests, plus the out-of-scope pin guard) gates every push as pre-push Tier 1j and in ci-backend fast-gate. The release comparison stays daily
    advance_when: nothing further. The original criterion (cageux current, scan clean) was met on 2026-09-10 and the advance was taken, but not as written — see the note below. Close this entry at the next review unless the daily lane starts missing real drift
    review_by: 2026-11-15
  - name: frontend-dual-origin-window
    surface: infra/environments/dev/terraform.tfvars
    current: frontend_base_url is https://app.dravr.ai (cut over 2026-09-21, revision dravr-mcp-server-api-01125-dgg) and frontend_previous_origins still carries the generated run.app frontend host, so MCP_ALLOWED_ORIGINS accepts both origins and ALLOWED_MOBILE_REDIRECT_ORIGINS keeps the run.app one — mobile builds in the field were built with EXPO_PUBLIC_API_URL pointing at run.app and keep working through it. The Firebase authorized domains, the Google OAuth client and infra/modules/firebase/MANUAL_STEPS.tf list both hosts for the same reason. Plan and verification record in dravr-vault Work Log 2026-09-21 Frontend Custom Domains. Reviewed 2026-10-09 (carnet#793) — the two weeks are over (2026-10-05), the release is not. The last store build is Deploy TestFlight run 35224013203 (2026-09-17, iOS production, 49a420e66), four days before c3e8d95f3 moved EXPO_PUBLIC_API_URL, and mobile-testflight.yml has not run since; Android has never been submitted to Play (its submit step is skipped). The only publish after the cutover is Mobile OTA run 36221050609 (2026-09-26) to the preview channel, which reaches no production phone, and the Expo SDK 57 upgrade (carnet#625) changed the native fingerprint, so the 2026-09-17 binary cannot take a production OTA either — every production install still dials run.app
    advance_when: one store build made after c3e8d95f3 has shipped — a mobile-testflight.yml dispatch on main with profile production and submit on, whose EAS production environment holds EXPO_PUBLIC_API_URL https://app.dravr.ai, released through TestFlight (and Play once Android submits). That dispatch is metered and is ChefFamille's to trigger; the run id goes on this entry. Then, in one change, empty frontend_previous_origins and remove the CURRENT VALUES run.app lines of infra/modules/firebase/MANUAL_STEPS.tf, and delete this entry; the operator steps that follow are ChefFamille's — terraform apply of infra/environments/dev (the deploy-infra skill, it does not ride the app deploy), and removing the run.app host from Firebase authorizedDomains and the Google OAuth client in project dravr-dev-8d4a3. The run.app hostname itself stays reachable because Cloud Run always serves it
    review_by: 2026-10-30
  - name: provider-exposure-notice
    surface: crates/pierre-services/src/provider_notice.rs
    current: FeatureKey ProviderExposureNotice defaults off, so a TrainingPeaks or COROS login asks for no account-risk notice and records no acceptance; only the seeded e2e accounts (webtest, mobiletest) are armed. The notices, their five-locale copy, the per-provider acceptance record and the login refusal are complete and run for any account the flag arms, per tenant or per user (pierre-cli tenant|user set-feature --key provider_exposure_notice). WHOOP's owner authorization is not part of this entry: its notice is NoticeAudience::EveryAccount in PROVIDER_NOTICES, asked of every account and gating persistence whatever the flag says (ChefFamille 2026-09-25, carnet#539 point 2)
    advance_when: the first athletes who are not demo accounts are onboarded onto TrainingPeaks or COROS. Arming is an operator action, not a repo change - ChefFamille runs pierre-cli tenant set-feature --email <a user of that tenant> --key provider_exposure_notice --enabled true for each onboarding tenant as it is created (ChefFamille, 2026-09-24 - the demo does not need it, onboarding does), then decides whether the flag becomes the compile default. Re-dated at the 2026-10-09 review because the condition has not occurred. Evidence - the vault COROS Integration and TrainingPeaks Pipe Choice feature notes both carry alpha_users empty, the external alpha cohort is three testers (project_alpha_cohort_is_three_testers) with no TrainingPeaks or COROS connection recorded, and the validation cohort is planned to onboard in November 2026 (SOM v6.8, plan month 1 is November 2026). Still unverifiable from the repo - whether any of the three existing external testers has connected TrainingPeaks or COROS on prod since 2026-09-24 (a prod query of the per-provider connections by non-demo user, ChefFamille). The new date falls before the November onboarding so the tenant default is set as the cohort's tenants are created rather than after their first login
    review_by: 2026-10-30
  - name: agents-md-standards-review
    surface: .savoir/platform/coding-standards.md
    current: two-week pilot of the carnet#660 split — AGENTS.md holds acting rules and seven hard stops, the coding standards live in .savoir/platform/coding-standards.md and are read only by the review-standards skill before every squash, and bilan caps at 8 on a pushed commit with no Reviewed-Standards trailer
    advance_when: after two weeks, standards-related CI reds and post-squash rework have not risen and review findings are fixed before merge — then adopt; revert (one commit, the text only moved) if a violation reaches main that the old AGENTS.md would have prevented
    review_by: 2026-10-14
  - name: route-km-markers
    surface: crates/pierre-core/src/feature_flags.rs
    current: FeatureKey RouteKmMarkers defaults off, so no recorded map draws start, finish or distance markers. The markers are complete on web and mobile for a run, trail run, walk or hike on Home's latest activity and the activity view (every kilometre up to 15 km, every 5 km past it), and render for any account the flag arms per user (pierre-cli user set-feature --key route_km_markers). They count kilometres only - the platform holds no unit preference, though the shared routeMarkers helper already counts miles (carnet#807)
    advance_when: the alpha cohort (Phil, JF, David) has used it through the PostHog early-access feature and survey with no clutter or placement complaint, then the default flips on and this entry is deleted
    review_by: 2026-11-07
  - name: mobile-attestation-enforcement
    surface: crates/pierre-routes-auth/src/token_grant.rs
    current: observe mode on the dravr-mobile code exchange (carnet#810). Evidence that is sent must verify — App Attest from iOS, a Play Integrity token from Android, either refused as 400 invalid_client with the code left unspent — but evidence is optional, so a sign-in with none (app_attest=absent) and one whose Play Integrity token Google could not be asked about (app_attest=unavailable, a mint failure, a network error or a non-400 answer) are both accepted. Evidence that verified but whose App Attest key or counter could not be recorded after the code was redeemed is logged (app_attest=unrecorded) and the sign-in proceeds, since the code is spent by then. The app_attest span field on the oauth2_token route records the share of each outcome
    advance_when: both store apps send verified evidence on dev and prod, and the absent and unavailable shares on the app_attest span are near zero over a week of mobile sign-ins (an unavailable share that is not an outage is read as a 403 from Google before arming). Then a mobile exchange without verified evidence is refused, and a failed record after redemption becomes fatal (recorded before redemption in the same transaction), in one change with the clients' handling of that refusal
    review_by: 2026-11-30
  - name: anthropic-api-chain-head
    surface: infra/environments/dev/main.tf
    current: the anthropic provider (the Anthropic Messages API, Haiku 5.5 by default, pooled over ANTHROPIC_API_KEY_2, _3 and on as anthropic#2, anthropic#3) is complete and selectable as any PIERRE_LLM_CHAIN entry, and its two Secret Manager slots and the tier-quota alert labels exist, but dev's chain does not name it and the anthropic-api-key secrets are deliberately not bound to the service — embacle's claude_code runner passes ANTHROPIC_API_KEY through to the claude CLI, which would move the claude_code tiers off their subscription (carnet#875 Phase B)
    advance_when: the organization keys are filled, a Console spend limit is set on every organization before the apply, the claude_code runner no longer passes ANTHROPIC_API_KEY to the CLI, a live tool-loop run shows the head falling through to anthropic#2 and copilot_sdk, and the chat and messaging evals pass on Haiku 5.5 — then the secrets are bound and anthropic=claude-haiku-5-5 leads dev's PIERRE_LLM_CHAIN
    review_by: 2026-11-15
  - name: incident-judge-findings-gate
    surface: crates/pierre-server/tests/helpers/live_incident_corpus.rs
    current: the live incident lane reports the LLM judge's Honest verdicts but never reds on them (Expect gates returns false for Honest). Until 2026-10-14 the judge graded against distance ranges with no dates, so it flagged correct replies (challenged_claim on every run); it now grades against a dated ledger of every seeded activity plus the connection state
    advance_when: several consecutive nightly runs of Eval Live Incident Corpus on the dated ledger report no Honest finding that a reading of the delivered reply shows to be a correct answer, then Honest leaves the ungated set in Expect gates so a reproduced judge finding reds the lane (decision with JF, 2026-10-14)
    review_by: 2026-10-28
  - name: signup-self-activation
    surface: crates/pierre-services/src/signup_policy.rs
    current: self-serve sign-up ships bounded but not self-activating (carnet#1063). The kill switch (system_settings signup_open, absent means open) and the 24-hour ceiling (signup_daily_limit, default 100, counted from users.created_at) are armed on every self-serve door, and SIGN_UP_RATE_LIMIT_RPM (default 5 per client address per minute) meters the register form, the link page and verification resends. Two parts ship off. signup_activate_on_verified_email defaults false, so a proven address leaves a self-registered account Pending for review exactly as before. The Turnstile bot check is on only where TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY are both set, and no environment sets them yet. Both are complete and armable without a deploy for the setting (pierre-cli settings signup set or the admin console), and with an env change for the keys
    advance_when: Turnstile keys are issued for the deployed hostnames and set on the service, the admin console reports the bot check configured, and a week of sign-ups stays inside the ceiling with no scripted burst in the signup refusal warn lines. Then an operator runs pierre-cli settings signup set --activate-on-verified-email true, which is what opens sign-up to proven addresses without AUTO_APPROVE_USERS
    review_by: 2026-11-30
