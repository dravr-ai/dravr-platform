# ABOUTME: Dark-launch register — every feature shipped disarmed (flag off, shadow mode, Log-only phase)
# ABOUTME: Fixed-shape file parsed by grep/awk in architectural-validation.sh and feature-phase-review.yml
#
# Format (fixed indentation, one line per key — the parsers depend on it):
#   - name: kebab-case-feature-name
#     surface: path/to/the/flag/or/mode.rs
#     current: what ships today (the disarmed state)
#     advance_when: the criterion that arms the next phase
#     review_by: YYYY-MM-DD
#
# The weekly "Monitor: Feature Phase Review" workflow opens a GitHub issue for
# any entry whose review_by has passed. Advancing a phase or re-dating the
# review both happen by editing this file. Keep values free of ": " and " #"
# so the unquoted scalars stay parseable.

features:
  - name: guardian-tainted-destructive-confirm
    surface: crates/pierre-tool-runtime/src/guardian/policy.rs
    current: tainted_destructive defaults to Log (Phase 1 base-rate measurement) — Confirm HITL (/confirm·/deny) is fully implemented and runtime-armable via the guardian settings surface. Until the 2026-10-09 review the Log phase recorded nothing (Guardian decide let the call through to Allow with no log line, so guardian_gate only ever logged denials and confirms), which is why no base rate exists yet. That review added the missing record in guardian/mod.rs — a warn line "guardian logged tainted-destructive dispatch" carrying rule tainted_destructive, phase log, tool_name, taint_sources and tenant_id — and the measurement window starts the day it deploys
    advance_when: three weeks of deployed traffic after the Log-phase warn line ships, read from Cloud Logging (needs GCP auth, so ChefFamille or an operator pulls it) and grouped by tool_name and taint_sources, gives a per-turn base rate and a sample of flagged turns adjudicated as legitimate or injected; if the legitimate share is low enough that a /confirm prompt is not noise, an operator arms it with pierre-cli settings guardian set (tainted_destructive confirm) — a runtime settings change, not a repo change, and nothing on Cloud Run or in terraform needs to move. Re-dated at the 2026-10-09 review because the telemetry the criterion reads did not exist
    review_by: 2026-11-13
  - name: guardian-plan-then-verify
    surface: crates/pierre-tool-runtime/src/guardian/policy.rs
    current: plan_mode defaults to Off — runtime-armable via the guardian settings surface and covers every provider class incl. the headless ACP path when armed
    advance_when: plan-mode telemetry from staged runs shows task-completion parity with ReAct, then an operator flips the mode via pierre-cli settings guardian set
    review_by: 2026-10-31
  - name: persona-conformance-strict-mode
    surface: crates/pierre-chat-pipeline/src/stages/persona_conformance.rs
    current: power_athlete has run strict since 2026-08-12 and coach inherits it through the child-or-parent overlay; casual and enthusiast still run shadow mode (strict_mode false) — their violations are warn logs and the reply ships unchanged. carnet#827 (8f01c882e, 2026-10-07) moved every user whose coaching_persona was coach to casual, so coaches' own turns left the strict rewrite path and now feed the casual shadow logs. The re-prompt recovery is built and wired, so arming either remaining persona is a per-persona data change in contremaitre
    advance_when: a week of post-carnet#827 dev traffic shows the casual or enthusiast shadow violations (the persona_conformance warn lines, grouped by persona and rule in Cloud Logging) are stable and each firing rule is a true drift rather than a checker false positive, then set strict_mode true for that persona in contremaitre persona_contracts.yaml. Re-dated at the 2026-10-08 review because the evidence is prod shadow logs, which the review session could not read, and the post-carnet#827 window is one day old.
    review_by: 2026-10-31
  - name: progressive-text-deltas-acp-only
    surface: crates/pierre-chat-pipeline/src/surface_profile.rs
    current: both in-app surfaces resolve ProgressiveSupport::DeltaChannel and the SSE body is real, but TurnEvent::ProseDelta has exactly one producer — run_headless_streaming in the SDK-tool-calling (Copilot ACP) branch. On every function-calling provider (Gemini, Cohere, Groq, OpenRouter, OpenAI-compatible) an in-app turn emits zero deltas and the athlete reads the terminal done frame only. The crossing in tool_dispatch keeps the claim honest — no sink is installed on a provider that cannot fill it — rather than papering over the gap.
    advance_when: the function-calling providers gain a streaming completion path that feeds TurnEvent::ProseDelta from run_api_tool_loop, at which point ProviderStreaming::from_sdk_tool_calling stops being the whole answer and reads a real per-provider streaming capability instead. Two narrower cases resolve with the same change and are named here so they are not rediscovered as bugs: PlanMode::Enforce returns from run_planned_tool_loop before run_react_tool_loop, so an armed guardian on an ACP turn installs a sink nothing fills; and a provider advertising both FUNCTION_CALLING and SDK_TOOL_CALLING would take the api-loop arm while from_sdk_tool_calling still answered TextDeltas. Neither is reachable in shipping config — guardian plan_mode defaults Off, and no provider in the graph advertises both — and both fail toward an unfilled sink, which is the pre-change behaviour rather than a new one
    review_by: 2026-11-30
  - name: surface-render-capabilities-unarmed-blocks
    surface: crates/pierre-chat-pipeline/src/surface_profile.rs
    current: three of the seven BlockSupport capabilities resolve but no production decision reads them yet — verdict_chips (the web client already draws the chips off persisted verdicts, but the prose WarnBanner is still appended on every surface, so the reply duplicates them there), reconnect_cta (true on all six surfaces today, so auth_recovery has nothing to branch on), and RenderCapabilities.interactive (resolves to the same answer as blocks.action_buttons on every surface shipping today). The armed capabilities — prose, max_reply_chars, workout_plan_card, activity_list_card, scene_inline, scene_raster, action_buttons — each gate a live decision.
    advance_when: the WarnBanner suppression lands behind verdict_chips so a chip-capable surface stops repeating itself in prose, a surface ships that carries no reconnect prompt in the reply body, and interactive either gains a back-channel decision of its own or is deleted as a duplicate of action_buttons
    review_by: 2026-10-31
  - name: billing-surface-disarmed
    surface: frontend/src/constants/features.ts and frontend-mobile/src/constants/features.ts and crates/pierre-core/src/feature_flags.rs
    current: billing ships behind two independent gates. The build-time gate hides every nav entry point — the admin Billing tab and the user Usage tab on web, the Settings billing row and the /(app)/billing route on mobile — and reads VITE_BILLING_ENABLED on web and EXPO_PUBLIC_BILLING_ENABLED on mobile, both defaulting false. Behind it the runtime FeatureKey::BillingHeader also defaults false, so even an armed build shows the Usage screen without the Current Plan and upgrade card. The pages, the api-client methods and the admin per-user usage endpoints are all real and the web E2E suite exercises them with the build flag on, so nothing here is a stub — it is a finished surface with no paid plans behind it yet
    advance_when: paid plans are live and a tenant is wired to a billing provider, at which point the build-time flag is deleted rather than defaulted true (it exists only to hide an unreachable surface) and BillingHeader is flipped per tenant by an operator through the admin feature-flag surface
    review_by: 2026-11-30
  - name: persona-notification-policy
    surface: crates/pierre-notifications/src/lib.rs
    current: shadow mode — FeatureKey PersonaNotificationPolicy defaults false, so dispatch_with_tier resolves every recipient's persona policy but only logs a structured shadow verdict (persona, notification_type, event_tier, floor, would_gate) and every notification still delivers. The armed path is fully built and per-tenant/per-user flippable — a push above the persona floor is persisted with a persona_gated data marker and skips Expo push and the channel sink, and the persona digest returns every held row exactly once, as a localized P0 digest on the contract's cadence — daily and weekly on the scheduler's daily tick, per_athlete on that tick as one digest per athlete the held rows concern, and per_session when the athlete's next training session lands through the activity-cache write-through
    advance_when: shadow verdicts are stable with zero would-gate P0 suppressions across a week of dev traffic, then an operator arms PersonaNotificationPolicy per tenant or user through the admin feature-flag surface
    review_by: 2026-10-31
  - name: api-tokens-surface-disarmed
    surface: crates/pierre-core/src/feature_flags.rs
    current: FeatureKey::ApiTokens defaults false, so GET /api/me/features answers false for every user with no tenant or per-user row. Both clients read that one answer and it gates two panes — the MCP tokens pane (personal tokens for Claude Desktop or Cursor) and the API keys pane (keys the athlete's own scripts use, tier taken from users.tier). On web both are filtered out of the Settings tab list and snap back to Profile if the flag drops while the user sits on one; on mobile both settings rows are hidden the same way. The mint, list and revoke endpoints behind both are live and admin-flippable per tenant or per user, so an operator can arm them for a single athlete today
    advance_when: the MCP tokens and API keys panes have run armed for a tenant without a support incident and the lifecycle of both credentials (expiry, revocation, rotation) is documented for athletes, at which point default_enabled returns true for ApiTokens and the per-user overrides become the exception rather than the only way in
    review_by: 2026-10-31
  - name: training-plan-readiness-rail
    surface: crates/pierre-tool-runtime/src/implementations/training_plan_readiness.rs
    current: Log-only — every adjusted week still holding days the athlete can change is read against the flavour's readiness ladder. The nine alert labels the agent bodies publish are derived in dravr-cageux from the training-history, recovery and sleep feeds; those labels plus form, acwr, monotony and ramp clear a P0..P3 level; the level names the days whose purpose it no longer allows and the hard-session count it permits. Nothing is substituted and nothing refuses a save. The verdict is logged for the base-rate measurement and returned to the agent on get_training_plan when it passes include_state, so an agent adjusting a plan can read the level before writing rather than after. Two of the nine labels stay unraised here by design: intensity-skew is the compliance rail's input and calibration-stale the calibration walk's, and raising either from partial data would be worse than not raising it.
    advance_when: 30 saved fortnights measured Log-only, the same count the compliance rail waits on, plus agreement that the substitutions the rail names are ones a coach would have made. The ladder has never run against real traffic; arming it to warn before anyone has read what it would have said is arming a rule nobody can argue with. First step after the count is warn on the prompt's phase header, not refusal — a substitution the athlete disagrees with is a conversation.
    review_by: 2026-10-31
  - name: training-plan-week-compliance-rail
    surface: crates/pierre-tool-runtime/src/implementations/training_plan_compliance.rs
    current: Warn on the two safety-shaped checks, log-only on the rest — every saved week is measured by dravr-cageux assess_week_compliance against its phase's targets and its flavour's caps (time in zone, hard-session count, spacing between hard sessions, template parameter ranges, hours against the volume target) and every verdict is reported as training_plan.week_assessed with each check reading within, off or unmeasured. Nothing refuses a save. TWO of the checks now also reach the turn: save_training_plan returns `safety.crowded_weeks` when a week's hard sessions sit closer together than the minimum (carrying the minimum applied and which gaps were short) and `safety.ramp` when the opening week exceeds the athlete's recent weekly hours by more than the threshold. Structured, never prose: the framing rules on load ratios are CI-enforced and live in the prompt, so the agent writes the sentence and the platform carries only what it measured. The field is absent when both read within or unmeasured. A coach's save into their draft of an athlete's plan returns the same field, measured on the draft over the athlete's live weeks, and emits no training_plan.week_assessed; publishing the draft runs the rail on the athlete's plan. Time in zone, volume against target and template parameter ranges stay log-only — they are coaching judgements the agent already owns, and a platform volunteering them would be second-guessing the plan rather than flagging a risk. The verdict is also returned to the agent on get_training_plan when it passes include_state
    advance_when: the compliance base rate is measured over 30 saved fortnights of dev and alpha traffic and unclassified_days is not the dominant reading, at which point spacing and ramp graduate from a warn the agent may state to a REFUSAL that fails the save, and the ledger entry is re-dated or retired. Two notes for whoever reads this next. The warn half shipped ahead of the base rate deliberately: it is agent-facing on the turn the save happens, so a false positive costs a sentence the agent may decline to write, where a false refusal would cost the athlete their plan — the asymmetry is what made it safe to arm early. And the unclassified_days half of this criterion is not a waiting game: a day is unclassified when no template resolves for it, so if agents keep writing prose days the criterion can never be met however many fortnights accumulate. The work it points at is getting days to carry templates, which is not this entry
    review_by: 2026-10-31
