[workspace]
resolver = "2"
members = ["crates/*"]

# ============================================================================
# Build Profiles
# ============================================================================

[profile.dev]
debug = 1
opt-level = 0
overflow-checks = true
# Store debug info in separate files to reduce linker work.
# On Linux this avoids the expensive step of merging debug info into the binary.
# On macOS this is already the default behavior (dsymutil runs separately).
split-debuginfo = "unpacked"

# Cryptographic dependencies are optimized in dev and test builds.
#
# These crates are pure-Rust implementations of deliberately expensive
# functions, so at opt-level 0 the whole test suite pays their cost: every test
# that creates a user, registers an OAuth2 client, or mints an RS256 token.
# Argon2::default() sits on the OAuth2 client registration and secret
# verification path, and bcrypt hashing runs on every admin token mint.
#
# Measured on rustc 1.96.0 with only this override changed:
#   argon2id, Argon2::default() (19 MiB, t=2)   2.185s -> 0.026s
#   bcrypt, DEFAULT_COST (12)                  10.965s -> 1.28s
#   RSA-2048 key generation                    24.611s -> 0.87s
#
# Named one crate at a time rather than through package."*" for two reasons.
# rustc stops sharing monomorphized generics across crates at opt-level >= 2,
# so a graph-wide override pushes generic instantiation into the workspace
# crates -- and rust-cache runs with cache-workspace-crates off, so those
# recompile on every CI run and the cost would never amortize. A graph-wide
# override also invalidates every dependency unit at once; this list
# invalidates eleven (the ten below plus jsonwebtoken, which depends on rsa).
# sha2, hmac, digest and num-traits are left alone on purpose: they carry
# fifteen to forty-three reverse-dependencies each, against two to four for
# everything here.
#
# Only opt-level moves. debug-assertions and overflow-checks are not
# overridden, so cargo still passes -C debug-assertions=on to these crates and
# their runtime checks behave exactly as before. No security parameter changes:
# production hashing costs are whatever bcrypt::DEFAULT_COST and
# Argon2::default() say, and [profile.release] is not read by any of this.
[profile.dev.package.argon2]
opt-level = 2

[profile.dev.package.blake2]
opt-level = 2

[profile.dev.package.bcrypt]
opt-level = 2

[profile.dev.package.blowfish]
opt-level = 2

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2

[profile.dev.package.aes]
opt-level = 2

[profile.dev.package.aes-gcm]
opt-level = 2

[profile.dev.package.ghash]
opt-level = 2

[profile.dev.package.polyval]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
# Unwind (NOT abort): this is an always-on multi-tenant server. A panic in one
# tenant's request must unwind and stay isolated at the task boundary (see the
# catch_unwind in the chat-pipeline worker), never abort the whole process and
# drop every other tenant's in-flight work.
panic = "unwind"
strip = true

[profile.release-lto]
inherits = "release"
lto = "fat"

# ============================================================================
# Workspace Lint Configuration
# ============================================================================
# Shared across all workspace crates via [lints] workspace = true.
# Individual crates inherit these settings automatically.
#
# ZERO TOLERANCE ENFORCEMENT:
#   Old: cargo clippy --all-targets --all-features -- \
#          -W clippy::all -W clippy::pedantic -W clippy::nursery -D warnings
#   New: cargo clippy (reads this config, applies level = "deny")
#
# All clippy warnings are now ERRORS via level = "deny" configuration below.

[workspace.lints.rust]
# STRICT UNSAFE CODE POLICY: Zero tolerance with whitelisted exceptions
# - "deny" level: Unsafe code is an ERROR by default everywhere
# - scripts/ci/architectural-validation.sh: Enforces ONLY src/health.rs can use unsafe (Windows FFI)
# - Any unsafe usage outside approved locations FAILS build immediately
# - Approved: Windows health monitoring FFI (GlobalMemoryStatusEx, GetDiskFreeSpaceExW)
unsafe_code = "deny"

# Warn on missing documentation for public APIs
missing_docs = "warn"

[workspace.lints.clippy]
# Base configuration: Enable all clippy lint groups at DENY level (zero tolerance)
# Priority -1 ensures these are applied first, then specific overrides below
# All clippy warnings are treated as ERRORS via level = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# ============================================================================
# Critical Denials - Error Handling Anti-Patterns (CLAUDE.md enforcement)
# ============================================================================
# These replace the bash script's error handling pattern detection

# DENY: .unwrap() in production code (except test/bin with "// Safe" comments)
unwrap_used = "deny"

# DENY: .expect() in production code (except test/bin with "// Safe" comments)
expect_used = "deny"

# DENY: panic!() in production code (only acceptable in tests/bins)
panic = "deny"

# ============================================================================
# Allowed Exceptions (Per CLAUDE.md Policy)
# ============================================================================
# Type conversion casts - allowed when properly validated
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Const fn suggestions - clippy suggests const for methods that can't actually be const
# (e.g., methods using .to_lowercase(), .map_or(), Utc::now(), etc.)
missing_const_for_fn = "allow"

# Structural patterns - validated separately
struct_excessive_bools = "allow"

# Long functions - allowed with mandatory documentation comment
# Script validates: "// Long function:" or "// Safe:" comment required
too_many_lines = "allow"

# Significant drop tightening - false positives with async lock guards
# The suggestions given are often syntactically invalid
significant_drop_tightening = "allow"

# Cognitive complexity - warn on overly complex functions
# Enforces CLAUDE.md guideline of small, focused functions (max 50 lines)
cognitive_complexity = "deny"

# ============================================================================
# Additional Code Quality Lints
# ============================================================================
# Catch common performance issues
clone_on_copy = "warn"
redundant_clone = "warn"

# Catch async anti-patterns
await_holding_lock = "warn"

# Catch string allocation inefficiencies
str_to_string = "deny"

# Module naming - allow repetition for clarity (e.g., error::ErrorKind)
module_name_repetitions = "allow"

# ============================================================================
# Rust Idiom Enforcement (Prevent AI-generated regressions)
# ============================================================================
# Enforce modern format string syntax: format!("{foo}") not format!("{}", foo)
uninlined_format_args = "warn"

# Warn on .map().unwrap_or() - should use map_or() or is_some_and() instead
map_unwrap_or = "warn"

# Enforce `use` imports over inline qualified paths (crate::foo::bar)
# Idiomatic Rust prefers imports at top of file for readability
absolute_paths = "deny"

# Disallow anyhow::Context methods - use structured ProviderError types instead
# Configuration in clippy.toml specifies which methods are banned
disallowed_methods = "deny"
