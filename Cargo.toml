[workspace]
resolver = "2"
members = ["crates/*"]

# ============================================================================
# Workspace Dependencies
# ============================================================================
#
# Every dravr-* dependency is declared once, here, and inherited by members
# with `{ workspace = true }`. Before this table each pin was repeated at every
# crate that used it -- dravr-tronc at nine sites, cageux, sciotte and
# contremaitre at three each -- so "bump the X pin" was never one edit, and a
# half-moved pin either trips the duplicate-version gate or silently keeps the
# old revision alive in crates nobody remembered to change.
#
# Members may still add `features` (they are unioned with whatever is set here)
# and `optional`, so per-crate feature sets are unchanged by the move.
#
# dravr-equilibre appears twice on purpose: pierre-server and pierre-services
# take it under the alias `dravr-equilibre-sync`, and a rename has to be spelled
# in this table because `package` is not allowed beside `workspace = true`.

[workspace.dependencies]
# Shared server/MCP foundation. From crates.io; every consumer moves in lockstep
# because two tronc versions in the lockfile hard-fail the duplicate gate.
dravr-tronc = "6.5.0"

# Sports science engine -- VDOT, TSS, TRIMP, FTP, VO2max, recovery, nutrition.
dravr-cageux = { git = "https://github.com/dravr-ai/dravr-cageux.git", tag = "v0.43.0" }

# Messaging types and channel adapters.
dravr-canot = { git = "https://github.com/dravr-ai/dravr-canot.git", tag = "v0.9.2" }

# Activity history: kept originals, archive imports and the one FIT decoder.
# Its dravr-cageux pin is a companion of this one (see its satellites.toml
# stanza): the two move in one commit or Cargo.lock holds two.
dravr-barrage = { git = "https://github.com/dravr-ai/dravr-barrage.git", tag = "v0.11.0", default-features = false }

# Notification transport.
dravr-commere = { git = "https://github.com/dravr-ai/dravr-commere.git", tag = "v0.7.0" }

# Coach catalogue, locale strings and notify-event catalogue. Pinned by rev
# rather than tag; contremaitre-bump.yml advances it.
dravr-contremaitre = { git = "https://github.com/dravr-ai/dravr-contremaitre.git", rev = "1fb0efe2bc099da6d8b82ec2f11ed893abf776fe" }

# Health provider sync. default-features off so each consumer's own
# provider-* features select the backends.
dravr-enforme = { version = "0.16.0", git = "https://github.com/dravr-ai/dravr-enforme.git", tag = "v0.16.0", default-features = false }

# Health and wellness domain models.
dravr-equilibre = { git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.9.0" }
dravr-equilibre-sync = { package = "dravr-equilibre", git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.9.0" }

# Weather vendor logic.
dravr-meteo = { git = "https://github.com/dravr-ai/dravr-meteo.git", tag = "v0.8.1" }

# Chart geometry: resolves a persisted dravr-viz spec into a Scene.
photograveur = { git = "https://github.com/dravr-ai/dravr-photograveur.git", tag = "v0.6.1" }

# Time-series storage backend.
dravr-riviere = { git = "https://github.com/dravr-ai/dravr-riviere.git", tag = "v0.4.0" }

# Provider capture. Moves with dravr-enforme, which pins it too -- see its
# companions stanza in satellites.toml for why the two pins can never move apart.
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v1.0.4", default-features = false }

# Billing capability, gated behind the billing-stripe feature.
dravr-stripe = { git = "https://github.com/dravr-ai/dravr-stripe.git", tag = "v0.10.0" }

# Secret-holding config fields: Debug prints a redaction and reading the value
# takes an explicit expose_secret(), so no format of a config struct leaks one.
secrecy = { version = "0.10.3", features = ["serde"] }

# ============================================================================
# Build Profiles
# ============================================================================

[profile.dev]
debug = 1
opt-level = 0
overflow-checks = true
# Store debug info in separate files to reduce linker work.
# On Linux this avoids the expensive step of merging debug info into the binary.
# On macOS this is already the default behavior (dsymutil runs separately).
split-debuginfo = "unpacked"

# Cryptographic dependencies are optimized in dev and test builds.
#
# These crates are pure-Rust implementations of deliberately expensive
# functions, so at opt-level 0 the whole test suite pays their cost: every test
# that creates a user, registers an OAuth2 client, or mints an RS256 token.
# Argon2::default() sits on the OAuth2 client registration and secret
# verification path, and bcrypt hashing runs on every admin token mint.
#
# Measured on rustc 1.96.0 with only this override changed:
#   argon2id, Argon2::default() (19 MiB, t=2)   2.185s -> 0.026s
#   bcrypt, DEFAULT_COST (12)                  10.965s -> 1.28s
#   RSA-2048 key generation                    24.611s -> 0.87s
#
# Named one crate at a time rather than through package."*" for two reasons.
# rustc stops sharing monomorphized generics across crates at opt-level >= 2,
# so a graph-wide override pushes generic instantiation into the workspace
# crates -- and rust-cache runs with cache-workspace-crates off, so those
# recompile on every CI run and the cost would never amortize. A graph-wide
# override also invalidates every dependency unit at once; this list
# invalidates eleven (the ten below plus jsonwebtoken, which depends on rsa).
# sha2, hmac, digest and num-traits are left alone on purpose: they carry
# fifteen to forty-three reverse-dependencies each, against two to four for
# everything here.
#
# Only opt-level moves. debug-assertions and overflow-checks are not
# overridden, so cargo still passes -C debug-assertions=on to these crates and
# their runtime checks behave exactly as before. No security parameter changes:
# production hashing costs are whatever bcrypt::DEFAULT_COST and
# Argon2::default() say, and [profile.release] is not read by any of this.
[profile.dev.package.argon2]
opt-level = 2

[profile.dev.package.blake2]
opt-level = 2

[profile.dev.package.bcrypt]
opt-level = 2

[profile.dev.package.blowfish]
opt-level = 2

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2

[profile.dev.package.aes]
opt-level = 2

[profile.dev.package.aes-gcm]
opt-level = 2

[profile.dev.package.ghash]
opt-level = 2

[profile.dev.package.polyval]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
# Unwind (NOT abort): this is an always-on multi-tenant server. A panic in one
# tenant's request must unwind and stay isolated at the task boundary (see the
# catch_unwind in the chat-pipeline worker), never abort the whole process and
# drop every other tenant's in-flight work.
panic = "unwind"
strip = true

# What the server image, the release-binary size gate and release.yml build.
#
# codegen-units = 1 rather than the 16 `release` uses. Fat LTO merges every
# codegen unit into one module and optimises it serially whatever this is set
# to, so 16 units only split the pre-LTO stage, duplicating inlined code
# across units. Measured in CI with the shipped invocation (carnet#499,
# runs 38370038374 and 38392763517): on the same commit, pierre-mcp-server is
# 98.8 MiB at 1 against the gate's 111 MiB at 16. The rest is bridged across
# the two runs through `release`, which both built: the largest build process
# peaked at 6.4 GiB at 1 against 9.3 GiB at 16, and one cold build per side
# took 1.15x `release` at 1 against 1.31x at 16, so nothing shows 1 slower.
# scripts/ci/architectural-validation.sh requires codegen-units = 1 here, since
# the size gate would still pass with it dropped, and forbids it in `release`.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# What the benchmarks flamegraph job profiles (`cargo bench --profile flamegraph`).
#
# `cargo bench` uses the bench profile, which inherits `release`, so it is
# stripped: pprof then has no symbol table to name the frames it samples. This
# profile keeps release optimisation and adds what a profiler reads: full debug
# info for file and line, no stripping, and no LTO, so frames stay attributed to
# the function that wrote them instead of whatever LTO inlined them into. It is
# never shipped and never measured for timings, so its numbers are not
# comparable with the bench baseline.
[profile.flamegraph]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

# ============================================================================
# Workspace Lint Configuration
# ============================================================================
# Shared across all workspace crates via [lints] workspace = true.
# Individual crates inherit these settings automatically.
#
# ZERO TOLERANCE ENFORCEMENT:
#   Old: cargo clippy --all-targets --all-features -- \
#          -W clippy::all -W clippy::pedantic -W clippy::nursery -D warnings
#   New: cargo clippy (reads this config, applies level = "deny")
#
# All clippy warnings are now ERRORS via level = "deny" configuration below.

[workspace.lints.rust]
# STRICT UNSAFE CODE POLICY: Zero tolerance with whitelisted exceptions
# - "deny" level: Unsafe code is an ERROR by default everywhere
# - scripts/ci/architectural-validation.sh: Enforces ONLY src/health.rs can use unsafe (Windows FFI)
# - Any unsafe usage outside approved locations FAILS build immediately
# - Approved: Windows health monitoring FFI (GlobalMemoryStatusEx, GetDiskFreeSpaceExW)
unsafe_code = "deny"

# Warn on missing documentation for public APIs
missing_docs = "warn"

# ADR-027 as a compiler check: an item is `pub` only when another crate can
# reach it. Anything narrower is `pub(crate)` (carnet#1162).
unreachable_pub = "deny"

# Idiom lints rustc leaves allow-by-default (rust-lang/hashbrown enables most
# of this set), adopted with every hit fixed, none allowed (carnet#1162).
# missing_debug_implementations: every reachable type prints with Debug; a
# field holding a credential prints [REDACTED] through a hand-written impl.
# let_underscore_drop: an ignored value with a destructor (usually a Result)
# is an explicit decision, logged or drop()ped with a reason.
# single_use_lifetimes was measured and rejected: rustc documents false
# positives, and clippy's needless_lifetimes covers the useful part.
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# Base configuration: Enable all clippy lint groups at DENY level (zero tolerance)
# Priority -1 ensures these are applied first, then specific overrides below
# All clippy warnings are treated as ERRORS via level = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# ============================================================================
# Critical Denials - Error Handling Anti-Patterns (CLAUDE.md enforcement)
# ============================================================================
# These replace the bash script's error handling pattern detection

# DENY: .unwrap() in production code (except test/bin with "// Safe" comments)
unwrap_used = "deny"

# DENY: .expect() in production code (except test/bin with "// Safe" comments)
expect_used = "deny"

# DENY: panic!() in production code (only acceptable in tests/bins)
panic = "deny"

# ============================================================================
# Allowed Exceptions (Per CLAUDE.md Policy)
# ============================================================================
# Type conversion casts - allowed when properly validated
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Const fn suggestions - clippy suggests const for methods that can't actually be const
# (e.g., methods using .to_lowercase(), .map_or(), Utc::now(), etc.)
missing_const_for_fn = "allow"

# Structural patterns - validated separately
struct_excessive_bools = "allow"

# Long functions - allowed with mandatory documentation comment
# Script validates: "// Long function:" or "// Safe:" comment required
too_many_lines = "allow"

# Significant drop tightening - false positives with async lock guards
# The suggestions given are often syntactically invalid
significant_drop_tightening = "allow"

# Cognitive complexity - warn on overly complex functions
# Enforces CLAUDE.md guideline of small, focused functions (max 50 lines)
cognitive_complexity = "deny"

# ============================================================================
# Additional Code Quality Lints
# ============================================================================
# Catch common performance issues
clone_on_copy = "warn"
redundant_clone = "warn"

# Catch async anti-patterns
await_holding_lock = "warn"

# Catch string allocation inefficiencies
str_to_string = "deny"

# Module naming - allow repetition for clarity (e.g., error::ErrorKind)
module_name_repetitions = "allow"

# Contradicts rustc's `unreachable_pub` (denied above): inside a private module
# one asks for `pub(crate)`, the other for `pub`. ADR-027 narrows visibility to
# `pub(crate)`, so `unreachable_pub` wins (carnet#1162).
redundant_pub_crate = "allow"

# ============================================================================
# Rust Idiom Enforcement (Prevent AI-generated regressions)
# ============================================================================
# Enforce modern format string syntax: format!("{foo}") not format!("{}", foo)
uninlined_format_args = "warn"

# Warn on .map().unwrap_or() - should use map_or() or is_some_and() instead
map_unwrap_or = "warn"

# Enforce `use` imports over inline qualified paths (crate::foo::bar)
# Idiomatic Rust prefers imports at top of file for readability
absolute_paths = "deny"

# Disallow anyhow::Context methods - use structured ProviderError types instead
# Configuration in clippy.toml specifies which methods are banned
disallowed_methods = "deny"
