# ABOUTME: Norwegian singles flavour — the pace or heart-rate anchored, one-session-a-day sub-threshold reading of the Norwegian method
# ABOUTME: Same 70-78 / 20-25 / 3-5 split as threshold density without doubles or a meter; grey, community practice with no peer-reviewed evidence base
id: norwegian-singles-subthreshold
family: threshold
sequencing: linear
modifiers: []
evidence_tier: grey
caveat: "Community practice with no peer-reviewed evidence base: without lactate feedback the sessions are sub-threshold by pace or heart rate, and no controlled trial supports the model at recreational volumes."
tid_targets:
  base:
    z1: { min: 0.70, max: 0.78 }
    z2: { min: 0.20, max: 0.25 }
    z3: { min: 0.03, max: 0.05 }
  build:
    z1: { min: 0.70, max: 0.78 }
    z2: { min: 0.20, max: 0.25 }
    z3: { min: 0.03, max: 0.05 }
hard_sessions_per_week:
  min: 2
  max: 3
  recovery_limited_max: 2
  max_by_sessions_per_week:
    - { from_sessions: 10, max: 4 }
min_spacing_hours_between_hard: { default: 48, recovery_limited: 72 }
session_mix:
  base:
    endurance: 5
    endurance_long: 1
    threshold: 2
    neuromuscular: 1
    recovery: 1
    strength_maint: 1
  build:
    endurance: 4
    endurance_long: 1
    threshold: 2
    vo2max_long: 1
    recovery: 1
    strength_maint: 1
prerequisites:
  min_hours_per_week: 6.0
  min_sessions_per_week: 6
  measurement: [[pace], [hr], [power]]
  min_training_age_years: 1.0
contraindications: [novice_first_season, no_interval_experience, acute_injury]
loading_pattern: { default: "3:1", recovery_limited: "2:1" }
readiness_substitution:
  p0:
    purposes: [recovery]
    max_hard_sessions_per_week: 0
  p1:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint]
    max_hard_sessions_per_week: 0
  p2:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, threshold, vo2max_long, neuromuscular]
    max_hard_sessions_per_week: 1
  p3:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, threshold, vo2max_long, neuromuscular]
    max_hard_sessions_per_week: 3
max_weeks: null
evidence_refs:
  - evidence/sports_science/training_prescription/casado-2023-lactate-guided-threshold-model.md
