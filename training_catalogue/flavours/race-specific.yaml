# ABOUTME: Race-specific flavour — the final six to eight weeks before a goal race: one race-pace session, one Z3 session, a long session with race-pace segments
# ABOUTME: Base keeps the pyramidal split; build and peak follow event demand (marathon adds race-pace Z2, short events add Z3) with volume 10-20 percent lower
id: race-specific
family: polarized
sequencing: linear
modifiers: [race_simulation]
evidence_tier: review
caveat: null
tid_targets:
  base:
    z1: { min: 0.70, max: 0.80 }
    z2: { min: 0.15, max: 0.20 }
    z3: { min: 0.05, max: 0.10 }
  build:
    z1: { min: 0.70, max: 0.85 }
    z2: { min: 0.05, max: 0.20 }
    z3: { min: 0.05, max: 0.20 }
  peak:
    z1: { min: 0.70, max: 0.85 }
    z2: { min: 0.05, max: 0.20 }
    z3: { min: 0.05, max: 0.20 }
hard_sessions_per_week:
  min: 2
  max: 2
  recovery_limited_max: 1
  max_by_sessions_per_week:
    - { from_sessions: 6, max: 3 }
min_spacing_hours_between_hard: { default: 48, recovery_limited: 72 }
session_mix:
  base:
    endurance: 4
    endurance_long: 2
    tempo: 1
    threshold: 1
    vo2max_short: 1
    neuromuscular: 1
    recovery: 1
    strength_maint: 1
  build:
    endurance: 3
    endurance_long: 1
    race_specific: 2
    vo2max_long: 1
    recovery: 1
    strength_maint: 1
  peak:
    endurance: 3
    endurance_long: 1
    race_specific: 2
    vo2max_short: 1
    neuromuscular: 1
    recovery: 1
    strength_maint: 1
prerequisites:
  min_hours_per_week: 4.0
  min_sessions_per_week: 4
  measurement: [[pace], [power], [hr]]
  min_training_age_years: 1.0
contraindications: [novice_first_season, acute_injury]
loading_pattern: { default: "3:1", recovery_limited: "2:1" }
readiness_substitution:
  p0:
    purposes: [recovery]
    max_hard_sessions_per_week: 0
  p1:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint]
    max_hard_sessions_per_week: 0
  p2:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, threshold, vo2max_long, vo2max_short, neuromuscular]
    max_hard_sessions_per_week: 1
  p3:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, threshold, vo2max_long, vo2max_short, neuromuscular, race_specific]
    max_hard_sessions_per_week: 2
max_weeks: null
evidence_refs:
  - evidence/sports_science/training_prescription/haugen-2022-world-class-distance.md
  - evidence/sports_science/training_prescription/casado-2022-elite-runners-pyramidal-then-polarized.md
  - evidence/sports_science/training_prescription/seiler-2010-best-practice.md
