# ABOUTME: Foundation flavour — high-volume low-intensity training, every session easy plus one long session
# ABOUTME: Numbers from the TID Models note (Z1 >= 90 / Z2 <= 8 / Z3 <= 3); the fallback for beginners, returners and under four hours a week
id: hvlit-foundation
family: hvlit
sequencing: linear
modifiers: []
evidence_tier: cohort
caveat: null
tid_targets:
  base:
    z1: { min: 0.90, max: 1.00 }
    z2: { min: 0.00, max: 0.08 }
    z3: { min: 0.00, max: 0.03 }
  build:
    z1: { min: 0.90, max: 1.00 }
    z2: { min: 0.00, max: 0.08 }
    z3: { min: 0.00, max: 0.03 }
hard_sessions_per_week:
  min: 0
  max: 1
  recovery_limited_max: 0
  max_by_sessions_per_week: []
min_spacing_hours_between_hard: { default: 48, recovery_limited: 72 }
session_mix:
  base:
    endurance: 5
    endurance_long: 2
    recovery: 1
    neuromuscular: 1
    mobility: 1
    strength_aa: 1
  build:
    endurance: 4
    endurance_long: 2
    recovery: 1
    neuromuscular: 1
    tempo: 1
    mobility: 1
    strength_maint: 1
prerequisites:
  min_hours_per_week: 2.0
  min_sessions_per_week: 2
  measurement: [[rpe], [hr], [pace], [power]]
  min_training_age_years: 0.0
contraindications: []
loading_pattern: { default: "3:1", recovery_limited: "2:1" }
readiness_substitution:
  p0:
    purposes: [recovery]
    max_hard_sessions_per_week: 0
  p1:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint]
    max_hard_sessions_per_week: 0
  p2:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, neuromuscular]
    max_hard_sessions_per_week: 1
  p3:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, neuromuscular]
    max_hard_sessions_per_week: 1
max_weeks: null
evidence_refs:
  - evidence/sports_science/training_prescription/muniz-pumares-2025-marathon-tid-by-level.md
  - evidence/sports_science/training_prescription/casado-2021-world-class-distance.md
  - evidence/sports_science/training_prescription/festa-2019-polarized-vs-threshold-recreational.md
  - evidence/sports_science/training_prescription/seiler-2010-best-practice.md
