# ABOUTME: Polarized flavour — two Z3 sessions a week, one long easy session, everything else well below LT1, no tempo
# ABOUTME: Numbers from the TID Models prescriptive table (~80 / 0-5 / 15-20, PI > 2); a 6-12 week block for trained athletes, not a year-round identity
id: polarized-classic
family: polarized
sequencing: linear
modifiers: []
evidence_tier: meta_analysis
caveat: null
tid_targets:
  base:
    z1: { min: 0.80, max: 0.90 }
    z2: { min: 0.00, max: 0.05 }
    z3: { min: 0.10, max: 0.20 }
  build:
    z1: { min: 0.75, max: 0.85 }
    z2: { min: 0.00, max: 0.05 }
    z3: { min: 0.15, max: 0.20 }
  peak:
    z1: { min: 0.75, max: 0.85 }
    z2: { min: 0.00, max: 0.05 }
    z3: { min: 0.15, max: 0.20 }
hard_sessions_per_week:
  min: 1
  max: 2
  recovery_limited_max: 1
  max_by_sessions_per_week:
    - { from_sessions: 6, max: 3 }
    - { from_sessions: 10, max: 4 }
min_spacing_hours_between_hard: { default: 48, recovery_limited: 72 }
session_mix:
  base:
    endurance: 4
    endurance_long: 2
    vo2max_long: 2
    neuromuscular: 1
    recovery: 1
    strength_max: 1
  build:
    endurance: 3
    endurance_long: 2
    vo2max_long: 1
    vo2max_short: 1
    recovery: 1
    strength_maint: 1
  peak:
    endurance: 3
    endurance_long: 1
    vo2max_long: 1
    vo2max_short: 1
    race_specific: 1
    recovery: 1
    strength_maint: 1
prerequisites:
  min_hours_per_week: 4.0
  min_sessions_per_week: 4
  measurement: [[hr], [pace], [power]]
  min_training_age_years: 1.0
contraindications: [novice_first_season, no_interval_experience, acute_injury]
loading_pattern: { default: "3:1", recovery_limited: "2:1" }
readiness_substitution:
  p0:
    purposes: [recovery]
    max_hard_sessions_per_week: 0
  p1:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint]
    max_hard_sessions_per_week: 0
  p2:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, vo2max_long, vo2max_short, neuromuscular]
    max_hard_sessions_per_week: 1
  p3:
    purposes: [recovery, endurance, endurance_long, tempo, mobility, strength_aa, strength_maint, vo2max_long, vo2max_short, neuromuscular, race_specific, strength_max]
    max_hard_sessions_per_week: 2
max_weeks: 12   # TID note: a 6-12 week block; Silva Oliveira 2024: the advantage is confined to interventions under 12 weeks
evidence_refs:
  - evidence/sports_science/training_prescription/silva-oliveira-2024-polarized-meta-analysis.md
  - evidence/sports_science/training_prescription/stoggl-sperlich-2014-polarized.md
  - evidence/sports_science/training_prescription/rosenblat-2020-polarized-training.md
  - evidence/sports_science/training_prescription/seiler-2010-best-practice.md
  - evidence/sports_science/training_prescription/treff-2019-polarization-index.md
