# ABOUTME: Season skeleton for sprint and Olympic-distance triathlon: Friel's base-build-peak shape across three sports with bricks in the build and a 6-10 day taper
# ABOUTME: Every number traces to the Training Design KB (Periodization, Sport Systems, TID, Strength notes); practitioner sources are marked grey in comments
# A phase `length` is exactly one of: { fixed_weeks: N } | { fixed_days: N } | { share_of_weeks_to_goal: F, min_weeks: N, max_weeks: N }
id: sprint-olympic-tri
event_classes: [sprint_tri, olympic_tri]
hours_tiers: [from_4_to_6, from_6_to_10, over_10]
min_weeks: 10
phases:
  - kind: base
    purpose: "Aerobic base in three sports: the long ride and long run grow on easy work, swim sets sit at critical swim speed, and strides keep the legs quick."
    length: { share_of_weeks_to_goal: 0.40, min_weeks: 4, max_weeks: 12 }   # grey: Friel Triathlete's Training Bible base 1-3, 3-4 weeks each
    volume_share_of_peak: { min: 0.40, max: 0.60 }   # Haugen 2022: a build starts at 40-60% of peak volume
    flavour_override: pyramidal   # Sport Systems: triathlon is pyramidal in preparation, the swim least polarized
    key_sessions: [endurance_long, endurance, threshold, neuromuscular]
  - kind: build
    purpose: "Race-specific intensity: a VO2max session in each sport and a weekly brick teach the legs to run off the bike while volume reaches its peak."
    length: { share_of_weeks_to_goal: 0.30, min_weeks: 4, max_weeks: 8 }   # grey: Friel build 1-2, 3-4 weeks each
    volume_share_of_peak: { min: 0.60, max: 1.00 }
    flavour_override: polarized   # Sport Systems: sprint triathlon is a polarized architecture; Olympic distance moves from a pyramidal base to a polarized peak
    key_sessions: [vo2max_long, brick, threshold, endurance_long]
  - kind: peak
    purpose: "Sharpen: a race simulation with transitions and short VO2max repeats at race intensity while volume holds at its season high."
    length: { fixed_weeks: 1 }   # grey: Friel peak 1-2 weeks
    volume_share_of_peak: { min: 1.00, max: 1.00 }   # Haugen 2022: the peak weeks carry the season's highest volume
    key_sessions: [race_specific, brick, vo2max_short]
  - kind: taper
    purpose: "Taper: volume drops forty to sixty percent over about a week while one session at race intensity in each sport and the usual session count are kept."
    length: { fixed_days: 7 }   # Periodization working rule: 6-10 days for short-course triathlon (the Sport Systems event table says 7-10; 7 sits inside both)
    volume_share_of_peak: { min: 0.40, max: 0.60 }
    key_sessions: [race_specific, endurance]
taper: { days: { min: 6, max: 10 }, volume_cut: { min: 0.40, max: 0.60 }, keep_intensity: true, keep_frequency: true }
loading_pattern: { default: "3:1", recovery_limited: "2:1" }   # Sandbakk 2025: easy week every 3rd-4th week; 2:1 is practitioner advice for recovery-limited athletes (grey)
recovery_week_cut: { min: 0.25, max: 0.35 }   # Sandbakk 2025: 25-35% fewer hours
drop_order: [base, build]
multi_peak: { b_race_mini_taper_days: { min: 3, max: 5 }, transition_weeks_after_a_race: 1 }   # grey: Friel; B races take a 3-5 day mini-taper, transition 1-4 weeks
strength:
  base: { goal: max, sessions_per_week: 2, purposes: [strength_max] }   # Storen 2008, Sunde 2010: heavy loads in preparation
  build: { goal: maintain, sessions_per_week: 2, purposes: [strength_maint, plyometric] }   # Ronnestad 2010b, Saunders 2006: heavy maintenance plus one plyometric session
  peak: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # Ronnestad 2010b, Spiering 2021
  taper: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # practice: one light session at least 4 days out
