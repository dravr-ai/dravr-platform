# ABOUTME: Season skeleton for ultra-distance running: a volume-led pyramidal base, a durability build, a race-specific block and a 14-21 day taper
# ABOUTME: Every number traces to the Training Design KB (Periodization, Sport Systems, TID, Strength notes); practitioner sources are marked grey in comments
# A phase `length` is exactly one of: { fixed_weeks: N } | { fixed_days: N } | { share_of_weeks_to_goal: F, min_weeks: N, max_weeks: N }
id: ultra
event_classes: [ultra]
hours_tiers: [from_6_to_10, over_10]
min_weeks: 16
phases:
  - kind: base
    purpose: "Volume-led base: weekly hours and the long session grow steadily on easy running, since for an ultra total volume matters more than pace."
    length: { share_of_weeks_to_goal: 0.45, min_weeks: 6, max_weeks: 16 }   # grey: Lydiard aerobic base 10-12+ weeks; Friel base 9-12 weeks
    volume_share_of_peak: { min: 0.40, max: 0.60 }   # Haugen 2022: a build starts at 40-60% of peak volume
    flavour_override: pyramidal   # Sport Systems: ultra is pyramidal and volume-led
    key_sessions: [endurance_long, endurance, neuromuscular]
  - kind: build
    purpose: "Durability: very long sessions with late tempo work and progression runs teach the body to hold pace under fatigue while volume reaches its peak."
    length: { share_of_weeks_to_goal: 0.25, min_weeks: 4, max_weeks: 8 }   # grey: Friel build 6-8 weeks
    volume_share_of_peak: { min: 0.60, max: 1.00 }
    flavour_override: pyramidal   # Sport Systems > 6 h row: pyramidal, volume-led, durability and fuelling modifiers
    key_sessions: [endurance_long, tempo, threshold, endurance]
  - kind: specialty
    purpose: "Race specificity: long race-pace efforts on race-like terrain rehearse fuelling and pacing while volume eases ten to twenty percent below its peak."
    length: { share_of_weeks_to_goal: 0.15, min_weeks: 3, max_weeks: 6 }   # race-specific flavour covers the final 6-8 weeks
    volume_share_of_peak: { min: 0.80, max: 0.90 }   # race-specific flavour: volume -10-20%
    key_sessions: [race_specific, endurance_long, endurance]
  - kind: taper
    purpose: "Taper: volume drops forty to sixty percent over two to three weeks while one session at race intensity and the usual session count are kept."
    length: { fixed_days: 14 }   # Periodization working rule: 14-21 days for marathon and longer; Bosquet 2007: 2 weeks optimum
    volume_share_of_peak: { min: 0.40, max: 0.60 }
    key_sessions: [race_specific, endurance]
taper: { days: { min: 14, max: 21 }, volume_cut: { min: 0.40, max: 0.60 }, keep_intensity: true, keep_frequency: true }
loading_pattern: { default: "3:1", recovery_limited: "2:1" }   # Sandbakk 2025: easy week every 3rd-4th week; 2:1 is practitioner advice for recovery-limited athletes (grey)
recovery_week_cut: { min: 0.25, max: 0.35 }   # Sandbakk 2025: 25-35% fewer hours
drop_order: [base, build, specialty]
multi_peak: { b_race_mini_taper_days: { min: 3, max: 5 }, transition_weeks_after_a_race: 1 }   # grey: Friel; B races take a 3-5 day mini-taper, transition 1-4 weeks
strength:
  base: { goal: max, sessions_per_week: 2, purposes: [strength_max] }   # Storen 2008, Eihara 2022: heavy loads 2-3x/wk in base
  build: { goal: maintain, sessions_per_week: 2, purposes: [strength_maint, plyometric] }   # Ronnestad 2010b, Saunders 2006: heavy maintenance plus one plyometric session
  specialty: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # Ronnestad 2010b, Spiering 2021
  taper: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # practice: one light session at least 4 days out
