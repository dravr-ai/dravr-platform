# ABOUTME: Season skeleton for the half marathon: endurance base, a threshold-led build, a race-pace block and a 10-14 day taper
# ABOUTME: Every number traces to the Training Design KB (Periodization, Sport Systems, TID, Strength notes); practitioner sources are marked grey in comments
# A phase `length` is exactly one of: { fixed_weeks: N } | { fixed_days: N } | { share_of_weeks_to_goal: F, min_weeks: N, max_weeks: N }
id: half-marathon
event_classes: [half_marathon]
hours_tiers: [from_4_to_6, from_6_to_10, over_10]   # under_4 resolves to the foundation family (Sport Systems < 4 h row) and the build here overrides to polarized, which needs four hours
min_weeks: 12
phases:
  - kind: base
    purpose: "Endurance: the long run grows to ninety minutes or more while weekly volume climbs on easy running with strides and one controlled tempo session."
    length: { share_of_weeks_to_goal: 0.40, min_weeks: 4, max_weeks: 10 }   # grey: Pfitzinger endurance mesocycle inside a 12-24 week plan
    volume_share_of_peak: { min: 0.40, max: 0.60 }   # Haugen 2022: a build starts at 40-60% of peak volume
    flavour_override: pyramidal   # Filipas 2022, Casado 2022: pyramidal in preparation
    key_sessions: [endurance_long, endurance, tempo, neuromuscular]
  - kind: build
    purpose: "Threshold and endurance: cruise intervals and tempo runs become the two quality days while the long run holds and volume reaches its peak."
    length: { share_of_weeks_to_goal: 0.30, min_weeks: 4, max_weeks: 8 }   # grey: Pfitzinger lactate-threshold plus endurance mesocycle
    volume_share_of_peak: { min: 0.60, max: 1.00 }
    flavour_override: polarized   # Sport Systems 1-3 h row: pyramidal base then polarized or race-pace peak, threshold templates central
    key_sessions: [threshold, tempo, endurance_long, vo2max_long]
  - kind: specialty
    purpose: "Race preparation: race-pace segments enter the long run and threshold work stays sharp while volume eases ten to twenty percent below its peak."
    length: { share_of_weeks_to_goal: 0.15, min_weeks: 2, max_weeks: 4 }   # grey: Pfitzinger race preparation; race-specific flavour covers the final 6-8 weeks
    volume_share_of_peak: { min: 0.80, max: 0.90 }   # race-specific flavour: volume -10-20%
    key_sessions: [race_specific, threshold, endurance_long]
  - kind: taper
    purpose: "Taper: volume drops forty to sixty percent over ten days to two weeks while one session at race intensity and the usual session count are kept."
    length: { fixed_days: 10 }   # Periodization working rule: 10-14 days for the half marathon
    volume_share_of_peak: { min: 0.40, max: 0.60 }
    key_sessions: [race_specific, endurance]
taper: { days: { min: 10, max: 14 }, volume_cut: { min: 0.40, max: 0.60 }, keep_intensity: true, keep_frequency: true }
loading_pattern: { default: "3:1", recovery_limited: "2:1" }   # Sandbakk 2025: easy week every 3rd-4th week; 2:1 is practitioner advice for recovery-limited athletes (grey)
recovery_week_cut: { min: 0.25, max: 0.35 }   # Sandbakk 2025: 25-35% fewer hours
drop_order: [base, build, specialty]
multi_peak: { b_race_mini_taper_days: { min: 3, max: 5 }, transition_weeks_after_a_race: 1 }   # grey: Friel; B races take a 3-5 day mini-taper, transition 1-4 weeks
strength:
  base: { goal: max, sessions_per_week: 2, purposes: [strength_max] }   # Storen 2008, Eihara 2022: heavy loads 2-3x/wk in base
  build: { goal: maintain, sessions_per_week: 2, purposes: [strength_maint, plyometric] }   # Ronnestad 2010b, Saunders 2006: heavy maintenance plus one plyometric session
  specialty: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # Ronnestad 2010b, Spiering 2021
  taper: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # practice: one light session at least 4 days out
evidence_refs:
  - evidence/sports_science/training_prescription/haugen-2022-world-class-distance.md
  - evidence/sports_science/training_prescription/casado-2022-elite-runners-pyramidal-then-polarized.md
  - evidence/sports_science/training_prescription/filipas-2022-pyramidal-then-polarized.md
  - evidence/sports_science/training_prescription/fokkema-2020-recreational-volume-and-time.md
  - evidence/sports_science/training_prescription/bosquet-2007-taper-meta-analysis.md
  - evidence/sports_science/training_prescription/wang-2023-taper-meta-analysis.md
  - evidence/sports_science/training_prescription/mujika-padilla-2003-taper.md
  - evidence/sports_science/training_prescription/sandbakk-2025-norwegian-coaches-hard-days.md
  - evidence/sports_science/training_prescription/storen-2008-maximal-strength-running-economy.md
