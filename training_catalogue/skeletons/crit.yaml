# ABOUTME: Season skeleton for criterium and short road racing: Friel's base-build-peak shape with a polarized build and a 5-7 day taper
# ABOUTME: Every number traces to the Training Design KB (Periodization, Sport Systems, TID, Strength notes); practitioner sources are marked grey in comments
# A phase `length` is exactly one of: { fixed_weeks: N } | { fixed_days: N } | { share_of_weeks_to_goal: F, min_weeks: N, max_weeks: N }
id: crit
event_classes: [crit]
hours_tiers: [from_4_to_6, from_6_to_10, over_10]   # under_4 resolves to the foundation family (Sport Systems < 4 h row) and the build here overrides to polarized, which needs four hours
min_weeks: 10
phases:
  - kind: base
    purpose: "Aerobic base: long endurance rides, sweet-spot work and neuromuscular drills build the engine while intensity stays controlled below the second threshold."
    length: { share_of_weeks_to_goal: 0.45, min_weeks: 4, max_weeks: 12 }   # grey: Friel base 1-3, 3-4 weeks each
    volume_share_of_peak: { min: 0.40, max: 0.60 }   # Haugen 2022: a build starts at 40-60% of peak volume
    flavour_override: pyramidal   # Casado 2022: pyramidal in preparation
    key_sessions: [endurance_long, sweet_spot, endurance, neuromuscular]
  - kind: build
    purpose: "Race-specific intensity: short VO2max intervals and over-unders target the time above maximal aerobic power that decides a criterium, with volume held and repeated sprints saved for the peak."
    length: { share_of_weeks_to_goal: 0.30, min_weeks: 4, max_weeks: 8 }   # grey: Friel build 1-2, 3-4 weeks each
    volume_share_of_peak: { min: 0.60, max: 1.00 }
    flavour_override: polarized   # Sport Systems: criterium is polarized; Casado 2022: polarized in the competition period
    key_sessions: [vo2max_short, threshold, endurance_long]
  - kind: peak
    purpose: "Sharpen: race simulations and sprints at full intensity while the week keeps its volume and the easy days stay easy."
    length: { fixed_weeks: 1 }   # grey: Friel peak 1-2 weeks; Haugen 2022: peak weeks last 2-3 weeks at most
    volume_share_of_peak: { min: 1.00, max: 1.00 }   # Haugen 2022: the peak weeks carry the season's highest volume
    key_sessions: [race_specific, sprint, vo2max_short]
  - kind: taper
    purpose: "Taper: volume drops forty to sixty percent over five to seven days while one session at race intensity and the usual session count are kept."
    length: { fixed_days: 6 }   # Sport Systems event table: criterium taper 5-7 days
    volume_share_of_peak: { min: 0.40, max: 0.60 }
    key_sessions: [race_specific, endurance]
taper: { days: { min: 5, max: 7 }, volume_cut: { min: 0.40, max: 0.60 }, keep_intensity: true, keep_frequency: true }
loading_pattern: { default: "3:1", recovery_limited: "2:1" }   # Sandbakk 2025: easy week every 3rd-4th week; 2:1 is practitioner advice for recovery-limited athletes (grey)
recovery_week_cut: { min: 0.25, max: 0.35 }   # Sandbakk 2025: 25-35% fewer hours
drop_order: [base, build]
multi_peak: { b_race_mini_taper_days: { min: 3, max: 5 }, transition_weeks_after_a_race: 1 }   # grey: Friel; B races take a 3-5 day mini-taper, transition 1-4 weeks
strength:
  base: { goal: max, sessions_per_week: 2, purposes: [strength_max] }   # Sunde 2010, Ronnestad 2010a: heavy loads twice a week in preparation
  build: { goal: maintain, sessions_per_week: 2, purposes: [strength_maint, plyometric] }   # Ronnestad 2010b: heavy maintenance plus one explosive session
  peak: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # Ronnestad 2010b, Spiering 2021
  taper: { goal: maintain, sessions_per_week: 1, purposes: [strength_maint] }   # practice: one light session at least 4 days out
