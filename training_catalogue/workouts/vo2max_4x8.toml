# ABOUTME: VO2max at controlled intensity — 4 × 8 min at ~90% HRmax with 2 min easy, the best-evidenced single format in trained cyclists
# ABOUTME: Seiler 2013: 32 min at 90% beat 16 min at 95% on VO2peak, power at VO2peak and power at 4 mmol

id = "9adab247-24fa-54f3-92bd-47ad84357f4b"
slug = "vo2max_4x8"
name = "VO2max — 4 × 8 min"
sport = "ride"
sport_variants = ["ride", "run"]
duration_minutes = 65
intensity_distribution = "vo2max"
purpose = "vo2max_long"
evidence_tier = "rct"
evidence_refs = [
  "evidence/sports_science/training_prescription/seiler-2013-interval-duration-4x8.md",
]

[params]
reps = { min = 4, max = 5, default = 4 }
work_seconds = { min = 420, max = 600, default = 480 }
rest_seconds = { min = 90, max = 180, default = 120 }
rpe = { min = 7, max = 8 }
intensity_label = "~90% HRmax, inside the 88–92% band — the highest power you could hold for 40 minutes; 5 × 8 is the ceiling"

[params.intensity]
ride = "100-105%"
run = "Z5"

[progression]
order = ["add_rep", "lengthen_rep", "shorten_rest", "raise_intensity"]
max_weekly_step = 1

[fit]
# base: the polarized flavour prescribes this session in every block (TID note, Polarized row: 4 x 8 min at ~90% HRmax; 6 x 3 min at ~95% VO2max)
phases = ["base", "build", "peak"]
readiness_min = "p2"
max_per_week = 2
min_spacing_hours = 48
contraindications = ["novice_first_season", "acute_injury"]

[target_zones]
hr_pct_of_lt2 = [0.6, 0.7, 0.85, 0.95, 1.05]
power_pct_of_ftp = [0.55, 0.75, 0.9, 1.0, 1.05]

[[structure]]
label = "Warm-up"
duration_seconds = 900
target_zone = "Z1"
note = "Easy spin building to Z2; 2 × 30 s openers near threshold at the end."

[[structure]]
label = "Controlled VO2max interval"
duration_seconds = 480
target_zone = "VO2max"
repeat = 4
note = "Even effort at ~90% HRmax — hard but controlled, not to exhaustion. RPE 7-8."

[[structure]]
label = "Easy recovery"
duration_seconds = 120
target_zone = "Z1"
repeat = 4
note = "Two minutes easy between reps."

[[structure]]
label = "Cool-down"
duration_seconds = 600
target_zone = "Z1"
note = "Spin out the legs."
