# ABOUTME: VO2max long intervals, the 4 × 4 family — 4–6 × 3–5 min at 90–95% HRmax with equal or 3-min easy recovery
# ABOUTME: Regrown legacy cornerstone keeping its slug and id; Helgerud 2007 dose, Lenk 2025 for two sessions a week

id = "00000000-0000-0000-0000-000000000003"
slug = "vo2_5x3"
name = "VO2max — 5 × 3 min"
sport = "run"
sport_variants = ["run", "ride"]
duration_minutes = 60
intensity_distribution = "vo2max"
purpose = "vo2max_long"
evidence_tier = "rct"
evidence_refs = [
  "evidence/sports_science/training_prescription/helgerud-2007-4x4-raises-vo2max.md",
  "evidence/sports_science/training_prescription/lenk-2025-hiit-sessions-per-week.md",
]

[params]
reps = { min = 4, max = 6, default = 5 }
work_seconds = { min = 180, max = 300, default = 180 }
rest_seconds = { min = 180, max = 300, default = 180 }
rpe = { min = 8, max = 9 }
intensity_label = "90–95% HRmax, 95–100% vVO2max; recover 3 min easy (about 70% HRmax) or as long as the rep"

[params.intensity]
run = "Z5"
ride = "105-115%"

[progression]
order = ["add_rep", "lengthen_rep", "shorten_rest"]
max_weekly_step = 1

[fit]
# base: the polarized flavour prescribes this session in every block (TID note, Polarized row: 4 x 8 min at ~90% HRmax; 6 x 3 min at ~95% VO2max)
phases = ["base", "build", "peak"]
readiness_min = "p2"
max_per_week = 2
min_spacing_hours = 48
contraindications = ["novice_first_season", "acute_injury"]

[target_zones]
hr_pct_of_lt2 = [0.6, 0.7, 0.85, 0.95, 1.05]
power_pct_of_ftp = [0.55, 0.75, 0.9, 1.05, 1.2]

[[structure]]
label = "Warm-up"
duration_seconds = 900
target_zone = "Z1"
note = "Easy → moderate; 4 × 20 s strides at the end."

[[structure]]
label = "VO2max interval"
duration_seconds = 180
target_zone = "VO2max"
repeat = 5
note = "Hard, sustainable for 3 min. RPE 8-9."

[[structure]]
label = "Recovery jog"
duration_seconds = 180
target_zone = "Z1"
repeat = 5
note = "Active recovery; HR drifts down toward Z1-Z2 boundary."

[[structure]]
label = "Cool-down"
duration_seconds = 600
target_zone = "Z1"
note = "Easy jog → walk; long enough for HR to settle."
