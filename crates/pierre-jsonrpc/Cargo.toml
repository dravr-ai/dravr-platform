# ABOUTME: Unified JSON-RPC 2.0 wire types (request, response, error) shared by MCP + A2A
# ABOUTME: Leaf crate with only serde as a runtime dep — protocol-agnostic foundation

[package]
name = "pierre-jsonrpc"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "JSON-RPC 2.0 request/response/error types for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
