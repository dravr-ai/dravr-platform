# ABOUTME: Fitness intelligence bridge between dravr-cageux and pierre-core
# ABOUTME: Re-exports dravr-cageux algorithms with pierre-core type conversions

[package]
name = "pierre-intelligence"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fitness intelligence engine for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }
dravr-cageux = { git = "https://github.com/dravr-ai/dravr-cageux.git", tag = "v0.1.2" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
rayon = "1.11"

[lints]
workspace = true
