# ABOUTME: Reference + demo data seeders invoked by pierre-cli seed <domain>
# ABOUTME: Populates the database with system coaches, demo users, synthetic activities, mobility, insights, etc.

[package]
name = "pierre-seeders"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reference + demo data seeders for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[dependencies]
pierre-coach-parser = { version = "0.3.0", path = "../pierre-coach-parser" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-intelligence = { version = "0.3.0", path = "../pierre-intelligence" }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }

bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
glob = "0.3"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
