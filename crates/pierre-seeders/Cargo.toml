# ABOUTME: Reference + demo data seeders invoked by pierre-cli seed <domain>
# ABOUTME: Populates the database with system agents, demo users, synthetic activities, mobility, LLM usage and the E2E flows' coached threads

[package]
name = "pierre-seeders"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reference + demo data seeders for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[dependencies]
secrecy = { workspace = true }
pierre-agent-parser = { version = "0.3.0", path = "../pierre-agent-parser" }
# The string catalogue the coach plan thread's card names a flavour from.
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
# The claim verdict vocabulary the verdict conversation seeder writes, and the
# plan vocabulary the coach plan thread seeder lays.
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
# mask_email: the canonical redactor for an address in an INFO+ log line.
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
# The coaching gates, the athlete's clock and the plan card builder the coach
# plan thread seeder asks the way the thread's route and a turn ask them.
pierre-services = { version = "0.3.0", path = "../pierre-services" }

bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
glob = "0.3"
rand = "0.9"
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4", "serde"] }

[lints]
workspace = true
