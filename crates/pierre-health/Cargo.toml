# ABOUTME: Health monitoring and system status checks extracted from pierre-server
# ABOUTME: Provides HealthChecker, HealthResponse, and platform probes for memory/disk/CPU

[package]
name = "pierre-health"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Health checks and system monitoring for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["sqlite"]
sqlite = ["pierre-database/sqlite"]
postgresql = ["pierre-database/postgresql"]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors"] }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-database = { version = "0.3.0", path = "../pierre-database", default-features = false }

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"

[lints]
workspace = true
