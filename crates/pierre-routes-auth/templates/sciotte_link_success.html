<!DOCTYPE html>
<!-- ABOUTME: Hosted page shown after a chat-initiated provider connection succeeds, for Sciotte and OAuth alike -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; closes itself after a short pause -->
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<!-- Copyright (c) 2026 dravr.ai -->
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>{{t:hosted.success.pageTitle}}</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card card-center">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <div class="status-icon status-icon-success" aria-hidden="true">&#10003;</div>
        <h1>{{HEADING}}</h1>
        <p>{{DATA_AVAILABLE}}</p>
        <p>{{RETURN_TO_CHAT}}</p>
        <p class="fineprint">{{t:hosted.success.autoClose}}</p>
    </main>
    <script>
        setTimeout(function () {
            try { window.close(); } catch (_) { /* ignore */ }
        }, 2500);
    </script>
</body>
</html>
