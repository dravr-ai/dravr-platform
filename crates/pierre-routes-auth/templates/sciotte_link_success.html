<!DOCTYPE html>
<!-- ABOUTME: Hosted page shown after a chat-initiated provider connection succeeds, for Sciotte and OAuth alike -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; closes itself after a short pause -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Connected - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card card-center">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <div class="status-icon status-icon-success" aria-hidden="true">&#10003;</div>
        <h1>{{TARGET_LABEL}} Connected</h1>
        <p>Your {{TARGET_LABEL}} data is now available in Dravr.</p>
        <p>You can return to {{CHANNEL_LABEL}} to continue chatting with your agent.</p>
        <p class="fineprint">This window will close automatically.</p>
    </main>
    <script>
        setTimeout(function () {
            try { window.close(); } catch (_) { /* ignore */ }
        }, 2500);
    </script>
</body>
</html>
