# ABOUTME: Multi-channel messaging gateway crate for Pierre fitness platform
# ABOUTME: Re-exports from dravr-canot standalone messaging library

[package]
name = "pierre-messaging"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Multi-channel messaging gateway with pluggable channel adapters"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
channel-whatsapp = ["dravr-canot/channel-whatsapp"]
channel-messenger = ["dravr-canot/channel-messenger"]
channel-discord = ["dravr-canot/channel-discord"]
channel-slack = ["dravr-canot/channel-slack"]
channel-telegram = ["dravr-canot/channel-telegram"]
all-channels = ["channel-whatsapp", "channel-messenger", "channel-discord", "channel-slack", "channel-telegram"]

[dependencies]
dravr-canot = { git = "https://github.com/dravr-ai/dravr-canot.git", tag = "v0.4.0" }

[lints]
workspace = true
