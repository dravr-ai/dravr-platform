# ABOUTME: Messaging provider abstraction layer for external chat integrations
# ABOUTME: Pluggable provider support (Slack, Discord, Teams) with tenant-isolated channels

[package]
name = "pierre-messaging"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pluggable messaging provider layer for Pierre platform (Slack, Discord, Teams)"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
slack = []

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }

async-trait = "0.1"
axum = { version = "0.7", features = ["json"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.45", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }

[lints]
workspace = true
