# ABOUTME: Test fixtures shared by the workspace's integration tests: the test-database factory, user fixtures, SSE reader
# ABOUTME: Never a normal dependency; every consumer lists it under [dev-dependencies] only (ADR-027)

[package]
name = "pierre-test-support"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Test fixtures for the Pierre platform's integration tests"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
# Clone per-test databases from a PostgreSQL template when DATABASE_URL names
# a PostgreSQL server. A consumer's own `postgresql` feature forwards here.
postgresql = ["pierre-database/postgresql", "sqlx/postgres"]
# The SSE frame reader (`sse`) the suites that drive a streaming chat turn over
# HTTP share. Opt-in, so a consumer that never reads a stream does not build an
# HTTP client.
sse = ["dep:futures-util", "dep:reqwest", "dep:serde_json"]
# The group-tier fixture (`group_tier`): a plan without group coaching, for the
# suites that drive group creation. Opt-in, so a consumer that never creates a
# group does not build `pierre-groups`.
groups = ["dep:pierre-groups"]
# The offline provider registry (`providers`): every provider's server-called
# endpoints at the refused origin. Opt-in, so a consumer that builds no
# registry does not build the providers.
providers = ["dep:pierre-config", "dep:pierre-providers", "dep:url"]
# The DPoP client keys and proof signer (`dpop`) the DPoP suites share.
# Opt-in, so a consumer that signs no proof does not build jsonwebtoken.
dpop = ["dravr-tronc/dpop", "dep:jsonwebtoken", "dep:serde_json"]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-groups = { version = "0.3.0", path = "../pierre-groups", optional = true }
pierre-config = { version = "0.3.0", path = "../pierre-config", optional = true }
pierre-providers = { version = "0.3.0", path = "../pierre-providers", optional = true }
dravr-tronc = { workspace = true, features = ["sqlx08-sqlite"] }
futures-util = { version = "0.3", optional = true }
jsonwebtoken = { version = "10.4", features = ["rust_crypto", "use_pem"], default-features = false, optional = true }
reqwest = { version = "0.12", features = ["stream"], default-features = false, optional = true }
secrecy = { workspace = true }
serde_json = { version = "1.0", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"], default-features = false }
# "sync" backs the OnceCell holding the migrated SQLite image; "net", "io-util",
# "rt", "time" and "macros" back the fault proxy's relay.
tokio = { version = "1.54", features = ["sync", "net", "io-util", "rt", "time", "macros"] }
tracing = "0.1"
# `span::Current`, which the span capture answers `current_span` with and
# `tracing` does not re-export.
tracing-core = "0.1"
# The `log` bridge every capture installs once (`log_capture::prime`).
tracing-log = "0.2"
uuid = { version = "1.29", features = ["v4"] }
url = { version = "2.5", optional = true }

[dev-dependencies]
# Writes the `log`-crate record the bridge test reads back.
log = "0.4"

[lints]
workspace = true
