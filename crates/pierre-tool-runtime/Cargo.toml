# ABOUTME: Tool execution scaffolding — McpTool trait, ToolExecutionContext, ToolRuntime, ToolRegistry
# ABOUTME: Batch B lifts the registry + trait surface out of pierre-server so tools/* can be reused

[package]
name = "pierre-tool-runtime"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tool execution scaffolding for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
# Forwarded from pierre-server so the trait surface can expose the
# matching optional services (notification, sync orchestrator, SSE
# notifier, evidence registry) without dragging their crates in
# unconditionally.
client-notifications = ["dep:pierre-notifications"]
health-sync = ["dep:pierre-enforme", "pierre-services/health-sync"]
transport-sse = []
# Provider feature flag (auth.rs has a small synthetic-provider code path).
# Chat tool-loop strategies (API/headless/CLI) used by client-chat in pierre-server.
client-chat = []

# Tool implementation feature flags (mirror the pierre-server side; the
# pierre-server features forward to these so `cargo check -p pierre-tool-runtime`
# with --features tools-admin compiles the same set as pierre-server does).
tools-agents = []
tools-admin = ["tools-agents"]  # admin tools depend on coach tools
tools-analytics = []       # discover_routes (Overpass + OSM piste data)
tools-mobility = []
tools-config = []          # fitness config tools, user configuration
tools-connection = ["transport-sse"]  # sync / refresh tools (refresh_provider_data, get_data_freshness) — require SSE for SyncNotifier
tools-data = []            # endurance workout tools (list_workout_templates, prescribe_workout) + data access tools
tools-goals = []           # set_goal, track_progress, suggest_goals, analyze_goal_feasibility
tools-groups = []          # group_fitness snapshot fetcher used by chat_pipeline group context injection
tools-memory = []          # coach-authored memory (notes, followups, fact recall)
tools-nutrition = ["dep:pierre-external"]  # daily_nutrition, nutrient_timing, food search (USDA via pierre-external)
tools-recipes = ["dep:pierre-external"]  # recipe tools (USDA validation via pierre-external)
tools-sleep = []           # sleep_quality, recovery_score, rest_day
tools-verification = ["dep:pierre-evals", "pierre-services/tools-verification"]  # verify_claim claim-verification tool

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors"] }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-intelligence = { version = "0.3.0", path = "../pierre-intelligence" }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }
pierre-mcp-transport = { version = "0.3.0", path = "../pierre-mcp-transport" }
pierre-providers = { version = "0.3.0", path = "../pierre-providers" }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-mcp-schema = { version = "0.3.0", path = "../pierre-mcp-schema" }
pierre-tools-core = { version = "0.3.0", path = "../pierre-tools-core" }
dravr-tronc = { workspace = true }
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-formatters = { version = "0.3.0", path = "../pierre-formatters" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
pierre-notifications = { version = "0.3.0", path = "../pierre-notifications", optional = true }
pierre-enforme = { version = "0.3.0", path = "../pierre-enforme", optional = true }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
pierre-external = { version = "0.3.0", path = "../pierre-external", optional = true }

pierre-weather = { version = "0.3.0", path = "../pierre-weather" }

async-trait = "0.1"
base64 = "0.22"
bitflags = { version = "2.11", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
lru = "0.18.2"
num-traits = "0.2"
regex = "1.12"
reqwest = { version = "0.12", features = ["json"] }
# chrono04: sleep answers carry DateTime<Utc>, which the schema states as
# a date-time string rather than an opaque one.
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.50", features = ["sync", "macros"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[dev-dependencies]
# Validates a tool's declared outputSchema against the payload it actually
# returns. Same version the chat pipeline validates structured replies with.
jsonschema = { version = "0.46.5", default-features = false }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }

# Integration tests that import a feature-gated module state that gate here.
# Every tool module in this crate sits behind a `tools-*` feature and the crate
# declares no `default`, so a standalone `-p pierre-tool-runtime` build turns
# them all off — the features arrive by unification from pierre-server, which
# forwards them one-for-one. `required-features` makes cargo skip a target whose
# gates are absent instead of compiling it into unresolved imports, so
# `cargo clippy -p pierre-tool-runtime --all-targets` reports on the code rather
# than on a build configuration that never ships. Skipping omits the binary
# entirely, where an `#![cfg(...)]` inner attribute would still produce one that
# reports `running 0 tests`.
#
# A test importing only ungated modules needs no block here — cargo keeps
# discovering it from tests/ as usual.

[[test]]
name = "activity_dedup_test"
required-features = ["tools-groups"]

[[test]]
name = "activity_list_local_clock_test"
required-features = ["tools-data"]

[[test]]
name = "activity_revalidation_dedup_test"
required-features = ["tools-groups"]

[[test]]
name = "backfill_coverage_logic_test"
required-features = ["tools-data"]

[[test]]
name = "cli_loop_request_mcp_servers_test"
required-features = ["client-chat"]

[[test]]
name = "failed_leg_token_accounting_test"
required-features = ["client-chat"]

[[test]]
name = "fitness_score_window_test"
required-features = ["tools-analytics"]

[[test]]
name = "format_parameter_declared_test"
required-features = [
    "tools-admin",
    "tools-analytics",
    "tools-agents",
    "tools-data",
    "tools-recipes",
    "tools-sleep",
]

[[test]]
name = "group_fitness_weekly_metrics_test"
required-features = ["tools-groups"]

[[test]]
name = "headless_lost_turn_test"
required-features = ["client-chat"]

[[test]]
name = "sport_type_filter_test"
required-features = ["tools-data"]

[[test]]
name = "stored_data_range_test"
required-features = ["tools-data"]

[[test]]
name = "tool_output_schema_test"
required-features = [
    "tools-admin",
    "tools-analytics",
    "tools-agents",
    "tools-config",
    "tools-connection",
    "tools-data",
    "tools-goals",
    "tools-groups",
    "tools-memory",
    "tools-mobility",
    "tools-nutrition",
    "tools-recipes",
    "tools-sleep",
    "tools-verification",
]

[[test]]
name = "usda_ingredient_guard_test"
required-features = ["tools-nutrition"]

[lints]
workspace = true
