# ABOUTME: pierre-cli — admin CLI for pierre-server (user create, token generate, seeds)
# ABOUTME: Separated from pierre-mcp-server for binary-size and dependency clarity

[package]
name = "pierre-cli"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified admin CLI for the Pierre MCP Server (users, tokens, seeders)"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[[bin]]
name = "pierre-cli"
path = "src/main.rs"

[features]
default = []
postgresql = ["pierre-database/postgresql", "pierre-services/postgresql"]
# Enables the GCP Cloud KMS KEK target for `pierre-cli key rewrap-kek`.
gcp-kms = ["pierre-auth/gcp-kms"]
tools-verification = ["dep:pierre-evals", "pierre-services/tools-verification", "pierre-services/health-sync"]
# `user mint-session`: signs an account in with no credential, for the mobile
# E2E lanes' seeded sessions (carnet#1201). Only those lanes and the dev stack's
# --maestro run build it; the server image's feature list never names it, so
# the pierre-cli it ships has no such command.
e2e-seeded-sessions = [
    "dep:pierre-cache",
    "dep:pierre-config",
    "dep:pierre-providers",
    "dep:pierre-runtime-context",
]

[dependencies]
# Workspace crates
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
# `fuel-ingest` reads the fuel_panel_extraction prompt from the registry.
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
# `user mint-session` (feature e2e-seeded-sessions) builds the server's
# AuthService: its cache, configuration, provider registry and data context,
# the way a booting server builds them.
pierre-cache = { version = "0.3.0", path = "../pierre-cache", optional = true }
pierre-config = { version = "0.3.0", path = "../pierre-config", optional = true }
pierre-providers = { version = "0.3.0", path = "../pierre-providers", optional = true }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context", optional = true }
pierre-agent-parser = { version = "0.3.0", path = "../pierre-agent-parser" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
# LlmChain: the model a seeded conversation gets, as the server resolves it.
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
# mask_email: the canonical redactor for an address in an INFO+ log line.
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-seeders = { version = "0.3.0", path = "../pierre-seeders" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime" }

# `fuel-ingest` sends label photos to the LLM as base64 image parts.
base64 = "0.22"
bcrypt = "0.16"
# The sciotte service client the credential-login canary signs in through.
dravr-sciotte = { workspace = true, features = ["client"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "std", "env"], default-features = false }
dirs = "5.0"
glob = "0.3"
# Cross-platform "open this URL in the default browser" for `auth login` (gcloud-style);
# std has no equivalent and it wraps the per-OS opener (open/xdg-open/start) + WSL.
open = "5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `fuel-ingest` reads the nutrition-panel image off a product page: an HTML
# parser with CSS selectors, since no other one is in the workspace.
scraper = { version = "0.29", default-features = false }
# SecretString for the admin tokens the CLI holds: redacting Debug, explicit expose_secret().
secrecy = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `fuel-ingest` names the field a label reading broke at, never its value.
serde_path_to_error = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"], default-features = false }
# Percent-encodes the email in `DELETE /admin/pre-approved-emails/{email}`; a
# path segment carrying user-supplied text is escaped, never interpolated raw.
urlencoding = "2.1"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
# The claim-verdict types the grading-sheet test seeds its database with.
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }

[lints]
workspace = true
