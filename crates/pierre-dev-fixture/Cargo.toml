# ABOUTME: Dev/test fixture HTTP API that serves seeded activities in Strava/Garmin JSON shape
# ABOUTME: Lets the real Strava/Garmin providers fetch seed data in dev by overriding their base URL

[package]
name = "pierre-dev-fixture"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Dev/test fixture API serving seeded activities as Strava/Garmin API responses"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[[bin]]
name = "pierre-dev-fixture"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }

[dev-dependencies]
# The unit tests point the real Strava provider at this fixture, so a shape the
# provider cannot read fails here rather than as a broken map in dev.
pierre-providers = { version = "0.3.0", path = "../pierre-providers", default-features = false, features = ["provider-strava"] }
pierre-config = { version = "0.3.0", path = "../pierre-config" }

[lints]
workspace = true
