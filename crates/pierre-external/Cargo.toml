# ABOUTME: External-API HTTP clients — USDA FoodData Central etc.
# ABOUTME: Wraps third-party REST APIs with caching + retry behind the canonical reqwest client

[package]
name = "pierre-external"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Third-party external-API clients for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
schemars = "1.2"
secrecy = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["sync"] }

[dev-dependencies]
# The USDA detail-shape tests stand up a local HTTP fixture and drive the
# client against it, so the multi-threaded runtime and a minimal router.
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"], default-features = false }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "1.0"

[lints]
workspace = true
