# ABOUTME: LLM provider integrations for Pierre platform
# ABOUTME: Extracted from main crate for parallel compilation and modularity

[package]
name = "pierre-llm"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LLM provider integrations for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["llm", "http-client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1.50", features = ["time", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }
bytes = "1.11"
futures-util = "0.3"
bitflags = { version = "2.11", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
embacle = { version = "0.25.0", features = ["copilot-headless", "openai-api"] }
# Compiled-in prompt/config baseline (replaces the vendor/contremaitre submodule).
# Pinned by rev — the contremaitre-bump workflow advances this to contremaitre main.
dravr-contremaitre = { git = "https://github.com/dravr-ai/dravr-contremaitre.git", rev = "69ed18facf25da94c991f924d0a927a751f71853" }

[dev-dependencies]
# The fallback chain's decisions are only observable by driving a real
# `complete()`/`complete_with_tools()` call, both of which are async.
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
