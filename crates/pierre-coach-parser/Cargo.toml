# ABOUTME: Coach markdown + YAML frontmatter parser — Claude-Skills-style coach definitions
# ABOUTME: Used by seeders (startup ingestion) and services (admin import)

[package]
name = "pierre-coach-parser"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Coach markdown + frontmatter parser for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true
