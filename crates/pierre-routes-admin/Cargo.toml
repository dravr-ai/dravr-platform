# ABOUTME: Admin route group — programmatic /admin/* + cookie-auth /api/admin/* surfaces
# ABOUTME: Owns AdminApiContext, AdminRoutes, AdminAuthService, AdminJwtManager — decoupled from pierre-server

[package]
name = "pierre-routes-admin"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Admin REST routes (users, tokens, API keys, settings, claim verdicts, coach grading, harness config) for the Pierre platform"
repository = "https://github.com/dravr-ai/cdn-platform"
publish = false

[dependencies]
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-email = { version = "0.3.0", path = "../pierre-email" }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime" }

axum = { version = "0.8", features = ["macros"] }
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[features]
default = []
tools-verification = ["dep:pierre-evals", "pierre-services/tools-verification"]
# Enables the `/api/admin/contremaitre/*` write-back routes (prompts,
# manual sync, coach promotion). Composition root opts in alongside the
# `pierre_mcp_server/contremaitre` feature.
contremaitre = []

[lints]
workspace = true
