# ABOUTME: Core types and constants for Pierre fitness API platform
# ABOUTME: Foundation crate with error types, pagination, formatters, and constants

[package]
name = "pierre-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core types and constants for Pierre fitness intelligence platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []

# LLM provider trait and types (async-trait, tokio-stream for ChatStream)
llm = ["dep:async-trait", "dep:tokio-stream", "dep:embacle"]

# Pluggable billing provider trait + DummyProvider (async-trait)
billing = ["dep:async-trait"]

# Real Stripe billing provider — StripeProvider adapter over dravr-stripe.
# Production binaries enable this; trait-only consumers stay vendor-free.
billing-stripe = ["billing", "dep:dravr-stripe"]

# HTTP response support (IntoResponse for AppError)
http-response = ["dep:axum", "dep:http"]

# Database error types (DatabaseError with sqlx::Error conversion)
database-errors = ["dep:sqlx"]

# sqlx Type/Encode/Decode derives for domain types (TenantId, etc.)
# `uuid` and `chrono` features bring in the Type/Encode/Decode impls that
# TenantId uses to delegate to <Uuid as Encode<Postgres>> / <Decode<Postgres>>.
sqlx-types = ["dep:sqlx", "sqlx/derive", "sqlx/uuid", "sqlx/chrono"]

# SQLite-specific Encode/Type for domain types (TenantId as TEXT, not BLOB)
sqlx-sqlite = ["sqlx-types", "sqlx/sqlite"]

# PostgreSQL-specific Encode/Type for domain types (TenantId as UUID)
sqlx-postgres = ["sqlx-types", "sqlx/postgres"]

# Provider error types (ProviderError with reqwest::Error)
provider-errors = ["dep:reqwest"]

# Shared HTTP client singletons (api_client, llm_client). reqwest-middleware
# wraps every shared client so the return type is stable whether or not
# telemetry is compiled in; the tracing middleware is layered on by `telemetry`.
http-client = ["dep:reqwest", "dep:reqwest-middleware"]

# Outbound W3C trace-context propagation on the shared HTTP clients via the in-house
# trace_propagation middleware (injects `traceparent`, emits client spans). In-house
# because reqwest-tracing's opentelemetry_0_32 support requires reqwest 0.13, which
# the workspace has not adopted.
telemetry = [
    "http-client",
    "dep:async-trait",
    "dep:http",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
]

# Cryptographic error conversions (ring::error::Unspecified)
crypto-errors = ["dep:ring"]

# Admin JWT utilities (AdminJwtManager with token generation, hashing)
admin-jwt = ["dep:rand", "dep:bcrypt"]

# All error features (convenience for main crate)
all-errors = ["database-errors", "provider-errors", "crypto-errors"]

# All database-related features (errors + type derives)
all-database = ["database-errors", "sqlx-types"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
base64 = "0.22"
tracing = "0.1"
bitflags = { version = "2.11", features = ["serde"] }
toml = "0.8"

# Optional: HTTP response support
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }
http = { version = "1.4", optional = true }

# Optional: Database error types
sqlx = { version = "0.8", optional = true, default-features = false }

# Optional: Provider error types
reqwest = { version = "0.12", optional = true, default-features = false }

# Optional: middleware wrapper for the shared HTTP clients (always paired with
# `http-client`); the OTLP trace-propagation middleware (paired with `telemetry`)
# needs the OpenTelemetry propagation API plus the tracing-span bridge.
reqwest-middleware = { version = "0.3", optional = true, features = ["json"] }
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }

# Optional: Cryptographic error types
ring = { version = "0.17", optional = true }

# Optional: LLM provider trait
async-trait = { version = "0.1", optional = true }
tokio-stream = { version = "0.1", optional = true }

# Optional: Embacle CLI LLM runner types (standalone library)
embacle = { version = "0.22.0", optional = true }

# Standalone messaging types and channel adapters (dravr-canot)
# pierre-core only re-exports types/errors — channel adapters enabled via pierre-messaging
dravr-canot = { git = "https://github.com/dravr-ai/dravr-canot.git", tag = "v0.4.25" }

# Standalone sports science intelligence engine (dravr-cageux)
# pierre-core re-exports Activity, SportType, and intelligence types
dravr-cageux = { git = "https://github.com/dravr-ai/dravr-cageux.git", tag = "v0.6.0" }

# Health and wellness domain models with composition-based provider traits
dravr-equilibre = { git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.2.4" }

# Standalone Stripe billing capability — gated behind the `billing-stripe`
# feature so the trait-only `billing` feature stays vendor-free. The
# StripeProvider adapter in src/billing/stripe.rs maps these types onto the
# BillingProvider trait DTOs.
dravr-stripe = { git = "https://github.com/dravr-ai/dravr-stripe.git", tag = "v0.1.12", optional = true }

# SHA-256 for system-prompt fingerprinting (safety::prompt_fingerprint) and
# admin JWT hashing. Non-optional because prompt fingerprinting is part of
# the always-on safety surface.
sha2 = "0.10"

# Optional: Admin JWT utilities
rand = { version = "0.9", optional = true }
bcrypt = { version = "0.16", optional = true }

[dev-dependencies]
# Used by the in-tree DummyProvider unit tests under `billing::dummy::tests`.
tokio = { version = "1.48", features = ["macros", "rt", "net", "io-util", "time"] }
# tests/trace_propagation_test.rs builds a real in-memory OTLP-less pipeline
# (SdkTracerProvider + InMemorySpanExporter) to pin traceparent injection.
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "testing"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints]
workspace = true
