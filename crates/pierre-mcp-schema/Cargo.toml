# ABOUTME: MCP wire protocol schema definitions (Initialize, Complete, ToolSchema, ProgressNotification)
# ABOUTME: Extracted from pierre-server as a config-agnostic leaf — only depends on serde

[package]
name = "pierre-mcp-schema"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Model Context Protocol schema definitions for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-config = { version = "0.3.0", path = "../pierre-config" }
dravr-tronc = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
