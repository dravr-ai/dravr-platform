<!DOCTYPE html>
<!-- ABOUTME: OAuth 2.0 authorization-server login page an MCP client sends the athlete to -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; the hidden fields carry the PKCE request through -->
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<!-- Copyright (c) 2026 dravr.ai -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Login - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <h1>Login</h1>
        <form method="post" action="/oauth2/login">
            <input type="hidden" name="client_id" value="{{CLIENT_ID}}">
            <input type="hidden" name="redirect_uri" value="{{REDIRECT_URI}}">
            <input type="hidden" name="response_type" value="{{RESPONSE_TYPE}}">
            <input type="hidden" name="state" value="{{STATE}}">
            <input type="hidden" name="scope" value="{{SCOPE}}">
            <input type="hidden" name="code_challenge" value="{{CODE_CHALLENGE}}">
            <input type="hidden" name="code_challenge_method" value="{{CODE_CHALLENGE_METHOD}}">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{DEFAULT_EMAIL}}" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="{{DEFAULT_PASSWORD}}" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
    </main>
</body>
</html>
