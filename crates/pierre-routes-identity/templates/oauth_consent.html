<!DOCTYPE html>
<!-- ABOUTME: OAuth 2.0 consent page: names the client and the scopes it asks for, then approve or deny -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; each scope arrives as an escaped list item -->
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<!-- Copyright (c) 2026 dravr.ai -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Authorize access - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card card-center">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <h1>Authorize access</h1>
        <p class="lead"><span class="client">{{CLIENT_ID}}</span> wants to access your Dravr fitness data.</p>
        <div class="scopes">
            <div class="scopes-title">This will allow it to</div>
            <ul>
                {{SCOPE_ITEMS}}
            </ul>
        </div>
        <form method="post" action="/oauth2/consent">
            <input type="hidden" name="client_id" value="{{CLIENT_ID}}">
            <input type="hidden" name="redirect_uri" value="{{REDIRECT_URI}}">
            <input type="hidden" name="response_type" value="{{RESPONSE_TYPE}}">
            <input type="hidden" name="state" value="{{STATE}}">
            <input type="hidden" name="scope" value="{{SCOPE}}">
            <input type="hidden" name="code_challenge" value="{{CODE_CHALLENGE}}">
            <input type="hidden" name="code_challenge_method" value="{{CODE_CHALLENGE_METHOD}}">
            <div class="actions">
                <button type="submit" name="decision" value="approve" class="btn btn-primary btn-block">Allow access</button>
                <button type="submit" name="decision" value="deny" class="btn btn-secondary btn-block">Deny</button>
            </div>
        </form>
        <p class="fineprint">You can revoke this access at any time in your Dravr settings.</p>
    </main>
</body>
</html>
