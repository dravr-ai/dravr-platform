# ABOUTME: Domain service layer — leaf services extracted from pierre-server
# ABOUTME: Protocol-agnostic business logic reusable across REST, MCP, A2A

[package]
name = "pierre-services"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Domain service layer for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
# Forwarded to pierre-database/pierre-core for backend dispatch
postgresql = ["pierre-database/postgresql", "pierre-test-support/postgresql"]
# Bullshit detector services (claim_verification, claim_verdict_backfill, eval_harness)
tools-verification = ["dep:pierre-evals"]
# Messaging-related services (messaging_outbound, messaging_seed, channel_error_reply, messaging_status_bridge)
client-messaging = [
    "dep:dravr-canot",
    "dep:pierre-agui",
    "dravr-canot/agui",
    "dravr-canot/channel-discord",
    "dravr-canot/channel-slack",
    "dravr-canot/channel-telegram",
]
# Push notification dispatch in coach_followup_scheduler
client-notifications = []
# Health-data sync adapter (health_sync)
health-sync = ["dep:dravr-enforme", "dep:pierre-logging"]
# PostHog analytics implementation
analytics-posthog = []

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
pierre-agui = { version = "0.3.0", path = "../pierre-agui", optional = true }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
# Emails the super-admins about each coach-access request opened.
pierre-email = { version = "0.3.0", path = "../pierre-email" }
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
dravr-cageux = { workspace = true }
# The FIT decoder a Garmin push activity file is read with.
dravr-barrage = { workspace = true }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
# The price table and token-count arithmetic; the override registry here layers on them.
embacle = { version = "0.44.0" }
pierre-mcp-transport = { version = "0.3.0", path = "../pierre-mcp-transport" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
# Records the athlete's tenant on the scheduled sync's span once its token row is read.
pierre-logging = { version = "0.3.0", path = "../pierre-logging", optional = true }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
dravr-canot = { workspace = true, optional = true }
pierre-groups = { version = "0.3.0", path = "../pierre-groups" }
pierre-notifications = { version = "0.3.0", path = "../pierre-notifications" }
# provider-sciotte (a default) is named: the Garmin push ingest reads Garmin's
# activity types through sciotte_provider::convert_sport_type.
pierre-providers = { version = "0.3.0", path = "../pierre-providers", features = ["provider-sciotte"] }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
dravr-meteo = { workspace = true }
# Localized short dates (month names in the five platform locales) for the
# dated conversation title, shared with the chart axis ticks.
photograveur = { workspace = true }
dravr-enforme = { workspace = true, optional = true, features = ["provider-whoop", "provider-garmin", "provider-coros"] }
# The scraper service's typed client and the session, roster and athlete types
# its reads and session drops name.
dravr-sciotte = { workspace = true, features = ["client"] }
# The wellness models and their per-night / per-day merge: `stored_health`
# is the one place that merges, and the health-sync adapter writes the models.
dravr-equilibre-sync = { workspace = true }
# riviere's TimeSeriesStore: the health-sync adapter writes continuous series
# through it, and `continuous_series` reads them back.
dravr-riviere = { workspace = true }

async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dashmap = "5.5"
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Derives the JSON Schema SyncMetrics declares through get_data_freshness.
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Reads a stored package flavour as a document, so the boot repair can edit it and verify the edit.
serde-saphyr = "1.3"
secrecy = { workspace = true }
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
# TaskTracker: llm_usage writes are spawned on the server's shutdown drain.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
# Property tests for the OAuth redirect allowlist (carnet#1143).
proptest = { version = "1", default-features = false, features = ["std"] }
# Test fixtures (create_test_db, user fixtures): a dev-dependency only, per ADR-027.
pierre-test-support = { version = "0.3.0", path = "../pierre-test-support" }
# Captures the `llm call cost` line's fields in the recorder's unit test.
tracing-subscriber = { version = "0.3", features = ["std", "registry"], default-features = false }
# The header type dravr-enforme's SyncProvider::validate_webhook takes, for
# the scheduled-sync test's stand-in provider.
http = "1"

[lints]
workspace = true
