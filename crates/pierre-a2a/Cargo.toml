# ABOUTME: A2A (Agent-to-Agent) protocol — types, agent card, server, client manager, auth
# ABOUTME: Extracted from pierre-server so the protocol implementation compiles independently

[package]
name = "pierre-a2a"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A2A protocol implementation for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-mcp-schema = { version = "0.3.0", path = "../pierre-mcp-schema" }
pierre-mcp-transport = { version = "0.3.0", path = "../pierre-mcp-transport" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime" }
dravr-tronc = { git = "https://github.com/dravr-ai/dravr-tronc.git", tag = "v0.6.1" }

bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
tracing = "0.1"
url = "2"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
