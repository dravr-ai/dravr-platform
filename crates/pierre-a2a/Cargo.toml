# ABOUTME: A2A protocol types, agent card, and client data structures
# ABOUTME: Extracted from main crate for parallel compilation and modularity

[package]
name = "pierre-a2a"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A2A protocol types and agent card for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
