# ABOUTME: Authentication, authorization, and security for the Pierre platform
# ABOUTME: JWT auth, OAuth2 client/server, tenant management, cryptographic utilities

[package]
name = "pierre-auth"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Auth layer for Pierre platform - JWT, OAuth2, security, tenant, crypto"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
testing = []
# Enables the GCP Cloud KMS KekProvider (selected at bootstrap when
# PIERRE_KMS_KEY_RESOURCE is set). Off by default; dev/CI use the local KEK.
gcp-kms = []

[dependencies]
# Workspace crates
# `http-client` carries the shared `api_inner_client` the Firebase key set
# fetches with and the GCP `TokenProvider` the Cloud KMS KEK provider uses.
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors", "sqlx-types", "sqlx-sqlite", "admin-jwt", "http-client"] }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
# The OAuth2 endpoint limiter counts its windows in the server's shared cache
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
# Google's published signing keys (`GoogleKeySet`) for Firebase ID tokens
dravr-tronc = { workspace = true, features = ["google-iam"] }

# Async runtime and traits
async-trait = "0.1"
tokio = { version = "1.50", features = ["time", "sync", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1.22", features = ["v4", "serde"] }

# HTTP framework (for cookie/header types)
axum = { version = "0.8", features = ["json"], default-features = false }
http = "1.4"

# HTTP client (for OAuth flows)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# URL handling
url = "2.5"

# JWT
jsonwebtoken = { version = "10.3", features = ["rust_crypto", "use_pem"], default-features = false }

# Cryptography
ring = "0.17"
sha2 = "0.10"
rand = "0.9"
aes-gcm = "0.10"
rsa = "0.9"
ed25519-dalek = "2.2"
argon2 = "0.5"
bcrypt = "0.16"
zeroize = { version = "1.8", features = ["alloc"] }

# Apple App Attest: the CBOR evidence, the X.509 chain to Apple's root, and
# the nonce extension inside the credential certificate
ciborium = "0.2"
der = "0.7"
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
x509-cert = { version = "0.2", default-features = false }

# Encoding
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"

# Logging
tracing = "0.1"

# Bitflags (for permission flags)
bitflags = { version = "2.11", features = ["serde"] }

# Number traits
num-traits = "0.2"

[dev-dependencies]
# Async test harness for the KekProvider (wrap/unwrap are async)
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
