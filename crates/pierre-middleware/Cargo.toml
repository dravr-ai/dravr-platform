# ABOUTME: HTTP middleware layer — auth, CSRF, CORS, rate limiting, redaction, tracing
# ABOUTME: Uses MiddlewareCtx trait to stay decoupled from pierre-server's ServerContext

[package]
name = "pierre-middleware"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "HTTP middleware layer for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
# HTTP request metrics + inbound W3C trace-context extraction. No-op unless the OTLP
# pipeline is active (see pierre-logging `telemetry`).
telemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-logging = { version = "0.3.0", path = "../pierre-logging" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
axum = { version = "0.8", features = ["macros", "ws"] }
bitflags = "2"
dravr-tronc = { workspace = true }
futures-util = "0.3"
http = "1"
jsonwebtoken = { version = "12", features = ["rust_crypto", "use_pem"], default-features = false }
opentelemetry = { version = "0.32", features = ["trace", "metrics"], optional = true }
regex = "1"
tracing-opentelemetry = { version = "0.33", optional = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
# Property tests for the redactors (carnet#1143).
proptest = { version = "1", default-features = false, features = ["std"] }
# log_capture: asserts the usage-limit line a refused budget logs (carnet#1630).
pierre-test-support = { version = "0.3.0", path = "../pierre-test-support" }

[lints]
workspace = true
