[package]
name = "pierre_mcp_server"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pierre Fitness API - Multi-protocol fitness data API for LLMs (MCP + A2A)"
repository = "https://github.com/dravr-ai/dravr-platform"
keywords = ["mcp", "fitness", "strava", "api", "claude"]
categories = ["api-bindings", "web-programming"]
publish = false

[lib]
name = "pierre_mcp_server"
path = "src/lib.rs"
# Disable built-in bench harness for lib (we use Criterion benches in benches/ instead)
bench = false

[[bin]]
name = "pierre-mcp-server"
path = "src/bin/pierre-mcp-server.rs"
bench = false

# [[bin]]
# name = "auth-setup"
# path = "src/bin/auth_setup.rs"

# pierre-cli has been extracted to its own crate at crates/pierre-cli/.
# Seeder binaries are consolidated under `pierre-cli seed <domain>` subcommands;
# seeder logic lives in crates/pierre-seeders/.

# [[bin]]
# name = "serve-docs"
# path = "src/bin/serve_docs.rs"
# NOTE: Temporarily disabled during Warp-to-Axum migration

[features]
default = ["sqlite", "server-full", "sqlx/migrate"]
sqlite = []
postgresql = ["sqlx/postgres", "pierre-core/sqlx-postgres", "pierre-database/postgresql", "pierre-health/postgresql", "pierre-fitness-compute/postgresql", "pierre-notifications/postgresql", "pierre-services/postgresql"]
testing = []
telemetry = ["pierre-logging/telemetry", "pierre-middleware/telemetry", "pierre-core/telemetry"]
toon = ["dep:toon-format", "pierre-formatters/toon"]
analytics-posthog = ["pierre-services/analytics-posthog"]

# Key management feature flags
# Compiles the GCP Cloud KMS KEK provider; selected at runtime when PIERRE_KMS_KEY_RESOURCE is set (ADR-017)
gcp-kms = ["pierre-auth/gcp-kms"]

# Provider feature flags - forwarded to pierre-providers crate
provider-strava = ["pierre-providers/provider-strava"]
provider-garmin = ["pierre-providers/provider-garmin"]
provider-terra = ["pierre-providers/provider-terra"]
provider-fitbit = ["pierre-providers/provider-fitbit"]
provider-whoop = ["pierre-providers/provider-whoop"]
provider-coros = ["pierre-providers/provider-coros"]
provider-intervals-icu = ["pierre-providers/provider-intervals-icu"]
provider-sciotte = ["pierre-providers/provider-sciotte", "pierre-routes-auth?/provider-sciotte"]
health-sync = ["dep:pierre-enforme", "pierre-enforme/provider-whoop", "pierre-enforme/provider-garmin", "pierre-enforme/provider-strava", "dep:dravr-equilibre-sync", "pierre-services/health-sync", "pierre-tool-runtime/health-sync", "pierre-routes-auth?/health-sync", "pierre-chat-pipeline?/health-sync"]
all-providers = ["provider-strava", "provider-garmin", "provider-terra", "provider-fitbit", "provider-whoop", "provider-coros", "provider-intervals-icu", "provider-sciotte"]
production-providers = ["provider-strava", "provider-garmin", "provider-terra", "provider-fitbit", "provider-whoop", "provider-coros", "provider-intervals-icu", "provider-sciotte"]

# Tool feature flags - enable/disable MCP tool categories
# All tools (default)
tools-all = [
    "tools-connection",
    "tools-data",
    "tools-analytics",
    "tools-goals",
    "tools-config",
    "tools-nutrition",
    "tools-sleep",
    "tools-recipes",
    "tools-coaches",
    "tools-admin",
    "tools-mobility",
    "tools-groups",
    "tools-memory",
    "tools-verification",
]

# Individual tool categories
tools-connection = ["pierre-tool-runtime/tools-connection"]      # connect_provider, get_connection_status, disconnect (+ refresh_provider_data, get_data_freshness)
tools-data = ["pierre-tool-runtime/tools-data"]            # get_activities, get_athlete, get_stats (+ endurance workouts)
tools-analytics = ["pierre-tool-runtime/tools-analytics"]       # analyze_activity, calculate_metrics, trends, discover_routes
tools-goals = ["pierre-tool-runtime/tools-goals"]           # set_goal, track_progress, suggest_goals
tools-config = ["pierre-tool-runtime/tools-config"]        # fitness config tools, user configuration
tools-nutrition = ["pierre-tool-runtime/tools-nutrition"]       # daily_nutrition, nutrient_timing, food search
tools-sleep = ["pierre-tool-runtime/tools-sleep"]           # sleep_quality, recovery_score, rest_day
tools-health-data = []     # sleep_sessions, recovery, health_snapshots, data_sources persistence queries
tools-recipes = ["pierre-tool-runtime/tools-recipes"]         # validate_recipe, save_recipe, list_recipes
tools-coaches = ["pierre-tool-runtime/tools-coaches"]         # coach CRUD, activate, favorites
tools-admin = ["tools-coaches", "pierre-tool-runtime/tools-admin"]  # admin tools depend on coach tools
tools-mobility = ["pierre-tool-runtime/tools-mobility"]        # stretching exercises, yoga poses, mobility recommendations
tools-groups = ["dep:pierre-groups", "pierre-tool-runtime/tools-groups", "pierre-commands?/tools-groups", "pierre-chat-pipeline?/tools-groups"]  # group coaching tools (create, join, manage, analytics) + group_fitness snapshot fetcher
tools-memory = ["pierre-tool-runtime/tools-memory"]          # coach-authored memory: notes, followups, fact recall (Tier 3 harness)
tools-verification = ["dep:pierre-evals", "pierre-services/tools-verification", "pierre-routes-admin/tools-verification", "pierre-tool-runtime/tools-verification", "pierre-chat-pipeline?/tools-verification"]  # bullshit detector: verify_claim tool + dispatch hook

# Convenience bundles for common deployments
tools-fitness-core = ["tools-connection", "tools-data", "tools-analytics"]
tools-wellness = ["tools-sleep", "tools-nutrition", "tools-recipes", "tools-mobility", "tools-health-data"]

# ═══════════════════════════════════════════════════════════════
# PROTOCOL FEATURES
# ═══════════════════════════════════════════════════════════════
protocol-rest = ["dep:pierre-routes-auth"]
protocol-mcp = ["transport-http"]  # Requires at least HTTP transport
protocol-a2a = ["transport-http", "dep:pierre-a2a", "dep:pierre-routes-a2a"]

protocol-all = ["protocol-rest", "protocol-mcp", "protocol-a2a"]

# ═══════════════════════════════════════════════════════════════
# TRANSPORT FEATURES
# ═══════════════════════════════════════════════════════════════
transport-http = []
transport-sse = ["dep:pierre-sse", "pierre-agui/transport-sse", "pierre-tool-runtime/transport-sse", "pierre-chat-pipeline?/transport-sse"]
transport-stdio = []

transport-all = ["transport-http", "transport-sse", "transport-stdio"]
transport-web = ["transport-http", "transport-sse"]

# ═══════════════════════════════════════════════════════════════
# GRANULAR CLIENT-WEB FEATURES
# ═══════════════════════════════════════════════════════════════
client-dashboard = ["protocol-rest", "dep:pierre-routes-dashboard"]     # dashboard routes (extracted to pierre-routes-dashboard)
client-settings = ["protocol-rest"]      # configuration.rs, fitness.rs
client-chat = ["protocol-rest", "pierre-tool-runtime/client-chat", "dep:pierre-chat-pipeline"]  # chat.rs + tool-loop strategies in pierre-tool-runtime; chat pipeline orchestrator extracted to pierre-chat-pipeline
client-coaches = ["protocol-rest", "tools-coaches"]  # coaches.rs
client-oauth-apps = ["protocol-rest", "oauth"]       # user_oauth_apps.rs

client-store = ["protocol-rest"]  # Coach Store REST API routes (pierre-routes-coaches build_store_router)
client-social = ["protocol-rest", "dep:pierre-routes-social"]   # social.rs - coach-mediated social features (friends/feed/settings via pierre-routes-social)
client-groups = ["protocol-rest", "tools-groups", "dep:pierre-routes-social"]  # group coaching routes (extracted to pierre-routes-social)

client-web = ["client-dashboard", "client-settings", "client-chat", "client-coaches", "client-oauth-apps", "client-store", "client-social", "client-groups"]

# ═══════════════════════════════════════════════════════════════
# GRANULAR CLIENT-ADMIN FEATURES
# ═══════════════════════════════════════════════════════════════
client-admin-api = ["protocol-rest"]     # admin.rs
client-admin-ui = ["protocol-rest", "dep:pierre-routes-web-admin"]      # web_admin.rs (extracted to pierre-routes-web-admin)
client-api-keys = ["protocol-rest"]      # api_keys.rs
client-tenants = ["protocol-rest"]       # tenants.rs
client-impersonation = ["protocol-rest"] # impersonation.rs
client-llm-settings = ["protocol-rest"]  # llm_settings.rs
client-tool-selection = ["protocol-mcp"] # tool_selection.rs

client-admin = ["client-admin-api", "client-admin-ui", "client-api-keys", "client-tenants", "client-impersonation", "client-llm-settings", "client-tool-selection"]

# ═══════════════════════════════════════════════════════════════
# OTHER CLIENT FEATURES
# ═══════════════════════════════════════════════════════════════
client-mobile = ["protocol-rest"]        # Mobile-specific routes (subset)
client-mcp-tokens = ["protocol-mcp"]     # user_mcp_tokens.rs

client-messaging = ["protocol-rest", "dep:pierre-messaging", "dep:pierre-commands", "pierre-messaging/all-channels", "pierre-services/client-messaging"]
client-notifications = ["protocol-rest", "dep:pierre-notifications", "dep:pierre-routes-social", "pierre-routes-social?/client-notifications", "pierre-services/client-notifications", "pierre-routes-coaches/client-notifications", "pierre-tool-runtime/client-notifications"]   # push notification routes (extracted to pierre-routes-social)

client-all = ["client-web", "client-admin", "client-mobile", "client-mcp-tokens", "client-messaging", "client-notifications"]

# ═══════════════════════════════════════════════════════════════
# OAUTH (shared infrastructure)
# ═══════════════════════════════════════════════════════════════
oauth = []

# ═══════════════════════════════════════════════════════════════
# SERVER PROFILES
# ═══════════════════════════════════════════════════════════════
server-full = ["protocol-all", "transport-all", "client-all", "client-messaging", "oauth", "provider-whoop", "provider-strava", "provider-garmin", "provider-sciotte", "provider-intervals-icu", "tools-all", "toon", "health-sync", "analytics-posthog", "gcp-kms"]
server-production = ["protocol-all", "transport-all", "client-all", "client-messaging", "oauth", "provider-whoop", "provider-strava", "provider-garmin", "provider-sciotte", "provider-intervals-icu", "tools-all", "toon", "health-sync", "analytics-posthog", "gcp-kms"]
server-mcp-stdio = ["protocol-mcp", "transport-stdio", "oauth", "all-providers", "tools-all", "gcp-kms"]
server-mcp-bridge = ["protocol-mcp", "protocol-a2a", "transport-web", "oauth", "all-providers", "tools-all", "gcp-kms"]
server-mobile-backend = ["protocol-rest", "protocol-mcp", "client-mobile", "client-settings", "client-store", "oauth", "all-providers", "tools-all", "gcp-kms"]
server-saas-full = ["protocol-rest", "protocol-mcp", "transport-web", "client-web", "client-admin", "client-messaging", "oauth", "all-providers", "tools-all", "analytics-posthog", "gcp-kms"]

# OpenAPI documentation (SwaggerUI) - excluded from production by default
# Enable with: cargo build --features openapi
openapi = ["dep:utoipa", "dep:utoipa-axum", "dep:utoipa-swagger-ui", "pierre-core/openapi", "pierre-routes-coaches/openapi", "pierre-routes-social?/openapi"]

[dependencies]
# Workspace crates (sibling crates under crates/)
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors", "sqlx-types", "sqlx-sqlite", "http-client", "billing", "billing-stripe"] }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-agui = { version = "0.3.0", path = "../pierre-agui" }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-chat-pipeline = { version = "0.3.0", path = "../pierre-chat-pipeline", optional = true }
pierre-commands = { version = "0.3.0", path = "../pierre-commands", optional = true }
pierre-formatters = { version = "0.3.0", path = "../pierre-formatters" }
pierre-coach-parser = { version = "0.3.0", path = "../pierre-coach-parser" }
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-email = { version = "0.3.0", path = "../pierre-email" }
pierre-external = { version = "0.3.0", path = "../pierre-external" }
pierre-logging = { version = "0.3.0", path = "../pierre-logging" }
pierre-seeders = { version = "0.3.0", path = "../pierre-seeders" }
pierre-mcp-schema = { version = "0.3.0", path = "../pierre-mcp-schema" }
pierre-mcp-transport = { version = "0.3.0", path = "../pierre-mcp-transport" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-tools-core = { version = "0.3.0", path = "../pierre-tools-core" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-routes-admin = { version = "0.3.0", path = "../pierre-routes-admin" }
pierre-routes-auth = { version = "0.3.0", path = "../pierre-routes-auth", optional = true }
pierre-routes-billing = { version = "0.3.0", path = "../pierre-routes-billing" }
pierre-routes-coaches = { version = "0.3.0", path = "../pierre-routes-coaches" }
pierre-routes-dashboard = { version = "0.3.0", path = "../pierre-routes-dashboard", optional = true }
pierre-routes-identity = { version = "0.3.0", path = "../pierre-routes-identity" }
pierre-routes-social = { version = "0.3.0", path = "../pierre-routes-social", optional = true }
pierre-routes-web-admin = { version = "0.3.0", path = "../pierre-routes-web-admin", optional = true }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-sse = { version = "0.3.0", path = "../pierre-sse", optional = true }
pierre-intelligence = { version = "0.3.0", path = "../pierre-intelligence" }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
pierre-cache = { version = "0.3.0", path = "../pierre-cache", features = ["redis"] }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-health = { version = "0.3.0", path = "../pierre-health" }
pierre-a2a = { version = "0.3.0", path = "../pierre-a2a", optional = true }
pierre-routes-a2a = { version = "0.3.0", path = "../pierre-routes-a2a", optional = true }
pierre-messaging = { version = "0.3.0", path = "../pierre-messaging", optional = true }
pierre-notifications = { version = "0.3.0", path = "../pierre-notifications", optional = true }
pierre-groups = { version = "0.3.0", path = "../pierre-groups", optional = true }
pierre-providers = { version = "0.3.0", path = "../pierre-providers" }
# Assets crate: structured-output directive + workout schema consumed by the chat pipeline context.
dravr-contremaitre = { git = "https://github.com/dravr-ai/dravr-contremaitre.git", rev = "e44a01c651536ba4defa91e487a9b59e2e688958" }
dravr-tronc = { git = "https://github.com/dravr-ai/dravr-tronc.git", tag = "v0.6.0", features = ["notifications"] }
pierre-weather = { path = "../pierre-weather", version = "0.3.0" }
pierre-enforme = { path = "../pierre-enforme", version = "0.3.0", optional = true, features = ["provider-whoop"] }
dravr-equilibre-sync = { package = "dravr-equilibre", git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.2.4", optional = true }

tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "io-std", "io-util", "sync"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
reqwest-middleware = "0.3"
async-stream = "0.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "registry", "json"], default-features = false }
# HTTP tracing middleware
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "timeout", "limit", "set-header", "catch-panic"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Lightweight language detector used to pick the message-local locale for
# status/thinking placeholders and scope-refusal interpolation. Falls back
# to the user's stored locale when the score is below whatlang's confidence
# threshold (short / mixed-language messages).
whatlang = "0.16"
base64 = "0.22"
bytes = "1.11"
url = "2.5"
clap = { version = "4.5", features = ["derive", "std", "env"], default-features = false }
dirs = "5.0"
uuid = { version = "1.22", features = ["v4", "v5", "serde"] }
dashmap = "5.5"
urlencoding = "2.1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
# QR codes for the messaging deep-link onboarding step (desktop→phone handoff).
# Only the `svg` renderer — drops the heavy `image`/`bmp` integrations (binary size).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
aes-gcm = "0.10"
# Encryption and database support for multi-tenant
ring = "0.17"
ed25519-dalek = "2.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "derive", "migrate", "macros"], default-features = false }
bcrypt = "0.16"
argon2 = "0.5"
# JWT: rust_crypto backend uses crates already in our dep tree (sha2, rsa, ed25519-dalek)
jsonwebtoken = { version = "10.3", features = ["rust_crypto", "use_pem"], default-features = false }
subtle = "2.6"
zeroize = { version = "1.8", features = ["alloc"] }
hex = "0.4"
# HTTP framework: Axum (migrated from Warp)
axum = { version = "0.8", features = ["json", "query", "macros", "tokio", "http2", "form"], default-features = false }
axum-extra = { version = "0.12", features = ["typed-header"] }
http = "1.4"
futures-util = "0.3"
# WebSocket client for Slack Socket Mode ingress; `connect_async` opens a
# TLS-protected WSS to Slack after `apps.connections.open` returns an URL.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
eventsource-stream = "0.2"
base64ct = "1.8"
# LRU cache for bounded session storage (DoS prevention)
lru = "0.18.2"
# Glob pattern matching for cache invalidation
glob = "0.3"
# Regex for PII redaction and pattern matching
regex = "1.12"
# Bitflags for PII redaction feature configuration
bitflags = { version = "2.11", features = ["serde"] }
# Redis client with connection pooling and async support
redis = { version = "0.28", features = ["tokio-comp", "connection-manager", "aio"] }

num-traits = "0.2"
# Rayon for CPU-bound parallel data processing (zone analysis, fitness calculations)
rayon = "1.11"
rsa = "0.9"
# TOON format for token-efficient LLM serialization (~40% token reduction vs JSON)
toon-format = { version = "0.2", optional = true }
rand_chacha = "0.9"
# OpenAPI documentation generation with utoipa
# OpenAPI documentation - optional (enable with --features openapi)
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"], optional = true }
utoipa-axum = { version = "0.2", optional = true }
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }
html-escape = "0.2.13"
cron = "0.15.0"
# Product analytics — optional PostHog integration for messaging funnel tracking
# posthog-rs removed: it depends on reqwest 0.11/hyper 0.14, causing duplicate hyper.
# PostHog capture API is called directly via the existing reqwest 0.12 dependency.

[dev-dependencies]
# Integration tests only — production code uses structured AppError (anyhow is banned in src/)
anyhow = "1.0"
embacle = { git = "https://github.com/dravr-ai/dravr-embacle.git", tag = "v0.20.0" }
tempfile = "3.26"
serial_test = "3.4"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
serde_urlencoded = "0.7"
toml = "0.8"
# Messaging transport test dependencies (crypto verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
ed25519-dalek = "2.2"
# Stripe billing webhook integration test signs payloads against StripeClient.
dravr-stripe = { git = "https://github.com/dravr-ai/dravr-stripe.git", tag = "v0.1.8" }

# Flamegraph profiler hook for criterion benches (`-- --profile-time N`).
# pprof builds on libc signals and does not compile on Windows, and cargo
# compiles every dev-dependency of this package for its lib tests, so an
# unconditional entry breaks `cargo test` on the Windows cross-platform job.
[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

# ============================================================================
# Benchmark Configuration
# ============================================================================
# Each benchmark suite is defined as a separate [[bench]] entry.
# Run all benchmarks: cargo bench
# Run specific suite: cargo bench --bench intelligence_bench
# Run specific benchmark: cargo bench --bench intelligence_bench -- "training_load"

[[bench]]
name = "intelligence_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false

[[bench]]
name = "serialization_bench"
harness = false

[[bench]]
name = "sse_concurrency_bench"
harness = false

[[bench]]
name = "guardian_bench"
harness = false

[[bench]]
name = "tool_dispatch_bench"
harness = false

[lints]
workspace = true
