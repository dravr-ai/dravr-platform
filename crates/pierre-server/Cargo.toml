[package]
name = "pierre_mcp_server"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pierre Fitness API - Multi-protocol fitness data API for LLMs (MCP + A2A)"
repository = "https://github.com/dravr-ai/dravr-platform"
keywords = ["mcp", "fitness", "strava", "api", "claude"]
categories = ["api-bindings", "web-programming"]
publish = false

[lib]
name = "pierre_mcp_server"
path = "src/lib.rs"
# Disable built-in bench harness for lib (we use Criterion benches in benches/ instead)
bench = false

[[bin]]
name = "pierre-mcp-server"
path = "src/bin/pierre-mcp-server.rs"
bench = false

# [[bin]]
# name = "auth-setup"
# path = "src/bin/auth_setup.rs"

[[bin]]
name = "pierre-cli"
path = "src/bin/pierre_cli/main.rs"
bench = false

# Seeder binaries have been consolidated into `pierre-cli seed <domain>` subcommands.
# Seeder logic now lives in `src/seeders/` and is dispatched by `bin/pierre_cli/commands/seed.rs`.

# [[bin]]
# name = "serve-docs"
# path = "src/bin/serve_docs.rs"
# NOTE: Temporarily disabled during Warp-to-Axum migration

[features]
default = ["sqlite", "server-full", "sqlx/migrate"]
sqlite = []
postgresql = ["sqlx/postgres", "pierre-core/sqlx-postgres", "pierre-database/postgresql", "pierre-notifications/postgresql"]
testing = []
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk"]
toon = ["dep:toon-format"]
analytics-posthog = []

# Provider feature flags - forwarded to pierre-providers crate
provider-strava = ["pierre-providers/provider-strava"]
provider-garmin = ["pierre-providers/provider-garmin"]
provider-terra = ["pierre-providers/provider-terra"]
provider-fitbit = ["pierre-providers/provider-fitbit"]
provider-whoop = ["pierre-providers/provider-whoop"]
provider-coros = ["pierre-providers/provider-coros"]
provider-synthetic = ["pierre-providers/provider-synthetic"]
provider-sciotte = ["pierre-providers/provider-sciotte", "dep:dravr-sciotte"]
health-sync = ["dep:dravr-enforme", "dep:dravr-equilibre-sync"]
all-providers = ["provider-strava", "provider-garmin", "provider-terra", "provider-fitbit", "provider-whoop", "provider-coros", "provider-synthetic", "provider-sciotte"]
production-providers = ["provider-strava", "provider-garmin", "provider-terra", "provider-fitbit", "provider-whoop", "provider-coros", "provider-sciotte"]

# Tool feature flags - enable/disable MCP tool categories
# All tools (default)
tools-all = [
    "tools-connection",
    "tools-data",
    "tools-analytics",
    "tools-goals",
    "tools-config",
    "tools-nutrition",
    "tools-sleep",
    "tools-recipes",
    "tools-coaches",
    "tools-admin",
    "tools-mobility",
    "tools-groups",
    "tools-memory",
    "tools-verification",
]

# Individual tool categories
tools-connection = []      # connect_provider, get_connection_status, disconnect
tools-data = []            # get_activities, get_athlete, get_stats
tools-analytics = []       # analyze_activity, calculate_metrics, trends
tools-goals = []           # set_goal, track_progress, suggest_goals
tools-config = []          # fitness config tools, user configuration
tools-nutrition = []       # daily_nutrition, nutrient_timing, food search
tools-sleep = []           # sleep_quality, recovery_score, rest_day
tools-health-data = []     # sleep_sessions, recovery, health_snapshots, data_sources persistence queries
tools-recipes = []         # validate_recipe, save_recipe, list_recipes
tools-coaches = []         # coach CRUD, activate, favorites
tools-admin = ["tools-coaches"]  # admin tools depend on coach tools
tools-mobility = []        # stretching exercises, yoga poses, mobility recommendations
tools-store = []           # store MCP tools (browse, search, install coaches)
tools-groups = ["dep:pierre-groups"]  # group coaching tools (create, join, manage, analytics)
tools-memory = []          # coach-authored memory: notes, followups, fact recall (Tier 3 harness)
tools-verification = ["dep:pierre-evals"]  # Tier 5.5 bullshit detector: verify_claim tool + dispatch hook

# Convenience bundles for common deployments
tools-fitness-core = ["tools-connection", "tools-data", "tools-analytics"]
tools-wellness = ["tools-sleep", "tools-nutrition", "tools-recipes", "tools-mobility", "tools-health-data"]

# ═══════════════════════════════════════════════════════════════
# PROTOCOL FEATURES
# ═══════════════════════════════════════════════════════════════
protocol-rest = []
protocol-mcp = ["transport-http"]  # Requires at least HTTP transport
protocol-a2a = ["transport-http", "dep:pierre-a2a"]

protocol-all = ["protocol-rest", "protocol-mcp", "protocol-a2a"]

# ═══════════════════════════════════════════════════════════════
# TRANSPORT FEATURES
# ═══════════════════════════════════════════════════════════════
transport-http = []
transport-websocket = []
transport-sse = []
transport-stdio = []

transport-all = ["transport-http", "transport-websocket", "transport-sse", "transport-stdio"]
transport-web = ["transport-http", "transport-websocket", "transport-sse"]

# ═══════════════════════════════════════════════════════════════
# GRANULAR CLIENT-WEB FEATURES
# ═══════════════════════════════════════════════════════════════
client-dashboard = ["protocol-rest"]     # dashboard.rs
client-settings = ["protocol-rest"]      # configuration.rs, fitness.rs
client-chat = ["protocol-rest"]          # chat.rs
client-coaches = ["protocol-rest", "tools-coaches"]  # coaches.rs
client-oauth-apps = ["protocol-rest", "oauth"]       # user_oauth_apps.rs

client-store = ["protocol-rest", "tools-store"]  # Store REST API routes + MCP tools
client-social = ["protocol-rest"]               # social.rs - coach-mediated social features
client-groups = ["protocol-rest", "tools-groups"]  # groups.rs - group coaching management

client-web = ["client-dashboard", "client-settings", "client-chat", "client-coaches", "client-oauth-apps", "client-store", "client-social", "client-groups"]

# ═══════════════════════════════════════════════════════════════
# GRANULAR CLIENT-ADMIN FEATURES
# ═══════════════════════════════════════════════════════════════
client-admin-api = ["protocol-rest"]     # admin.rs
client-admin-ui = ["protocol-rest"]      # web_admin.rs
client-api-keys = ["protocol-rest"]      # api_keys.rs
client-tenants = ["protocol-rest"]       # tenants.rs
client-impersonation = ["protocol-rest"] # impersonation.rs
client-llm-settings = ["protocol-rest"]  # llm_settings.rs
client-tool-selection = ["protocol-mcp"] # tool_selection.rs

client-admin = ["client-admin-api", "client-admin-ui", "client-api-keys", "client-tenants", "client-impersonation", "client-llm-settings", "client-tool-selection"]

# ═══════════════════════════════════════════════════════════════
# OTHER CLIENT FEATURES
# ═══════════════════════════════════════════════════════════════
client-mobile = ["protocol-rest"]        # Mobile-specific routes (subset)
client-mcp-tokens = ["protocol-mcp"]     # user_mcp_tokens.rs

client-messaging = ["protocol-rest", "dep:pierre-messaging", "pierre-messaging/all-channels"]
client-notifications = ["protocol-rest", "dep:pierre-notifications"]   # notifications.rs - push notification routes

client-all = ["client-web", "client-admin", "client-mobile", "client-mcp-tokens", "client-messaging", "client-notifications"]

# ═══════════════════════════════════════════════════════════════
# OAUTH (shared infrastructure)
# ═══════════════════════════════════════════════════════════════
oauth = []

# ═══════════════════════════════════════════════════════════════
# PROMPT HOT-RELOAD (contremaitre)
# ═══════════════════════════════════════════════════════════════
contremaitre = []  # GitHub-backed prompt registry with webhook hot-reload

# ═══════════════════════════════════════════════════════════════
# SERVER PROFILES
# ═══════════════════════════════════════════════════════════════
server-full = ["protocol-all", "transport-all", "client-all", "client-messaging", "oauth", "all-providers", "tools-all", "toon", "health-sync", "contremaitre", "analytics-posthog"]
server-production = ["protocol-all", "transport-all", "client-all", "client-messaging", "oauth", "production-providers", "tools-all", "toon", "contremaitre", "analytics-posthog"]
server-mcp-stdio = ["protocol-mcp", "transport-stdio", "oauth", "all-providers", "tools-all"]
server-mcp-bridge = ["protocol-mcp", "protocol-a2a", "transport-web", "oauth", "all-providers", "tools-all"]
server-mobile-backend = ["protocol-rest", "protocol-mcp", "client-mobile", "client-settings", "client-store", "oauth", "all-providers", "tools-all"]
server-saas-full = ["protocol-rest", "protocol-mcp", "transport-web", "client-web", "client-admin", "client-messaging", "oauth", "all-providers", "tools-all", "analytics-posthog"]

# OpenAPI documentation (SwaggerUI) - excluded from production by default
# Enable with: cargo build --features openapi
openapi = ["dep:utoipa", "dep:utoipa-axum", "dep:utoipa-swagger-ui", "pierre-core/openapi"]

[dependencies]
# Workspace crates (sibling crates under crates/)
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors", "sqlx-types", "sqlx-sqlite", "toon", "http-client"] }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-intelligence = { version = "0.3.0", path = "../pierre-intelligence" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
pierre-cache = { version = "0.3.0", path = "../pierre-cache", features = ["redis"] }
pierre-a2a = { version = "0.3.0", path = "../pierre-a2a", optional = true }
pierre-messaging = { version = "0.3.0", path = "../pierre-messaging", optional = true }
pierre-notifications = { version = "0.3.0", path = "../pierre-notifications", optional = true }
pierre-groups = { version = "0.3.0", path = "../pierre-groups", optional = true }
pierre-providers = { version = "0.3.0", path = "../pierre-providers" }
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v0.5.7", optional = true }
dravr-tronc = { git = "https://github.com/dravr-ai/dravr-tronc.git", tag = "v0.2.3", features = ["notifications"] }
dravr-enforme = { version = "0.1.5", git = "https://github.com/dravr-ai/dravr-enforme.git", tag = "v0.1.5", optional = true, features = ["provider-whoop", "provider-garmin", "provider-strava"] }
dravr-equilibre-sync = { package = "dravr-equilibre", version = "0.2", optional = true }

tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "io-std", "io-util", "sync"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
reqwest-middleware = "0.3"
anyhow = "1.0"
async-stream = "0.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "registry", "json"], default-features = false }
# OpenTelemetry for distributed tracing and request correlation (optional, enable with --features telemetry)
tracing-opentelemetry = { version = "0.23", optional = true }
opentelemetry = { version = "0.22", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.22", features = ["trace", "rt-tokio"], optional = true }
# HTTP tracing middleware
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "timeout", "limit", "set-header"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.22"
bytes = "1.11"
url = "2.5"
clap = { version = "4.5", features = ["derive", "std", "env"], default-features = false }
dirs = "5.0"
uuid = { version = "1.22", features = ["v4", "v5", "serde"] }
dashmap = "5.5"
urlencoding = "2.1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
aes-gcm = "0.10"
# Encryption and database support for multi-tenant
ring = "0.17"
ed25519-dalek = "2.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "derive", "migrate", "macros"], default-features = false }
bcrypt = "0.16"
argon2 = "0.5"
# JWT: rust_crypto backend uses crates already in our dep tree (sha2, rsa, ed25519-dalek)
jsonwebtoken = { version = "10.3", features = ["rust_crypto", "use_pem"], default-features = false }
subtle = "2.6"
zeroize = { version = "1.8", features = ["alloc"] }
hex = "0.4"
# HTTP framework: Axum (migrated from Warp)
axum = { version = "0.8", features = ["ws", "json", "query", "macros", "tokio", "http2", "form"], default-features = false }
axum-extra = { version = "0.12", features = ["typed-header"] }
http = "1.4"
futures-util = "0.3"
eventsource-stream = "0.2"
base64ct = "1.8"
# LRU cache for bounded session storage (DoS prevention)
lru = "0.16"
# Glob pattern matching for cache invalidation
glob = "0.3"
# Regex for PII redaction and pattern matching
regex = "1.12"
# Bitflags for PII redaction feature configuration
bitflags = { version = "2.11", features = ["serde"] }
# Redis client with connection pooling and async support
redis = { version = "0.28", features = ["tokio-comp", "connection-manager", "aio"] }

num-traits = "0.2"
# Rayon for CPU-bound parallel data processing (zone analysis, fitness calculations)
rayon = "1.11"
rsa = "0.9"
x509-parser = "0.18.1"
# TOON format for token-efficient LLM serialization (~40% token reduction vs JSON)
toon-format = { version = "0.2", optional = true }
rand_chacha = "0.9"
# OpenAPI documentation generation with utoipa
# OpenAPI documentation - optional (enable with --features openapi)
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"], optional = true }
utoipa-axum = { version = "0.2", optional = true }
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }
html-escape = "0.2.13"
cron = "0.15.0"
# Product analytics — optional PostHog integration for messaging funnel tracking
# posthog-rs removed: it depends on reqwest 0.11/hyper 0.14, causing duplicate hyper.
# PostHog capture API is called directly via the existing reqwest 0.12 dependency.

[dev-dependencies]
embacle = { git = "https://github.com/dravr-ai/dravr-embacle.git", tag = "v0.15.2" }
tempfile = "3.26"
serial_test = "3.4"
tokio-tungstenite = "0.24"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
serde_urlencoded = "0.7"
# Messaging transport test dependencies (crypto verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
ed25519-dalek = "2.2"

# ============================================================================
# Benchmark Configuration
# ============================================================================
# Each benchmark suite is defined as a separate [[bench]] entry.
# Run all benchmarks: cargo bench
# Run specific suite: cargo bench --bench intelligence_bench
# Run specific benchmark: cargo bench --bench intelligence_bench -- "training_load"

[[bench]]
name = "intelligence_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false

[[bench]]
name = "serialization_bench"
harness = false

[[bench]]
name = "sse_concurrency_bench"
harness = false

[lints]
workspace = true
