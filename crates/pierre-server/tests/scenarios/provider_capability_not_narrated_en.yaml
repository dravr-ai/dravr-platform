# Scenario: user asks whether the coach can reach data "via the
# provider"; the coach must silently fetch and deliver, not narrate
# its data access.
#
# Origin: ChefFamille's web session 2026-06-08 (Post-Run Stretching
# Coach screenshot). Asked "You have that information via the provider
# no?", the coach replied "I'm pulling your latest run data ... Yes — I
# can pull the run details from your connected data ... rather than
# guess ... What I can't get from the provider is ...". That is data-
# access plumbing narration the user should never see: the fetch is
# invisible, only the result is visible. The coach did use real data,
# so the regression is the narration, not a hallucination.
name: "Provider data access is not narrated to the user (EN)"
locales: ["en"]
notes: "Tool-discipline regression — 2026-06-08 post-run-stretching screenshot"
# On-demand lane (2026-08-31): turn 2 asserts the coach INVOKES get_activities,
# and the local grader model (qwen2.5:7b, CPU-only) does not call tools. That was
# invisible while the driver prefetched on the turn's "provider" keyword and
# credited its own fetch as the model's; once the prefetch stopped answering for
# it, the coach replied "Yes, I have that information via your provider" with no
# distance at all. The assertion is correct and stays STRICT — it pins the
# 2026-06-08 narration regression — it simply cannot gate a nightly on a grader
# that never invokes. Runs when CHAT_SCENARIO_INCLUDE_ONDEMAND=1 (the workflow's
# include_ondemand dispatch input) or against a stronger model.
nightly_gate: false
provider_state:
  providers:
    strava:
      initial_activities:
        - { name: "Evening run", sport: run, distance_km: 6.09, date: "2026-06-07" }
turns:
  - user: "Give me a post-run cooldown for the run I just did."
    assertions:
      - kind: no_substring
        values: ["I'm pulling", "I am pulling", "let me fetch", "get_activities"]
  - user: "You have that information via the provider no?"
    assertions:
      # It must silently fetch the run rather than narrate the fetch.
      - kind: tool_called
        name: get_activities
      - kind: no_substring
        values:
          - "I'm pulling"
          - "I am pulling"
          - "I can pull"
          - "rather than guess"
          - "from the provider"
          - "get_activities"
      # And it must deliver the real run data it fetched.
      - kind: distance_mentioned
        value_km: 6.09
        tolerance_km: 0.2
