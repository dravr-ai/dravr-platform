# Scenario: Bug 5 — "Côté course, combien de km" intent disambiguation.
#
# Origin: ChefFamille's Telegram session 2026-05-18 (screenshot 3) —
# the bot read the question as a historical stats query and reported
# 25.10 km total. The user actually meant "how many km should I run
# today" given the fatigue context two turns prior.
name: "Côté course combien de km is read as recommendation when context is planning (FR)"
locales: ["fr"]
notes: "Bug 5 regression — intent routing under planning context"
turns:
  - user: "Suis fatigué"
    # A setup turn that still produces a real coaching reply. It declares
    # nothing of its own; the runner's automatic language check against
    # `locales:` is what stops it answering in English and staying green.
    assertions: []
  - user: "Côté course, combien de km?"
    assertions:
      # Recommendation register, plain-language: a correct reply offers a
      # today-distance OR pivots to rest/lighter-effort/planning guidance.
      # Kept broad (synonyms — "repos", "plus léger", "objectif adapté")
      # because the no_substring guard below is what actually rejects the
      # stats-misread; the any_of only confirms the recommendation framing.
      - kind: any_of
        values:
          - "aujourd'hui"
          - "0 km"
          - "5 à 8 km"
          - "facile"
          - "léger"
          - "légère"
          - "repos"
          - "récup"
          - "objectif"
          - "adapté"
      - kind: no_substring
        values: ["au total", "kilomètres au total"]
