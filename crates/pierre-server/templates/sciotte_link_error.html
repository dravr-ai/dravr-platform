<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Link error - Pierre</title>
    <style>
        :root {
            --pierre-violet: #7C3AED;
            --pierre-cyan: #06B6D4;
            --pierre-red-500: #ef4444;
            --pierre-gray-50: #f9fafb;
            --pierre-gray-500: #6b7280;
            --pierre-gray-700: #374151;
            --pierre-gray-900: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--pierre-gray-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--pierre-violet), var(--pierre-cyan));
        }
        .error-icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: rgba(239,68,68,0.1);
            color: var(--pierre-red-500);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--pierre-gray-900);
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.9375rem;
            color: var(--pierre-gray-500);
        }
        @media (max-width: 640px) { .card { padding: 1.5rem; } }
    </style>
</head>
<body>
    <div class="card" role="main">
        <div class="error-icon" aria-hidden="true">!</div>
        <h1>Can't connect your account</h1>
        <p>{{MESSAGE}}</p>
    </div>
</body>
</html>
