<!DOCTYPE html>
<!-- ABOUTME: Hosted page a messaging link opens: log in or register to link the chat identity to a Dravr account -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; the greeting and error blocks arrive pre-escaped -->
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<!-- Copyright (c) 2026 dravr.ai -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Link Account - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <div class="subtitle">Link your {{CHANNEL}} account</div>
        {{GREETING}}
        {{ERROR}}
        <form method="post" action="/messaging/link/auth" id="authForm">
            <input type="hidden" name="code" value="{{CODE}}">
            <input type="hidden" name="action" value="login" id="actionField">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div class="register-fields" id="registerFields">
                <div class="field">
                    <label for="display_name">Display Name</label>
                    <input type="text" id="display_name" name="display_name" autocomplete="name">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log In</button>
        </form>
        <button type="button" class="btn btn-tertiary btn-block" id="toggleLink" onclick="toggleMode()">No account? Create one</button>
    </main>
    <script>
        let isRegister = false;
        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('actionField').value = isRegister ? 'register' : 'login';
            document.getElementById('registerFields').classList.toggle('active', isRegister);
            document.getElementById('submitBtn').textContent = isRegister ? 'Create Account' : 'Log In';
            document.getElementById('toggleLink').textContent = isRegister ? 'Already have an account? Log in' : 'No account? Create one';
            if (isRegister) {
                document.getElementById('display_name').setAttribute('required', '');
            } else {
                document.getElementById('display_name').removeAttribute('required');
            }
        }
    </script>
</body>
</html>
