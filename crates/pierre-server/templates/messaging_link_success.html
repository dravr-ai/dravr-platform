<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Account Linked - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card card-center">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <div class="status-icon status-icon-success" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Account Linked!</h1>
        <p>Your {{CHANNEL}} account is now connected to Dravr. Go back to {{CHANNEL}} and send a message to get started.</p>
    </main>
</body>
