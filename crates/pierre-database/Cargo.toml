# ABOUTME: Repository trait definitions for database abstraction layer
# ABOUTME: Defines the public API surface for all database operations as focused trait groups

[package]
name = "pierre-database"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Database repository trait definitions for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-intelligence = { version = "0.1.0", path = "../pierre-intelligence" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[lints]
workspace = true
