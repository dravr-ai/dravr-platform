# ABOUTME: Database abstraction layer with repository traits and implementations
# ABOUTME: Provides SQLite and PostgreSQL backends for all database operations

[package]
name = "pierre-database"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Database layer for Pierre platform - repository traits and implementations"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["sqlite"]
sqlite = []
postgresql = ["sqlx/postgres", "pierre-core/sqlx-postgres"]
testing = []

[dependencies]
# Workspace crates
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-response", "all-errors", "sqlx-types", "sqlx-sqlite", "admin-jwt"] }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }

# Async runtime and traits
async-trait = "0.1"
tokio = { version = "1.50", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1.22", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "derive", "migrate", "macros"], default-features = false }

# Encoding
base64 = "0.22"

# Cryptography (for encryption/decryption of stored data)
ring = "0.17"
sha2 = "0.10"
rand = "0.8"

# Hex encoding
hex = "0.4"

# Logging
tracing = "0.1"

[lints]
workspace = true
