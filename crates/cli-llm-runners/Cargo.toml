# ABOUTME: CLI-based LLM runner implementations for the Pierre platform
# ABOUTME: Provides runners for Claude Code, Cursor Agent, and OpenCode CLIs

[package]
name = "cli-llm-runners"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CLI-based LLM runner implementations for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["llm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.45", features = ["process", "io-util", "time", "rt", "rt-multi-thread", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
which = "7"
tempfile = "3"

[lints]
workspace = true
