# ABOUTME: Cargo manifest for pierre-providers crate
# ABOUTME: Fitness data provider implementations (Strava, Garmin, Fitbit, WHOOP, COROS, Terra)

[package]
name = "pierre-providers"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fitness data provider implementations for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["provider-whoop", "provider-strava", "provider-sciotte"]
provider-strava = []
provider-garmin = []
provider-terra = []
provider-fitbit = []
provider-whoop = []
provider-coros = []
provider-synthetic = ["dep:sqlx"]
provider-sciotte = ["dep:dravr-sciotte"]
provider-intervals-icu = []
all-providers = [
    "provider-strava",
    "provider-garmin",
    "provider-terra",
    "provider-fitbit",
    "provider-whoop",
    "provider-coros",
    "provider-synthetic",
    "provider-sciotte",
    "provider-intervals-icu",
]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
async-stream = "0.3"
base64 = "0.22"
bitflags = { version = "2.11", features = ["serde"] }
futures-util = "0.3"
num-traits = "0.2"
rand = "0.9"
rand_chacha = "0.9"
ring = "0.17"
subtle = "2.6"
hex = "0.4"
dravr-equilibre = { git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.2.3" }
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v0.5.16", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "derive"], default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
