# ABOUTME: Cargo manifest for pierre-providers crate
# ABOUTME: Fitness data provider implementations (Strava, Garmin, Fitbit, WHOOP, COROS, Terra)

[package]
name = "pierre-providers"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fitness data provider implementations for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
provider-strava = []
provider-garmin = []
provider-terra = []
provider-fitbit = []
provider-whoop = []
provider-coros = []
provider-synthetic = []
provider-sciotte = ["dep:dravr-sciotte"]
provider-intervals-icu = []
all-providers = [
    "provider-strava",
    "provider-garmin",
    "provider-terra",
    "provider-fitbit",
    "provider-whoop",
    "provider-coros",
    "provider-synthetic",
    "provider-sciotte",
    "provider-intervals-icu",
]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
async-stream = "0.3"
base64 = "0.22"
bitflags = { version = "2.11", features = ["serde"] }
futures-util = "0.3"
num-traits = "0.2"
rand = "0.9"
rand_chacha = "0.9"
ring = "0.17"
subtle = "2.6"
hex = "0.4"
dravr-equilibre = { git = "https://github.com/dravr-ai/dravr-equilibre.git", tag = "v0.2.3" }
# Temporary: pinned to commit SHA because the v0.5.15 release workflow is blocked
# on GitHub Actions artifact storage quota. Re-pin to `tag = "v0.5.15"` once the
# release publishes. The commit ships /challenge/dp digit scrape +
# Try-Another-Way debounce (Strava-Google 2FA chooser surfacing) and removes the
# WebGL/plugins JS spoofs that 427'd headless Chrome on Cloudflare (Garmin
# headless restored to working baseline).
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", rev = "0508a4b6474f3638fbd5117ed64862c79e9c3492", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
