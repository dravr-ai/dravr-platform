# ABOUTME: Cargo manifest for pierre-providers crate
# ABOUTME: Fitness data provider implementations (Strava, Garmin, WHOOP, COROS, Terra, Wahoo)

[package]
name = "pierre-providers"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fitness data provider implementations for Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["provider-whoop", "provider-strava", "provider-sciotte"]
provider-strava = []
provider-garmin = []
provider-terra = []
provider-whoop = []
provider-coros = []
provider-sciotte = ["dep:dravr-sciotte"]
provider-intervals-icu = []
provider-wahoo = ["dep:base64", "dep:dravr-cageux"]
all-providers = [
    "provider-strava",
    "provider-garmin",
    "provider-terra",
    "provider-whoop",
    "provider-coros",
    "provider-sciotte",
    "provider-intervals-icu",
    "provider-wahoo",
]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
secrecy = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"
dashmap = "5.5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
bitflags = { version = "2.11", features = ["serde"] }
num-traits = "0.2"
ring = "0.17"
hex = "0.4"
# Wahoo plan uploads travel as a base64 data URI (`plan[file]`).
base64 = { version = "0.22", optional = true }
# Power-zone bounds the Wahoo plan file states as fractions of FTP.
dravr-cageux = { workspace = true, optional = true }
# Activity FIT files: an athlete's uploaded workout, and the samples Wahoo
# serves only as a FIT file — both decoded by fit_file.rs.
fitparser = "0.11"
# The intervals.icu auth rule and the credential kind it keys on, owned by
# dravr-enforme so its wellness path and this provider's activity path share
# one rule (carnet#997).
dravr-enforme = { workspace = true, features = ["provider-intervals-icu"] }
dravr-sciotte = { workspace = true, optional = true, features = ["client"] }

[dev-dependencies]
# `net` + `io-util` back the loopback HTTP stub in intervals_icu_provider_test.rs,
# which pins the bytes we put on the wire (the HTTP Basic username in particular).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
base64 = "0.22"
# The request budget suite counts in a real usage_counters table.
pierre-test-support = { version = "0.3.0", path = "../pierre-test-support" }
# Only `IamError`: the sciotte error mapping's unit test builds the client's
# identity-token failure, whose cause the sciotte client does not re-export.
dravr-tronc = { workspace = true, features = ["google-iam"] }

[lints]
workspace = true
