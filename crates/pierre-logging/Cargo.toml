# ABOUTME: Structured logging — GCP Cloud Logging formatter + tenant-aware tracing layer + notify routing
# ABOUTME: Wires tracing-subscriber with dravr-tronc notify layer for operator alerts via Slack/PagerDuty

[package]
name = "pierre-logging"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Structured logging + notify routing for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[features]
default = []
# OpenTelemetry OTLP traces + metrics. Compiled-but-inert until OTEL_EXPORTER_OTLP_ENDPOINT is set.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }

chrono = { version = "0.4", features = ["serde"] }
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v0.7.8" }
dravr-tronc = { git = "https://github.com/dravr-ai/dravr-tronc.git", tag = "v0.5.3", features = ["notifications"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.22", features = ["v4", "serde"] }

# OpenTelemetry (optional, enabled by the `telemetry` feature). OTLP over HTTP/protobuf
# reuses reqwest (native-tls) instead of pulling tonic/gRPC, keeping the telemetry build lighter.
opentelemetry = { version = "0.22", features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.22", features = ["trace", "metrics", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.15", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "0.23", optional = true }

[lints]
workspace = true
