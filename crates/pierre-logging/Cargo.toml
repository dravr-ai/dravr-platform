# ABOUTME: Structured logging — GCP Cloud Logging formatter + tenant-aware tracing layer + notify routing
# ABOUTME: Wires tracing-subscriber with dravr-tronc notify layer for operator alerts via Slack/PagerDuty

[package]
name = "pierre-logging"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Structured logging + notify routing for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[features]
default = []
# OpenTelemetry OTLP traces + metrics. Compiled-but-inert until OTEL_EXPORTER_OTLP_ENDPOINT is set.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }

chrono = { version = "0.4", features = ["serde"] }
dravr-sciotte = { git = "https://github.com/dravr-ai/dravr-sciotte.git", tag = "v0.7.16" }
dravr-tronc = { git = "https://github.com/dravr-ai/dravr-tronc.git", tag = "v0.6.0", features = ["notifications"] }
gethostname = "1"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.22", features = ["v4", "serde"] }

# OpenTelemetry (optional, enabled by the `telemetry` feature). OTLP over HTTP/protobuf
# reuses reqwest (blocking, rustls) instead of pulling tonic/gRPC, keeping the telemetry
# build lighter. The blocking client is the upstream-recommended pairing for the SDK's
# dedicated-thread batch/periodic exporters. `opentelemetry_sdk` is floored at 0.32.1
# for GHSA-w9wp-h8wv-79jx (unbounded allocation in W3C Baggage propagation).
opentelemetry = { version = "0.32", features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[lints]
workspace = true
