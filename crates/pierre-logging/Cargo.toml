# ABOUTME: Structured logging — GCP Cloud Logging formatter + tenant-aware tracing layer + notify routing
# ABOUTME: Wires tracing-subscriber with dravr-tronc notify layer for admin alerts via Slack/PagerDuty

[package]
name = "pierre-logging"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Structured logging + notify routing for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[features]
default = []
# OpenTelemetry OTLP traces + metrics. Compiled-but-inert until OTEL_EXPORTER_OTLP_ENDPOINT is set.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-http",
    "dep:async-trait",
    "dep:reqwest",
]

[dependencies]
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }

chrono = { version = "0.4", features = ["serde"] }
dravr-tronc = { workspace = true, features = ["notifications"] }
gethostname = "1"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# OpenTelemetry (optional, enabled by the `telemetry` feature). OTLP over HTTP/protobuf
# instead of tonic/gRPC, keeping the telemetry build lighter. `opentelemetry_sdk` is
# floored at 0.32.1 for GHSA-w9wp-h8wv-79jx (unbounded allocation in W3C Baggage
# propagation).
opentelemetry = { version = "0.32", features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
# The exporters send through `otel::OtlpHttpClient`, a reqwest 0.12 blocking client,
# not otlp's own `reqwest-blocking-client`: that one is reqwest 0.13, a second HTTP
# client stack in the shipped binary next to the 0.12 every other client and
# satellite links (carnet#1645). 0.12's `rustls-tls` is ring-backed, the provider
# every other TLS client here uses, so no aws-lc-rs and no process default to
# install. The blocking client fits the SDK's dedicated-thread batch/periodic
# exporters, which run without an async runtime.
opentelemetry-http = { version = "0.32", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[dev-dependencies]
# A notify layer with a Slack sink spawns its batch flusher, so the test that
# builds one needs a runtime.
tokio = { version = "1.54", features = ["macros", "rt"] }

[lints]
workspace = true
