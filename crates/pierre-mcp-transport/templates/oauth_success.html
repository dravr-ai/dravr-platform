<!DOCTYPE html>
<!-- ABOUTME: OAuth success page a provider callback lands on; tells the opener the connection completed -->
<!-- ABOUTME: Styled by the shared Boreal sheet the renderer injects; the script posts the result and closes the window -->
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<!-- Copyright (c) 2026 dravr.ai -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Connected - Dravr</title>
    <style>{{HOSTED_PAGE_CSS}}</style>
</head>
<body>
    <main class="card card-center">
        <div class="lockup" role="img" aria-label="Dravr"></div>
        <div class="status-icon status-icon-success" aria-hidden="true">&#10003;</div>
        <h1>{{PROVIDER}} Connected</h1>
        <p>You can close this window.</p>
    </main>
    <script>
        // Notify parent window that OAuth completed successfully
        // This allows the main app to refresh connection status
        (function() {
            const message = {
                type: 'oauth_completed',
                provider: '{{PROVIDER_LOWER}}',
                success: true,
                message: '{{PROVIDER}} connected successfully'
            };

            // Send message to parent window (works for popups opened by window.open)
            if (window.opener) {
                window.opener.postMessage(message, window.location.origin);
            }

            // Also try localStorage for same-origin communication (works for new tabs)
            try {
                localStorage.setItem('pierre_oauth_result', JSON.stringify({
                    ...message,
                    timestamp: Date.now()
                }));
            } catch (e) {
                // localStorage may not be available
            }

            // Auto-close after a brief delay to let user see the success message
            setTimeout(function() {
                window.close();
            }, 2000);
        })();
    </script>
</body>
</html>
