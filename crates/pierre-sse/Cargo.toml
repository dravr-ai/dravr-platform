# ABOUTME: Server-Sent Events (SSE) infrastructure — broadcast manager + HTTP route handlers
# ABOUTME: Owns SseManager, SseRoutes, NotificationStream, A2ATaskStream; consumed via SseCtx

[package]
name = "pierre-sse"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Server-Sent Events (SSE) broadcast hub and HTTP route handlers for the Pierre platform"
repository = "https://github.com/dravr-ai/cdn-platform"
publish = false

[dependencies]
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }

async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
futures-util = "0.3"
serde_json = "1.0"
tokio = { version = "1.50", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
