# ABOUTME: AG-UI protocol integration — events, filter, emitter, registry, SSE route
# ABOUTME: Extracted from pierre-server; transport-sse feature gates the HTTP route module

[package]
name = "pierre-agui"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AG-UI (Agent-User Interaction) protocol integration for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = []
# Mounts the Axum SSE route; pulls in axum / async-stream / futures-util /
# pierre-middleware so the route can authenticate Bearer JWTs.
transport-sse = [
    "dep:axum",
    "dep:async-stream",
    "dep:futures-util",
    "dep:pierre-middleware",
]

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware", optional = true }

async-trait = "0.1"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["sync", "macros", "rt"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

# Optional, only when `transport-sse` is enabled.
axum = { version = "0.8", features = ["json", "macros", "tokio", "http2"], default-features = false, optional = true }
async-stream = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

[lints]
workspace = true
