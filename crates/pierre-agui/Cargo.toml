# ABOUTME: AG-UI protocol integration — events, filter, emitter, per-run broadcast registry
# ABOUTME: In-process only; the messaging status bridge is the sole consumer

[package]
name = "pierre-agui"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AG-UI (Agent-User Interaction) protocol integration for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-core = { version = "0.3.0", path = "../pierre-core" }

async-trait = "0.1"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["sync", "macros", "rt"] }
tracing = "0.1"

[lints]
workspace = true
