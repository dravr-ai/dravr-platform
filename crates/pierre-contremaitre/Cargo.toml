# ABOUTME: Prompt + persona + tool-description hot-reload subsystem (GitHub backed)
# ABOUTME: Sync engine populates the in-memory registries; admin write-back commits via GitHub Contents API

[package]
name = "pierre-contremaitre"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prompt + persona + tool-description hot-reload subsystem for the Pierre platform"
repository = "https://github.com/dravr-ai/scriptcurator-platform"
publish = false

[dependencies]
arc-swap = "1.9"
# `http-client` carries the shared `api_client` the GitHub store reads through.
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["http-client"] }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
dravr-colleur = { workspace = true }
dravr-cageux = { workspace = true }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }

async-trait = "0.1"
base64 = "0.22"
# Inflates the brotli-compressed locale catalogues build.rs embeds (carnet#1645);
# the same decoder tower-http's response compression already links.
brotli-decompressor = "6"
dravr-contremaitre = { workspace = true }
dravr-tronc = { workspace = true, features = ["notifications"] }
hex = "0.4"
regex = "1.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.3"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4"] }

[build-dependencies]
# Compresses the five locale catalogues at build time; see build.rs.
brotli = "9"

[dev-dependencies]
# The tool-description sync is async; its inline tests drive it directly.
tokio = { version = "1.54", features = ["macros", "rt"] }

[lints]
workspace = true
