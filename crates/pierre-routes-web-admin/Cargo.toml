# ABOUTME: Web admin route group — /api/admin/* surface for the browser admin UI (cookie auth)
# ABOUTME: Decoupled from pierre-server via WebAdminContext (Arc fields), materialized by the composition root

[package]
name = "pierre-routes-web-admin"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cookie-auth web admin REST surface for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[dependencies]
pierre-auth = { version = "0.3.0", path = "../pierre-auth" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
