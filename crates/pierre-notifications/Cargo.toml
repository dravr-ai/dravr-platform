# ABOUTME: Notification facade: the dravr-commere dispatcher plus the platform's own delivery sinks
# ABOUTME: Owns the NotificationChannelSink SPI so messaging delivery composes without a second ladder

[package]
name = "pierre-notifications"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Notification dispatch facade over dravr-commere with platform delivery sinks"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["sqlite"]
sqlite = ["dravr-commere/sqlite", "sqlx/sqlite"]
postgresql = ["dravr-commere/postgresql", "sqlx/postgres"]

[dependencies]
dravr-commere = { git = "https://github.com/dravr-ai/dravr-commere.git", tag = "v0.3.3" }
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["all-errors"] }

async-trait = "0.1"
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "uuid", "derive", "macros"], default-features = false }
tokio = { version = "1.50", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1.22", features = ["v4", "serde"] }

[lints]
workspace = true
