# ABOUTME: Thin bridge re-exporting dravr-commere notification service for platform compatibility
# ABOUTME: All notification logic lives in dravr-commere; this crate provides path compatibility

[package]
name = "pierre-notifications"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bridge crate re-exporting dravr-commere notification service"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
default = ["sqlite"]
sqlite = ["dravr-commere/sqlite"]
postgresql = ["dravr-commere/postgresql"]

[dependencies]
dravr-commere = { git = "https://github.com/dravr-ai/dravr-commere.git", tag = "v0.1.6" }
pierre-core = { version = "0.3.0", path = "../pierre-core", features = ["all-errors"] }

[lints]
workspace = true
