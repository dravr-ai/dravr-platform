# ABOUTME: Unified chat pipeline crate — single orchestrator for web and messaging turn dispatch
# ABOUTME: Decoupled from pierre-server via ChatPipelineContext; materialized by the composition root

[package]
name = "pierre-chat-pipeline"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified chat pipeline (prompt assembly, tool loop, post-processing) for the Pierre platform"
repository = "https://github.com/dravr-ai/dravr-platform"
publish = false

[features]
# Every server build that pulls this crate in turns tools-groups on, so the
# crate built on its own does too; without it the subject-athlete roster stub
# leaves RosterLine variants dead and a warnings-denied build fails.
default = ["tools-groups"]
health-sync = [
    "pierre-services/health-sync",
    "pierre-tool-runtime/health-sync",
    "dep:dravr-enforme",
]
tools-groups = [
    "dep:pierre-groups",
    "pierre-commands/tools-groups",
    "pierre-tool-runtime/tools-groups",
]
tools-verification = [
    "dep:pierre-evals",
    # The claim-verification stage runs behind its own panic boundary
    # (futures_util::FutureExt::catch_unwind), so the dep rides with the
    # feature that turns the stage on.
    "dep:futures-util",
    "pierre-services/tools-verification",
    "pierre-tool-runtime/tools-verification",
]
transport-sse = [
    "pierre-tool-runtime/transport-sse",
]
# Reads the question's language locally with lingua (carnet#825). Its five
# language models add ~22 MB to the binary; without it the turn asks the LLM.
language-detection = ["dep:lingua"]

[dependencies]
# TokenCounts for the per-call cost the recorder prices through the registry.
embacle = { version = "0.39.1" }
embacle-tool-host = "0.39.1"
pierre-agui = { version = "0.3.0", path = "../pierre-agui" }
# The shared cache a proposed route's line is read back from by its route_ref.
pierre-cache = { version = "0.3.0", path = "../pierre-cache" }
pierre-commands = { version = "0.3.0", path = "../pierre-commands" }
pierre-config = { version = "0.3.0", path = "../pierre-config" }
pierre-contremaitre = { version = "0.3.0", path = "../pierre-contremaitre" }
pierre-core = { version = "0.3.0", path = "../pierre-core" }
pierre-database = { version = "0.3.0", path = "../pierre-database" }
pierre-fitness-compute = { version = "0.3.0", path = "../pierre-fitness-compute" }
pierre-llm = { version = "0.3.0", path = "../pierre-llm" }
pierre-memory = { version = "0.3.0", path = "../pierre-memory" }
dravr-canot = { workspace = true }
pierre-providers = { version = "0.3.0", path = "../pierre-providers" }
pierre-middleware = { version = "0.3.0", path = "../pierre-middleware" }
pierre-runtime-context = { version = "0.3.0", path = "../pierre-runtime-context" }
pierre-services = { version = "0.3.0", path = "../pierre-services" }
pierre-sse = { version = "0.3.0", path = "../pierre-sse" }
pierre-tool-runtime = { version = "0.3.0", path = "../pierre-tool-runtime", features = ["client-chat", "tools-connection"] }
dravr-tronc = { workspace = true }

# Optional crates (feature-gated)
dravr-enforme = { workspace = true, optional = true }
pierre-evals = { version = "0.3.0", path = "../pierre-evals", optional = true }
pierre-groups = { version = "0.3.0", path = "../pierre-groups", optional = true }
futures-util = { version = "0.3", optional = true }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
# TaskTracker: the drain handle llm_usage writes are spawned on.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.22", features = ["v4", "serde"] }
# Behind `language-detection`: only the five platform languages' models.
lingua = { version = "1.8", default-features = false, features = ["english", "french", "spanish", "german", "portuguese"], optional = true }
jsonschema = { version = "0.46.5", default-features = false }

[dev-dependencies]
# Assets crate (git): provides the structured-workout schema for the
# extraction/validation stage test. Redirected to the local checkout by the
# workspace [patch] during co-development.
dravr-contremaitre = { workspace = true }
# Captures the rewrite re-check's log line, its only observable output.
tracing-subscriber = { version = "0.3", features = ["fmt", "std"], default-features = false }
# Resolves a hydrated route block the way the server does, so the fields
# hydration adds are checked against the spec that reads them.
photograveur = { workspace = true }

[lints]
workspace = true
