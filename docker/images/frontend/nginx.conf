# ABOUTME: Nginx configuration for serving Pierre admin frontend as a SPA
# ABOUTME: Proxies API/OAuth/WebSocket traffic to the backend, serves static assets

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Firebase auth handler is self-hosted via reverse proxy (/__/ → firebaseapp.com).
        # Popup and iframe stay same-origin; no *.firebaseapp.com needed in frame-src.
        # Requires Cloud NAT for VPC egress to reach firebaseapp.com.
        # Note: 'unsafe-inline' in script-src is needed for Firebase auth handler (/__/auth/)
        # which injects inline scripts during the OAuth popup flow.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' wss: https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none';" always;

        # Health check endpoint for Cloud Run probes
        location = /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # Firebase auth handler: reverse proxy to firebaseapp.com so authDomain = our own domain.
        # Eliminates manual OAuth redirect URI config and third-party cookie dependency.
        # Cloud NAT must be provisioned for this to work with vpc_egress=ALL_TRAFFIC.
        location /__/ {
            proxy_pass https://${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_set_header Host ${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        # Reverse proxy: API, OAuth, admin, A2A, messaging routes to backend
        location ~ ^/(api|oauth|admin|a2a|messaging)/ {
            proxy_pass ${BACKEND_URL};
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Cache hashed assets aggressively (Vite adds content hash to filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html must never be cached — it references hashed asset URLs
        # that change on each deploy. Without this, CDNs serve stale HTML that
        # points to old JS/CSS bundles.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # SPA fallback: serve index.html for all unmatched routes
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
