# ABOUTME: Nginx configuration for serving Pierre admin frontend as a SPA
# ABOUTME: Proxies API/OAuth/WebSocket traffic to the backend, serves static assets

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in Server headers / error pages.
    server_tokens off;

    # Logging
    # The access log is one JSON object per line on stdout, which Cloud Run
    # parses into jsonPayload and whose "severity" it stores as the entry's
    # severity. A plain-text line is stored with none, so a failing proxy was
    # invisible to every severity filter. A response nginx could not get from
    # the backend is ERROR; one that succeeded only after nginx gave up on a
    # first upstream address ($upstream_addr lists every address it tried,
    # comma-separated) is WARNING, since that retry is how 1,057 IPv6 connect
    # failures in a week served no 5xx and raised nothing.
    # The line carries the path without its query string (OAuth callbacks put
    # the authorization code and state there) and no referer, user agent or
    # client address. "cache" is $upstream_cache_status (HIT, MISS, BYPASS,
    # EXPIRED, STALE, UPDATING) in the discovery location below, and "-"
    # wherever no cache is configured.
    map $status $log_severity_status {
        ~^5     ERROR;
        ~^4     WARNING;
        default INFO;
    }
    map "$log_severity_status $upstream_addr" $log_severity {
        ~^ERROR        ERROR;
        "~^INFO .*, "  WARNING;
        default        $log_severity_status;
    }
    # A path segment that is a credential is logged as [redacted]: Garmin's
    # push token after /webhooks/garmin/ (carnet#1155), and the short-link
    # code, chat link code, group invite code and chart token after /r/,
    # /messaging/link/, /groups/join/, /api/invites/ and /api/viz/
    # (carnet#1873). The prefixes are SECRET_PATH_SEGMENT_PREFIXES in
    # crates/pierre-middleware/src/redaction.rs, whose test reads this map.
    # $uri has no query, so a secret in the query never reaches this line.
    # POST /messaging/link/auth logs as /messaging/link/[redacted] too.
    map $uri $log_path {
        "~^(?<secret_prefix>/webhooks/garmin/|/r/|/messaging/link/|/groups/join/|/api/invites/|/api/viz/)[^/]+(?<secret_rest>.*)$"  "${secret_prefix}[redacted]${secret_rest}";
        default  $uri;
    }
    # A request to https://mcp.dravr.ai/mcp that carries no credential. The MCP
    # authorization spec takes one carrier, `Authorization: Bearer <token>`,
    # and the backend reads no other on /mcp (no cookie, no API-key header, no
    # query parameter) and serves no method without it, so every such request
    # ends in a refusal: the 401 for a well-formed POST (a GET is its 405, a
    # malformed body its 400). Each one still woke the API, which bills CPU
    # for as long as an instance is up (ADR-019), and directory probers send
    # one every few minutes around the clock. nginx answers them itself with the backend's
    # 401 (location /__mcp_unauthenticated_401) and only checks that a bearer
    # is present: validating it stays the backend's job, so anything shaped
    # like one, valid or not, reaches the backend.
    #
    # The key is host|uri|method|Authorization and the first matching regex
    # wins. "Bearer", any case, then a space and a non-space is what the
    # backend reads as a credential. A CORS preflight (OPTIONS) never carries
    # one and must reach the backend's CORS layer. Only mcp.dravr.ai and the
    # exact path /mcp match: the backend names a different metadata document
    # on app.dravr.ai, /mcp/tools answers another body, and the frontend's
    # run.app URL is where post-deploy-verify.yml checks the backend's own 401.
    map "$host|$uri|$request_method|$http_authorization" $mcp_unauthenticated {
        "~*^[^|]*\|[^|]*\|[^|]*\|bearer +[^ ]"  0;
        "~^mcp\.dravr\.ai\|/mcp\|OPTIONS\|"   0;
        "~^mcp\.dravr\.ai\|/mcp\|"             1;
        default                                 0;
    }

    # A path under /mcp/ the backend does not serve. It mounts POST /mcp (the
    # MCP endpoint) and GET /mcp/tools and nothing else below it, so directory
    # bots asking for files there (owners.json, glama.json, /mcp/messages) only
    # woke the API for its 404. nginx answers those itself. An exact string
    # wins over the regex, and scripts/ci/nginx-routing-check.sh fails when the
    # backend's routes under /mcp/ stop being exactly /mcp/tools.
    map $uri $mcp_unknown_subpath {
        default       0;
        /mcp/tools    0;
        "~^/mcp/"     1;
    }

    # The discovery documents under /.well-known/ (OAuth protected resource and
    # authorization server metadata, the A2A agent card) are fetched by every
    # MCP client and directory bot right after a 401, and each fetch woke the
    # API. They change only with the backend's configuration, so nginx keeps
    # the backend's own answers for an hour, 404s included: nothing here is a
    # copy that can drift. An entry is refetched after that hour (the backend
    # sends no Cache-Control or Expires on these documents that would override
    # proxy_cache_valid),
    # and served past it only while the backend cannot be reached or another
    # request is refetching it (proxy_cache_use_stale); each
    # instance starts with an empty cache, under /tmp. The cache is per host,
    # because the backend names the host the client dialed (X-Forwarded-Host,
    # which is $host) in the metadata, and per value of each request header the
    # backend's Vary names (Origin, Accept-Encoding), which nginx keeps as
    # separate variants. A request carrying Authorization always reaches the
    # backend; so do the signing keys, through their own location below.
    proxy_cache_path /tmp/nginx-discovery-cache levels=1:2 keys_zone=discovery:1m
                     max_size=16m inactive=2h use_temp_path=off;
    map "$uri|$http_authorization" $discovery_skip_cache {
        "~^/\.well-known/[^|]*\|$"           0;
        default                              1;
    }

    log_format json escape=json
        '{"severity":"$log_severity","message":"$request_method $log_path $status",'
        '"method":"$request_method","path":"$log_path","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time","cache":"$upstream_cache_status"}';
    access_log /var/log/nginx/access.log json;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. Defined at server level so locations WITHOUT their own
        # add_header inherit them (the proxy blocks below). Any location that sets
        # its own add_header must re-`include` this snippet — nginx drops inherited
        # add_header the moment a location declares one of its own.
        include /etc/nginx/security-headers.conf;

        # Health check endpoint for Cloud Run probes
        location = /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
            include /etc/nginx/security-headers.conf;
        }

        # Firebase auth handler: reverse proxy to firebaseapp.com so authDomain = our own domain.
        # Eliminates manual OAuth redirect URI config and third-party cookie dependency.
        # Cloud NAT must be provisioned for this to work with vpc_egress=ALL_TRAFFIC.
        # IMPORTANT: proxy_pass uses a variable ($firebase_upstream) so nginx resolves
        # the hostname at request time via the resolver directive, not at startup.
        # Static proxy_pass ignores the resolver and uses the system DNS (which returns IPv6).
        location /__/ {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $firebase_upstream https://${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_pass $firebase_upstream$request_uri;
            proxy_set_header Host ${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;

            # Firebase's own pages, not ours: they get their own headers instead
            # of security-headers.conf. The SPA frames /__/auth/iframe to read the
            # sign-in result back, so DENY / frame-ancestors 'none' made every
            # Google sign-in return signed out once authDomain was app.dravr.ai
            # (2026-10-28). Framing stays limited to this origin, and the SPA's
            # script CSP is not imposed on pages Firebase writes (firebaseapp.com
            # serves them with no CSP at all).
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "frame-ancestors 'self';" always;
        }

        # The MCP endpoint (`/mcp`, `/mcp/...`): streamable HTTP answers a POST
        # with either one JSON body or a `text/event-stream` carrying progress
        # events before the result. nginx buffers a proxied response by default,
        # which holds every event until the stream ends, so a client sees no
        # progress and times out on a long tool call. `proxy_buffering off`
        # forwards each event as it arrives, and `proxy_cache off` keeps one from
        # being stored. The backend does not send `X-Accel-Buffering: no` itself,
        # so this location is what makes streaming work end to end.
        # `proxy_http_version 1.1` with an empty `Connection`
        # keeps the upstream connection a stream needs. The read and send bounds are
        # the frontend service's own request limit (request_timeout, 600s, in
        # infra/environments/dev/main.tf): it ends a stream there whatever nginx
        # allows, and an MCP client reconnects. If either changes, update both.
        #
        # `client_max_body_size 2m` sits above the server's own request cap
        # (MCP_MAX_REQUEST_SIZE, 1 MB), so an oversized call is refused by the
        # backend with a JSON-RPC error the client can read, not by nginx's 413
        # HTML page.
        location ~ ^/mcp(/|$) {
            if ($mcp_unknown_subpath) {
                return 404;
            }
            if ($mcp_unauthenticated) {
                rewrite ^ /__mcp_unauthenticated_401 last;
            }
            client_max_body_size 2m;
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # The answer to a request with no credential ($mcp_unauthenticated above):
        # the status, JSON-RPC body and RFC 9728 challenge the backend gives a
        # POST with no token on mcp.dravr.ai. Real MCP clients (Claude, ChatGPT,
        # Cursor, mcp-remote) start their OAuth sign-in from this challenge, so
        # it carries the backend's `scope` (the default grant) as well as the
        # metadata URL: without `scope` a client asks the athlete for every
        # supported scope, write scopes included. The value is a copy of
        # www_authenticate_challenge(MCP_RESOURCE_URL, None), and a test in
        # crates/pierre-auth/src/config/mcp_resource.rs fails when they differ.
        # GET, HEAD and DELETE get this 401 too, where the backend would answer
        # 405 (it mounts POST alone on /mcp). The access log names these
        # requests by this path, with no upstream.
        location = /__mcp_unauthenticated_401 {
            internal;
            default_type application/json;
            add_header WWW-Authenticate 'Bearer resource_metadata="https://mcp.dravr.ai/.well-known/oauth-protected-resource/mcp", scope="fitness:read profile:read"' always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "www-authenticate" always;
            include /etc/nginx/security-headers.conf;
            return 401 '{"jsonrpc":"2.0","error":{"code":-32001,"message":"Unauthorized"},"id":null}';
        }

        # The A2A endpoints that answer with Server-Sent Events, which the agent
        # card advertises (`streaming: true`). nginx would otherwise buffer each
        # stream in the block below; the same reasoning as `/mcp` above. `$` ends
        # each alternative, so the rest of /a2a/ keeps the block below.
        location ~ ^/a2a/(jsonrpc|message:stream|tasks/[^/]+:subscribe)$ {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # The discovery documents MCP and A2A clients fetch before connecting,
        # cached at the edge ($discovery_skip_cache and the cache zone above).
        # This is the only server block (`server_name _`), so every hostname
        # the load balancer routes here, app. and mcp. alike, serves them; the
        # backend picks the RFC 9728 `resource` it publishes among its
        # configured ones (MCP_RESOURCE_URL) by the X-Forwarded-Host set here,
        # which is why the cache key carries $host. The proxy directives are
        # the backend block's below, plus the cache lines. `^~` makes this
        # prefix win over every regex location for a path under /.well-known/.
        location ^~ /.well-known/ {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_cache discovery;
            proxy_cache_key "$host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 404 1h;
            proxy_cache_bypass $discovery_skip_cache;
            proxy_no_cache $discovery_skip_cache;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
        }

        # The signing keys stay out of the discovery cache: a verifier must see a
        # rotated key at once, and the backend already sends its own
        # Cache-Control, ETag and 304 for them, which a cache in between would
        # hide. An exact location wins over the `^~` prefix above.
        location = /.well-known/jwks.json {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The record_log transparency documents (carnet#1542) stay out of the
        # discovery cache too: the did:web key and the newest signed checkpoint
        # must read as they are now, and a 404 before the first checkpoint
        # must not stick for an hour.
        location = /.well-known/did.json {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /.well-known/dravr-checkpoint {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy: API, OAuth, admin, A2A, messaging, webhooks, the hosted
        # provider pages (/providers/* — the session-read hosted login + the connect picker,
        # which are BACKEND routes, not SPA routes), and the short-link redirects
        # (/r/* — chat reconnect/connect links) all route to the backend. Without
        # the /providers/ + /r/ branches the SPA fallback swallows them and the user
        # lands on the chat home instead of the reconnect screen.
        # Read/send timeouts are 600s to match Cloud Run's request timeout — chat
        # endpoints invoke the LLM and run a multi-step tool loop with detail-page
        # provider enrichment that routinely exceeds the prior 300s cap
        # (504 with latency 299.999s on POST /api/chat/conversations/.../messages,
        # dev 2026-06-04 20:31 UTC). Bump kept in sync with the Cloud Run service
        # timeout (modules/cloud_run var.request_timeout); if either changes, update both.
        # Backend-owned path prefixes. Anything not listed here is served by the
        # SPA, so a missing entry is invisible: the request 200s with
        # index.html instead of failing loudly.
        #
        # `oauth` and `oauth2` are SEPARATE families and both are required. The
        # group matches a whole segment followed by `/`, so `oauth` covers
        # `/oauth/token` and `/oauth/callback/...` but NOT `/oauth2/register` —
        # one character apart, and only one was routed. That gap broke RFC 7591
        # dynamic client registration, which is how an MCP client onboards
        # without a pre-issued token: the SDK POSTs `/oauth2/register` and got
        # nginx's 405 HTML back.
        #
        # `/mcp` has its own location above, because it streams and the group
        # requires a trailing slash while the JSON-RPC endpoint is the bare path.
        # `/.well-known/` has its own location above too, which caches.
        #
        # The backend mounts nothing under `/dashboard`, so every
        # `/dashboard/...` path is the SPA's.
        #
        # scripts/ci/nginx-routing-check.sh asserts every entry here reaches the
        # backend and that SPA paths still do not — run it after any edit.
        location ~ ^/(api|oauth|oauth2|admin|a2a|messaging|webhooks|providers|r)/ {
            # Resolve BACKEND_URL at request time via a variable proxy_pass so the
            # ipv6=off resolver applies. A static proxy_pass resolves via system
            # DNS at startup, which returns an AAAA record that is unroutable from
            # this container (nginx logged "connect() to [2600:...]:443 failed
            # (101: Network unreachable)" then disabled the upstream, dev
            # 2026-06-04 20:31 UTC) — same trap the /__/ firebase block dodges.
            # That holds only while NO location proxies to BACKEND_URL
            # statically: a variable proxy_pass looks its host up among the
            # upstreams nginx defined first, and a static proxy_pass defines
            # one, resolved at startup, which this block would then use
            # instead of the resolver. So /ws below uses this same form.
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            # The public host the client dialed (app.dravr.ai, mcp.dravr.ai),
            # which Host no longer carries: /mcp and its protected-resource
            # metadata name that origin as the RFC 9728 resource.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # The athlete's data export (carnet#1346): one streamed JSON file. nginx
        # buffers a proxied response by default and spools what a slow client has
        # not read to a temp file, on this service's in-memory filesystem, up to
        # 1 GB; a few slow downloads would run out of memory and take the app down
        # with them. Off, the client's pace reaches the backend, which waits to
        # read the next page. The backend ends the file before the 600s below.
        location = /api/user/export {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Garmin's pushes (carnet#1155). Same backend proxy as the block above,
        # with a larger body cap: an activityDetails push carries every sample
        # an activity recorded, up to one a second for 24 hours (about 30 MB),
        # and nginx's 1 MB default would refuse anything past ~45 minutes of
        # samples with a 413 the backend never sees. 32m matches the backend
        # route's own limit (GARMIN_PUSH_BODY_LIMIT) and Cloud Run's HTTP/1
        # request ceiling. `^~` makes this prefix win over the regex above.
        location ^~ /webhooks/garmin/ {
            client_max_body_size 32m;
            # The access log redacts the push token ($log_path), but nginx's
            # error log writes the raw request line ("request: \"POST
            # /webhooks/garmin/<token>/...\"") on every upstream error, and no
            # map can rewrite it. The token is the only secret a forged push
            # must guess, so this location writes no error log: a failed push
            # still shows in the access log as a 5xx with the token redacted,
            # and in the backend's own logs.
            error_log /dev/null crit;
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # WebSocket proxy. A variable proxy_pass, like the block above, so
        # BACKEND_URL is resolved per request with ipv6=off and never at startup.
        location /ws {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Cache hashed assets aggressively (Vite adds content hash to filenames).
        # A chunk this image lacks is a 404, never the SPA shell: index.html
        # served as text/html to a module import fails the same way, but later
        # and with a 200 that looks healthy. The image also carries the previous
        # release's chunks (scripts/ci/carry-forward-frontend-assets.sh), so a
        # tab still on that bundle resolves them. `expires` and add_header apply
        # to the 200 only, so a 404 is never cached as immutable.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # index.html must never be cached — it references hashed asset URLs
        # that change on each deploy. Without this, CDNs serve stale HTML that
        # points to old JS/CSS bundles.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            include /etc/nginx/security-headers.conf;
        }

        # SPA fallback: serve index.html for all unmatched routes
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
        }
    }
}
