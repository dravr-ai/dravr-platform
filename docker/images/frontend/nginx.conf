# ABOUTME: Nginx configuration for serving Pierre admin frontend as a SPA
# ABOUTME: Proxies API/OAuth/WebSocket traffic to the backend, serves static assets

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in Server headers / error pages.
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. Defined at server level so locations WITHOUT their own
        # add_header inherit them (the proxy blocks below). Any location that sets
        # its own add_header must re-`include` this snippet — nginx drops inherited
        # add_header the moment a location declares one of its own.
        include /etc/nginx/security-headers.conf;

        # Health check endpoint for Cloud Run probes
        location = /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
            include /etc/nginx/security-headers.conf;
        }

        # Firebase auth handler: reverse proxy to firebaseapp.com so authDomain = our own domain.
        # Eliminates manual OAuth redirect URI config and third-party cookie dependency.
        # Cloud NAT must be provisioned for this to work with vpc_egress=ALL_TRAFFIC.
        # IMPORTANT: proxy_pass uses a variable ($firebase_upstream) so nginx resolves
        # the hostname at request time via the resolver directive, not at startup.
        # Static proxy_pass ignores the resolver and uses the system DNS (which returns IPv6).
        location /__/ {
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $firebase_upstream https://${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_pass $firebase_upstream$request_uri;
            proxy_set_header Host ${FIREBASE_PROJECT_ID}.firebaseapp.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        # Reverse proxy: API, OAuth, admin, A2A, messaging, webhooks, the hosted
        # provider pages (/providers/* — Sciotte hosted login + the connect picker,
        # which are BACKEND routes, not SPA routes), and the short-link redirects
        # (/r/* — chat reconnect/connect links) all route to the backend. Without
        # the /providers/ + /r/ branches the SPA fallback swallows them and the user
        # lands on the chat home instead of the reconnect screen.
        # Read/send timeouts are 600s to match Cloud Run's request timeout — chat
        # endpoints invoke the LLM and run a multi-step tool loop with detail-page
        # provider enrichment that routinely exceeds the prior 300s cap
        # (504 with latency 299.999s on POST /api/chat/conversations/.../messages,
        # dev 2026-06-04 20:31 UTC). Bump kept in sync with the Cloud Run service
        # timeout (modules/cloud_run var.request_timeout); if either changes, update both.
        location ~ ^/(api|oauth|admin|a2a|messaging|webhooks|providers|r)/ {
            # Resolve BACKEND_URL at request time via a variable proxy_pass so the
            # ipv6=off resolver applies. A static proxy_pass resolves via system
            # DNS at startup, which returns an AAAA record that is unroutable from
            # this container (nginx logged "connect() to [2600:...]:443 failed
            # (101: Network unreachable)" then disabled the upstream, dev
            # 2026-06-04 20:31 UTC) — same trap the /__/ firebase block dodges.
            resolver 8.8.8.8 ipv6=off valid=300s;
            resolver_timeout 5s;
            set $backend_upstream ${BACKEND_URL};
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Cache hashed assets aggressively (Vite adds content hash to filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # index.html must never be cached — it references hashed asset URLs
        # that change on each deploy. Without this, CDNs serve stale HTML that
        # points to old JS/CSS bundles.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            include /etc/nginx/security-headers.conf;
        }

        # SPA fallback: serve index.html for all unmatched routes
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
        }
    }
}
