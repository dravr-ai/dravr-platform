# ABOUTME: The only publish path for over-the-air JS updates to the mobile app (EAS Update), by manual dispatch
# ABOUTME: Refuses to publish unless the checkout's fingerprint matches the latest build on the target channel
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Deploy: Mobile OTA"

# Why a workflow and never a laptop. `eas update` bundles the JS on the machine
# that runs it, and every EXPO_PUBLIC_* value is inlined into that bundle. On a
# laptop, frontend-mobile/.env (a tunnel URL, a local port) and whatever the
# shell exports would ride along to every phone on the channel. Here the
# checkout is clean, `--environment` loads the values from the EAS environment
# of the same name as the channel (plain text or sensitive only; `eas update`
# cannot read secret variables) and sets EXPO_NO_DOTENV=1.
#
# Why the fingerprint gate. The runtime version is a fingerprint of the native
# project (app.config.js, policy `fingerprint`; its inputs are narrowed in
# frontend-mobile/fingerprint.config.js). An update reaches only binaries with
# the same fingerprint, and `eas update` publishes happily when there are none,
# so a checkout whose native side moved since the last build would ship an
# update no phone ever downloads, reported as a success. `eas
# fingerprint:compare` itself exits 0 on a difference, so its JSON is judged
# here instead.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel; the EAS environment of the same name supplies the EXPO_PUBLIC_* values'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platforms to publish for (each needs a finished build on the channel)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      message:
        description: 'Update message, shown in EAS and in `eas update:list`'
        required: true
        type: string

# One publish per channel at a time, queued rather than cancelled: a cancelled
# `eas update` can leave assets uploaded with no update group pointing at them.
concurrency:
  group: mobile-ota-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to ${{ inputs.channel }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-mobile
    env:
      CHANNEL: ${{ inputs.channel }}
      PLATFORM: ${{ inputs.platform }}

    steps:
      # A production update reaches every installed store build, so it is
      # published from what main holds and from nothing else.
      - name: Refuse a production publish from any ref but main
        if: ${{ inputs.channel == 'production' && github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          echo "::error::The production channel is published from refs/heads/main only; this run is on ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      # Metro runs here to build the bundle, on the Node that EAS builds use
      # (eas.json pins 22.23.1).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: "24.8.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compare the fingerprint with the channel's latest build
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            all) platforms="ios android" ;;
            *) platforms="$PLATFORM" ;;
          esac
          for platform in $platforms; do
            builds="$(eas build:list --channel "$CHANNEL" --platform "$platform" --status finished --limit 1 --json --non-interactive)"
            build_id="$(printf '%s\n' "$builds" | sed -n '/^\[/,$p' | jq -r '.[0].id // empty')"
            if [ -z "$build_id" ]; then
              echo "::error::No finished $platform build on the $CHANNEL channel, so a $platform update would reach no phone. Build one first, or publish for the other platform only."
              exit 1
            fi
            # With --environment, eas prints the variables it loaded on stdout
            # ahead of the JSON document, which starts at a line holding only "{".
            compare="$(eas fingerprint:compare --build-id "$build_id" --environment "$CHANNEL" --json --non-interactive)"
            result="$(printf '%s\n' "$compare" | sed -n '/^{$/,$p')"
            build_hash="$(jq -r '.fingerprint1.hash // empty' <<<"$result")"
            local_hash="$(jq -r '.fingerprint2.hash // empty' <<<"$result")"
            if [ -z "$build_hash" ] || [ -z "$local_hash" ]; then
              echo "::error::eas fingerprint:compare returned no fingerprints for build $build_id"
              printf '%s\n' "$compare" | head -40
              exit 1
            fi
            if [ "$build_hash" != "$local_hash" ]; then
              echo "::error::The $platform native project differs from build $build_id on $CHANNEL (build $build_hash, checkout $local_hash). An update from this checkout would reach no phone; ship a store build instead."
              eas fingerprint:compare --build-id "$build_id" --environment "$CHANNEL" --non-interactive || true
              exit 1
            fi
            echo "$platform: checkout matches build $build_id on $CHANNEL (fingerprint $local_hash)"
            echo "- $platform: build \`$build_id\`, fingerprint \`$local_hash\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish the update
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/eas-update.json"
          eas update \
            --channel "$CHANNEL" \
            --environment "$CHANNEL" \
            --platform "$PLATFORM" \
            --message "$MESSAGE" \
            --json \
            --non-interactive > "$out"
          # The publish has happened by now; a summary that cannot be parsed
          # is reported, never turned into a failed run.
          if groups="$(sed -n '/^\[/,$p' "$out" | jq -r '.[] | "- \(.platform): group `\(.group)`, runtime `\(.runtimeVersion)`"')"; then
            {
              echo "## Published to $CHANNEL"
              echo "$groups"
              echo ""
              echo "Roll back with \`eas update:rollback\` (see docs.expo.dev/eas-update/rollbacks)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$groups"
          else
            echo "::warning::The update was published, but its JSON could not be read for the summary."
            cat "$out"
          fi
