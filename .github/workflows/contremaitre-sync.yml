# ABOUTME: Mirror prompt files from this repo into the dravr-contremaitre repo on merge
# ABOUTME: Keeps the compiled-in fallback and the runtime hot-reload source consistent

name: "Contremaitre: Sync Prompts"

on:
  push:
    branches: [main]
    paths:
      - "crates/pierre-llm/src/prompts/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Force push all prompts even if sha256 matches"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: contremaitre-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror-to-contremaitre:
    name: Mirror prompts to dravr-contremaitre
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync prompts to dravr-contremaitre
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CONTREMAITRE_WRITE_TOKEN }}
          CONTREMAITRE_REPO: dravr-ai/dravr-contremaitre
          CONTREMAITRE_BRANCH: main
          FORCE: ${{ github.event.inputs.force }}
          COMMIT_SHA: ${{ github.sha }}
        run: python .github/scripts/sync-contremaitre-prompts.py
