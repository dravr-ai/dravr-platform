name: "CI: Code Coverage"

# This lane does not run on push. It measures line coverage of the SQLite test
# suite — the local development database, not the one in production — and it
# is the longest single job the fleet has (~1h45m). Nothing consumes the
# per-commit number: there is no codecov config, threshold, badge or PR bot, and
# every test it runs already gets a per-commit verdict from ci-backend.yml's own
# SQLite shards, so bisect fidelity comes from there. Against the free plan's
# cap of 20 concurrent jobs, the 2026-08-30 main burst held three of these at
# once and queued the deploy behind them (carnet#156). Weekly plus on-demand
# is the honest cadence for a number nobody reads per commit.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
  schedule:
    # Weekly, Sundays 03:17 UTC. Off :00 on purpose — GitHub drops or delays
    # top-of-the-hour crons, and this is now the lane's only trigger on main.
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  # Same key as every other test-verdict lane, so `grep 'github.sha ||'` still
  # enumerates all of them. On main only the weekly schedule and a manual
  # dispatch reach this lane, and both land on the tip sha: a dispatch during a
  # scheduled run cancels it, which is what a human asking for a fresh number
  # wants. PR runs share a group per ref and cancel, where fast feedback beats
  # a stale result.
  #
  # The ref test lives in `group` rather than in `cancel-in-progress` because
  # only the former is known to work here — see the same block in ci-backend.yml
  # for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-1.96.0-v2-${{ hashFiles('**/Cargo.lock', 'migrations/**') }}

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        # --ignore-scripts: sdk/package.json's `prepare` runs this same build
        # as the last phase of `bun install`, so without it the SDK builds
        # twice per job (carnet#161). Full rationale in cross-platform.yml.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Run tests with coverage
        run: cargo llvm-cov --lib --bins --tests --lcov --output-path lcov.info -- --test-threads=4
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          CARGO_INCREMENTAL: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
