# ABOUTME: The photograveur lane — the shared bump spine, then image, service deploy, and the platform binary
# ABOUTME: Everything version-shaped is in satellite-bump.yml and satellites.toml; this file is triggers and shipping

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# photograveur-specific knowledge, and nothing else:
#
# * The ordering IS the safety property. The image is built and :latest advanced only
#   AFTER the platform has validated the pin and merged it. Building first would leave
#   :latest pointing at a photograveur the platform never accepted — and since
#   terraform's photograveur_image is that moving tag, the next unrelated
#   `terraform apply` would deploy it. That is why the image job below reads the
#   spine's `state` and not just its result: a stood-down run merged nothing, so
#   advancing :latest to the version it declined is the exact failure.
#
# * Gating on CI matters more here than the small crate suggests. photograveur owns
#   the Scene types the platform serialises into, so a shape change compiles on one
#   side and fails to deserialise on the other; and its rendering depends on fonts
#   present in the image rather than in the crate, so "it builds" is not "it draws".
#   The frontend gate is declared in satellites.toml (`gates = "backend frontend"`)
#   because packages/scene-types is regenerated inside the bump commit.
#
# * There are TWO things to ship, in this order. The service only rasterises an
#   already-resolved Scene; the geometry — scales, ticks, band widths, facets — is
#   `photograveur::layout`, compiled into the PLATFORM binary. The reader has to
#   understand the new shape before the writer starts emitting it.

name: "Photograveur: Release Integration"

on:
  repository_dispatch:
    types: [photograveur-released]
  schedule:
    # Weekly safety net, on the same cadence as sciotte: a missed or failed dispatch
    # still gets the release integrated rather than silently dropped.
    - cron: "30 13 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "photograveur tag to integrate (defaults to the latest release)"
        required: false
        type: string
      dry_run:
        description: "Rehearse: resolve and rewrite, push nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch
  id-token: write # WIF, for the image build and the deploy
  security-events: write # Trivy SARIF, uploaded by the image build

concurrency:
  # Never overlap. Two releases integrating at once would race on main and on the
  # :latest tag, and the deploy job's rollback target would be whichever one lost.
  group: photograveur-bump
  cancel-in-progress: false

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  bump:
    uses: ./.github/workflows/satellite-bump.yml
    with:
      satellite: photograveur
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      DRAVR_PRIVATE_DEPS_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
      DRAVR_CARNET_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
  # ---------------------------------------------------------------------------
  # 5. Build the image — only now that main has accepted this photograveur
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish the photograveur image
    needs: bump
    # Runs whether or not a bump was needed, so the deployment converges on whatever
    # photograveur version main pins. Gating this on "a bump happened" instead meant a
    # re-run after a merge skipped everything, leaving no way to finish a deploy that
    # had failed after the bump already landed.
    #
    # `state` is read, not just `result`, because two of the spine's clean outcomes
    # leave main pinning the OLD version: a stand-down (the release also moved a crate
    # another lane owns) and a dry run. Building either would advance :latest to a
    # photograveur main never accepted, and terraform's photograveur_image is that
    # moving tag — the next unrelated apply would deploy it.
    #
    # `!inputs.dry_run` is load-bearing, not belt-and-braces. dry_run suppresses the
    # PIN PUSH inside the spine, and when every pin is already current the spine skips
    # its bump job entirely — so `state` is 'current', this job's condition holds, and
    # a rehearsal builds an image and deploys photograveur to dev. That happened on
    # the first dispatch of this lane (run 34503834779): same source tag, so identical
    # bytes and no functional change, but a Cloud Run revision is not what "dry run"
    # means to whoever typed it.
    if: >-
      ${{ !cancelled()
          && !inputs.dry_run
          && needs.bump.result == 'success'
          && (needs.bump.outputs.state == 'pushed' || needs.bump.outputs.state == 'current') }}
    uses: ./.github/workflows/publish-photograveur-image.yml
    secrets: inherit
    with:
      # v-prefixed: the spine deals in bare cargo versions, this wants a git ref.
      photograveur_ref: v${{ needs.bump.outputs.version }}

  # ---------------------------------------------------------------------------
  # 6. Deploy photograveur, verify the bytes, roll back, tag, then ship the platform
  # ---------------------------------------------------------------------------
  #
  # deploy-satellite-cloud-run.yml carries the deploy, the digest assertion, the
  # rollback, the `deployed-dev` tag and the platform dispatch for every lane with
  # a service. What is photograveur's alone:
  #
  # * No HTTP probe: Cloud Run's startup probe (GET /health) is the whole health
  #   check, so `probe_audience` stays empty.
  #
  # * The platform binary. The service only rasterises an already-resolved Scene;
  #   the geometry — scales, ticks, band widths, facets — is `photograveur::layout`,
  #   compiled into dravr-mcp-server-api as a Rust crate: `photograveur_client.rs`
  #   posts an already-resolved Scene to the service. So a layout change reaches an
  #   athlete only when that binary is rebuilt. Both of 2026-08-24's releases missed
  #   it: v0.1.5 reached the binary only because unrelated commits landed on top of
  #   it minutes later, and v0.1.6 sat undeployed until a hand-run dispatch
  #   (carnet#94). The dispatch runs after the service deploy: photograveur owns the
  #   Scene types the platform serialises into, so the reader has to understand the
  #   new shape before the writer starts emitting it.
  deploy:
    needs: [bump, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    uses: ./.github/workflows/deploy-satellite-cloud-run.yml
    secrets: inherit
    with:
      service: photograveur
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      ship_platform: ${{ needs.bump.outputs.state == 'pushed' }}
      release: v${{ needs.bump.outputs.version }}
      platform_summary: >-
        The photograveur service is on v${{ needs.bump.outputs.version }}; the platform binary that
        resolves Scenes is now rebuilding to match.
