# ABOUTME: The photograveur lane — the shared bump spine, then image, service deploy, and the platform binary
# ABOUTME: Everything version-shaped is in satellite-bump.yml and satellites.toml; this file is triggers and shipping

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# photograveur-specific knowledge, and nothing else:
#
# * The ordering IS the safety property. The image is built and :latest advanced only
#   AFTER the platform has validated the pin and merged it. Building first would leave
#   :latest pointing at a photograveur the platform never accepted — and since
#   terraform's photograveur_image is that moving tag, the next unrelated
#   `terraform apply` would deploy it. That is why the image job below reads the
#   spine's `state` and not just its result: a stood-down run merged nothing, so
#   advancing :latest to the version it declined is the exact failure.
#
# * Gating on CI matters more here than the small crate suggests. photograveur owns
#   the Scene types the platform serialises into, so a shape change compiles on one
#   side and fails to deserialise on the other; and its rendering depends on fonts
#   present in the image rather than in the crate, so "it builds" is not "it draws".
#   The frontend gate is declared in satellites.toml (`gates = "backend frontend"`)
#   because packages/scene-types is regenerated inside the bump commit.
#
# * There are TWO things to ship, in this order. The service only rasterises an
#   already-resolved Scene; the geometry — scales, ticks, band widths, facets — is
#   `photograveur::layout`, compiled into the PLATFORM binary. The reader has to
#   understand the new shape before the writer starts emitting it.

name: "Photograveur: Release Integration"

on:
  repository_dispatch:
    types: [photograveur-released]
  schedule:
    # Weekly safety net, on the same cadence as sciotte: a missed or failed dispatch
    # still gets the release integrated rather than silently dropped.
    - cron: "30 13 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "photograveur tag to integrate (defaults to the latest release)"
        required: false
        type: string
      dry_run:
        description: "Rehearse: resolve and rewrite, push nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch
  id-token: write # WIF, for the image build and the deploy
  security-events: write # Trivy SARIF, uploaded by the image build

concurrency:
  # Never overlap. Two releases integrating at once would race on main and on the
  # :latest tag, and the deploy job's rollback target would be whichever one lost.
  group: photograveur-bump
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/satellite-bump.yml
    with:
      satellite: photograveur
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      DRAVR_PRIVATE_DEPS_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
      DRAVR_CARNET_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
  # ---------------------------------------------------------------------------
  # 5. Build the image — only now that main has accepted this photograveur
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish the photograveur image
    needs: bump
    # Runs whether or not a bump was needed, so the deployment converges on whatever
    # photograveur version main pins. Gating this on "a bump happened" instead meant a
    # re-run after a merge skipped everything, leaving no way to finish a deploy that
    # had failed after the bump already landed.
    #
    # `state` is read, not just `result`, because two of the spine's clean outcomes
    # leave main pinning the OLD version: a stand-down (the release also moved a crate
    # another lane owns) and a dry run. Building either would advance :latest to a
    # photograveur main never accepted, and terraform's photograveur_image is that
    # moving tag — the next unrelated apply would deploy it.
    #
    # `!inputs.dry_run` is load-bearing, not belt-and-braces. dry_run suppresses the
    # PIN PUSH inside the spine, and when every pin is already current the spine skips
    # its bump job entirely — so `state` is 'current', this job's condition holds, and
    # a rehearsal builds an image and deploys photograveur to dev. That happened on
    # the first dispatch of this lane (run 34503834779): same source tag, so identical
    # bytes and no functional change, but a Cloud Run revision is not what "dry run"
    # means to whoever typed it.
    if: >-
      ${{ !cancelled()
          && !inputs.dry_run
          && needs.bump.result == 'success'
          && (needs.bump.outputs.state == 'pushed' || needs.bump.outputs.state == 'current') }}
    uses: ./.github/workflows/publish-photograveur-image.yml
    secrets: inherit
    with:
      # v-prefixed: the spine deals in bare cargo versions, this wants a git ref.
      photograveur_ref: v${{ needs.bump.outputs.version }}

  # ---------------------------------------------------------------------------
  # 6. Deploy, verify the bytes, roll back if it goes wrong
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy photograveur to dev
    runs-on: ubuntu-latest
    needs: [bump, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    environment: development
    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Capture the digest currently serving
        id: prev
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          PREV=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                   --format='value(status.imageDigest)')
          # Refuse to deploy with no rollback target. A rollback step that silently
          # has nothing to roll back to is worse than not having one, because the
          # workflow would still report that it recovered.
          if [ -z "${PREV}" ]; then
            echo "::error::could not read the serving digest of ${REV} — refusing to deploy without a rollback target"
            exit 1
          fi
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "serving ${REV} at ${PREV}"

      - name: Deploy
        # Deploys the moving :latest tag rather than the digest, because that is the
        # literal value terraform holds in photograveur_image. Deploying a digest
        # would leave the service permanently disagreeing with its own terraform, so
        # every later apply would bounce it. The digest is asserted immediately below,
        # which closes the gap this opens.
        #
        # Cloud Run refuses to shift traffic to a revision that fails its startup
        # probe (GET /health, 10 attempts at 5s), so a container that cannot boot
        # leaves the previous revision serving and fails this step. That probe is the
        # health check; the rollback below covers the rest.
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/photograveur:latest

      - name: Assert the serving bytes are the bytes we built and scanned
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          REGISTRY: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}
          EXPECTED: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          GOT=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                  --format='value(status.imageDigest)')

          # buildx publishes an OCI *index*, because it attaches a provenance
          # attestation alongside the image. build-push-action reports that index's
          # digest, while Cloud Run resolves the tag down to the linux/amd64 child and
          # records the child. The two are never equal, so comparing them directly
          # fails every time on a deploy that in fact shipped the right bytes. This
          # chain has never run a real deploy; the sciotte one proved the failure on
          # v0.8.6, rolling dev back over a correct rollout. Accept the index digest
          # or any of its children.
          HOST="${REGISTRY%%/*}"
          PATH_PART="${REGISTRY#*/}/photograveur"
          TOKEN=$(gcloud auth print-access-token)
          CHILDREN=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://${HOST}/v2/${PATH_PART}/manifests/${EXPECTED}" \
            | jq -r '(.manifests // [])[].digest' || true)

          for candidate in ${EXPECTED} ${CHILDREN}; do
            if [ "${GOT}" = "${candidate}" ] || [ "${GOT##*@}" = "${candidate}" ]; then
              echo "serving ${REV} at ${GOT} (matches ${candidate})"
              exit 0
            fi
          done
          echo "::error::${REV} serves ${GOT}, which is neither ${EXPECTED} nor any manifest it indexes"
          echo "index children were: ${CHILDREN:-<none>}"
          exit 1

      - name: Roll back to the previously serving digest
        if: failure()
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREV: ${{ steps.prev.outputs.image }}
        run: |
          set -euo pipefail
          # Redeploy the previous digest rather than repointing traffic. Traffic pins
          # applied with `update-traffic --to-revisions` stick to the service and make
          # every subsequent deploy land without receiving traffic — the failure mode
          # is a deploy that reports success while nothing it shipped is serving.
          echo "rolling back ${SVC} to ${PREV}"
          gcloud run services update "${SVC}" --region "${REGION}" --image "${PREV}" --quiet
          echo "::warning::rolled back to ${PREV}; main carries the bump, the deployed image does not"

  # ---------------------------------------------------------------------------
  # 6b. Mark the digest dev is serving so registry retention keeps it
  # ---------------------------------------------------------------------------
  tag-deployed-photograveur:
    name: Tag Deployed Digest (photograveur, dev)
    runs-on: ubuntu-latest
    needs: [image, deploy]
    # Explicit, not defaulted. With no `if:` a job evaluates `success()`, which is
    # false when any *transitive* ancestor was skipped — and bump/gate/merge skip
    # on every run that needs no version bump. That silently skipped the sibling
    # job on the sciotte lane while the run still reported success (2026-08-31).
    # The safety property is unchanged: tag only a deploy that succeeded, so a
    # rolled-back image is never anchored.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.deploy.result == 'success' }}

    steps:
      # image-publisher (artifactregistry.writer), not the dev deployer: the tag
      # is written in the dravr-artifacts project, where the dev deployer has no
      # write access. Same split as publish-images.yml's tag-deployed-dev.
      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Tag the deployed photograveur digest
        # The deploy above captures the serving digest as its rollback target, but
        # nothing marks that digest for the registry, so the cleanup policy is free
        # to delete it once newer builds push it past the recent-versions floor —
        # and a rollback to a deleted digest fails outright ("Image not found",
        # observed on the sciotte lane 2026-08-31, carnet#166). `deployed-` is
        # matched by the registry's keep-tags rule (infra/artifacts
        # release_tag_prefixes) and wins over every delete rule; the tfvars comment
        # names this tag as what carries the guarantee keep_count cannot.
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          PACKAGE="${IMAGE%@*}"
          echo "Tagging ${IMAGE} as ${PACKAGE}:deployed-dev"
          gcloud artifacts docker tags add "${IMAGE}" "${PACKAGE}:deployed-dev" --quiet

  # ---------------------------------------------------------------------------
  # 7. Ship the platform binary, which is where the geometry actually runs
  # ---------------------------------------------------------------------------
  #
  # Everything above deploys the photograveur SERVICE, which only rasterises an
  # already-resolved Scene. The geometry — scales, ticks, band widths, facets —
  # is `photograveur::layout`, compiled into the PLATFORM binary as a Rust crate:
  # `photograveur_client.rs` posts an already-resolved Scene to the service. So a
  # layout change reaches an athlete only when dravr-mcp-server-api is rebuilt.
  #
  # Nothing rebuilt it. `publish-images.yml` deploys the platform on `workflow_run`
  # of "CI: Backend (Rust)" against main, and the squash merge above is pushed with
  # GITHUB_TOKEN, which by design does not trigger downstream workflows. A bump that
  # lands on a quiet main therefore reported six green jobs and shipped nothing,
  # while the pin and the running binary silently disagreed until somebody else
  # happened to push. Both of 2026-08-24's releases hit this: v0.1.5 reached the
  # binary only because unrelated commits landed on top of it minutes later, and
  # v0.1.6 sat undeployed until a hand-run dispatch (carnet#94).
  #
  # Dispatching explicitly is the same move this workflow already makes to put the
  # CI gates on the bump branch, and it runs AFTER the service deploy: photograveur
  # owns the Scene types the platform serialises into, so the reader has to
  # understand the new shape before the writer starts emitting it.
  platform:
    name: Ship the platform binary carrying the new crate
    runs-on: ubuntu-latest
    needs: [bump, deploy]
    if: >-
      ${{ !cancelled()
          && needs.bump.outputs.state == 'pushed'
          && needs.deploy.result == 'success' }}
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Dispatch the platform image build and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: v${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run publish-images.yml --ref main
          echo "dispatched publish-images.yml on main so the binary picks up ${VERSION}"
          echo "### Platform deploy dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "The photograveur service is on ${VERSION}; the platform binary that" \
               "resolves Scenes is now rebuilding to match." >> "$GITHUB_STEP_SUMMARY"

