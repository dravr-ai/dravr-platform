# ABOUTME: Weekly caller of the shared feature-phase-review workflow — opens a private
# ABOUTME: dravr-registre issue for any feature-phases.yaml entry past its review date
name: "Monitor: Feature Phase Review"

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review:
    uses: dravr-ai/dravr-build-config/.github/workflows/feature-phase-review-reusable.yml@main
    with:
      repo_label: dravr-platform
      title_prefix: platform
    secrets:
      registre_token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
