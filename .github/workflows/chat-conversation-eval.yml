# ABOUTME: Conversation eval framework — multi-turn YAML scenarios + Telegram-trace replays
# ABOUTME: Per-push gate runs the structural pass; nightly + manual run the live-LLM pass
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

# Two layers of execution:
#
# 1. **`structural`** — always runs. Loads every YAML scenario +
#    Telegram trace, asserts schema invariants, and exercises the
#    runner against the mock driver. Fast (< 30s) and deterministic;
#    catches scenario-file syntax errors and runner regressions on
#    every push to chat-eval code.
#
# 2. **`live-llm`** — nightly + on-demand only. Runs the same
#    scenarios end-to-end against the live chat pipeline with the
#    configured LLM (Cloud Run dev config). Cost-bounded by the
#    token-budget threshold the runner enforces per scenario; a
#    failure is signal that the LLM drift caught a regression.

name: "Chat Eval: Conversation Scenarios"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "live-llm"
        type: choice
        options:
          - structural
          - live-llm
      include_ondemand:
        description: "Also run on-demand-only scenarios (nightly_gate: false, e.g. today_anchor)"
        required: false
        default: false
        type: boolean
  schedule:
    # 03:30 UTC nightly — ahead of the messaging-eval nightly at 04:00
    # so an early signal lights up before the heavier suite runs.
    - cron: "30 3 * * *"
  push:
    paths:
      - "crates/pierre-server/tests/helpers/chat_scenario/**"
      - "crates/pierre-server/tests/chat_scenario_test.rs"
      - "crates/pierre-server/tests/scenarios/**"
      - "book/src/eval/**"
      - ".github/workflows/chat-conversation-eval.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Retry transient crates.io download failures (curl/SSL EOF) instead of
  # failing the job; cold rust-cache (frequent Cargo.lock churn) hits fresh fetches.
  CARGO_NET_RETRY: "10"
  RUSTFLAGS: -Dwarnings

concurrency:
  group: chat-conversation-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Structural pass: per-push, fast, no external dependencies.
  # ---------------------------------------------------------------------------
  structural:
    name: Structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.mode == 'structural' ||
      inputs.mode == 'live-llm'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Configure git for private deps
        run: |
          git config --global \
            url."https://${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chat-eval-structural

      - name: Run chat_scenario_test (structural mode)
        run: cargo test --test chat_scenario_test
        env:
          # CHAT_SCENARIO_LIVE unset → structural mode only
          PIERRE_LLM_MODEL: "mock"

  # ---------------------------------------------------------------------------
  # Live-LLM pass: nightly cron + on-demand. Drives every scenario through
  # the real chat pipeline against a LOCAL Ollama model (qwen2.5:7b), and
  # asserts on actual LLM replies. Sharded 3 ways because CPU inference of
  # Pierre's ~8K-token system prompt (the ~24 KB platform contract plus the
  # persona and tool-discipline blocks) costs minutes per turn; a local model
  # means zero rate limits and zero per-call cost — the Cohere endpoint this
  # replaced 429'd the entire suite under the retry burst. Provisioning
  # mirrors the proven messaging-eval recipe (systemd context bump + derived
  # model + warm-up).
  # ---------------------------------------------------------------------------
  live-llm:
    name: Live LLM execution (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    # Restoring the platform contract to the live driver put the whole
    # ~23.7 KB document in front of a CPU-only q4_K_M 7b at num_ctx 32768,
    # which is the prompt production runs and the reason this lane grades the
    # coach rather than a voice-only stub. It costs wall clock: shards that
    # finished inside half an hour now take one to two, and one was killed at
    # the ceiling with scenarios still to run. Five shards keeps each inside
    # the box and the wider ceiling leaves room for the prompt to grow again.
    timeout-minutes: 180
    needs: structural
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-llm')
    strategy:
      # One shard failing must not cancel the others — each covers a
      # disjoint slice of the scenarios, so we want every verdict.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    env:
      CHAT_SCENARIO_LIVE: "1"
      # The live driver (helpers/chat_scenario/live_driver.rs) reads
      # PIERRE_LLM_MODEL and dispatches to the local Ollama server
      # (OpenAI-compatible at :11434) — no API key, no rate limit, no cost.
      # `dravr-chateval` is a derived tag created below from
      # qwen2.5:7b-instruct with num_ctx 32768 so Pierre's full system
      # prompt + tool schemas fit without truncation.
      PIERRE_LLM_MODEL: "dravr-chateval"
      # Fan the scenario files across 5 runners round-robin so each shard
      # stays inside the wall-clock cap (multi-turn CPU inference is minutes
      # per turn). Format is "<index>/<total>", consumed by
      # shard_scenario_files() in chat_scenario_test.rs.
      CHAT_SCENARIO_SHARD: "${{ matrix.shard }}/5"
      # On-demand carve-out: only a manual dispatch with include_ondemand=true
      # runs nightly_gate:false scenarios (e.g. today_anchor, which a local 7b
      # can't reliably clear). The nightly cron leaves this empty, so those
      # scenarios are skipped and the run stays green. Consumed by
      # live_driver_executes_every_scenario in chat_scenario_test.rs.
      CHAT_SCENARIO_INCLUDE_ONDEMAND: "${{ inputs.include_ondemand && '1' || '' }}"
      # Pierre's shared LLM reqwest client defaults to a 300s request
      # timeout; CPU prefill of the ~8K-token prompt on qwen2.5:7b runs
      # longer. The driver's own per-dispatch tokio guard derives from this
      # value plus a margin, so raising it here lifts both ceilings.
      LLM_REQUEST_TIMEOUT_SECS: "900"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Configure git for private deps
        run: |
          git config --global \
            url."https://${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chat-eval-live

      - name: Install Ollama
        run: |
          # `curl … | sh` hides curl's exit status behind sh's: the default
          # step shell is `bash -e` with no pipefail, so a failed download
          # feeds sh an empty script, sh exits 0, and the step marches on to
          # die 15 lines below as "Failed to restart ollama.service: Unit
          # ollama.service not found" (systemctl exit 5) — a network blip
          # wearing a config error's mask. ollama.com reset the connection
          # mid-download on 2026-07-14 (run 29309692944) and cost a nightly.
          # pipefail surfaces the real error; the retry absorbs the blip.
          set -o pipefail
          for attempt in 1 2 3; do
            if curl -fsSL https://ollama.com/install.sh | sh; then
              echo "ollama install succeeded on attempt $attempt"
              break
            fi
            echo "ollama install failed on attempt $attempt; retrying in 10s..."
            sleep 10
            if [ "$attempt" = "3" ]; then
              echo "ERROR: ollama install exhausted retries" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/ollama-logs"
          # The installer auto-starts a systemd unit. Bump the context
          # window (Ollama's 4K default truncates Pierre's ~8K-token
          # system prompt) and keep the model resident across the shard's
          # scenarios so it isn't reloaded mid-run.
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nEnvironment="OLLAMA_CONTEXT_LENGTH=32768"\nEnvironment="OLLAMA_KEEP_ALIVE=120m"\n' \
            | sudo tee /etc/systemd/system/ollama.service.d/override.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Ollama ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
            echo "ERROR: Ollama did not respond on :11434 after restart" >&2
            sudo journalctl -u ollama --no-pager -n 100 || true
            exit 1
          fi

      # Runs on EVERY shard, pass or fail. The Ollama journal is only dumped
      # on failure, so every llama-server segfault so far (2026-07-15: nightly
      # shard 3, plus two manual runs on shard 1) has been observed on an
      # Intel Xeon Platinum 8573C with AMX_INT8=1 — while passing shards
      # reported no CPU at all. That makes the "AMX backend segfaults" theory
      # untestable: it is equally consistent with every runner being an 8573C
      # and the crash being probabilistic. One line of lscpu per shard settles
      # it: if green shards are also AMX, the CPU is not the discriminator.
      - name: Log runner CPU (segfault evidence)
        run: |
          echo "=== CPU model ==="
          lscpu | grep -iE "^Model name|^Vendor ID|^CPU\(s\):" || true
          echo "=== AMX / AVX512 flags present? ==="
          if lscpu | grep -qiE "\bamx_int8\b"; then
            echo "AMX_INT8: PRESENT"
          else
            echo "AMX_INT8: absent"
          fi
          lscpu | grep -oE "\bamx_[a-z0-9]+|\bavx512_bf16\b" | sort -u || true
          echo "=== memory ==="
          free -g || true

      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          # ~/.ollama/models holds the pulled blobs + manifests. Key pinned
          # on the model tag so a model bump cleanly busts the cache.
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-instruct-q4_K_M-v1

      - name: Pull qwen2.5:7b + create dravr-chateval (num_ctx 32768) + warm up
        run: |
          # Ollama's registry occasionally drops the connection mid-pull
          # ("connection reset by peer" at 100%). `ollama pull` is
          # idempotent and resumes via the layer cache, so retry.
          for attempt in 1 2 3 4; do
            if ollama pull qwen2.5:7b-instruct-q4_K_M; then
              echo "pull succeeded on attempt $attempt"
              break
            fi
            echo "pull failed on attempt $attempt; retrying in 10s..."
            sleep 10
            if [ "$attempt" = "4" ]; then
              echo "ERROR: model pull exhausted retries" >&2
              exit 1
            fi
          done
          # Bake CPU parallelism + context into a derived tag. num_thread 4
          # uses all vCPUs on the standard ubuntu-latest runner; num_ctx
          # 32768 lets Pierre's ~8K-token system prompt, the tool schemas and
          # a multi-turn history fit without truncation (Qwen 2.5 supports
          # 32K native).
          cat > "$RUNNER_TEMP/Modelfile" <<'EOF'
          FROM qwen2.5:7b-instruct-q4_K_M
          PARAMETER num_thread 4
          PARAMETER num_ctx 32768
          EOF
          ollama create dravr-chateval -f "$RUNNER_TEMP/Modelfile"
          ollama list
          # Force a tiny inference so the derived model is mmap'd into RAM
          # before the eval's first scenario asks for one.
          time curl -fsS -X POST http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"dravr-chateval","stream":false,"messages":[{"role":"user","content":"reply with the word ok"}]}' \
            | tee "$RUNNER_TEMP/ollama-logs/warmup.json"

      - name: Run chat_scenario_test (live mode, shard ${{ matrix.shard }}/3)
        # --nocapture streams the live driver's per-dispatch diagnostics
        # (attempt failures, timeouts, backoffs) to the job log in real
        # time, so a degraded run is visible even if the job hits its hard
        # wall-clock kill before the test reports.
        run: cargo test --test chat_scenario_test -- --include-ignored --nocapture

      - name: Dump Ollama log on failure
        if: failure()
        run: |
          echo "=== ollama systemd journal (tail 200) ==="
          sudo journalctl -u ollama --no-pager -n 200 || true
          echo "=== warmup.json ==="
          cat "$RUNNER_TEMP/ollama-logs/warmup.json" 2>/dev/null || true
