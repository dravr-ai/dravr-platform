# ABOUTME: The live-model eval lane — the 2026-08 incident corpus against a REAL model over production's transport
# ABOUTME: Dispatch only: no model host that CI may use fits it yet (carnet#504)
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Action #1 of the 2026-08-23 post-mortem "Why E2E Kept Missing the Coach Regressions".
# Every other tier drives a scripted mock model and so verifies the pipeline's reaction
# to model behaviour an author imagined. This one drives a model nobody scripted through
# production's transport — the pinned Copilot CLI over embacle ACP, native MCP tool
# calling — and the real chat pipeline, and grades the DELIVERED message.
#
# WHOSE MODEL ANSWERS, AND WHY IT IS NOT PRODUCTION'S
#
# The model is a Qwen 2.5 7B this job provisions on the runner. The Copilot CLI routes
# to it through its own custom-provider setting (COPILOT_PROVIDER_BASE_URL) and needs no
# GitHub login then; COPILOT_OFFLINE cuts every other GitHub call.
#
# Until 2026-09-21 this lane ran on the deployed coaching model with the LIVE dev token
# from Secret Manager: 11 episodes x 3 passes of multi-turn tool loops, 186 ACP prompts
# a night (run 35502201927), out of the one Copilot subscription the dev deployment
# serves athletes from. That account's monthly quota then ran out — drained by a
# development session, not by this lane — and it stays off the account until the
# quota resets on 2026-10-01 (carnet#504, feature-phases.yaml).
#
# What that costs is stated rather than hidden: a finding here is a statement about the
# pipeline and transport under a real, unscripted model — scaffolding that reaches the
# athlete, a dropped chart block, a lost language, a tool envelope the loop mishandles —
# and NOT a statement about how the deployed model coaches. Judge findings in particular
# are a 7B grading a 7B. Every run before this change is a different baseline; do not
# diff across it.
#
# WHY IT IS DISPATCH-ONLY FOR NOW (carnet#504)
#
# A runner-local model does not fit this corpus. With Pierre's tool surface attached
# over MCP, Copilot's static context exceeds the 32k budget this job gives the model,
# and the CLI refuses before calling it — "Static system messages and tool definitions
# exceed the model's usable context budget … No response was returned." — which is the
# 219-char reply every turn delivered in run 35666766933. Where it does fit it is too
# slow: one call took 26.8 min on the runner, so three passes of ~13 turns need far
# more than GitHub's 6 h job ceiling, so a nightly run here could only grade the
# refusal. JF's call (carnet#504): the lane goes back on the hosted account when its
# quota resets on 2026-10-01.
#
# WHY THERE IS NO `push:` TRIGGER
#
# The lane is non-gating by construction rather than by `continue-on-error`, which is
# banned on test jobs here and for good reason: it turns a red test into a green check
# and the failure is never seen again. A scheduled workflow that fails is *visible* —
# it reds on the Actions tab and can page — while blocking no merge, which is exactly
# the property "non-gating" is asking for. When the corpus has been stable long enough
# to trust, the way to promote it is to add the trigger, not to remove a mask.
#
# COST
#
# No metered call, but wall clock: every model call evaluates 6-10k tokens of prompt on
# four vCPUs, and one turn makes several. So this never runs per push, and the corpus
# stays small (~13 turns): an incident regression suite, not a benchmark.
#
# WHY THE CORPUS IS DRIVEN MORE THAN ONCE
#
# A live model samples, so one pass cannot tell a defect from a draw. Across four runs
# on 2026-08-26 the finding count moved 6 -> 2 -> 8 -> 6, and which episode produced the
# empty reply moved with it, while the missing chart block failed all four. The lane
# therefore drives the whole corpus LIVE_INCIDENT_EVAL_ATTEMPTS times (default 3) and
# reds only on a finding that reproduces in a majority of passes. Everything observed is
# still printed — a finding nobody sees is a finding nobody fixes — but a single draw no
# longer reds a lane that then gets ignored for being permanently red.

name: "Eval: Live Incident Corpus"

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Passes over the whole corpus (a finding reds only when it reproduces in a majority)"
        required: true
        default: "3"
      episodes:
        description: "Comma-separated episode names; empty runs the corpus. Not behaviour-neutral — see episode_filter()"
        required: false
        default: ""

permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

concurrency:
  group: live-incident-eval
  cancel-in-progress: false

jobs:
  corpus:
    name: Incident corpus (live model, production transport)
    runs-on: ubuntu-latest
    # GitHub's ceiling is 360. The first runs on a runner-local model are the
    # measurement of what this actually needs.
    timeout-minutes: 350

    env:
      LIVE_INCIDENT_EVAL: "1"
      # INFO, not the WARN this defaults to (tests/common.rs init_test_logging).
      # At WARN the run records THAT a turn came back empty and nothing about
      # which prompt did it: `wire shape at the provider boundary` (total_chars,
      # logged immediately before every completion) and embacle's `ACP: response
      # received` (content_len + tool_calls) are both info!, so run 33492743565
      # contains zero of either. tool_calls is the field that separates "the
      # model said nothing" from "the turn died on or after a tool batch".
      #
      # INFO and not DEBUG deliberately: the level is a global with_max_level
      # with no EnvFilter, so DEBUG would also turn on sqlx statement logging,
      # hyper, h2 and reqwest across 11 episodes x 3 passes in one job,
      # risking truncation of the very log this exists to read. Both target
      # lines are info!, so INFO is sufficient. If a run is truncated anyway,
      # drop this key rather than lowering it further — a flooded run costs
      # hours of wall clock.
      TEST_LOG: "INFO"
      # Take production's transport, not the text-catalog simulation.
      #
      # Unset, embacle withholds SDK_TOOL_CALLING, so run_react_tool_loop picks
      # run_cli_tool_loop — which does not declare tools at all. It injects a
      # PROSE CATALOG of them into the messages and parses tool calls back out of
      # the reply (tool_execution.rs:432-435). That file's own comment calls it
      # "the form that does not work" and notes it never opens an MCP session,
      # so the server's initialize instructions never reach the model.
      #
      # Production sets this to "true" (infra/environments/dev/main.tf:339) and
      # therefore runs the OTHER path. A lane built to catch what real models do
      # in production was exercising a transport production does not use — the
      # one thing it exists not to do.
      #
      # The cost is stated rather than hidden: this breaks comparability with
      # every run before it, including the 18% empty-turn rate measured on
      # 2026-09-01. That rate looks like an artifact of the simulation path (37
      # bare-CLI probe calls across four hypotheses produced zero empties), so
      # the baseline being discarded is a number about a path nobody ships. The
      # first run after this is a NEW baseline; do not diff it against an older
      # one.
      COPILOT_HEADLESS_MCP_TOOL_CALLING: "true"
      # Production's provider and transport, unchanged. Only the model behind
      # the Copilot CLI differs.
      PIERRE_LLM_PROVIDER: copilot_headless
      # The model this lane grades, by the tag the job creates below. The test
      # refuses to run on the harness placeholder.
      PIERRE_LLM_MODEL: dravr-incident-eval
      COPILOT_OFFLINE: "true"
      COPILOT_PROVIDER_BASE_URL: http://127.0.0.1:11434/v1
      COPILOT_PROVIDER_MAX_PROMPT_TOKENS: "32768"
      # No fallback tier: a corpus falling through would spend the next
      # provider's account and report its answer as the local model's. A turn
      # the local model cannot finish is an infra error here.
      PIERRE_LLM_RUNTIME_FALLBACK: "false"
      # Production caps a prompt at 300s for a hosted model. A CPU-served 7B
      # spends longer than that on prompt evaluation alone; the test's own turn
      # deadline derives from the same variable.
      EMBACLE_ACP_PROMPT_TIMEOUT_SECS: "2400"
      EMBACLE_ACP_MESSAGE_TIMEOUT_SECS: "1800"
      EMBACLE_ACP_SESSION_TIMEOUT_SECS: "180"
      LIVE_INCIDENT_EVAL_ATTEMPTS: ${{ inputs.attempts || '3' }}
      LIVE_INCIDENT_EVAL_EPISODES: ${{ inputs.episodes || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Configure git for private deps
        run: |
          git config --global \
            url."https://${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-incident-eval

      - name: Read the pinned Copilot CLI version
        id: pin
        run: |
          set -euo pipefail
          # The pin lives in the image the server actually runs. Reading it here
          # rather than restating it keeps the lane on the same CLI production
          # is on — a lane that drifts to a newer CLI stops reproducing the
          # behaviour it exists to catch.
          VERSION=$(grep -oE '^ARG COPILOT_CLI_VERSION=[0-9.]+' \
                      docker/images/server/Dockerfile | cut -d= -f2)
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read COPILOT_CLI_VERSION from the server Dockerfile" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pinned Copilot CLI: ${VERSION}"

      # Restored before the server starts, so it opens a store that already
      # holds the weights.
      - name: Cache Ollama model store
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-instruct-q4_K_M-runner-user-v1

      - name: Install Ollama
        run: |
          # pipefail: `curl … | sh` otherwise hides a failed download behind
          # sh's exit 0 on an empty script.
          set -o pipefail
          for attempt in 1 2 3 4; do
            if curl -fsSL https://ollama.com/install.sh | sh; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "ERROR: ollama install exhausted retries" >&2
              exit 1
            fi
            echo "ollama install failed on attempt $attempt; retrying in 10s..."
            sleep 10
          done
          # The installer's systemd unit runs as the `ollama` user, whose model
          # store is not the path cached above. Serve as the runner user.
          sudo systemctl disable --now ollama
          # Ollama's default context is 4096 and a longer prompt is truncated
          # WITHOUT an error — the model then answers a clipped instruction set.
          OLLAMA_CONTEXT_LENGTH=32768 OLLAMA_KEEP_ALIVE=360m \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Ollama ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Ollama did not answer on :11434" >&2
          cat "$RUNNER_TEMP/ollama.log" >&2
          exit 1

      - name: Pull the model and warm it up
        run: |
          for attempt in 1 2 3 4; do
            if ollama pull qwen2.5:7b-instruct-q4_K_M; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "ERROR: model pull exhausted retries" >&2
              exit 1
            fi
            echo "pull failed on attempt $attempt; retrying in 10s..."
            sleep 10
          done
          printf 'FROM qwen2.5:7b-instruct-q4_K_M\nPARAMETER num_thread 4\nPARAMETER num_ctx 32768\n' \
            > "$RUNNER_TEMP/Modelfile"
          ollama create "$PIERRE_LLM_MODEL" -f "$RUNNER_TEMP/Modelfile"
          ollama list
          reply="$(curl -fsS -X POST http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$PIERRE_LLM_MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: PONG\"}]}")"
          echo "$reply"
          # The endpoint answers; what it says is the corpus's verdict to give.
          test -n "$(echo "$reply" | jq -er '.choices[0].message.content | select(length > 0)')"

      # A prefix this user owns, and after Ollama on purpose: its installer
      # re-creates /usr/local/bin as root:root 755, which turns a later
      # `npm install -g` there into EACCES.
      - name: Install the pinned Copilot CLI
        run: |
          set -euo pipefail
          PREFIX="$HOME/.copilot-cli"
          npm install -g --prefix "$PREFIX" "@github/copilot-linux-x64@${{ steps.pin.outputs.version }}"
          ln -sf "$PREFIX/bin/copilot-linux-x64" "$PREFIX/bin/copilot"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/copilot" --version

      # The gate is the exit status, then a marker. With LIVE_INCIDENT_EVAL
      # unset the test prints "skipping" and PASSES, and a filter that matched
      # nothing passes too — so a green run must also show the corpus summary.
      - name: Run the incident corpus
        run: |
          log="$RUNNER_TEMP/incident-corpus.log"
          status=0
          # tee, not a redirect: a run killed by the job's wall clock must still
          # show which turn it died on. pipefail keeps cargo's status, not tee's.
          set -o pipefail
          cargo test --test live_incident_eval_test -- --nocapture 2>&1 | tee "$log" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::the incident corpus failed (exit $status)" >&2; exit 1; }
          grep -q '=== live incident corpus: ' "$log" || { echo "::error::the corpus never ran — no summary line" >&2; exit 1; }

      - name: Ollama log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/ollama.log" || true
