# ABOUTME: Maestro E2E tests for Android via Expo Go on Android Emulator
# ABOUTME: Builds Pierre server for Linux, boots emulator, runs Maestro test suites
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "CI: Mobile E2E (Android)"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'frontend-mobile/**'
      # Only the shared packages frontend-mobile depends on. `packages/**` would put
      # a macOS runner (billed at 10x) on every push to mcp-types, scene-types or the
      # eslint/tsconfig configs, which the app does not consume.
      - 'packages/api-client/**'
      - 'packages/chat-utils/**'
      - 'packages/domain-utils/**'
      - 'packages/i18n/**'
      - 'packages/shared-constants/**'
      - 'packages/shared-types/**'
      - 'packages/ui-logic/**'
      - 'scripts/ci/mobile-e2e-batch.sh'
      # The scraper double and its control API the Home sync and onboarding
      # group flows script, and the seeder behind the verdict-sheet flow.
      - 'frontend/e2e-real/sciotte-double.ts'
      - 'frontend/e2e-real/home-sync-control.ts'
      - 'frontend/e2e-real/onboarding-coach.ts'
      - 'crates/pierre-seeders/src/verdict_conversation.rs'
      - '.github/workflows/mobile-e2e-android.yml'
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC nightly (02:00 EDT / 01:00 EST)
  workflow_dispatch:

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. Without the
  # sha this lane would lose verdicts the moment it gained a push trigger: a burst
  # of mobile pushes would cancel each other's e2e run (carnet#169 on ci-postgres).
  # `github.event_name` is in the group for the mirror-image reason: a scheduled or
  # dispatched run on main carries the TIP's sha, so without it the 06:00 cron joins
  # the tip's push-run group and kills that verdict mid-flight (ci-backend.yml records
  # the same collision on 2026-08-31).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  build-server:
    name: Build Server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      # Restored on every run, saved only by the nightly scheduled run on main
      # (see .github/actions/rust-setup for why a cache is saved once a day).
      # integration-tests.yml restores the Linux entry: it runs the same build.
      - name: Restore Rust build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-server-1.99.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mobile-server-1.99.1-
            ${{ runner.os }}-cargo-

      - name: Build Pierre server (release)
        run: cargo build --release
        env:
          CARGO_INCREMENTAL: 0

      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-server-1.99.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: pierre-server-linux
          path: |
            target/release/pierre-mcp-server
            target/release/pierre-cli
          retention-days: 1

  e2e-tests:
    name: Maestro E2E
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The "Run Maestro tests on Android" step's timeout-minutes, read there and by
      # the e2e script, whose lane deadline it is the budget of.
      E2E_STEP_TIMEOUT_MINUTES: "90"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: pierre-server-linux
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install shared-types dependencies
        working-directory: packages/shared-types
        run: bun install

      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install

      - name: Remove expo-dev-client for E2E build
        working-directory: frontend-mobile
        run: |
          # Remove expo-dev-client from package.json BEFORE install
          # This package interferes with Maestro testing - its native code
          # tries to connect to a dev server that doesn't exist in CI
          cat package.json | jq 'del(.dependencies["expo-dev-client"])' > package.json.tmp
          mv package.json.tmp package.json

      - name: Install mobile dependencies
        working-directory: frontend-mobile
        run: bun install

      - name: Strip Expo owner for CI
        working-directory: frontend-mobile
        run: |
          # Remove owner and eas config to avoid "Input is required" auth error in CI.
          # runtimeVersion goes too: its fingerprint policy makes Metro hash the
          # native sources on every manifest request, 16-60 s on the iOS lane's
          # runner against Expo Go's 60 s manifest timeout (carnet#869; that
          # lane's strip step says more). Expo Go checks compatibility by sdkVersion.
          node << 'STRIP_EOF'
          const fs = require('fs');
          const config = require('./app.config.js');
          delete config.owner;
          if (config.extra) delete config.extra.eas;
          delete config.runtimeVersion;
          for (const platform of ['ios', 'android']) {
            if (config[platform]) delete config[platform].runtimeVersion;
          }
          const header = '// ABOUTME: Expo configuration for Pierre mobile app\n// ABOUTME: Uses Expo Go for development; CI-stripped owner, eas and runtimeVersion\n\n';
          fs.writeFileSync('app.config.js', header + 'module.exports = ' + JSON.stringify(config, null, 2) + ';\n');
          STRIP_EOF
          echo "=== app.config.js (stripped owner, eas, runtimeVersion) ==="
          if grep -nE '"(owner|eas|projectId|runtimeVersion)"' app.config.js; then
            echo "ERROR: a stripped field is still in app.config.js"
            exit 1
          fi
          # The check above also passes on a file that holds no config at all,
          # so the stripped config must still carry the app's slug.
          grep -q '"slug"' app.config.js || { echo "ERROR: the stripped app.config.js has no slug"; exit 1; }
          echo "owner, eas and runtimeVersion removed"

      - name: Install Maestro CLI
        # `curl | bash` returns bash's status, so a curl that timed out handed
        # bash an empty script and this step reported success with no binary
        # installed; the lane then failed twenty minutes later with
        # "~/.maestro/bin/maestro: No such file or directory" (run 35615051309,
        # both attempts). pipefail surfaces curl's status, and running the
        # binary is the success marker — an install that produced nothing
        # runnable fails here, not in the smoke test.
        #
        # Pinned: the installer takes MAESTRO_VERSION and otherwise fetches
        # whatever released last, so a Maestro release could change this
        # lane's verdict with no commit here. The iOS lane pins the same
        # version; move both together, after a local run on it.
        env:
          MAESTRO_VERSION: "2.10.0"
        run: |
          set -o pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $MAESTRO_VERSION was asked for and $installed was installed"
            exit 1
          fi
          echo "Maestro $installed"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Free disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Create data directory
        run: mkdir -p data

      - name: Start Pierre server
        run: |
          ./target/release/pierre-mcp-server > /tmp/pierre-server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/health > /dev/null; then
              echo "Server is healthy!"
              break
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-android-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          RUST_LOG: "info"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8081/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          # No chain configured: the default Gemini head records this model on a
          # new conversation, and nothing behind it is required at boot.
          PIERRE_LLM_DEFAULT_MODEL: "ci-test-model"
          # home-sync/01 connects the Maestro athlete's Strava through a
          # scripted stand-in for the sciotte scraper on this port.
          DRAVR_SCIOTTE_REMOTE_URL: "http://127.0.0.1:8097"
          # The route request's own bound, shortened as the web e2e-real lane does.
          PIERRE_HOME_ROUTE_ANSWER_SECS: "5"
          # The app signs in on the hosted login page and returns to
          # exp://<host>:8082/--/auth/callback inside Expo Go, an address the
          # server sends dravr-mobile's code to only with this set (carnet#787).
          OAUTH_ALLOW_EXPO_GO_REDIRECT: "true"

      - name: Seed test user for Maestro tests
        run: |
          ./target/release/pierre-cli user create --email mobiletest@pierre.dev --password MobileTest1234 --force
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-android-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "warn"

      # chat/11 opens the verdict sheet of a reply the claim verifier judged.
      # This stack has no model to run a turn, so the reply and its verdict are
      # seeded: one supported verdict whose study is a DOI.
      - name: Seed the verdict conversation for Maestro tests
        run: |
          ./target/release/pierre-cli user create --email verdicttest@pierre.dev --password VerdictTest1234 --force
          ./target/release/pierre-cli seed verdict-conversation --email verdicttest@pierre.dev --model ci-test-model
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-android-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "warn"

      - name: Checkout dravr-contremaitre for coach seed source
        uses: actions/checkout@v6
        with:
          repository: dravr-ai/dravr-contremaitre
          token: ${{ secrets.DRAVR_CONTREMAITRE_WRITE_TOKEN }}
          path: contremaitre

      - name: Seed system agents for Maestro tests
        run: |
          ./target/release/pierre-cli seed agents \
            --agents-dir "${{ github.workspace }}/contremaitre/prompts/agents"
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-android-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "info"

      # home-sync/01 scripts the scraper through this process: it runs the
      # sciotte double on 8097 and a control API on 8098 that the flow's
      # runScript steps call from the host, and it writes a past sync time
      # into the server's database, so it is given that file. onboarding/02
      # asks it for fresh coaches, approved by the seeded tester (an admin)
      # and connected through the same double.
      - name: Start the scraper double for the Home sync and onboarding flows
        working-directory: frontend
        run: |
          nohup bun e2e-real/home-sync-control.ts > /tmp/home-sync-control.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8098/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8098/health
        env:
          PIERRE_URL: "http://127.0.0.1:8081"
          SCIOTTE_DOUBLE_PORT: "8097"
          SCIOTTE_CONTROL_PORT: "8098"
          E2E_REAL_DATABASE_PATH: "${{ github.workspace }}/data/maestro-android-test.db"
          HOME_SYNC_EMAIL: "mobiletest@pierre.dev"
          HOME_SYNC_PASSWORD: "MobileTest1234"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create Android E2E test script
        run: |
          cat > /tmp/run-android-e2e.sh << 'SCRIPT_EOF'
          #!/bin/bash
          # No set -e: errors are handled explicitly throughout the script.
          # set -e caused silent failures in grep/test loops and Maestro commands.
          cd frontend-mobile || exit 1

          # The emulator's ANRs and crashes: its crash buffer whole, plus the
          # am_anr/am_crash records of its events buffer, uploaded as
          # /tmp/android-crash.txt. The signal lines also go to the step summary,
          # so an ANR behind a stalled launch shows on the run page (carnet#356).
          capture_emulator_crashes() {
            {
              echo "=== crash buffer ==="
              adb logcat -d -b crash 2>&1
              echo "=== ANR and crash events ==="
              adb logcat -d -b events 2>&1 | grep -E 'am_anr|am_crash'
            } > /tmp/android-crash.txt
            {
              echo ""
              echo "### Emulator ANRs and crashes"
              if grep -qE 'am_anr|am_crash|FATAL' /tmp/android-crash.txt; then
                echo '```'
                grep -E 'am_anr|am_crash|FATAL' /tmp/android-crash.txt | head -n 50
                echo '```'
              else
                echo "None in the emulator's crash and events buffers."
              fi
            } >> /tmp/android-summary.txt
          }

          # Every exit goes through here: the crash lines first, while the
          # emulator still answers, then Metro and every child it started, then
          # the emulator itself so emulator-runner's cleanup does not hang on a
          # graceful shutdown.
          teardown() {
            capture_emulator_crashes
            echo "Killing Metro (PID $METRO_PID) and child processes..."
            kill "$METRO_PID" 2>/dev/null || true
            pkill -f "expo start" 2>/dev/null || true
            pkill -f "node.*metro" 2>/dev/null || true
            wait "$METRO_PID" 2>/dev/null || true
            adb emu kill 2>/dev/null || true
            sleep 2
            exit "$1"
          }

          # The flows' time. This step is capped at E2E_STEP_TIMEOUT_MINUTES (its
          # timeout-minutes, emulator boot included, which is why the clock starts in
          # the step before it). A step that reaches its cap is killed mid-flow and
          # leaves no summary (run 37779337862), so every batch below gets a deadline
          # 5 minutes short of it: no attempt runs past it and the teardown still
          # writes the report.
          if [ -z "${E2E_STEP_STARTED_AT:-}" ]; then
            echo "E2E_STEP_STARTED_AT is not set: the step clock did not run."
            teardown 1
          fi
          if [ -z "${E2E_STEP_TIMEOUT_MINUTES:-}" ]; then
            echo "E2E_STEP_TIMEOUT_MINUTES is not set: the lane deadline has no budget."
            teardown 1
          fi
          TEARDOWN_MINUTES=5
          LANE_DEADLINE=$((E2E_STEP_STARTED_AT + (E2E_STEP_TIMEOUT_MINUTES - TEARDOWN_MINUTES) * 60))
          # Each attempt's cap (carnet#842). Passing flows took 40 s to 4 min on the
          # runs it was sized on, the slowest 6m08s (chat/11, run 37930699791); a
          # stalled launch sat 21m34s to 25m01s in "Waiting for flows to complete..."
          # before Expo Go asked Metro for the bundle (runs 37779337862, 37930699791,
          # 37865399439). 10 minutes clears every pass by 1.6x and stops a stall in
          # under half its time; the runner then resets the app and retries.
          ATTEMPT_TIMEOUT=600

          # The crash and events buffers are fixed-size rings that a run this long
          # can wrap before the teardown reads them.
          adb logcat -b crash -b events -G 16M || echo "Could not enlarge the emulator's crash/events log buffers."

          npx expo start --go --android --port 8082 2>&1 | tee /tmp/metro-android.log &
          METRO_PID=$!
          echo "Waiting for Metro bundler to be ready..."
          for i in $(seq 1 90); do
            if curl -s http://localhost:8082 > /dev/null 2>&1; then
              echo "Metro is ready!"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Metro failed to start within timeout!"
              teardown 1
            fi
            echo "Attempt $i: Metro not ready yet..."
            sleep 2
          done
          # Wait for Expo Go to install and load the initial bundle.
          # The Android emulator is slower than iOS simulator; give extra time
          # for the JS bundle to compile and the app to render.
          echo "Waiting for JS bundle to compile..."
          for i in $(seq 1 120); do
            if grep -q "Bundled" /tmp/metro-android.log 2>/dev/null; then
              echo "Bundle compiled! (waited ~$((i*2))s)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "WARNING: Bundle compilation not detected after 240s, continuing..."
            fi
            sleep 2
          done
          sleep 15

          MAESTRO="$HOME/.maestro/bin/maestro"
          echo "=== Maestro version ==="
          $MAESTRO --version || true

          # Run smoke test first to verify connectivity. It goes through the shared
          # runner like the iOS smoke, under the same cap and deadline: run
          # 37779337862's smoke was a direct maestro call and stalled 23m26s, which
          # no cap on the flows below could have stopped. Two attempts, because a
          # capped stall without a retry would fail the lane where today it passes.
          echo ""
          echo "=== Smoke test: login screen ==="
          SMOKE_RC=0
          ../scripts/ci/mobile-e2e-batch.sh run --platform android --maestro "$MAESTRO" \
            --label "smoke" --attempts 2 \
            --attempt-timeout "$ATTEMPT_TIMEOUT" --deadline "$LANE_DEADLINE" \
            --output maestro-smoke-android.xml --summary /tmp/maestro-smoke-android.env \
            -- .maestro/login/01-show-login-screen.yaml || SMOKE_RC=$?
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "SMOKE TEST FAILED (runner rc=$SMOKE_RC) - Maestro cannot interact with the app on Android."
            echo "## Android E2E: the smoke test failed (runner rc=$SMOKE_RC), no flow was run" >> /tmp/android-summary.txt
            echo "=== Metro log (last 30 lines) ==="
            tail -30 /tmp/metro-android.log 2>/dev/null || true
            teardown 1
          fi
          echo "Smoke test PASSED."

          MAESTRO_EXIT=0

          # Every trigger runs the critical subset (decided 2026-09-05). The mode this
          # replaces ran one flow on a scheduled main run — a rendered login screen was
          # the whole nightly verdict — so the smoke branch is gone with it. The
          # connectivity smoke above still runs first and still aborts the job.
          #
          # Flows measured passing on an Android emulator against the tree as checked in
          # (Pixel 6 / API 33 and Pixel 7 / API 35, 2026-09-05), one per area. Two rules
          # decided the list, and both matter more than the count:
          #   - a flow asserting English copy is excluded: the chrome defaults to fr, so
          #     it fails on every platform until it asserts by test id;
          #   - a flow whose assertions sit inside `runFlow: when: visible:` guards is
          #     excluded, because it goes green by skipping its own body. discover/01 is
          #     out for that reason: its edit-sheet assertions need an installed coach.
          # settings/06 earns its place only weakly — it is notVisible-only, so it would
          # also pass on a blank screen; it stays as the settings smoke until a positive
          # settings assertion exists that does not depend on English copy.
          # chat/04-send-message-response is absent for a different reason: it sends a
          # message and waits for `messages-list`, which MessageList only mounts once a
          # message exists or a send is in flight. CI sets PIERRE_LLM_DEFAULT_MODEL=ci-test-model
          # with no provider behind it, so a turn the server cannot complete leaves the
          # empty state. It passed locally only because that stack has a live LLM. The
          # server log is now uploaded on failure so the next look can confirm this
          # rather than infer it.
          # visual/01-authentication was deleted (Boreal v2.2 Phase 6): its render checks
          # are now covered by visual/00-capture.yaml, and its behavioral assertion lives
          # in login/07-invalid-credentials.yaml — wrong credentials keep the athlete on
          # the login screen. The password is typed on the server's hosted page now
          # (carnet#787), so login/02 opens that page and closes it, login/06 signs in
          # on it and login/07 is refused by it.
          echo "Running critical-path subset with per-test retry..."
          # home-sync/01 runs last: it connects the shared Maestro athlete's Strava
          # through the scraper double, and each of its attempts resets that
          # athlete's activity state before it starts. Its copy assertions accept
          # English and French, so the chrome's language does not decide it.
          # chat/11 reads the seeded verdict conversation (carnet#802) and
          # onboarding/02 signs in as fresh coaches from the control process
          # (carnet#740); both assert copy in English or French only, and
          # onboarding/02 clears Chrome's session when it ends, so the flows after
          # it sign the seeded tester in on the page, not as its last coach.
          CRITICAL_TESTS="login/01-show-login-screen.yaml login/02-hosted-sign-in-page.yaml login/06-successful-login.yaml login/07-invalid-credentials.yaml settings/06-hallucinated-stats.yaml chat/01-basic-visibility.yaml chat/11-verdict-sheet.yaml store/04-search-functionality.yaml store/10-pull-to-refresh.yaml voice-input/01-button-visibility.yaml onboarding/02-coach-group-step.yaml home-sync/01-sync-failed-retry-lands-rides-and-map.yaml"

          # The list is unconditional now, so an empty one means someone edited it to
          # nothing — which under the guard below would silently report a green run of
          # zero flows, exactly the smoke behaviour this lane just deleted.
          if [ -z "$CRITICAL_TESTS" ]; then
            echo "CRITICAL_TESTS is empty — refusing to report a run of zero flows."
            teardown 1
          fi

          if [ -n "$CRITICAL_TESTS" ]; then
            # Critical mode: run each test individually, up to three attempts.
            # The attempts are the shared runner's (scripts/ci/mobile-e2e-batch.sh):
            # between attempts it force-stops Expo Go, confirms Metro still
            # answers /status and relaunches through the deep link, and it stops
            # the lane (exit 2) when Metro is gone instead of burning two more
            # 120 s login waits against a dead bundler. The iOS lane shares it;
            # the retry-without-reset it replaces is carnet#443. Each attempt is
            # capped at ATTEMPT_TIMEOUT and the batch at LANE_DEADLINE; a batch
            # the deadline stopped exits 3 and the flows after it are not run.
            TOTAL_FAILURES=0
            TOTAL_PASSED=0
            TEST_NUM=0
            METRO_DEAD=false
            OUT_OF_TIME=false
            echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > maestro-results-android.xml
            MAX_ATTEMPTS=3
            for TEST in $CRITICAL_TESTS; do
              TEST_NUM=$((TEST_NUM + 1))
              echo ""
              echo "=== Test $TEST_NUM: $TEST ==="
              RESULT_FILE="maestro-android-test${TEST_NUM}.xml"
              TEST_RC=0
              ../scripts/ci/mobile-e2e-batch.sh run --platform android --maestro "$MAESTRO" \
                --label "$TEST" --attempts "$MAX_ATTEMPTS" \
                --attempt-timeout "$ATTEMPT_TIMEOUT" --deadline "$LANE_DEADLINE" \
                --output "$RESULT_FILE" --summary "/tmp/maestro-android-test${TEST_NUM}.env" \
                -- ".maestro/$TEST" || TEST_RC=$?
              if [ "$TEST_RC" -eq 0 ]; then
                TOTAL_PASSED=$((TOTAL_PASSED + 1))
              else
                echo "FAILED (runner rc=$TEST_RC): $TEST"
                TOTAL_FAILURES=$((TOTAL_FAILURES + 1))
                echo "::warning::Android E2E FAILED (runner rc=$TEST_RC): $TEST"
                echo "=== Failure XML ==="
                cat "$RESULT_FILE" 2>/dev/null || echo "No result file"
              fi
              sed -n '/<testsuite/,/<\/testsuite>/p' "$RESULT_FILE" >> maestro-results-android.xml 2>/dev/null || true
              if [ "$TEST_RC" -eq 2 ]; then
                echo "FAIL-FAST: Metro died during $TEST — the remaining flows cannot run."
                METRO_DEAD=true
                break
              fi
              if [ "$TEST_RC" -eq 3 ]; then
                echo "OUT OF TIME: the lane deadline passed during $TEST — the remaining flows are not run."
                OUT_OF_TIME=true
                break
              fi
            done
            echo '</testsuites>' >> maestro-results-android.xml

            echo ""
            echo "Total: $TOTAL_PASSED passed, $TOTAL_FAILURES failed out of $TEST_NUM tests"

            # Write summary
            echo "## Android E2E Test Results (critical mode)" >> /tmp/android-summary.txt
            echo "- Total: $TEST_NUM" >> /tmp/android-summary.txt
            echo "- Passed: $TOTAL_PASSED" >> /tmp/android-summary.txt
            echo "- Failed: $TOTAL_FAILURES" >> /tmp/android-summary.txt
            # A stall the cap cut short is otherwise invisible once its retry
            # passed; counting them shows how often launches still stall.
            CAPPED_ATTEMPTS=$(grep -l 'was stopped before recording a result' maestro-attempts/*.xml 2>/dev/null | wc -l | tr -d ' ')
            echo "- Attempts stopped by the ${ATTEMPT_TIMEOUT}s cap or the deadline: $CAPPED_ATTEMPTS" >> /tmp/android-summary.txt
            if [ "$METRO_DEAD" = "true" ]; then
              echo "- Metro died mid-run: the flows after test $TEST_NUM were not run" >> /tmp/android-summary.txt
            fi
            if [ "$OUT_OF_TIME" = "true" ]; then
              FLOW_COUNT=$(wc -w <<< "$CRITICAL_TESTS" | tr -d ' ')
              echo "- The lane deadline passed during test $TEST_NUM of $FLOW_COUNT: the $((FLOW_COUNT - TEST_NUM)) flows after it were not run" >> /tmp/android-summary.txt
            fi
            if [ "$TOTAL_FAILURES" -gt 0 ]; then
              echo "### Failed Tests" >> /tmp/android-summary.txt
              for f in maestro-android-test*.xml; do
                grep '<failure' "$f" -B1 2>/dev/null | grep 'testcase name' | \
                  sed 's/.*name="\([^"]*\)".*/- \1/' >> /tmp/android-summary.txt 2>/dev/null || true
              done
              echo "" >> /tmp/android-summary.txt
              echo "### Failure Details" >> /tmp/android-summary.txt
              echo '```' >> /tmp/android-summary.txt
              for f in maestro-android-test*.xml; do
                if grep -q '<failure' "$f" 2>/dev/null; then
                  echo "--- $(basename $f) ---" >> /tmp/android-summary.txt
                  cat "$f" >> /tmp/android-summary.txt 2>/dev/null || true
                fi
              done
              echo '```' >> /tmp/android-summary.txt
              MAESTRO_EXIT=1
            fi
          fi

          teardown "$MAESTRO_EXIT"
          SCRIPT_EOF
          chmod +x /tmp/run-android-e2e.sh

      # Best-effort pre-fetch of the emulator system image with retry. The
      # android-emulator-runner downloads it itself with NO retry, so a single
      # truncated/corrupt CDN fetch ("Error on ZipFile unknown archive") aborts
      # the whole nightly (seen 2026-07-09; the run is otherwise green ~7/8). By
      # fetching here first — retrying and clearing partial downloads on a bad
      # fetch — a transient hiccup self-recovers and the action then finds the
      # package already installed. This step NEVER fails the job: if it cannot
      # help (tool missing, or 3 corrupt fetches), it exits 0 and hands off to the
      # emulator-runner exactly as before, so there is zero regression risk.
      - name: Pre-fetch emulator system image (best-effort, retries transient CDN corruption)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found at $SDKMANAGER — leaving the install to the emulator-runner"
            exit 0
          fi
          PACKAGES="system-images;android-34;google_apis;x86_64 platform-tools emulator"
          for attempt in 1 2 3; do
            echo "sdkmanager pre-fetch attempt ${attempt}/3 (free: $(df -h / | awk 'NR==2{print $4}'))"
            if yes | "$SDKMANAGER" --install $PACKAGES; then
              echo "system image + tools pre-installed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::sdkmanager pre-fetch failed on attempt ${attempt} (transient CDN?) — clearing partial downloads and retrying"
            rm -rf "$SDK/system-images" "$SDK/.temp" "$SDK/.downloadIntermediates" 2>/dev/null || true
            sleep 10
          done
          echo "::warning::pre-fetch did not succeed after 3 attempts — the emulator-runner will attempt its own install"
          exit 0

      # The e2e script's deadline is measured from here, so the emulator boot
      # inside the next step is spent from the same E2E_STEP_TIMEOUT_MINUTES as
      # the flows.
      - name: Start the Maestro step clock
        run: echo "E2E_STEP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Maestro tests on Android
        # 45 was sized for the one-flow smoke. A critical run is 12 flows, each with up
        # to 3 attempts, after an emulator boot and a cold Metro bundle; the job cap is
        # 120, so this leaves headroom for the diagnostics and upload steps after it.
        # No fixed per-attempt cap fits 12 x 3 attempts in here: the 10-minute cap,
        # which clears the slowest pass (6 min), makes that worst case 6 hours. A
        # clean run takes ~35 min (run 37946857392: 34); a capped stall adds ~11 (the
        # 10-minute cap and a reset before its retry) where an uncapped one added
        # 20+, so four fit inside the deadline where two fitted before. Past that,
        # the script's deadline, budgeted from this same E2E_STEP_TIMEOUT_MINUTES,
        # ends the lane with its summary written instead of this cap killing it
        # mid-flow.
        timeout-minutes: ${{ fromJSON(env.E2E_STEP_TIMEOUT_MINUTES) }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: maestro_test_emulator
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          emulator-boot-timeout: 600
          disk-size: 6144M
          script: bash /tmp/run-android-e2e.sh
        env:
          CI: "true"
          EXPO_PUBLIC_API_URL: "http://10.0.2.2:8081"
          TEST_EMAIL: "mobiletest@pierre.dev"
          TEST_PASSWORD: "MobileTest1234"
          BACKEND_URL: "http://10.0.2.2:8081"

      - name: Post Android test summary
        if: always()
        run: |
          if [ -f /tmp/android-summary.txt ]; then
            cat /tmp/android-summary.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-test-results-android
          path: |
            frontend-mobile/maestro-results*.xml
            frontend-mobile/maestro-android-test*.xml
            frontend-mobile/maestro-attempts/
            frontend-mobile/.maestro/
            /tmp/android-crash.txt
            /tmp/pierre-server.log
            /tmp/home-sync-control.log
            /tmp/android-summary.txt
            /home/runner/.maestro/tests/
          retention-days: 1
