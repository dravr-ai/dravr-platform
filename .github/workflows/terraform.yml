# ABOUTME: Automates Terraform plan/apply for infra/environments/dev and infra/environments/prod
# ABOUTME: Plans auto-run on main push (surfaced via job summary); applies are manual workflow_dispatch-gated

name: "Infra: Terraform"

# Plans run automatically on push to main when infra paths change (dev only).
# Applies NEVER run on push — trigger them manually via "Run workflow"
# (workflow_dispatch: environment=dev|prod, action=apply).
on:
  # No pull_request trigger: this repo uses local squash merges with no PRs.
  # Push is the auto-plan mechanism below.
  push:
    branches: [main]
    paths:
      - 'infra/environments/**'
      - 'infra/modules/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: 'Terraform action'
        type: choice
        options: [plan, apply]
        required: true

permissions:
  contents: read
  id-token: write

# One Terraform run at a time. Every job here shares a single GCS-backed state,
# and its lock is advisory-but-exclusive: a concurrent operation loses. On
# 2026-08-05 a push-plan and a workflow_dispatch apply started 5 seconds apart
# on the same commit (runs 31017901186 and 31017908804) — the plan failed and
# the dispatch passed, identical code, which reads as a flaky infra check and
# is really state contention.
#
# cancel-in-progress is deliberately FALSE, unlike every other workflow in this
# repo: cancelling a running `terraform apply` can leave real infrastructure
# half-created with the state file not yet written back. Queue instead.
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Plan dev — runs on push to main or workflow_dispatch(env=dev, action=plan).
  # Plans surface via a condensed job summary (action lines only — public repo).
  # ---------------------------------------------------------------------------
  plan-dev:
    name: Plan Dev
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'dev' &&
       github.event.inputs.action == 'plan')

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-dev"

      - name: Terraform Plan
        id: plan
        # Redirect (not pipe) so the step outcome is terraform's own exit — the
        # setup-terraform wrapper + pipe combination false-greened a live diff
        # in the drift monitor; same hardening as terraform-drift.yml.
        run: terraform plan -var-file="terraform.tfvars" -no-color -out=tfplan > plan-output.txt 2>&1
        continue-on-error: true

      - name: Write plan summary to job summary
        if: always()
        # Public repo: never publish raw plan text (any attribute Terraform
        # doesn't mark sensitive would leak). Success → resource action lines +
        # the Plan:/No changes line; failure → the error tail only.
        run: |
          {
            echo '## Terraform Plan — dev'
            echo '```'
            if [ "${{ steps.plan.outcome }}" = "success" ]; then
              grep -E '^(Plan:|No changes)|^  # ' plan-output.txt || echo '(no resource change lines found)'
            else
              echo 'PLAN FAILED — last 40 lines:'
              tail -n 40 plan-output.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        # Echo the error tail to the LOG as well as the job summary. The plan is
        # redirected to a file so a false-green pipe can't hide a live diff, but
        # that also meant a failure was invisible to `gh run view --log-failed`
        # — diagnosing run 31017901186 needed the web UI. No new exposure: the
        # summary already publishes this same tail on failure.
        run: |
          echo "::error::terraform plan failed — last 40 lines:"
          tail -n 40 plan-output.txt
          exit 1

  # ---------------------------------------------------------------------------
  # Plan prod — workflow_dispatch(env=prod, action=plan) only.
  # Deliberately does NOT auto-plan on push: prod stays a manual gesture
  # (apply-prod is if:false scaffolding). Surfaces via the job summary too.
  # ---------------------------------------------------------------------------
  plan-prod:
    name: Plan Prod
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.action == 'plan'

    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (prod terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-prod"

      - name: Terraform Plan
        id: plan
        # Redirect (not pipe) so the step outcome is terraform's own exit — the
        # setup-terraform wrapper + pipe combination false-greened a live diff
        # in the drift monitor; same hardening as terraform-drift.yml.
        run: terraform plan -var-file="terraform.tfvars" -no-color -out=tfplan > plan-output.txt 2>&1
        continue-on-error: true

      - name: Write plan summary to job summary
        if: always()
        # Public repo: never publish raw plan text (any attribute Terraform
        # doesn't mark sensitive would leak). Success → resource action lines +
        # the Plan:/No changes line; failure → the error tail only.
        run: |
          {
            echo '## Terraform Plan — prod'
            echo '```'
            if [ "${{ steps.plan.outcome }}" = "success" ]; then
              grep -E '^(Plan:|No changes)|^  # ' plan-output.txt || echo '(no resource change lines found)'
            else
              echo 'PLAN FAILED — last 40 lines:'
              tail -n 40 plan-output.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        # Echo the error tail to the LOG as well as the job summary. The plan is
        # redirected to a file so a false-green pipe can't hide a live diff, but
        # that also meant a failure was invisible to `gh run view --log-failed`
        # — diagnosing run 31017901186 needed the web UI. No new exposure: the
        # summary already publishes this same tail on failure.
        run: |
          echo "::error::terraform plan failed — last 40 lines:"
          tail -n 40 plan-output.txt
          exit 1

  # ---------------------------------------------------------------------------
  # Apply dev — MANUAL ONLY: workflow_dispatch(env=dev, action=apply).
  # Never runs on push (push auto-plans only); apply is a deliberate gesture.
  # ---------------------------------------------------------------------------
  apply-dev:
    name: Apply Dev
    runs-on: ubuntu-latest
    # No `needs: plan-dev` — plan-dev runs on push/PR/`action=plan`,
    # so gating apply on it would block workflow_dispatch(action=apply) entirely.
    # Apply-dev runs its own `terraform init` and `terraform apply` below.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' &&
      github.event.inputs.action == 'apply'
    environment: development

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-dev"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

  # ---------------------------------------------------------------------------
  # Apply prod — MANUAL ONLY when enabled: workflow_dispatch(env=prod, action=apply).
  # Gated by required reviewers configured on the production GitHub Environment.
  # ---------------------------------------------------------------------------
  apply-prod:
    name: Apply Prod
    runs-on: ubuntu-latest
    needs: plan-prod
    # Production apply is disabled. To re-enable, replace the line below with:
    # if: >
    #   github.event_name == 'workflow_dispatch' &&
    #   github.event.inputs.environment == 'prod' &&
    #   github.event.inputs.action == 'apply'
    if: false
    environment: production

    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (prod terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-prod"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
