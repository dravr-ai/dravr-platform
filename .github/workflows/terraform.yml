# ABOUTME: Automates Terraform plan/apply for infra/environments/dev and infra/environments/prod
# ABOUTME: Plans auto-run on main push (surfaced via job summary); applies are manual workflow_dispatch-gated

name: "Infra: Terraform"

# Plans run automatically on push to main when infra paths change (dev only).
# Applies NEVER run on push — trigger them manually via "Run workflow"
# (workflow_dispatch: environment=dev|prod, action=apply).
on:
  # pull_request is intentionally left disabled: this repo uses local squash
  # merges with no PRs, so a PR-triggered plan/comment path is dead. Push is
  # the real auto-plan mechanism below.
  # pull_request:
  #   paths:
  #     - 'infra/environments/**'
  #     - 'infra/modules/**'
  push:
    branches: [main]
    paths:
      - 'infra/environments/**'
      - 'infra/modules/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: 'Terraform action'
        type: choice
        options: [plan, apply]
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Plan dev — runs on push to main, PR, or workflow_dispatch(env=dev, action=plan)
  # Push-triggered plans surface via the job summary (no PR to comment on).
  # ---------------------------------------------------------------------------
  plan-dev:
    name: Plan Dev
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'dev' &&
       github.event.inputs.action == 'plan')

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-dev"

      - name: Terraform Plan
        id: plan
        run: set -o pipefail && terraform plan -var-file="terraform.tfvars" -no-color -out=tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Write plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform Plan — dev'
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/environments/dev/plan-output.txt', 'utf8');
            const body = `## Terraform Plan — dev\n<details><summary>Show plan</summary>\n\n\`\`\`\n${planOutput}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Terraform Plan — dev')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Plan prod — runs on PR or workflow_dispatch(env=prod, action=plan).
  # Deliberately does NOT auto-plan on push: prod stays a manual gesture
  # (apply-prod is if:false scaffolding). Surfaces via the job summary too.
  # ---------------------------------------------------------------------------
  plan-prod:
    name: Plan Prod
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'prod' &&
       github.event.inputs.action == 'plan')

    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (prod terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-prod"

      - name: Terraform Plan
        id: plan
        run: set -o pipefail && terraform plan -var-file="terraform.tfvars" -no-color -out=tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Write plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform Plan — prod'
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/environments/prod/plan-output.txt', 'utf8');
            const body = `## Terraform Plan — prod\n<details><summary>Show plan</summary>\n\n\`\`\`\n${planOutput}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Terraform Plan — prod')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Apply dev — MANUAL ONLY: workflow_dispatch(env=dev, action=apply).
  # Never runs on push (push auto-plans only); apply is a deliberate gesture.
  # ---------------------------------------------------------------------------
  apply-dev:
    name: Apply Dev
    runs-on: ubuntu-latest
    # No `needs: plan-dev` — plan-dev runs on push/PR/`action=plan`,
    # so gating apply on it would block workflow_dispatch(action=apply) entirely.
    # Apply-dev runs its own `terraform init` and `terraform apply` below.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' &&
      github.event.inputs.action == 'apply'
    environment: development

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-dev"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

  # ---------------------------------------------------------------------------
  # Apply prod — MANUAL ONLY when enabled: workflow_dispatch(env=prod, action=apply).
  # Gated by required reviewers configured on the production GitHub Environment.
  # ---------------------------------------------------------------------------
  apply-prod:
    name: Apply Prod
    runs-on: ubuntu-latest
    needs: plan-prod
    # Production apply is disabled. To re-enable, replace the line below with:
    # if: >
    #   github.event_name == 'workflow_dispatch' &&
    #   github.event.inputs.environment == 'prod' &&
    #   github.event.inputs.action == 'apply'
    if: false
    environment: production

    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (prod terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-prod"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
