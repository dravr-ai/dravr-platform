# ABOUTME: Ad-hoc diagnostic workflow for reading Cloud Run service config from GitHub Actions
# ABOUTME: Temporary — kept only long enough to verify Terraform apply landed opus-4.7 env vars
name: "Diagnostic: Describe dev Cloud Run"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Describe backend service env
        run: |
          gcloud run services describe dravr-mcp-server-api \
            --region=northamerica-northeast1 \
            --project="$GOOGLE_CLOUD_PROJECT" \
            --format="value(spec.template.spec.containers[0].env)" \
            | tr ',' '\n' | grep -E "PIERRE_LLM_(MODEL|DEFAULT_MODEL|FALLBACK_MODEL|PROVIDER)"
          echo "---"
          gcloud run services describe dravr-mcp-server-api \
            --region=northamerica-northeast1 \
            --project="$GOOGLE_CLOUD_PROJECT" \
            --format="value(status.latestReadyRevisionName,status.latestCreatedRevisionName)"
