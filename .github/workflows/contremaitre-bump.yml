# ABOUTME: Auto-bump the dravr-contremaitre Cargo rev when contremaitre main moves
# ABOUTME: Triggered by repository_dispatch from contremaitre on push + hourly safety net
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Contremaitre: Bump Dependency"

on:
  repository_dispatch:
    types: [contremaitre-updated]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: contremaitre-bump
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump dravr-contremaitre rev to latest main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dravr-platform main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.120.0

      - name: Configure auth for private git deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve target contremaitre SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
        run: |
          # On a push dispatch the SHA rides in the payload; the scheduled /
          # manual safety-net resolves contremaitre main via the API instead.
          NEW_SHA="${{ github.event.client_payload.sha }}"
          if [ -z "${NEW_SHA}" ]; then
            NEW_SHA=$(gh api repos/dravr-ai/dravr-contremaitre/commits/main --jq .sha)
          fi
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump rev in Cargo manifests + lockfile
        id: bump
        run: |
          NEW_SHA="${{ steps.target.outputs.new_sha }}"

          # Auto-discover EVERY manifest that pins the dravr-contremaitre git
          # dep, rather than hardcoding the consumer list. A hardcoded list
          # repeatedly left pierre-chat-pipeline (the 3rd consumer) on the old
          # rev -> two dravr-contremaitre revs -> Security Audit duplicate
          # hard-fail on main. Discovery means a new consumer crate is bumped
          # automatically the moment it pins the dep.
          MANIFESTS=$(grep -rl 'dravr-contremaitre = { git' crates/ --include=Cargo.toml)
          if [ -z "${MANIFESTS}" ]; then
            echo "::error::no Cargo.toml pins dravr-contremaitre — workflow assumption broke"
            exit 1
          fi
          echo "Consumers pinning dravr-contremaitre:"
          echo "${MANIFESTS}"

          # Rewrite the rev on the dravr-contremaitre line in every consumer,
          # regardless of its current value (targeting the line, not a global
          # OLD_SHA->NEW_SHA swap, also converges any pre-existing drift), then
          # verify each discovered consumer actually landed on NEW_SHA. A
          # mismatch means a manifest's line shape escaped the sed — fail loudly
          # here rather than push a duplicate that reds the Security Audit on
          # main (the recurring pierre-chat-pipeline drift).
          for m in ${MANIFESTS}; do
            sed -i -E "s|(dravr-contremaitre = \{ git = \"[^\"]+\", rev = \")[a-f0-9]{7,40}\"|\1${NEW_SHA}\"|" "$m"
            REV=$(grep 'dravr-contremaitre = { git' "$m" | grep -oE 'rev = "[a-f0-9]+"' | grep -oE '[a-f0-9]{7,40}')
            if [ "${REV}" != "${NEW_SHA}" ]; then
              echo "::error::${m} pins dravr-contremaitre at ${REV:-<unparseable>} after bump, expected ${NEW_SHA} — refusing to push drift"
              exit 1
            fi
          done

          # No manifest changed (all consumers already at NEW_SHA) -> no-op.
          if git diff --quiet -- ${MANIFESTS}; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo update -p dravr-contremaitre
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync the in-tree contremaitre fallbacks to the bumped rev
        # The missing half of the bump. This lane moved the pin and nothing
        # else, while check-contremaitre-sync.sh demands an exact mirror of
        # contremaitre's evidence/ — so every corpus addition upstream red main
        # the moment the hourly cron fired. On 2026-09-04 Phil's PR #6 added 69
        # propositions and 43 seconds later this workflow pushed the pin without
        # them: main red, five sessions blocked mid-merge, three extra CI cycles
        # to recover (carnet#325). The sync belongs in the same commit as the
        # pin it follows, not in a human's hands afterwards.
        #
        # The same script mirrors contremaitre's training/ into the root
        # training_catalogue/ and regenerates the compiled-in table in
        # pierre-contremaitre (carnet#332) — one mechanism for both fallbacks,
        # so a catalogue change upstream cannot red main either.
        #
        # `cargo fetch` first because the sync reads the canonical trees from
        # the pinned checkout on disk rather than cloning contremaitre a second
        # time; `cargo update` above populates the git db but not the checkout.
        if: steps.bump.outputs.changed == 'true'
        run: |
          cargo fetch
          scripts/ci/sync-contremaitre-fallback.sh

      - name: Refuse to push a bump that breaks the coupling
        # Compile-free, ~2s, and gated on `changed` so the hourly no-op pays
        # nothing. Pushing first and validating afterwards is this lane's
        # design — GitHub suppresses workflow runs on GITHUB_TOKEN pushes, so
        # the dispatch below is necessarily after the fact. That is survivable
        # for a break CI finds in ten minutes; it is not survivable for one that
        # blocks every session's pre-push gate the instant it lands. Failing
        # HERE leaves main green and lets the hourly cron retry, so a genuine
        # upstream break stays loud without taking the branch down with it.
        if: steps.bump.outputs.changed == 'true'
        run: scripts/ci/check-contremaitre-sync.sh

      - name: Commit and push bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT_NEW=$(echo "${{ steps.target.outputs.new_sha }}" | cut -c1-8)
          # Re-discover and stage all consumer manifests + the lockfile, so the
          # commit carries every file the bump touched (no hardcoded list).
          # Stage the manifests, the lockfile, AND whatever the fallback sync
          # rewrote — the pin and the fallbacks it implies travel together or the
          # commit reintroduces the drift it was meant to close.
          git add $(grep -rl 'dravr-contremaitre = { git' crates/ --include=Cargo.toml) Cargo.lock \
                  crates/pierre-evals/fixtures/sports_science \
                  crates/pierre-services/src/claim_verification.rs \
                  training_catalogue \
                  crates/pierre-contremaitre/src/training_catalogue_embedded.rs
          CORPUS_NOTE=""
          if ! git diff --cached --quiet -- crates/pierre-evals/fixtures/sports_science training_catalogue; then
            CORPUS_NOTE=$(printf '\n\nSyncs the in-tree contremaitre fallbacks to match: %s, %s.' \
              "$(git diff --cached --numstat -- crates/pierre-evals/fixtures/sports_science | wc -l | tr -d ' ') proposition file(s) changed" \
              "$(git diff --cached --numstat -- training_catalogue | wc -l | tr -d ' ') training catalogue file(s) changed")
          fi
          git commit -m "chore(contremaitre): bump dravr-contremaitre rev to ${SHORT_NEW}${CORPUS_NOTE}"
          git push origin main

      - name: Validate the bump in CI
        # The push above uses the default GITHUB_TOKEN, and GitHub suppresses
        # workflow runs on GITHUB_TOKEN pushes — so the bump commit would land
        # unvalidated. Dispatch explicitly so every bump carries real coverage.
        # The PAT path was abandoned: DRAVR_PRIVATE_DEPS_TOKEN is read-only on
        # this repo.
        #
        # BOTH lanes, not just ci-backend. A bump touches Cargo.toml, Cargo.lock
        # and crates/**, which matches ci-postgres's push paths exactly — the
        # only reason it does not run is the suppressed push, the same reason
        # ci-backend is dispatched here. Dispatching one and not the other left
        # main's per-push verdict lane blind to every bump: 0927f04f8 moved a
        # pinned catalogue count, ci-backend caught it on dispatch, and the
        # PostgreSQL lane never saw that tree at all. Its last green on main was
        # 9f3ee5138, an ANCESTOR of the bump, so main read green while two
        # feature branches hit the failure first.
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci-backend.yml --ref main
          gh workflow run ci-postgres.yml --ref main

      - name: Run the messaging eval asserters on the bumped prompts
        # A bump lands new coach prompts. Dispatching the eval's Phase 0-3
        # asserters here surfaces a prompt regression within minutes instead of
        # waiting for its 04:00 UTC nightly — the same suppressed-run problem as
        # the step above, and gated on `changed` so the hourly no-op costs
        # nothing. `asserters_only` skips the live Slack round trip.
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run messaging-eval.yml --ref main -f asserters_only=true

      # No explicit deploy trigger. The bump refreshes the compiled-in prompt
      # SEED for the next regular deploy; runtime prompt freshness is handled by
      # the in-process poll (full_sync every CONTREMAITRE_POLL_INTERVAL_SECS) plus
      # the push webhook — both pull the latest from GitHub without a redeploy.

      - name: Report no-op
        if: steps.bump.outputs.changed == 'false'
        run: echo "dravr-contremaitre already at ${{ steps.target.outputs.new_sha }} — nothing to bump"
