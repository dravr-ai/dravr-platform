# ABOUTME: Auto-bump the dravr-contremaitre Cargo rev when contremaitre main moves
# ABOUTME: Triggered by repository_dispatch from contremaitre on push + hourly safety net
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Contremaitre: Bump Dependency"

on:
  repository_dispatch:
    types: [contremaitre-updated]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: contremaitre-bump
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump dravr-contremaitre rev to latest main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dravr-platform main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Configure auth for private git deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve target contremaitre SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
        run: |
          # On a push dispatch the SHA rides in the payload; the scheduled /
          # manual safety-net resolves contremaitre main via the API instead.
          NEW_SHA="${{ github.event.client_payload.sha }}"
          if [ -z "${NEW_SHA}" ]; then
            NEW_SHA=$(gh api repos/dravr-ai/dravr-contremaitre/commits/main --jq .sha)
          fi
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump rev in Cargo manifests + lockfile
        id: bump
        run: |
          NEW_SHA="${{ steps.target.outputs.new_sha }}"

          # Auto-discover EVERY manifest that pins the dravr-contremaitre git
          # dep, rather than hardcoding the consumer list. A hardcoded list
          # repeatedly left pierre-chat-pipeline (the 3rd consumer) on the old
          # rev -> two dravr-contremaitre revs -> Security Audit duplicate
          # hard-fail on main. Discovery means a new consumer crate is bumped
          # automatically the moment it pins the dep.
          MANIFESTS=$(grep -rl 'dravr-contremaitre = { git' crates/ --include=Cargo.toml)
          if [ -z "${MANIFESTS}" ]; then
            echo "::error::no Cargo.toml pins dravr-contremaitre — workflow assumption broke"
            exit 1
          fi
          echo "Consumers pinning dravr-contremaitre:"
          echo "${MANIFESTS}"

          # Rewrite the rev on the dravr-contremaitre line in every consumer,
          # regardless of its current value (targeting the line, not a global
          # OLD_SHA->NEW_SHA swap, also converges any pre-existing drift), then
          # verify each discovered consumer actually landed on NEW_SHA. A
          # mismatch means a manifest's line shape escaped the sed — fail loudly
          # here rather than push a duplicate that reds the Security Audit on
          # main (the recurring pierre-chat-pipeline drift).
          for m in ${MANIFESTS}; do
            sed -i -E "s|(dravr-contremaitre = \{ git = \"[^\"]+\", rev = \")[a-f0-9]{7,40}\"|\1${NEW_SHA}\"|" "$m"
            REV=$(grep 'dravr-contremaitre = { git' "$m" | grep -oE 'rev = "[a-f0-9]+"' | grep -oE '[a-f0-9]{7,40}')
            if [ "${REV}" != "${NEW_SHA}" ]; then
              echo "::error::${m} pins dravr-contremaitre at ${REV:-<unparseable>} after bump, expected ${NEW_SHA} — refusing to push drift"
              exit 1
            fi
          done

          # No manifest changed (all consumers already at NEW_SHA) -> no-op.
          if git diff --quiet -- ${MANIFESTS}; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo update -p dravr-contremaitre
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT_NEW=$(echo "${{ steps.target.outputs.new_sha }}" | cut -c1-8)
          # Re-discover and stage all consumer manifests + the lockfile, so the
          # commit carries every file the bump touched (no hardcoded list).
          git add $(grep -rl 'dravr-contremaitre = { git' crates/ --include=Cargo.toml) Cargo.lock
          git commit -m "chore(contremaitre): bump dravr-contremaitre rev to ${SHORT_NEW}"
          git push origin main

      - name: Validate the bump in CI
        # The push above uses the default GITHUB_TOKEN, and GitHub suppresses
        # workflow runs on GITHUB_TOKEN pushes — so the bump commit would land
        # unvalidated. Dispatch ci-backend explicitly (clippy + doc-tests +
        # backend-test shards) so every bump carries real coverage. The PAT
        # path was abandoned: DRAVR_PRIVATE_DEPS_TOKEN is read-only on this repo.
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci-backend.yml --ref main

      # No explicit deploy trigger. The bump refreshes the compiled-in prompt
      # SEED for the next regular deploy; runtime prompt freshness is handled by
      # the in-process poll (full_sync every CONTREMAITRE_POLL_INTERVAL_SECS) plus
      # the push webhook — both pull the latest from GitHub without a redeploy.

      - name: Report no-op
        if: steps.bump.outputs.changed == 'false'
        run: echo "dravr-contremaitre already at ${{ steps.target.outputs.new_sha }} — nothing to bump"
