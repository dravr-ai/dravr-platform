# ABOUTME: The one writer of the dravr-contremaitre pin: moves the rev, Cargo.lock and the string copy
# ABOUTME: Polls contremaitre main every ten minutes; runs the client unit tests on a new copy, parks a red one
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Contremaitre: Bump Dependency"

# Polled, not pushed. contremaitre is private, and its push-time dispatch never
# started while the org's private Actions minutes were spent (2026-10-04 on), so
# the pin moved only on an hourly cron GitHub ran every four to six hours. This
# repo is public and its minutes are free: every ten minutes, off the hour that
# GitHub sheds first, a no-op costs a full-history checkout and two API calls,
# about 20 seconds of runner. `gh workflow run contremaitre-bump.yml` moves the
# pin now. Branches never move it — Tier 1b Check 8 refuses one that does
# (carnet#826) — except the stall branch below.
#
# A bump that changes the string copy runs the web, shared-package and mobile
# unit tests before it pushes (carnet#1820: a reworded string two tests quoted
# reached main and reddened it). Green pushes to main as before. Red parks the
# bump commit on contremaitre-bump/<rev8>, leaves main alone and files one
# register issue naming the tests; a human branches from that commit, adds the
# test fix and squashes it onto main, which Check 8 allows for exactly that
# commit. Scheduled polls stop at a parked rev; a dispatch or a newer
# contremaitre commit retries from main, deletes the old stall branch, and
# edits the issue or closes it. The logic is scripts/ci/contremaitre-bump-gate.sh,
# which its .test.sh pins.
#
# Four jobs, so the dependency code the tests run never shares a runner with
# a credential that writes: `bump` holds the private-deps token but runs no
# install scripts (cargo update/fetch run no build scripts); `clients` runs
# bun install and the suites with a read-only token, no persisted
# credentials and no private-deps token, and hands back only a verdict;
# `land` and `tidy` hold the write token and run only this repo's scripts.
# The bump commit travels from `bump` to the others as a git bundle, checked
# against the SHA `bump` reports.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contremaitre-bump
  cancel-in-progress: false

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump dravr-contremaitre rev to latest main
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # a no-op ~20 s, a real bump up to 17 min
    outputs:
      move: ${{ steps.target.outputs.move }}
      new_sha: ${{ steps.target.outputs.new_sha }}
      cur_sha: ${{ steps.target.outputs.cur_sha }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      tidy: ${{ steps.stale.outputs.tidy }}
      changed: ${{ steps.bump.outputs.changed }}
      copy_changed: ${{ steps.commit.outputs.copy_changed }}
      bump_sha: ${{ steps.commit.outputs.bump_sha }}
    steps:
      - name: Checkout dravr-platform main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve target contremaitre SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
        run: |
          NEW_SHA=$(gh api repos/dravr-ai/dravr-contremaitre/commits/main --jq .sha)
          CUR_SHA=$(sed -nE 's/^dravr-contremaitre = \{ git = "[^"]+", rev = "([a-f0-9]+)".*/\1/p' Cargo.toml)
          if [ -z "${NEW_SHA}" ] || [ -z "${CUR_SHA}" ]; then
            echo "::error::could not read contremaitre main (${NEW_SHA:-?}) or the workspace pin (${CUR_SHA:-?})"
            exit 1
          fi
          {
            echo "new_sha=${NEW_SHA}"
            echo "cur_sha=${CUR_SHA}"
            echo "base_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          # The pin only ever moves forward. A target that is not a descendant
          # of the current pin means contremaitre main was rewritten, and moving
          # to it would drop commits the platform already ships; a revert is a
          # new contremaitre commit, which this lane then moves to like any other.
          STATUS=$(gh api "repos/dravr-ai/dravr-contremaitre/compare/${CUR_SHA}...${NEW_SHA}" --jq .status)
          case "${STATUS}" in
            identical)
              echo "move=false" >> "$GITHUB_OUTPUT" ;;
            ahead)
              # A bump already parked for this rev would rerun the same red:
              # a scheduled poll stops there, and only a dispatch retries it.
              if [ "${GITHUB_EVENT_NAME}" = "schedule" ] \
                 && scripts/ci/contremaitre-bump-gate.sh current-stall "${NEW_SHA}"; then
                echo "move=false" >> "$GITHUB_OUTPUT"
                echo "stalled=true" >> "$GITHUB_OUTPUT"
              else
                echo "move=true" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "::error::contremaitre main ${NEW_SHA:0:8} is ${STATUS} relative to the pin ${CUR_SHA:0:8} — the pin never moves backward or sideways"
              exit 1 ;;
          esac

      - name: Close a stall the pin has reached
        # The pin already is contremaitre main. A stall branch left over means
        # it landed or was superseded, and the `tidy` job deletes it and closes
        # its issue. With no branch left (a session deleted it, or the daily
        # branch sweep did), a pin squashed onto main by hand in the last six
        # hours still closes the issue naming its rev. One register search per
        # poll in that window, none otherwise.
        id: stale
        if: steps.target.outputs.move == 'false' && steps.target.outputs.stalled != 'true'
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$(git branch -r --list 'origin/contremaitre-bump/*')" ]; then
            echo "tidy=true" >> "$GITHUB_OUTPUT"
          elif scripts/ci/contremaitre-bump-gate.sh pin-landed-by-hand 6; then
            # Best effort, stated rather than swallowed: a register hiccup
            # must not redden every ten-minute poll; the next poll retries.
            scripts/ci/contremaitre-bump-gate.sh close-stall \
              "Landed: main pins dravr-contremaitre $(echo "${{ steps.target.outputs.new_sha }}" | cut -c1-8)" \
              "${{ steps.target.outputs.new_sha }}" \
              || echo "::warning::could not close the stall issue; the next poll retries"
          fi

      # Everything below runs only when the pin moves, so the ten-minute poll
      # pays the checkout and two API calls, and no toolchain, when
      # contremaitre has not moved.
      - uses: dtolnay/rust-toolchain@1.100.0
        if: steps.target.outputs.move == 'true'

      - name: Configure auth for private git deps
        if: steps.target.outputs.move == 'true'
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Bump rev in Cargo manifests + lockfile
        id: bump
        if: steps.target.outputs.move == 'true'
        run: |
          NEW_SHA="${{ steps.target.outputs.new_sha }}"

          # Auto-discover EVERY manifest that pins the dravr-contremaitre git
          # dep, rather than hardcoding the consumer list. A hardcoded list
          # repeatedly left pierre-chat-pipeline (the 3rd consumer) on the old
          # rev -> two dravr-contremaitre revs -> Security Audit duplicate
          # hard-fail on main. Discovery means a new consumer crate is bumped
          # automatically the moment it pins the dep.
          MANIFESTS=$(grep -rl 'dravr-contremaitre = { git' crates/ Cargo.toml --include=Cargo.toml)
          if [ -z "${MANIFESTS}" ]; then
            echo "::error::no Cargo.toml pins dravr-contremaitre — workflow assumption broke"
            exit 1
          fi
          echo "Consumers pinning dravr-contremaitre:"
          echo "${MANIFESTS}"

          # Rewrite the rev on the dravr-contremaitre line in every consumer,
          # regardless of its current value (targeting the line, not a global
          # OLD_SHA->NEW_SHA swap, also converges any pre-existing drift), then
          # verify each discovered consumer actually landed on NEW_SHA. A
          # mismatch means a manifest's line shape escaped the sed — fail loudly
          # here rather than push a duplicate that reds the Security Audit on
          # main (the recurring pierre-chat-pipeline drift).
          for m in ${MANIFESTS}; do
            sed -i -E "s|(dravr-contremaitre = \{ git = \"[^\"]+\", rev = \")[a-f0-9]{7,40}\"|\1${NEW_SHA}\"|" "$m"
            REV=$(grep 'dravr-contremaitre = { git' "$m" | grep -oE 'rev = "[a-f0-9]+"' | grep -oE '[a-f0-9]{7,40}')
            if [ "${REV}" != "${NEW_SHA}" ]; then
              echo "::error::${m} pins dravr-contremaitre at ${REV:-<unparseable>} after bump, expected ${NEW_SHA} — refusing to push drift"
              exit 1
            fi
          done

          # No manifest changed (all consumers already at NEW_SHA) -> no-op.
          if git diff --quiet -- ${MANIFESTS}; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo update -p dravr-contremaitre
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync the platform's string copy to the bumped rev
        # Strings are authored in dravr-contremaitre; packages/i18n holds a
        # byte-identical copy of the pinned strings/<locale>.json, which the
        # server compiles in as the messaging registry's seed and both clients
        # bundle as their cold-start catalogue. check-contremaitre-sync.sh
        # refuses any byte of difference, so the copy moves in the same commit
        # as the pin it follows, never in a human's hands afterwards
        # (carnet#593). The training catalogue and the evidence corpus need no
        # copy: the pinned crate compiles them in.
        #
        # `cargo fetch` first because the sync reads the pinned checkout on
        # disk rather than cloning contremaitre a second time; `cargo update`
        # above populates the git db but not the checkout.
        if: steps.bump.outputs.changed == 'true'
        run: |
          cargo fetch
          scripts/ci/sync-contremaitre-fallback.sh

      - name: Refuse to push a bump that breaks the coupling
        # Compile-free, ~2s, and gated on `changed` so the polling no-op pays
        # nothing. Pushing first and validating afterwards is this lane's
        # design — GitHub suppresses workflow runs on GITHUB_TOKEN pushes, so
        # the dispatch below is necessarily after the fact. That is survivable
        # for a break CI finds in ten minutes; it is not survivable for one that
        # blocks every session's pre-push gate the instant it lands. Failing
        # HERE leaves main green and lets the next poll retry, so a genuine
        # upstream break stays loud without taking the branch down with it.
        if: steps.bump.outputs.changed == 'true'
        run: scripts/ci/check-contremaitre-sync.sh

      - name: Refuse to push a string copy that fails the vocabulary fence
        # Part A of check-agent-vocabulary.sh reads the whole catalogue on every
        # session's pre-push gate. Whatever contremaitre's own gate checks, it
        # checks on an author's machine against platform main as it stood then,
        # so a string that calls the persona a coach ("Coaches link with their
        # API key...") can still reach this copy, and from that commit on every
        # session's gate fails on a file none of them may touch: Check 8 leaves
        # the copy to this lane alone. Failing HERE, for the same reason as the
        # step above, keeps main green until the string is fixed upstream and
        # the next poll retries. Catalogue only, because the copy is the whole
        # input and this lane has no push of its own for the diff-scoped half
        # to read.
        if: steps.bump.outputs.changed == 'true'
        run: scripts/ci/check-agent-vocabulary.sh --catalogue-only

      - name: Refuse to push a string copy that names the session-read backend
        # carnet#1207: the backend's name must never reach an athlete or coach.
        # The string copy moves only in this lane (Check 8), so a contremaitre
        # value that names it would otherwise land on main and fail every
        # session's pre-push gate on a file none of them may touch. Failing
        # HERE, for the same reason as the two steps above, keeps main green
        # until the string is fixed upstream and the next poll retries.
        if: steps.bump.outputs.changed == 'true'
        run: scripts/ci/check-backend-name-exposure.sh

      - name: Refuse to push a string copy that calls an admin an operator
        # carnet#1644: say admin, never operator. The copy moves only in this
        # lane (Check 8), so a contremaitre value saying operator would land on
        # main and fail every session's pre-push gate on a file none of them may
        # touch. Failing HERE keeps main green until the string is fixed
        # upstream and the next poll retries.
        if: steps.bump.outputs.changed == 'true'
        run: scripts/ci/check-admin-vocabulary.sh packages/i18n/src/locales

      - name: Commit the bump
        id: commit
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT_NEW=$(echo "${{ steps.target.outputs.new_sha }}" | cut -c1-8)
          # Re-discover and stage all consumer manifests + the lockfile, so the
          # commit carries every file the bump touched (no hardcoded list).
          # Stage the manifests, the lockfile, AND the string copy the sync
          # rewrote — the pin and the copy it implies travel together or the
          # commit reintroduces the drift it was meant to close.
          git add $(grep -rl 'dravr-contremaitre = { git' crates/ Cargo.toml --include=Cargo.toml) Cargo.lock \
                  packages/i18n/src/locales
          CORPUS_NOTE=""
          COPY_CHANGED=false
          if ! git diff --cached --quiet -- packages/i18n/src/locales; then
            COPY_CHANGED=true
            CORPUS_NOTE=$(printf '\n\nSyncs the platform string copy to match: %s locale file(s) changed.' \
              "$(git diff --cached --numstat -- packages/i18n/src/locales | wc -l | tr -d ' ')")
          fi
          # The subject is what Check 8 recognises on a stall branch: change it
          # there and in contremaitre-bump-gate.sh together.
          git commit -m "chore(contremaitre): bump dravr-contremaitre rev to ${SHORT_NEW}${CORPUS_NOTE}"
          echo "copy_changed=${COPY_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git update-ref refs/heads/lane-bump HEAD
          git bundle create "${RUNNER_TEMP}/bump.bundle" refs/heads/lane-bump ^HEAD~1

      - name: Hand the bump commit to the test and land jobs
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bump-commit
          path: ${{ runner.temp }}/bump.bundle
          retention-days: 1
          if-no-files-found: error

      - name: Report no-op
        if: steps.target.outputs.move == 'false' || steps.bump.outputs.changed == 'false'
        run: |
          if [ "${{ steps.target.outputs.stalled }}" = "true" ]; then
            echo "dravr-contremaitre ${{ steps.target.outputs.new_sha }} is parked on its stall branch — see the register issue; gh workflow run contremaitre-bump.yml retries"
          else
            echo "dravr-contremaitre already at ${{ steps.target.outputs.new_sha }} — nothing to bump"
          fi

  clients:
    name: Client unit tests on the new copy
    # Only when the copy moved: a rev-only bump changes nothing they read. No
    # additions-only shortcut: a dynamic key read with a defaultValue renders
    # the new string the moment the key appears, so even an added key can
    # change what a test sees.
    needs: bump
    if: needs.bump.outputs.copy_changed == 'true'
    runs-on: ubuntu-24.04
    # Install ~2 min and the four suites ~15 (mobile's p90 alone is 9), then a
    # red suite twice more: once on the new copy to rule out a flake, once on
    # main's copy to rule out main's own red. A timeout is no verdict, which
    # `land` parks and files like a red.
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.clients.outputs.verdict }}
      failures: ${{ steps.clients.outputs.failures }}
    steps:
      - name: Checkout the main the bump was cut from
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.base_sha }}
          persist-credentials: false

      - name: Download the bump commit
        uses: actions/download-artifact@v4
        with:
          name: bump-commit
          path: ${{ runner.temp }}/bump

      - name: Apply the bump commit
        # The SHA `bump` reported, or nothing: the bundle is a run artifact,
        # and only its hash ties it to the commit `bump` made.
        env:
          BUMP_SHA: ${{ needs.bump.outputs.bump_sha }}
        run: |
          git fetch -q "${RUNNER_TEMP}/bump/bump.bundle" refs/heads/lane-bump
          if [ "$(git rev-parse FETCH_HEAD)" != "${BUMP_SHA}" ] || [ "$(git rev-parse FETCH_HEAD~1)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::the bundled commit is not the bump commit ${BUMP_SHA} on ${{ needs.bump.outputs.base_sha }}"
            exit 1
          fi
          git checkout -q --detach FETCH_HEAD

      - name: Setup Node
        # The setup frontend-tests.yml and mobile-unit-tests.yml use: .nvmrc's
        # Node, Bun 1.3.4, one frozen workspace install (frontend-mobile is a
        # workspace member, so it covers the mobile suites too).
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run the client unit tests on the new copy
        id: clients
        # Red only for a failure that reproduces on the new copy and that
        # main's own copy does not share. Exit 2 is a gate that could not
        # judge, which fails this job: `land` then parks and files it as no
        # verdict, and never pushes to main.
        run: |
          rc=0
          scripts/ci/contremaitre-bump-gate.sh test "${RUNNER_TEMP}/bump-tests" || rc=$?
          case "$rc" in
            0) echo "verdict=green" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=red" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "failures<<${delim}"; head -n 60 "${RUNNER_TEMP}/bump-tests/failures.txt"; echo "${delim}"; } >> "$GITHUB_OUTPUT"

  land:
    name: Push the bump, or park it
    needs: [bump, clients]
    # `clients` is skipped for a rev-only bump; anything but its success on a
    # copy change is no verdict, parked like a red.
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.bump.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the main the bump was cut from
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.base_sha }}
          fetch-depth: 0

      - name: Download the bump commit
        uses: actions/download-artifact@v4
        with:
          name: bump-commit
          path: ${{ runner.temp }}/bump

      - name: Apply the bump commit
        # The SHA `bump` reported, or nothing: the bundle is a run artifact,
        # and only its hash ties it to the commit `bump` made.
        env:
          BUMP_SHA: ${{ needs.bump.outputs.bump_sha }}
        run: |
          git fetch -q "${RUNNER_TEMP}/bump/bump.bundle" refs/heads/lane-bump
          if [ "$(git rev-parse FETCH_HEAD)" != "${BUMP_SHA}" ] || [ "$(git rev-parse FETCH_HEAD~1)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::the bundled commit is not the bump commit ${BUMP_SHA} on ${{ needs.bump.outputs.base_sha }}"
            exit 1
          fi
          git checkout -q --detach FETCH_HEAD
          # The rebase in the push below rewrites the committer: keep it the bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read the client verdict
        id: verdict
        env:
          COPY_CHANGED: ${{ needs.bump.outputs.copy_changed }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          CLIENTS_VERDICT: ${{ needs.clients.outputs.verdict }}
        run: |
          if [ "${COPY_CHANGED}" != "true" ]; then
            verdict=green
          elif [ "${CLIENTS_RESULT}" = "success" ] && [ -n "${CLIENTS_VERDICT}" ]; then
            verdict="${CLIENTS_VERDICT}"
          else
            verdict=unjudged
          fi
          echo "client verdict: ${verdict} (job ${CLIENTS_RESULT})"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      - name: Push bump to main
        id: land
        if: steps.verdict.outputs.verdict == 'green'
        run: |
          # main moves while this lane runs, and a bare push then rejects
          # non-fast-forward over a bump that was correct (carnet#383).
          scripts/ci/push-to-branch-with-rebase.sh origin main
          echo "landed=true" >> "$GITHUB_OUTPUT"

      - name: Retire stall branches and their issue
        # The bump on main now carries every earlier contremaitre commit, so a
        # stall branch for an older rev is superseded, and one for this rev
        # just landed. The issue closes whether or not a branch is left. Best
        # effort: main already has the bump.
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/ci/contremaitre-bump-gate.sh prune \
            || echo "::warning::could not delete the stall branches; the tidy job retries"
          scripts/ci/contremaitre-bump-gate.sh close-stall \
            "Superseded: main now pins dravr-contremaitre $(echo "${{ needs.bump.outputs.new_sha }}" | cut -c1-8), and its copy passes the client unit tests" \
            || echo "::warning::could not close the stall issue; the next poll retries"

      - name: Park the bump on its stall branch
        # Never main: the copy breaks a client unit test, and that test cannot
        # change on main before the string does. The branch is the bump commit
        # on the main it was cut from, replaced on a retry only while its tip
        # is still the lane's own commit; Check 8 lets exactly that commit,
        # plus a test fix, through to main. A failure here still files.
        id: park
        if: steps.verdict.outputs.verdict == 'red' || steps.verdict.outputs.verdict == 'unjudged'
        run: |
          if scripts/ci/contremaitre-bump-gate.sh park "${{ needs.bump.outputs.new_sha }}"; then
            echo "result=parked" >> "$GITHUB_OUTPUT"
          else
            echo "result=not parked" >> "$GITHUB_OUTPUT"
            echo "::warning::the bump could not be parked on its stall branch; the issue says so"
          fi

      - name: File the stall on the register
        # One open issue for every stalled bump, edited in place by each later
        # stall, never a second; the private register, since this repo is
        # public. Filed even when parking failed, so a refused park is on the
        # register rather than only in a red run.
        if: always() && (steps.verdict.outputs.verdict == 'red' || steps.verdict.outputs.verdict == 'unjudged')
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARK_OUTCOME: ${{ steps.park.outputs.result }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          FAILURES: ${{ needs.clients.outputs.failures }}
        run: |
          mkdir -p "${RUNNER_TEMP}/bump-tests"
          printf '%s\n' "${FAILURES}" > "${RUNNER_TEMP}/bump-tests/failures.txt"
          scripts/ci/contremaitre-bump-gate.sh file-stall \
            "${{ needs.bump.outputs.cur_sha }}" "${{ needs.bump.outputs.new_sha }}" "${RUNNER_TEMP}/bump-tests"
          echo "::error::the dravr-contremaitre bump did not pass the client unit tests (${{ steps.verdict.outputs.verdict }}); parked on contremaitre-bump/$(echo "${{ needs.bump.outputs.new_sha }}" | cut -c1-8) (${PARK_OUTCOME}), main untouched"
          exit 1

      - name: Validate the bump in CI
        # The push above uses the default GITHUB_TOKEN, and GitHub suppresses
        # workflow runs on GITHUB_TOKEN pushes — so the bump commit would land
        # unvalidated. Dispatch explicitly so every bump carries real coverage.
        # The PAT path was abandoned: DRAVR_PRIVATE_DEPS_TOKEN is read-only on
        # this repo.
        #
        # Every lane the bump's files reach, not just ci-backend. A bump
        # touches Cargo.toml, Cargo.lock and crates/**, which matches
        # ci-postgres's push paths exactly — the only reason it does not run
        # is the suppressed push, the same reason ci-backend is dispatched
        # here. Dispatching one and not the other left
        # main's per-push verdict lane blind to every bump: 0927f04f8 moved a
        # pinned catalogue count, ci-backend caught it on dispatch, and the
        # PostgreSQL lane never saw that tree at all. Its last green on main was
        # 9f3ee5138, an ANCESTOR of the bump, so main read green while two
        # feature branches hit the failure first.
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Independent, and failing once at the end. `run:` is `bash -e`, so a
        # bare sequence would let a hiccup on the first dispatch — an API 5xx,
        # a rate limit, the target workflow disabled — swallow the second and
        # skip the step after this one. The bump commit is already on main by
        # then and its push fires nothing, so a dropped dispatch is a commit
        # with no verdict at all.
        run: |
          rc=0
          # -f scope=true: judged like the push this dispatch stands in for, from
          # the newest green ancestor, so a rev bump tests the crates resolving
          # the moved entries rather than every crate (carnet#1282).
          gh workflow run ci-backend.yml --ref main -f scope=true || rc=1
          gh workflow run ci-postgres.yml --ref main -f scope=true || rc=1
          # A bump moves the web locale copies under packages/i18n, and the
          # mocked e2e suite finds controls by those labels, so a renamed string
          # reddens web tests. No scope input: this lane always runs in full.
          gh workflow run frontend-tests.yml --ref main || rc=1
          # The mobile app reads the same copies (@pierre/i18n is a file: dep),
          # and its lane's push paths include packages/**, so a bump is a push
          # it should judge. Undispatched, e87a0d80f dropped 41 strings per
          # locale under mobile and this lane started no mobile run for it.
          gh workflow run mobile-unit-tests.yml --ref main || rc=1
          exit $rc

      - name: Run the messaging eval asserters on the bumped prompts
        # A bump lands new coach prompts. Dispatching the eval's Phase 0-3
        # asserters here surfaces a prompt regression within minutes instead of
        # waiting for its 04:08 UTC nightly — the same suppressed-run problem as
        # the step above, and gated on `changed` so the polling no-op costs
        # nothing. `asserters_only` skips the live Slack round trip.
        # `always()` so a dispatch hiccup in the step above cannot cancel this
        # one: an implicit success() would make the two lanes share a fate they
        # do not share.
        if: always() && steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run messaging-eval.yml --ref main -f asserters_only=true

      # No explicit deploy trigger. The bump refreshes the compiled-in prompt
      # SEED for the next regular deploy; runtime prompt freshness is handled by
      # the in-process poll (full_sync every CONTREMAITRE_POLL_INTERVAL_SECS) plus
      # the push webhook — both pull the latest from GitHub without a redeploy.

  tidy:
    name: Retire stall branches the pin has reached
    # The pin already is contremaitre main and a stall branch is left: it
    # landed (a human squashed it with its test fix) or a newer bump
    # superseded it. Starts only when `bump` saw such a branch, so a plain
    # no-op poll pays nothing here.
    needs: bump
    if: needs.bump.outputs.tidy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Delete the stall branches and close the issue
        # Best effort, so a refused delete or a register hiccup never reddens
        # every ten-minute poll; each failure is a warning and the next poll
        # tries again.
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/ci/contremaitre-bump-gate.sh prune \
            || echo "::warning::could not delete the stall branches; the next poll retries"
          scripts/ci/contremaitre-bump-gate.sh close-stall \
            "Landed: main pins dravr-contremaitre $(echo "${{ needs.bump.outputs.new_sha }}" | cut -c1-8)" \
            || echo "::warning::could not close the stall issue; the next poll retries"
