# ABOUTME: Turns a dravr-photograveur release into a deployed platform — pin bump, CI gate, squash merge, image, deploy
# ABOUTME: The photograveur half of the wire sciotte-bump.yml built; both ends exist so neither pin can drift silently
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Written against the failure sciotte-bump.yml was built to end, before photograveur
# could repeat it. photograveur shipped pinned by rev with the image published by a
# hand-run dispatch, which is the same two-halves-no-wire shape: the pin and the
# deployed bytes were separately correct and nothing kept them equal.
#
# The ordering is the safety property. The image is built and :latest advanced only
# AFTER the platform has validated the pin and merged it. Building first would leave
# :latest pointing at a photograveur the platform never accepted — and since
# terraform's photograveur_image is that moving tag, the next unrelated
# `terraform apply` would deploy it.
#
# Gating on CI matters more here than the small crate suggests. photograveur owns the
# Scene types the platform serialises into, so a shape change compiles on one side and
# fails to deserialise on the other; and its rendering depends on fonts present in the
# image rather than in the crate, so "it builds" is not "it draws".

name: "Photograveur: Release Integration"

on:
  repository_dispatch:
    types: [photograveur-released]
  schedule:
    # Weekly safety net, on the same cadence as sciotte: a missed or failed dispatch
    # still gets the release integrated rather than silently dropped.
    - cron: "30 13 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "photograveur tag to integrate (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch
  id-token: write # WIF, for the image build and the deploy
  security-events: write # Trivy SARIF, uploaded by the image build

concurrency:
  # Never overlap. Two releases integrating at once would race on main and on the
  # :latest tag, and the deploy job's rollback target would be whichever one lost.
  group: photograveur-bump
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. What are we integrating, and is there anything to do?
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pinned: ${{ steps.v.outputs.pinned }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and verify the target tag
        id: v
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PAYLOAD_VERSION:-${INPUT_VERSION:-}}"
          if [ -z "${VERSION}" ]; then
            VERSION=$(gh api repos/dravr-ai/dravr-photograveur/releases/latest -q .tag_name)
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::could not resolve a dravr-photograveur version to integrate"
            exit 1
          fi

          # Verify against the API rather than trusting the dispatch payload. The
          # payload is attacker-influenceable in principle and stale in practice;
          # this chain pushes to main and deploys, so it confirms the tag is a real
          # published release before acting on it.
          if ! gh api "repos/dravr-ai/dravr-photograveur/releases/tags/${VERSION}" -q .tag_name >/dev/null 2>&1; then
            echo "::error::${VERSION} is not a published dravr-photograveur release"
            exit 1
          fi

          MANIFEST=crates/pierre-server/Cargo.toml
          PINNED=$(grep -oE 'photograveur = \{ git = "[^"]+", tag = "[^"]+"' "${MANIFEST}" \
                   | grep -oE 'tag = "[^"]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "${PINNED}" ]; then
            echo "::error::could not read the pinned photograveur tag from ${MANIFEST} — the line shape changed"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pinned=${PINNED}"   >> "$GITHUB_OUTPUT"
          if [ "${PINNED}" = "${VERSION}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "pin is already ${VERSION} — nothing to integrate"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "integrating ${PINNED} -> ${VERSION}"
          fi

  # ---------------------------------------------------------------------------
  # 2. Bump every consumer onto the new tag, on a branch
  # ---------------------------------------------------------------------------
  bump:
    name: Bump the pin on a branch
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    outputs:
      branch: ${{ steps.push.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Configure auth for private git deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Rewrite the tag in every consumer manifest
        id: bump
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Auto-discover consumers rather than hardcoding the list, for the reason
          # contremaitre-bump learned the hard way: a hardcoded list left one crate
          # behind, which put two revs of the same dependency in Cargo.lock and
          # hard-failed the Security Audit on main. Only pierre-server pins
          # photograveur today; discovery bumps the second consumer the day it exists.
          MANIFESTS=$(grep -rl 'photograveur = { git' crates/ --include=Cargo.toml)
          if [ -z "${MANIFESTS}" ]; then
            echo "::error::no Cargo.toml pins photograveur — workflow assumption broke"
            exit 1
          fi
          echo "Consumers pinning photograveur:"; echo "${MANIFESTS}"

          # Target the line and overwrite whatever tag it holds, rather than swapping
          # a known old value: that also converges a consumer that had drifted to a
          # third version. Then verify each one landed, so a manifest whose line shape
          # escaped the sed fails here instead of pushing drift.
          for m in ${MANIFESTS}; do
            sed -i -E "s|(photograveur = \{ git = \"[^\"]+\", tag = \")v[0-9]+\.[0-9]+\.[0-9]+\"|\1${VERSION}\"|" "$m"
            TAG=$(grep 'photograveur = { git' "$m" | grep -oE 'tag = "v[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
            if [ "${TAG}" != "${VERSION}" ]; then
              echo "::error::${m} pins photograveur at ${TAG:-<unparseable>} after bump, expected ${VERSION} — refusing to push drift"
              exit 1
            fi
          done

          cargo update -p photograveur

          # Assert the lockfile holds exactly one photograveur, at the tag just pinned.
          # Borrowed from the sciotte chain, which learned it the expensive way: the
          # platform depends on dravr-sciotte directly and again through dravr-enforme,
          # so moving one arm produced a lockfile carrying two versions and a branch that
          # could never merge — ci-backend hard-fails a build where a dravr-* crate
          # resolves twice. photograveur has a single dependent today (pierre_mcp_server)
          # and no such diamond, which is precisely why this belongs here now: the day
          # something else pins it, that failure should surface in seconds rather than
          # twenty minutes into CI, and on the cause rather than a symptom.
          ENTRIES=$(grep -c '^name = "photograveur"$' Cargo.lock || true)
          if [ "${ENTRIES}" != "1" ]; then
            echo "::error::Cargo.lock holds ${ENTRIES} photograveur entries, expected 1 — a second consumer pins a different version, so this bump cannot merge"
            grep -A2 '^name = "photograveur"$' Cargo.lock || true
            exit 1
          fi
          if ! grep -q "source = \"git+https://github.com/dravr-ai/dravr-photograveur.git?tag=${VERSION}#" Cargo.lock; then
            echo "::error::Cargo.lock does not resolve photograveur at ${VERSION} after the update"
            grep -A2 '^name = "photograveur"$' Cargo.lock || true
            exit 1
          fi

      - name: Regenerate the scene types the frontends compile against
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # packages/scene-types is generated from photograveur's Rust types by ts-rs.
          # Bumping the crate without regenerating leaves web and mobile type-checking
          # against the previous Scene shape — which compiles, and then fails to render
          # the field that moved. The generator is the crate's own script, so it is
          # whatever the new tag says it is.
          #
          # Nothing here fabricates the types on a miss: if the checkout or the script
          # is absent the step fails, rather than pushing a bump with stale bindings.
          rm -rf /tmp/photograveur-typegen
          git clone --depth 1 --branch "${VERSION}" \
            https://github.com/dravr-ai/dravr-photograveur.git /tmp/photograveur-typegen
          ( cd /tmp/photograveur-typegen && ./scripts/generate-ts-types.sh )

          # packages/scene-types/src is generated in full — types plus the barrel the
          # generator writes — so it is replaced wholesale rather than merged. A type
          # deleted upstream has to disappear here too, or the barrel re-exports a
          # file that no longer backs anything.
          if ! ls /tmp/photograveur-typegen/bindings/*.ts >/dev/null 2>&1; then
            echo "::error::the generator produced no bindings — refusing to bump with stale scene types"
            exit 1
          fi
          rm -f packages/scene-types/src/*.ts
          cp /tmp/photograveur-typegen/bindings/*.ts packages/scene-types/src/
          git diff --stat -- packages/scene-types || true

      - name: Push the branch and dispatch the gates onto it
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="fix/photograveur-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add $(grep -rl 'photograveur = { git' crates/ --include=Cargo.toml) Cargo.lock
          git add -A packages/scene-types
          git commit -m "chore(photograveur): bump photograveur to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # GitHub suppresses workflow runs on pushes made with GITHUB_TOKEN, so this
          # branch triggers nothing on its own and the gate below would wait forever
          # on runs that never start. Dispatch each gate explicitly. A PAT would avoid
          # this, but DRAVR_PRIVATE_DEPS_TOKEN is read-only on this repo.
          for wf in ci-backend.yml ci-postgres.yml integration-tests.yml frontend-tests.yml; do
            gh workflow run "$wf" --ref "${BRANCH}"
            echo "dispatched ${wf} on ${BRANCH}"
          done

  # ---------------------------------------------------------------------------
  # 3. Wait for those gates to finish, and require green
  # ---------------------------------------------------------------------------
  gate:
    name: Wait for CI on the bump branch
    runs-on: ubuntu-latest
    needs: [resolve, bump]
    timeout-minutes: 60
    steps:
      - name: Poll until every gate reaches a terminal status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # frontend-tests is a gate here and not for sciotte: the scene types this
          # bump regenerates are what web and mobile render against.
          WORKFLOWS="ci-backend.yml ci-postgres.yml integration-tests.yml frontend-tests.yml"
          DEADLINE=$(( $(date +%s) + 45 * 60 ))

          # The branch is created fresh for this version and nothing else pushes to
          # it, so the newest run per workflow on it is unambiguously ours. Matching
          # by commit was rejected: `gh run list --commit` silently returns zero rows.
          while :; do
            PENDING=""; FAILED=""
            for wf in ${WORKFLOWS}; do
              LINE=$(gh run list --workflow "$wf" --branch "${BRANCH}" --limit 1 \
                       --json status,conclusion \
                       -q '.[0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null || true)
              STATUS="${LINE%% *}"; CONCL="${LINE##* }"
              if [ -z "${LINE}" ] || [ "${STATUS}" != "completed" ]; then
                PENDING="${PENDING} ${wf}(${STATUS:-not-started})"
              elif [ "${CONCL}" != "success" ]; then
                # cancelled and skipped are not green. A cancelled run validated nothing.
                FAILED="${FAILED} ${wf}(${CONCL})"
              fi
            done

            if [ -n "${FAILED}" ]; then
              echo "::error::CI is not green on ${BRANCH}:${FAILED} — the branch is left in place for inspection"
              exit 1
            fi
            if [ -z "${PENDING}" ]; then
              echo "all gates green on ${BRANCH}"
              break
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::timed out after 45m waiting on:${PENDING}"
              exit 1
            fi
            echo "waiting on:${PENDING}"
            sleep 60
          done

  # ---------------------------------------------------------------------------
  # 4. Squash the branch onto main
  # ---------------------------------------------------------------------------
  merge:
    name: Squash merge onto main
    runs-on: ubuntu-latest
    needs: [resolve, bump, gate]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Squash merge and delete the branch
        env:
          BRANCH: ${{ needs.bump.outputs.branch }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PINNED: ${{ needs.resolve.outputs.pinned }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${BRANCH}"
          git merge --squash "origin/${BRANCH}"
          git commit -m "chore(photograveur): integrate photograveur ${PINNED} -> ${VERSION}"
          git push origin main
          # Squash gives the merge a new SHA, so the branch is dead the moment it
          # lands. Deleting it here keeps dead refs from accumulating per release.
          git push origin --delete "${BRANCH}"

  # ---------------------------------------------------------------------------
  # 5. Build the image — only now that main has accepted this photograveur
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish the photograveur image
    needs: [resolve, bump, gate, merge]
    # Runs whether or not a bump was needed, so the deployment converges on whatever
    # photograveur version main pins. Gating this on `needed` instead meant a re-run
    # after a merge skipped everything, leaving no way to finish a deploy that had
    # failed after the bump already landed. What must not happen is building after a
    # *failed* bump, so this checks for failure rather than for skipping.
    if: >-
      ${{ !cancelled()
          && needs.resolve.result == 'success'
          && needs.bump.result != 'failure'
          && needs.gate.result != 'failure'
          && needs.merge.result != 'failure' }}
    uses: ./.github/workflows/publish-photograveur-image.yml
    secrets: inherit
    with:
      photograveur_ref: ${{ needs.resolve.outputs.version }}

  # ---------------------------------------------------------------------------
  # 6. Deploy, verify the bytes, roll back if it goes wrong
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy photograveur to dev
    runs-on: ubuntu-latest
    needs: [resolve, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    environment: development
    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Capture the digest currently serving
        id: prev
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          PREV=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                   --format='value(status.imageDigest)')
          # Refuse to deploy with no rollback target. A rollback step that silently
          # has nothing to roll back to is worse than not having one, because the
          # workflow would still report that it recovered.
          if [ -z "${PREV}" ]; then
            echo "::error::could not read the serving digest of ${REV} — refusing to deploy without a rollback target"
            exit 1
          fi
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "serving ${REV} at ${PREV}"

      - name: Deploy
        # Deploys the moving :latest tag rather than the digest, because that is the
        # literal value terraform holds in photograveur_image. Deploying a digest
        # would leave the service permanently disagreeing with its own terraform, so
        # every later apply would bounce it. The digest is asserted immediately below,
        # which closes the gap this opens.
        #
        # Cloud Run refuses to shift traffic to a revision that fails its startup
        # probe (GET /health, 10 attempts at 5s), so a container that cannot boot
        # leaves the previous revision serving and fails this step. That probe is the
        # health check; the rollback below covers the rest.
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/photograveur:latest

      - name: Assert the serving bytes are the bytes we built and scanned
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          REGISTRY: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}
          EXPECTED: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          GOT=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                  --format='value(status.imageDigest)')

          # buildx publishes an OCI *index*, because it attaches a provenance
          # attestation alongside the image. build-push-action reports that index's
          # digest, while Cloud Run resolves the tag down to the linux/amd64 child and
          # records the child. The two are never equal, so comparing them directly
          # fails every time on a deploy that in fact shipped the right bytes. This
          # chain has never run a real deploy; the sciotte one proved the failure on
          # v0.8.6, rolling dev back over a correct rollout. Accept the index digest
          # or any of its children.
          HOST="${REGISTRY%%/*}"
          PATH_PART="${REGISTRY#*/}/photograveur"
          TOKEN=$(gcloud auth print-access-token)
          CHILDREN=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://${HOST}/v2/${PATH_PART}/manifests/${EXPECTED}" \
            | jq -r '(.manifests // [])[].digest' || true)

          for candidate in ${EXPECTED} ${CHILDREN}; do
            if [ "${GOT}" = "${candidate}" ] || [ "${GOT##*@}" = "${candidate}" ]; then
              echo "serving ${REV} at ${GOT} (matches ${candidate})"
              exit 0
            fi
          done
          echo "::error::${REV} serves ${GOT}, which is neither ${EXPECTED} nor any manifest it indexes"
          echo "index children were: ${CHILDREN:-<none>}"
          exit 1

      - name: Roll back to the previously serving digest
        if: failure()
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-photograveur
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREV: ${{ steps.prev.outputs.image }}
        run: |
          set -euo pipefail
          # Redeploy the previous digest rather than repointing traffic. Traffic pins
          # applied with `update-traffic --to-revisions` stick to the service and make
          # every subsequent deploy land without receiving traffic — the failure mode
          # is a deploy that reports success while nothing it shipped is serving.
          echo "rolling back ${SVC} to ${PREV}"
          gcloud run services update "${SVC}" --region "${REGION}" --image "${PREV}" --quiet
          echo "::warning::rolled back to ${PREV}; main carries the bump, the deployed image does not"

  # ---------------------------------------------------------------------------
  # 6b. Mark the digest dev is serving so registry retention keeps it
  # ---------------------------------------------------------------------------
  tag-deployed-photograveur:
    name: Tag Deployed Digest (photograveur, dev)
    runs-on: ubuntu-latest
    needs: [image, deploy]
    # Explicit, not defaulted. With no `if:` a job evaluates `success()`, which is
    # false when any *transitive* ancestor was skipped — and bump/gate/merge skip
    # on every run that needs no version bump. That silently skipped the sibling
    # job on the sciotte lane while the run still reported success (2026-08-31).
    # The safety property is unchanged: tag only a deploy that succeeded, so a
    # rolled-back image is never anchored.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.deploy.result == 'success' }}

    steps:
      # image-publisher (artifactregistry.writer), not the dev deployer: the tag
      # is written in the dravr-artifacts project, where the dev deployer has no
      # write access. Same split as publish-images.yml's tag-deployed-dev.
      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Tag the deployed photograveur digest
        # The deploy above captures the serving digest as its rollback target, but
        # nothing marks that digest for the registry, so the cleanup policy is free
        # to delete it once newer builds push it past the recent-versions floor —
        # and a rollback to a deleted digest fails outright ("Image not found",
        # observed on the sciotte lane 2026-08-31, carnet#166). `deployed-` is
        # matched by the registry's keep-tags rule (infra/artifacts
        # release_tag_prefixes) and wins over every delete rule; the tfvars comment
        # names this tag as what carries the guarantee keep_count cannot.
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          PACKAGE="${IMAGE%@*}"
          echo "Tagging ${IMAGE} as ${PACKAGE}:deployed-dev"
          gcloud artifacts docker tags add "${IMAGE}" "${PACKAGE}:deployed-dev" --quiet

  # ---------------------------------------------------------------------------
  # 7. Ship the platform binary, which is where the geometry actually runs
  # ---------------------------------------------------------------------------
  #
  # Everything above deploys the photograveur SERVICE, which only rasterises an
  # already-resolved Scene. The geometry — scales, ticks, band widths, facets —
  # is `photograveur::layout`, compiled into the PLATFORM binary as a Rust crate:
  # `photograveur_client.rs` posts an already-resolved Scene to the service. So a
  # layout change reaches an athlete only when dravr-mcp-server-api is rebuilt.
  #
  # Nothing rebuilt it. `publish-images.yml` deploys the platform on `workflow_run`
  # of "CI: Backend (Rust)" against main, and the squash merge above is pushed with
  # GITHUB_TOKEN, which by design does not trigger downstream workflows. A bump that
  # lands on a quiet main therefore reported six green jobs and shipped nothing,
  # while the pin and the running binary silently disagreed until somebody else
  # happened to push. Both of 2026-08-24's releases hit this: v0.1.5 reached the
  # binary only because unrelated commits landed on top of it minutes later, and
  # v0.1.6 sat undeployed until a hand-run dispatch (carnet#94).
  #
  # Dispatching explicitly is the same move this workflow already makes to put the
  # CI gates on the bump branch, and it runs AFTER the service deploy: photograveur
  # owns the Scene types the platform serialises into, so the reader has to
  # understand the new shape before the writer starts emitting it.
  platform:
    name: Ship the platform binary carrying the new crate
    runs-on: ubuntu-latest
    needs: [resolve, merge, deploy]
    if: >-
      ${{ !cancelled()
          && needs.merge.result == 'success'
          && needs.deploy.result == 'success' }}
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Dispatch the platform image build and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run publish-images.yml --ref main
          echo "dispatched publish-images.yml on main so the binary picks up ${VERSION}"
          echo "### Platform deploy dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "The photograveur service is on ${VERSION}; the platform binary that" \
               "resolves Scenes is now rebuilding to match." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Anything that stops the chain becomes a tracked issue
  # ---------------------------------------------------------------------------
  report-failure:
    name: File the stall on the register
    runs-on: ubuntu-latest
    needs: [resolve, bump, gate, merge, image, deploy, platform]
    if: failure() && needs.resolve.outputs.needed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Open or update the register issue
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PINNED: ${{ needs.resolve.outputs.pinned }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The private register, because this repo is public.
          TRACKER=$(grep -oE '^tracker[[:space:]]*=[[:space:]]*"[^"]+"' registre.toml | grep -oE '[^"]+/[^"]+')
          TITLE="[platform] photograveur integration stalled (${PINNED} -> ${VERSION})"

          # Indented to this block's level on purpose: YAML strips a block scalar's
          # common indentation, so the shell receives column 0. Dedenting breaks the YAML.
          BODY=$(cat <<EOF
          Automated integration of \`photograveur\` **${VERSION}** did not complete.

          - Pinned: **${PINNED}**
          - Target: **${VERSION}**
          - Branch: \`${BRANCH:-not created}\`
          - Run: ${RUN_URL}

          The chain is ordered so a stall is safe: the image is built and \`:latest\`
          advanced only after main has merged the bump. If this stopped at or before the
          merge, the deployed photograveur is unchanged and the branch is still there to
          inspect. If it stopped at the deploy, the rollback step restored the previous
          digest and main is ahead of what is deployed.

          Coach visuals degrade rather than break while this is stalled: charts still
          render in the app, and messaging replies carry the coach's prose without images.

          _Filed by \`photograveur-bump.yml\`._
          EOF
          )

          EXISTING=$(gh issue list --repo "$TRACKER" --state open --search "photograveur integration stalled in:title" \
                     --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "$TRACKER" --title "$TITLE" --body "$BODY"
            echo "updated ${TRACKER}#${EXISTING}"
          else
            gh issue create --repo "$TRACKER" --title "$TITLE" --body "$BODY" \
              --label "dravr-platform" --label "dependency" 2>/dev/null \
              || gh issue create --repo "$TRACKER" --title "$TITLE" --body "$BODY"
            echo "opened a new issue on ${TRACKER}"
          fi
