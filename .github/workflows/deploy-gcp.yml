# ABOUTME: Manual emergency re-deploy of Docker images to GCP Cloud Run
# ABOUTME: Publish Images handles automatic deploys; this is for manual redeploys only

name: "Deploy: Redeploy (manual)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# It rolls the same dev services as publish-images.yml, so it waits in that
# workflow's deploy group instead of racing it (carnet#1118).
concurrency:
  group: deploy-dev-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve image tags from HEAD commit
  # ---------------------------------------------------------------------------
  resolve-images:
    name: Resolve Image Tags
    runs-on: ubuntu-latest
    timeout-minutes: 5  # reads refs and secrets, seconds

    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
      registry: ${{ steps.registry.outputs.registry }}
      gcp_configured: ${{ steps.secrets.outputs.gcp_configured }}

    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "Using registry: ${REGISTRY}"

      - name: Check GCP secrets availability
        id: secrets
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$DEPLOYER_SA" ]; then
            echo "gcp_configured=true" >> "$GITHUB_OUTPUT"
            echo "GCP deployment secrets are configured"
          else
            echo "gcp_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP deployment secrets not configured — skipping deployment"
          fi
        env:
          WIF_PROVIDER: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

  # ---------------------------------------------------------------------------
  # Deploy backend API service to Cloud Run
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 40  # 15-min quiesce and 10-min settle waits around the rollout
    needs: resolve-images
    if: needs.resolve-images.outputs.gcp_configured == 'true'

    steps:
      # Before auth: checkout cleans the workspace, which would delete the
      # credentials file auth writes there.
      - name: Checkout (wait script)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Wait until no dev Cloud Run service is mid-rollout
        # carnet#696: dev's services share one small Cloud SQL instance, and
        # revisions cold-starting together exhaust its connection slots. Every
        # roll waits until no dev service (the list lives in the script) is
        # mid-rollout, then waits for its own service to settle. A timeout fails
        # the job rather than deploying into a rollout.
        # carnet#1129: the API roll also waits for 6 free Cloud SQL slots, one
        # pool's worth for the single pod the canary below starts beside the old
        # revision (carnet#1269).
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --db-headroom 6 --timeout-seconds 900

      - name: Deploy backend API to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.resolve-images.outputs.registry }}/server:${{ needs.resolve-images.outputs.short_sha }}
          no_traffic: true

      # The deploy above boots no pod: a no_traffic revision is Ready with
      # nothing running (2026-10-29 23:43), so Ready proves nothing about the
      # database. The canary is the queue (carnet#1269): 1% of traffic starts
      # ONE new pod while the old revision keeps 99%, the new revision takes
      # 100% only once that pod has logged reading its key from the database,
      # and any failure or cancel sends the 1% back. On 2026-10-29, rolled with
      # traffic, three new pods booted beside three old ones holding 18 of
      # Cloud SQL's 22 slots, and two waited out their boot window and restarted.
      # `exec`: a cancel signals the step's own process only, and the script's
      # trap is what sends the 1% back.
      - name: Canary one pod, then move traffic to the new revision
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          SERVICE: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: exec ./scripts/ci/cloud-run-canary.sh --service "${SERVICE}" --region "${REGION}"

      # A deploy that failed or was cancelled leaves its no_traffic pin on the
      # revision serving now, and a pin left behind holds until something moves
      # traffic back (2026-05-25, 22 hours). `--to-latest` routes to the latest
      # READY revision, so the old one keeps serving. A failed canary is not
      # unpinned here: its revision is Ready, so --to-latest would hand all
      # traffic to the pod that never reached the database.
      - name: Unpin traffic after a failed deploy
        if: ${{ always() && (steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled') }}
        env:
          SERVICE: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --to-latest --quiet

      - name: Wait for the API to settle
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service api --timeout-seconds 600

      - name: Verify backend API deployment
        run: |
          echo "Backend API deployed successfully to ${{ vars.GCP_DEV_SERVICE_NAME }}-api"
          echo "Image: ${{ needs.resolve-images.outputs.registry }}/server:${{ needs.resolve-images.outputs.short_sha }}"

  # ---------------------------------------------------------------------------
  # Deploy frontend service to Cloud Run
  # ---------------------------------------------------------------------------
  # After the API, never beside it (carnet#696): two jobs starting together
  # would both find dev quiescent and roll at once. It still runs when the API
  # deploy failed, so an emergency redeploy of the frontend is not held hostage.
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40  # 15-min quiesce and 10-min settle waits around the rollout
    needs: [resolve-images, deploy-api]
    if: ${{ !cancelled() && needs.resolve-images.outputs.gcp_configured == 'true' }}

    steps:
      # Before auth: checkout cleans the workspace, which would delete the
      # credentials file auth writes there.
      - name: Checkout (wait script)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Wait until no dev Cloud Run service is mid-rollout
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --timeout-seconds 900

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.resolve-images.outputs.registry }}/frontend:${{ needs.resolve-images.outputs.short_sha }}

      - name: Wait for the frontend to settle
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service frontend --timeout-seconds 600

      - name: Verify frontend deployment
        run: |
          echo "Frontend deployed successfully to ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend"
          echo "Image: ${{ needs.resolve-images.outputs.registry }}/frontend:${{ needs.resolve-images.outputs.short_sha }}"

  # ---------------------------------------------------------------------------
  # First-party sign-in smoke (after the rolls)
  # ---------------------------------------------------------------------------
  # As publish-images.yml sign-in-smoke-dev: a redeploy can roll an api image
  # that refuses the apps' own origins, or a frontend that stops proxying
  # /oauth2/, and nothing else probes sign-in since the continuous uptime
  # checks were removed (they kept dev from ever scaling to zero). Runs when
  # either service rolled. Unauthenticated, it writes nothing.
  sign-in-smoke:
    name: First-Party Sign-In Smoke (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~20 s
    needs: [resolve-images, deploy-api, deploy-frontend]
    if: ${{ !cancelled() && needs.resolve-images.outputs.gcp_configured == 'true' && (needs.deploy-api.result == 'success' || needs.deploy-frontend.result == 'success') }}

    steps:
      # Before auth: checkout cleans the workspace, which would delete the
      # credentials file auth writes there.
      - name: Checkout (smoke script)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Probe sign-in on every accepted and serving origin
        env:
          SIGN_IN_SMOKE_SERVICE: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          SIGN_IN_SMOKE_FRONTEND_SERVICE: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          SIGN_IN_SMOKE_REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: ./scripts/ci/first-party-sign-in-smoke.sh

  # ---------------------------------------------------------------------------
  # Update seed job images (without executing them)
  # ---------------------------------------------------------------------------
  # After both rolls, never beside them (carnet#696): the seed jobs open Cloud
  # SQL connections, and running them while the API cold-starts is the same
  # slot exhaustion the waits above prevent. Like publish-images.yml's seed-dev,
  # they run against the image the API now serves, so only once it deployed.
  update-seed-jobs:
    name: Update Seed Job Images
    runs-on: ubuntu-latest
    timeout-minutes: 10  # gcloud job image updates
    needs: [resolve-images, deploy-api, deploy-frontend]
    if: ${{ !cancelled() && needs.resolve-images.outputs.gcp_configured == 'true' && needs.deploy-api.result == 'success' }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Update seed job images
        run: |
          IMAGE="${{ needs.resolve-images.outputs.registry }}/server:${{ needs.resolve-images.outputs.short_sha }}"
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          echo "Updating seed job images with: ${IMAGE}"

          JOBS="seed-bootstrap seed-coaches seed-mobility"
          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            JOBS="$JOBS seed-synthetic"
          fi

          for JOB in $JOBS; do
            JOB_NAME="${SERVICE}-${JOB}"
            echo "Updating ${JOB_NAME}..."
            gcloud run jobs update "${JOB_NAME}" \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --quiet
          done

          echo "All seed job images updated successfully"

  # ---------------------------------------------------------------------------
  # Execute seed jobs post-update and fail deploy if any job exits non-zero.
  # Option B chosen: separate job from update-seed-jobs so the image update
  # (idempotent, fast) is decoupled from execution (slow, runtime-failure-prone).
  # Background: 2026-05-25 audit revealed c6630e46 silently broke seed-coaches
  # for 3.5 weeks because the prior pipeline only swapped images, never executed.
  # ---------------------------------------------------------------------------
  verify-seed-jobs:
    name: Execute Seed Jobs (smoke)
    runs-on: ubuntu-latest
    needs: [resolve-images, update-seed-jobs]
    # Explicit: a defaulted success() goes false when deploy-frontend, an
    # ancestor through update-seed-jobs, failed or was skipped.
    if: ${{ !cancelled() && needs.resolve-images.outputs.gcp_configured == 'true' && needs.update-seed-jobs.result == 'success' }}
    timeout-minutes: 45

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Execute seed jobs and assert success
        run: |
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          # seed-bootstrap, seed-coaches, seed-mobility are infra-critical and
          # run unconditionally; seed-synthetic mirrors update-seed-jobs gating.
          JOBS="seed-bootstrap seed-coaches seed-mobility"
          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            JOBS="$JOBS seed-synthetic"
          fi

          FAILED_JOBS=""
          for JOB in $JOBS; do
            JOB_NAME="${SERVICE}-${JOB}"
            echo "::group::Executing ${JOB_NAME}"
            # 10-minute per-job cap so a hung execution doesn't pin the deploy.
            if timeout 600 gcloud run jobs execute "${JOB_NAME}" \
                --region="${REGION}" \
                --wait \
                --quiet; then
              echo "${JOB_NAME} completed successfully"
            else
              EXIT_CODE=$?
              echo "::error::${JOB_NAME} failed with exit code ${EXIT_CODE}"
              FAILED_JOBS="${FAILED_JOBS} ${JOB_NAME}"
            fi
            echo "::endgroup::"
          done

          if [ -n "${FAILED_JOBS}" ]; then
            echo "::error::Seed job execution failed for:${FAILED_JOBS}"
            exit 1
          fi

          echo "All seed jobs executed successfully"

  # ---------------------------------------------------------------------------
  # Workflow completion summary
  # ---------------------------------------------------------------------------
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5  # writes the summary
    needs: [deploy-api, deploy-frontend, sign-in-smoke, update-seed-jobs, verify-seed-jobs]
    if: always()

    steps:
      - name: Report deployment status
        run: |
          echo "Deployment workflow completed"
          echo "Backend API deployment: ${{ needs.deploy-api.result }}"
          echo "Frontend deployment: ${{ needs.deploy-frontend.result }}"
          echo "Sign-in smoke: ${{ needs.sign-in-smoke.result }}"
          echo "Seed job updates: ${{ needs.update-seed-jobs.result }}"
          echo "Seed job execution: ${{ needs.verify-seed-jobs.result }}"

          if [[ "${{ needs.deploy-api.result }}" == "success" && \
                "${{ needs.deploy-frontend.result }}" == "success" && \
                "${{ needs.sign-in-smoke.result }}" == "success" && \
                "${{ needs.update-seed-jobs.result }}" == "success" && \
                "${{ needs.verify-seed-jobs.result }}" == "success" ]]; then
            echo "All deployments completed successfully"
            exit 0
          else
            echo "One or more deployments failed"
            exit 1
          fi
