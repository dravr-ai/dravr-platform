# ABOUTME: Maestro E2E tests for iOS via Expo Go on iOS Simulator
# ABOUTME: Builds Pierre server for macOS, boots simulator, runs Maestro test suites
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "CI: Mobile E2E (iOS)"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'frontend-mobile/**'
      # Only the shared packages frontend-mobile depends on. `packages/**` would put
      # a macOS runner (billed at 10x) on every push to mcp-types, scene-types or the
      # eslint/tsconfig configs, which the app does not consume.
      - 'packages/api-client/**'
      - 'packages/chat-utils/**'
      - 'packages/domain-utils/**'
      - 'packages/i18n/**'
      - 'packages/shared-constants/**'
      - 'packages/shared-types/**'
      - 'packages/ui-logic/**'
      - 'scripts/ci/mobile-e2e-batch.sh'
      # The e2e job opens the app through this helper's ios_sim_open_in_expo_go.
      - 'bin/ios-simulator.sh'
      # The control process the onboarding group flow asks for coaches and the
      # coach plan-thread flow for its seeded pairs, the scraper double it
      # connects coaches through, and the seeders behind the verdict-sheet and
      # coach plan-thread flows.
      - 'frontend/e2e-real/sciotte-double.ts'
      - 'frontend/e2e-real/home-sync-control.ts'
      - 'frontend/e2e-real/onboarding-coach.ts'
      - 'frontend/e2e-real/coach-plan-thread.ts'
      - 'crates/pierre-seeders/src/verdict_conversation.rs'
      - 'crates/pierre-seeders/src/coach_plan_thread.rs'
      - 'crates/pierre-seeders/src/coached_group.rs'
      - '.github/workflows/mobile-e2e-ios.yml'
  schedule:
    - cron: '4 6 * * *'  # 06:04 UTC nightly (02:04 EDT / 01:04 EST)
  workflow_dispatch:

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. Without the
  # sha this lane would lose verdicts the moment it gained a push trigger: a burst
  # of mobile pushes would cancel each other's e2e run (carnet#169 on ci-postgres).
  # `github.event_name` is in the group for the mirror-image reason: a scheduled or
  # dispatched run on main carries the TIP's sha, so without it the 06:04 cron joins
  # the tip's push-run group and kills that verdict mid-flight (ci-backend.yml records
  # the same collision on 2026-08-31).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  build-server:
    name: Build Server (macOS)
    # Pinned, not `macos-latest`: the e2e-tests job below needs an Xcode that
    # Maestro's XCUITest driver supports, and `macos-latest` rolled to
    # macos-26-arm64 (which ships no Xcode 16.x) on 2026-07-15, hanging the
    # suite for 150 minutes. Both jobs stay on one pinned image so the server
    # binary this job builds and the simulator that runs it never disagree on
    # architecture. Re-pin deliberately, with a Maestro compatibility check.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      # Restored on every run, saved only by the nightly scheduled run on main
      # (see .github/actions/rust-setup for why a cache is saved once a day).
      # No bare `macOS-cargo-` fallback: it matched any family on any
      # toolchain (carnet#1114).
      - name: Restore Rust build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-server-1.99.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mobile-server-1.99.1-

      - name: Build Pierre server (release)
        run: cargo build --release
        env:
          CARGO_INCREMENTAL: 0

      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-server-1.99.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: pierre-server-macos
          path: |
            target/release/pierre-mcp-server
            target/release/pierre-cli
          retention-days: 1

  e2e-tests:
    name: Maestro E2E
    needs: build-server
    # macos-15 ships Xcode 16.3 (16E140) + 16.2, which the Select Xcode step
    # below requires. See the build-server pin for why this is not
    # `macos-latest`.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # The "Run Maestro tests" step's timeout-minutes, read there and by its
      # script, whose lane deadline it is the budget of.
      E2E_STEP_TIMEOUT_MINUTES: "105"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No "Configure git for private deps" step here, deliberately. This job
      # builds no Rust (it downloads build-server's binaries) and no
      # package.json in the bun installs below resolves to a private git
      # remote, so the global url.insteadOf rewrite had no consumer — while
      # rewriting https://github.com/ out from under the credentials
      # actions/checkout injects for the private dravr-contremaitre checkout
      # further down. That fetch then stalled instead of failing: 25
      # consecutive nightlies (2026-07-02 .. 2026-07-25) burned the full
      # timeout-minutes and reported "cancelled" with Maestro never running.
      # The rewrite stays in build-server, which cargo actually needs.

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: pierre-server-macos
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      # Spotlight indexes the runner's volumes for the whole job, and nothing in
      # it searches with Spotlight. In run 38436819123 this macos-15 runner
      # (7.5 GB) sat at 0% idle with a 1-minute load average of 436-729 in all
      # 55 samples of the test step, mds_stores and mdworker_shared were among
      # its top CPU users in 25 of them (up to 69% and 25%), and that is the
      # load the simulator's process launches stalled under (carnet#869). A
      # runner that refuses keeps indexing, and the warning says so.
      - name: Stop Spotlight indexing on the runner
        run: |
          sudo mdutil -a -i off \
            || echo "::warning title=Spotlight indexing still on::mdutil -a -i off failed; the runner keeps indexing during the tests"

      - name: Select Xcode 16.3
        run: |
          # Pin Xcode to 16.3 to avoid compatibility issues with Maestro's XCUITest
          # driver on Xcode 16.4+ (default since macOS-15 runner image 20260224).
          # Xcode 16.3 has the best compatibility with installed iOS 18.x runtimes
          # and Maestro's bundled idb_companion.
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.3.app/Contents/Developer
            echo "Selected Xcode 16.3"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
            echo "Selected Xcode 16.2 (fallback)"
          else
            # Do NOT fall through to the default toolchain. The pin above is
            # load-bearing: on an unpinned Xcode, Maestro's XCUITest driver
            # does not fail — it HANGS, and the job burns the full
            # timeout-minutes (150) before reporting as "cancelled", which
            # reads like an infra blip rather than a broken assumption.
            # That is exactly what happened on 2026-07-15 (run 29398664447)
            # when `macos-latest` rolled to macos-26-arm64, which ships no
            # Xcode 16.x at all. Fail here in seconds instead: a red step
            # naming the missing pin is worth 2.5 hours of silence.
            echo "ERROR: neither Xcode 16.3 nor 16.2 is present on this runner." >&2
            echo "The macos-latest image likely rolled forward. Re-pin this step" >&2
            echo "to an Xcode that Maestro's XCUITest driver supports, or pin" >&2
            echo "runs-on to an image that still ships one." >&2
            echo "=== Xcode installations actually present ===" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null >&2 || echo "(none)" >&2
            exit 1
          fi
          xcodebuild -version
          echo "=== Available Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install shared-types dependencies
        working-directory: packages/shared-types
        run: bun install

      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install

      - name: Remove expo-dev-client for E2E build
        working-directory: frontend-mobile
        run: |
          # Remove expo-dev-client from package.json BEFORE install
          # This package interferes with Maestro testing - its native code
          # tries to connect to a dev server that doesn't exist in CI
          cat package.json | jq 'del(.dependencies["expo-dev-client"])' > package.json.tmp
          mv package.json.tmp package.json

      - name: Install mobile dependencies
        working-directory: frontend-mobile
        run: bun install

      - name: Install Maestro CLI
        # `curl | bash` returns bash's status, so a curl that timed out handed
        # bash an empty script and this step reported success with no binary
        # installed; the lane then failed twenty minutes later with
        # "~/.maestro/bin/maestro: No such file or directory" (run 35615051309,
        # both attempts). pipefail surfaces curl's status, and running the
        # binary is the success marker — an install that produced nothing
        # runnable fails here, not in the smoke test.
        #
        # Pinned: the installer takes MAESTRO_VERSION and otherwise fetches
        # whatever released last, so a Maestro release could change this
        # lane's verdict with no commit here. The Android lane pins the same
        # version; move both together, after a local run on it.
        env:
          MAESTRO_VERSION: "2.10.0"
        run: |
          set -o pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $MAESTRO_VERSION was asked for and $installed was installed"
            exit 1
          fi
          echo "Maestro $installed"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Create data directory
        run: mkdir -p data

      - name: Start Pierre server
        run: |
          ./target/release/pierre-mcp-server > /tmp/pierre-server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/health > /dev/null; then
              echo "Server is healthy!"
              break
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          # The e2e control process registers each fresh account from this
          # runner's one address; the per-address sign-up window (5 a minute)
          # is pinned by the server's own tests, not by this lane.
          SIGN_UP_RATE_LIMIT_RPM: "100000"
          RUST_LOG: "info"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8081/auth/strava/callback"
          # No chain configured: the default Gemini head records this model on a
          # new conversation, and nothing behind it is required at boot.
          PIERRE_LLM_DEFAULT_MODEL: "ci-test-model"
          # onboarding/02's coaches connect Strava through a scripted stand-in
          # for the sciotte scraper on this port (the control process below).
          DRAVR_SCIOTTE_REMOTE_URL: "http://127.0.0.1:8097"
          # The app signs in on the hosted login page and returns to
          # exp://<host>:8082/--/auth/callback inside Expo Go, an address the
          # server sends dravr-mobile's code to only with this set (carnet#787).
          OAUTH_ALLOW_EXPO_GO_REDIRECT: "true"

      - name: Seed test user for Maestro tests
        run: |
          ./target/release/pierre-cli user create --email mobiletest@pierre.dev --password MobileTest1234 --force
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "warn"

      # chat/11 opens the verdict sheet of a reply the claim verifier judged.
      # This stack has no model to run a turn, so the reply and its verdict are
      # seeded: one supported verdict whose study is a DOI.
      - name: Seed the verdict conversation for Maestro tests
        run: |
          ./target/release/pierre-cli user create --email verdicttest@pierre.dev --password VerdictTest1234 --force
          ./target/release/pierre-cli seed verdict-conversation --email verdicttest@pierre.dev --model ci-test-model
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "warn"

      # onboarding/02 asks this process for fresh coaches over HTTP from its
      # runScript steps (Maestro runs on the host, so 127.0.0.1 reaches it): it
      # registers each one, approves it as the seeded tester (an admin) and
      # connects its Strava through the sciotte double it runs on 8097.
      # coach-plan/01 asks it for a fresh coach and athlete on every attempt,
      # made and seeded by the pierre-cli PIERRE_CLI names, with the server's
      # key and model.
      - name: Start the control process for the onboarding group and coach plan-thread flows
        working-directory: frontend
        run: |
          nohup bun e2e-real/home-sync-control.ts > /tmp/home-sync-control.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8098/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8098/health
        env:
          PIERRE_URL: "http://127.0.0.1:8081"
          SCIOTTE_DOUBLE_PORT: "8097"
          SCIOTTE_CONTROL_PORT: "8098"
          E2E_REAL_DATABASE_PATH: "${{ github.workspace }}/data/maestro-test.db"
          HOME_SYNC_EMAIL: "mobiletest@pierre.dev"
          HOME_SYNC_PASSWORD: "MobileTest1234"
          PIERRE_CLI: "${{ github.workspace }}/target/release/pierre-cli"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_LLM_DEFAULT_MODEL: "ci-test-model"

      # Bounded and non-interactive on purpose. The step's own auth (the token
      # below) is sound — the action's default-branch lookup succeeds — but the
      # git fetch that follows it is the step that hung for 150 minutes on
      # every nightly above. GIT_TERMINAL_PROMPT=0 turns a credential stall
      # into an immediate error naming the cause, and the step timeout caps
      # anything else at 5 minutes: a named red beats 2.5 hours of silence
      # that reads like an infra blip on the dashboard.
      - name: Checkout dravr-contremaitre for coach seed source
        uses: actions/checkout@v6
        timeout-minutes: 5
        env:
          GIT_TERMINAL_PROMPT: "0"
        with:
          repository: dravr-ai/dravr-contremaitre
          token: ${{ secrets.DRAVR_CONTREMAITRE_WRITE_TOKEN }}
          path: contremaitre

      - name: Seed system agents for Maestro tests
        run: |
          ./target/release/pierre-cli seed agents \
            --agents-dir "${{ github.workspace }}/contremaitre/prompts/agents"
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "info"

      - name: List available simulators and runtimes
        run: |
          echo "=== Installed simulator runtimes ==="
          xcrun simctl list runtimes
          echo ""
          echo "=== Available iPhone devices ==="
          xcrun simctl list devices available | grep -i "iphone"
          echo ""
          echo "=== All available devices ==="
          xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          # Prefer iOS 18.x, the runtime Maestro's XCUITest driver is proven on
          # with Xcode 16.3. Expo Go for SDK 57 runs there: `expo start --ios`
          # installs 57.0.9 (api.expo.dev/v2/versions, sdkVersions["57.0.0"]),
          # whose simulator build declares MinimumOSVersion 16.4, links the iOS
          # 26.4 simulator SDK and ships arm64 and x86_64 slices.
          RUNTIME=$(xcrun simctl list runtimes | grep -i "ios 18" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+' || true)
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep -i "ios" | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+' || true)
          fi
          echo "Selected runtime: $RUNTIME"

          # Try to find an existing device first
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro (" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          fi
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          fi

          # If no device found, create one with the selected runtime
          if [ -z "$SIMULATOR_UDID" ] && [ -n "$RUNTIME" ]; then
            echo "No existing iPhone simulator found, creating one..."
            SIMULATOR_UDID=$(xcrun simctl create "iPhone-E2E" "iPhone 16 Pro" "$RUNTIME" 2>/dev/null) || \
            SIMULATOR_UDID=$(xcrun simctl create "iPhone-E2E" "iPhone 16" "$RUNTIME" 2>/dev/null) || true
          fi

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No iPhone simulator found and could not create one!"
            echo "Available runtimes:"
            xcrun simctl list runtimes
            echo "Available device types:"
            xcrun simctl list devicetypes | grep -i iphone
            exit 1
          fi
          echo "Booting simulator: $SIMULATOR_UDID"

          # Disable hardware keyboard BEFORE boot so Maestro types through
          # the software keyboard. XCUITest's direct text insertion (used when
          # hardware keyboard is connected) bypasses React Native's onChangeText
          # handler in Expo Go, causing inputText commands to silently fail.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

          xcrun simctl boot "$SIMULATOR_UDID" || echo "Simulator may already be booted"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> $GITHUB_ENV

          # Disable password AutoFill prompts. iOS shows a "Save Password?" dialog
          # after login form submission with secureTextEntry fields. This native dialog
          # blocks the entire RN accessibility tree, causing Maestro to fail on
          # any post-login element assertions.
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write -globalDomain AutoFillPasswords -bool false 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.WebUI AutoFillPasswords -bool false 2>/dev/null || true

          # Expo Go's developer-menu preferences live in the app's sandboxed
          # container (not NSGlobalDomain), so they are written after Expo Go is
          # installed, in "Suppress Expo Go developer menu onboarding and tools
          # button" below. Combined with clearKeychain (instead of clearState) in
          # Maestro, they persist across test runs.

      - name: Adapt Maestro tests for Expo Go
        run: |
          # Replace native app ID with Expo Go app ID in all Maestro YAML files.
          # The checked-in helpers (launch-app, login, dismiss-*) already use
          # host.exp.Exponent natively; this sed catches remaining test files and
          # other helpers that still use the native bundle ID ai.dravr.app.
          find frontend-mobile/.maestro -name "*.yaml" -exec sed -i '' 's/appId: ai.dravr.app/appId: host.exp.Exponent/g' {} +
          echo "=== launch-app.yaml ==="
          cat frontend-mobile/.maestro/helpers/launch-app.yaml
          echo "=== login.yaml ==="
          cat frontend-mobile/.maestro/helpers/login.yaml

      - name: Strip Expo owner for CI
        working-directory: frontend-mobile
        run: |
          # Remove owner and eas config to avoid "Input is required" auth error in CI
          # The owner field triggers Expo CLI to verify project ownership, which needs
          # interactive login or EXPO_TOKEN that we don't have in CI
          # Using node for safe AST-aware modification (sed breaks brace matching)
          #
          # runtimeVersion goes too. Metro runs `expo-updates
          # runtimeversion:resolve` on EVERY manifest request, and the
          # fingerprint policy makes that command hash ~13,000 files of native
          # sources with nothing cached: 6 s on an idle machine, 16-60 s on
          # this runner, where Expo Go gives a manifest 60 s before "The
          # request timed out". That was the iOS lane's recurring red
          # (carnet#869): Expo Go sat on "Opening project…" in the smoke and
          # in flows that relaunch it. Without a runtimeVersion the command
          # returns without hashing and Metro falls back to the sdkVersion
          # policy, which is how Expo Go checks compatibility, so the manifest
          # it gets is the same app. The real app.config.js keeps the
          # fingerprint, which OTA safety needs in store builds.
          node << 'STRIP_EOF'
          const fs = require('fs');
          const config = require('./app.config.js');
          delete config.owner;
          if (config.extra) delete config.extra.eas;
          delete config.runtimeVersion;
          for (const platform of ['ios', 'android']) {
            if (config[platform]) delete config[platform].runtimeVersion;
          }
          const header = '// ABOUTME: Expo configuration for Pierre mobile app\n// ABOUTME: Uses Expo Go for development; CI-stripped owner, eas and runtimeVersion\n\n';
          fs.writeFileSync('app.config.js', header + 'module.exports = ' + JSON.stringify(config, null, 2) + ';\n');
          STRIP_EOF
          echo "=== app.config.js (stripped owner, eas, runtimeVersion) ==="
          if grep -nE '"(owner|eas|projectId|runtimeVersion)"' app.config.js; then
            echo "ERROR: a stripped field is still in app.config.js"
            exit 1
          fi
          # The check above also passes on a file that holds no config at all,
          # so the stripped config must still carry the app's slug.
          grep -q '"slug"' app.config.js || { echo "ERROR: the stripped app.config.js has no slug"; exit 1; }
          echo "owner, eas and runtimeVersion removed"

      - name: Start Metro, install Expo Go, and open app
        working-directory: frontend-mobile
        run: |
          # Phase 1: Use --ios to download and install Expo Go on the simulator.
          # The --ios flag also tries to open exp://<network-IP>:8082 which fails
          # (simulator can't reach the runner's network IP). When that openurl
          # times out, the expo process exits and kills Metro with it. We only
          # need --ios for the Expo Go installation, so we kill this process
          # after installation and restart Metro cleanly without --ios.
          echo "Phase 1: Installing Expo Go via expo start --ios..."
          npx expo start --go --ios --port 8082 2>&1 | tee /tmp/metro-install.log &
          INSTALL_PID=$!

          # Wait for Expo Go to be installed
          echo "Waiting for Expo Go to be installed..."
          for i in {1..90}; do
            if xcrun simctl get_app_container "$SIMULATOR_UDID" host.exp.Exponent 2>/dev/null; then
              echo "Expo Go is installed! (attempt $i)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: Expo Go installation timed out!"
              cat /tmp/metro-install.log
              exit 1
            fi
            sleep 2
          done

          # Kill the install process. Its openurl with the network IP will
          # eventually fail and crash Metro anyway, so terminate it now.
          echo "Killing install process (PID $INSTALL_PID)..."
          kill $INSTALL_PID 2>/dev/null || true
          wait $INSTALL_PID 2>/dev/null || true

          # Terminate Expo Go if it was launched by --ios (dismiss any dialogs)
          echo "Terminating Expo Go to dismiss system URL dialog..."
          xcrun simctl terminate "$SIMULATOR_UDID" host.exp.Exponent || true
          sleep 2

          # Phase 2: Start Metro cleanly WITHOUT --ios. This process stays
          # alive because it never attempts a failing openurl.
          echo "Phase 2: Starting Metro (without --ios)..."
          npx expo start --go --port 8082 2>&1 | tee /tmp/metro.log &
          echo "METRO_PID=$!" >> $GITHUB_ENV

          # Wait for Metro HTTP to be ready
          echo "Waiting for Metro to be ready..."
          for i in {1..90}; do
            if curl -s http://127.0.0.1:8082 > /dev/null 2>&1; then
              echo "Metro is ready! (attempt $i)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: Metro failed to start within 180s!"
              cat /tmp/metro.log
              exit 1
            fi
            sleep 2
          done

          # Warm the bundle BEFORE Expo Go asks for it. Expo Go gives the
          # bundle request ~60s; the cold Metro build of this app on the macOS
          # runner takes 80-100s (4454 modules since react-native-keyboard-
          # controller), so a cold open lands on "There was a problem running
          # the requested project. The request timed out" — the smoke's first
          # attempt then burns five minutes asserting a login screen that never
          # renders, and the 10-minute step cap cuts the retry that would have
          # hit the cache (3 of 5 main runs 2026-09-19..20). The manifest's
          # launchAsset.url is the exact URL Expo Go requests, query string
          # included, so the warm build is the cache hit it gets: the second
          # fetch is a "1 module" rebuild in well under a second. A manifest
          # without a launch asset means Metro is not serving this app, so
          # that fails here instead of ten minutes later.
          echo "Warming the iOS bundle before Expo Go opens it..."
          MANIFEST=$(curl -sf -H 'expo-platform: ios' \
            -H 'Accept: application/expo+json,application/json' \
            http://127.0.0.1:8082) || { echo "ERROR: Metro served no manifest"; exit 1; }
          BUNDLE_URL=$(printf '%s' "$MANIFEST" | jq -r '.launchAsset.url // empty')
          if [ -z "$BUNDLE_URL" ]; then
            echo "ERROR: manifest carries no launchAsset.url"
            printf '%s\n' "$MANIFEST" | head -c 2000
            exit 1
          fi
          echo "Bundle URL: $BUNDLE_URL"
          # The time Expo Go waits for its manifest, measured on a second
          # request (the first also loads Metro's config plugins). Expo Go
          # gives up at 60 s; carnet#869's red runs took 16-60 s here with the
          # fingerprint runtimeVersion in the config. The warning fires at
          # 10 s, under the fastest of those, so a manifest drifting back
          # toward the limit shows here before it fails a run.
          MANIFEST_START=$(date +%s)
          curl -sf -o /dev/null -H 'expo-platform: ios' \
            -H 'Accept: application/expo+json,application/json' \
            http://127.0.0.1:8082 || { echo "ERROR: Metro served no manifest on the second request"; exit 1; }
          MANIFEST_SECS=$(( $(date +%s) - MANIFEST_START ))
          echo "Manifest served in ${MANIFEST_SECS}s"
          if [ "$MANIFEST_SECS" -ge 10 ]; then
            echo "::warning title=Slow Expo manifest::Metro took ${MANIFEST_SECS}s to serve the manifest; Expo Go gives up at 60s (carnet#869)"
          fi
          WARM_START=$(date +%s)
          if ! curl -sf -o /dev/null "$BUNDLE_URL"; then
            echo "ERROR: bundle warm-up request failed"
            tail -30 /tmp/metro.log
            exit 1
          fi
          echo "Bundle warm in $(( $(date +%s) - WARM_START ))s"

          # Launch Expo Go first (opens to its home screen), THEN open the URL.
          # When Expo Go is already running, openurl forwards the URL directly
          # to the app without showing the iOS "Open in Expo Go?" dialog.
          # bin/ios-simulator.sh does both, as the dev scripts do, and retries
          # an openurl that timed out (exit 60) while Expo Go was still
          # starting: run 37946857280 ended here on that timeout, on an open
          # sent three seconds after the launch, with every flow still to run.
          # Any other failure, or a timeout on every attempt, ends this step
          # with simctl's own error above the annotation.
          # shellcheck source=../bin/ios-simulator.sh
          . ../bin/ios-simulator.sh
          echo "Opening exp://127.0.0.1:8082 in Expo Go on simulator $SIMULATOR_UDID..."
          OPEN_RC=0
          ios_sim_open_in_expo_go "$SIMULATOR_UDID" "exp://127.0.0.1:8082" || OPEN_RC=$?
          if [ "$OPEN_RC" -ne 0 ]; then
            echo "::error::Expo Go never took exp://127.0.0.1:8082: simctl openurl exited $OPEN_RC (its error is printed above)"
            exit "$OPEN_RC"
          fi

          # The warm-up above already put "Bundled" in the log, so this passes
          # on its first check; it stays as the guard for a Metro that died
          # between the warm-up and the open.
          echo "Waiting for JS bundle to compile..."
          for i in {1..180}; do
            if grep -q "Bundled" /tmp/metro.log 2>/dev/null; then
              echo "Bundle compiled! (waited ~$((i*2))s)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "ERROR: Bundle compilation timed out after 360s!"
              cat /tmp/metro.log
              exit 1
            fi
            sleep 2
          done

          # Give the app time to render after bundle loads
          sleep 15

          # Verify Metro is still alive
          if curl -s http://127.0.0.1:8082 > /dev/null 2>&1; then
            echo "Metro is still running - good!"
          else
            echo "ERROR: Metro died! Check /tmp/metro.log"
            tail -30 /tmp/metro.log
            exit 1
          fi

          echo "=== Metro log summary ==="
          grep -iE "bundled|error|warn" /tmp/metro.log | tail -10 || echo "No relevant messages"
        env:
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8081"

      - name: Suppress Expo Go developer menu onboarding and tools button
        run: |
          # Two preferences in Expo Go's sandboxed domain:
          # - EXDevMenuIsOnboardingFinished keeps the developer menu's
          #   onboarding overlay off the app.
          # - EXDevMenuShowFloatingActionButton=false. Once onboarding is
          #   finished, Expo Go 57 floats a developer-tools gear over the
          #   header's trailing buttons, where it takes chat/01's tap on "+".
          #   helpers/hide-dev-tools-button.yaml switches it off in-flow as
          #   well; writing it here means no flow depends on when it appears.
          # Both go through the simulator's cfprefsd (`simctl spawn … defaults`)
          # rather than into the plist file: cfprefsd caches the domain and
          # rewrote a PlistBuddy edit from that cache, even with Expo Go
          # stopped (iOS 27.0, 2026-09-25). Combined with clearKeychain (not
          # clearState) in Maestro, both persist across flows.
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_UDID" host.exp.Exponent data 2>/dev/null) || true
          if [ -z "$APP_CONTAINER" ]; then
            echo "WARNING: Could not find Expo Go app container - developer menu may appear"
            exit 0
          fi
          DOMAIN="$APP_CONTAINER/Library/Preferences/host.exp.Exponent"
          echo "Expo Go preferences domain: $DOMAIN"
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write "$DOMAIN" EXDevMenuIsOnboardingFinished -bool true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write "$DOMAIN" EXDevMenuShowFloatingActionButton -bool false
          for key in EXDevMenuIsOnboardingFinished EXDevMenuShowFloatingActionButton; do
            echo "$key=$(xcrun simctl spawn "$SIMULATOR_UDID" defaults read "$DOMAIN" "$key")"
          done

      - name: Debug - capture simulator state before tests
        if: always()
        run: |
          echo "=== Simulator UDID: $SIMULATOR_UDID ==="
          echo "=== Installed apps on simulator ==="
          xcrun simctl listapps "$SIMULATOR_UDID" 2>/dev/null | grep -A2 "CFBundleIdentifier" | head -30 || echo "Failed to list apps"
          echo ""
          echo "=== Simulator screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/pre-maestro-screenshot.png || echo "Screenshot failed"
          echo ""
          echo "=== Running processes ==="
          ps aux | grep -iE "expo|metro|node" | grep -v grep || echo "No relevant processes"
          echo ""
          echo "=== Check Metro ==="
          curl -s http://127.0.0.1:8082 | head -20 || echo "Metro not responding"
          echo ""
          echo "=== Check Pierre server ==="
          curl -s http://127.0.0.1:8081/health || echo "Server not responding"
          echo ""
          echo "=== Metro log (last 30 lines) ==="
          tail -30 /tmp/metro.log 2>/dev/null || echo "No metro log"
          echo ""
          echo "=== Expo install log (last 20 lines) ==="
          tail -20 /tmp/metro-install.log 2>/dev/null || echo "No expo install log"
          echo ""
          echo "=== Booted simulators ==="
          xcrun simctl list devices booted 2>/dev/null || echo "Failed to list booted devices"

      - name: Test Pierre API connectivity
        run: |
          echo "=== Health check ==="
          curl -sf http://127.0.0.1:8081/health && echo " OK" || echo " FAILED!"

          echo ""
          echo "=== Sign-in test (hosted login page, authorization code + PKCE) ==="
          # The app's own sign-in, headless: the password grant is gone (carnet#787).
          LOGIN_RESPONSE=$(scripts/auth/first-party-sign-in.sh http://127.0.0.1:8081 \
            mobiletest@pierre.dev MobileTest1234 dravr-mobile 2>&1) || true
          if echo "$LOGIN_RESPONSE" | grep -q "access_token"; then
            echo "Sign-in: SUCCESS (got access_token)"
          else
            echo "Sign-in: FAILED"
            echo "Response: $LOGIN_RESPONSE"
          fi

          echo ""
          echo "=== Network connectivity test ==="
          echo "IPv4 (127.0.0.1:8081):"
          curl -sf http://127.0.0.1:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"
          echo "IPv6 ([::1]:8081):"
          curl -sf http://[::1]:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"
          echo "localhost:8081:"
          curl -sf http://localhost:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"

      - name: Verify Metro is alive and app is loaded
        run: |
          echo "=== Metro process check ==="
          if ! pgrep -f "expo start" > /dev/null 2>&1; then
            echo "ERROR: Metro process is dead! Restarting..."
            cd frontend-mobile
            npx expo start --go --port 8082 2>&1 | tee /tmp/metro.log &
            echo "METRO_PID=$!" >> $GITHUB_ENV
            echo "Waiting for Metro to restart..."
            for i in {1..60}; do
              if curl -sf http://127.0.0.1:8082 > /dev/null 2>&1; then
                echo "Metro restarted OK (waited ~$((i*2))s)"
                break
              fi
              sleep 2
            done
          else
            echo "Metro process is alive"
          fi
          echo "=== Metro HTTP check ==="
          curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "Metro HTTP: OK" || echo "Metro HTTP: FAILED"
          echo "=== Re-open app via deep link ==="
          xcrun simctl openurl "$SIMULATOR_UDID" "exp://127.0.0.1:8082" 2>/dev/null || true
          echo "Waiting 15s for app to load..."
          sleep 15
          echo "=== Simulator screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/pre-smoke-screenshot.png 2>/dev/null && \
            echo "Screenshot captured" || echo "Screenshot failed"

      - name: Smoke test - verify Maestro can interact with app
        # The attempts get 570 s (the batch deadline below). The 150 s from
        # there to the 12-minute cap are the failure branch's: the runner's
        # 10 s kill grace to stop a running attempt, then the probes' bounds
        # (40 + 15 + 45 + 30 s). Without the deadline a smoke that wedges runs
        # to the cap, which kills the step before the branch below can print
        # what is on screen (carnet#869, run 38258837932).
        timeout-minutes: 12
        working-directory: frontend-mobile
        run: |
          SMOKE_START=$(date +%s)
          SMOKE_DEADLINE=$(( SMOKE_START + 570 ))
          MAESTRO="$HOME/.maestro/bin/maestro"
          echo "=== Maestro version ==="
          $MAESTRO --version || true

          echo ""
          echo "=== Running login screen smoke test (with retry) ==="
          # The retry is a real reset (terminate Expo Go, confirm Metro still
          # serves, relaunch, wait for the process), not a re-opened deep link
          # into whatever state the failed attempt left — see the runner's header
          # and carnet#443. Exit 2 means Metro is gone, which no retry fixes;
          # exit 3 means the deadline passed before the batch did, and an
          # attempt still running then was stopped where it wedged, leaving
          # that screen for the diagnostics.
          SMOKE_RC=0
          ../scripts/ci/mobile-e2e-batch.sh run --platform ios --maestro "$MAESTRO" \
            --device "$SIMULATOR_UDID" --label "smoke" --attempts 2 \
            --deadline "$SMOKE_DEADLINE" \
            --output maestro-smoke-results.xml --summary /tmp/maestro-smoke.env \
            -- .maestro/login/01-show-login-screen.yaml || SMOKE_RC=$?

          if [ "$SMOKE_RC" -ne 0 ]; then
            # Each probe gets its own bound, through perl's alarm because
            # stock macOS has no `timeout`, so one probe that hangs on a
            # wedged simulator cannot take the rest of the branch with it;
            # a probe that cannot start exits non-zero with the reason.
            bounded() { local secs="$1"; shift; perl -e 'alarm shift; exec @ARGV or die "cannot run $ARGV[0]: $!\n"' "$secs" "$@"; }
            echo ""
            echo "SMOKE TEST FAILED (runner rc=$SMOKE_RC)."
            echo ""
            echo "=== Diagnostics ==="
            echo "Xcode version: $(xcodebuild -version 2>&1 | head -1)"
            echo "Simulator runtimes:"
            xcrun simctl list runtimes | grep -i ios
            echo "Booted devices:"
            xcrun simctl list devices booted
            echo "Metro process:"
            pgrep -fa "expo start" || echo "Metro NOT running!"
            echo "Metro HTTP:"
            curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "OK" || echo "FAILED"
            echo "Metro log (last 50 lines):"
            tail -50 /tmp/metro.log 2>/dev/null || true
            # What is on screen, as text: every label in the view tree. A
            # flow that wedged on Expo Go's own loader or error page names
            # it here ("Opening project…", "There was a problem running the
            # requested project…") where the app's ids would otherwise be.
            echo "On-screen text (Maestro view hierarchy):"
            if bounded 40 "$MAESTRO" --device "$SIMULATOR_UDID" hierarchy > /tmp/smoke-hierarchy.json 2>&1; then
              LABELS=$(grep -oE '"(text|accessibilityText|title|resource-id)" *: *"[^"]+"' /tmp/smoke-hierarchy.json \
                | sort -u | head -80)
              echo "${LABELS:-(no labels in the hierarchy)}"
            else
              echo "(hierarchy exited $? — stopped at 40s if 142):"
              tail -20 /tmp/smoke-hierarchy.json
            fi
            # Why Expo Go does not load: its main thread, sampled from the
            # host (a simulator app is a host process), and its own log.
            EXPO_PID=""
            if bounded 15 xcrun simctl spawn "$SIMULATOR_UDID" launchctl list > /tmp/sim-launchctl.txt 2>&1; then
              EXPO_PID=$(awk '/host\.exp\.Exponent/ && $1 ~ /^[0-9]+$/ { print $1; exit }' /tmp/sim-launchctl.txt)
              [ -n "$EXPO_PID" ] || echo "Expo Go is not running."
            else
              echo "(launchctl list exited $? — stopped at 15s if 142; whether Expo Go runs is unknown):"
              tail -5 /tmp/sim-launchctl.txt
            fi
            if [ -n "$EXPO_PID" ]; then
              echo "Expo Go main thread (pid $EXPO_PID, sampled 3s):"
              bounded 45 sample "$EXPO_PID" 3 -mayDie -file /tmp/expo-go.sample.txt > /tmp/expo-go.sample.log 2>&1 \
                || echo "(sample exited $? — stopped at 45s if 142)"
              if grep -q 'com\.apple\.main-thread' /tmp/expo-go.sample.txt 2>/dev/null; then
                awk '/com\.apple\.main-thread/ { on = 1 } on && n++ < 60' /tmp/expo-go.sample.txt
              else
                tail -20 /tmp/expo-go.sample.log
              fi
            fi
            # The window opens at the step's start: one attempt can hold the
            # whole 570 s, and the load it never finished began at its start.
            echo "Expo Go log since the smoke began (last 80 lines):"
            bounded 30 xcrun simctl spawn "$SIMULATOR_UDID" log show \
              --last "$(( ($(date +%s) - SMOKE_START) / 60 + 1 ))m" --style compact \
              --predicate 'process CONTAINS[c] "expo"' > /tmp/expo-go.log 2>&1 \
              || echo "(log show exited $? — stopped at 30s if 142)"
            tail -80 /tmp/expo-go.log
            exit 1
          fi

      - name: Run Maestro tests
        # 105 (E2E_STEP_TIMEOUT_MINUTES): batch 2 carries the verdict-sheet,
        # coach-group and coach plan-thread flows (carnet#802/#740/#1069) beside
        # chat/01, and each batch may take a second attempt; 45 cut batch 2's
        # first attempt short on 2026-10-08, and 90 was sized before the plan
        # thread joined it (the derivation is at the attempt caps below). With
        # the ~13 min of setup before this step (run 38968652312) the job stays
        # well inside its 150. The batches do not run into this cap: each
        # attempt has its own and every batch the lane deadline below, so the
        # step ends with its batches judged and its summary written. Run
        # 38402697100 is why (carnet#869): batch 2's retry wrote its report at
        # 14:30:57, its maestro never exited, and this cap killed the step at
        # 15:16 with nothing judged or summarized.
        timeout-minutes: ${{ fromJSON(env.E2E_STEP_TIMEOUT_MINUTES) }}
        working-directory: frontend-mobile
        run: |
          MAESTRO="$HOME/.maestro/bin/maestro"
          STEP_START=$(date +%s)

          # Every batch stops at the lane deadline, 180 s inside this step's cap:
          # the runner's 10 s kill grace for an attempt still running there, the
          # judge, the merge and the summary below. A batch the deadline stopped
          # exits 3 with its report written, and the batches after it are not run.
          if [ -z "${E2E_STEP_TIMEOUT_MINUTES:-}" ]; then
            echo "E2E_STEP_TIMEOUT_MINUTES is not set: the lane deadline has no budget."
            exit 1
          fi
          LANE_DEADLINE=$(( STEP_START + E2E_STEP_TIMEOUT_MINUTES * 60 - 180 ))
          # Each attempt's cap, per batch. The complete attempts of 2026-10-13
          # took 590-625 s for batch 1 and 870-890 s for batch 2 (runs
          # 38392431568 and 38402697100), and batch 2's retry in 38402697100,
          # its chat/11 and onboarding/02 sheets blank, wrote its report after
          # 1156 s. A blank sheet fails its flow 240 s after the tap
          # (helpers/open-hosted-sign-in.yaml), and a stall that does not clear
          # blanks the sheets after it too (onboarding/02 waited 7+ min behind a
          # launch chat/11's sheet had issued). At each flow's slowest
          # start-to-tap time in those runs, an attempt whose every sheet stays
          # blank reports after ~1160 s in batch 1 (three sign-in flows after
          # login/01) and ~1190 s in batch 2. Each cap clears that: a capped
          # attempt records no flow result, so the stall would read as a
          # timeout instead of failing under its cause. Two capped attempts
          # leave batch 1 nothing passed and its fail-fast ends the lane, so the
          # longest batch 1 that batch 2 follows is a capped attempt with its
          # kill grace, a reset (60 s plus the 15 s settle) and a blank-sheet
          # one, its ~1160 s plus maestro's exit after the report (7.7-19.5 s
          # on those runs): 1330 + 75 + ~1175 = ~2580 s.
          #
          # coach-plan/01 joined batch 2 after those runs. It signs in once, as
          # chat/11 does, so until a run measures it it is costed at chat/11's
          # figures: 3.5-4.4 min complete (run 38968652312), and with its sheet
          # blank its start-to-tap plus the 240 s wait, ~340 s. A healthy batch 2
          # is then ~1160 s and one whose every sheet stays blank ~1530 s, which
          # the 1800 s cap clears. The 105 min step leaves batch 2 ~3540 s: an
          # attempt to its cap (1810 s with the grace), a reset and a ~1655 s
          # retry, more than a healthy attempt takes; past that the deadline
          # stops the retry.
          BATCH1_ATTEMPT_TIMEOUT=1320
          BATCH2_ATTEMPT_TIMEOUT=1800

          # carnet#869 cause C: the hosted sign-in sheet stays blank while its
          # WebKit process launch stalls, and Expo Go's own launches stalled
          # too (24-36 s) in run 38402697100 — process launch on the simulator
          # is what is slow, and Maestro's per-flow logs do not say why. Two
          # captures cover the whole of this step to say it: the
          # simulator's launch path (runningboardd, launchd, xpcproxy,
          # SafariViewService, WebKit's processes, ExtensionKit) and the host's
          # memory, swap, disk and CPU every 30 s, which puts several samples
          # inside any stall long enough to fail a flow's 240 s sheet wait.
          # Both are uploaded with the results, and stopped on every way out
          # of this step by the EXIT trap below. They are diagnostics: neither
          # can change this step's status, and every host probe is bounded so
          # a wedged one cannot stop the samples. The stream runs at info
          # level, which keeps default-level records: runningboardd's
          # "Creating and launching job" / "Submitting extension overlay" /
          # "Full encoding handle" records, the measurement, were all
          # default-level in run 38436819123 (203 of 203), and debug records
          # were 69% of that run's debug-level stream (220k of 321k) on a host
          # where diagnosticd, the daemon serving it, used the most CPU.
          bounded() { local secs="$1"; shift; perl -e 'alarm shift; exec @ARGV or die "cannot run $ARGV[0]: $!\n"' "$secs" "$@"; }
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact --level info \
            --predicate 'process == "runningboardd" OR process BEGINSWITH "launchd" OR process BEGINSWITH "xpcproxy" OR process == "SafariViewService" OR process BEGINSWITH "com.apple.WebKit" OR process == "extensionkitservice" OR subsystem == "com.apple.extensionkit"' \
            > /tmp/simulator-launches.log 2>&1 &
          # The sampler also ends on its own once this step's shell ($$ in the
          # subshell) is gone, so a step killed before its trap runs leaves no
          # sampler behind. top's first sample has no interval to measure CPU
          # over, so the second of two is kept; iostat's first line is the
          # average since boot.
          (
            set +e
            while kill -0 $$ 2>/dev/null; do
              echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              bounded 10 vm_stat
              bounded 10 memory_pressure -Q
              bounded 10 sysctl vm.swapusage
              bounded 10 iostat -c 2 -w 1
              bounded 15 top -l 2 -s 1 -o cpu -n 12 -stats pid,command,cpu,mem,state \
                | awk '/^Processes:/ { n++ } n == 2'
              bounded 10 ps -axwwo pid,stat,etime,command | grep -E '[W]ebContent|[x]pcproxy|[l]aunchd_sim'
              sleep 30
            done
          ) > /tmp/host-load.log 2>&1 &
          HOST_SAMPLER_PID=$!
          # Every command in the trap ends in || true: under the step's
          # `bash -e`, one failing in an EXIT trap replaces the step's exit
          # status with its own.
          stop_launch_diagnostics() {
            kill "$HOST_SAMPLER_PID" 2>/dev/null || true
            # The stream's `log` is a simulator process, which launchd_sim
            # starts on the host outside this step's process tree, so it is
            # stopped by its command line, with the xcrun that asked for it.
            pkill -f 'log stream --style compact --level info' 2>/dev/null || true
          }
          trap stop_launch_diagnostics EXIT

          # Every trigger runs the critical subset (decided 2026-09-05). The mode this
          # replaces ran one flow on a scheduled main run, and its critical branch had
          # never executed once — which is how three of its eleven entries came to name
          # files that do not exist (coach-wizard/01, coaches/01, social/01).
          #
          # The list below drops those three and the three that assert English copy
          # (settings/01, store/01, visual/02): the chrome defaults to fr, so they fail
          # on every platform until they assert by test id. What remains is measured
          # green on iOS only for login/01 (the nightly smoke); the rest pass on an
          # Android emulator and are expected, not proven, to pass here. The first
          # scheduled run after this lands is what turns that into evidence.
          # visual/01-authentication was deleted (Boreal v2.2 Phase 6): its render checks
          # are now covered by visual/00-capture.yaml, and its behavioral assertion lives
          # in login/07-invalid-credentials.yaml — wrong credentials keep the athlete on
          # the login screen. The password is typed on the server's hosted page now
          # (carnet#787), so login/02 opens that page and closes it, login/06 signs in
          # on it and login/07 is refused by it.
          # chat/11 reads the seeded verdict conversation (carnet#802) and
          # onboarding/02 signs in as fresh coaches from the control process
          # (carnet#740); both assert copy in English or French only.
          # coach-plan/01 publishes a coach's draft from their thread about an
          # athlete (carnet#1069/#1070). A retry re-runs the whole batch, flows
          # that passed included (run 38968652312 re-ran all three for one
          # failure), and publishing consumes the draft, so it asks the control
          # process for a new seeded pair on every attempt.
          echo "Running critical-path subset in two batches..."
          BATCH1_FILES="login/01-show-login-screen.yaml login/02-hosted-sign-in-page.yaml login/06-successful-login.yaml login/07-invalid-credentials.yaml"
          BATCH2_FILES="chat/01-basic-visibility.yaml chat/11-verdict-sheet.yaml onboarding/02-coach-group-step.yaml coach-plan/01-publish-draft-from-athlete-thread.yaml"
          BATCH_COUNT=2

          TOTAL_FAILURES=0
          TOTAL_PASSED=0
          OUT_OF_TIME=false
          for BATCH_NUM in $(seq 1 $BATCH_COUNT); do
            # Build the list of flow files for this batch
            FLOW_ARGS=""
            if [ "$BATCH_NUM" = "1" ]; then
              FILES="$BATCH1_FILES"
              ATTEMPT_TIMEOUT=$BATCH1_ATTEMPT_TIMEOUT
            else
              FILES="$BATCH2_FILES"
              ATTEMPT_TIMEOUT=$BATCH2_ATTEMPT_TIMEOUT
            fi
            for F in $FILES; do
              FLOW_ARGS="$FLOW_ARGS .maestro/$F"
            done

            echo ""
            echo "=== Batch $BATCH_NUM ==="
            echo "Files: $FLOW_ARGS"

            # One retry, for the same reason the smoke step above has two: this
            # simulator intermittently takes minutes to bring a screen up, and
            # the flow that loses the race is whichever one it lands on. The
            # run that last reported green failed 01-show-login-screen at
            # 4m28s with "login-screen is visible" and passed it on the retry;
            # the run after it failed 06-successful-login at 4m13s with the
            # same assertion, in this loop, which had no retry — so the lane's
            # colour was decided by which step the flake hit, not by the app.
            #
            # The runner resets the app between attempts (terminate, Metro
            # status check, relaunch, wait) and judges the batch on its BEST
            # attempt, so a retry that lands in a worse state cannot turn a
            # 2-of-3 into a 0-of-3 fail-fast (carnet#443, run 35211561989). A
            # flow that fails on every attempt is still counted and still reds
            # the lane. Every attempt's junit is kept under maestro-attempts/.
            # The runner counts a driver that exited non-zero without recording
            # a failure as one, so the totals below never read a dead maestro
            # as a clean batch. A maestro that wrote its report and then never
            # exits is stopped by the runner and judged on that report.
            BATCH_RC=0
            ../scripts/ci/mobile-e2e-batch.sh run --platform ios --maestro "$MAESTRO" \
              --device "$SIMULATOR_UDID" --label "Batch $BATCH_NUM" --attempts 2 \
              --attempt-timeout "$ATTEMPT_TIMEOUT" --deadline "$LANE_DEADLINE" \
              --output "maestro-results-batch${BATCH_NUM}.xml" \
              --summary "/tmp/maestro-batch${BATCH_NUM}.env" \
              -- $FLOW_ARGS || BATCH_RC=$?
            # shellcheck source=/dev/null
            . "/tmp/maestro-batch${BATCH_NUM}.env"
            BATCH_TESTS=$TESTS
            BATCH_PASSED=$PASSED
            BATCH_FAILS=$FAILS
            echo "Batch $BATCH_NUM: $BATCH_TESTS tests, $BATCH_PASSED passed, $BATCH_FAILS failures (attempt $BEST_ATTEMPT of $ATTEMPTS_RUN, maestro rc=$RC)"
            TOTAL_FAILURES=$((TOTAL_FAILURES + BATCH_FAILS))
            TOTAL_PASSED=$((TOTAL_PASSED + BATCH_PASSED))

            # Fail-fast: stop early if the environment is clearly broken.
            if [ "$BATCH_RC" -eq 2 ]; then
              echo "FAIL-FAST: Metro died during batch $BATCH_NUM — the remaining batches cannot run."
              break
            fi
            if [ "$BATCH_RC" -eq 3 ]; then
              echo "OUT OF TIME: the lane deadline passed during batch $BATCH_NUM — the remaining batches are not run."
              OUT_OF_TIME=true
              break
            fi
            if [ "$BATCH_PASSED" -eq 0 ] && [ "$BATCH_TESTS" -gt 0 ]; then
              echo "FAIL-FAST: Batch $BATCH_NUM had $BATCH_TESTS tests but 0 passed."
              break
            fi
            if [ "$BATCH_NUM" != "1" ] && [ "$BATCH_TESTS" -gt 0 ] && [ "$BATCH_FAILS" -gt "$BATCH_PASSED" ]; then
              echo "FAIL-FAST: Batch $BATCH_NUM had >50% failure rate ($BATCH_FAILS/$BATCH_TESTS)."
              break
            fi
          done

          # Merge results into single XML for artifact upload
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > maestro-results.xml
          for f in maestro-results-batch*.xml; do
            sed -n '/<testsuite/,/<\/testsuite>/p' "$f" >> maestro-results.xml 2>/dev/null || true
          done
          echo '</testsuites>' >> maestro-results.xml

          echo ""
          echo "Total test results: $TOTAL_PASSED passed, $TOTAL_FAILURES failed"

          # Write test summary to GitHub Step Summary for visibility
          echo "## iOS E2E Test Results (critical mode)" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $TOTAL_PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $TOTAL_FAILURES" >> $GITHUB_STEP_SUMMARY
          # A stall a cap cut short is otherwise invisible once its retry
          # passed; counting them shows how often attempts still stall.
          CAPPED_ATTEMPTS=$(grep -l 'was stopped before recording a result' maestro-attempts/maestro-results-batch*-attempt*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "- Attempts stopped by their batch's cap or the deadline before recording a result: $CAPPED_ATTEMPTS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUT_OF_TIME" = "true" ]; then
            echo "- The lane deadline passed during batch $BATCH_NUM of $BATCH_COUNT and stopped it; batches not run: $((BATCH_COUNT - BATCH_NUM))" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$TOTAL_FAILURES" -gt 0 ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            for f in maestro-results-batch*.xml; do
              grep '<failure' "$f" -B1 2>/dev/null | grep 'testcase name' | \
                sed 's/.*name="\([^"]*\)".*/- \1/' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            for f in maestro-results-batch*.xml; do
              grep -E '<testcase|<failure' "$f" 2>/dev/null | head -60 >> $GITHUB_STEP_SUMMARY || true
            done
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$TOTAL_FAILURES test(s) failed"
            exit 1
          fi
          # Flows the deadline left unrun verified nothing, whatever the
          # batches before them reported.
          if [ "$OUT_OF_TIME" = "true" ]; then
            echo "The lane deadline passed during batch $BATCH_NUM of $BATCH_COUNT."
            exit 1
          fi
        env:
          TEST_EMAIL: "mobiletest@pierre.dev"
          TEST_PASSWORD: "MobileTest1234"
          BACKEND_URL: "http://localhost:8081"

      - name: Post-test diagnostics
        if: always()
        run: |
          # The test step's simulator log stream stops with it, through its
          # EXIT trap; a step killed outright runs no trap, and the stream runs
          # outside its process tree, so it is stopped here as well, before the
          # upload reads its file. The host sampler ends with the step's shell.
          pkill -f 'log stream --style compact --level info' 2>/dev/null || true
          echo "=== Post-test screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/post-maestro-screenshot.png || echo "Screenshot failed"
          echo ""
          echo "=== Find Maestro failure screenshots ==="
          find $HOME/.maestro -name "*.png" -newer /tmp/metro.log 2>/dev/null | head -20 || echo "No screenshots found"
          # Copy any Maestro screenshots to a known location for upload
          mkdir -p /tmp/maestro-screenshots
          find $HOME/.maestro -name "*.png" -newer /tmp/metro.log -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true
          find /tmp -name "*maestro*" -name "*.png" 2>/dev/null | head -20 || true
          echo ""
          echo "=== Pierre server still running? ==="
          curl -sf http://127.0.0.1:8081/health && echo "Server: OK" || echo "Server: DOWN"
          echo ""
          echo "=== Metro still running? ==="
          curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "Metro: OK" || echo "Metro: DOWN"
          echo ""
          echo "=== Metro log (last 20 lines) ==="
          tail -20 /tmp/metro.log 2>/dev/null || echo "No metro log"
          echo ""
          echo "=== Pierre server log (login attempts) ==="
          grep -i "oauth\|token\|login\|auth\|password" /tmp/pierre-server.log 2>/dev/null | tail -30 || echo "No auth-related log entries"
          echo ""
          echo "=== Pierre server log (ALL HTTP requests - check for 401s after login) ==="
          grep -E "HTTP|status|401|403|500|error" /tmp/pierre-server.log 2>/dev/null | tail -50 || echo "No HTTP entries"
          echo ""
          echo "=== Pierre server log (errors) ==="
          grep -iE "error|fail|reject|invalid" /tmp/pierre-server.log 2>/dev/null | tail -20 || echo "No error entries"
          echo ""
          echo "=== Post-login API test (verify JWT works for subsequent calls) ==="
          JWT=$(scripts/auth/first-party-sign-in.sh http://127.0.0.1:8081 \
            mobiletest@pierre.dev MobileTest1234 dravr-mobile | jq -r '.access_token // empty') || true
          if [ -n "$JWT" ]; then
            echo "Got JWT token (length: ${#JWT})"
            echo "Testing GET /api/agents with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/agents \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
            echo ""
            echo "Testing GET /api/conversations with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/conversations \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
            echo ""
            echo "Testing GET /api/providers with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/providers \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
          else
            echo "FAILED to get JWT token"
          fi
          echo ""
          echo "=== Find takeScreenshot output files ==="
          find frontend-mobile -name "*.png" -newer /tmp/metro.log 2>/dev/null | head -20 || echo "No screenshots"
          # Copy Maestro takeScreenshot files to known location
          find frontend-mobile -name "*.png" -newer /tmp/metro.log -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-test-results-ios
          path: |
            frontend-mobile/maestro-results*.xml
            frontend-mobile/maestro-attempts/
            frontend-mobile/.maestro/
            /tmp/pre-maestro-screenshot.png
            /tmp/post-maestro-screenshot.png
            /tmp/maestro-screenshots/
            # Every flow's own folder (per-step screenshots, hierarchy, commands):
            # the flat copy above keeps one file per step name across all flows
            /Users/runner/.maestro/tests/
            /tmp/metro.log
            /tmp/metro-install.log
            /tmp/pierre-server.log
            /tmp/home-sync-control.log
            # The test step's process-launch log and host samples (carnet#869)
            /tmp/simulator-launches.log
            /tmp/host-load.log
          retention-days: 1
