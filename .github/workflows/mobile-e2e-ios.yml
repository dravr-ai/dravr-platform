# ABOUTME: Maestro E2E tests for iOS via Expo Go on iOS Simulator
# ABOUTME: Builds Pierre server for macOS, boots simulator, runs Maestro test suites
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "CI: Mobile E2E (iOS)"

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC nightly (02:00 EDT / 01:00 EST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-server:
    name: Build Server (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-server-1.94.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mobile-server-1.94.0-
            ${{ runner.os }}-cargo-

      - name: Build Pierre server (release)
        run: cargo build --release
        env:
          CARGO_INCREMENTAL: 0

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: pierre-server-macos
          path: |
            target/release/pierre-mcp-server
            target/release/pierre-cli
          retention-days: 1

  e2e-tests:
    name: Maestro E2E
    needs: build-server
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: pierre-server-macos
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Select Xcode 16.3
        run: |
          # Pin Xcode to 16.3 to avoid compatibility issues with Maestro's XCUITest
          # driver on Xcode 16.4+ (default since macOS-15 runner image 20260224).
          # Xcode 16.3 has the best compatibility with installed iOS 18.x runtimes
          # and Maestro's bundled idb_companion.
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.3.app/Contents/Developer
            echo "Selected Xcode 16.3"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
            echo "Selected Xcode 16.2 (fallback)"
          else
            echo "WARNING: Neither Xcode 16.3 nor 16.2 found, using default"
          fi
          xcodebuild -version
          echo "=== Available Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install shared-types dependencies
        working-directory: packages/shared-types
        run: bun install

      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install

      - name: Remove expo-dev-client for E2E build
        working-directory: frontend-mobile
        run: |
          # Remove expo-dev-client from package.json BEFORE install
          # This package interferes with Maestro testing - its native code
          # tries to connect to a dev server that doesn't exist in CI
          cat package.json | jq 'del(.dependencies["expo-dev-client"])' > package.json.tmp
          mv package.json.tmp package.json

      - name: Install mobile dependencies
        working-directory: frontend-mobile
        run: bun install

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Create data directory
        run: mkdir -p data

      - name: Start Pierre server
        run: |
          ./target/release/pierre-mcp-server > /tmp/pierre-server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/health > /dev/null; then
              echo "Server is healthy!"
              break
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          RUST_LOG: "info"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8081/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          PIERRE_LLM_MODEL: "ci-test-model"

      - name: Seed test user for Maestro tests
        run: |
          ./target/release/pierre-cli user create --email mobiletest@pierre.dev --password MobileTest1234 --force
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "warn"

      - name: Seed system coaches for Maestro tests
        run: |
          ./target/release/pierre-cli seed coaches
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/maestro-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          RUST_LOG: "info"

      - name: List available simulators and runtimes
        run: |
          echo "=== Installed simulator runtimes ==="
          xcrun simctl list runtimes
          echo ""
          echo "=== Available iPhone devices ==="
          xcrun simctl list devices available | grep -i "iphone"
          echo ""
          echo "=== All available devices ==="
          xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          # Find the oldest available iOS runtime (most stable with Maestro).
          # Prefer iOS 18.x over iOS 26.x for Expo Go SDK 55 compatibility.
          RUNTIME=$(xcrun simctl list runtimes | grep -i "ios 18" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+' || true)
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep -i "ios" | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+' || true)
          fi
          echo "Selected runtime: $RUNTIME"

          # Try to find an existing device first
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro (" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          fi
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-Fa-f-]{36}')
          fi

          # If no device found, create one with the selected runtime
          if [ -z "$SIMULATOR_UDID" ] && [ -n "$RUNTIME" ]; then
            echo "No existing iPhone simulator found, creating one..."
            SIMULATOR_UDID=$(xcrun simctl create "iPhone-E2E" "iPhone 16 Pro" "$RUNTIME" 2>/dev/null) || \
            SIMULATOR_UDID=$(xcrun simctl create "iPhone-E2E" "iPhone 16" "$RUNTIME" 2>/dev/null) || true
          fi

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No iPhone simulator found and could not create one!"
            echo "Available runtimes:"
            xcrun simctl list runtimes
            echo "Available device types:"
            xcrun simctl list devicetypes | grep -i iphone
            exit 1
          fi
          echo "Booting simulator: $SIMULATOR_UDID"

          # Disable hardware keyboard BEFORE boot so Maestro types through
          # the software keyboard. XCUITest's direct text insertion (used when
          # hardware keyboard is connected) bypasses React Native's onChangeText
          # handler in Expo Go, causing inputText commands to silently fail.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

          xcrun simctl boot "$SIMULATOR_UDID" || echo "Simulator may already be booted"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> $GITHUB_ENV

          # Disable password AutoFill prompts. iOS shows a "Save Password?" dialog
          # after login form submission with secureTextEntry fields. This native dialog
          # blocks the entire RN accessibility tree, causing Maestro to fail on
          # any post-login element assertions.
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write -globalDomain AutoFillPasswords -bool false 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.WebUI AutoFillPasswords -bool false 2>/dev/null || true

          # EXDevMenuIsOnboardingFinished must be set in the app's sandboxed container
          # (not NSGlobalDomain). We use PlistBuddy to write directly to the container's
          # preferences plist after Expo Go is installed. Combined with clearKeychain
          # (instead of clearState) in Maestro, this flag persists across test runs.

      - name: Adapt Maestro tests for Expo Go
        run: |
          # Replace native app ID with Expo Go app ID in all Maestro YAML files.
          # The checked-in helpers (launch-app, login, dismiss-*) already use
          # host.exp.Exponent natively; this sed catches remaining test files and
          # other helpers that still use the native bundle ID com.pierre.fitness.
          find frontend-mobile/.maestro -name "*.yaml" -exec sed -i '' 's/appId: com.pierre.fitness/appId: host.exp.Exponent/g' {} +
          echo "=== launch-app.yaml ==="
          cat frontend-mobile/.maestro/helpers/launch-app.yaml
          echo "=== login.yaml ==="
          cat frontend-mobile/.maestro/helpers/login.yaml

      - name: Strip Expo owner for CI
        working-directory: frontend-mobile
        run: |
          # Remove owner and eas config to avoid "Input is required" auth error in CI
          # The owner field triggers Expo CLI to verify project ownership, which needs
          # interactive login or EXPO_TOKEN that we don't have in CI
          # Using node for safe AST-aware modification (sed breaks brace matching)
          node << 'STRIP_EOF'
          const fs = require('fs');
          const config = require('./app.config.js');
          delete config.owner;
          if (config.extra) delete config.extra.eas;
          const header = '// ABOUTME: Expo configuration for Pierre mobile app\n// ABOUTME: Uses Expo Go for development; CI-stripped owner/eas fields\n\n';
          fs.writeFileSync('app.config.js', header + 'module.exports = ' + JSON.stringify(config, null, 2) + ';\n');
          STRIP_EOF
          echo "=== app.config.js (stripped owner/eas) ==="
          grep -n "owner\|eas\|projectId" app.config.js || echo "Owner/eas fields removed successfully"

      - name: Start Metro, install Expo Go, and open app
        working-directory: frontend-mobile
        run: |
          # Phase 1: Use --ios to download and install Expo Go on the simulator.
          # The --ios flag also tries to open exp://<network-IP>:8082 which fails
          # (simulator can't reach the runner's network IP). When that openurl
          # times out, the expo process exits and kills Metro with it. We only
          # need --ios for the Expo Go installation, so we kill this process
          # after installation and restart Metro cleanly without --ios.
          echo "Phase 1: Installing Expo Go via expo start --ios..."
          npx expo start --go --ios --port 8082 2>&1 | tee /tmp/metro-install.log &
          INSTALL_PID=$!

          # Wait for Expo Go to be installed
          echo "Waiting for Expo Go to be installed..."
          for i in {1..90}; do
            if xcrun simctl get_app_container "$SIMULATOR_UDID" host.exp.Exponent 2>/dev/null; then
              echo "Expo Go is installed! (attempt $i)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: Expo Go installation timed out!"
              cat /tmp/metro-install.log
              exit 1
            fi
            sleep 2
          done

          # Kill the install process. Its openurl with the network IP will
          # eventually fail and crash Metro anyway, so terminate it now.
          echo "Killing install process (PID $INSTALL_PID)..."
          kill $INSTALL_PID 2>/dev/null || true
          wait $INSTALL_PID 2>/dev/null || true

          # Terminate Expo Go if it was launched by --ios (dismiss any dialogs)
          echo "Terminating Expo Go to dismiss system URL dialog..."
          xcrun simctl terminate "$SIMULATOR_UDID" host.exp.Exponent || true
          sleep 2

          # Phase 2: Start Metro cleanly WITHOUT --ios. This process stays
          # alive because it never attempts a failing openurl.
          echo "Phase 2: Starting Metro (without --ios)..."
          npx expo start --go --port 8082 2>&1 | tee /tmp/metro.log &
          echo "METRO_PID=$!" >> $GITHUB_ENV

          # Wait for Metro HTTP to be ready
          echo "Waiting for Metro to be ready..."
          for i in {1..90}; do
            if curl -s http://127.0.0.1:8082 > /dev/null 2>&1; then
              echo "Metro is ready! (attempt $i)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: Metro failed to start within 180s!"
              cat /tmp/metro.log
              exit 1
            fi
            sleep 2
          done

          # Launch Expo Go first (opens to its home screen), THEN open the URL.
          # When Expo Go is already running, openurl forwards the URL directly
          # to the app without showing the iOS "Open in Expo Go?" dialog.
          echo "Launching Expo Go on simulator $SIMULATOR_UDID..."
          xcrun simctl launch "$SIMULATOR_UDID" host.exp.Exponent
          sleep 3

          echo "Opening deep link with 127.0.0.1..."
          xcrun simctl openurl "$SIMULATOR_UDID" "exp://127.0.0.1:8082"

          # Wait for the JS bundle to compile (can take 30s-5min depending on CI runner)
          echo "Waiting for JS bundle to compile..."
          for i in {1..180}; do
            if grep -q "Bundled" /tmp/metro.log 2>/dev/null; then
              echo "Bundle compiled! (waited ~$((i*2))s)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "ERROR: Bundle compilation timed out after 360s!"
              cat /tmp/metro.log
              exit 1
            fi
            sleep 2
          done

          # Give the app time to render after bundle loads
          sleep 15

          # Verify Metro is still alive
          if curl -s http://127.0.0.1:8082 > /dev/null 2>&1; then
            echo "Metro is still running - good!"
          else
            echo "ERROR: Metro died! Check /tmp/metro.log"
            tail -30 /tmp/metro.log
            exit 1
          fi

          echo "=== Metro log summary ==="
          grep -iE "bundled|error|warn" /tmp/metro.log | tail -10 || echo "No relevant messages"
        env:
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8081"

      - name: Suppress Expo Go developer menu onboarding
        run: |
          # Write EXDevMenuIsOnboardingFinished directly to Expo Go's sandboxed
          # preferences plist. This prevents the developer menu overlay from appearing.
          # Combined with clearKeychain (not clearState) in Maestro, the flag persists.
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_UDID" host.exp.Exponent data 2>/dev/null) || true
          if [ -n "$APP_CONTAINER" ]; then
            PLIST="$APP_CONTAINER/Library/Preferences/host.exp.Exponent.plist"
            echo "App container: $APP_CONTAINER"
            echo "Plist path: $PLIST"
            # Ensure Preferences directory exists
            mkdir -p "$(dirname "$PLIST")"
            # Create or update the flag
            if [ -f "$PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Set :EXDevMenuIsOnboardingFinished true" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :EXDevMenuIsOnboardingFinished bool true" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :EXDevMenuIsOnboardingFinished bool true" "$PLIST"
            fi
            echo "EXDevMenuIsOnboardingFinished set to true"
            /usr/libexec/PlistBuddy -c "Print :EXDevMenuIsOnboardingFinished" "$PLIST" || echo "Verification failed"
          else
            echo "WARNING: Could not find Expo Go app container - developer menu may appear"
          fi

      - name: Debug - capture simulator state before tests
        if: always()
        run: |
          echo "=== Simulator UDID: $SIMULATOR_UDID ==="
          echo "=== Installed apps on simulator ==="
          xcrun simctl listapps "$SIMULATOR_UDID" 2>/dev/null | grep -A2 "CFBundleIdentifier" | head -30 || echo "Failed to list apps"
          echo ""
          echo "=== Simulator screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/pre-maestro-screenshot.png || echo "Screenshot failed"
          echo ""
          echo "=== Running processes ==="
          ps aux | grep -iE "expo|metro|node" | grep -v grep || echo "No relevant processes"
          echo ""
          echo "=== Check Metro ==="
          curl -s http://127.0.0.1:8082 | head -20 || echo "Metro not responding"
          echo ""
          echo "=== Check Pierre server ==="
          curl -s http://127.0.0.1:8081/health || echo "Server not responding"
          echo ""
          echo "=== Metro log (last 30 lines) ==="
          tail -30 /tmp/metro.log 2>/dev/null || echo "No metro log"
          echo ""
          echo "=== Expo install log (last 20 lines) ==="
          tail -20 /tmp/expo-install.log 2>/dev/null || echo "No expo install log"
          echo ""
          echo "=== Booted simulators ==="
          xcrun simctl list devices booted 2>/dev/null || echo "Failed to list booted devices"

      - name: Test Pierre API connectivity
        run: |
          echo "=== Health check ==="
          curl -sf http://127.0.0.1:8081/health && echo " OK" || echo " FAILED!"

          echo ""
          echo "=== Login API test (OAuth token endpoint) ==="
          LOGIN_RESPONSE=$(curl -sf -X POST http://127.0.0.1:8081/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password&username=mobiletest@pierre.dev&password=MobileTest1234" 2>&1) || true
          if echo "$LOGIN_RESPONSE" | grep -q "access_token"; then
            echo "Login API: SUCCESS (got access_token)"
          else
            echo "Login API: FAILED"
            echo "Response: $LOGIN_RESPONSE"
          fi

          echo ""
          echo "=== Network connectivity test ==="
          echo "IPv4 (127.0.0.1:8081):"
          curl -sf http://127.0.0.1:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"
          echo "IPv6 ([::1]:8081):"
          curl -sf http://[::1]:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"
          echo "localhost:8081:"
          curl -sf http://localhost:8081/health > /dev/null 2>&1 && echo "  Reachable" || echo "  NOT reachable"

      - name: Verify Metro is alive and app is loaded
        run: |
          echo "=== Metro process check ==="
          if ! pgrep -f "expo start" > /dev/null 2>&1; then
            echo "ERROR: Metro process is dead! Restarting..."
            cd frontend-mobile
            npx expo start --go --port 8082 2>&1 | tee /tmp/metro.log &
            echo "METRO_PID=$!" >> $GITHUB_ENV
            echo "Waiting for Metro to restart..."
            for i in {1..60}; do
              if curl -sf http://127.0.0.1:8082 > /dev/null 2>&1; then
                echo "Metro restarted OK (waited ~$((i*2))s)"
                break
              fi
              sleep 2
            done
          else
            echo "Metro process is alive"
          fi
          echo "=== Metro HTTP check ==="
          curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "Metro HTTP: OK" || echo "Metro HTTP: FAILED"
          echo "=== Re-open app via deep link ==="
          xcrun simctl openurl "$SIMULATOR_UDID" "exp://127.0.0.1:8082" 2>/dev/null || true
          echo "Waiting 15s for app to load..."
          sleep 15
          echo "=== Simulator screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/pre-smoke-screenshot.png 2>/dev/null && \
            echo "Screenshot captured" || echo "Screenshot failed"

      - name: Smoke test - verify Maestro can interact with app
        timeout-minutes: 10
        working-directory: frontend-mobile
        run: |
          MAESTRO="$HOME/.maestro/bin/maestro"
          echo "=== Maestro version ==="
          $MAESTRO --version || true

          echo ""
          echo "=== Running login screen smoke test (with retry) ==="
          SMOKE_PASSED=false
          for ATTEMPT in 1 2; do
            echo "--- Smoke test attempt $ATTEMPT ---"
            if $MAESTRO test --device "$SIMULATOR_UDID" \
              .maestro/login/01-show-login-screen.yaml \
              --format junit --output maestro-smoke-results.xml; then
              SMOKE_PASSED=true
              echo "Smoke test PASSED on attempt $ATTEMPT."
              break
            fi
            echo "Attempt $ATTEMPT failed."
            if [ "$ATTEMPT" -lt 2 ]; then
              echo "Re-opening app and retrying in 15s..."
              xcrun simctl openurl "$SIMULATOR_UDID" "exp://127.0.0.1:8082" 2>/dev/null || true
              sleep 15
            fi
          done

          if [ "$SMOKE_PASSED" = "false" ]; then
            echo ""
            echo "SMOKE TEST FAILED after 2 attempts."
            echo ""
            echo "=== Diagnostics ==="
            echo "Xcode version: $(xcodebuild -version 2>&1 | head -1)"
            echo "Simulator runtimes:"
            xcrun simctl list runtimes | grep -i ios
            echo "Booted devices:"
            xcrun simctl list devices booted
            echo "Metro process:"
            pgrep -fa "expo start" || echo "Metro NOT running!"
            echo "Metro HTTP:"
            curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "OK" || echo "FAILED"
            echo "Metro log (last 50 lines):"
            tail -50 /tmp/metro.log 2>/dev/null || true
            echo "Maestro hierarchy (what Maestro can see):"
            timeout 30 $MAESTRO --device "$SIMULATOR_UDID" hierarchy 2>&1 | head -100 || echo "Hierarchy failed/timed out"
            exit 1
          fi

      - name: Run Maestro tests
        timeout-minutes: 45
        working-directory: frontend-mobile
        run: |
          MAESTRO="$HOME/.maestro/bin/maestro"
          # Push to main runs only the smoke test (already validated above).
          # Branch pushes and manual triggers run the critical-path subset (~11 tests).
          SUITE_MODE="${{ (github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main') && 'critical' || 'smoke' }}"
          echo "Suite mode: $SUITE_MODE (event=${{ github.event_name }}, ref=${{ github.ref }})"

          if [ "$SUITE_MODE" = "critical" ]; then
            echo "Running critical-path subset (~11 tests) in two batches..."
            # Batch 1: Login flow (validates auth works end-to-end)
            # Batch 2: One test from each feature area (validates post-login features)
            BATCH1_FILES="login/01-show-login-screen.yaml login/02-show-email-password-inputs.yaml login/06-successful-login.yaml"
            BATCH2_FILES="settings/01-screen-rendering.yaml chat/01-basic-visibility.yaml coaches/01-basic-rendering.yaml store/01-basic-rendering.yaml coach-wizard/01-wizard-navigation.yaml social/01-friends-screen.yaml visual/01-authentication.yaml visual/02-home-screen.yaml"
            BATCH_COUNT=2
          else
            echo "Push to main: smoke test already validated the environment."
            if [ -f maestro-smoke-results.xml ]; then
              cp maestro-smoke-results.xml maestro-results.xml
            else
              echo '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > maestro-results.xml
            fi
            exit 0
          fi

          TOTAL_FAILURES=0
          TOTAL_PASSED=0
          for BATCH_NUM in $(seq 1 $BATCH_COUNT); do
            # Build the list of flow files for this batch
            FLOW_ARGS=""
            if [ "$BATCH_NUM" = "1" ]; then FILES="$BATCH1_FILES"
            else FILES="$BATCH2_FILES"; fi
            for F in $FILES; do
              FLOW_ARGS="$FLOW_ARGS .maestro/$F"
            done

            echo ""
            echo "=== Batch $BATCH_NUM ==="
            echo "Files: $FLOW_ARGS"

            $MAESTRO test --device "$SIMULATOR_UDID" $FLOW_ARGS \
              --format junit --output "maestro-results-batch${BATCH_NUM}.xml" || true

            # grep -c returns exit code 1 when no matches; assign separately to avoid
            # || echo "0" appending a second line that breaks arithmetic.
            BATCH_TESTS=$(grep -c '<testcase' "maestro-results-batch${BATCH_NUM}.xml" 2>/dev/null) || BATCH_TESTS=0
            BATCH_FAILS=$(grep -c '<failure' "maestro-results-batch${BATCH_NUM}.xml" 2>/dev/null) || BATCH_FAILS=0
            BATCH_PASSED=$((BATCH_TESTS - BATCH_FAILS))
            echo "Batch $BATCH_NUM: $BATCH_TESTS tests, $BATCH_PASSED passed, $BATCH_FAILS failures"
            TOTAL_FAILURES=$((TOTAL_FAILURES + BATCH_FAILS))
            TOTAL_PASSED=$((TOTAL_PASSED + BATCH_PASSED))

            # Fail-fast: stop early if the environment is clearly broken.
            if [ "$BATCH_PASSED" -eq 0 ] && [ "$BATCH_TESTS" -gt 0 ]; then
              echo "FAIL-FAST: Batch $BATCH_NUM had $BATCH_TESTS tests but 0 passed."
              break
            fi
            if [ "$BATCH_NUM" != "1" ] && [ "$BATCH_TESTS" -gt 0 ] && [ "$BATCH_FAILS" -gt "$BATCH_PASSED" ]; then
              echo "FAIL-FAST: Batch $BATCH_NUM had >50% failure rate ($BATCH_FAILS/$BATCH_TESTS)."
              break
            fi
          done

          # Merge results into single XML for artifact upload
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > maestro-results.xml
          for f in maestro-results-batch*.xml; do
            sed -n '/<testsuite/,/<\/testsuite>/p' "$f" >> maestro-results.xml 2>/dev/null || true
          done
          echo '</testsuites>' >> maestro-results.xml

          echo ""
          echo "Total test results: $TOTAL_PASSED passed, $TOTAL_FAILURES failed"

          # Write test summary to GitHub Step Summary for visibility
          echo "## iOS E2E Test Results ($SUITE_MODE mode)" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $TOTAL_PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $TOTAL_FAILURES" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_FAILURES" -gt 0 ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            for f in maestro-results-batch*.xml; do
              grep '<failure' "$f" -B1 2>/dev/null | grep 'testcase name' | \
                sed 's/.*name="\([^"]*\)".*/- \1/' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            for f in maestro-results-batch*.xml; do
              grep -E '<testcase|<failure' "$f" 2>/dev/null | head -60 >> $GITHUB_STEP_SUMMARY || true
            done
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$TOTAL_FAILURES test(s) failed"
            exit 1
          fi
        env:
          TEST_EMAIL: "mobiletest@pierre.dev"
          TEST_PASSWORD: "MobileTest1234"
          BACKEND_URL: "http://localhost:8081"

      - name: Post-test diagnostics
        if: always()
        run: |
          echo "=== Post-test screenshot ==="
          xcrun simctl io "$SIMULATOR_UDID" screenshot /tmp/post-maestro-screenshot.png || echo "Screenshot failed"
          echo ""
          echo "=== Find Maestro failure screenshots ==="
          find $HOME/.maestro -name "*.png" -newer /tmp/metro.log 2>/dev/null | head -20 || echo "No screenshots found"
          # Copy any Maestro screenshots to a known location for upload
          mkdir -p /tmp/maestro-screenshots
          find $HOME/.maestro -name "*.png" -newer /tmp/metro.log -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true
          find /tmp -name "*maestro*" -name "*.png" 2>/dev/null | head -20 || true
          echo ""
          echo "=== Pierre server still running? ==="
          curl -sf http://127.0.0.1:8081/health && echo "Server: OK" || echo "Server: DOWN"
          echo ""
          echo "=== Metro still running? ==="
          curl -sf http://127.0.0.1:8082 > /dev/null 2>&1 && echo "Metro: OK" || echo "Metro: DOWN"
          echo ""
          echo "=== Metro log (last 20 lines) ==="
          tail -20 /tmp/metro.log 2>/dev/null || echo "No metro log"
          echo ""
          echo "=== Pierre server log (login attempts) ==="
          grep -i "oauth\|token\|login\|auth\|password" /tmp/pierre-server.log 2>/dev/null | tail -30 || echo "No auth-related log entries"
          echo ""
          echo "=== Pierre server log (ALL HTTP requests - check for 401s after login) ==="
          grep -E "HTTP|status|401|403|500|error" /tmp/pierre-server.log 2>/dev/null | tail -50 || echo "No HTTP entries"
          echo ""
          echo "=== Pierre server log (errors) ==="
          grep -iE "error|fail|reject|invalid" /tmp/pierre-server.log 2>/dev/null | tail -20 || echo "No error entries"
          echo ""
          echo "=== Post-login API test (verify JWT works for subsequent calls) ==="
          JWT=$(curl -sf -X POST http://127.0.0.1:8081/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password&username=mobiletest@pierre.dev&password=MobileTest1234" 2>&1 | jq -r '.access_token // empty') || true
          if [ -n "$JWT" ]; then
            echo "Got JWT token (length: ${#JWT})"
            echo "Testing GET /api/coaches with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/coaches \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
            echo ""
            echo "Testing GET /api/conversations with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/conversations \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
            echo ""
            echo "Testing GET /api/providers with JWT:"
            curl -sf -w "HTTP %{http_code}" http://127.0.0.1:8081/api/providers \
              -H "Authorization: Bearer $JWT" 2>&1 | tail -1 || echo "FAILED"
          else
            echo "FAILED to get JWT token"
          fi
          echo ""
          echo "=== Find takeScreenshot output files ==="
          find frontend-mobile -name "*.png" -newer /tmp/metro.log 2>/dev/null | head -20 || echo "No screenshots"
          # Copy Maestro takeScreenshot files to known location
          find frontend-mobile -name "*.png" -newer /tmp/metro.log -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-test-results-ios
          path: |
            frontend-mobile/maestro-results*.xml
            frontend-mobile/.maestro/
            /tmp/pre-maestro-screenshot.png
            /tmp/post-maestro-screenshot.png
            /tmp/maestro-screenshots/
            /tmp/metro.log
            /tmp/expo-install.log
            /tmp/pierre-server.log
          retention-days: 7
