# ABOUTME: Weekly check for new releases of @github/copilot-linux-x64 npm package
# ABOUTME: Opens or updates a tracking issue when the Dockerfile pin drifts behind npm latest
name: "Monitor: Copilot CLI Version"

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: copilot-cli-version-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-copilot-cli:
    name: Check Copilot CLI Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read pinned version from Dockerfile
        id: pinned
        run: |
          DOCKERFILE=docker/images/server/Dockerfile
          PINNED=$(grep -E '^ARG COPILOT_CLI_VERSION=' "$DOCKERFILE" | head -1 | cut -d= -f2)
          if [ -z "$PINNED" ]; then
            echo "ERROR: COPILOT_CLI_VERSION ARG not found in $DOCKERFILE" >&2
            exit 1
          fi
          echo "version=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Pinned Copilot CLI version: $PINNED"

      - name: Fetch npm latest version
        id: latest
        run: |
          # npm view returns the string value of the dist-tag
          LATEST=$(npm view @github/copilot-linux-x64 version 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "ERROR: could not fetch npm latest version for @github/copilot-linux-x64" >&2
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "npm latest version: $LATEST"

      - name: Compare versions
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          if [ "$PINNED" = "$LATEST" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Pinned version matches npm latest — no issue needed"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected: pinned=$PINNED, latest=$LATEST"
          fi

      - name: Create or update tracking issue
        if: steps.compare.outputs.drift == 'true'
        uses: actions/github-script@v9
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        with:
          script: |
            const title = `Copilot CLI update available: ${process.env.LATEST}`;
            const label = 'dependencies';
            const pinned = process.env.PINNED;
            const latest = process.env.LATEST;
            const today = new Date().toISOString().split('T')[0];

            const body = [
              `# Copilot CLI version drift — ${today}`,
              ``,
              `_Generated by [Monitor: Copilot CLI Version](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_`,
              ``,
              `| Location | Version |`,
              `| --- | --- |`,
              `| \`docker/images/server/Dockerfile\` (\`ARG COPILOT_CLI_VERSION\`) | \`${pinned}\` |`,
              `| npm \`@github/copilot-linux-x64\` \`latest\` dist-tag | \`${latest}\` |`,
              ``,
              `## Why this matters`,
              ``,
              `The Pierre server container bundles GitHub Copilot CLI at build time. Staying on an old version can:`,
              `- miss new Claude / GPT model SKUs (e.g. \`claude-opus-4.7\` required CLI >=1.0.30)`,
              `- miss security patches in the CLI itself`,
              `- drift out of sync with locally installed CLI used for dev/testing`,
              ``,
              `## How to update`,
              ``,
              `\`\`\`bash`,
              `# 1. Review release notes`,
              `npm view @github/copilot-linux-x64 versions --json | tail -20`,
              `open "https://www.npmjs.com/package/@github/copilot-linux-x64?activeTab=versions"`,
              ``,
              `# 2. Test the new version locally if possible:`,
              `npm install -g @github/copilot-linux-x64@${latest}`,
              `copilot --version`,
              ``,
              `# 3. Bump the Dockerfile ARG and commit:`,
              `# edit docker/images/server/Dockerfile: ARG COPILOT_CLI_VERSION=${latest}`,
              `# commit directly to main (bug-class / dep-bump) or via feature branch`,
              `\`\`\``,
              ``,
              `## Verification after bump`,
              ``,
              `- \`publish-images.yml\` rebuilds the server image with the new CLI`,
              `- \`deploy-gcp.yml\` rolls out to dev`,
              `- Send a Telegram / messaging probe to confirm \`copilot-acp\` dispatches successfully`,
              ``,
              `_This issue auto-updates each Monday. It closes itself when the Dockerfile catches up to \`${latest}\`._`,
            ].join('\n');

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0366d6',
                description: 'Dependency updates',
              });
            }

            // Look for any open issue from this monitor (title prefix match)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const existing = openIssues.find(i => i.title.startsWith('Copilot CLI update available:'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: Close stale tracking issue when caught up
        if: steps.compare.outputs.drift == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'dependencies';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const stale = openIssues.filter(i => i.title.startsWith('Copilot CLI update available:'));

            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Dockerfile pin caught up with npm `latest`. Auto-closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed stale issue #${issue.number}`);
            }
