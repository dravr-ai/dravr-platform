# ABOUTME: Hourly sweep editing the "Generated by Claude Code" footer out of new dravr-carnet issues and comments
# ABOUTME: A cloud session's GitHub path appends it after carnet.sh has stripped it, so the edit happens here
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Every write a Claude Code on the web session makes to the tracker lands with
# `---` + `_Generated by [Claude Code](https://claude.ai/code)_` appended, even
# a claim marker carnet.sh built and stripped itself; 672 entries carried it by
# 2026-10-20. No setting reaches it (`attribution` covers commits and pull
# requests only), so the footer is removed after the fact, by
# scripts/ci/strip-carnet-footer.sh — the reasons are in its header.
#
# It runs from this public repo, where Actions minutes are free; a lane in the
# private tracker stalls the day the org's private minutes run out. GITHUB_TOKEN
# reaches only this repository, so the lane reads DRAVR_CARNET_TOKEN, as the
# other register lanes do. The tracker is private and these logs are public,
# so the script prints counts only. An empty token, a refused edit, or a
# stored body that still carries the footer fails the run, and Monitor:
# Scheduled Lane Health files the red.

name: "Carnet: Strip Claude Code Footer"

on:
  schedule:
    # Hourly at :37 — off :00. The script reads the last 3 hours, so a run that
    # was skipped or failed is covered by the next two.
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: "Read entries updated since this ISO-8601 time (default: 3 hours ago)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Count the footered entries without editing them"
        required: false
        default: false
        type: boolean

concurrency:
  group: carnet-strip-footer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  strip:
    name: Edit the footer out of recent carnet entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Strip the footer
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -o pipefail
          args=()
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          ./scripts/ci/strip-carnet-footer.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
