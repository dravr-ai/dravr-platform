# ABOUTME: Criterion benchmark CI — runs on backend pushes, compares against the main baseline, gates severe regressions.
# ABOUTME: Baseline lives in the actions cache (updated on main pushes); on-demand flamegraph job via workflow_dispatch.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Merges land on main via local squash (no PRs), so comparison runs on EVERY
# push: branch runs compare against the last main baseline without touching it;
# main pushes compare against the previous baseline, then overwrite it.

name: "CI: Benchmarks"

on:
  push:
    branches: [ "main", "debug/*", "feature/*", "fix/*", "claude/*", "copilot/*" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/bench-regression-check.py'
      - '.github/workflows/benchmarks.yml'
      - '.github/actions/rust-setup/**'
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: 'Specific benchmark suite to run (empty for all)'
        required: false
        default: ''
      flamegraph:
        description: 'Generate tool-dispatch flamegraphs instead of measuring'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A rapid follow-up push to main must not cancel a run between benching and
  # the baseline cache save; branch runs are safe to supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.flamegraph != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: auto

      - name: Restore criterion baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: |
            criterion-baseline-main-

      - name: Prune stale comparison data
        # The restored baseline carries main's own change/ comparison dirs;
        # left in place they surface as phantom results for suites this run
        # does not execute.
        run: |
          if [ -d target/criterion ]; then
            find target/criterion -type d -name change -prune -exec rm -rf {} +
          fi

      - name: Run benchmarks
        run: |
          SUITE="${{ inputs.benchmark_suite }}"
          if [ -n "$SUITE" ]; then
            TARGET="--bench $SUITE"
          else
            # Scope to pierre_mcp_server — the only crate with Criterion benches.
            # Running workspace-wide would hit non-Criterion crates that reject Criterion flags.
            TARGET="--benches"
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            # Compares against the previous main baseline, then becomes it.
            cargo bench -p pierre_mcp_server $TARGET -- --save-baseline main
          else
            # Compares against main's baseline; lenient = silently skip when absent.
            cargo bench -p pierre_mcp_server $TARGET -- --baseline-lenient main
          fi

      - name: Save criterion baseline (main only)
        # Placed before the regression gate: the baseline must track what main
        # actually is, even when the gate fails the job.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

      - name: Check for regressions
        run: python3 scripts/ci/bench-regression-check.py --criterion-dir target/criterion --warn-pct 10 --fail-pct 50

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 1

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: target/criterion/report/
          retention-days: 1

  flamegraph:
    name: Tool-Dispatch Flamegraphs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.flamegraph == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: 'false'

      - name: Profile dispatch benches
        # --profile-time activates the pprof hook; no analysis, no baselines touched.
        run: cargo bench -p pierre_mcp_server --bench tool_dispatch_bench -- --profile-time 10

      - name: Upload flamegraphs
        uses: actions/upload-artifact@v4
        with:
          name: flamegraphs-${{ github.sha }}
          path: target/criterion/**/profile/flamegraph.svg
          retention-days: 1
