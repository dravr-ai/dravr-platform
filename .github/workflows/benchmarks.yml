# ABOUTME: Criterion benchmark CI — nightly on main and on dispatch, benches a base commit and the head on one runner, fails a regression.
# ABOUTME: Nightly measures main against main a day earlier, a dispatch measures a branch against its merge-base; on-demand flamegraph job.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Nightly, not per push: a run holds a runner for over an hour, benching two
# commits, and a per-push run would rewrite the bench Rust cache on every
# Cargo.lock change. The nightly run on main measures main against main as it was a day earlier. To
# measure a branch, dispatch this workflow on it: it measures the branch
# against its merge-base with main. Either way both sides run on the same
# runner (scripts/ci/bench-ab.sh), so the gate can block.

name: "CI: Benchmarks"

on:
  schedule:
    # 05:19 UTC, after the 02:30-03:41 database lanes and before ci-backend's
    # 08:11 run, so it does not compete with them for runners.
    - cron: '19 5 * * *'
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: 'Specific benchmark suite to run (empty for all)'
        required: false
        default: ''
      flamegraph:
        description: 'Generate tool-dispatch flamegraphs instead of measuring'
        required: false
        default: false
        type: boolean

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  # The event name is in the group because a dispatch on main at the tip carries
  # the nightly run's sha: without it the dispatch would join the nightly's group
  # and cancel its verdict before it lands. Branch runs are
  # safe to supersede.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.flamegraph != true
    # A backstop, not a performance budget. One side alone landed in 31-51 min;
    # the base and the head share a target directory, so the second build
    # reuses every dependency the first compiled.
    #
    # On main every run has its own concurrency group (see above), so nothing
    # can cancel a nightly verdict. The cost of that is a hung job nothing can
    # displace — on 2026-08-19 this job sat 316 min
    # in `Setup Rust environment` and every later run queued behind it. The
    # bound lives on the job because composite actions cannot bound their own
    # steps.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The base commit is in main's history: a merge-base, or main a day ago.
          fetch-depth: 0

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: auto

      - name: Align functions for stable timings
        # Where the linker happens to place a hot function shifts its timing by
        # several percent between two builds of the same code. Aligning every
        # function to 64 bytes removes that from the comparison. A cfg(all())
        # target entry, because cargo joins every target.*.rustflags entry,
        # while RUSTFLAGS would replace the mold flag rust-setup wrote.
        run: |
          {
            echo "[target.'cfg(all())']"
            echo 'rustflags = ["-C", "llvm-args=-align-all-functions=6"]'
          } >> .cargo/config.toml
          cat .cargo/config.toml

      - name: Pick the base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Main as it was a day ago: what the last nightly run measured.
            base="$(git rev-list -1 --first-parent --before='24 hours ago' HEAD)"
          else
            git fetch --no-tags --quiet origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          if [ -z "$base" ]; then
            echo "::error::found no base commit to measure ${{ github.sha }} against"
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "Head is the base commit $base: no code to compare" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "Measuring $(git rev-parse --short HEAD) against base $(git rev-parse --short "$base")" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run benchmarks
        if: steps.base.outputs.same == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SUITE: ${{ inputs.benchmark_suite }}
        run: scripts/ci/bench-ab.sh "$BASE_SHA" ${SUITE:+"$SUITE"}

      # Blocking: both sides ran on this runner, alternating one suite at a
      # time, so a delta here is the code's. A baseline another runner recorded
      # cannot gate: the spread between runners reaches the fail threshold on
      # its own (2026-08-04, three reds on benchmarks no commit in range could
      # reach).
      - name: Check for regressions
        if: steps.base.outputs.same == 'false'
        run: python3 scripts/ci/bench-regression-check.py --criterion-dir target/criterion --warn-pct 10 --fail-pct 50

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 1

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: target/criterion/report/
          retention-days: 1

  flamegraph:
    name: Tool-Dispatch Flamegraphs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.flamegraph == true
    # Same backstop, same reason. Manual-dispatch only, so a hang here is
    # likelier to go unwatched than one on a push.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: 'false'

      - name: Profile dispatch benches
        # --profile-time activates the pprof hook; no analysis, no baselines touched.
        # The flamegraph profile keeps symbols and debug info the stripped
        # bench profile drops (see [profile.flamegraph] in Cargo.toml).
        run: cargo bench --profile flamegraph -p pierre_mcp_server --bench tool_dispatch_bench -- --profile-time 10

      - name: Upload flamegraphs
        uses: actions/upload-artifact@v4
        with:
          name: flamegraphs-${{ github.sha }}
          path: target/criterion/**/profile/flamegraph.svg
          retention-days: 1
