# ABOUTME: Criterion benchmark CI — runs on backend pushes, compares against the main baseline, gates severe regressions.
# ABOUTME: Baseline lives in the actions cache (updated on main pushes); on-demand flamegraph job via workflow_dispatch.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Merges land on main via local squash (no PRs), so comparison runs on EVERY
# push: branch runs compare against the last main baseline without touching it;
# main pushes compare against the previous baseline, then overwrite it.

name: "CI: Benchmarks"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/bench-regression-check.py'
      - '.github/workflows/benchmarks.yml'
      - '.github/actions/rust-setup/**'
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: 'Specific benchmark suite to run (empty for all)'
        required: false
        default: ''
      flamegraph:
        description: 'Generate tool-dispatch flamegraphs instead of measuring'
        required: false
        default: false
        type: boolean

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  # A rapid follow-up push to main must not cancel a run between benching and
  # the baseline cache save; branch runs are safe to supersede.
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.flamegraph != true
    # A backstop, not a performance budget. Successful runs land in 31-51 min.
    #
    # On main `cancel-in-progress` is false (see above, and for a good reason:
    # a follow-up push must not kill a run between benching and the baseline
    # save). The cost of that is a hung job nothing can displace — on
    # 2026-08-19 this job sat 316 min in `Setup Rust environment` and every
    # later push queued behind it, so main went five hours with no benchmark
    # verdict. The bound lives on the job because composite actions cannot
    # bound their own steps.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: auto

      - name: Restore criterion baseline
        uses: actions/cache/restore@v6
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: |
            criterion-baseline-main-

      - name: Prune stale comparison data
        # The restored baseline carries main's own change/ comparison dirs;
        # left in place they surface as phantom results for suites this run
        # does not execute.
        run: |
          if [ -d target/criterion ]; then
            find target/criterion -type d -name change -prune -exec rm -rf {} +
          fi

      - name: Run benchmarks
        run: |
          SUITE="${{ inputs.benchmark_suite }}"
          if [ -n "$SUITE" ]; then
            TARGET="--bench $SUITE"
          else
            # Scope to pierre_mcp_server — the only crate with Criterion benches.
            # Running workspace-wide would hit non-Criterion crates that reject Criterion flags.
            TARGET="--benches"
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            # Compares against the previous main baseline, then becomes it.
            cargo bench -p pierre_mcp_server $TARGET -- --save-baseline main
          else
            # Compares against main's baseline; lenient = silently skip when absent.
            cargo bench -p pierre_mcp_server $TARGET -- --baseline-lenient main
          fi

      - name: Save criterion baseline (main only)
        # Placed before the regression gate: the baseline must track what main
        # actually is, even when the gate fails the job.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

      # --advisory: the comparison is cross-machine, so the delta it measures is
      # partly the runner. A branch benches on whatever runner it draws and
      # compares against a baseline recorded on the runner that last ran main, and
      # the observed spread between runners reaches the fail threshold on its own —
      # 2026-08-04 produced three reds whose worst offenders were benchmarks no
      # commit in the range could reach (`json_value/value_array_indexing` indexes
      # a serde_json Value and nothing else). Regressions still print and still
      # land in the job summary; they no longer block on evidence that cannot
      # separate a slower machine from slower code.
      #
      # Removing --advisory is correct once the job benches the merge-base and the
      # head in the same run on the same machine, which is the only comparison
      # that isolates the code.
      - name: Check for regressions
        run: python3 scripts/ci/bench-regression-check.py --criterion-dir target/criterion --warn-pct 10 --fail-pct 50 --advisory

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 1

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: target/criterion/report/
          retention-days: 1

  flamegraph:
    name: Tool-Dispatch Flamegraphs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.flamegraph == true
    # Same backstop, same reason. Manual-dispatch only, so a hang here is
    # likelier to go unwatched than one on a push.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: bench
          cache-save: 'false'

      - name: Profile dispatch benches
        # --profile-time activates the pprof hook; no analysis, no baselines touched.
        run: cargo bench -p pierre_mcp_server --bench tool_dispatch_bench -- --profile-time 10

      - name: Upload flamegraphs
        uses: actions/upload-artifact@v4
        with:
          name: flamegraphs-${{ github.sha }}
          path: target/criterion/**/profile/flamegraph.svg
          retention-days: 1
