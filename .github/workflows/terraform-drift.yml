# ABOUTME: Nightly Terraform drift detection for every root a workflow applies — infra/environments/dev and infra/artifacts
# ABOUTME: Runs `terraform plan -detailed-exitcode` per root; a non-empty plan (exit 2) reds this Monitor workflow as the drift alert

name: "Monitor: Terraform Drift (dev + artifacts)"

# Why this exists: nothing re-plans a root after an out-of-band edit.
# terraform.yml auto-plans dev ONLY when infra/** files change on push, and
# terraform-artifacts.yml is dispatch-only, so an edit made with gcloud or the
# console (or a manual `terraform apply` from a laptop against the shared GCS
# state) drifts silently until someone next plans. This workflow re-plans every
# root on a schedule and fails on any diff, so drift surfaces as a red Monitor
# run (same "red on main = investigate" convention as Monitor: Daily Health
# Check) rather than lurking.
#
# infra/artifacts is a leg because it already drifted unseen. The dravr-images
# cleanup policy was replaced with gcloud on 2026-08-18 (other rule ids, 6h/1h
# windows, latest+buildcache keep prefixes) and nothing compared it with the
# code until carnet#137 found it by hand twelve days later — by which point the
# next artifacts apply would have dropped `latest` from the keep list. That
# registry holds every image dev serves.
#
# Coverage rule: one leg per Terraform root that some workflow job can apply.
# scripts/ci/terraform-drift.test.sh reads every workflow and fails when an
# applyable root has no leg here. Prod has none because nothing can apply it:
# infra/environments/prod is an unprovisioned stub (project_id is a TODO
# placeholder) and terraform.yml's apply-prod is `if: false`, so a prod plan
# would error rather than report drift. The test asks the same question, so
# arming apply-prod fails it until prod has a leg.
#
# Identity: each leg plans as the identity its root's own plan job uses, which
# the same test checks. dev plans as terraform-runner@dravr-dev, like
# terraform.yml's plan-dev. artifacts plans as the read-only
# terraform-planner@dravr-artifacts, like terraform-artifacts.yml's plan job —
# never terraform-runner@dravr-artifacts, which can grant itself roles/owner and
# is minted only behind the 'artifacts' Environment reviewer. The planner reads
# state with objectViewer and cannot create the GCS lock object, so that leg
# plans with -lock=false; a plan writes no state, so there is nothing for the
# lock to serialize.
#
# Output: dravr-platform is public, and so are its run logs and job summaries.
# Each leg publishes the condensed form terraform.yml uses — resource action
# lines plus the Plan:/No changes line, or the error tail when the plan fails —
# never raw plan text, which carries every attribute Terraform does not mark
# sensitive.
#
# Alerting: a red Monitor run AND a Slack post to #dev-dravr-errors from the
# notify job, once every leg has finished. It authenticates as
# terraform-runner@dravr-dev (which holds roles/secretmanager.admin — see
# infra/modules/service_accounts) and reads the app's existing Slack bot token
# straight from Secret Manager (dravr-mcp-server-slack-bot-token), then posts via
# chat.postMessage. No new GitHub secret and no new Slack app/incoming-webhook —
# it reuses the same bot the running server uses for ops alerts. The post is its
# own job rather than a step in each leg because the artifacts planner cannot
# read dravr-dev secrets. Dispatch this workflow manually with test_alert=true to
# verify the Slack wiring on demand (posts a test message without needing real
# drift).
on:
  schedule:
    # Daily at 12:08 UTC (offset from the 06:14 Daily Health Check).
    - cron: '8 12 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Post a test message to #dev-dravr-errors to verify the Slack wiring, then run the normal drift plan."
        type: boolean
        default: false

# The dev leg takes the same GCS state lock as terraform.yml, with Terraform's
# default zero lock timeout, so a drift plan overlapping an apply would fail one
# of the two. It therefore queues in terraform.yml's `terraform-state` group, and
# never cancels: cancel-in-progress there would kill a running apply with the
# state not yet written back. Like any arrival in that group, a drift run
# replaces a run that is still WAITING behind a running one (carnet#1116).
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Drift (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15  # init + plan, ~40 s

    strategy:
      # Each leg is its own verdict: drift in one root must not cancel the
      # other root's plan.
      fail-fast: false
      matrix:
        include:
          - label: dev
            root: infra/environments/dev
            # Secret NAMES, read through secrets[...] in the auth step: a
            # matrix cannot hold secret values.
            wif_provider_secret: GCP_DEV_WIF_PROVIDER
            service_account_secret: GCP_DEV_TF_SA
            lock: 'true'
            reconcile: "gh workflow run terraform.yml --ref main -f environment=dev -f action=apply"
          - label: artifacts
            root: infra/artifacts
            wif_provider_secret: GCP_ARTIFACTS_WIF_PROVIDER
            service_account_secret: GCP_ARTIFACTS_TF_PLAN_SA
            lock: 'false'
            reconcile: "gh workflow run terraform-artifacts.yml --ref main -f action=plan, then -f action=apply -f plan_run_id=<that run>"

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (the root's plan identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets[matrix.wif_provider_secret] }}
          service_account: ${{ secrets[matrix.service_account_secret] }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        # No wrapper: its wrapper/terraform.js returns normally on exit code 2
        # ("Success with non-empty diff"), so the process exits 0 and `$?`
        # below never sees drift. Run 37040311847 (2026-10-02) planned "4 to
        # add, 1 to change" with code=0 under a plain redirect; only the
        # plan-text cross-check caught it.
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present (drift).
      # Redirect to a file (NO pipe) so `$?` is terraform's own exit — a piped
      # `${PIPESTATUS[0]}` mis-captured 0 on a real 6-resource diff under the
      # runner shell and false-greened this monitor (2026-07-01); `$?` is only
      # terraform's own with the setup-terraform wrapper off (above). Never fail this
      # step; the classification below decides pass/fail from BOTH the exit code
      # and a plan-text cross-check, so no single quirk can false-green us again.
      - name: Terraform Plan (drift check)
        id: plan
        env:
          TF_LOCK: ${{ matrix.lock }}
          LEG: ${{ matrix.label }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -input=false -lock="${TF_LOCK}" -var-file="terraform.tfvars" > plan-output.txt 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Terraform prints this exact sentence iff the plan is empty.
          if grep -q "No changes. Your infrastructure matches the configuration." plan-output.txt; then
            echo "text=clean" >> "$GITHUB_OUTPUT"
          else
            echo "text=changes" >> "$GITHUB_OUTPUT"
          fi
          # Condensed, never raw (public repo): a completed plan publishes its
          # resource action lines and the Plan:/No changes line; anything else
          # publishes the error tail. Written to the log as well as the job
          # summary, so `gh run view --log-failed` shows which resources drifted.
          {
            echo "## Terraform Drift — ${LEG}"
            echo ''
            echo '```'
            case "$code" in
              0|2) grep -E '^(Plan:|No changes)|^  # ' plan-output.txt || echo '(no resource change lines found)' ;;
              *) echo "PLAN FAILED (exit $code) — last 40 lines:"; tail -n 40 plan-output.txt ;;
            esac
            echo '```'
          } > plan-summary.md
          cat plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Classify drift result
        env:
          CODE: ${{ steps.plan.outputs.code }}
          TEXT: ${{ steps.plan.outputs.text }}
          ROOT: ${{ matrix.root }}
          RECONCILE: ${{ matrix.reconcile }}
        run: |
          case "$CODE" in
            0|2) ;;
            *)
              echo "::error title=Terraform plan failed (${ROOT})::terraform plan exited ${CODE:-without a status}. See the error tail in the job summary."
              exit 1
              ;;
          esac
          # Clean ONLY when the supported exit code AND the plan text both agree.
          # Any mismatch (a real diff, or an exit-code quirk) trips the alert.
          if [ "$CODE" = "0" ] && [ "$TEXT" = "clean" ]; then
            echo "No drift — live infra matches ${ROOT}."
            exit 0
          fi
          # Name the drifting resources in the alert itself; the pattern leaves
          # out data sources that are merely "read during apply". A replacement can
          # be a cascade of a pending change (a data.google_project deferred
          # behind a not-yet-enabled API makes an IAM member read as "must be
          # replaced"). Terraform lists resources by address, not by cause,
          # so read a replacement next to the creates it may depend on.
          changed=$(grep -E '^  # .* (will be (created|updated in-place|destroyed)|must be replaced|has been (changed|deleted))' plan-output.txt \
            | sed -E 's/^  # //' | head -20 | paste -sd ';' - || true)
          if [ -n "$changed" ]; then
            echo "::error title=Drifting resources (${ROOT})::${changed}"
          fi
          echo "::error title=Terraform drift detected (${ROOT})::live infra differs from ${ROOT} (exit=${CODE}, plan-text=${TEXT}). Review the action lines in the job summary, then reconcile via '${RECONCILE}' (or correct the code to match reality)."
          exit 1

  # Post to Slack when the monitor goes red (drift detected in any leg, or a
  # plan / leg itself failed), and on a manual test_alert dispatch to verify the
  # wiring. Best-effort: a failed post never overrides the run result (the red
  # run stays the base alert).
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 10  # one Slack post, ~15 s
    needs: drift
    if: ${{ !cancelled() && (needs.drift.result == 'failure' || github.event.inputs.test_alert == 'true') }}

    steps:
      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      # gcloud CLI, wired to the credentials from the auth step above, so the
      # post below can read the bot token from Secret Manager.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Post to Slack
        env:
          DRIFT_RESULT: ${{ needs.drift.result }}
          IS_TEST: ${{ github.event.inputs.test_alert }}
          SLACK_SECRET: dravr-mcp-server-slack-bot-token
          GCP_PROJECT: dravr-dev
          SLACK_CHANNEL: "#dev-dravr-errors"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          token=$(gcloud secrets versions access latest --secret="$SLACK_SECRET" --project="$GCP_PROJECT" 2>/dev/null)
          if [ -z "$token" ]; then
            echo "::warning::Notify Slack: could not read $SLACK_SECRET from Secret Manager; the red run is still the alert."
            exit 0
          fi
          if [ "$DRIFT_RESULT" != "failure" ] && [ "$IS_TEST" = "true" ]; then
            text=":white_check_mark: Terraform Drift monitor — test alert. Slack wiring OK. <$RUN_URL|View run>"
          else
            text=":rotating_light: Terraform drift detected. Live infra differs from infra/environments/dev or infra/artifacts, or the monitor failed; the red leg of the run names the root. <$RUN_URL|View the plan> then reconcile through that root's apply workflow (terraform.yml for dev, terraform-artifacts.yml for artifacts)."
          fi
          payload=$(jq -n --arg ch "$SLACK_CHANNEL" --arg tx "$text" '{channel:$ch,text:$tx}')
          resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $token" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$payload")
          echo "$resp" | grep -q '"ok":true' || echo "::warning::Notify Slack: chat.postMessage did not return ok:true -> $resp"
          exit 0
