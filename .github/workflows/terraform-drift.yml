# ABOUTME: Nightly Terraform drift detection for infra/environments/dev — fails when live infra diverges from code
# ABOUTME: Runs `terraform plan -detailed-exitcode`; a non-empty plan (exit 2) reds this Monitor workflow as the drift alert

name: "Monitor: Terraform Drift (dev)"

# Why this exists: terraform.yml auto-plans ONLY when infra/** files change on
# push, so an out-of-band edit (gcloud/console, or a manual `terraform apply`
# from a laptop against the shared GCS state) drifts silently until the next
# infra commit. This job re-plans dev on a schedule and fails on any diff, so
# drift surfaces as a red Monitor run (same "red on main = investigate"
# convention as Monitor: Daily Health Check) rather than lurking.
#
# Dev only: infra/environments/prod is an unprovisioned stub (project_id is a
# TODO placeholder), so a prod plan would error rather than report drift.
on:
  schedule:
    # Daily at 12:00 UTC (offset from the 06:00 Daily Health Check).
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: terraform-drift-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  drift-dev:
    name: Drift Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (dev terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="prefix=dravr-dev"

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present (drift).
      # Redirect to a file (NO pipe) so `$?` is terraform's own exit — a piped
      # `${PIPESTATUS[0]}` mis-captured 0 on a real 6-resource diff under the
      # runner shell and false-greened this monitor (2026-07-01). Never fail this
      # step; the classification below decides pass/fail from BOTH the exit code
      # and a plan-text cross-check, so no single quirk can false-green us again.
      - name: Terraform Plan (drift check)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -var-file="terraform.tfvars" > plan-output.txt 2>&1
          code=$?
          set -e
          cat plan-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Terraform prints this exact sentence iff the plan is empty.
          if grep -q "No changes. Your infrastructure matches the configuration." plan-output.txt; then
            echo "text=clean" >> "$GITHUB_OUTPUT"
          else
            echo "text=changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Write plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform Drift — dev'
            echo ''
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify drift result
        run: |
          code="${{ steps.plan.outputs.code }}"
          text="${{ steps.plan.outputs.text }}"
          if [ "$code" = "1" ]; then
            echo "::error title=Terraform plan failed::terraform plan errored (exit 1). See the plan output in the job summary."
            exit 1
          fi
          # Clean ONLY when the supported exit code AND the plan text both agree.
          # Any mismatch (a real diff, or an exit-code quirk) trips the alert.
          if [ "$code" = "0" ] && [ "$text" = "clean" ]; then
            echo "✅ No drift — live dev infra matches infra/environments/dev."
            exit 0
          fi
          echo "::error title=Terraform drift detected::live dev infra differs from infra/environments/dev (exit=${code}, plan-text=${text}). Review the plan in the job summary, then reconcile via 'gh workflow run terraform.yml --ref main -f environment=dev -f action=apply' (or correct the code to match reality)."
          exit 1
