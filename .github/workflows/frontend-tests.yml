name: "CI: Web Frontend"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'frontend/**'
      - 'packages/**'
      # The sign-in extension: its own bun tests, and the e2e that loads it.
      - 'extensions/**'
      - 'bun.lock'
      - 'crates/pierre-routes-auth/src/**'
      # The hosted sign-in pages' scripts run in src/__tests__/hostedLoginCodeStep.test.ts.
      - 'crates/pierre-routes-auth/templates/**'
      - 'crates/pierre-server/src/routes/admin/**'
      - 'crates/pierre-server/src/routes/api_keys/**'
      - 'crates/pierre-routes-dashboard/src/**'
      - 'crates/pierre-core/src/models/**'
      - '.github/workflows/frontend-tests.yml'
      - 'docker/images/frontend/**'
      - 'scripts/ci/nginx-routing-check.sh'
      - 'scripts/ci/backend-routes.py'
      - 'scripts/ci/backend-route-prefixes.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'packages/**'
      # The sign-in extension: its own bun tests, and the e2e that loads it.
      - 'extensions/**'
      - 'bun.lock'
      - 'crates/pierre-routes-auth/src/**'
      # The hosted sign-in pages' scripts run in src/__tests__/hostedLoginCodeStep.test.ts.
      - 'crates/pierre-routes-auth/templates/**'
      - 'crates/pierre-server/src/routes/admin/**'
      - 'crates/pierre-server/src/routes/api_keys/**'
      - 'crates/pierre-routes-dashboard/src/**'
      - 'crates/pierre-core/src/models/**'
      - '.github/workflows/frontend-tests.yml'
      - 'docker/images/frontend/**'
      - 'scripts/ci/nginx-routing-check.sh'
      - 'scripts/ci/backend-routes.py'
      - 'scripts/ci/backend-route-prefixes.txt'
  workflow_dispatch:  # Allow manual triggering

concurrency:
  # One run going and one waiting, per lane and per ref (JF, 2026-11-19). A
  # running run always finishes, so main still turns green and deploys however
  # often it is pushed; a newer push takes the single waiting slot, replacing
  # the run that waited there, which GitHub cancels. The run that does go tests
  # a tree holding every skipped commit. Main used to keep one group per sha and
  # never cancel: 24 commits on 2026-11-19 queued ~600 jobs for a handful of
  # slots. Both costs are accepted: an intermediate main commit gets no verdict
  # of its own (the eviction carnet#169 once counted as a loss), and a branch
  # re-pushed mid-run finishes the superseded run (what carnet#1114 avoided),
  # bounded to one. The event name keeps a schedule or dispatch run out of the
  # push group. `cancel-in-progress` stays a literal: an expression there did
  # not hold on main (run 33026440559, see ci-backend.yml's history).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

jobs:
  # The only job that traverses nginx. Everything else in CI reaches the backend
  # directly (SDK, MCP compliance) or the vite dev server with routes mocked
  # (Playwright), so docker/images/frontend/nginx.conf was built but never
  # exercised — which is how /mcp stayed absent from the proxy alternation while
  # the SPA told users to point their MCP clients at it.
  nginx-routing:
    name: nginx Routing Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # ~30 s

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify backend paths are proxied, SPA paths are not
        run: ./scripts/ci/nginx-routing-check.sh

  # packages/chat-utils, ui-logic, domain-utils and mcp-types hold the logic both
  # clients share, and their vitest suites reached no runner: frontend's vitest
  # `include` is 'src/**'. This job is the gate for them.
  shared-package-tests:
    name: Shared Package Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        # vitest, eslint, tsc and Playwright run under Node, not Bun: pin the
        # repo's .nvmrc rather than whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Type check shared packages
        run: bun run typecheck:packages

      - name: Lint shared packages
        run: bun run lint:packages

      - name: Test shared packages
        run: |
          # `bun run --filter` over a pattern that matches no package exits 0, so
          # count the suites first: an empty selection must never report green.
          PACKAGE_TEST_FILES=$(find packages -path '*__tests__*' -name '*.test.ts*' | wc -l | tr -d ' ')
          echo "Shared-package test files: $PACKAGE_TEST_FILES"
          if [ "$PACKAGE_TEST_FILES" -eq 0 ]; then
            echo "No test files under packages/*/__tests__/ — this gate would pass vacuously."
            exit 1
          fi
          bun run test:packages

      - name: Test the sign-in extension
        run: |
          # `bun test` over a folder with no test files exits non-zero, but say
          # what ran, and fail on a selection that lost its suites.
          EXTENSION_TEST_FILES=$(find extensions/dravr-signin -maxdepth 1 -name '*.test.js' | wc -l | tr -d ' ')
          echo "Sign-in extension test files: $EXTENSION_TEST_FILES"
          if [ "$EXTENSION_TEST_FILES" -lt 5 ]; then
            echo "Expected at least 5 test files in extensions/dravr-signin (signin, background, bridge, notice, package)."
            exit 1
          fi
          bun test extensions/dravr-signin

  frontend-tests:
    name: Frontend Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # lint, type check, tests and build, ~4 min

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history: the admin screen theory test (carnet#1441) resolves
          # every commit an admin screen cites, and a shallow clone has none.
          fetch-depth: 0

      - name: Setup Node
        # vitest, eslint, tsc and Playwright run under Node, not Bun: pin the
        # repo's .nvmrc rather than whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint code
        working-directory: frontend
        run: bun run lint

      - name: Type check
        working-directory: frontend
        # `tsc -b`, not `tsc --noEmit`: the root tsconfig lists no files and
        # only references the app and node projects, so a bare `--noEmit`
        # checks nothing and passes over any type error.
        run: bun run type-check

      - name: Run tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Entry bundle budget
        working-directory: frontend
        run: bun scripts/check-entry-budget.ts

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests
    # Playwright ships no chromium for ubuntu-latest's 26.04 image
    # ("Playwright does not support chromium on ubuntu26.04-x64", 2026-11-10).
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # Playwright, ~20 min

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        # vitest, eslint, tsc and Playwright run under Node, not Bun: pin the
        # repo's .nvmrc rather than whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 1

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 1

  # The suite above runs the Vite dev server with no Content-Security-Policy,
  # so neither the built bundle (its chunk names, its MapLibre worker asset)
  # nor the policy nginx sends (docker/images/frontend/security-headers.conf)
  # ever ran under a test. This job builds dist/, serves it with those exact
  # headers and asserts the Home map paints a track over a basemap stand-in
  # answered at the real tile hosts. Playwright exits non-zero on a failure
  # and on a run that selects no test, so an empty suite cannot pass.
  e2e-production-build:
    name: Playwright E2E (production build + CSP)
    # Playwright ships no chromium for ubuntu-latest's 26.04 image
    # ("Playwright does not support chromium on ubuntu26.04-x64", 2026-11-10).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run production-build E2E tests
        working-directory: frontend
        run: bun run test:e2e:prod

      - name: Upload production-build test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-prod-results
          path: frontend/test-results/
          retention-days: 1
