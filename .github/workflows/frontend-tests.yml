name: "CI: Web Frontend"

on:
  push:
    branches: [ "main", "debug/*", "feature/*", "fix/*", "claude/*", "copilot/*" ]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'bun.lock'
      - 'crates/pierre-server/src/routes/auth/**'
      - 'crates/pierre-server/src/routes/admin/**'
      - 'crates/pierre-server/src/routes/api_keys/**'
      - 'crates/pierre-server/src/routes/dashboard/**'
      - 'crates/pierre-core/src/models/**'
      - '.github/workflows/frontend-tests.yml'
      - 'docker/images/frontend/**'
      - 'scripts/ci/nginx-routing-check.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'bun.lock'
      - 'crates/pierre-server/src/routes/auth/**'
      - 'crates/pierre-server/src/routes/admin/**'
      - 'crates/pierre-server/src/routes/api_keys/**'
      - 'crates/pierre-server/src/routes/dashboard/**'
      - 'crates/pierre-core/src/models/**'
      - '.github/workflows/frontend-tests.yml'
      - 'docker/images/frontend/**'
      - 'scripts/ci/nginx-routing-check.sh'
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: the verdict is the point there. On 2026-08-26 four
  # sessions pushed to main every ~2 minutes and the ~12-minute clippy job was
  # cancelled five runs straight, so main's last real lint result was 25 minutes
  # stale and red while everything after it read as "no result". Queued runs
  # supersede each other per ref, so this costs a wait, not a pile-up.
  # Feature branches keep cancelling — there, fast feedback beats a stale verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

jobs:
  # The only job that traverses nginx. Everything else in CI reaches the backend
  # directly (SDK, MCP compliance) or the vite dev server with routes mocked
  # (Playwright), so docker/images/frontend/nginx.conf was built but never
  # exercised — which is how /mcp stayed absent from the proxy alternation while
  # the SPA told users to point their MCP clients at it.
  nginx-routing:
    name: nginx Routing Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify backend paths are proxied, SPA paths are not
        run: ./scripts/ci/nginx-routing-check.sh

  frontend-tests:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint code
        working-directory: frontend
        run: bun run lint

      - name: Type check
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install all workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 1

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 1
