# ABOUTME: Builds and publishes Docker images to the central Artifact Registry, then deploys to Cloud Run
# ABOUTME: Triggered only after Backend CI passes on main (prevents broken deploys); v*.*.* tags trigger directly

name: "Deploy: Build & Ship (dev)"

on:
  workflow_dispatch:
  # Only publish after CI tests pass on main — prevents deploying broken code
  workflow_run:
    workflows: ["CI: Backend (Rust)"]
    types: [completed]
    branches: [main]
  # Docker/infra changes and version tags trigger directly
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/publish-images.yml'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  security-events: write  # For Trivy SARIF upload

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the commit SHA to use for image tagging
  # ---------------------------------------------------------------------------
  resolve-sha:
    name: Resolve Commit SHA
    runs-on: ubuntu-latest
    # Skip if triggered by a failed CI run, or by a CI run that was itself
    # triggered by a schedule (cron) — nightly CI on main rebuilds the same
    # commit SHA and would create a new Cloud Run revision for zero code
    # change. Only deploy when the upstream CI was triggered by a real push.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
      gcp_configured: ${{ steps.secrets.outputs.gcp_configured }}

    steps:
      - name: Resolve SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Check GCP secrets availability
        id: secrets
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$IMAGE_PUBLISHER_SA" ]; then
            echo "gcp_configured=true" >> "$GITHUB_OUTPUT"
            echo "GCP Artifact Registry secrets are configured"
          else
            echo "gcp_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP Artifact Registry secrets not configured — skipping image publish and deploy"
          fi
        env:
          WIF_PROVIDER: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          IMAGE_PUBLISHER_SA: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

  # ---------------------------------------------------------------------------
  # Build and push server image to central Artifact Registry
  # ---------------------------------------------------------------------------
  publish-server:
    name: Publish Server Image
    runs-on: ubuntu-latest
    needs: resolve-sha
    if: needs.resolve-sha.outputs.gcp_configured == 'true'

    outputs:
      image: ${{ steps.digest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Configure Docker credential helper
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute server image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHORT_SHA="${{ needs.resolve-sha.outputs.short_sha }}"

          SERVER_TAGS="${REGISTRY}/server:${SHORT_SHA},${REGISTRY}/server:latest"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            SERVER_TAGS="${SERVER_TAGS},${REGISTRY}/server:${VERSION}"
          fi

          echo "server_tags=${SERVER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          build-args: |
            GIT_COMMIT_SHA=${{ needs.resolve-sha.outputs.sha }}
          secrets: |
            "git_token=${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}"

      - name: Scan server image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ steps.tags.outputs.registry }}/server@${{ steps.build.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-server.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'root/.cache/copilot'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: 'trivy-server.sarif'
          category: 'server-image'

      - name: Output server image digest
        id: digest
        run: |
          echo "image=${{ steps.tags.outputs.registry }}/server@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build and push frontend image to central Artifact Registry
  # ---------------------------------------------------------------------------
  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-latest
    needs: resolve-sha
    if: needs.resolve-sha.outputs.gcp_configured == 'true'

    outputs:
      image: ${{ steps.digest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Configure Docker credential helper
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute frontend image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHORT_SHA="${{ needs.resolve-sha.outputs.short_sha }}"

          FRONTEND_TAGS="${REGISTRY}/frontend:${SHORT_SHA},${REGISTRY}/frontend:latest"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            FRONTEND_TAGS="${FRONTEND_TAGS},${REGISTRY}/frontend:${VERSION}"
          fi

          echo "frontend_tags=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ steps.tags.outputs.registry }}/frontend@${{ steps.build.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'frontend-image'

      - name: Output frontend image digest
        id: digest
        run: |
          echo "image=${{ steps.tags.outputs.registry }}/frontend@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy to development (every successful CI run on main)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [publish-server, publish-frontend]
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment: development

    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Deploy backend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-server.outputs.image }}

      - name: Deploy frontend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-frontend.outputs.image }}

  # ---------------------------------------------------------------------------
  # Run Seed Jobs (after dev deploy)
  # ---------------------------------------------------------------------------
  seed-dev:
    name: Run Seed Jobs (dev)
    runs-on: ubuntu-latest
    needs: [deploy-dev, publish-server]
    environment: development

    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Update seed job images
        run: |
          IMAGE="${{ needs.publish-server.outputs.image }}"
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          JOBS="seed-bootstrap seed-coaches seed-mobility"
          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            JOBS="$JOBS seed-synthetic"
          fi

          for JOB in $JOBS; do
            echo "Updating ${SERVICE}-${JOB} image..."
            gcloud run jobs update "${SERVICE}-${JOB}" \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --quiet
          done

      - name: Run seed-bootstrap (must complete before other seeds)
        run: |
          gcloud run jobs execute "${{ vars.GCP_DEV_SERVICE_NAME }}-seed-bootstrap" \
            --region="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}" \
            --wait

      - name: Run remaining seed jobs
        run: |
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          gcloud run jobs execute "${SERVICE}-seed-coaches" --region="${REGION}" --wait &
          PID_COACHES=$!

          gcloud run jobs execute "${SERVICE}-seed-mobility" --region="${REGION}" --wait &
          PID_MOBILITY=$!

          PIDS="$PID_COACHES $PID_MOBILITY"

          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            gcloud run jobs execute "${SERVICE}-seed-synthetic" --region="${REGION}" --wait &
            PIDS="$PIDS $!"
          else
            echo "Skipping seed-synthetic (ENABLE_SYNTHETIC_SEED != true)"
          fi

          wait $PIDS
          echo "All seed jobs completed successfully"

  # ---------------------------------------------------------------------------
  # Deploy to production (every v*.*.* tag)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-server, publish-frontend]
    # Production deployment is disabled. To re-enable, replace the line below with:
    # if: startsWith(github.ref, 'refs/tags/v')
    if: false
    environment: production

    steps:
      - name: Authenticate to GCP (prod deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOYER_SA }}

      - name: Deploy backend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-api
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-server.outputs.image }}

      - name: Deploy frontend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-frontend.outputs.image }}
