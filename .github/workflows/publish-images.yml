# ABOUTME: Builds and publishes Docker images to the central Artifact Registry, then deploys to Cloud Run
# ABOUTME: Builds and deploys once Backend CI on main is green; docker/** pushes and v*.*.* tags trigger directly

name: "Deploy: Build & Ship (dev)"

# The triggering commit, in the run's own title.
#
# GitHub stamps a `workflow_run` run with the branch TIP at run-creation, while
# `resolve-sha` below deliberately builds a commit CI validated: the trigger
# `workflow_run.head_sha`, or the newest green commit that contains it. When CI
# completes out of order the tip is neither, and every reporting surface (the
# Actions UI, `gh run list --json headSha`) shows the tip. The build is right;
# the reporting is not.
#
# On 2026-09-03 that cost a full misdiagnosis: run 33816926276 reported
# `ecc8ab1f4` and built `19bc985c4`, which read as "the same commit produced
# both a red and a green Trivy gate, so the gate is not reproducible from
# source". It was filed as a defect and a Dockerfile comment went up telling the
# next person the apt-epoch bump was an unreliable remedy — all wrong; the bump
# was simply never compiled (carnet#262).
#
# `run-name` is evaluated at run creation, where the workflow_run payload is
# already available, so the title carries the triggering commit. The picker
# runs later, so when it builds a newer green commit it says so in a notice.
run-name: "Deploy ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      # Redeploys a chosen commit by hand (a rollback, or a commit whose deploy
      # was superseded). Empty builds the tip of the ref the run was started on.
      sha:
        description: 'Commit on main to build and deploy (default: the tip)'
        required: false
        type: string
  # The images are built only once Backend CI on main has gone green, so a red
  # commit costs nothing: no build, no Artifact Registry egress, no runner. The
  # gate is the `conclusion == 'success'` test in resolve-sha's `if:` and in the
  # concurrency group below, which must stay in step. From 2026-09-21 the build
  # started when CI was requested (carnet#498), which took the build off the
  # push-to-serving path but built every red commit too (13.5% of September's
  # builds) and held four runners beside CI on a 20-job plan that CI was already
  # saturating. The build compiles on the runner against the rust-cache CI has
  # just saved, so after green it is the shorter half of that trade.
  workflow_run:
    workflows: ["CI: Backend (Rust)"]
    types: [completed]
    branches: [main]
  # Docker/infra changes and version tags trigger directly
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/publish-images.yml'
      - '.github/actions/frontend-dist/**'
      - '.trivyignore'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  security-events: write  # For Trivy SARIF upload
  actions: read  # List and download the Trivy layer-cache artifacts

# A push burst on main fires one workflow_run event per Backend CI run,
# and every deploy that actually builds pulls from the registry buildcache
# back out of Artifact Registry — billed internet egress, because the runners sit
# outside GCP. The group below serialises those builds: one runs, at most one
# waits, and a newer arrival replaces the waiting one. A burst of N pushes costs
# two builds (the first and the newest) instead of N.
#
# Two things here are deliberate and were each learned from a real run.
#
# The group is queued, not cancelling. With cancel-in-progress a superseded build
# has already paid for its cache pull, so a burst costs N pulls for one finished
# build — the opposite of the saving. Queueing lets the running build finish and
# lands the newest SHA one build-duration later, which dev can afford.
#
# A run that will skip every job gets a group of its own. GitHub claims the
# concurrency group at run creation, BEFORE the job-level `if:` on resolve-sha
# below is evaluated — so a no-op shell for a red, cancelled, cron- or
# dispatch-triggered CI run would otherwise enter the deploy group and displace
# a green commit's waiting run. That is what happened on 2026-08-29: run
# 33270799943, every job skipped, cancelled run 33270484029 seven minutes into
# building fc9f52542 with its frontend image already pushed; that commit never
# reached dev. The condition mirrors the resolve-sha gate exactly, so a run is
# either in the deploy group or does nothing. Tags group on their own ref, so a
# release build never waits on main.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.conclusion != 'success')) && format('deploy-noop-{0}', github.run_id) || format('deploy-dev-{0}', github.event.workflow_run.head_branch || github.ref_name) }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the commit SHA to use for image tagging
  # ---------------------------------------------------------------------------
  resolve-sha:
    name: Resolve Commit SHA
    runs-on: ubuntu-latest
    # Build only for a CI run that a real push started AND that went green. A
    # schedule- or dispatch-triggered CI run rebuilds a commit main already has,
    # which would create a Cloud Run revision for zero code change; a red or
    # cancelled one must never deploy. The concurrency group above mirrors this
    # condition exactly — change both or neither.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
      gcp_configured: ${{ steps.secrets.outputs.gcp_configured }}
      # 'true' only when the guard below PROVED this deploy would roll dev
      # back; empty on push and workflow_dispatch, where the guard does not run.
      rollback: ${{ steps.guard.outputs.rollback }}
    # Job-level permissions replace the workflow's for this job, so the two it
    # inherits are restated. actions: read lets the picker list Backend CI runs.
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      # Commits only (`tree:0`), every branch, no depth limit: 2 MB for the
      # whole history, against a 100+ MB full clone. `merge-base` walks commit
      # parents and touches no tree, so nothing is fetched lazily; the sparse
      # checkout pulls only the blobs the scripts below need. Both the picker
      # and the rollback guard read it, and both run on workflow_run only.
      - name: Checkout commit history
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts/ci

      # Build the newest green commit, not just the one whose CI started this
      # run. The concurrency group keeps one waiting run and a newer ARRIVAL
      # replaces it, and CI finishes out of order — so an older commit's late
      # CI can displace a newer green commit's waiting run. Picking the newest
      # green commit makes arrival order irrelevant. Fail-safe: when the run
      # list cannot be read or the picker refuses, the trigger is built, which
      # is what this workflow always did.
      - name: Pick the newest green commit
        id: newest
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.workflow_run.head_sha }}
        run: |
          PICKED="$TRIGGER"
          if GREEN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-backend.yml/runs?branch=main&event=push&status=success&per_page=50" \
                        --jq '.workflow_runs[].head_sha')"; then
            if OUT="$(printf '%s\n' "$GREEN" | ./scripts/ci/pick-newest-green.sh "$TRIGGER" .)"; then
              PICKED="$OUT"
            else
              echo "::warning title=Newest-green pick refused::pick-newest-green.sh refused its arguments; building the trigger ${TRIGGER}"
            fi
          else
            echo "::warning title=Newest-green pick inert::could not list green Backend CI runs; building the trigger ${TRIGGER}"
          fi
          # The run title names the trigger (run-name is fixed at creation),
          # so say so when the build is a different, newer commit.
          if [ "$PICKED" != "$TRIGGER" ]; then
            echo "::notice title=Building a newer green commit::triggered by ${TRIGGER}; building ${PICKED}, the newest commit on main whose Backend CI is green"
          fi
          echo "sha=${PICKED}" >> "$GITHUB_OUTPUT"

      - name: Resolve SHA
        id: sha
        # An input reaches the shell through the environment, never interpolated.
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          NEWEST_GREEN: ${{ steps.newest.outputs.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="$NEWEST_GREEN"
          elif [ -n "$REQUESTED_SHA" ]; then
            if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::the sha input must be a full 40-character commit id"
              exit 1
            fi
            SHA="$REQUESTED_SHA"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Check GCP secrets availability
        id: secrets
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$IMAGE_PUBLISHER_SA" ]; then
            echo "gcp_configured=true" >> "$GITHUB_OUTPUT"
            echo "GCP Artifact Registry secrets are configured"
          else
            echo "gcp_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP Artifact Registry secrets not configured — skipping image publish and deploy"
          fi
        env:
          WIF_PROVIDER: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          IMAGE_PUBLISHER_SA: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      # -----------------------------------------------------------------------
      # Monotonic-deploy guard: never move dev to a commit it already serves.
      #
      # CI runs on main finish in whatever order the runners allow, so a deploy
      # can resolve a commit dev already serves: on 2026-09-04 00:56Z run
      # 33822126457 put 2ad52f348 on dev twenty minutes after e49774745 was
      # already serving, every run green (carnet#262). Picking the newest green
      # commit above makes that rarer, not impossible — when the picker falls
      # back to the trigger, or when the newest green commit is the one dev
      # already runs, this guard is what stops the rebuild. The concurrency
      # group serialises deploys by ARRIVAL, not by commit, so it cannot prevent
      # this — but it does guarantee that when this job runs no other deploy is
      # in flight, so the label read here is the commit dev will still be
      # serving when the build finishes.
      #
      # The steps sit in this job, before publish-server pulls from the
      # registry buildcache, so a refused deploy costs a few seconds and no
      # egress. workflow_run only: a push deploy builds github.sha, which is
      # the tip and cannot be behind dev, and a workflow_dispatch is a person
      # asking for exactly this commit — a deliberate rollback stays possible.
      #
      # The verdict is fail-open: the label read swallows its own failures,
      # and the script treats an absent, malformed or unknown live commit as
      # "deploy". The guard fires only when git can PROVE the resolved commit
      # is contained in the live one. Authentication is the one thing that is
      # loud instead — the same credentials and describe call as
      # post-deploy-verify.yml (repo-scoped secrets, no `environment:`), and
      # the same credentials deploy-dev needs minutes later, so a failure here
      # fails the run before a build rather than passing as a warning.
      # -----------------------------------------------------------------------
      - name: Authenticate to GCP (dev deployer)
        id: dev-auth
        if: github.event_name == 'workflow_run' && steps.secrets.outputs.gcp_configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud
        if: steps.dev-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Read the commit dev is serving
        id: live
        if: steps.dev-auth.outcome == 'success'
        run: |
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}-api"
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"

          # The serving revision, not the service template: after a deploy
          # whose revision never became ready, the template names the failed
          # commit while traffic still goes to the previous one.
          REV="$(gcloud run services describe "$SERVICE" --region="$REGION" \
                   --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          LIVE=""
          if [ -n "$REV" ]; then
            LIVE="$(gcloud run revisions describe "$REV" --region="$REGION" --format=json 2>/dev/null \
                      | jq -r '.metadata.labels["commit-sha"] // empty' || true)"
          fi

          if [ -z "$LIVE" ]; then
            echo "::warning title=Rollback guard inert::could not read the commit-sha label of the revision dev is serving (revision: '${REV}'); deploying ${{ steps.sha.outputs.sha }} unguarded"
          else
            echo "dev serves revision ${REV}, built from ${LIVE}"
          fi
          echo "sha=${LIVE}" >> "$GITHUB_OUTPUT"

      - name: Refuse to roll dev back
        id: guard
        if: steps.live.outputs.sha != ''
        # LIVE is a label value read off a cloud resource, so it reaches the
        # shell through the environment rather than interpolated into it.
        env:
          RESOLVED: ${{ steps.sha.outputs.sha }}
          LIVE: ${{ steps.live.outputs.sha }}
        run: |
          # Exit 1 is the ONLY verdict that skips. 0 deploys; anything else is
          # the script refusing its arguments, which is a workflow bug and must
          # not cost a deploy — it is reported and the deploy goes ahead.
          rc=0
          ./scripts/ci/check-deploy-ancestry.sh "$RESOLVED" "$LIVE" . || rc=$?
          case "$rc" in
            0)
              echo "rollback=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "rollback=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Deploy skipped (rollback)::dev already serves ${LIVE}, which contains ${RESOLVED}. Nothing built, nothing deployed."
              ;;
            *)
              echo "rollback=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Rollback guard inert::check-deploy-ancestry.sh exited ${rc}; deploying ${RESOLVED} unguarded"
              ;;
          esac

  # ---------------------------------------------------------------------------
  # Build and push server image to central Artifact Registry
  # ---------------------------------------------------------------------------
  publish-server:
    name: Publish Server Image
    runs-on: ubuntu-latest
    needs: resolve-sha
    # The rollback verdict is honoured here and in publish-frontend only. Every
    # later job reaches this one through `needs` with no status function in its
    # `if:`, so skipping the two publish jobs skips deploy-dev, tag-deployed-dev,
    # sdk-smoke-dev and seed-dev with them — the same path a missing GCP
    # secret already takes.
    if: needs.resolve-sha.outputs.gcp_configured == 'true' && needs.resolve-sha.outputs.rollback != 'true'

    outputs:
      image: ${{ steps.digest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      # The binaries are compiled here, on the runner, not inside docker build.
      # Compiling in Docker needs the cargo-chef dependency layer (~0.9 GB)
      # restored from the registry buildcache on every build — billed internet
      # egress out of Artifact Registry, because the runners sit outside GCP.
      # Here the dependencies come from the GitHub-hosted rust-cache that
      # ci-backend.yml's release-binary saves with this same action, which costs
      # nothing to restore. Before buildx: free-disk-space prunes docker images.
      - name: Build server binaries
        id: binaries
        uses: ./.github/actions/server-binaries
        with:
          deps-token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      # Installs gcloud rather than using the runner's: server-binaries frees disk
      # with a large-packages sweep that uninstalls the preinstalled Google Cloud
      # SDK, so `skip_install` would find no gcloud on PATH.
      - name: Configure Docker credential helper
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute server image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHORT_SHA="${{ needs.resolve-sha.outputs.short_sha }}"

          # `latest` is not pushed here: terraform.tfvars names `server:latest`,
          # and it must name what dev serves, not merely what was built — a
          # build can still fail its Trivy gate or its rollout. tag-deployed-dev
          # moves it once this image is deployed.
          SERVER_TAGS="${REGISTRY}/server:${SHORT_SHA}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            SERVER_TAGS="${SERVER_TAGS},${REGISTRY}/server:${VERSION}"
          fi

          echo "server_tags=${SERVER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          # Registry-backed buildx cache (Artifact Registry) instead of type=gha:
          # the GHA cache export flaked intermittently (tar/zstd exit 1) and is
          # capped/evicted; a registry buildcache tag is durable and reliable.
          # It lives in its own server-cache package, never in server: the
          # retention policy's keep-recent-versions floor counts versions per
          # package, so cache manifests sharing the image package would consume
          # the rollback window that is meant to hold images.
          #
          # mode=min: with BINARY_SOURCE=prebuilt the only stage besides the
          # runtime is the scratch stage holding this build's binaries, which
          # never repeats. Every layer worth reusing (apt, npm, CLIs) is in the
          # final image, which is exactly what mode=min exports. A build that
          # compiles in Docker (BINARY_SOURCE=builder) would need mode=max to
          # keep its cargo-chef dependency layer; this one has none.
          cache-from: type=registry,ref=${{ steps.tags.outputs.registry }}/server-cache:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.registry }}/server-cache:buildcache,mode=min,image-manifest=true,oci-mediatypes=true
          build-contexts: |
            prebuilt-bin=${{ steps.binaries.outputs.dir }}
          build-args: |
            BINARY_SOURCE=prebuilt
            GIT_COMMIT_SHA=${{ needs.resolve-sha.outputs.sha }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0

      # Trivy scans by registry digest, so with an empty cache it downloads every
      # layer of the image it just pushed — ~1 GiB of chromium, node and CLIs,
      # billed Artifact Registry egress on every build. Its layer-analysis cache
      # (fanal) is keyed by layer digest, and it fetches only layers missing from
      # it. The large layers change only when this Dockerfile does (apt epoch,
      # CLI versions), so the cache key follows the Dockerfile; the binary layers
      # are new every build and are cheap to fetch. Only fanal is cached: the
      # vulnerability DB comes from a free mirror and must stay fresh. The cache
      # is an artifact, not actions/cache — see the action for why.
      - name: Restore Trivy layer cache
        uses: ./.github/actions/trivy-layer-cache
        with:
          mode: restore
          name: trivy-fanal-server-${{ hashFiles('docker/images/server/Dockerfile') }}

      - name: Scan server image for vulnerabilities (report)
        # Reporting pass: no allowlist, never blocks. Trivy applies --ignorefile
        # as a result filter BEFORE it writes the report, so a SARIF produced by
        # the gating run below would omit every allowlisted CVE and raise no
        # GitHub Code Scanning alert at all. This pass writes the SARIF the
        # upload step consumes, and runs first with --exit-code 0 so the file
        # exists even when the gate fails.
        run: |
          trivy image \
            --format sarif --output trivy-server.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln --exit-code 0 \
            "${{ steps.tags.outputs.registry }}/server@${{ steps.build.outputs.digest }}"

      # Saved after the reporting pass, which never fails, so a gated build
      # still keeps the analysis it paid to download.
      - name: Save Trivy layer cache
        uses: ./.github/actions/trivy-layer-cache
        with:
          mode: save
          name: trivy-fanal-server-${{ hashFiles('docker/images/server/Dockerfile') }}

      - name: Scan server image for vulnerabilities (gate)
        # Gating pass over the same digest, allowlist applied. Run trivy directly
        # (not via trivy-action): the action did not apply our .trivyignore
        # allowlist — neither the trivyignores input nor TRIVY_IGNOREFILE env
        # took effect — so an allowlisted base-image CVE failed the build. An
        # explicit --ignorefile reliably applies the allowlist (verified
        # locally). The vulnerability DB and the analyzed image layers are
        # already in trivy's cache from the reporting pass, so this run is cheap.
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --scanners vuln --exit-code 1 \
            "${{ steps.tags.outputs.registry }}/server@${{ steps.build.outputs.digest }}"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: 'trivy-server.sarif'
          category: 'server-image'

      - name: Output server image digest
        id: digest
        run: |
          echo "image=${{ steps.tags.outputs.registry }}/server@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build and push frontend image to central Artifact Registry
  # ---------------------------------------------------------------------------
  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-latest
    needs: resolve-sha
    if: needs.resolve-sha.outputs.gcp_configured == 'true' && needs.resolve-sha.outputs.rollback != 'true'

    outputs:
      image: ${{ steps.digest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      # The SPA is built here and handed to the image as `prebuilt-dist`
      # (DIST_SOURCE=prebuilt), so the image build restores no bun or
      # node_modules layer from the registry cache.
      - name: Build frontend dist
        id: dist
        uses: ./.github/actions/frontend-dist
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Configure Docker credential helper
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute frontend image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHORT_SHA="${{ needs.resolve-sha.outputs.short_sha }}"

          # `latest` moves in tag-deployed-dev, after the deploy (see publish-server).
          FRONTEND_TAGS="${REGISTRY}/frontend:${SHORT_SHA}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            FRONTEND_TAGS="${FRONTEND_TAGS},${REGISTRY}/frontend:${VERSION}"
          fi

          echo "frontend_tags=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-contexts: |
            prebuilt-dist=${{ steps.dist.outputs.dir }}
          build-args: |
            DIST_SOURCE=prebuilt
          # Registry-backed buildx cache in its own frontend-cache package (see
          # server job for both halves of the reasoning) — replaces the flaky
          # type=gha cache whose export step intermittently failed the build.
          # mode=min: with DIST_SOURCE=prebuilt the only stage besides the
          # runtime is the scratch stage holding this build's dist, which never
          # repeats; the apk layer worth reusing is in the final image.
          cache-from: type=registry,ref=${{ steps.tags.outputs.registry }}/frontend-cache:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.registry }}/frontend-cache:buildcache,mode=min,image-manifest=true,oci-mediatypes=true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0

      # Layer-analysis cache so the scan does not re-download the pushed image
      # from Artifact Registry — see the server job.
      - name: Restore Trivy layer cache
        uses: ./.github/actions/trivy-layer-cache
        with:
          mode: restore
          name: trivy-fanal-frontend-${{ hashFiles('docker/images/frontend/Dockerfile') }}

      - name: Scan frontend image for vulnerabilities (report)
        # Reporting pass: no allowlist, never blocks — see the server job for why
        # the SARIF must come from an allowlist-free run and must be produced
        # before the gate.
        run: |
          trivy image \
            --format sarif --output trivy-frontend.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln --exit-code 0 \
            "${{ steps.tags.outputs.registry }}/frontend@${{ steps.build.outputs.digest }}"

      - name: Save Trivy layer cache
        uses: ./.github/actions/trivy-layer-cache
        with:
          mode: save
          name: trivy-fanal-frontend-${{ hashFiles('docker/images/frontend/Dockerfile') }}

      - name: Scan frontend image for vulnerabilities (gate)
        # Gating pass over the same digest, allowlist applied. Explicit trivy run
        # with --ignorefile (see server step) — the trivy-action did not apply
        # .trivyignore, so an allowlisted base-image CVE failed the build.
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --scanners vuln --exit-code 1 \
            "${{ steps.tags.outputs.registry }}/frontend@${{ steps.build.outputs.digest }}"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'frontend-image'

      - name: Output frontend image digest
        id: digest
        run: |
          echo "image=${{ steps.tags.outputs.registry }}/frontend@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy to development (every successful CI run on main)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    # resolve-sha is already an ancestor through the publish jobs; it is named
    # here because `needs.<job>.outputs` reaches direct dependencies only. The
    # CI gate is resolve-sha's `if:`: a run for a CI run that is not green
    # skips resolve-sha, and with it every job here.
    needs: [resolve-sha, publish-server, publish-frontend]
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment: development

    steps:
      # Before auth: checkout cleans the workspace, which would delete the
      # credentials file auth writes there.
      - name: Checkout (wait script)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Wait until no dev Cloud Run service is mid-rollout (before the API)
        # carnet#696: dev's services share one small Cloud SQL instance, and
        # revisions cold-starting together exhaust its connection slots. The
        # concurrency group above serialises this workflow only, so every roll
        # waits here until no dev service (the list lives in the script) is
        # mid-rollout, then waits for its own service to settle. A timeout fails
        # the job rather than deploying into a rollout.
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --timeout-seconds 900

      # The revision's `commit-sha` label is what resolve-sha reads back as the
      # commit dev is serving on the next workflow_run deploy. Left to the
      # action, the label is stamped from github.sha — the branch tip at run
      # creation, not the commit that was built, so on every workflow_run
      # deploy it names a commit that never reached the image. Both labels are
      # set here from the resolved sha; `skip_default_labels` keeps the action
      # from writing its own copy of either.
      - name: Deploy backend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-server.outputs.image }}
          skip_default_labels: true
          labels: |-
            managed-by=github-actions
            commit-sha=${{ needs.resolve-sha.outputs.sha }}

      - name: Wait for the API to settle
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service api --timeout-seconds 600

      - name: Wait until no dev Cloud Run service is mid-rollout (before the frontend)
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --timeout-seconds 900

      - name: Deploy frontend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-frontend.outputs.image }}
          skip_default_labels: true
          labels: |-
            managed-by=github-actions
            commit-sha=${{ needs.resolve-sha.outputs.sha }}

      - name: Wait for the frontend to settle
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service frontend --timeout-seconds 600

  # ---------------------------------------------------------------------------
  # Mark the digests dev is serving so registry retention keeps them
  # ---------------------------------------------------------------------------
  tag-deployed-dev:
    name: Tag Deployed Digests (dev)
    runs-on: ubuntu-latest
    needs: [publish-server, publish-frontend, deploy-dev]

    steps:
      # image-publisher (artifactregistry.writer), not the dev deployer: the tag
      # is written in the dravr-artifacts project, where the dev deployer has no
      # write access.
      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Tag deployed digests
        # Dev deploys by digest, so nothing on a serving image tells the registry
        # cleanup policy to spare it: once enough newer builds push it out of the
        # recent-versions floor, the age rule is free to delete the image dev is
        # running. The deployed-dev tag is matched by the keep-release-tags rule
        # (infra/artifacts, release_tag_prefixes), which wins over every delete
        # rule. The tag moves on the next deploy — the superseded digest keeps
        # its SHA tag and resumes normal ageing.
        #
        # `latest` moves here too, not at build time: `latest` (named by
        # terraform.tfvars) must name a digest that passed its Trivy gate and
        # rolled out, which only a deployed one has.
        run: |
          for IMAGE in \
            "${{ needs.publish-server.outputs.image }}" \
            "${{ needs.publish-frontend.outputs.image }}"; do
            PACKAGE="${IMAGE%@*}"
            for TAG in deployed-dev latest; do
              echo "Tagging ${IMAGE} as ${PACKAGE}:${TAG}"
              gcloud artifacts docker tags add "${IMAGE}" "${PACKAGE}:${TAG}" --quiet
            done
          done

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # MCP SDK smoke test (after dev deploy)
  #
  # The only job that exercises the shipped artifact the way a user does: the
  # real SDK bundle, over HTTPS, through nginx, against the deployed binary,
  # with a real credential. Everything else in CI reaches a localhost server and
  # therefore cannot see a routing, deploy or auth regression.
  #
  # On 2026-08-04 all three were live at once behind eight green workflows:
  # POST /mcp returned nginx's 405 (unroutable), /oauth2/register the same
  # (broken client registration), and every API key failed authentication in
  # deployed environments. Each was found by hand, not by CI.
  # ---------------------------------------------------------------------------
  sdk-smoke-dev:
    name: MCP SDK Smoke (dev)
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match every other workflow. Unpinned, setup-bun resolved
          # 1.1.0, which predates the text-format bun.lock (bun >= 1.2) and so
          # reported "lockfile had changes, but lockfile is frozen" against a
          # lockfile that is in fact in sync — failing this job on every deploy.
          bun-version: "1.3.4"

      - name: Build the SDK bundle
        working-directory: sdk
        run: bun install --frozen-lockfile && bun run build

      - name: Drive the SDK against the deployed endpoint
        env:
          PIERRE_SERVER_URL: ${{ vars.DEV_PUBLIC_BASE_URL }}
          # Long-lived API key for the jf_test@dravr.ai test account, starter
          # tier, revocable via POST /admin/revoke. Rotate by provisioning a new
          # key and updating this secret; the smoke test names expiry as a
          # likely cause when it fails.
          PIERRE_JWT_TOKEN: ${{ secrets.DEV_MCP_SMOKE_KEY }}
        run: ./scripts/ci/mcp-sdk-smoke.sh

  # Run Seed Jobs (after dev deploy)
  # ---------------------------------------------------------------------------
  seed-dev:
    name: Run Seed Jobs (dev)
    runs-on: ubuntu-latest
    needs: [deploy-dev, publish-server]
    environment: development

    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Update seed job images
        run: |
          IMAGE="${{ needs.publish-server.outputs.image }}"
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          JOBS="seed-bootstrap seed-coaches seed-mobility"
          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            JOBS="$JOBS seed-synthetic"
          fi

          for JOB in $JOBS; do
            echo "Updating ${SERVICE}-${JOB} image..."
            gcloud run jobs update "${SERVICE}-${JOB}" \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --quiet
          done

      - name: Run seed-bootstrap (must complete before other seeds)
        run: |
          gcloud run jobs execute "${{ vars.GCP_DEV_SERVICE_NAME }}-seed-bootstrap" \
            --region="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}" \
            --wait

      - name: Run remaining seed jobs
        # Bash `wait $PIDS` returns the exit status of the LAST waited PID
        # only — earlier failures are silently dropped. That's how the
        # 2026-05-01 seed-coaches breakage (c6630e46) hid for 3.5 weeks:
        # seed-coaches exit-1, seed-mobility exit-0, `wait` returns mobility's
        # status, step "succeeds." Fix: `wait $PID` per PID, capture per-job
        # exit codes, fail the step if ANY job failed.
        run: |
          REGION="${{ vars.GCP_DEV_CLOUD_RUN_REGION }}"
          SERVICE="${{ vars.GCP_DEV_SERVICE_NAME }}"

          declare -A JOB_PIDS

          gcloud run jobs execute "${SERVICE}-seed-coaches" --region="${REGION}" --wait &
          JOB_PIDS[seed-coaches]=$!

          gcloud run jobs execute "${SERVICE}-seed-mobility" --region="${REGION}" --wait &
          JOB_PIDS[seed-mobility]=$!

          if [ "${{ vars.ENABLE_SYNTHETIC_SEED }}" = "true" ]; then
            gcloud run jobs execute "${SERVICE}-seed-synthetic" --region="${REGION}" --wait &
            JOB_PIDS[seed-synthetic]=$!
          else
            echo "Skipping seed-synthetic (ENABLE_SYNTHETIC_SEED != true)"
          fi

          # Wait for each PID individually and capture its exit code; bash's
          # multi-arg `wait` only returns the last status, which loses all the
          # earlier ones. Collect failures and fail the step at the end.
          FAILED_JOBS=()
          for JOB in "${!JOB_PIDS[@]}"; do
            PID="${JOB_PIDS[$JOB]}"
            if wait "$PID"; then
              echo "${JOB} (PID ${PID}) completed successfully"
            else
              EXIT_CODE=$?
              echo "${JOB} (PID ${PID}) failed with exit code ${EXIT_CODE}"
              FAILED_JOBS+=("${JOB}")
            fi
          done

          if [ "${#FAILED_JOBS[@]}" -gt 0 ]; then
            echo ""
            echo "Seed job(s) failed: ${FAILED_JOBS[*]}"
            echo "Inspect logs:"
            for JOB in "${FAILED_JOBS[@]}"; do
              echo "  gcloud run jobs executions list --job=${SERVICE}-${JOB} --region=${REGION} --limit=1"
            done
            exit 1
          fi

          echo "All seed jobs completed successfully"

  # ---------------------------------------------------------------------------
  # Deploy to production (every v*.*.* tag)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-server, publish-frontend]
    # Production deployment is disabled. To re-enable, replace the line below with:
    # if: startsWith(github.ref, 'refs/tags/v')
    if: false
    environment: production

    steps:
      - name: Authenticate to GCP (prod deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOYER_SA }}

      - name: Deploy backend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-api
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-server.outputs.image }}

      - name: Deploy frontend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish-frontend.outputs.image }}
