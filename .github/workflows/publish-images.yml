# ABOUTME: Builds and publishes Docker images to the central Artifact Registry, then deploys to Cloud Run
# ABOUTME: Triggered on merges to main (SHA-tagged dev images) and v*.*.* tags (versioned + latest prod images)

name: Publish Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Build and push server + frontend images to central Artifact Registry
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    outputs:
      server_image: ${{ steps.server-digest.outputs.image }}
      frontend_image: ${{ steps.frontend-digest.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      - name: Configure Docker credential helper
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Configure Docker for Artifact Registry
        # Extract the registry hostname (first segment of the registry URL) for the credential helper
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"

          SERVER_TAGS="${REGISTRY}/server:${SHORT_SHA}"
          FRONTEND_TAGS="${REGISTRY}/frontend:${SHORT_SHA}"

          # On v*.*.* tags, also push versioned + latest
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            SERVER_TAGS="${SERVER_TAGS},${REGISTRY}/server:${VERSION},${REGISTRY}/server:latest"
            FRONTEND_TAGS="${FRONTEND_TAGS},${REGISTRY}/frontend:${VERSION},${REGISTRY}/frontend:latest"
          fi

          echo "server_tags=${SERVER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${FRONTEND_TAGS}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        id: server-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Output server image digest
        id: server-digest
        run: |
          REGISTRY="${{ steps.tags.outputs.registry }}"
          DIGEST="${{ steps.server-build.outputs.digest }}"
          echo "image=${REGISTRY}/server@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Output frontend image digest
        id: frontend-digest
        run: |
          REGISTRY="${{ steps.tags.outputs.registry }}"
          DIGEST="${{ steps.frontend-build.outputs.digest }}"
          echo "image=${REGISTRY}/frontend@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy to development (every merge to main)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment: development

    steps:
      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Deploy backend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish.outputs.server_image }}

      - name: Deploy frontend to Cloud Run (dev)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ needs.publish.outputs.frontend_image }}

  # ---------------------------------------------------------------------------
  # Deploy to production (every v*.*.* tag)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Authenticate to GCP (prod deployer)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOYER_SA }}

      - name: Deploy backend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-api
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish.outputs.server_image }}

      - name: Deploy frontend to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_PROD_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_PROD_CLOUD_RUN_REGION }}
          image: ${{ needs.publish.outputs.frontend_image }}
