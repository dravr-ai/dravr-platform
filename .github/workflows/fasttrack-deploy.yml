# ABOUTME: Fasttrack deploy to dev — builds and deploys without waiting for CI tests
# ABOUTME: Manual trigger only (workflow_dispatch) for rapid iteration on deployed features
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Deploy: Hotfix (skip CI)"

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'What to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - server
          - frontend
          - both

permissions:
  contents: read
  id-token: write

jobs:
  publish-and-deploy:
    name: Build & Deploy (${{ inputs.component }})
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      # Compiled on the runner against the rust-cache ci-backend.yml saves, as
      # publish-images.yml does — the registry buildcache is mode=min and holds
      # no cargo-chef layer to compile against. Before buildx: free-disk-space
      # prunes docker images.
      - name: Build server binaries
        if: inputs.component == 'server' || inputs.component == 'both'
        id: binaries
        uses: ./.github/actions/server-binaries
        with:
          deps-token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GCP (Artifact Registry)
        uses: google-github-actions/auth@v3
        id: auth-artifacts
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_PUBLISHER_SA }}

      # Installs gcloud for every later step (docker auth, the rollout waits):
      # server-binaries frees disk with a large-packages sweep that uninstalls
      # the runner's preinstalled Google Cloud SDK.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST="$(echo '${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}' | cut -d'/' -f1)"
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "server_tag=${REGISTRY}/server:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${REGISTRY}/frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        if: inputs.component == 'server' || inputs.component == 'both'
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tag }}
          # Registry-backed buildx cache (Artifact Registry) — durable + reliable
          # vs the flaky type=gha cache; reuses the runtime layers (apt, node,
          # CLIs) so they are not rebuilt. It lives in the server-cache package
          # that publish-images.yml writes, never in server: the retention
          # policy's keep-recent-versions floor counts versions per package, so
          # cache manifests sharing the image package would consume the rollback
          # window that is meant to hold images. mode=min for the reason given
          # in publish-images.yml.
          cache-from: type=registry,ref=${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/server-cache:buildcache
          cache-to: type=registry,ref=${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/server-cache:buildcache,mode=min,image-manifest=true,oci-mediatypes=true
          build-contexts: |
            prebuilt-bin=${{ steps.binaries.outputs.dir }}
          build-args: |
            BINARY_SOURCE=prebuilt
            GIT_COMMIT_SHA=${{ github.sha }}

      - name: Build and push frontend image
        if: inputs.component == 'frontend' || inputs.component == 'both'
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tag }}
          no-cache: true
          # Registry-backed buildx cache in the frontend-cache package (see the
          # server step for both halves of the reasoning) — replaces the flaky
          # type=gha cache-to export that intermittently failed the build.
          cache-to: type=registry,ref=${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/frontend-cache:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to GCP (dev deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Wait until no dev Cloud Run service is mid-rollout (before the server)
        # carnet#696: dev's services share one small Cloud SQL instance, and
        # revisions cold-starting together exhaust its connection slots. A
        # hotfix skips CI, never this: every roll waits until no dev service
        # (the list lives in the script) is mid-rollout, then waits for its own
        # service to settle. A timeout fails the job rather than deploying into
        # a rollout.
        if: (inputs.component == 'server' || inputs.component == 'both') && steps.server.outcome == 'success'
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --timeout-seconds 900

      - name: Deploy server to Cloud Run (dev)
        if: (inputs.component == 'server' || inputs.component == 'both') && steps.server.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-api
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ steps.tags.outputs.server_tag }}@${{ steps.server.outputs.digest }}

      - name: Wait for the API to settle
        if: (inputs.component == 'server' || inputs.component == 'both') && steps.server.outcome == 'success'
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service api --timeout-seconds 600

      - name: Wait until no dev Cloud Run service is mid-rollout (before the frontend)
        if: (inputs.component == 'frontend' || inputs.component == 'both') && steps.frontend.outcome == 'success'
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh quiesce --region "${REGION}" --prefix "${PREFIX}" --timeout-seconds 900

      - name: Deploy frontend to Cloud Run (dev)
        if: (inputs.component == 'frontend' || inputs.component == 'both') && steps.frontend.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-frontend
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ steps.tags.outputs.frontend_tag }}@${{ steps.frontend.outputs.digest }}

      - name: Wait for the frontend to settle
        if: (inputs.component == 'frontend' || inputs.component == 'both') && steps.frontend.outcome == 'success'
        env:
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREFIX: ${{ vars.GCP_DEV_SERVICE_NAME }}
        run: ./scripts/ci/wait-cloud-run-service-ready.sh service --region "${REGION}" --prefix "${PREFIX}" --service frontend --timeout-seconds 600
