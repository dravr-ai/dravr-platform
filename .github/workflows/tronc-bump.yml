# ABOUTME: Moves the platform onto a new dravr-tronc release — bump, CI gate, squash merge on green
# ABOUTME: Ten lines of wiring; the chain itself lives in dravr-tronc/.github/workflows/consumer-bump.yml

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# The consumer half of the tronc release wire, the same file every satellite
# carries. dravr-tronc's notify-consumers.yml fires `tronc-released` at every
# live repo in the org; this file is what makes the platform answer, and adding
# it is the whole enrolment step.
#
# The logic is a reusable workflow in dravr-tronc so a fix lands once instead of
# eleven times. It runs HERE, in this repo's context, with this repo's
# GITHUB_TOKEN — which is the only reason it can push at all. No token in the
# org can push across repo boundaries; contremaitre-bump.yml records that
# finding at its line 155. DRAVR_PRIVATE_DEPS_TOKEN is present on this repo, so
# the chain's private-git-dep step arms for dravr-stripe and dravr-photograveur.
#
# Three things differ from a satellite. The gate is the three lanes
# embacle-bump.yml already dispatches; on a fix/* branch ci-postgres runs the
# eight-file smoke rather than the suite, so 45 minutes fits inside the chain's
# 60-minute gate job. A tronc minor is not always pin-only here — 0.10 and
# 0.11 moved JsonSchema::properties to BTreeMap and forced fifteen source
# files; a red gate then means source work, not a flake, and the stall issue
# the chain files on the register says so. And embacle moves in lockstep:
# embacle-tool-host pins tronc itself and ships from crates.io, so a tronc
# bump that leaves it behind resolves two tronc versions and hard-fails the
# duplicate gate — which blocked the platform on 2026-08-31 and 2026-09-03.
# The chain bumps embacle and embacle-tool-host to their latest release in
# the same commit, after checking that release is on the target tronc; if it
# is not, the run says which crate to release first and rewrites nothing.
#
# The schedule is a safety net for a dispatch that never arrived; offset off
# the top of the hour and staggered against the other consumers.
#
# Filed under carnet#330.

name: "Tronc: Bump"

on:
  repository_dispatch:
    types: [tronc-released]
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "tronc version to move onto (defaults to tronc's latest release)"
        required: false
        type: string
      dry_run:
        description: "Rewrite, resolve and assert on the runner, then stop — no branch, gates, merge or register issue"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch

concurrency:
  # Two releases integrating at once would race on main, and the second would
  # push a lockfile resolved against the first one's manifests.
  group: tronc-bump
  cancel-in-progress: false

jobs:
  bump:
    uses: dravr-ai/dravr-tronc/.github/workflows/consumer-bump.yml@main
    with:
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      ci_workflows: "ci-backend.yml ci-postgres.yml integration-tests.yml"
      gate_timeout_minutes: 45
      lockstep_crates: "embacle embacle-tool-host"
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
