# ABOUTME: Integrates a dravr-enforme release — moves the enforme and sciotte pins together, then deploys
# ABOUTME: Last hop of sciotte -> enforme -> platform; both pins move as one because CI bans dravr-* duplicates
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# Why this listens to enforme rather than to sciotte. This repo pins dravr-sciotte
# directly (pierre-logging, pierre-providers, pierre-routes-auth) and also depends on
# dravr-enforme, which pins dravr-sciotte itself for its Garmin and Strava scraping —
# a diamond. ci-backend.yml hard-fails any build where a dravr-* crate resolves to two
# versions, so moving the sciotte pin alone produces a lockfile with two dravr-sciotte
# entries and a branch that can never merge.
#
# That is the real reason the pin sat on v0.8.0 through five sciotte releases. It read
# as neglect and was actually a blocked edge with nothing reporting the block: the old
# sciotte-pin-check.yml faithfully filed "the pin is behind" issues for a bump that
# could not have succeeded.
#
# So sciotte announces to enforme, enforme bumps and releases, and this moves both pins
# in one commit — taking the sciotte version from what the released enforme pins, so the
# two arms converge by construction rather than by two workflows happening to agree.
#
# Ordering is the other safety property: the sciotte image is built and :latest advanced
# only after main has merged. Building earlier would leave :latest pointing at a version
# this repo never accepted, and since terraform's sciotte_image is that moving tag, the
# next unrelated apply would deploy it.

name: "Enforme: Release Integration"

on:
  repository_dispatch:
    types: [enforme-released]
  schedule:
    # Weekly safety net, so a missed or failed dispatch still gets integrated.
    # Off :00 deliberately: the top of the hour is the most contended slot on
    # GitHub's scheduler, and this lane's 2026-08-31 firing landed 6h20m late
    # (19:20 UTC for a 13:00 slot), well after anyone would look for it. :11
    # also keeps it clear of photograveur-bump's :30 in the same hour.
    - cron: "11 13 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "dravr-enforme tag to integrate (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch
  id-token: write # WIF, for the image build and the deploy
  security-events: write # Trivy SARIF, uploaded by the image build

concurrency:
  group: enforme-bump
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Which enforme, which sciotte, and is there anything to do?
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target versions
    runs-on: ubuntu-latest
    outputs:
      enforme: ${{ steps.v.outputs.enforme }}
      sciotte: ${{ steps.v.outputs.sciotte }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and verify both versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ENFORME="${PAYLOAD_VERSION:-${INPUT_VERSION:-}}"
          if [ -z "${ENFORME}" ]; then
            ENFORME=$(gh api repos/dravr-ai/dravr-enforme/releases/latest -q .tag_name)
          fi
          if [ -z "${ENFORME}" ]; then
            echo "::error::could not resolve a dravr-enforme version to integrate"
            exit 1
          fi
          if ! gh api "repos/dravr-ai/dravr-enforme/releases/tags/${ENFORME}" -q .tag_name >/dev/null 2>&1; then
            echo "::error::${ENFORME} is not a published dravr-enforme release"
            exit 1
          fi

          # Read the sciotte tag from the released enforme's own manifest rather than
          # from the dispatch payload. The payload is a convenience; this is the
          # authority, and reading it here is what guarantees both arms of the diamond
          # land on the same version even if the payload is stale or absent.
          ENFORME_MANIFEST=$(gh api "repos/dravr-ai/dravr-enforme/contents/Cargo.toml?ref=${ENFORME}" \
                               -H "Accept: application/vnd.github.raw")
          SCIOTTE=$(printf '%s' "${ENFORME_MANIFEST}" \
                    | grep -oE 'dravr-sciotte = \{ git = "[^"]+", tag = "v[0-9]+\.[0-9]+\.[0-9]+"' \
                    | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "${SCIOTTE}" ]; then
            echo "::error::could not read the dravr-sciotte tag pinned by dravr-enforme ${ENFORME}"
            exit 1
          fi

          CUR_ENFORME=$(grep -oE 'dravr-enforme = \{ version = "[^"]+", git = "[^"]+", tag = "v[0-9]+\.[0-9]+\.[0-9]+"' \
                          crates/pierre-enforme/Cargo.toml | grep -oE 'tag = "v[0-9.]+"' | grep -oE 'v[0-9.]+' | head -1)
          CUR_SCIOTTE=$(grep -oE 'dravr-sciotte = \{ git = "[^"]+", tag = "v[0-9]+\.[0-9]+\.[0-9]+"' \
                          crates/pierre-providers/Cargo.toml | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "${CUR_ENFORME}" ] || [ -z "${CUR_SCIOTTE}" ]; then
            echo "::error::could not read the current pins (enforme='${CUR_ENFORME}' sciotte='${CUR_SCIOTTE}') — a line shape changed"
            exit 1
          fi

          echo "enforme=${ENFORME}" >> "$GITHUB_OUTPUT"
          echo "sciotte=${SCIOTTE}" >> "$GITHUB_OUTPUT"
          if [ "${CUR_ENFORME}" = "${ENFORME}" ] && [ "${CUR_SCIOTTE}" = "${SCIOTTE}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "already on enforme ${ENFORME} / sciotte ${SCIOTTE} — nothing to integrate"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "integrating enforme ${CUR_ENFORME} -> ${ENFORME}, sciotte ${CUR_SCIOTTE} -> ${SCIOTTE}"
          fi

  # ---------------------------------------------------------------------------
  # 2. Move both pins, on a branch, and prove the lock converged
  # ---------------------------------------------------------------------------
  bump:
    name: Bump both pins on a branch
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    outputs:
      branch: ${{ steps.push.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Configure auth for private git deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Rewrite both pins and re-resolve the lockfile
        env:
          ENFORME: ${{ needs.resolve.outputs.enforme }}
          SCIOTTE: ${{ needs.resolve.outputs.sciotte }}
        run: |
          set -euo pipefail
          ENFORME_BARE="${ENFORME#v}"

          # Auto-discover consumers rather than hardcoding them, for the reason
          # contremaitre-bump learned: a hardcoded list left one crate behind, which put
          # two revs of one dependency in the lock and hard-failed the Security Audit.
          SCIOTTE_MANIFESTS=$(grep -rl 'dravr-sciotte = { git' crates/ --include=Cargo.toml)
          ENFORME_MANIFESTS=$(grep -rl 'dravr-enforme = { version' crates/ --include=Cargo.toml)
          if [ -z "${SCIOTTE_MANIFESTS}" ] || [ -z "${ENFORME_MANIFESTS}" ]; then
            echo "::error::no manifest pins dravr-sciotte or dravr-enforme — workflow assumption broke"
            exit 1
          fi
          echo "sciotte consumers:"; echo "${SCIOTTE_MANIFESTS}"
          echo "enforme consumers:"; echo "${ENFORME_MANIFESTS}"

          for m in ${SCIOTTE_MANIFESTS}; do
            sed -i -E "s|(dravr-sciotte = \{ git = \"[^\"]+\", tag = \")v[0-9]+\.[0-9]+\.[0-9]+\"|\1${SCIOTTE}\"|" "$m"
            TAG=$(grep 'dravr-sciotte = { git' "$m" | grep -oE 'tag = "v[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
            if [ "${TAG}" != "${SCIOTTE}" ]; then
              echo "::error::${m} pins dravr-sciotte at ${TAG:-<unparseable>}, expected ${SCIOTTE}"
              exit 1
            fi
          done

          # The enforme line carries a semver `version` and a `tag` that must agree, so
          # both move or cargo resolves the pin against a version that is not the tag.
          for m in ${ENFORME_MANIFESTS}; do
            sed -i -E "s|(dravr-enforme = \{ version = \")[0-9]+\.[0-9]+\.[0-9]+(\", git = \"[^\"]+\", tag = \")v[0-9]+\.[0-9]+\.[0-9]+\"|\1${ENFORME_BARE}\2${ENFORME}\"|" "$m"
            TAG=$(grep 'dravr-enforme = { version' "$m" | grep -oE 'tag = "v[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
            VER=$(grep 'dravr-enforme = { version' "$m" | grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ "${TAG}" != "${ENFORME}" ] || [ "${VER}" != "${ENFORME_BARE}" ]; then
              echo "::error::${m} pins dravr-enforme at version=${VER:-?} tag=${TAG:-?}, expected ${ENFORME_BARE}/${ENFORME}"
              exit 1
            fi
          done

          cargo update -p dravr-sciotte -p dravr-enforme

          # Prove the lock converged. `cargo update -p` resolves the new tag but leaves
          # the old entry behind while anything still references it, and a second entry
          # is exactly what ci-backend's `dravr-* duplicate check` hard-fails on. This is
          # the whole reason both pins move in one commit, so assert it here rather than
          # discover it twenty minutes into CI.
          for dep in dravr-sciotte dravr-enforme; do
            COUNT=$(grep -c "^name = \"${dep}\"" Cargo.lock || true)
            if [ "${COUNT}" != "1" ]; then
              echo "::error::Cargo.lock carries ${COUNT} ${dep} entries; expected exactly 1"
              grep -A2 "^name = \"${dep}\"" Cargo.lock || true
              exit 1
            fi
          done
          for want in "tag=${SCIOTTE}#" "tag=${ENFORME}#"; do
            if ! grep -q "${want}" Cargo.lock; then
              echo "::error::Cargo.lock did not move to ${want%#}"
              exit 1
            fi
          done
          echo "lock converged on sciotte ${SCIOTTE} and enforme ${ENFORME}"

      - name: Push the branch and dispatch the gates onto it
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENFORME: ${{ needs.resolve.outputs.enforme }}
        run: |
          set -euo pipefail
          BRANCH="fix/enforme-${ENFORME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add $(grep -rl 'dravr-sciotte = { git\|dravr-enforme = { version' crates/ --include=Cargo.toml) Cargo.lock
          git commit -m "chore(deps): bump dravr-enforme to ${ENFORME} and dravr-sciotte to ${{ needs.resolve.outputs.sciotte }}"
          git push --force-with-lease origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # GitHub suppresses workflow runs on pushes made with GITHUB_TOKEN, so this
          # branch triggers nothing on its own and the gate below would wait forever on
          # runs that never start. Dispatch each gate explicitly. A PAT would avoid
          # this, but DRAVR_PRIVATE_DEPS_TOKEN is read-only on this repo.
          for wf in ci-backend.yml ci-postgres.yml integration-tests.yml; do
            gh workflow run "$wf" --ref "${BRANCH}"
            echo "dispatched ${wf} on ${BRANCH}"
          done

  # ---------------------------------------------------------------------------
  # 3. Require green
  # ---------------------------------------------------------------------------
  gate:
    name: Wait for CI on the bump branch
    runs-on: ubuntu-latest
    needs: [resolve, bump]
    timeout-minutes: 60
    steps:
      - name: Poll until every gate reaches a terminal status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          WORKFLOWS="ci-backend.yml ci-postgres.yml integration-tests.yml"
          DEADLINE=$(( $(date +%s) + 45 * 60 ))

          # The branch is created fresh per version and nothing else pushes to it, so
          # the newest run per workflow on it is unambiguously ours. Matching by commit
          # was rejected: `gh run list --commit` silently returns zero rows.
          while :; do
            PENDING=""; FAILED=""
            for wf in ${WORKFLOWS}; do
              LINE=$(gh run list --workflow "$wf" --branch "${BRANCH}" --limit 1 \
                       --json status,conclusion \
                       -q '.[0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null || true)
              STATUS="${LINE%% *}"; CONCL="${LINE##* }"
              if [ -z "${LINE}" ] || [ "${STATUS}" != "completed" ]; then
                PENDING="${PENDING} ${wf}(${STATUS:-not-started})"
              elif [ "${CONCL}" != "success" ]; then
                # cancelled and skipped are not green. A cancelled run validated nothing.
                FAILED="${FAILED} ${wf}(${CONCL})"
              fi
            done

            if [ -n "${FAILED}" ]; then
              echo "::error::CI is not green on ${BRANCH}:${FAILED} — the branch is left in place for inspection"
              exit 1
            fi
            if [ -z "${PENDING}" ]; then
              echo "all gates green on ${BRANCH}"
              break
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::timed out after 45m waiting on:${PENDING}"
              exit 1
            fi
            echo "waiting on:${PENDING}"
            sleep 60
          done

  # ---------------------------------------------------------------------------
  # 4. Squash onto main
  # ---------------------------------------------------------------------------
  merge:
    name: Squash merge onto main
    runs-on: ubuntu-latest
    needs: [resolve, bump, gate]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Squash merge and delete the branch
        env:
          BRANCH: ${{ needs.bump.outputs.branch }}
          ENFORME: ${{ needs.resolve.outputs.enforme }}
          SCIOTTE: ${{ needs.resolve.outputs.sciotte }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${BRANCH}"
          git merge --squash "origin/${BRANCH}"
          git commit -m "chore(deps): integrate dravr-enforme ${ENFORME} with dravr-sciotte ${SCIOTTE}"
          git push origin main
          # Squash gives the merge a new SHA, so the branch is dead the moment it lands.
          git push origin --delete "${BRANCH}"

  # ---------------------------------------------------------------------------
  # 5. Build the sciotte image — only now that main has accepted this version
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish the sciotte image
    needs: [resolve, bump, gate, merge]
    # Runs whether or not a bump was needed, so the deployment converges on whatever
    # sciotte version main pins. Gating this on `needed` instead meant a re-run after
    # a merge skipped everything, leaving no way to finish a deploy that had failed
    # after the bump already landed — which is precisely the state a false-alarm
    # rollback leaves behind. What must not happen is building after a *failed* bump,
    # so this checks for failure rather than for skipping.
    if: >-
      ${{ !cancelled()
          && needs.resolve.result == 'success'
          && needs.bump.result != 'failure'
          && needs.gate.result != 'failure'
          && needs.merge.result != 'failure' }}
    uses: ./.github/workflows/publish-sciotte-image.yml
    secrets: inherit
    with:
      sciotte_ref: ${{ needs.resolve.outputs.sciotte }}

  # ---------------------------------------------------------------------------
  # 6. Deploy, verify the bytes, roll back if it goes wrong
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy sciotte to dev
    runs-on: ubuntu-latest
    needs: [resolve, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    environment: development
    steps:
      - name: Authenticate to GCP (dev deployer)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}
          # sciotte enforces Cloud Run IAM (backend_sciotte_iam, on since
          # 118571ed3), so the HTTP probe below needs a Google-signed identity
          # token — an anonymous request is refused with 403 before any identity
          # is considered. The audience mirrors terraform's local.sciotte_audience
          # ("dravr-sciotte-${var.environment}"), the stable literal the service
          # declares in custom_audiences; the generated URL is not known this
          # early in the job. include_email is required, not cosmetic: Cloud Run
          # matches the token's email claim against the invoker policy, and a
          # token minted without it is rejected exactly like an anonymous one.
          #
          # The suffix is "development", not "dev": the tfvars directory is named
          # environments/dev/ but the `environment` variable inside it is
          # "development". Guessing "dev" from the path yields a token Cloud Run
          # rejects with 401 — a valid token for an audience the service does not
          # accept, which looks nothing like the 403 an unauthenticated call gets.
          token_format: id_token
          id_token_audience: dravr-sciotte-development
          id_token_include_email: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Capture the digest currently serving
        id: prev
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-sciotte
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          PREV=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                   --format='value(status.imageDigest)')
          # Refuse to deploy with no rollback target. A rollback step that silently has
          # nothing to roll back to is worse than none, because the workflow would still
          # report that it recovered.
          if [ -z "${PREV}" ]; then
            echo "::error::could not read the serving digest of ${REV} — refusing to deploy without a rollback target"
            exit 1
          fi
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "serving ${REV} at ${PREV}"

      - name: Deploy
        # Deploys the moving :latest tag rather than the digest, because that is the
        # literal value terraform holds in sciotte_image. Deploying a digest would leave
        # the service permanently disagreeing with its own terraform, so every later
        # apply would bounce it. The digest is asserted immediately below.
        #
        # Cloud Run refuses to shift traffic to a revision that fails its startup probe
        # (GET /health, 10 attempts at 5s), so a container that cannot boot leaves the
        # previous revision serving and fails this step. That probe is the health check;
        # the rollback below covers the rest.
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_DEV_SERVICE_NAME }}-sciotte
          region: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          image: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}/sciotte:latest

      - name: Assert the serving bytes are the bytes we built and scanned
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-sciotte
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          REGISTRY: ${{ vars.GCP_ARTIFACTS_REGISTRY_URL }}
          EXPECTED: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          REV=$(gcloud run services describe "${SVC}" --region "${REGION}" \
                  --format='value(status.latestReadyRevisionName)')
          GOT=$(gcloud run revisions describe "${REV}" --region "${REGION}" \
                  --format='value(status.imageDigest)')

          # buildx publishes an OCI *index*, because it attaches a provenance
          # attestation alongside the image. build-push-action reports that index's
          # digest, while Cloud Run resolves the tag down to the linux/amd64 child and
          # records the child. The two are never equal, so comparing them directly
          # fails every time on a deploy that in fact shipped the right bytes — which
          # is exactly what it did, rolling dev back to the previous digest over a
          # correct rollout. Accept the index digest or any of its children.
          HOST="${REGISTRY%%/*}"
          PATH_PART="${REGISTRY#*/}/sciotte"
          TOKEN=$(gcloud auth print-access-token)
          CHILDREN=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://${HOST}/v2/${PATH_PART}/manifests/${EXPECTED}" \
            | jq -r '(.manifests // [])[].digest' || true)

          for candidate in ${EXPECTED} ${CHILDREN}; do
            if [ "${GOT}" = "${candidate}" ] || [ "${GOT##*@}" = "${candidate}" ]; then
              echo "serving ${REV} at ${GOT} (matches ${candidate})"
              exit 0
            fi
          done
          echo "::error::${REV} serves ${GOT}, which is neither ${EXPECTED} nor any manifest it indexes"
          echo "index children were: ${CHILDREN:-<none>}"
          exit 1

      - name: Probe the service over HTTP
        # Cloud Run's startup probe already proved the container answers /health, but
        # only that it answered — a build that lost a provider still boots. This asserts
        # what the service says about itself: ok, and both scraping providers present.
        #
        # The service is INGRESS_TRAFFIC_ALL (the API pod egresses PRIVATE_RANGES_ONLY,
        # so internal-only ingress would drop its calls) but NOT unauthenticated:
        # backend_sciotte_iam has been true since 118571ed3, so Cloud Run verifies a
        # Google-signed identity token and checks roles/run.invoker. The deployer SA
        # carries that permission through its project-level roles/run.admin, which
        # includes run.routes.invoke — no extra grant is needed, only the token.
        #
        # This step read as "the new image is unhealthy" for a week (carnet#164) while
        # the real answer was a 403 the probe never named. The status code is now
        # reported on failure so an auth refusal can never again be mistaken for a
        # sick container: curl exits 22 on any >=400, and -f prints no body to say why.
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-sciotte
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SVC}" --region "${REGION}" --format='value(status.url)')

          CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 30 --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/health")
          if [ "${CODE}" != "200" ]; then
              echo "::error::GET ${URL}/health returned HTTP ${CODE} — 401 means the identity token was rejected (usually a custom_audiences mismatch), 403 means no run.invoker; neither is a sick container"
              head -c 500 /tmp/health.json || true
              exit 1
          fi
          BODY=$(cat /tmp/health.json)
          echo "${BODY}" | jq .

          STATUS=$(jq -r '.status' <<<"${BODY}")
          [ "${STATUS}" = "ok" ] || { echo "::error::/health reports status=${STATUS}"; exit 1; }
          for p in garmin strava; do
            jq -e --arg p "$p" '.providers | index($p)' <<<"${BODY}" >/dev/null \
              || { echo "::error::/health does not advertise the ${p} provider"; exit 1; }
          done
          echo "healthy: ${URL} advertises $(jq -c '.providers' <<<"${BODY}")"

      - name: Roll back to the previously serving digest
        if: failure()
        env:
          SVC: ${{ vars.GCP_DEV_SERVICE_NAME }}-sciotte
          REGION: ${{ vars.GCP_DEV_CLOUD_RUN_REGION }}
          PREV: ${{ steps.prev.outputs.image }}
        run: |
          set -euo pipefail
          # Redeploy the previous digest rather than repointing traffic. Traffic pins
          # applied with `update-traffic --to-revisions` stick to the service and make
          # every subsequent deploy land without receiving traffic — the failure mode is
          # a deploy that reports success while nothing it shipped is serving.
          echo "rolling back ${SVC} to ${PREV}"
          gcloud run services update "${SVC}" --region "${REGION}" --image "${PREV}" --quiet
          echo "::warning::rolled back to ${PREV}; main carries the bump, the deployed image does not"

  # ---------------------------------------------------------------------------
  # Anything that stops the chain becomes a tracked issue
  # ---------------------------------------------------------------------------
  report-failure:
    name: File the stall on the register
    runs-on: ubuntu-latest
    needs: [resolve, bump, gate, merge, image, deploy]
    if: failure() && needs.resolve.outputs.needed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Open or update the register issue
        env:
          GH_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          ENFORME: ${{ needs.resolve.outputs.enforme }}
          SCIOTTE: ${{ needs.resolve.outputs.sciotte }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The private register, because this repo is public.
          TRACKER=$(grep -oE '^tracker[[:space:]]*=[[:space:]]*"[^"]+"' registre.toml | grep -oE '[^"]+/[^"]+')
          TITLE="[platform] dravr-enforme integration stalled (${ENFORME} / sciotte ${SCIOTTE})"

          # Indented to this block's level on purpose: YAML strips a block scalar's
          # common indentation, so the shell receives column 0. Dedenting breaks the YAML.
          BODY=$(cat <<EOF
          Automated integration of \`dravr-enforme\` **${ENFORME}** (pinning \`dravr-sciotte\` **${SCIOTTE}**) did not complete.

          - Branch: \`${BRANCH:-not created}\`
          - Run: ${RUN_URL}

          Both pins move in one commit because this repo depends on \`dravr-sciotte\`
          directly and through \`dravr-enforme\`, and CI hard-fails a build where a
          \`dravr-*\` crate resolves to two versions. If the bump job failed on a lockfile
          assertion, the two arms disagree and enforme is the one that has to move first.

          The chain is ordered so a stall is safe: the sciotte image is built and
          \`:latest\` advanced only after main has merged. If this stopped at or before
          the merge, the deployed sciotte is unchanged and the branch is still there to
          inspect. If it stopped at the deploy, the rollback step restored the previous
          digest and main is ahead of what is deployed.

          _Filed by \`enforme-bump.yml\`._
          EOF
          )

          EXISTING=$(gh issue list --repo "$TRACKER" --state open --search "dravr-enforme integration stalled in:title" \
                     --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "$TRACKER" --title "$TITLE" --body "$BODY"
            echo "updated ${TRACKER}#${EXISTING}"
          else
            gh issue create --repo "$TRACKER" --title "$TITLE" --body "$BODY" \
              --label "dravr-platform" --label "dependency" 2>/dev/null \
              || gh issue create --repo "$TRACKER" --title "$TITLE" --body "$BODY"
            echo "opened a new issue on ${TRACKER}"
          fi
