# ABOUTME: Builds iOS via EAS and submits to TestFlight on every mobile code change to main.
# ABOUTME: Also supports manual dispatch with profile selection for production releases.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Deploy: TestFlight"

on:
  push:
    branches: [main]
    paths:
      - 'frontend-mobile/**'
      - 'packages/api-client/**'
      - 'packages/shared-types/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: mobile-testflight-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Pre-flight Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  build-and-submit:
    name: Build & Submit to TestFlight
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend-mobile

    env:
      EAS_PROFILE: ${{ inputs.profile || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inject Firebase API key into eas.json
        run: |
          jq '(.build[].env) += {"EXPO_PUBLIC_FIREBASE_API_KEY": "${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}"}' eas.json > eas.tmp && mv eas.tmp eas.json

      - name: Build iOS
        run: |
          eas build \
            --platform ios \
            --profile ${{ env.EAS_PROFILE }} \
            --non-interactive

      # Skip TestFlight submission when the App Store Connect secrets
      # aren't configured. eas.json references ${APPLE_ID}, ${ASC_APP_ID},
      # and ${APPLE_TEAM_ID}; without all three set, `eas submit` fails
      # with "Invalid Apple ID" / "Invalid Apple App Store Connect App ID"
      # / "Invalid Apple Team ID". The build still validates on every
      # push (signal that mobile compiles); the submit step is opt-in
      # via repo secrets.
      - name: Check submit credentials
        id: submit_creds
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$ASC_APP_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping TestFlight submit — APPLE_ID/ASC_APP_ID/APPLE_TEAM_ID secrets not set. Build completed; configure repo secrets to enable submission."
          fi

      - name: Submit to TestFlight
        if: steps.submit_creds.outputs.ready == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eas submit \
            --platform ios \
            --profile ${{ env.EAS_PROFILE }} \
            --non-interactive \
            --latest
