# ABOUTME: The single EAS entry point for the mobile app — builds iOS/Android and submits to TestFlight and Play.
# ABOUTME: Manual dispatch only; an EAS build is metered, so it runs when someone asks for it and never on a push.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "Deploy: TestFlight"

# Manual dispatch only, and deliberately so. An EAS build is a metered
# resource: building on every push to main exhausted the monthly quota well
# before the month did, and the push path could not submit anyway — it built
# `preview`, which App Store Connect rejects. Push coverage for these paths
# belongs to "CI: Mobile Unit" (mobile-unit-tests.yml) — typecheck, lint and
# unit tests — which is free and runs on every push. Only the metered build
# waits for someone to ask for it.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Submit to the store after building'
        required: true
        default: true
        type: boolean

# An EAS build runs on Expo's infrastructure, not on this runner: cancelling
# the job abandons the log, not the build, and a cancelled submit can leave an
# upload half-done. Runs queue behind each other instead.
concurrency:
  group: mobile-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Pre-flight Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    needs: test
    runs-on: ubuntu-latest
    # EAS free-tier builds queue before they start; 120 minutes covers the wait
    # plus the build rather than reclaiming the runner mid-queue.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The stores accept App Store-distribution builds only, and the `preview`
      # profile is distribution: internal (ad-hoc signed), so an upload of it is
      # rejected. The submit job below is gated on profile == production for
      # exactly that reason; say so up front rather than letting the dispatcher
      # watch a build finish and a submit job silently skip.
      - name: Warn when submit was asked for on a non-submittable profile
        if: ${{ inputs.submit == true && inputs.profile != 'production' }}
        run: |
          echo "::warning::Submit was requested with the ${{ inputs.profile }} profile and will be skipped. The stores accept App Store-distribution builds only, and ${{ inputs.profile }} is distribution: internal. Re-run with profile=production to submit."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inject Firebase API key into eas.json
        run: |
          jq '(.build[].env) += {"EXPO_PUBLIC_FIREBASE_API_KEY": "${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}"}' eas.json > eas.tmp && mv eas.tmp eas.json

      - name: Build iOS
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        run: |
          eas build \
            --platform ios \
            --profile ${{ inputs.profile }} \
            --non-interactive

      - name: Build Android
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive

  submit:
    name: Submit to Store
    needs: build
    if: ${{ inputs.submit == true && inputs.profile == 'production' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # eas.json carries `ascAppId` as a literal because EAS interpolates
      # environment variables into three iOS submit fields only —
      # ascApiKeyPath, ascApiKeyId and ascApiKeyIssuerId. An `${APPLE_ID}` in
      # any other field reaches Apple's validator as that literal string and is
      # rejected as a malformed credential. Apple authentication therefore comes
      # from the App Store Connect API key held by EAS and reached via
      # EXPO_TOKEN. Android is the opposite case: serviceAccountKeyPath *is*
      # interpolated, so eas.json names a path and the step below writes the key
      # there. Check both up front and name what is missing, rather than failing
      # deep inside an upload.
      - name: Verify submit credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          if [ "${{ inputs.platform }}" = "android" ] || [ "${{ inputs.platform }}" = "all" ]; then
            [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" ] && missing="$missing GOOGLE_PLAY_SERVICE_ACCOUNT_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Cannot submit — these repository secrets are unset:$missing. The build succeeded and is available in EAS; set the secrets and re-run submission." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit iOS to TestFlight
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --non-interactive \
            --latest

      # eas.json names a *path*, so the service-account JSON has to reach the
      # runner as a file; the secret holds its contents.
      - name: Materialize Play service-account key
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          key_path="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "GOOGLE_SERVICE_ACCOUNT_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Submit Android to Play Console
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        run: |
          eas submit \
            --platform android \
            --profile production \
            --non-interactive \
            --latest
