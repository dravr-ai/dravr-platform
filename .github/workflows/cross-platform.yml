name: "CI: Cross-Platform Build"

on:
  schedule:
    # Run Sunday 11 PM EDT (Monday 3 AM UTC) — macOS/Windows runners are expensive
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger when needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  cross-platform-tests:
    # Ubuntu excluded - already covered by ci-backend/ci-postgres/ci-redis workflows
    name: Platform Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows

    steps:
      - name: Enable Windows long paths (pre-checkout)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Cargo's dependency tree blows past Windows' default 260-char MAX_PATH
        # during cargo fmt / cargo build (`os error 206: filename too long`).
        # We address this in three places:
        #   1. Registry LongPathsEnabled — opts the OS into >260-char paths.
        #   2. git core.longpaths=true — git checkout itself can also trip the limit.
        #   3. CARGO_TARGET_DIR=C:\t in env: below — cuts the build-output prefix
        #      from `D:\a\dravr-platform\dravr-platform\target\…` (~53 chars) down
        #      to `C:\t\…` (4 chars), buying back enough headroom for clippy/test.
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Set short CARGO_TARGET_DIR on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Append CARGO_TARGET_DIR=C:\t to GITHUB_ENV so every subsequent
        # cargo invocation in this job writes build output under a 4-char
        # prefix instead of `D:\a\dravr-platform\dravr-platform\target\…`.
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=C:\t"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cross-platform-v3-${{ hashFiles('**/Cargo.lock', 'migrations/**') }}

      - name: Check formatting
        # Skip on Windows: `cargo fmt --all` enumerates all 700+ source files
        # into a single rustfmt CreateProcess call, which trips Windows'
        # 32K command-line limit (`os error 206: filename or extension too long`).
        # Format is platform-independent and already gated by ci-backend.yml's
        # fast-gate on Linux; running it on macOS suffices for the cross-platform job.
        if: matrix.os != 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Clippy check (with cognitive complexity)
        shell: bash
        # On Windows, restrict to --lib --bins --examples. The full --all-targets
        # build pulls in 234 integration test crates from crates/pierre-server/tests/;
        # each links a separate ~100MB MSVC-debug .exe and the runner's C:/D: drive
        # runs out of space (LNK1180). The integration-test linting is gated by
        # ci-backend.yml's clippy job on Linux — Windows only needs to confirm the
        # platform-conditional source paths still lint cleanly.
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --lib --bins --examples --quiet -- -D warnings
          else
            cargo clippy --all-targets --quiet -- -D warnings
          fi
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="

      - name: Run tests
        shell: bash
        # Note: Using --lib --bins --tests instead of --all-targets to exclude benches
        # Criterion benchmarks don't accept --test-threads and will fail
        # Debug builds used on all platforms - release builds on Windows/MSVC take 2+ hours
        #
        # On Windows, drop --tests for the same disk-space reason as clippy above:
        # 234 integration .exe files exhaust the runner. Lib + bin tests are
        # sufficient for the platform-compat smoke; integration coverage runs
        # on the Linux backend-tests job.
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --lib --bins --quiet -- --test-threads=4
          else
            cargo test --lib --bins --tests --quiet -- --test-threads=4
          fi
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

      - name: Test health monitoring functions
        shell: bash
        # On Windows, scope to --lib --bins for the same disk-space reason
        # as the steps above (234 integration .exe files exhaust the runner).
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --lib --bins health --quiet
          else
            cargo test health --quiet
          fi
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="

      - name: Platform summary
        run: |
          echo "✅ Platform: ${{ matrix.platform }}"
          echo "✅ Clippy: All platform-specific code passed"
          echo "✅ Tests: All platform-specific tests passed"
