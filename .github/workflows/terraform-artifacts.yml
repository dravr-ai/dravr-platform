# ABOUTME: Automates Terraform plan/apply for the central infra/artifacts (dravr-artifacts) project
# ABOUTME: Manual workflow_dispatch only; plan and apply are both gated by the 'artifacts' GitHub Environment

name: "Infra: Artifacts Registry"

# Manual dispatch only. This project owns the shared dravr-images registry and
# its image-retention cleanup policies — apply deliberately stays human-triggered
# rather than auto-applying on push, so a destructive cleanup change can't ship
# unreviewed. A commented push trigger is left below for when auto-apply is wanted.
#
# One-time bootstrap. The terraform-runner SA, its 5 project roles (incl.
# roles/iam.workloadIdentityPoolAdmin), and its refs/heads/main-scoped WIF binding
# are managed in infra/artifacts/main.tf — apply that once as a project owner, then:
#   1. Grant the runner state-bucket access (objectAdmin cannot self-manage bucket
#      IAM, so it is intentionally not a terraform resource):
#        gcloud storage buckets add-iam-policy-binding gs://dravr-artifacts-terraform-7d896 \
#          --member="serviceAccount:terraform-runner@dravr-artifacts.iam.gserviceaccount.com" \
#          --role="roles/storage.objectAdmin"
#   2. Add repo secrets GCP_ARTIFACTS_WIF_PROVIDER (the provider resource name) and
#      GCP_ARTIFACTS_TF_SA (terraform-runner@dravr-artifacts.iam.gserviceaccount.com).
#   3. Create a GitHub Environment named 'artifacts' with required reviewers so
#      every job that assumes the runner SA — plan as well as apply — is
#      approval-gated (the WIF binding already restricts impersonation to main).
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infra/artifacts/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        type: choice
        options: [plan, apply]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Plan — runs on workflow_dispatch(action=plan)
  # ---------------------------------------------------------------------------
  plan:
    name: Plan Artifacts
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'plan'
    # Same reviewer gate as apply. Plan authenticates as the same terraform-runner
    # SA, which holds projectIamAdmin + serviceAccountAdmin on dravr-artifacts and
    # can therefore self-grant owner — the credential, not the terraform verb, is
    # what the Environment gate exists to protect. An ungated plan would mint that
    # token on demand.
    environment: artifacts

    defaults:
      run:
        working-directory: infra/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (artifacts terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACTS_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -no-color

  # ---------------------------------------------------------------------------
  # Apply — runs on push to main or workflow_dispatch(action=apply)
  # Gated by required reviewers configured on the 'artifacts' GitHub Environment
  # ---------------------------------------------------------------------------
  apply:
    name: Apply Artifacts
    runs-on: ubuntu-latest
    # No `needs: plan` — plan only runs on action=plan, so gating apply on it
    # would block workflow_dispatch(action=apply) entirely. Apply runs its own
    # init/apply below.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.action == 'apply')
    environment: artifacts

    defaults:
      run:
        working-directory: infra/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (artifacts terraform runner)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACTS_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACTS_TF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
