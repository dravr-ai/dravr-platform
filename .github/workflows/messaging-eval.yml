# Dedicated workflow for the messaging-eval test track.
#
# Currently in DORMANT mode: triggers on `workflow_dispatch` only, so
# it runs on-demand from the Actions tab but never on push/schedule.
# The Phase 0–3 asserter tests already run inside `ci-backend.yml`
# (cargo test pulls them in as part of the Rust test suite);
# duplicating them here while the suite is small would waste CI
# minutes.
#
# ## Activation checklist
#
# Flip this workflow out of dormant mode when the first of these
# lands:
#
# 1. **Real-platform scenarios** — `#[ignore]` Rust integration
#    tests that drive live Slack/Telegram/Discord/WhatsApp workspaces
#    via `slack-morphism`, `teloxide`, `serenity`, etc. Need scheduled
#    runs (so real-API flake doesn't block PRs) + per-platform secret
#    routing via `MESSAGING_EVAL_*_*` env vars.
# 2. **Golden-file visual diffs** — per-channel rendering snapshots
#    under `tests/fixtures/messaging_rendering/`. Needs git-LFS
#    checkout and snapshot-diff artifact upload.
#
# When you flip it on:
#
# - Uncomment the `schedule` and `push`-on-path triggers below.
# - Add a step that runs the real-platform tests:
#     cargo test --test messaging_eval_real_slack_test -- --ignored
#   (same pattern for each platform).
# - Wire a reporter step that posts failures to the Obsidian vault
#   tracking note (see `feedback_ci_must_be_green.md` for the "red
#   nightly → vault note, don't block PR" convention).
# - Set `concurrency` below to cancel-in-progress so a live session
#   doesn't pile up if the schedule fires while a run is still going.
#
# ## When NOT to activate
#
# If messaging-eval work stays entirely in-process (mock LLM +
# synthetic activities + assertion helpers), keep this dormant —
# `ci-backend.yml` already covers it. The dedicated workflow pays off
# only when messaging-eval has its own flake profile / secret
# surface / runtime.

name: "CI: Messaging Eval"

on:
  # Dormant mode — manual dispatch only.
  workflow_dispatch:

  # Uncomment when real-platform scenarios land (see activation
  # checklist above):
  #
  # schedule:
  #   - cron: "0 4 * * *"   # 04:00 UTC nightly
  #
  # push:
  #   paths:
  #     - "crates/pierre-server/tests/helpers/messaging_eval.rs"
  #     - "crates/pierre-server/tests/messaging_eval_*.rs"
  #     - "crates/pierre-server/tests/messaging_rendering_test.rs"
  #     - ".github/workflows/messaging-eval.yml"

# Kept commented so a manual dispatch never clashes with another
# manual dispatch (they'd just queue); uncomment when the schedule
# fires to prevent a slow run overlapping with the next cron tick.
#
# concurrency:
#   group: messaging-eval-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  rust-asserters:
    name: Rust asserters (Phase 0–3)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run messaging-eval tests
        run: |
          cargo test \
            --test messaging_eval_phase_0_test \
            --test messaging_eval_phase_1_integration_test \
            --test messaging_eval_pipeline_tool_loop_test \
            --test messaging_eval_tool_called_happy_path_test \
            --test messaging_eval_hallucination_probes_test \
            --test messaging_rendering_test \
            -- --nocapture

  # ── Real-platform scenarios (dormant) ───────────────────────────
  #
  # Uncomment when the first `#[ignore]` real-platform integration
  # test lands. Each platform needs its driver secrets threaded in
  # from GitHub Secrets; the values currently live in `.envrc` on
  # main and must be added as repo secrets with the same names.
