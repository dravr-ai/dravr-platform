# ABOUTME: Dedicated CI for messaging-eval integration and real-platform scenario tests
# ABOUTME: Runs Phase 0-3 asserters on push plus a nightly real-Slack round-trip via Socket Mode
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

# The `rust-asserters` job runs the in-process Phase 0-3 tests on every
# push that touches messaging-eval code.
#
# The `real-slack-socket` job boots a Pierre server in Slack Socket Mode
# (no public URL required) and drives a real post/poll round trip via the
# QA driver bot. Socket Mode lets the Pierre-in-CI process receive events
# outbound over a WebSocket keyed on `SLACK_APP_TOKEN`, so no Cloudflare
# tunnel or webhook URL is needed. Runs on nightly cron and on-demand.
#
# ## Required repo secrets
#
# QA driver (test harness posts as this bot, polls for the coach's reply):
#   MESSAGING_EVAL_SLACK_BOT_TOKEN           — QA driver xoxb- token
#   MESSAGING_EVAL_SLACK_CHANNEL             — channel ID (C…)
#   MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID   — coach bot user ID (U…)
#
# Pierre coach bot (receives events, posts replies):
#   MESSAGING_EVAL_COACH_BOT_TOKEN           — coach xoxb- token
#   MESSAGING_EVAL_SLACK_APP_TOKEN           — coach xapp- token (Socket Mode);
#                                              shared with the driver harness
#                                              gate check
#   MESSAGING_EVAL_COACH_SIGNING_SECRET      — coach signing secret (unused at
#                                              runtime in socket mode but
#                                              required by the seed step)
#
# LLM provider (carnet#845, JF 2026-10-09: "copilot/haiku"):
#   DRAVR_MCP_SERVER_COPILOT_GITHUB_TOKEN    — Copilot account token the
#                                              copilot_sdk provider runs on;
#                                              the model is claude-haiku-4.5

name: "CI: Messaging Eval"

on:
  workflow_dispatch:
    inputs:
      asserters_only:
        description: "Run only the Phase 0-3 Rust asserters, skipping the live Slack round trip"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC nightly
  push:
    paths:
      - "crates/pierre-server/src/services/slack_socket.rs"
      - "crates/pierre-server/tests/helpers/messaging_eval.rs"
      - "crates/pierre-server/tests/messaging_eval_*.rs"
      - "crates/pierre-server/tests/live/messaging_eval_*.rs"
      - "crates/pierre-server/tests/messaging_rendering_test.rs"
      - "crates/pierre-server/tests/slack_socket_unit_test.rs"
      - ".github/workflows/messaging-eval.yml"
  # The fast-feedback chain after a contremaitre prompt change is a dispatch
  # from contremaitre-bump.yml, not a workflow_run trigger here: that workflow
  # also runs hourly as a safety net and completes without changing anything,
  # so a completion-keyed trigger would rebuild this suite 24 times a day for
  # nothing. contremaitre-bump dispatches `asserters_only` only on a real bump,
  # alongside the ci-backend dispatch it already makes for the same reason —
  # a GITHUB_TOKEN push raises no workflow runs of its own.

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  rust-asserters:
    name: Rust asserters (Phase 0-3)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # Retry transient crates.io download failures (curl/SSL EOF) instead of failing.
      CARGO_NET_RETRY: "10"
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private dravr-* deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Written by the nightly scheduled run on main only; every other run restores
          # (see .github/actions/rust-setup for why a cache is saved once a day).
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}

      - name: Run messaging-eval tests
        run: |
          cargo test \
            --test messaging_eval_phase_0_test \
            --test messaging_eval_phase_1_integration_test \
            --test messaging_eval_pipeline_tool_loop_test \
            --test messaging_eval_tool_called_happy_path_test \
            --test messaging_eval_hallucination_probes_test \
            --test messaging_rendering_test \
            --test slack_socket_unit_test \
            -- --nocapture

  real-slack-socket:
    name: Real Slack round trip (Socket Mode)
    # Only run on schedule + manual dispatch — skip on every push path match
    # because the Slack API has rate limits and the test depends on live
    # LLM latency. `asserters_only` skips it for the same reason on the
    # contremaitre-bump dispatch, which wants the prompt regression signal and
    # not a live round trip.
    if: github.event_name != 'push' && !inputs.asserters_only
    # Graded by a hosted model on production's own transport: copilot_sdk,
    # the deployed primary, serving claude-haiku-4.5 (carnet#845) — a model
    # that holds the scope rules a small local model could not (carnet#819).
    # The off-scope probes are answered by the scope rails before any model;
    # the smoke and the tempo control reach Haiku.
    runs-on: ubuntu-latest
    needs: rust-asserters
    # The build is ~28 min (run 37610566362); two model turns and three rail
    # turns take minutes on a hosted model. 60 leaves room for the build plus
    # one turn that runs to the test's reply wait (REPLY_WAIT_SECS, 1080 s),
    # so a stalled turn fails its test with a message instead of the job
    # being cancelled.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # Retry transient crates.io download failures (curl/SSL EOF) instead of failing.
      CARGO_NET_RETRY: "10"
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      # QA driver creds consumed by the test harness (posts + polls
      # conversations.history).
      MESSAGING_EVAL_SLACK_BOT_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_BOT_TOKEN }}
      MESSAGING_EVAL_SLACK_CHANNEL: ${{ secrets.MESSAGING_EVAL_SLACK_CHANNEL }}
      MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID: ${{ secrets.MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID }}
      # APP_TOKEN presence is a pre-condition the test harness checks to
      # avoid skipping silently; same value Pierre reads below.
      MESSAGING_EVAL_SLACK_APP_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_APP_TOKEN }}
      MESSAGING_EVAL_SLACK_SIGNING_SECRET: ${{ secrets.MESSAGING_EVAL_COACH_SIGNING_SECRET }}
      # Coach bot creds consumed by the Pierre server at boot. SLACK_APP_TOKEN
      # is what unlocks the outbound WebSocket (Socket Mode).
      SLACK_BOT_TOKEN: ${{ secrets.MESSAGING_EVAL_COACH_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.MESSAGING_EVAL_COACH_SIGNING_SECRET }}
      SLACK_APP_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_APP_TOKEN }}
      # Admin/JWT bootstrap.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: AdminPassword123
      # The token copilot_sdk authenticates with; production reads the same
      # variable (infra/environments/dev/main.tf).
      COPILOT_GITHUB_TOKEN: ${{ secrets.DRAVR_MCP_SERVER_COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private dravr-* deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          # Written by the nightly scheduled run on main only; every other run restores
          # (see .github/actions/rust-setup for why a cache is saved once a day).
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}

      - name: Read the pinned Copilot CLI version
        id: pin
        run: |
          set -euo pipefail
          # The pin lives in the image the server runs, so the lane grades on
          # the runtime production is on.
          VERSION=$(grep -oE '^ARG COPILOT_CLI_VERSION=[0-9.]+' \
                      docker/images/server/Dockerfile | cut -d= -f2)
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read COPILOT_CLI_VERSION from the server Dockerfile" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pinned Copilot CLI: ${VERSION}"

      # Same install as docker/images/server/Dockerfile: the first
      # `copilot --version` extracts the package under COPILOT_PKG_CACHE_HOME,
      # and copilot_sdk spawns the `copilot-runtime` wrapper found there.
      - name: Install the pinned Copilot runtime
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "::error::DRAVR_MCP_SERVER_COPILOT_GITHUB_TOKEN is not set; the lane has no model to grade with" >&2
            exit 1
          fi
          PREFIX="$HOME/.copilot-cli"
          export COPILOT_PKG_CACHE_HOME="$HOME/.copilot-pkg"
          npm install -g --prefix "$PREFIX" "@github/copilot-linux-x64@${VERSION}"
          COPILOT_AUTO_UPDATE=false "$PREFIX/bin/copilot-linux-x64" --version
          RUNTIME="$COPILOT_PKG_CACHE_HOME/pkg/linux-x64/${VERSION}/prebuilds/linux-x64/copilot-runtime"
          test -f "$COPILOT_PKG_CACHE_HOME/pkg/linux-x64/${VERSION}/.extraction-complete" \
            || { echo "::error::copilot --version did not finish extracting ${VERSION}" >&2; exit 1; }
          test -x "$RUNTIME" || { echo "::error::no copilot-runtime at $RUNTIME" >&2; exit 1; }
          test -s "$(dirname "$RUNTIME")/runtime.node" || { echo "::error::no runtime.node beside $RUNTIME" >&2; exit 1; }
          {
            echo "COPILOT_PKG_CACHE_HOME=$COPILOT_PKG_CACHE_HOME"
            echo "COPILOT_AUTO_UPDATE=false"
            echo "COPILOT_RUNTIME_PATH=$RUNTIME"
          } >> "$GITHUB_ENV"

      - name: Build server + CLI + test binary
        run: |
          # Compile the binaries AND the integration test binary up-front so
          # the test-run step is just execution. Without this, run #1 spent
          # ~11 of its 25 minutes inside `cargo test --no-run` while the
          # daemon waited.
          cargo build --release --bin pierre-mcp-server --bin pierre-cli
          cargo test --release --features live-e2e --test messaging_eval_real_slack_test --no-run

      - name: Resolve QA driver bot_id + user_id
        id: driver-identity
        run: |
          # auth.test with the QA driver's bot token returns its bot_id AND
          # its Slack user_id. The bot_id feeds SLACK_ALLOWED_BOT_IDS (canot
          # accepts driver posts as user input); the user_id seeds the channel
          # link so Pierre routes its messages to the pre-linked admin user
          # instead of replying with an OTP link.
          RESPONSE=$(curl -sS -H "Authorization: Bearer $MESSAGING_EVAL_SLACK_BOT_TOKEN" \
            https://slack.com/api/auth.test)
          echo "auth.test response: $RESPONSE" >&2
          BOT_ID=$(echo "$RESPONSE" | jq -r '.bot_id // empty')
          USER_ID=$(echo "$RESPONSE" | jq -r '.user_id // empty')
          if [ -z "$BOT_ID" ] || [ -z "$USER_ID" ]; then
            echo "ERROR: auth.test missing bot_id or user_id (driver token may be invalid)" >&2
            exit 1
          fi
          echo "Resolved driver bot_id=$BOT_ID user_id=$USER_ID"
          {
            echo "bot_id=$BOT_ID"
            echo "user_id=$USER_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral Pierre master encryption key
        id: pierre-key
        run: |
          # CI-only ephemeral key; the SQLite DB + its encrypted rows are
          # created fresh each run and discarded at teardown, so key
          # rotation between runs has no effect.
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Seed admin user
        env:
          DATABASE_URL: sqlite:///tmp/pierre-messaging-eval.db
          PIERRE_MASTER_ENCRYPTION_KEY: ${{ steps.pierre-key.outputs.key }}
        run: |
          mkdir -p /tmp
          cargo run --release --bin pierre-cli -- user create \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD"

      - name: Pre-link QA driver Slack user to admin
        env:
          DRIVER_USER_ID: ${{ steps.driver-identity.outputs.user_id }}
        run: |
          # Bypass the OTP / account-linking flow so Pierre runs a full coach
          # turn on the probe instead of replying with the link prompt.
          # Ingress authenticates a sender by its messaging_channel_links row
          # (tenant, channel, channel_user_id); a messaging_sessions row alone
          # leaves the driver unlinked. Seeding only the session is what made
          # every probe get the link prompt, which the old placeholder skip
          # then counted as a pass (carnet#805).
          DB=/tmp/pierre-messaging-eval.db
          ADMIN_ID=$(sqlite3 "$DB" "SELECT id FROM users WHERE email='$ADMIN_EMAIL';")
          TENANT_ID=$(sqlite3 "$DB" "SELECT tenant_id FROM tenant_users WHERE user_id='$ADMIN_ID' LIMIT 1;")
          if [ -z "$ADMIN_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "ERROR: admin user ($ADMIN_ID) or tenant ($TENANT_ID) lookup failed" >&2
            sqlite3 "$DB" ".tables"
            exit 1
          fi
          LINK_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          sqlite3 "$DB" "INSERT INTO messaging_channel_links (id, tenant_id, user_id, channel_type, channel_user_id, display_name) VALUES ('$LINK_ID', '$TENANT_ID', '$ADMIN_ID', 'slack', '$DRIVER_USER_ID', 'messaging-eval QA driver');"
          SESSION_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          sqlite3 "$DB" "INSERT INTO messaging_sessions (id, user_id, tenant_id, channel_type, channel_user_id) VALUES ('$SESSION_ID', '$ADMIN_ID', '$TENANT_ID', 'slack', '$DRIVER_USER_ID');"
          LINKED=$(sqlite3 "$DB" "SELECT COUNT(*) FROM messaging_channel_links WHERE tenant_id='$TENANT_ID' AND channel_type='slack' AND channel_user_id='$DRIVER_USER_ID';")
          [ "$LINKED" = "1" ] || { echo "ERROR: driver channel link not written (count=$LINKED)" >&2; exit 1; }
          echo "Linked driver Slack user $DRIVER_USER_ID → admin $ADMIN_ID (tenant $TENANT_ID, link $LINK_ID, session $SESSION_ID)"

      - name: Start Pierre (background)
        env:
          DATABASE_URL: sqlite:///tmp/pierre-messaging-eval.db
          PIERRE_MASTER_ENCRYPTION_KEY: ${{ steps.pierre-key.outputs.key }}
          PIERRE_HOST: 127.0.0.1
          PIERRE_PORT: "8081"
          RUST_LOG: "info,pierre_mcp_server::services::slack_socket=debug,pierre_llm=debug,embacle=debug"
          SLACK_ALLOWED_BOT_IDS: ${{ steps.driver-identity.outputs.bot_id }}
          # LLM config — production's primary transport and knobs
          # (infra/environments/dev/main.tf), with Haiku as the model and no
          # chain behind it: a Copilot failure is an infra error, never
          # another model's answer graded as Haiku's.
          PIERRE_LLM_PROVIDER: copilot_sdk
          PIERRE_LLM_MODEL: claude-haiku-4.5
          PIERRE_LLM_FALLBACK_MODEL: claude-haiku-4.5
          PIERRE_LLM_FALLBACK_ENABLED: "false"
          PIERRE_LLM_RUNTIME_FALLBACK: "false"
          PIERRE_LLM_HEALTH_PROBE_INTERVAL_SECS: "0"
          COPILOT_SDK_MCP_TOOL_CALLING: "true"
          COPILOT_SDK_PERMISSION_POLICY: deny_all
          COPILOT_SDK_MAX_HISTORY_TURNS: "41"
          EMBACLE_SDK_PROMPT_TIMEOUT_SECS: "300"
          EMBACLE_SDK_SESSION_TIMEOUT_SECS: "60"
          # Sciotte backpressure limiter — required by the pierre-sciotte
          # feature which ships in the default server-full feature set.
          # Low-traffic CI numbers: single concurrent scrape, tiny queue,
          # short retry hints. Values mirror bin/start-server.sh's
          # pre-flight check.
          PIERRE_SCIOTTE_MAX_CONCURRENT: "1"
          PIERRE_SCIOTTE_MAX_QUEUE: "4"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "30"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "120"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "10"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "30"
        run: |
          mkdir -p "$RUNNER_TEMP/pierre-logs"
          ./target/release/pierre-mcp-server \
            > "$RUNNER_TEMP/pierre-logs/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pierre.pid"

      - name: Wait for Socket Mode connection
        run: |
          # Pierre logs "Slack Socket Mode: hello received" once Slack
          # accepts the WSS handshake. That's the go-signal that driver
          # posts will now reach the pipeline.
          for i in $(seq 1 60); do
            if grep -q "Slack Socket Mode: hello received" \
              "$RUNNER_TEMP/pierre-logs/server.log" 2>/dev/null; then
              echo "Socket Mode ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Socket Mode did not connect within 120s"
          tail -200 "$RUNNER_TEMP/pierre-logs/server.log" || true
          exit 1

      - name: Run real-Slack probe suite
        run: |
          # Runs the four real-Slack probes serially against Copilot Haiku:
          # 3 off-topic refusal probes (food pricing, medical
          # diagnosis, financial advice) + 1 in-domain positive control
          # (tempo-run explanation). Plus the driver-layer smoke. They
          # share the same messaging session and same Pierre process —
          # no cross-test isolation needed because each probe is a
          # standalone Q without follow-up. --test-threads=1 keeps the
          # ordering deterministic and prevents two probes from posting
          # to Slack simultaneously.
          #
          # The target exists only under `live-e2e`. A stale `--ignored`
          # once selected zero of these and the step still passed, every
          # night from 2026-05-13, so the count is asserted, not assumed
          # (carnet#805).
          EXPECTED=5
          LOG="$RUNNER_TEMP/real-slack-tests.log"
          set -o pipefail
          cargo test --release --features live-e2e \
            --test messaging_eval_real_slack_test \
            -- --nocapture --test-threads=1 2>&1 | tee "$LOG"
          PASSED=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' "$LOG")
          if [ "$PASSED" != "$EXPECTED" ]; then
            echo "ERROR: expected $EXPECTED real-Slack tests to pass, got '${PASSED:-none}'" >&2
            exit 1
          fi

      - name: Stop Pierre
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pierre.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pierre.pid")" || true
          fi

      - name: Upload Pierre logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pierre-server-logs
          path: ${{ runner.temp }}/pierre-logs/
          retention-days: 1
