# ABOUTME: Dedicated CI for messaging-eval integration and real-platform scenario tests
# ABOUTME: Runs Phase 0-3 asserters on push plus a nightly real-Slack round-trip via Socket Mode
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

# The `rust-asserters` job runs the in-process Phase 0-3 tests on every
# push that touches messaging-eval code.
#
# The `real-slack-socket` job boots a Pierre server in Slack Socket Mode
# (no public URL required) and drives a real post/poll round trip via the
# QA driver bot. Socket Mode lets the Pierre-in-CI process receive events
# outbound over a WebSocket keyed on `SLACK_APP_TOKEN`, so no Cloudflare
# tunnel or webhook URL is needed. Runs on nightly cron and on-demand.
#
# ## Required repo secrets
#
# QA driver (test harness posts as this bot, polls for the coach's reply):
#   MESSAGING_EVAL_SLACK_BOT_TOKEN           — QA driver xoxb- token
#   MESSAGING_EVAL_SLACK_CHANNEL             — channel ID (C…)
#   MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID   — coach bot user ID (U…)
#
# Pierre coach bot (receives events, posts replies):
#   MESSAGING_EVAL_COACH_BOT_TOKEN           — coach xoxb- token
#   MESSAGING_EVAL_SLACK_APP_TOKEN           — coach xapp- token (Socket Mode);
#                                              shared with the driver harness
#                                              gate check
#   MESSAGING_EVAL_COACH_SIGNING_SECRET      — coach signing secret (unused at
#                                              runtime in socket mode but
#                                              required by the seed step)
#
# LLM provider:
#   GEMINI_API_KEY                           — Gemini API key for the chat turn

name: "CI: Messaging Eval"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC nightly
  push:
    paths:
      - "crates/pierre-server/src/services/slack_socket.rs"
      - "crates/pierre-server/tests/helpers/messaging_eval.rs"
      - "crates/pierre-server/tests/messaging_eval_*.rs"
      - "crates/pierre-server/tests/messaging_rendering_test.rs"
      - "crates/pierre-server/tests/slack_socket_unit_test.rs"
      - ".github/workflows/messaging-eval.yml"
  # Same-repo chain: when Contremaitre Sync finishes mirroring platform
  # prompt edits to dravr-contremaitre, run the eval suite so any coach
  # prompt regression surfaces within minutes instead of waiting for the
  # next 04:00 UTC nightly. workflow_run uses the default GITHUB_TOKEN
  # because both workflows live in this repo, so no cross-repo PAT is
  # required.
  workflow_run:
    workflows: ["Contremaitre: Sync Prompts"]
    types: [completed]
    branches: [main]

concurrency:
  group: messaging-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-asserters:
    name: Rust asserters (Phase 0-3)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private dravr-* deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Init contremaitre submodule
        run: git submodule update --init --recursive vendor/contremaitre

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run messaging-eval tests
        run: |
          cargo test \
            --test messaging_eval_phase_0_test \
            --test messaging_eval_phase_1_integration_test \
            --test messaging_eval_pipeline_tool_loop_test \
            --test messaging_eval_tool_called_happy_path_test \
            --test messaging_eval_hallucination_probes_test \
            --test messaging_rendering_test \
            --test slack_socket_unit_test \
            -- --nocapture

  real-slack-socket:
    name: Real Slack round trip (Socket Mode)
    # Only run on schedule + manual dispatch — skip on every push path match
    # because the Slack API has rate limits and the test depends on live
    # LLM latency.
    if: github.event_name != 'push'
    # Standard 4-vCPU/16 GB ubuntu-latest. Larger GitHub-hosted runners
    # are paid-plan only (Team/Enterprise) — Free public-repo plans don't
    # get them. Qwen 2.5 3B on the Q4_K_M quant fits in this footprint
    # and is meaningfully stronger at scope-refusal than llama3.2:1b
    # while remaining small enough to prefill Pierre's hardened system
    # prompt + tool schemas in ~3 min on 4 cores.
    runs-on: ubuntu-latest
    needs: rust-asserters
    # 120 minutes covers build (~10 min) + Ollama install/pull/warmup
    # (~3 min) + Pierre boot + 5 ignored tests sharing one warm Ollama:
    # driver smoke + 4 real LLM probes. The first two probes complete
    # in ~8-9 min each; probes 3+4 took 12+ min in run #2 (longer
    # accumulated conversation context plus a model reload when the
    # original 30m KEEP_ALIVE lapsed). With KEEP_ALIVE bumped to 120m
    # and the test poll window at 1200s, four 12-min probes ≈ 48 min,
    # comfortable inside the cap.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      # QA driver creds consumed by the test harness (posts + polls
      # conversations.history).
      MESSAGING_EVAL_SLACK_BOT_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_BOT_TOKEN }}
      MESSAGING_EVAL_SLACK_CHANNEL: ${{ secrets.MESSAGING_EVAL_SLACK_CHANNEL }}
      MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID: ${{ secrets.MESSAGING_EVAL_SLACK_COACH_BOT_USER_ID }}
      # APP_TOKEN presence is a pre-condition the test harness checks to
      # avoid skipping silently; same value Pierre reads below.
      MESSAGING_EVAL_SLACK_APP_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_APP_TOKEN }}
      MESSAGING_EVAL_SLACK_SIGNING_SECRET: ${{ secrets.MESSAGING_EVAL_COACH_SIGNING_SECRET }}
      # Coach bot creds consumed by the Pierre server at boot. SLACK_APP_TOKEN
      # is what unlocks the outbound WebSocket (Socket Mode).
      SLACK_BOT_TOKEN: ${{ secrets.MESSAGING_EVAL_COACH_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.MESSAGING_EVAL_COACH_SIGNING_SECRET }}
      SLACK_APP_TOKEN: ${{ secrets.MESSAGING_EVAL_SLACK_APP_TOKEN }}
      # Admin/JWT bootstrap.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: AdminPassword123
      # Pierre's reqwest LLM client default times out at 300s; CPU
      # prefill of Pierre's hardened 26K-token system + tool-schema
      # input on a 4-vCPU runner takes longer than that for qwen2.5:3b.
      # 900s leaves comfortable margin for inference + one tool-loop
      # iteration without surfacing the test panic as a misleading
      # "Failed to connect" reqwest error.
      LLM_REQUEST_TIMEOUT_SECS: "900"
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private dravr-* deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Init contremaitre submodule
        run: git submodule update --init --recursive vendor/contremaitre

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$RUNNER_TEMP/ollama-logs"
          # The installer auto-starts a systemd unit. Bump the default
          # context window via systemd env override — Pierre's hardened
          # system prompt is ~6.6 K tokens (logs: shingles=26489), well
          # over Ollama's 4 K default. With the default the runner
          # truncates the prompt and the chat call 500s after the model
          # tries to make sense of a clipped instruction set.
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nEnvironment="OLLAMA_CONTEXT_LENGTH=32768"\nEnvironment="OLLAMA_KEEP_ALIVE=120m"\n' \
            | sudo tee /etc/systemd/system/ollama.service.d/override.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Ollama ready after ${i}s (systemd, OLLAMA_CONTEXT_LENGTH=16384)"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
            echo "ERROR: Ollama did not respond on :11434 after restart" >&2
            sudo journalctl -u ollama --no-pager -n 100 || true
            exit 1
          fi
          sudo journalctl -u ollama --no-pager -n 50 \
            > "$RUNNER_TEMP/ollama-logs/ollama-systemd.log" 2>&1 || true

      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          # ~/.ollama/models is where the binary stores blobs + manifests.
          # Cache key pinned on the model tag so a model bump cleanly busts
          # the cache.
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-instruct-q4_K_M-v1

      - name: Pull + create dravr-coach (num_thread=4, num_ctx=32768) + warm up
        run: |
          # Ollama's registry occasionally drops the connection mid-pull
          # (observed: "read: connection reset by peer" at 100% download).
          # `ollama pull` is idempotent and resumes via the layer cache,
          # so retry up to 4 times before giving up.
          for attempt in 1 2 3 4; do
            if ollama pull qwen2.5:3b-instruct-q4_K_M; then
              echo "pull succeeded on attempt $attempt"
              break
            fi
            echo "pull failed on attempt $attempt; retrying in 10s..."
            sleep 10
            if [ "$attempt" = "4" ]; then
              echo "ERROR: model pull exhausted retries" >&2
              exit 1
            fi
          done
          # Bake CPU parallelism + context into a derived tag. num_thread
          # 4 uses all vCPUs on the standard ubuntu-latest runner;
          # num_ctx 32768 lets Pierre's full ~26 K-token system prompt +
          # tool schemas fit without truncation (Qwen 2.5 supports 32 K
          # native; KV-cache overhead at this size is ~3 GB, comfortable
          # against the runner's 16 GB).
          cat > "$RUNNER_TEMP/Modelfile" <<'EOF'
          FROM qwen2.5:3b-instruct-q4_K_M
          PARAMETER num_thread 4
          PARAMETER num_ctx 32768
          EOF
          ollama create dravr-coach -f "$RUNNER_TEMP/Modelfile"
          ollama list
          # Force a tiny inference so the derived model is mmap'd into RAM
          # before Pierre's pipeline asks for one.
          time curl -fsS -X POST http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"dravr-coach","stream":false,"messages":[{"role":"user","content":"reply with the word ok"}]}' \
            | tee "$RUNNER_TEMP/ollama-logs/warmup.json"

      - name: Verify tool-call schema round-trip
        run: |
          # Pierre's pipeline always sends a `tools` array on every chat
          # turn. Llama 3.2 1B is documented as supporting native function
          # calling, but quantization can scramble the JSON. Issue a tiny
          # tool-call probe via /v1/chat/completions (same OpenAI-compat
          # surface Pierre uses) and fail fast if the model can't emit a
          # well-formed tool_calls payload.
          response=$(curl -sS -X POST http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{
              "model":"dravr-coach",
              "stream":false,
              "messages":[{"role":"user","content":"What is the weather in Paris?"}],
              "tools":[{
                "type":"function",
                "function":{
                  "name":"get_weather",
                  "description":"Look up the current weather for a city",
                  "parameters":{
                    "type":"object",
                    "properties":{"city":{"type":"string"}},
                    "required":["city"]
                  }
                }
              }],
              "tool_choice":"auto"
            }')
          echo "$response" > "$RUNNER_TEMP/ollama-logs/tool-call-probe.json"
          tool_calls=$(echo "$response" | jq -r '.choices[0].message.tool_calls // empty')
          if [ -z "$tool_calls" ]; then
            echo "ERROR: model did not emit tool_calls for an explicit weather prompt." >&2
            echo "Pierre's pipeline relies on this; refusing to proceed." >&2
            echo "Response: $response" >&2
            exit 1
          fi
          name=$(echo "$tool_calls" | jq -r '.[0].function.name')
          args=$(echo "$tool_calls" | jq -r '.[0].function.arguments')
          echo "Tool-call round-trip OK: name=$name args=$args"
          if [ "$name" != "get_weather" ]; then
            echo "ERROR: model called the wrong function: $name" >&2
            exit 1
          fi

      - name: Build server + CLI + test binary
        run: |
          # Compile the binaries AND the integration test binary up-front so
          # the test-run step is just execution. Without this, run #1 spent
          # ~11 of its 25 minutes inside `cargo test --no-run` while the
          # daemon waited.
          cargo build --release --bin pierre-mcp-server --bin pierre-cli
          cargo test --release --test messaging_eval_real_slack_test --no-run

      - name: Resolve QA driver bot_id + user_id
        id: driver-identity
        run: |
          # auth.test with the QA driver's bot token returns its bot_id AND
          # its Slack user_id. The bot_id feeds SLACK_ALLOWED_BOT_IDS (canot
          # accepts driver posts as user input); the user_id seeds the
          # messaging_sessions row so Pierre routes its messages to the
          # pre-linked admin user instead of replying with an OTP link.
          RESPONSE=$(curl -sS -H "Authorization: Bearer $MESSAGING_EVAL_SLACK_BOT_TOKEN" \
            https://slack.com/api/auth.test)
          echo "auth.test response: $RESPONSE" >&2
          BOT_ID=$(echo "$RESPONSE" | jq -r '.bot_id // empty')
          USER_ID=$(echo "$RESPONSE" | jq -r '.user_id // empty')
          if [ -z "$BOT_ID" ] || [ -z "$USER_ID" ]; then
            echo "ERROR: auth.test missing bot_id or user_id (driver token may be invalid)" >&2
            exit 1
          fi
          echo "Resolved driver bot_id=$BOT_ID user_id=$USER_ID"
          {
            echo "bot_id=$BOT_ID"
            echo "user_id=$USER_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral Pierre master encryption key
        id: pierre-key
        run: |
          # CI-only ephemeral key; the SQLite DB + its encrypted rows are
          # created fresh each run and discarded at teardown, so key
          # rotation between runs has no effect.
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Seed admin user
        env:
          DATABASE_URL: sqlite:///tmp/pierre-messaging-eval.db
          PIERRE_MASTER_ENCRYPTION_KEY: ${{ steps.pierre-key.outputs.key }}
        run: |
          mkdir -p /tmp
          cargo run --release --bin pierre-cli -- user create \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD"

      - name: Pre-link QA driver Slack user to admin
        env:
          DRIVER_USER_ID: ${{ steps.driver-identity.outputs.user_id }}
        run: |
          # Bypass the OTP / account-linking flow: seed a messaging_sessions
          # row that maps the driver's Slack user_id to the admin user. This
          # lets Pierre run a full coach turn on the probe instead of
          # replying with the pre-auth link prompt.
          DB=/tmp/pierre-messaging-eval.db
          ADMIN_ID=$(sqlite3 "$DB" "SELECT id FROM users WHERE email='$ADMIN_EMAIL';")
          TENANT_ID=$(sqlite3 "$DB" "SELECT tenant_id FROM tenant_users WHERE user_id='$ADMIN_ID' LIMIT 1;")
          if [ -z "$ADMIN_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "ERROR: admin user ($ADMIN_ID) or tenant ($TENANT_ID) lookup failed" >&2
            sqlite3 "$DB" ".tables"
            exit 1
          fi
          SESSION_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          sqlite3 "$DB" "INSERT INTO messaging_sessions (id, user_id, tenant_id, channel_type, channel_user_id) VALUES ('$SESSION_ID', '$ADMIN_ID', '$TENANT_ID', 'slack', '$DRIVER_USER_ID');"
          echo "Linked driver Slack user $DRIVER_USER_ID → admin $ADMIN_ID (tenant $TENANT_ID, session $SESSION_ID)"

      - name: Start Pierre (background)
        env:
          DATABASE_URL: sqlite:///tmp/pierre-messaging-eval.db
          PIERRE_MASTER_ENCRYPTION_KEY: ${{ steps.pierre-key.outputs.key }}
          PIERRE_HOST: 127.0.0.1
          PIERRE_PORT: "8081"
          RUST_LOG: "info,pierre_mcp_server::services::slack_socket=debug,pierre_llm=debug,pierre_llm::openai_compatible=trace"
          SLACK_ALLOWED_BOT_IDS: ${{ steps.driver-identity.outputs.bot_id }}
          # LLM config — local Ollama server hosts qwen2.5:3b-instruct-q4_K_M.
          # Pipeline calls Ollama's OpenAI-compatible /v1/chat/completions, so
          # no API quota and no provider-specific retry behaviour. Pierre's
          # `local` provider variant in pierre_llm wraps OpenAiCompatibleProvider
          # with these env vars (see crates/pierre-llm/src/openai_compatible.rs).
          PIERRE_LLM_PROVIDER: local
          PIERRE_LLM_MODEL: dravr-coach
          PIERRE_LLM_DEFAULT_MODEL: dravr-coach
          PIERRE_LLM_FALLBACK_MODEL: dravr-coach
          PIERRE_LLM_FALLBACK_ENABLED: "false"
          LOCAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
          LOCAL_LLM_MODEL: dravr-coach
          LOCAL_LLM_FALLBACK_MODEL: dravr-coach
          # Sciotte backpressure limiter — required by the pierre-sciotte
          # feature which ships in the default server-full feature set.
          # Low-traffic CI numbers: single concurrent scrape, tiny queue,
          # short retry hints. Values mirror bin/start-server.sh's
          # pre-flight check.
          PIERRE_SCIOTTE_MAX_CONCURRENT: "1"
          PIERRE_SCIOTTE_MAX_QUEUE: "4"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "30"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "120"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "10"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "30"
        run: |
          mkdir -p "$RUNNER_TEMP/pierre-logs"
          ./target/release/pierre-mcp-server \
            > "$RUNNER_TEMP/pierre-logs/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pierre.pid"

      - name: Wait for Socket Mode connection
        run: |
          # Pierre logs "Slack Socket Mode: hello received" once Slack
          # accepts the WSS handshake. That's the go-signal that driver
          # posts will now reach the pipeline.
          for i in $(seq 1 60); do
            if grep -q "Slack Socket Mode: hello received" \
              "$RUNNER_TEMP/pierre-logs/server.log" 2>/dev/null; then
              echo "Socket Mode ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Socket Mode did not connect within 120s"
          tail -200 "$RUNNER_TEMP/pierre-logs/server.log" || true
          exit 1

      - name: Run real-Slack probe suite
        run: |
          # Runs the four real-Slack probes serially against one warm
          # Ollama: 3 off-topic refusal probes (food pricing, medical
          # diagnosis, financial advice) + 1 in-domain positive control
          # (tempo-run explanation). Plus the driver-layer smoke. They
          # share the same messaging session and same Pierre process —
          # no cross-test isolation needed because each probe is a
          # standalone Q without follow-up. --test-threads=1 keeps the
          # ordering deterministic and prevents two probes from posting
          # to Slack simultaneously.
          cargo test --release \
            --test messaging_eval_real_slack_test \
            -- --ignored --nocapture --test-threads=1

      - name: Stop Pierre
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pierre.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pierre.pid")" || true
          fi

      - name: Capture systemd Ollama logs (post-test)
        if: always()
        run: |
          # The Install step captured logs at startup, before any inference
          # ran. This second capture covers the full test-run window so
          # Ollama's request/response traces are available for triage.
          sudo journalctl -u ollama --no-pager --since "10 minutes ago" \
            > "$RUNNER_TEMP/ollama-logs/ollama-systemd-final.log" 2>&1 || true

      - name: Upload Pierre logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pierre-server-logs
          path: ${{ runner.temp }}/pierre-logs/
          retention-days: 14

      - name: Upload Ollama logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-logs
          path: ${{ runner.temp }}/ollama-logs/
          retention-days: 14
