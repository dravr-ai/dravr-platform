# ABOUTME: Runs the retro skill's suite and shellcheck on Linux, the platform no developer uses
# ABOUTME: Path-scoped to the skill, so a push that does not change it starts no job
name: "Guard: retro skill"

on:
  push:
    paths:
      - '.agents/skills/retro/**'
      - '.github/workflows/retro.yml'
  pull_request:
    paths:
      - '.agents/skills/retro/**'
      - '.github/workflows/retro.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: false

jobs:
  suite:
    name: the digest from a throwaway repo, snapshot, vault and transcript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning .agents/skills/retro/retro.sh .agents/skills/retro/test.sh
      - name: suite
        run: bash .agents/skills/retro/test.sh
