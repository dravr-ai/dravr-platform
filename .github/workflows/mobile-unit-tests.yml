# ABOUTME: CI workflow for Pierre Mobile unit tests, typecheck, and lint
# ABOUTME: Runs on every push that touches mobile code — fast feedback loop (~3min)
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "CI: Mobile Unit"

on:
  workflow_dispatch:
  push:
    branches: [ "main", "debug/*", "feature/*", "fix/*", "claude/*", "copilot/*" ]
    paths:
      - 'frontend-mobile/**'
      - 'packages/**'
      - 'scripts/ci/check-eas-submit-config.sh'
      - 'scripts/ci/check-eas-submit-config.test.sh'
      - '.github/workflows/mobile-unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-mobile/**'
      - 'packages/**'
      - 'scripts/ci/check-eas-submit-config.sh'
      - 'scripts/ci/check-eas-submit-config.test.sh'

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Compile-free and dependency-free, so it runs before the installs: a
      # submit field EAS does not interpolate is only discovered otherwise by
      # dispatching "Deploy: TestFlight" and watching the upload reject the
      # placeholder as a malformed credential.
      - name: Test the EAS submit config check
        run: ./scripts/ci/check-eas-submit-config.test.sh

      - name: Check EAS submit config
        run: ./scripts/ci/check-eas-submit-config.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install shared-types dependencies
        working-directory: packages/shared-types
        run: bun install

      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install

      - name: Install mobile dependencies
        working-directory: frontend-mobile
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: frontend-mobile
        run: bun run typecheck

      - name: Lint
        working-directory: frontend-mobile
        run: bun run lint

      - name: Run unit tests
        working-directory: frontend-mobile
        run: bun run test -- --coverage

      # The integration config's `app` project drives the real screens, hooks and
      # @pierre/api-client against a stubbed axios adapter -- production code from
      # the component tree down to the request URL, with no simulator and no
      # backend. It is selected explicitly because the sibling `api` project
      # health-checks a live server on 8081 and would abort the run here.
      - name: Run app integration specs
        working-directory: frontend-mobile
        run: bunx jest --config integration/jest.config.js --selectProjects app

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/
          retention-days: 1
