# ABOUTME: CI workflow for Pierre Mobile unit tests, typecheck, and lint
# ABOUTME: Runs on every push that touches mobile code — fast feedback loop (~3min)
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

name: "CI: Mobile Unit"

on:
  workflow_dispatch:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'frontend-mobile/**'
      - 'packages/**'
      - 'scripts/ci/check-eas-submit-config.sh'
      - 'scripts/ci/check-eas-submit-config.test.sh'
      - 'bin/ios-simulator.sh'
      - 'scripts/ci/ios-simulator-lib.test.sh'
      - 'scripts/ci/check-seeded-session-route-not-bundled.sh'
      - 'frontend/e2e-real/seeded-session.ts'
      - 'frontend/e2e-real/pierre-cli.ts'
      - 'frontend/e2e-real/seeded-session.test.ts'
      - 'frontend/e2e-real/control-host.ts'
      - '.github/workflows/mobile-unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-mobile/**'
      - 'packages/**'
      - 'scripts/ci/check-eas-submit-config.sh'
      - 'scripts/ci/check-eas-submit-config.test.sh'
      - 'bin/ios-simulator.sh'
      - 'scripts/ci/ios-simulator-lib.test.sh'
      - 'scripts/ci/check-seeded-session-route-not-bundled.sh'
      - 'frontend/e2e-real/seeded-session.ts'
      - 'frontend/e2e-real/pierre-cli.ts'
      - 'frontend/e2e-real/seeded-session.test.ts'
      - 'frontend/e2e-real/control-host.ts'

concurrency:
  # One run going and one waiting, per lane and per ref (JF, 2026-11-19). A
  # running run always finishes, so main still turns green and deploys however
  # often it is pushed; a newer push takes the single waiting slot, replacing
  # the run that waited there, which GitHub cancels. The run that does go tests
  # a tree holding every skipped commit. Main used to keep one group per sha and
  # never cancel: 24 commits on 2026-11-19 queued ~600 jobs for a handful of
  # slots. Both costs are accepted: an intermediate main commit gets no verdict
  # of its own (the eviction carnet#169 once counted as a loss), and a branch
  # re-pushed mid-run finishes the superseded run (what carnet#1114 avoided),
  # bounded to one. The event name keeps a schedule or dispatch run out of the
  # push group. `cancel-in-progress` stays a literal: an expression there did
  # not hold on main (run 33026440559, see ci-backend.yml's history).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # p90 9 min

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Compile-free and dependency-free, so it runs before the installs: a
      # submit field EAS does not interpolate is only discovered otherwise by
      # dispatching "Deploy: TestFlight" and watching the upload reject the
      # placeholder as a malformed credential.
      - name: Test the EAS submit config check
        run: ./scripts/ci/check-eas-submit-config.test.sh

      - name: Check EAS submit config
        run: ./scripts/ci/check-eas-submit-config.sh

      # The dev scripts' simulator helpers (bin/ios-simulator.sh) against PATH
      # stubs: which simulator app the selected Xcode ships, device choice,
      # and the Expo Go install that has to match the SDK. It needs python3
      # and node, both on the image, and none of the installs below.
      - name: Test the iOS simulator helpers
        run: ./scripts/ci/ios-simulator-lib.test.sh

      # Expo SDK 57 wants Node 22.13 or later, and the image default moves
      # with the image. .nvmrc holds the version eas.json pins for EAS builds,
      # so the tests run on the Node the app is built with.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install shared-types dependencies
        working-directory: packages/shared-types
        run: bun install

      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install

      - name: Install mobile dependencies
        working-directory: frontend-mobile
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: frontend-mobile
        run: bun run typecheck

      - name: Lint
        working-directory: frontend-mobile
        run: bun run lint

      - name: Run unit tests
        working-directory: frontend-mobile
        run: bun run test -- --coverage

      # The integration config's `app` project drives the real screens, hooks and
      # @pierre/api-client against a stubbed axios adapter -- production code from
      # the component tree down to the request URL, with no simulator and no
      # backend. It is selected explicitly because the sibling `api` project
      # health-checks a live server on 8081 and would abort the run here.
      - name: Run app integration specs
        working-directory: frontend-mobile
        run: bunx jest --config integration/jest.config.js --selectProjects app

      # The E2E seeded-session route (app/(auth)/e2e/, carnet#1201) signs the
      # app in from a link, so it must never reach a release bundle. The
      # block-list test above pins metro.config.js's decision; this exports the
      # production bundle a store build ships (about 15 s) and reads it.
      - name: Check no production bundle carries the seeded-session route
        run: ./scripts/ci/check-seeded-session-route-not-bundled.sh

      # The Maestro control process hands each seeded session out behind a
      # single-use code. Its store imports only node builtins, so bun runs the
      # test from the checkout with no install.
      - name: Test the control process's seeded-session codes
        working-directory: frontend
        run: bun test e2e-real/seeded-session.test.ts

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/
          retention-days: 1
