name: "CI: MCP Protocol Compliance"

on:
  push:
    branches: [ "main", "debug/*", "feature/*", "fix/*", "claude/*", "copilot/*" ]
    paths:
      - 'crates/pierre-server/src/mcp/**'
      - 'sdk/**'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - '.github/workflows/mcp-compliance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/pierre-server/src/mcp/**'
      - 'sdk/**'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - '.github/workflows/mcp-compliance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

jobs:
  mcp-compliance:
    name: MCP Protocol Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Reuse the backend workflows' WARM release cache (shared-key: release) so the
      # server build below is incremental, not a cold from-scratch build. The prior
      # raw actions/cache of the full debug target/ blew the 10GB limit (save silently
      # failed) and the inline cold debug build OOM-thrashed the 2-core runner (~90min+).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Install MCP Validator
        run: |
          echo "📦 Installing MCP Validator..."
          git clone --depth 1 https://github.com/Janix-ai/mcp-validator.git validator
          cd validator
          python3 -m venv venv
          source venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          echo "✅ MCP Validator installed"

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile

      - name: Build bridge
        working-directory: sdk
        run: bun run build

      - name: Validate SDK types exist
        working-directory: sdk
        run: |
          echo "🔍 Validating SDK TypeScript types..."
          if [ ! -f "src/types.ts" ]; then
            echo "❌ ERROR: src/types.ts not found"
            echo "📝 Run 'bun run generate-types' locally and commit the generated types"
            exit 1
          fi
          if grep -q "PLACEHOLDER" "src/types.ts"; then
            echo "⚠️  WARNING: types.ts contains placeholder content"
            echo "📝 Run 'bun run generate-types' with a running server and commit the real types"
            echo "   For CI: Types should be pre-generated and committed to the repository"
            exit 1
          fi
          echo "✅ SDK types validated successfully"

      # Build the server here (release, incremental off the warm shared release
      # cache) so the validation script reuses target/release/pierre-mcp-server
      # instead of cold-building it inline (which OOM-thrashed the runner ~90min+).
      - name: Build server (release)
        run: cargo build --release --bin pierre-mcp-server

      - name: Check disk space before validation
        run: |
          echo "Disk space before validation:"
          df -h

      - name: Run MCP compliance validation
        run: ./scripts/ci/ensure-mcp-compliance.sh
        env:
          # Use the release binary built above (off the warm cache) — the script
          # otherwise checks target/debug first and cold-builds inline (OOM).
          PIERRE_SERVER_BINARY: ${{ github.workspace }}/target/release/pierre-mcp-server
          # CI detection variables for bridge
          CI: "true"
          GITHUB_ACTIONS: "true"
          # Pierre server configuration
          HTTP_PORT: 8080
          DATABASE_URL: "sqlite::memory:"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_ALLOW_INTERACTIVE_OAUTH: "false"
          PIERRE_RSA_KEY_SIZE: "2048"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"

      - name: Clean up validation artifacts
        if: always()
        run: |
          rm -rf validator/reports/*.md 2>/dev/null || true
          rm -rf /tmp/pierre-mcp-server-*.log 2>/dev/null || true
          echo "Final disk space:"
          df -h
