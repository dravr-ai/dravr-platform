# ABOUTME: PostgreSQL integration test workflow with smart path triggers.
# ABOUTME: Runs when ANY crate (crates/**) or migration changes — broad on purpose so a newly-extracted crate can never silently skip the backend suite.
name: "CI: Backend (PostgreSQL)"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      # Any crate change runs the backend suite. The prior explicit list
      # silently dropped each newly-extracted crate (a recurring false-green),
      # so crates/** trades a few CI minutes for never skipping the backend
      # suite on a backend change again.
      - 'crates/**'
      - 'migrations/**'
      - 'migrations_pg/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-postgres.yml'
      - '.github/actions/rust-setup/**'
  pull_request:
    branches: [ main ]
    paths:
      # Keep in sync with the push paths above — any crate change.
      - 'crates/**'
      - 'migrations/**'
      - 'migrations_pg/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-postgres.yml'
      - '.github/actions/rust-setup/**'
  schedule:
    # Weekly full PostgreSQL validation (Sundays at 2:30 AM UTC)
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress PG runs: the full-on-main suite takes ~11 min and
  # rapid main pushes were cancelling it mid-run, so its verdict was never seen.
  # Runs queue per ref and complete instead of being killed.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  postgres-tests:
    name: Database Tests (PostgreSQL ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A backstop, not a performance budget. Successful runs land in 29-47 min;
    # this only ever fires on a job that has stopped making progress.
    #
    # It exists because `cancel-in-progress: false` above — correct on its own
    # terms — makes a hung job unrecoverable on this lane: nothing displaces it,
    # so every later PG run queues behind it and only the newest waiting run
    # survives. On 2026-08-19 shard 3/4 hung 212 min in `Setup Rust environment`
    # and three subsequent main pushes never got a PostgreSQL verdict at all.
    #
    # The existing `timeout-minutes: 75` further down guards only the test step,
    # which is why it did not help: the job hung before ever reaching it. A job
    # bound is the one that catches a hang wherever it happens, and it has to
    # live here — composite actions cannot bound their own steps.
    timeout-minutes: 90

    strategy:
      # One shard's failure must not cancel the others — we want every shard's
      # verdict, and a real failure should not be masked by a sibling shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pierre
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pierre_mcp_server
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'
          keep-docker: 'true'

      - name: Setup Node.js (for SDK E2E tests runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U pierre; do sleep 2; done'
          echo "PostgreSQL is ready"

      - name: Verify PostgreSQL connection
        run: |
          echo "Testing PostgreSQL connection..."
          PGPASSWORD=ci_test_password psql -h localhost -U pierre -d pierre_mcp_server -c "SELECT version();"

      - name: Run PostgreSQL tests (full suite on main, PG-only files on branches)
        # Both lanes select test FILES and run them one `--test` at a time. A
        # monolithic `cargo test` linked all ~325 test binaries on one runner and
        # was OOM-killed (~11min, no output); per-file runs keep only one binary
        # resident, mirroring the SQLite shards.
        #
        # Main/schedule: every test file, partitioned round-robin across 4 shards.
        # Feature branches: the `*_postgresql_test.rs` files — the ones whose
        # failure shape is PostgreSQL-only — across the same 4 shards. This lane
        # used to pass `database_plugins` as a bare argument, which cargo reads as
        # a test-NAME filter; every PostgreSQL test is named `test_pg_*`, so the
        # filter matched nothing and the branch lane reported green having run
        # zero tests. An empty selection now fails the job instead.
        # Using --test-threads=4 - concurrent tests use #[serial] for isolation (issue #36)
        run: |
          SHARD=${{ matrix.shard }}
          SHARDS=4
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            LANE="full suite"
            mapfile -t ALL_TESTS < <(
              find crates/pierre-server/tests -maxdepth 1 -name '*.rs' -printf '%f\n' \
                | sed 's/\.rs$//' \
                | grep -v '^common$' \
                | sort
            )
          else
            LANE="PostgreSQL-specific files"
            mapfile -t ALL_TESTS < <(
              find crates/pierre-server/tests -maxdepth 1 -name '*_postgresql_test.rs' -printf '%f\n' \
                | sed 's/\.rs$//' \
                | sort
            )
          fi
          if [ "${#ALL_TESTS[@]}" -eq 0 ]; then
            echo "::error::PostgreSQL lane selected no test files ($LANE) — refusing to report green."
            exit 1
          fi
          SHARD_TESTS=()
          for i in "${!ALL_TESTS[@]}"; do
            if (( (i % SHARDS) + 1 == SHARD )); then
              SHARD_TESTS+=("${ALL_TESTS[$i]}")
            fi
          done
          echo "=== Shard $SHARD/$SHARDS ($LANE): ${#SHARD_TESTS[@]} of ${#ALL_TESTS[@]} test files ==="
          if [ "${#SHARD_TESTS[@]}" -eq 0 ]; then
            echo "Fewer test files than shards; shard $SHARD has nothing to run."
            exit 0
          fi
          printf '  %s\n' "${SHARD_TESTS[@]}"
          FAILED=0
          for test_file in "${SHARD_TESTS[@]}"; do
            echo "::group::$test_file"
            if ! cargo test --features postgresql --test "$test_file" -- --test-threads=4; then
              echo "::error::PostgreSQL test file $test_file failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        timeout-minutes: 75
        env:
          DATABASE_URL: "postgresql://pierre:ci_test_password@localhost:5432/pierre_mcp_server"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          POSTGRES_MAX_CONNECTIONS: "3"
          POSTGRES_MIN_CONNECTIONS: "1"
          POSTGRES_ACQUIRE_TIMEOUT: "20"
          RUST_LOG: "info"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
