name: "CI: TypeScript SDK"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'sdk/**'
      - 'packages/mcp-types/**'
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sdk-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdk/**'
      - 'packages/mcp-types/**'
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sdk-tests.yml'
  workflow_dispatch:

concurrency:
  # On main the sha is part of the group, so every commit gets its own group and
  # nothing can cancel anyone's verdict. Branches share a group per ref and keep
  # cancelling, where fast feedback beats a stale result.
  #
  # The ref test lives in `group` rather than in `cancel-in-progress` because
  # only the former is known to work here: `cancel-in-progress: ${{ github.ref
  # != 'refs/heads/main' }}` was tried first and did not hold — run 33026440559
  # on main was cancelled one second after the next run was created, and that
  # run's run_started_at equalled its created_at, so it never waited on the
  # group the way a false would have made it. `group` expressions demonstrably
  # do evaluate: that is what has been scoping cancellation per ref all along.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

jobs:
  sdk-types-check:
    name: SDK Types Up-to-Date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-sdk-types-1.96.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-types-1.96.0-
            ${{ runner.os }}-cargo-

      - name: Build Pierre server and CLI
        run: cargo build --quiet --bin pierre-mcp-server --bin pierre-cli
        env:
          CARGO_INCREMENTAL: 0

      - name: Generate SDK types and check for drift
        run: |
          # Start server in background
          ./target/debug/pierre-mcp-server &
          SERVER_PID=$!

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8081/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # GET /mcp/tools is tiered exactly like JSON-RPC tools/list, so only a
          # global admin sees the complete registry the generated types describe.
          # The server has applied the migrations by now, so the CLI can write to
          # the same on-disk database.
          ./target/debug/pierre-cli user create \
            --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --force

          PIERRE_ADMIN_TOKEN="$(curl -s -X POST http://localhost:8081/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "grant_type=password&username=$ADMIN_EMAIL&password=$ADMIN_PASSWORD" \
            | jq -r '.access_token // empty')"
          if [ -z "$PIERRE_ADMIN_TOKEN" ]; then
            echo "::error::Failed to mint an admin token for SDK type generation"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          export PIERRE_ADMIN_TOKEN

          # Generate types
          cd packages/mcp-types && bun run generate
          cd ../..

          # Stop server
          kill $SERVER_PID 2>/dev/null || true

          # Check for changes in all generated type files
          if ! git diff --exit-code packages/mcp-types/src/; then
            echo ""
            echo "::error::SDK types are out of sync with server schemas. Run 'bun run generate-types' in sdk/ and commit the result."
            echo ""
            exit 1
          fi

          echo "SDK types are up to date"
        env:
          # File-backed (not sqlite::memory:) so pierre-cli can create the admin
          # user in the same database the running server reads.
          DATABASE_URL: "sqlite:./sdk-types-ci.db?mode=rwc"
          ADMIN_EMAIL: "sdk-types-ci@pierre.dev"
          ADMIN_PASSWORD: "SdkTypesCi123!"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"

  sdk-tests:
    name: SDK Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-sdk-1.96.0-v2-${{ hashFiles('**/Cargo.lock', 'migrations/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-1.96.0-v2-
            ${{ runner.os }}-cargo-

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile

      - name: Lint SDK code
        working-directory: sdk
        run: bun run lint

      - name: Type check SDK
        working-directory: sdk
        run: bun run type-check

      - name: Validate response schemas
        working-directory: sdk
        run: |
          echo "Validating Zod response schemas..."
          # Check that response-schemas.ts exists
          if [ ! -f "src/response-schemas.ts" ]; then
            echo "Error: src/response-schemas.ts not found"
            exit 1
          fi
          # Count tools in schema map (should be >= 35). The keys are bare
          # identifiers, not quoted strings, and they are read from inside the
          # map body — a count that selects nothing reads 0 and must fail, not
          # warn: an empty selection is never a passing coverage check.
          MAP_COUNT=$(awk '/^export const ToolResponseSchemaMap/{in_map=1;next} in_map&&/^}/{exit} in_map' src/response-schemas.ts \
            | grep -cE "^[[:space:]]+[a-z][a-z0-9_]*:" || true)
          echo "Found $MAP_COUNT tools in ToolResponseSchemaMap"
          if [ "$MAP_COUNT" -lt 35 ]; then
            echo "Error: only $MAP_COUNT tools have response schemas (expected >= 35)"
            exit 1
          fi
          # Run schema unit tests
          bun run test test/unit/response-schemas.test.js || {
            echo "Response schema tests failed - schemas may be out of sync"
            exit 1
          }
          echo "Response schema validation passed"

      - name: Build SDK bridge
        working-directory: sdk
        run: bun run build

      - name: Run SDK unit tests
        working-directory: sdk
        run: bun run test:unit

      - name: Build Pierre server (debug, for integration tests)
        run: cargo build
        env:
          CARGO_INCREMENTAL: 0

      - name: Run SDK integration tests
        working-directory: sdk
        run: bun run test:integration
        env:
          DATABASE_URL: "sqlite::memory:"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"

      - name: Run SDK E2E tests
        working-directory: sdk
        run: bun run test:e2e
        env:
          DATABASE_URL: "sqlite::memory:"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"

      - name: Upload SDK test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-results
          path: sdk/test-results/
          retention-days: 1
          if-no-files-found: ignore
