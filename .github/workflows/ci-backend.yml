# ABOUTME: Main backend CI pipeline — fmt + per-crate clippy + full clippy + deadlock + audit + doc-tests fire in parallel from the start on every push.
# ABOUTME: SQLite shards (backend-tests) are cron-only; per-push DB coverage is ci-postgres.yml and per-push leaf-crate tests run here (leaf-crate-tests).
name: "CI: Backend (Rust)"

on:
  workflow_dispatch:
  push:
    branches: [ "main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/ci/**'
      # The gate self-tests cover the worktree skill library too.
      - '.claude/skills/lib/**'
      # The fast gate now also reads the clients and the shared packages: the
      # surface gates fail on a reply block only one client renders and on a
      # generated capability catalogue left behind.
      - 'frontend/src/**'
      - 'frontend-mobile/src/**'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/rust-setup/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/ci/**'
      # The gate self-tests cover the worktree skill library too.
      - '.claude/skills/lib/**'
      - 'frontend/src/**'
      - 'frontend-mobile/src/**'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/rust-setup/**'
  schedule:
    # Daily at 08:00 UTC (04:00 EDT / 03:00 EST) — runs the SQLite shard job.
    - cron: '0 8 * * *'

concurrency:
  # On main the sha is part of the group, so every commit gets its own group and
  # nothing can cancel anyone's verdict. Branches share a group per ref and keep
  # cancelling, where fast feedback beats a stale result.
  #
  # The ref test lives in `group` rather than in `cancel-in-progress` because
  # only the former is known to work here: `cancel-in-progress: ${{ github.ref
  # != 'refs/heads/main' }}` was tried first and did not hold — run 33026440559
  # on main was cancelled one second after the next run was created, and that
  # run's run_started_at equalled its created_at, so it never waited on the
  # group the way a false would have made it. `group` expressions demonstrably
  # do evaluate: that is what has been scoping cancellation per ref all along.
  # The event name is part of the group too: a `schedule` run on main carries
  # the tip's sha, so without it the cron joined the tip's push-run group and
  # cancelled that verdict mid-flight (observed 2026-08-31: the 15:59 UTC cron
  # killed 7eac7b067's push run six minutes in). Push, schedule and dispatch
  # now each get their own group; the per-commit protection is unchanged.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # ============================================================================
  # PHASE 0 (parallel, no inter-dependencies):
  #   fast-gate            — fmt + architectural + secret patterns (~30s, no compile)
  #   preflight-clippy     — per-crate clippy on changed leaf crates (~3-5 min)
  #   clippy               — full-workspace clippy (~10-12 min, gates release-binary)
  #   deadlock-analysis    — lockbud static deadlock detection (~10 min)
  #   security-audit       — cargo deny + dravr-* duplicate check (~3 min)
  #   doc-tests            — cargo test --doc + telemetry-feature tests (~5 min)
  #   contremaitre-sync    — the 4 platform<->contremaitre coupling tests (~5 min)
  #   feature-profiles     — the 2-profile server feature matrix: production clippy + no-default-features check (~5 min)
  #   backend-tests        — SQLite shards, cron / workflow_dispatch only
  #   leaf-crate-tests     — every non-pierre-server crate's tests/ dir, per push
  #   changed-server-tests — the pierre-server test files THIS push touched
  # PHASE 1: release-binary (depends on clippy)
  #
  # Every job below carries a `timeout-minutes`, sized to its observed duration
  # with headroom. GitHub's default is 360 minutes, and a step-level bound cannot
  # catch a hang in `Setup Rust environment` — the composite action this file
  # shares with ci-postgres.yml, where shard 3/4 hung 212 minutes in that very
  # step on 2026-08-19. A job bound catches a hang wherever it happens, and it
  # has to live at job level: composite actions cannot bound their own steps.
  # ============================================================================

  detect-changes:
    name: Detect Changes
    timeout-minutes: 5  # path filtering only; no toolchain, no compile
    runs-on: ubuntu-latest
    outputs:
      release-worthy: ${{ steps.set-outputs.outputs.release-worthy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            release-worthy:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Set outputs (schedule runs everything)
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "release-worthy=true" >> $GITHUB_OUTPUT
          else
            echo "release-worthy=${{ steps.filter.outputs.release-worthy }}" >> $GITHUB_OUTPUT
          fi

  fast-gate:
    name: Fast Gate (fmt + architecture + secrets + surfaces)
    timeout-minutes: 15  # ~30s of compile-free gates plus rustfmt and an apt install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # .build vendors llm-registre (nested submodule), whose gates
          # architectural-validation.sh hard-requires — so: recursive.
          submodules: recursive
          # The phantom-surface and turn-envelope gates diff against the base
          # of the push; a depth-1 checkout has nothing to diff against.
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust (rustfmt only, no compilation needed)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Architectural Validation (Custom Patterns + Security Skills)
        env:
          # The diff-scoped gates this script nests (file-size ratchet, migration
          # idempotency) are invoked with no argument, so they read their base
          # from here. It has to be the push's own before-sha: actions/checkout
          # force-creates refs/heads/main from refs/remotes/origin/main, leaving
          # origin/main == HEAD, and a gate diffing against that inspects nothing.
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci/architectural-validation.sh --apply-skills

      - name: Secret Pattern Validation
        run: ./scripts/ci/validate-no-secrets.sh

      # Compile-free, like everything else in this job. Both gates read source
      # with grep and awk; neither needs a toolchain or a running server.
      - name: Phantom Surface Detection
        run: ./scripts/ci/check-phantom-surfaces.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Turn Envelope Convergence
        run: ./scripts/ci/check-turn-envelope.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      # Both fixture tests build throwaway repos and assert their gate FAILS on
      # a violation. They existed and ran nowhere, which is the failure mode
      # their own headers warn about: "An unverified gate is worse than no gate:
      # it reports ✅ forever and everyone believes the budget is enforced."
      # Compile-free like the rest of this job. The dev-process and tunnel
      # suites spawn real processes and wait on them, so the block runs in tens
      # of seconds rather than the couple the source-reading gates take alone.
      - name: Gate self-tests (file sizes, advisory reviews, migration versions, moved symbols, worktree lib, dev process scope, tunnel env, tier selection, contremaitre fallback sync, deploy ancestry)
        run: |
          ./scripts/ci/check-file-sizes.test.sh
          ./scripts/ci/check-advisory-reviews.test.sh
          ./scripts/ci/check-migration-versions.test.sh
          ./scripts/ci/check-moved-symbols.test.sh
          ./scripts/ci/worktree-lib.test.sh
          ./scripts/ci/dev-process-scope.test.sh
          ./scripts/ci/tunnel-env-lib.test.sh
          ./scripts/ci/pre-push-validate.test.sh
          ./scripts/ci/sync-contremaitre-fallback.test.sh
          ./scripts/ci/check-deploy-ancestry.test.sh

      # The dev scripts decide which processes a stop may kill and which files a
      # tunnel may rewrite, so a quoting or word-splitting slip there reaches a
      # peer checkout's running stack or a gitignored secrets file. shellcheck
      # reads them without executing anything, so it belongs in this job.
      # shellcheck ships on the ubuntu runner image, so this stays a local read
      # with no network step on the fastest gating job.
      - name: Shell lint (dev stack scripts)
        run: shellcheck -S warning bin/*.sh scripts/ci/*.test.sh scripts/setup/setup-claude-code-mcp.sh

  preflight-clippy:
    name: Preflight Clippy (per-crate, fast feedback)
    timeout-minutes: 25  # per-crate clippy on changed leaf crates, ~3-5 min
    runs-on: ubuntu-latest
    # No `needs` — fires immediately in parallel with fast-gate / clippy / deadlock.
    # Mirrors scripts/ci/pre-push-validate.sh Tier 2: per-crate clippy on the leaf
    # crates that actually changed in this push, skipping pierre-server (whose
    # per-crate clippy is as slow as the full-workspace run and is handled by the
    # `clippy` job). Designed to fail in 3–5 min on the most common error class.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Detect changed leaf crates
        id: detect
        run: |
          if git rev-parse --verify "origin/main" &>/dev/null; then
              BASE=$(git merge-base "origin/main" HEAD 2>/dev/null || echo "origin/main")
          else
              BASE="HEAD~1"
          fi
          CRATES=$(git diff --name-only "$BASE" HEAD 2>/dev/null \
              | grep '^crates/' \
              | sed 's|^crates/||; s|/.*||' \
              | sort -u \
              | grep -v '^pierre-server$' \
              || true)
          # pierre-server is excluded above because its per-crate clippy is as
          # slow as the full-workspace run. That left crates/pierre-server/tests/
          # linted by NOTHING until the full job reported ~12 min after the push:
          # on 2026-08-26 a doc comment in a test file reddened main that way,
          # and the same gap covers every integration test in the repo. A single
          # changed test binary is cheap to lint on its own, so name the targets.
          TEST_TARGETS=$(git diff --name-only "$BASE" HEAD 2>/dev/null \
              | grep '^crates/pierre-server/tests/[^/]*\.rs$' \
              | sed 's|.*/||; s|\.rs$||' \
              | sort -u \
              || true)
          if [ -n "$TEST_TARGETS" ]; then
              echo "Changed pierre-server test targets:"
              echo "$TEST_TARGETS"
              {
                  echo "test_targets<<TARGETS_EOF"
                  echo "$TEST_TARGETS"
                  echo "TARGETS_EOF"
              } >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CRATES" ] && [ -z "$TEST_TARGETS" ]; then
              echo "No leaf-crate or test-target changes — preflight clippy will skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "Leaf crates changed:"
              echo "$CRATES"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              {
                  echo "crates<<CRATES_EOF"
                  echo "$CRATES"
                  echo "CRATES_EOF"
              } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust environment
        if: steps.detect.outputs.skip != 'true'
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Per-crate clippy
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Folder name == package name for every workspace crate except pierre-server,
          # which is excluded above. Pass the folder name straight to `-p`.
          FAILED=0
          while IFS= read -r crate; do
              [ -z "$crate" ] && continue
              if [ ! -d "crates/$crate" ]; then
                  echo "crate $crate no longer exists in this tree; skipping"
                  continue
              fi
              echo "::group::cargo clippy -p $crate --all-targets --all-features"
              if ! cargo clippy -p "$crate" --all-targets --all-features -- -D warnings; then
                  echo "::error::clippy failed for $crate"
                  FAILED=1
              fi
              echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.crates }}"

          # Changed integration-test binaries, one target at a time. `--test X`
          # builds the library plus that one binary, not all ~500 of them, which
          # is what makes this affordable here.
          while IFS= read -r target; do
              [ -z "$target" ] && continue
              # A target derived from the diff may have been DELETED by the
              # diff; cargo errors on a nonexistent test target, so skip it.
              if [ ! -f "crates/pierre-server/tests/$target.rs" ]; then
                  echo "test target $target no longer exists in this tree; skipping"
                  continue
              fi
              echo "::group::cargo clippy -p pierre_mcp_server --test $target"
              if ! cargo clippy -p pierre_mcp_server --test "$target" --all-features -- -D warnings; then
                  echo "::error::clippy failed for test target $target"
                  FAILED=1
              fi
              echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.test_targets }}"
          exit "$FAILED"

  clippy:
    name: Clippy Linting (full workspace)
    timeout-minutes: 45  # full-workspace clippy, ~10-12 min
    runs-on: ubuntu-latest
    # No `needs` — fires immediately in parallel with fast-gate / preflight-clippy /
    # deadlock. The release-binary job downstream still gates on this job so the
    # release artifact is only produced after full-workspace clippy passes.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          free-disk-space: 'true'

      # The wrapper runs `cargo clippy --keep-going --all-targets --all-features
      # -- -D warnings` unchanged — same diagnostics, same exit status — and adds
      # one thing: the crates the run could not reach.
      #
      # --keep-going carries cargo past a failing crate into everything that does
      # not depend on it. Without it a change touching several crates surfaces
      # its violations one ~15-minute run at a time. What it cannot do is lint a
      # crate whose dependency failed, because there is no rmeta to lint against,
      # and those crates emit no diagnostics at all — which reads exactly like
      # having none. On 2026-08-26 that reading cost three sessions an evening:
      # one error in pierre-services was all this job could see, four more sat
      # unevaluated in its dependents, and each round of fixing the visible one
      # reddened main again on errors that had been there the whole time.
      #
      # So the report distinguishes clean from unevaluated. scripts/ci/
      # clippy-workspace.test.sh builds a three-crate workspace and breaks one of
      # them to prove the report fires.
      # The instrument is verified on the same run that depends on it: three
      # throwaway crates, one deliberately broken, asserting that its dependent
      # is named and the crate beside it is not. ~5s.
      - name: Self-test the unevaluated-crate reporter
        run: ./scripts/ci/clippy-workspace.test.sh

      - name: Lint with Clippy (Zero Tolerance + Cognitive Complexity)
        run: python3 scripts/ci/clippy-workspace.py

  deadlock-analysis:
    name: Static Deadlock Analysis (lockbud)
    timeout-minutes: 45  # lockbud over the workspace, ~10 min
    runs-on: ubuntu-latest
    # No `needs` — fires immediately in parallel with the other linting gates.
    # Migrated from the standalone deadlock-detection.yml workflow so all
    # static-analysis gates report under a single Backend CI status.
    container:
      image: burtonqin/lockbud

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Run lockbud deadlock detection
        run: |
          echo "Running static deadlock analysis with lockbud..."
          echo "Analyzing: std::sync::{Mutex, RwLock}, parking_lot, spin locks"
          cargo lockbud -k deadlock 2>&1 | tee deadlock-report.txt
          if grep -q "Double Lock\|Conflicting Lock Order" deadlock-report.txt; then
            echo "Potential deadlock issues detected! Review the report above."
            # Warnings only — do not fail the build on deadlock findings.
            exit 0
          else
            echo "No deadlock issues detected"
          fi

      - name: Run atomicity violation detection
        run: |
          echo "Running atomicity violation analysis..."
          cargo lockbud -k atomicity_violation 2>&1 | tee atomicity-report.txt || true
          echo "Atomicity analysis complete"

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockbud-reports
          path: |
            deadlock-report.txt
            atomicity-report.txt
          retention-days: 1

  security-audit:
    name: Security Audit
    timeout-minutes: 20  # cargo-deny / advisory database, minutes
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Security Audit (via deny.toml)
        run: cargo deny check

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup

      - name: dravr-* duplicate check (hard fail)
        run: |
          # Hard-fails if cargo tree -d reports any dravr-ecosystem crate at
          # multiple versions. The workspace [patch.crates-io] block + per-dep
          # tag pins MUST converge every consumer onto a single version per
          # crate.
          #
          # Most crates are named `dravr-<x>` (cageux/canot/commere/enforme/
          # equilibre/meteo/riviere/sciotte/tronc), but `embacle` is loaded from
          # the dravr-ai/dravr-embacle repo under its bare crate name — match
          # that explicitly so the gate can't be silently bypassed by renames.
          dups="$(cargo tree -d 2>&1 | grep -E '^(dravr-|embacle )' || true)"
          if [ -n "$dups" ]; then
            echo "::error::dravr-ecosystem duplicate(s) detected — every dravr crate must converge on one version:"
            echo "$dups"
            exit 1
          fi

  doc-tests:
    name: Doc Tests
    timeout-minutes: 40  # compiles every crate's doc tests
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup

      # Runs the doctests AND checks none are ignored, from one invocation.
      #
      # This step used to end `cargo test --doc 2>&1 || true` and then inspect
      # only the ignored count, so a doctest that failed to compile left the job
      # green — a `no_run` example still has to build. That is how
      # pierre-cache's `TenantId::default()` survived on main after 19afe3334
      # removed the constructor: the job named "Doc Tests" was never failing on
      # doctests. It also lacked --workspace, so crates outside the default
      # members were never reached at all.
      - name: Doc tests
        run: |
          echo "Running workspace doctests..."
          set +e
          DOCTEST_OUTPUT=$(cargo test --workspace --doc 2>&1)
          STATUS=$?
          set -e
          echo "$DOCTEST_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Doctests failed. A no_run example still has to compile."
            exit 1
          fi

          IGNORED_COUNT=$(echo "$DOCTEST_OUTPUT" | grep -E "test result:.*ignored" | grep -oE "[0-9]+ ignored" | grep -oE "[0-9]+" | head -1 || echo "0")
          if [ "${IGNORED_COUNT:-0}" -gt 0 ]; then
            echo "::error::Found $IGNORED_COUNT ignored doctest(s)!"
            exit 1
          fi
          echo "Doctests passed, none ignored"
        env:
          DATABASE_URL: "sqlite::memory:"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"

      # The `telemetry` feature is off in every other test job, so these
      # feature-gated integration tests (traceparent injection on the shared
      # HTTP clients, OTLP pipeline activation contract) only execute here.
      - name: Telemetry feature tests
        run: |
          cargo test -p pierre-core --features telemetry --test trace_propagation_test
          cargo test -p pierre-logging --features telemetry --test otel_pipeline_test

  # The tests policing platform<->contremaitre coupling (tool list, notify
  # catalogue, messaging locales) used to run ONLY in the full suite — cron
  # SQLite shards, full-on-main ci-postgres, coverage. Since features merge by
  # local squash with no PR, the branch never executed them: drift false-greened
  # the branch and red main post-merge. Running the four files on every push
  # moves that verdict before the merge. Four test binaries, not ~500, and it
  # runs alongside the ~10-12 min clippy job, so it costs no critical path.
  contremaitre-sync:
    name: Contremaitre Coupling Tests
    timeout-minutes: 20  # four catalogue tests, ~5 min
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup

      - name: Coupling tests (tool list, notify catalogue, locales)
        run: |
          cargo test \
            --test contremaitre_test \
            --test notify_catalogue_test \
            --test messaging_locale_test \
            --test configuration_mcp_integration_test \
            -- --test-threads=4
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

  feature-profiles:
    name: Feature Profile Check (${{ matrix.name }})
    timeout-minutes: 40  # cargo check per feature profile
    runs-on: ubuntu-latest
    needs: fast-gate
    # Every other job here builds pierre_mcp_server with the default feature set
    # or with --all-features. Neither is what ships: the Dockerfile builds
    # --no-default-features with postgresql and WITHOUT sqlite, a combination
    # --all-features cannot produce because it turns both backends on. So the
    # one build that reaches Cloud Run was, until 2026-08-26, compiled first by
    # the deploy.
    #
    # A feature gate naming the wrong feature, or a leaf crate turning a trait
    # method on unconditionally while the host's impl stays gated, is invisible
    # until something builds a configuration that separates them (carnet#116).
    # Two do that here, and both earn their slot:
    #   production — the exact Dockerfile line. Red here is a red deploy.
    #   no-default-features — every gate off at once. The cheapest possible
    #     probe for a gate that names the wrong feature, and the one that found
    #     all of carnet#116's errors.
    # Keep this matrix to configurations something actually builds. Four
    # server-* profiles used to sit here; nothing had ever built them, which is
    # how they stayed broken, and they were deleted rather than gated.
    #
    # The production profile runs `cargo clippy`, the probe runs `cargo check`.
    # `--all-features` cannot produce the shipping combination (postgresql WITHOUT
    # sqlite), so no clippy job in this workflow lints the code that actually
    # deploys — a lint reachable only under that combination has nothing standing
    # between it and the Docker build. Clippy costs little more than check on the
    # same unit, so the configuration that ships gets linted; `no-default-features`
    # stays a check, since its job is to prove the gates are wired, not to lint.
    # RUSTFLAGS denies warnings for the workspace only — Cargo
    # compiles registry and git dependencies with --cap-lints allow, so
    # third-party code cannot fail this.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            features: 'server-production,postgresql,sqlx/migrate,telemetry,gcp-kms'
          - name: no-default-features
            features: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          # The production entry lints rather than checks, so this job needs the
          # clippy component the way the full-workspace job does. Without it the
          # matrix fails with "'cargo-clippy' is not installed for the toolchain"
          # — which is what it did on 18c54d9ec.
          components: clippy
          free-disk-space: 'true'

      - name: Check ${{ matrix.name }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --keep-going -p pierre_mcp_server \
              --no-default-features --features "${{ matrix.features }}" -- -D warnings
          else
            cargo check --keep-going -p pierre_mcp_server --no-default-features
          fi
        env:
          RUSTFLAGS: "-D warnings"

  backend-tests:
    name: Backend Tests (SQLite ${{ matrix.shard }}/4)
    timeout-minutes: 90  # one SQLite shard of the full suite (cron only)
    runs-on: ubuntu-latest
    needs: fast-gate
    # SQLite shards run daily via cron (04:00 EDT) and on manual dispatch only.
    # Per-push coverage comes from PostgreSQL via ci-postgres.yml; SQLite is a
    # compatibility check that doesn't need to gate every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'

      - name: Setup Node.js (for SDK E2E tests runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        # --ignore-scripts: sdk/package.json's `prepare` runs this same build
        # as the last phase of `bun install`, so without it the SDK builds
        # twice per job (carnet#161). Full rationale in cross-platform.yml.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          mapfile -t ALL_TESTS < <(
            find crates/pierre-server/tests -maxdepth 1 -name '*.rs' -printf '%f\n' \
              | sed 's/\.rs$//' \
              | grep -v '^common$' \
              | grep -v 'cache_redis_test' \
              | grep -v 'database_plugins_postgresql_test' \
              | sort
          )
          TOTAL=${#ALL_TESTS[@]}
          SHARD=${{ matrix.shard }}
          SHARDS=4

          SHARD_TESTS=()
          for i in "${!ALL_TESTS[@]}"; do
            if (( (i % SHARDS) + 1 == SHARD )); then
              SHARD_TESTS+=("${ALL_TESTS[$i]}")
            fi
          done

          echo "=== Shard $SHARD/$SHARDS: ${#SHARD_TESTS[@]} of $TOTAL test files ==="
          printf '  %s\n' "${SHARD_TESTS[@]}"
          echo ""

          FAILED=0
          for test_file in "${SHARD_TESTS[@]}"; do
            echo "::group::$test_file"
            if ! cargo test --test "$test_file" -- --test-threads=4; then
              echo "::error::Test file $test_file failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

  # Every test target OUTSIDE crates/pierre-server/tests, on every push. The
  # per-push suites enumerate only pierre-server's tests directory (ci-postgres
  # full-on-main, the cron SQLite shards), so a test in a leaf crate — e.g.
  # pierre-chat-pipeline/tests/turn_directive_test.rs — ran per-push only in
  # the coverage lane. On 2026-08-30 that let b76ebb0fa land on main with a
  # broken pipeline test while every ci-backend job stayed green; coverage
  # reported it 100+ minutes later. This job closes that hole: one runner, one
  # cargo invocation, every leaf crate's tests/ dir, refusing to report green
  # on an empty selection exactly as the PostgreSQL lane learned to.
  leaf-crate-tests:
    name: Leaf-Crate Tests (every crate but pierre-server)
    timeout-minutes: 60  # the 45-min test step plus build; the step bound cannot catch a hang before it
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'

      - name: Run every leaf crate's test targets
        run: |
          # Package names are read from each Cargo.toml, never derived from the
          # directory (crates/pierre-server is the standing counter-example:
          # its package is pierre_mcp_server). pierre-server is excluded here
          # because its 300+ test binaries have their own lanes; everything
          # else joins automatically the day it grows a tests/ directory.
          PKG_FLAGS=()
          COUNT=0
          for dir in crates/*/tests; do
            [ -d "$dir" ] || continue
            crate_dir="$(dirname "$dir")"
            if [ "$crate_dir" = "crates/pierre-server" ]; then
              continue
            fi
            pkg="$(sed -n 's/^name = "\(.*\)"/\1/p' "$crate_dir/Cargo.toml" | head -1)"
            if [ -z "$pkg" ]; then
              echo "::error::Could not read the package name from $crate_dir/Cargo.toml"
              exit 1
            fi
            PKG_FLAGS+=("-p" "$pkg")
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Leaf-crate lane selected no packages — refusing to report green."
            exit 1
          fi
          echo "=== $COUNT leaf crates with tests/ directories ==="
          printf '%s\n' "${PKG_FLAGS[@]}" | paste -d' ' - - | sed 's/^-p /  /'
          # --all-features, not defaults: a leaf crate built standalone loses
          # the features pierre-server forwards to it (workspace unification),
          # and a test importing a gated module then fails to compile — the
          # first run of this lane caught exactly that on
          # pierre-tool-runtime/tests/sport_type_filter_test.rs, whose
          # fitness_support import is behind tools-data/tools-analytics.
          cargo test "${PKG_FLAGS[@]}" --all-features --tests -- --test-threads=4
        timeout-minutes: 45
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"

  # The pierre-server test files THIS push added or edited, run immediately.
  # The full server suite (~500 files) runs per-push on main and feature/*
  # (ci-postgres) and in coverage; a fix/debug/claude/copilot push runs only
  # the PG smoke besides this job, and even on main a file broken at birth
  # used to be reported an hour later. This job closes the
  # landed-already-red class (ffbd9889b: a reconnect test red from the moment
  # it landed, every lane green): whatever server test files the push touches
  # run here, on SQLite, within minutes. A push touching none skips free.
  # It cannot catch the OTHER class from 2026-08-30 — two individually green
  # commits whose combination no run ever saw — that one is caught by
  # validating against current main at land time, not by any per-push job.
  changed-server-tests:
    name: Changed Server Tests (this push's files)
    timeout-minutes: 60  # the 45-min test step plus build; the step bound cannot catch a hang before it
    runs-on: ubuntu-latest
    needs: fast-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Detect changed test files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null 2>&1; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi
          if [ -z "$BEFORE" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No base to diff against; nothing to run."
            exit 0
          fi
          FILES="$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'crates/pierre-server/tests/*.rs'             | grep -E '^crates/pierre-server/tests/[^/]+\.rs$'             | grep -v '/common\.rs$' || true)"
          echo "Changed server test files:"
          printf '  %s\n' $FILES
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust environment
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'

      - name: Setup Node.js (for SDK E2E tests runtime)
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Bun (for SDK build)
        if: steps.changed.outputs.files != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        if: steps.changed.outputs.files != ''
        working-directory: sdk
        # --ignore-scripts: sdk/package.json's `prepare` runs this same build
        # as the last phase of `bun install`, so without it the SDK builds
        # twice per job (carnet#161). Full rationale in cross-platform.yml.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Run this push's test files
        if: steps.changed.outputs.files != ''
        run: |
          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            target="$(basename "$f" .rs)"
            echo "::group::$target"
            if ! cargo test --test "$target" -- --test-threads=4; then
              echo "::error::Changed test file $target failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"
          exit $FAILED
        timeout-minutes: 45
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          PIERRE_SCIOTTE_MAX_CONCURRENT: "2"
          PIERRE_SCIOTTE_MAX_QUEUE: "8"
          PIERRE_SCIOTTE_ACQUIRE_TIMEOUT_SECS: "10"
          PIERRE_SCIOTTE_PERMIT_MAX_LIFETIME_SECS: "300"
          PIERRE_SCIOTTE_WATCHDOG_INTERVAL_SECS: "15"
          PIERRE_SCIOTTE_RETRY_AFTER_HINT_SECS: "5"
          PIERRE_SCIOTTE_CLOSED_RETRY_AFTER_SECS: "60"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

  # ============================================================================
  # PHASE 2: Release binary — gates on clippy, uploads artifact for other workflows
  # ============================================================================

  release-binary:
    name: Release Binary Validation
    timeout-minutes: 90  # a full release build plus the size check
    runs-on: ubuntu-latest
    needs: [clippy, detect-changes]
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.release-worthy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: release
          free-disk-space: 'true'

      - name: Build release binary
        run: cargo build --release --verbose
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C opt-level=3"

      - name: Verify release binary exists
        run: |
          if [ -f "target/release/pierre-mcp-server" ]; then
            echo "Release binary built successfully"
            ls -lh target/release/pierre-mcp-server
          else
            echo "Release binary not found"
            exit 1
          fi

      - name: Check release binary size
        run: |
          BINARY_SIZE_BYTES=$(ls -l target/release/pierre-mcp-server | awk '{print $5}')
          BINARY_SIZE_MB=$((BINARY_SIZE_BYTES / 1024 / 1024))
          # 80 until 2026-09-03, when main had been reporting exactly 80MB for
          # four consecutive green runs. The gate fails above the ceiling, so
          # main was passing with zero headroom and the next change of any size
          # was going to fail it — the in-app backfill delivery that did was
          # ~300 lines and two locale strings, which is not what a binary-size
          # gate is meant to catch. Raised rather than paid for by cutting the
          # feature: shrinking working architecture to fit a number that no
          # longer reflects the binary is the wrong trade. The band below still
          # gives ~4MB of warning before the next hard stop.
          MAX_SIZE_MB=90
          # Warn band at 95% of the ceiling. A bare pass/fail cliff gives no
          # signal until the build is already broken, and one fat dependency
          # can still cross the gap in a single change.
          WARN_SIZE_MB=$(( MAX_SIZE_MB * 95 / 100 ))

          echo "Binary size: ${BINARY_SIZE_MB}MB"

          if [ "$BINARY_SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "::error::Binary size (${BINARY_SIZE_MB}MB) exceeds limit (${MAX_SIZE_MB}MB)"
            exit 1
          fi

          if [ "$BINARY_SIZE_MB" -ge "$WARN_SIZE_MB" ]; then
            echo "::warning::Binary size ${BINARY_SIZE_MB}MB is within 5% of the ${MAX_SIZE_MB}MB ceiling. Check what this change pulled in (cargo tree, feature flags) before it becomes a hard failure for whoever pushes next."
          fi

          echo "Binary size (${BINARY_SIZE_MB}MB) within limit (<${MAX_SIZE_MB}MB)"

      - name: Basic smoke test of release binary
        run: |
          timeout 5 target/release/pierre-mcp-server --version || true
          echo "Release binary executed successfully"
