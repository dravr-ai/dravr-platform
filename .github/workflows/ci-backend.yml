# ABOUTME: Main backend CI pipeline — the fast gate (fmt + architecture) on every push; per-crate clippy, full clippy, audit and the dev-profile tests on every push that touches a Rust input.
# ABOUTME: SQLite shards (backend-tests) run on the cron or a dispatch that asks for them; per-push DB coverage is ci-postgres.yml and per-push leaf-crate tests run here (leaf-crate-tests).
name: "CI: Backend (Rust)"

on:
  workflow_dispatch:
    inputs:
      # The bump gates dispatch this workflow with no inputs, so they never
      # pay for the SQLite shards (carnet#1114); a person can still ask.
      sqlite-shards:
        description: Also run the SQLite shards (the daily cron runs them)
        type: boolean
        default: false
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      # The PostgreSQL mirror triggers ci-postgres.yml, which does not run the
      # architectural gates — so without this a push editing only migrations_pg/
      # never reaches check-migration-immutability.sh, on the very backend the
      # long-lived dev DB uses.
      - 'migrations_pg/**'
      # The Merge-Risk gate's one-way infra surfaces (check-merge-risk.sh): an
      # infra-only push touching them would otherwise never reach the fast gate.
      - 'infra/modules/secrets/**'
      - 'infra/modules/kms/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      # The rest of the `rust` filter in .github/actions/ci-backend-changes,
      # which a push must reach before the filter can judge it.
      # check-rust-inputs.py fails when the two lists drift apart.
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'clippy.toml'
      - 'sdk/**'
      - 'commands/**'
      - 'infra/environments/dev/*.tf'
      # check-keep-warm-traffic.sh and check-cpu-idle-adr.sh scan every infra
      # .tf file (prod, modules): an infra-only push there must reach the fast
      # gate too.
      - 'infra/**/*.tf'
      - '.github/actions/ci-backend-changes/**'
      - 'scripts/ci/**'
      # check-gh-cli.sh runs at every session start and is in the shellcheck job below.
      - 'scripts/setup/**'
      # sciotte-local.test.sh and the shellcheck job below read the harness itself.
      - 'scripts/sciotte-local.sh'
      # The fast gate now also reads the clients and the shared packages: the
      # surface gates fail on a reply block only one client renders and on a
      # generated capability catalogue left behind.
      - 'frontend/src/**'
      - 'frontend-mobile/src/**'
      # The phone's stylesheet and the token block it imports sit at its root.
      - 'frontend-mobile/*.css'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
      # satellite-bump-gate.test.sh runs the gate step lifted out of this file.
      - '.github/workflows/satellite-bump.yml'
      # deploy-satellite-cloud-run.test.sh runs its steps and checks every
      # bump lane that calls it against its declared inputs.
      - '.github/workflows/deploy-satellite-cloud-run.yml'
      - '.github/workflows/bump-*.yml'
      # wait-cloud-run-service-ready.test.sh checks every job that rolls a dev
      # Cloud Run revision waits for quiescence first (carnet#696), and
      # tag-deployed-digest.test.sh runs the deployed- tag steps lifted out of
      # this file and deploy-satellite-cloud-run.yml (carnet#137).
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/deploy-gcp.yml'
      - '.github/workflows/terraform.yml'
      # terraform-drift.test.sh checks the drift monitor plans every root a
      # workflow can apply (terraform.yml above, terraform-artifacts.yml), as
      # that root's plan identity, and runs its plan/classify/Slack steps.
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/terraform-artifacts.yml'
      # tag-deployed-digest.test.sh fails when a tag the deploy tails write falls
      # outside the release_tag_prefixes these declare. No CI job runs the
      # infra/artifacts tftest, so this is the only CI check on that list.
      - 'infra/artifacts/terraform.tfvars'
      - 'infra/artifacts/variables.tf'
      # monitor-scheduled-lanes.test.sh runs the monitor's own python and script.
      - '.github/workflows/monitor-scheduled-lanes.yml'
      # ci-verdict.test.sh fails when this workflow's trigger list misses a
      # workflow a branch push can fire.
      - '.github/workflows/ci-verdict.yml'
      # standing-issue.test.sh checks every monitor that files a standing issue
      # looks it up through scripts/ci/standing-issue.cjs and checks it out.
      - '.github/workflows/billing-drivers-monitor.yml'
      - '.github/workflows/claude-health-probe.yml'
      - '.github/workflows/copilot-cli-version-check.yml'
      - '.github/workflows/copilot-health-probe.yml'
      - '.github/workflows/dependency-check.yml'
      - '.github/workflows/monitor-capture-staleness.yml'
      - '.github/actions/rust-setup/**'
      - '.github/actions/server-binaries/**'
      # check-server-features.sh compares the builder stage's --features with the
      # action above and the production clippy entry (carnet#928). The image
      # inputs are here too because publish-images.yml deploys only on this
      # workflow's green main run (carnet#1116): without them a change to an
      # image, the frontend build or the Trivy ignore list never reaches dev.
      - 'docker/images/server/**'
      - 'docker/images/frontend/**'
      - '.github/actions/frontend-dist/**'
      - '.trivyignore'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      # The PostgreSQL mirror triggers ci-postgres.yml, which does not run the
      # architectural gates — so without this a push editing only migrations_pg/
      # never reaches check-migration-immutability.sh, on the very backend the
      # long-lived dev DB uses.
      - 'migrations_pg/**'
      # The Merge-Risk gate's one-way infra surfaces (check-merge-risk.sh).
      - 'infra/modules/secrets/**'
      - 'infra/modules/kms/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      # The rest of the `rust` filter (see the push paths above).
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'clippy.toml'
      - 'sdk/**'
      - 'commands/**'
      - 'infra/environments/dev/*.tf'
      # check-keep-warm-traffic.sh and check-cpu-idle-adr.sh scan every infra
      # .tf file (prod, modules): an infra-only push there must reach the fast
      # gate too.
      - 'infra/**/*.tf'
      - '.github/actions/ci-backend-changes/**'
      - 'scripts/ci/**'
      # check-gh-cli.sh runs at every session start and is in the shellcheck job below.
      - 'scripts/setup/**'
      # sciotte-local.test.sh and the shellcheck job below read the harness itself.
      - 'scripts/sciotte-local.sh'
      - 'frontend/src/**'
      - 'frontend-mobile/src/**'
      # The phone's stylesheet and the token block it imports sit at its root.
      - 'frontend-mobile/*.css'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
      # satellite-bump-gate.test.sh runs the gate step lifted out of this file.
      - '.github/workflows/satellite-bump.yml'
      # deploy-satellite-cloud-run.test.sh runs its steps and checks every
      # bump lane that calls it against its declared inputs.
      - '.github/workflows/deploy-satellite-cloud-run.yml'
      - '.github/workflows/bump-*.yml'
      # wait-cloud-run-service-ready.test.sh checks every job that rolls a dev
      # Cloud Run revision waits for quiescence first (carnet#696), and
      # tag-deployed-digest.test.sh runs the deployed- tag steps lifted out of
      # this file and deploy-satellite-cloud-run.yml (carnet#137).
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/deploy-gcp.yml'
      - '.github/workflows/terraform.yml'
      # terraform-drift.test.sh checks the drift monitor plans every root a
      # workflow can apply (terraform.yml above, terraform-artifacts.yml), as
      # that root's plan identity, and runs its plan/classify/Slack steps.
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/terraform-artifacts.yml'
      # tag-deployed-digest.test.sh fails when a tag the deploy tails write falls
      # outside the release_tag_prefixes these declare. No CI job runs the
      # infra/artifacts tftest, so this is the only CI check on that list.
      - 'infra/artifacts/terraform.tfvars'
      - 'infra/artifacts/variables.tf'
      # monitor-scheduled-lanes.test.sh runs the monitor's own python and script.
      - '.github/workflows/monitor-scheduled-lanes.yml'
      # standing-issue.test.sh checks every monitor that files a standing issue
      # looks it up through scripts/ci/standing-issue.cjs and checks it out.
      - '.github/workflows/billing-drivers-monitor.yml'
      - '.github/workflows/claude-health-probe.yml'
      - '.github/workflows/copilot-cli-version-check.yml'
      - '.github/workflows/copilot-health-probe.yml'
      - '.github/workflows/dependency-check.yml'
      - '.github/workflows/monitor-capture-staleness.yml'
      - '.github/actions/rust-setup/**'
      - '.github/actions/server-binaries/**'
      # check-server-features.sh compares the builder stage's --features with the
      # action above and the production clippy entry (carnet#928). The image
      # inputs are here too because publish-images.yml deploys only on this
      # workflow's green main run (carnet#1116): without them a change to an
      # image, the frontend build or the Trivy ignore list never reaches dev.
      - 'docker/images/server/**'
      - 'docker/images/frontend/**'
      - '.github/actions/frontend-dist/**'
      - '.trivyignore'
  schedule:
    # Daily at 08:11 UTC (04:11 EDT / 03:11 EST) — runs the SQLite shard job.
    - cron: '11 8 * * *'

concurrency:
  # On main the sha is part of the group, so every commit gets its own group and
  # nothing can cancel anyone's verdict. Branches share a group per ref and keep
  # cancelling, where fast feedback beats a stale result.
  #
  # The ref test lives in `group` rather than in `cancel-in-progress` because
  # only the former is known to work here: `cancel-in-progress: ${{ github.ref
  # != 'refs/heads/main' }}` was tried first and did not hold — run 33026440559
  # on main was cancelled one second after the next run was created, and that
  # run's run_started_at equalled its created_at, so it never waited on the
  # group the way a false would have made it. `group` expressions demonstrably
  # do evaluate: that is what has been scoping cancellation per ref all along.
  # The event name is part of the group too: a `schedule` run on main carries
  # the tip's sha, so without it the cron joined the tip's push-run group and
  # cancelled that verdict mid-flight (observed 2026-08-31: the 15:59 UTC cron
  # killed 7eac7b067's push run six minutes in). Push, schedule and dispatch
  # now each get their own group; the per-commit protection is unchanged.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # ============================================================================
  # PHASE 0 (parallel, no inter-dependencies):
  #   fast-gate            — fmt + architectural + secret patterns (~30s, no compile)
  #   preflight-clippy     — per-crate clippy on changed leaf crates (~3-5 min)
  #   clippy               — full-workspace clippy (~10-12 min)
  #   security-audit       — cargo deny + dravr-* duplicate check (~3 min)
  #   dev-tests            — one dev-profile compile for the doctests + telemetry-feature tests,
  #                          the 4 platform<->contremaitre coupling tests and the pierre-server
  #                          test files THIS push touched (~10-12 min)
  #   feature-profiles     — the 2-profile server feature matrix: production clippy + no-default-features check (~5 min)
  #   backend-test-binaries, backend-tests
  #                        — SQLite shards, cron (or a dispatch asking for them): one build, four shards running its binaries
  #   leaf-crate-tests     — the tests/ dirs and unit tests of every non-pierre-server crate a push reaches
  #                          (every one on main's anchor runs, schedule and dispatch), plus pierre-server's unit tests
  #   release-binary       — the fat-LTO server (~18 min); main, or a branch push that touches a
  #                          link input; main pushes upload the binaries the image ships
  #
  # Every compile and test job skips on a push no Rust input touches (`rust` in
  # .github/actions/ci-backend-changes); fast-gate always runs, since its
  # surface gates read the clients. preflight-clippy keys on crates/ itself.
  #
  # Every job below carries a `timeout-minutes`, sized to its observed duration
  # with headroom. GitHub's default is 360 minutes, and a step-level bound cannot
  # catch a hang in `Setup Rust environment` — the composite action this file
  # shares with ci-postgres.yml, where shard 3/4 hung 212 minutes in that very
  # step on 2026-08-19. A job bound catches a hang wherever it happens, and it
  # has to live at job level: composite actions cannot bound their own steps.
  # ============================================================================

  detect-changes:
    name: Detect Changes
    timeout-minutes: 5  # path filtering only; no toolchain, no compile
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      proven: ${{ steps.changes.outputs.proven }}
      release-worthy: ${{ steps.changes.outputs.release-worthy }}
      scope-mode: ${{ steps.scope.outputs.mode }}
      scope-tested: ${{ steps.scope.outputs.tested }}
      scope-linked: ${{ steps.scope.outputs.linked }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The whole history without file contents: the scope step below
          # finds main's fork point or a green ancestor and diffs trees, which
          # needs commits and trees only.
          fetch-depth: 0
          filter: blob:none

      # The filters live in the action, which clippy runs too; a schedule or
      # dispatch run counts as everything changed.
      - name: Detect file changes
        id: changes
        uses: ./.github/actions/ci-backend-changes

      # Which crates leaf-crate-tests runs (carnet#1282). A branch push tests
      # the crates its diff from main's fork point reaches and every crate
      # depending on them; a main push, those its diff from the newest
      # ancestor whose leaf-crate job passed reaches (scripts/ci/scope-base.sh).
      # A schedule or dispatch run, a lookup that fails, a CI definition or a
      # workspace-wide input tests every crate (scripts/ci/affected-crates.py).
      - name: Choose the crates this push can change
        id: scope
        if: steps.changes.outputs.rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          code=0
          base="$(./scripts/ci/scope-base.sh ci-backend.yml 'Leaf-Crate Tests (every crate but pierre-server)')" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Scope base lookup failed::scope-base.sh exited ${code}; testing every crate"
            base=""
          fi
          # Gated on its own exit status, never piped into tee: a crash must
          # read as "every crate", not as an empty scope.
          full="$(printf 'mode=full\nlinked=\ntested=')"
          scope="$full"
          if [ -n "$base" ] && ! scope="$(./scripts/ci/affected-crates.py scope --base "$base")"; then
            echo "::warning title=Scope unknown::affected-crates.py failed; testing every crate"
            scope="$full"
          fi
          printf '%s\n' "$scope" | tee -a "$GITHUB_OUTPUT"

  fast-gate:
    name: Fast Gate (fmt + architecture + secrets + surfaces)
    timeout-minutes: 15  # ~30s of compile-free gates plus rustfmt and an apt install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # .build vendors llm-registre (nested submodule), whose gates
          # architectural-validation.sh hard-requires — so: recursive.
          submodules: recursive
          # The phantom-surface and turn-envelope gates diff against the base
          # of the push; a depth-1 checkout has nothing to diff against.
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust (rustfmt only, no compilation needed)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The diff-scoped gates judge a push against its base. A pull request
      # names it and a push to an existing branch names its before-sha, but a
      # branch's FIRST push has an all-zero before-sha; the gates then fell back
      # to HEAD~1 and judged only the newest commit, or failed outright when
      # that one parent held a state the tip had already fixed. A new branch's
      # base is where it forked from main. scripts/ci/resolve-push-base.sh
      # holds the rule (`before` mode); no base at all fails this step.
      - name: Resolve the gate base
        id: gate_base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          base="$(./scripts/ci/resolve-push-base.sh before)"
          echo "Gate base: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Architectural Validation (Custom Patterns + Security Skills)
        env:
          # The diff-scoped gates this script nests (file-size ratchet, migration
          # idempotency) are invoked with no argument, so they read their base
          # from here. It has to be the push's own before-sha: actions/checkout
          # force-creates refs/heads/main from refs/remotes/origin/main, leaving
          # origin/main == HEAD, and a gate diffing against that inspects nothing.
          GATE_BASE_REF: ${{ steps.gate_base.outputs.sha }}
        run: ./scripts/ci/architectural-validation.sh --apply-skills

      # The fleet-wide text scans and this repo's validation-patterns.local.toml
      # (no #[cfg(test)] in src/). Until this step nothing ran them here, and
      # 33 inline test modules piled up under a rule nobody enforced.
      - name: Shared dravr Validation
        run: ./.build/validation/validate.sh

      - name: Secret Pattern Validation
        run: ./scripts/ci/validate-no-secrets.sh

      # Compile-free, like everything else in this job. Both gates read source
      # with grep and awk; neither needs a toolchain or a running server.
      - name: Phantom Surface Detection
        run: ./scripts/ci/check-phantom-surfaces.sh "${{ steps.gate_base.outputs.sha }}"

      - name: Turn Envelope Convergence
        run: ./scripts/ci/check-turn-envelope.sh "${{ steps.gate_base.outputs.sha }}"

      # The hosted pages embed one stylesheet generated from the Boreal tokens
      # and committed, because the crates cannot run the generator; the web and
      # mobile stylesheets import token blocks generated the same way.
      # Regenerating them needs bun and no install (the generators import only
      # the tokens), so it stays compile-free like the rest of this job. The
      # pre-push Tier 1l runs the same script, but a worktree without
      # core.hooksPath skips it.
      - name: Setup Bun (generated stylesheets)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Boreal Generated Stylesheets
        run: ./scripts/ci/check-hosted-css.sh

      # carnet#1207: the scraping backend's name must never reach an athlete or
      # coach. Fails when a translation value or a served hosted-page template
      # names it (provider ids, i18n keys and the /api/providers/<id>/ routes
      # are identifiers and stay). Python and grep only, like the rest of this
      # job. The pre-push Tier 1b-name runs the same script, but a worktree
      # without core.hooksPath skips it.
      - name: Backend Name Exposure
        run: ./scripts/ci/check-backend-name-exposure.sh

      # pierre-database implements each repository trait twice, once per backend,
      # and every local gate runs SQLite — so an edit that lands on one side and
      # not the other is first seen here. Fails a newly duplicated pair; reports
      # the pairs still awaiting conversion (carnet#436) without failing on them.
      - name: Backend Pair Duplication
        run: ./scripts/ci/check-backend-pairs.sh "${{ steps.gate_base.outputs.sha }}"

      # A revert undoes most changes, but not an applied migration, a destroyed
      # secret or a delivered notification (carnet#663). A push whose diff
      # touches one of those surfaces needs `Merge-Risk: ONE-WAY · <why>` on a
      # commit in the range. The pre-push Tier 1o runs the same script, but a
      # worktree without core.hooksPath skips it.
      # Push and PR events only. A commit message belongs to the push that
      # carried it, and only those events name that range. A schedule or
      # dispatch run's base collapses to HEAD and would judge the tip's message
      # alone: a burst push whose ONE-WAY line sits on an earlier commit passes
      # here, then the next cron would fail it, and since every heavy job needs
      # fast-gate, main would go red and skip the SQLite suite over no defect.
      # The script itself also judges nothing when its base names no range.
      # The range is the one Tier 1o judges before the push:
      # merge-base(origin/main, HEAD)..HEAD. A pull request's base and a push to
      # main's before-sha name it already. A branch push's before-sha does not:
      # it covers that push alone, while Tier 1o covers every commit since the
      # branch forked, because a branch declares ONE-WAY once and its squash
      # restates it. Judged from its before-sha, a second push re-touching a
      # migration the first push declared passed before the push and failed
      # here, skipping every heavy job. So a branch push is judged from its
      # fork point: scripts/ci/resolve-push-base.sh in `fork` mode. A fork
      # point beyond its 200-commit reach (the resolver's exit 1) judges
      # nothing, as a base the checkout lacks does; the squash that lands the
      # branch is judged then. Any other resolver failure is a crash and fails.
      # check-merge-risk.test.sh lifts this run block and drives it.
      - name: Merge-Risk one-way doors
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          code=0
          base="$(./scripts/ci/resolve-push-base.sh fork)" || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning::merge-risk: no fork point from main within 200 commits of HEAD, so this branch push is not judged; the squash that lands it on main is."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::merge-risk: resolve-push-base.sh failed (exit $code), so nothing was judged"
            exit "$code"
          fi
          if [ "$EVENT_NAME" = push ] && [ "$PUSHED_REF" != refs/heads/main ]; then
            echo "Merge-Risk base: $base, where this branch forked from main"
          fi
          ./scripts/ci/check-merge-risk.sh "$base"

      # Both fixture tests build throwaway repos and assert their gate FAILS on
      # a violation. They existed and ran nowhere, which is the failure mode
      # their own headers warn about: "An unverified gate is worse than no gate:
      # it reports ✅ forever and everyone believes the budget is enforced."
      # Compile-free like the rest of this job. The dev-process and tunnel
      # suites spawn real processes and wait on them, so the block runs in tens
      # of seconds rather than the couple the source-reading gates take alone.
      # The fixture repos turn off git's auto maintenance: a commit can leave a
      # detached `maintenance run --auto` writing into .git/objects while the
      # test's `rm -rf` deletes the repo. Run 38208374304 failed that way, with
      # every assertion green: "rm: cannot remove '.../.git/objects': Directory
      # not empty". Only a process writing into the repo mid-delete does that.
      - name: Gate self-tests (file sizes, advisory reviews, migration versions, migration immutability, moved symbols, inline paths, phantom surface routes, contremaitre tool list, backend pairs, dev process scope, tunnel env, tier selection, contremaitre fallback sync, deploy ancestry, deploy recovery, lockfile duplicates, satellite pins, satellite gate, satellite Cloud Run tail, dev Cloud Run rollout serialisation, deployed digest tags, frontend asset carry-forward, terraform drift coverage, mobile e2e batch, cron lane monitor, standing issues, sciotte local harness, first-party sign-in smoke, workflow test targets, generated stylesheets, backend name exposure, email log redaction, merge risk, shared test-module filter, production src scan, server feature parity, carnet footer sweep, server test scoping, prebuilt test binaries, bench A/B, commit verdict, push base resolution, server build key, proven-on-branch job proof, crate scope, scope base, rust-input filter coverage, cache budget report, CI time report, reversible setup edits)
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: gc.auto
          GIT_CONFIG_VALUE_1: "0"
        run: |
          ./scripts/ci/check-file-sizes.test.sh
          ./scripts/ci/check-advisory-reviews.test.sh
          ./scripts/ci/check-migration-versions.test.sh
          ./scripts/ci/check-migration-immutability.test.sh
          ./scripts/ci/check-moved-symbols.test.sh
          ./scripts/ci/check-inline-paths.test.sh
          ./scripts/ci/check-phantom-surfaces.test.sh
          ./scripts/ci/check-contremaitre-sync.test.sh
          ./scripts/ci/check-backend-pairs.test.sh
          ./scripts/ci/dev-process-scope.test.sh
          ./scripts/ci/tunnel-env-lib.test.sh
          ./scripts/ci/pre-push-validate.test.sh
          ./scripts/ci/server-suites.test.sh
          ./scripts/ci/test-binaries.test.sh
          ./scripts/ci/bench-ab.test.sh
          ./scripts/ci/ci-verdict.test.sh
          ./scripts/ci/sync-contremaitre-fallback.test.sh
          ./scripts/ci/check-deploy-ancestry.test.sh
          ./scripts/ci/pick-newest-green.test.sh
          ./scripts/ci/check-lockfile-duplicates.test.sh
          ./scripts/ci/satellite-pin.test.sh
          ./scripts/ci/satellite-bump-gate.test.sh
          ./scripts/ci/deploy-satellite-cloud-run.test.sh
          ./scripts/ci/wait-cloud-run-service-ready.test.sh
          ./scripts/ci/cloud-run-canary.test.sh
          ./scripts/ci/tag-deployed-digest.test.sh
          ./scripts/ci/carry-forward-frontend-assets.test.sh
          ./scripts/ci/terraform-drift.test.sh
