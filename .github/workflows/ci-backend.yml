          ./scripts/ci/monitor-scheduled-lanes.test.sh
          ./scripts/ci/standing-issue.test.sh
          ./scripts/ci/sciotte-local.test.sh
          ./scripts/ci/first-party-sign-in-smoke.test.sh
          ./scripts/ci/check-keep-warm-traffic.test.sh
          ./scripts/ci/resolve-push-base.test.sh
          ./scripts/ci/server-build-key.test.sh
          ./scripts/ci/proven-on-branch.test.sh
          ./scripts/ci/affected-crates.test.sh
          ./scripts/ci/scope-base.test.sh
          ./scripts/setup/config-edit.test.sh
          ./scripts/ci/check-workflow-test-targets.test.sh
          ./scripts/ci/check-hosted-css.test.sh
          ./scripts/ci/check-backend-name-exposure.test.sh
          ./scripts/ci/check-log-email-redaction.test.sh
          ./scripts/ci/check-secret-fields.test.sh
          ./scripts/ci/check-merge-risk.test.sh
          ./scripts/ci/sweep-landed-branches.test.sh
          ./scripts/ci/strip-carnet-footer.test.sh
          bash .build/validation/test-test-module-lines.sh
          ./scripts/ci/prod-src-scan.test.sh
          ./scripts/ci/check-server-features.test.sh
          ./scripts/ci/check-server-features.sh
          ./scripts/ci/check-satellite-drift.sh --offline
          ./scripts/ci/check-rust-inputs.test.sh
          ./scripts/ci/cache-budget.test.sh
          ./scripts/ci/ci-time-report.test.sh

      # A `cargo test --test <name>` in a workflow whose target a push moved or
      # deleted fails cargo's whole command, and for a cron lane nobody sees it
      # until the next morning (carnet#474: six red nights of llm-live-cron).
      # The pre-push Tier 1m runs the same script, but a worktree without
      # core.hooksPath skips it; this is the backstop on every crates/ push.
      - name: Workflow test targets
        run: ./scripts/ci/check-workflow-test-targets.sh

      # The compile and test jobs below skip a push that touches no Rust input
      # (.github/actions/ci-backend-changes). A file Rust reads from outside
      # crates/ that the list misses would make that skip a false green for
      # the very test reading it, so the list is held to what the code reads.
      - name: Rust-input filter coverage
        run: ./scripts/ci/check-rust-inputs.py

      # A dependency no target of its crate names, or a normal one only tests
      # use, is the phantom dependency the coding standards forbid. cargo-shear
      # parses source without compiling, so it stays in this job; it reads
      # `cargo metadata`, which fetches the git dependencies through the
      # private-deps config above. The version is the one check-unused-deps.sh
      # pins, and its self-test fails when the two differ.
      - name: Install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.14.0

      - name: Unused dependencies (cargo-shear)
        run: |
          ./scripts/ci/check-unused-deps.test.sh
          ./scripts/ci/check-unused-deps.sh

      # The dev scripts decide which processes a stop may kill and which files a
      # tunnel may rewrite, so a quoting or word-splitting slip there reaches a
      # peer checkout's running stack or a gitignored secrets file. shellcheck
      # reads them without executing anything, so it belongs in this job.
      # shellcheck ships on the ubuntu runner image, so this stays a local read
      # with no network step on the fastest gating job.
      - name: Shell lint (dev stack scripts)
        run: shellcheck -S warning bin/*.sh scripts/ci/*.test.sh scripts/ci/mobile-e2e-batch.sh scripts/ci/wait-cloud-run-service-ready.sh scripts/ci/tag-deployed-digest.sh scripts/ci/carry-forward-frontend-assets.sh scripts/ci/sweep-landed-branches.sh scripts/ci/strip-carnet-footer.sh scripts/ci/resolve-push-base.sh scripts/ci/server-build-key.sh scripts/ci/proven-on-branch.sh scripts/ci/scope-base.sh scripts/ci/first-party-sign-in-smoke.sh scripts/ci/check-keep-warm-traffic.sh scripts/setup/setup-claude-code-mcp.sh scripts/setup/config-edit.sh scripts/setup/config-edit.test.sh scripts/setup/check-gh-cli.sh scripts/sciotte-local.sh

  preflight-clippy:
    name: Preflight Clippy (per-crate, fast feedback)
    # ~3-5 min for a typical push. A branch that touches most of the workspace
    # lints ~40 crates one at a time (~1.5 min each); 25 min cut one off after
    # 27 and hid a compile error full-workspace clippy cannot see.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    # No `needs` — fires immediately in parallel with fast-gate / clippy.
    # Per-crate clippy on the leaf crates this push changed (pre-push-validate.sh
    # leaves per-crate clippy to CI), skipping pierre-server (whose
    # per-crate clippy is as slow as the full-workspace run and is handled by the
    # `clippy` job). Designed to fail in 3–5 min on the most common error class.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # A pull request lints against its base and a push everything since the
      # branch forked from main (scripts/ci/resolve-push-base.sh `fork` mode;
      # on main, the push's before-sha), the range pre-push-validate.sh
      # resolves locally as merge-base(origin/main, HEAD). A schedule or
      # dispatch run, or a base the runner cannot resolve, lints the tip commit
      # (HEAD~1); the full `clippy` job lints everything either way.
      - name: Detect changed leaf crates
        id: detect
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          BASE=""
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = pull_request ]; then
              BASE="$(./scripts/ci/resolve-push-base.sh fork)" || BASE=""
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "::warning::preflight-clippy: no usable base for this ${EVENT_NAME} run; linting the tip commit only (HEAD~1). The full clippy job still lints everything."
              BASE="HEAD~1"
          fi
          echo "Preflight base: $BASE"
          CRATES=$(git diff --name-only "$BASE" HEAD 2>/dev/null \
              | grep '^crates/' \
              | sed 's|^crates/||; s|/.*||' \
              | sort -u \
              | grep -v '^pierre-server$' \
              || true)
          # pierre-server is excluded above because its per-crate clippy is as
          # slow as the full-workspace run. That left crates/pierre-server/tests/
          # linted by NOTHING until the full job reported ~12 min after the push:
          # on 2026-08-26 a doc comment in a test file reddened main that way,
          # and the same gap covers every integration test in the repo. A single
          # changed test binary is cheap to lint on its own, so name the targets.
          # A suite under tests/it/ is a module of the `it` binary, and so is
          # every shared helper, which a per-file binary never linted on its own.
          # --edited-only: this is the LINT scope, the targets whose test source
          # the diff edited. A src change reaches every target's outcome (the run
          # scope, which ci-postgres.yml acts on), but its lints are the crate's
          # own, and the full-workspace clippy job lints every test target anyway.
          TEST_TARGETS=$(git diff --name-only "$BASE" HEAD 2>/dev/null \
              | scripts/ci/server-suites.sh changed-targets --edited-only)
          if [ -n "$TEST_TARGETS" ]; then
              echo "Changed pierre-server test targets:"
              echo "$TEST_TARGETS"
              {
                  echo "test_targets<<TARGETS_EOF"
                  echo "$TEST_TARGETS"
                  echo "TARGETS_EOF"
              } >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CRATES" ] && [ -z "$TEST_TARGETS" ]; then
              echo "No leaf-crate or test-target changes — preflight clippy will skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "Leaf crates changed:"
              echo "$CRATES"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              {
                  echo "crates<<CRATES_EOF"
                  echo "$CRATES"
                  echo "CRATES_EOF"
              } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust environment
        if: steps.detect.outputs.skip != 'true'
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          # The full-workspace clippy job's cache, restored; that job saves it.
          shared-key: clippy
          cache-save: 'false'

      - name: Per-crate clippy
        if: steps.detect.outputs.skip != 'true'
        # build.warnings, not `-- -D warnings`: a warning stays a warning, so the
        # crate still produces its rmeta and the run fails once at the end.
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          # Folder name == package name for every workspace crate except pierre-server,
          # which is excluded above. Pass the folder name straight to `-p`.
          FAILED=0
          while IFS= read -r crate; do
              [ -z "$crate" ] && continue
              if [ ! -d "crates/$crate" ]; then
                  echo "crate $crate no longer exists in this tree; skipping"
                  continue
              fi
              echo "::group::cargo clippy -p $crate --all-targets --all-features"
              if ! cargo clippy -p "$crate" --all-targets --all-features; then
                  echo "::error::clippy failed for $crate"
                  FAILED=1
              fi
              echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.crates }}"

          # Changed integration-test binaries, one target at a time. `--test X`
          # builds the library plus that one binary, which is what makes this
          # affordable here.
          while IFS= read -r target; do
              [ -z "$target" ] && continue
              # A target derived from the diff may have been DELETED by the
              # diff; cargo errors on a nonexistent test target, so skip it.
              if [ ! -f "crates/pierre-server/tests/$target.rs" ] && [ ! -f "crates/pierre-server/tests/$target/main.rs" ]; then
                  echo "test target $target no longer exists in this tree; skipping"
                  continue
              fi
              echo "::group::cargo clippy -p pierre_mcp_server --test $target"
              if ! cargo clippy -p pierre_mcp_server --test "$target" --all-features; then
                  echo "::error::clippy failed for test target $target"
                  FAILED=1
              fi
              echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.test_targets }}"
          exit "$FAILED"

  clippy:
    name: Clippy Linting (full workspace)
    timeout-minutes: 45  # full-workspace clippy, ~10-12 min
    runs-on: ubuntu-latest
    # No `needs` — fires immediately in parallel with fast-gate / preflight-clippy
    # and release-binary. A red clippy still keeps its binaries from shipping:
    # publish-images takes server-binaries-<sha> only from a Backend run that
    # concluded success.
    #
    # It reads the same filters as detect-changes from inside the job rather
    # than through `needs: detect-changes`, which would put it back in the
    # runner queue after detect-changes: on a saturated pool that second wait
    # is minutes (p90 22 min on Oct 7-20), on the job that leads the critical
    # path. A push no Rust input touches checks out, decides, and stops.
    #
    # On main its steps also stop when a full-lane branch run linted this
    # exact tree (proven in .github/actions/ci-backend-changes, carnet#1258).
    # The proof is the lint STEP's success, not the job's: a branch push no
    # Rust input touched concludes this job green having linted nothing.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect file changes
        id: changes
        uses: ./.github/actions/ci-backend-changes

      - name: Configure git for private deps
        if: steps.changes.outputs.rust == 'true' && !contains(fromJSON(steps.changes.outputs.proven || '[]'), 'Clippy Linting (full workspace) -> Lint with Clippy (Zero Tolerance + Cognitive Complexity)')
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        if: steps.changes.outputs.rust == 'true' && !contains(fromJSON(steps.changes.outputs.proven || '[]'), 'Clippy Linting (full workspace) -> Lint with Clippy (Zero Tolerance + Cognitive Complexity)')
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          free-disk-space: 'true'
          # One clippy cache for this job and preflight-clippy; this job, on the
          # daily scheduled run, is the only one that saves it.
          shared-key: clippy

      # The wrapper runs `cargo clippy --keep-going --all-targets --all-features
      # --config build.warnings="deny"` unchanged — same diagnostics, same exit status — and adds
      # one thing: the crates the run could not reach.
      #
      # --keep-going carries cargo past a failing crate into everything that does
      # not depend on it. Without it a change touching several crates surfaces
      # its violations one ~15-minute run at a time. What it cannot do is lint a
      # crate whose dependency failed, because there is no rmeta to lint against,
      # and those crates emit no diagnostics at all — which reads exactly like
      # having none. On 2026-08-26 that reading cost three sessions an evening:
      # one error in pierre-services was all this job could see, four more sat
      # unevaluated in its dependents, and each round of fixing the visible one
      # reddened main again on errors that had been there the whole time.
      #
      # So the report distinguishes clean from unevaluated. scripts/ci/
      # clippy-workspace.test.sh builds a three-crate workspace and breaks one of
      # them to prove the report fires.
      # The instrument is verified on the same run that depends on it: three
      # throwaway crates, one deliberately broken, asserting that its dependent
      # is named and the crate beside it is not. ~5s.
      - name: Self-test the unevaluated-crate reporter
        if: steps.changes.outputs.rust == 'true' && !contains(fromJSON(steps.changes.outputs.proven || '[]'), 'Clippy Linting (full workspace) -> Lint with Clippy (Zero Tolerance + Cognitive Complexity)')
        run: ./scripts/ci/clippy-workspace.test.sh

      - name: Lint with Clippy (Zero Tolerance + Cognitive Complexity)
        if: steps.changes.outputs.rust == 'true' && !contains(fromJSON(steps.changes.outputs.proven || '[]'), 'Clippy Linting (full workspace) -> Lint with Clippy (Zero Tolerance + Cognitive Complexity)')
        run: python3 scripts/ci/clippy-workspace.py

  security-audit:
    name: Security Audit
    timeout-minutes: 20  # cargo-deny / advisory database, minutes
    runs-on: ubuntu-latest
    # The jobs that wait on fast-gate also wait on detect-changes, which
    # finishes long before fast-gate does, so the gate costs them no time. A
    # push no Rust input touches skips them (the list is in
    # .github/actions/ci-backend-changes); the daily cron still runs them all.
    needs: [fast-gate, detect-changes]
    # Not skipped on main on a branch's proof: cargo deny reads an advisory
    # database that moves daily, so a days-old branch pass does not vouch for
    # today (carnet#1258).
    if: needs.detect-changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Security Audit (via deny.toml)
        run: cargo deny check

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup

      - name: dravr-* duplicate check (hard fail)
        run: |
          # Hard-fails if any dravr-ecosystem crate resolves more than once. The
          # workspace [patch.crates-io] block + per-dep tag pins MUST converge
          # every consumer onto a single version per crate.
          #
          # Which crates count is defined once, in check-lockfile-duplicates.sh
          # (satellites.toml's declared crates, any `dravr-` name, any dravr-ai
          # git source) and read by every duplicate gate, so a bare-named
          # satellite such as photograveur is covered on the one that runs on
          # every push, not only in the bump lanes.
          #
          # `cargo tree` first, so Cargo.lock is the graph cargo resolves for this
          # checkout rather than whatever text was committed. Its exit status is
          # read on its own: GitHub's default shell is `bash -e` without pipefail,
          # and a cargo that failed to resolve must fail the step, not leave an
          # older lockfile for the script to pass.
          if ! tree_err="$(cargo tree --prefix none 2>&1 >/dev/null)"; then
            echo "::error::cargo tree failed — the graph did not resolve, so the duplicate gate could not run:"
            echo "$tree_err"
            exit 1
          fi
          ./scripts/ci/check-lockfile-duplicates.sh

  # The three dev-profile test jobs, merged into one that compiles once
  # (carnet#1115): the doctests, the platform<->contremaitre coupling suites
  # and this push's server test files. They share the profile, the features
  # and the restore-only test-dev cache, so as three jobs they compiled the
  # same tree three times and held three runners; merged they take about as
  # long as the slowest of them did, still under leaf-crate-tests, so the
  # critical path does not move. Each test step runs whenever setup worked,
  # so a red doctest still reports the coupling and changed-file verdicts.
  dev-tests:
    name: Dev Tests (doctests, coupling, this push's files)
    timeout-minutes: 60  # the 45-min changed-files step plus build; the step bound cannot catch a hang before it
    runs-on: ubuntu-latest
    needs: [fast-gate, detect-changes]
    # Not skipped on main on a branch's proof: on a branch it runs the test
    # files of that push alone, on main those of the whole squash, so the
    # branch run does not cover what main's would (carnet#1258).
    if: needs.detect-changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # The pierre-server test files THIS push added or edited, run at the end
      # of this job. The full server suite runs per-push on main, feature(s)/*
      # and claude/* (ci-postgres) and in coverage; a fix/debug/copilot push
      # runs only the PG smoke besides this, and even on main a file broken at
      # birth used to be reported an hour later. This closes the
      # landed-already-red class (ffbd9889b: a reconnect test red from the
      # moment it landed, every lane green): whatever server test files the
      # push touches run here, on SQLite, within minutes. It cannot catch the
      # OTHER class from 2026-08-30 — two individually green commits whose
      # combination no run ever saw — that one is caught by validating against
      # current main at land time, not by any per-push job.
      #
      # A push runs the test files it added or edited: resolve-push-base.sh in
      # `before` mode, where a branch's first push (all-zero before-sha) means
      # every test file the branch changed since it forked from main, and a
      # failed fork-point lookup fails the step. A pull request's synchronize
      # diffs from the event's before-sha; no usable base runs the tip
      # commit's files, as suites, on SQLite.
      #
      # A push that changes server code instead (a crate in pierre_mcp_server's
      # dependency closure, a migration, the lockfile) touches no test file, so
      # this runs nothing for it; ci-postgres.yml's lane step judges it with
      # `affected-crates.py scope` and runs the full suite for such a push on
      # every ref. The whole suite does not fit one runner's 45-minute
      # step bound — the PostgreSQL lane packs it into four ~703s shards.
      - name: Detect changed test files
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            code=0
            BEFORE="$(./scripts/ci/resolve-push-base.sh before)" || code=$?
            case "$code" in
              0) ;;
              1) BEFORE="" ;;
              *) echo "::error::resolve-push-base.sh failed (exit $code)"; exit "$code" ;;
            esac
          fi
          if [ -z "$BEFORE" ] || ! git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null 2>&1; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi
          if [ -z "$BEFORE" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No base to diff against; nothing to run."
            exit 0
          fi
          # Gate on git diff's exit status: piped into the greps, a failed diff
          # would read as a push that touched no test file.
          if ! DIFF="$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'crates/pierre-server/tests/*.rs' 'crates/pierre-server/tests/it/*.rs')"; then
            echo "::error::git diff $BEFORE ${{ github.sha }} failed — refusing to run no test files on an unread diff"
            exit 1
          fi
          FILES="$(printf '%s\n' "$DIFF" \
            | grep -E '^crates/pierre-server/tests/(it/)?[^/]+\.rs$' \
            | grep -v -E '/(common|main)\.rs$' || true)"
          echo "Changed server test files:"
          printf '  %s\n' $FILES
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust environment
        id: rust
        uses: ./.github/actions/rust-setup
        with:
          # The dev-profile test cache backend-test-binaries saves; restored only.
          shared-key: test-dev
          cache-save: 'false'

      # Runs the doctests AND checks none are ignored, from one invocation.
      #
      # This step used to end `cargo test --doc 2>&1 || true` and then inspect
      # only the ignored count, so a doctest that failed to compile left the job
      # green — a `no_run` example still has to build. That is how
      # pierre-cache's `TenantId::default()` survived on main after 19afe3334
      # removed the constructor: the job named "Doc Tests" was never failing on
      # doctests. It also lacked --workspace, so crates outside the default
      # members were never reached at all.
      - name: Doc tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          echo "Running workspace doctests..."
          set +e
          DOCTEST_OUTPUT=$(cargo test --workspace --doc 2>&1)
          STATUS=$?
          set -e
          echo "$DOCTEST_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Doctests failed. A no_run example still has to compile."
            exit 1
          fi

          IGNORED_COUNT=$(echo "$DOCTEST_OUTPUT" | grep -E "test result:.*ignored" | grep -oE "[0-9]+ ignored" | grep -oE "[0-9]+" | head -1 || echo "0")
          if [ "${IGNORED_COUNT:-0}" -gt 0 ]; then
            echo "::error::Found $IGNORED_COUNT ignored doctest(s)!"
            exit 1
          fi
          echo "Doctests passed, none ignored"
        env:
          DATABASE_URL: "sqlite::memory:"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

      # The `telemetry` feature is off in every other test job, so these
      # feature-gated integration tests (traceparent injection on the shared
      # HTTP clients, OTLP pipeline activation contract) only execute here.
      - name: Telemetry feature tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          cargo test -p pierre-core --features telemetry --test it trace_propagation_test::
          cargo test -p pierre-logging --features telemetry --test otel_pipeline_test

      # The tests policing platform<->contremaitre coupling (tool list, notify
      # catalogue, messaging locales) used to run ONLY in the full suite — cron
      # SQLite shards, full-on-main ci-postgres, coverage. Since features merge
      # by local squash with no PR, the branch never executed them: drift
      # false-greened the branch and red main post-merge. Running the four
      # suites on every push moves that verdict before the merge: four suites
      # filtered out of the one `it` binary, not the whole suite.
      - name: Coupling tests (tool list, notify catalogue, locales)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          scripts/ci/server-suites.sh run \
            contremaitre_test \
            notify_catalogue_test \
            messaging_locale_test \
            configuration_mcp_integration_test
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

      - name: Setup Node.js (for SDK E2E tests runtime)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.changed.outputs.files != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for SDK build)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.changed.outputs.files != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        id: sdk
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.changed.outputs.files != '' }}
        working-directory: sdk
        # --ignore-scripts: sdk/package.json's `prepare` runs this same build
        # as the last phase of `bun install`, so without it the SDK builds
        # twice per job (carnet#161). Full rationale in cross-platform.yml.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Run this push's test files
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          mapfile -t CHANGED < <(grep -v '^$' <<< "${{ steps.changed.outputs.files }}")
          scripts/ci/server-suites.sh run "${CHANGED[@]}"
        timeout-minutes: 45
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

  feature-profiles:
    name: Feature Profile Check (${{ matrix.name }})
    timeout-minutes: 40  # cargo check per feature profile
    runs-on: ubuntu-latest
    needs: [fast-gate, detect-changes]
    # Skips on main when a full-lane branch passed both profiles on this exact
    # tree (proven in .github/actions/ci-backend-changes, carnet#1258). A job
    # `if` cannot read the matrix, so it is both or neither.
    if: >-
      needs.detect-changes.outputs.rust == 'true' &&
      !(contains(fromJSON(needs.detect-changes.outputs.proven || '[]'), 'Feature Profile Check (production)') &&
        contains(fromJSON(needs.detect-changes.outputs.proven || '[]'), 'Feature Profile Check (no-default-features)'))
    # Every other job here builds pierre_mcp_server with the default feature set
    # or with --all-features. Neither is what ships: the Dockerfile builds
    # --no-default-features with postgresql and WITHOUT sqlite, a combination
    # --all-features cannot produce because it turns both backends on. So the
    # one build that reaches Cloud Run was, until 2026-08-26, compiled first by
    # the deploy.
    #
    # A feature gate naming the wrong feature, or a leaf crate turning a trait
    # method on unconditionally while the host's impl stays gated, is invisible
    # until something builds a configuration that separates them (carnet#116).
    # Two do that here, and both earn their slot:
    #   production — the exact Dockerfile line. Red here is a red deploy.
    #   no-default-features — every gate off at once. The cheapest possible
    #     probe for a gate that names the wrong feature, and the one that found
    #     all of carnet#116's errors.
    # Keep this matrix to configurations something actually builds. Four
    # server-* profiles used to sit here; nothing had ever built them, which is
    # how they stayed broken, and they were deleted rather than gated.
    #
    # The production profile runs `cargo clippy`, the probe runs `cargo check`.
    # `--all-features` cannot produce the shipping combination (postgresql WITHOUT
    # sqlite), so no clippy job in this workflow lints the code that actually
    # deploys — a lint reachable only under that combination has nothing standing
    # between it and the Docker build. Clippy costs little more than check on the
    # same unit, so the configuration that ships gets linted; `no-default-features`
    # stays a check, since its job is to prove the gates are wired, not to lint.
    # build.warnings denies warnings from workspace packages only, so
    # third-party code cannot fail this; unlike RUSTFLAGS it leaves the
    # build fingerprint alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            features: 'server-production,postgresql,sqlx/migrate,telemetry,gcp-kms'
          - name: no-default-features
            features: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          # The production entry lints rather than checks, so this job needs the
          # clippy component the way the full-workspace job does. Without it the
          # matrix fails with "'cargo-clippy' is not installed for the toolchain"
          # — which is what it did on 18c54d9ec.
          components: clippy
          free-disk-space: 'true'
          # Restores the full-workspace clippy job's cache rather than saving
          # a feature-profiles entry of its own (two on 2026-10-21, ~1 GB of
          # the 10 GB quota); most dependencies resolve the same features
          # either way (carnet#1114).
          shared-key: clippy
          cache-save: 'false'

      - name: Check ${{ matrix.name }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --keep-going -p pierre_mcp_server \
              --no-default-features --features "${{ matrix.features }}"
          else
            cargo check --keep-going -p pierre_mcp_server --no-default-features
          fi
        env:
          CARGO_BUILD_WARNINGS: deny

  # The SQLite shards' binaries, built once and downloaded by all four, as in
  # ci-postgres.yml (carnet#1115): each shard used to compile the whole tree
  # itself. The same `cargo test --test ...` from the workspace root that
  # `server-suites.sh run` used to run on every shard, so the features resolve
  # as they did.
  backend-test-binaries:
    name: Build Test Binaries (SQLite)
    timeout-minutes: 60  # a cold build takes 6-7 minutes
    runs-on: ubuntu-latest
    needs: fast-gate
    # SQLite shards run on the daily cron (08:11 UTC), never on a push.
    # Per-push coverage comes from PostgreSQL via ci-postgres.yml, which is
    # what production runs; SQLite is a compatibility check that doesn't need
    # to gate a commit. A dispatch runs them only when asked
    # (`sqlite-shards`): the contremaitre, satellite and tronc bump gates
    # dispatch this workflow for every bump, and their shards cost 184
    # job-hours over Oct 7-20 against 31 for the cron (carnet#1114).
    if: github.event_name == 'schedule' || inputs.sqlite-shards

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'
          # The one dev-profile test cache dev-tests restores. This job is its
          # only producer; Swatinem keeps dependencies only, never the
          # workspace's test binaries.
          shared-key: test-dev

      - name: Build the suite's test binaries
        run: |
          # Gate on list's exit status: `mapfile < <(...)` would discard it.
          if ! LISTING="$(scripts/ci/server-suites.sh list)"; then
            echo "::error::server-suites.sh list failed"
            exit 1
          fi
          mapfile -t ALL_TESTS < <(cut -f1 <<< "$LISTING" | grep -v 'database_plugins_postgresql_test')
          if [ "${#ALL_TESTS[@]}" -eq 0 ]; then
            echo "::error::no server suites listed — refusing to report green."
            exit 1
          fi
          if ! TARGETS="$(scripts/ci/server-suites.sh targets "${ALL_TESTS[@]}")"; then
            echo "::error::server-suites.sh targets failed"
            exit 1
          fi
          TEST_ARGS=()
          while IFS= read -r target; do
            TEST_ARGS+=(--test "$target")
          done <<< "$TARGETS"
          # Every crate's suites are one binary named `it`, so `--test it` from
          # the root builds them all; the shards run pierre-server's alone (the
          # leaf crates' run in leaf-crate-tests), so only those are packed.
          scripts/ci/test-binaries.sh build "$RUNNER_TEMP/sqlite-pack" --keep crates/pierre-server "${TEST_ARGS[@]}"

      - name: Upload the suite's test binaries
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-test-binaries
          # zstd already compressed the archives; zipping them again only costs time.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          # A re-run attempt sees the first attempt's artifact of this name in
          # the same run, and without this the upload fails on it, as the
          # server-binaries upload below records. It replaces the same
          # commit's binaries.
          overwrite: true
          path: |
            ${{ runner.temp }}/sqlite-pack/test-binaries.tsv
            ${{ runner.temp }}/sqlite-pack/workspace
            ${{ runner.temp }}/sqlite-pack/binaries.tar.zst
            ${{ runner.temp }}/sqlite-pack/cargo-git.tar.zst

  backend-tests:
    name: Backend Tests (SQLite ${{ matrix.shard }}/4)
    timeout-minutes: 45  # one SQLite shard of the full suite, from prebuilt binaries
    runs-on: ubuntu-latest
    needs: backend-test-binaries
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download the suite's test binaries
        uses: actions/download-artifact@v4
        with:
          name: sqlite-test-binaries
          path: ${{ runner.temp }}/sqlite-pack

      - name: Unpack the suite's test binaries
        run: scripts/ci/test-binaries.sh unpack "$RUNNER_TEMP/sqlite-pack"

      - name: Setup Node.js (for SDK E2E tests runtime)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        # --ignore-scripts: sdk/package.json's `prepare` runs this same build
        # as the last phase of `bun install`, so without it the SDK builds
        # twice per job (carnet#161). Full rationale in cross-platform.yml.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          mapfile -t ALL_TESTS < <(
            scripts/ci/server-suites.sh list \
              | cut -f1 \
              | grep -v 'database_plugins_postgresql_test'
          )
          if [ "${#ALL_TESTS[@]}" -eq 0 ]; then
            echo "::error::no server suites listed — refusing to report green."
            exit 1
          fi
          TOTAL=${#ALL_TESTS[@]}
          SHARD=${{ matrix.shard }}
          SHARDS=4

          SHARD_TESTS=()
          for i in "${!ALL_TESTS[@]}"; do
            if (( (i % SHARDS) + 1 == SHARD )); then
              SHARD_TESTS+=("${ALL_TESTS[$i]}")
            fi
          done

          echo "=== Shard $SHARD/$SHARDS: ${#SHARD_TESTS[@]} of $TOTAL suites ==="
          printf '  %s\n' "${SHARD_TESTS[@]}"
          echo ""

          scripts/ci/server-suites.sh run --binaries "$RUNNER_TEMP/sqlite-pack/test-binaries.tsv" "${SHARD_TESTS[@]}"
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

  # Every test target OUTSIDE crates/pierre-server/tests, on every push. The
  # per-push suites enumerate only pierre-server's tests directory (ci-postgres
  # full-on-main, the cron SQLite shards), so a test in a leaf crate — e.g.
  # pierre-chat-pipeline/tests/it/turn_directive_test.rs — ran per-push only in
  # the coverage lane. On 2026-08-30 that let b76ebb0fa land on main with a
  # broken pipeline test while every ci-backend job stayed green; coverage
  # reported it 100+ minutes later. This job closes that hole: one runner, one
  # cargo invocation, every leaf crate's tests/ dir AND its in-module unit
  # tests (ADR-027: `#[cfg(test)] mod tests` in src/, run as the lib target),
  # refusing to report green on an empty selection exactly as the PostgreSQL
  # lane learned to. pierre-server's own unit tests run in the step after.
  leaf-crate-tests:
    name: Leaf-Crate Tests (every crate but pierre-server)
    timeout-minutes: 80  # the 45-min test step, the 20-min mint-session step, plus build; the step bounds cannot catch a hang before them
    runs-on: ubuntu-latest
    needs: [fast-gate, detect-changes]
    # Skips on main when a full-lane branch tested every leaf crate green on
    # this exact tree (proven in .github/actions/ci-backend-changes,
    # carnet#1258). The proof is the "Every leaf crate is in scope" step, not
    # the job: a branch run scoped to the crates its push reaches passes the
    # job having tested only those (carnet#1282).
    if: >-
      needs.detect-changes.outputs.rust == 'true' &&
      !contains(fromJSON(needs.detect-changes.outputs.proven || '[]'), 'Leaf-Crate Tests (every crate but pierre-server) -> Every leaf crate is in scope')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'

      # The scope read the crate graph from Cargo.lock, which needs no
      # toolchain; where one is installed, hold it to cargo's own answer.
      - name: The crate graph the scope read matches cargo metadata
        run: ./scripts/ci/affected-crates.py check-graph

      # The marker main's skip reads (proven-on-branch.sh lists the steps that
      # passed): it runs only when the step below tests every leaf crate.
      - name: Every leaf crate is in scope
        if: needs.detect-changes.outputs.scope-mode != 'scoped'
        run: echo "Every leaf crate is tested on this run."

      - name: Run the leaf crates' test targets
        run: |
          # Package names are read from each Cargo.toml, never derived from the
          # directory (crates/pierre-server is the standing counter-example:
          # its package is pierre_mcp_server). pierre-server is excluded here
          # because its 300+ test binaries have their own lanes. Every other
          # crate is selected, with or without a tests/ directory: `--tests`
          # runs the lib target's in-module unit tests too, and a crate whose
          # only tests live in src/ must not fall out of the lane. A scoped run
          # keeps the crates its push reaches (carnet#1282).
          PKG_FLAGS=()
          COUNT=0
          for manifest in crates/*/Cargo.toml; do
            crate_dir="$(dirname "$manifest")"
            if [ "$crate_dir" = "crates/pierre-server" ]; then
              continue
            fi
            pkg="$(sed -n 's/^name = "\(.*\)"/\1/p' "$crate_dir/Cargo.toml" | head -1)"
            if [ -z "$pkg" ]; then
              echo "::error::Could not read the package name from $crate_dir/Cargo.toml"
              exit 1
            fi
            if [ "$SCOPE_MODE" = scoped ] && ! grep -qxF "$pkg" < <(tr ' ' '\n' <<<"$SCOPE_TESTED"); then
              continue
            fi
            PKG_FLAGS+=("-p" "$pkg")
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ] && [ "$SCOPE_MODE" = scoped ]; then
            # Nothing a leaf crate builds from changed since a tree whose leaf
            # crates passed: their verdict there stands.
            echo "::notice title=No leaf crate in scope::this push reaches no leaf crate (scope: ${SCOPE_TESTED:-none})"
            exit 0
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Leaf-crate lane selected no packages — refusing to report green."
            exit 1
          fi
          echo "=== $COUNT leaf crates ==="
          printf '%s\n' "${PKG_FLAGS[@]}" | paste -d' ' - - | sed 's/^-p /  /'
          # --all-features, not defaults: a leaf crate built standalone loses
          # the features pierre-server forwards to it (workspace unification).
          # pierre-tool-runtime/tests/it/sport_type_filter_test.rs is the
          # standing example — its fitness_support import sits behind
          # tools-data/tools-analytics, so a defaults build cannot compile it.
          #
          # A leaf crate's suites are modules of one `it` binary and state such
          # a gate as `#[cfg(feature = ...)]` on their `mod` line, where a
          # misspelled feature is an unexpected_cfgs warning the clippy job
          # denies. A [[test]] target that names its gate as
          # `required-features` instead is SKIPPED by cargo when the gate is
          # off rather than failing: no compile error, no `running 0 tests`, no
          # row in the output. That is right for a build that legitimately has
          # the feature off and a silent loss of coverage otherwise, so the
          # coverage check runs first. It compares the test targets the manifests declare
          # against the binaries this same --all-features build produces and
          # fails when any declared target went unbuilt — a renamed or
          # misspelled feature would otherwise retire a test with nothing going
          # red. Its --no-run build populates the cache the run below reuses.
          # The guard's own cases, next to the guard: it must catch an
          # unsatisfiable gate and must refuse an empty package list. It
          # compiles a throwaway two-target crate with no dependencies, which
          # is why it sits here rather than in the no-compilation fast-gate.
          ./scripts/ci/check-leaf-test-targets.test.sh
          ./scripts/ci/check-leaf-test-targets.sh "${PKG_FLAGS[@]}"
          cargo test "${PKG_FLAGS[@]}" --all-features --tests -- --test-threads=4
        timeout-minutes: 45
        env:
          SCOPE_MODE: ${{ needs.detect-changes.outputs.scope-mode }}
          SCOPE_TESTED: ${{ needs.detect-changes.outputs.scope-tested }}
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

      # The step above builds with --all-features, which turns on
      # e2e-seeded-sessions, so it compiles mint_session_cli_test and never
      # mint_session_absent_test: nothing would prove the pierre-cli the image
      # ships (no such feature) lacks `user mint-session`, a command that signs
      # an account in with no credential (carnet#1201). This builds pierre-cli
      # alone with its default features and runs only that suite: one compile.
      # A filter that matches nothing exits 0 with `running 0 tests`, so the
      # exit status is judged first and the named test's `ok` line after it.
      # The command writes to a file rather than into `$(...)` so that
      # check-workflow-test-targets.sh can read its --test and module filter.
      - name: Prove the shipped pierre-cli has no mint-session
        if: needs.detect-changes.outputs.scope-mode != 'scoped' || contains(format(' {0} ', needs.detect-changes.outputs.scope-tested), ' pierre-cli ')
        run: |
          log="$RUNNER_TEMP/mint-session-absent.log"
          if ! cargo test -p pierre-cli --test it -- mint_session_absent_test:: > "$log" 2>&1; then
            cat "$log"
            echo "::error::pierre-cli's mint_session_absent_test failed or did not build"
            exit 1
          fi
          cat "$log"
          if ! grep -qE '^test mint_session_absent_test::[a-z_]+ \.\.\. ok$' "$log"; then
            echo "::error::mint_session_absent_test ran no test — the filter or the cfg gate no longer selects it"
            exit 1
          fi
        timeout-minutes: 20

      # pierre-server's in-module unit tests (ADR-027) — its tests/ binaries run
      # in their own lanes, and none of those runs the lib target. Compiling the
      # server's lib test harness costs minutes, so the step runs only when
      # pierre-server/src actually carries a test module.
      - name: Run pierre-server unit tests
        if: needs.detect-changes.outputs.scope-mode != 'scoped' || contains(format(' {0} ', needs.detect-changes.outputs.scope-linked), ' pierre_mcp_server ')
        run: |
          if ! grep -rqE '^#\[cfg\(test\)\]' crates/pierre-server/src; then
            echo "pierre-server/src has no #[cfg(test)] module — nothing to run."
            exit 0
          fi
          cargo test -p pierre_mcp_server --all-features --lib -- --test-threads=4
        timeout-minutes: 30
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"

  # ============================================================================
  # PHASE 2: Release binary — gates on clippy; on a main push, uploads the
  # binaries publish-images.yml ships
  # ============================================================================

  release-binary:
    name: Release Binary Validation
    timeout-minutes: 90  # a full release build plus the size check
    runs-on: ubuntu-latest
    # Not behind clippy. Chained, the backend's wall was clippy's 8.5 min plus
    # this job's 18 (median, Oct 22-29), and Backend (Rust) was the last lane
    # to finish on 54 of 147 green commits. In parallel it costs one release
    # build per red clippy: 4 that week (carnet#1258).
    needs: [detect-changes]
    # Main builds it whenever a Rust input changed: it ships. A branch builds
    # it only when the push can change how it links (release-worthy in
    # .github/actions/ci-backend-changes); server-e2e sizes the thin
    # binary on every other branch push. A push no Rust input touches skips it
    # on main too, and publish-images then builds the binaries itself.
    if: >-
      needs.detect-changes.outputs.rust == 'true' &&
      (github.ref == 'refs/heads/main' ||
       needs.detect-changes.outputs.release-worthy == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # In this job, not inside server-binaries. rust-cache saves in a post
      # step, and nested two composite actions deep that post step never
      # saved: on every scheduled run since 3af2dae60 (Oct 4) it returned in
      # under a second without a line of output, which is save.ts's early
      # return when save-if is not 'true', while the jobs that call rust-setup
      # directly in the same runs saved (job 119258644743 against clippy, the
      # SQLite shard 1 and leaf-crate-tests in run 39609290067). The release
      # cache held no entry at all, so every build compiled ~480 crates cold.
      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: release
          free-disk-space: 'true'

      - name: Build release binary
        id: binaries
        # The same action publish-images.yml builds the image's binaries with —
        # profile, features, env — so the binary this job sizes is the one the
        # image ships, and the dependency cache it saves under `shared-key:
        # release` is the one the image build restores. Until 2026-09-18 this
        # built the thin-LTO default-feature binary (sqlite, no telemetry): a
        # profile release.yml never tags and a feature set nothing deploys.
        # carnet#471. Main builds pierre-cli too, so the upload below carries
        # both binaries the image needs; the two links run in parallel.
        uses: ./.github/actions/server-binaries
        with:
          deps-token: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
          bins: ${{ github.ref == 'refs/heads/main' && 'pierre-mcp-server pierre-cli' || 'pierre-mcp-server' }}

      - name: Verify release binary exists
        run: |
          if [ -f "target/release-lto/pierre-mcp-server" ]; then
            echo "Release binary built successfully"
            ls -lh target/release-lto/pierre-mcp-server
          else
            echo "Release binary not found"
            exit 1
          fi

      - name: Check release binary size
        run: |
          BINARY_SIZE_BYTES=$(stat -c %s target/release-lto/pierre-mcp-server)
          BINARY_SIZE_MB=$((BINARY_SIZE_BYTES / 1024 / 1024))
          # 80 until 2026-09-03, when main had been reporting exactly 80MB for
          # four consecutive green runs. The gate fails above the ceiling, so
          # main was passing with zero headroom and the next change of any size
          # was going to fail it — the in-app backfill delivery that did was
          # ~300 lines and two locale strings, which is not what a binary-size
          # gate is meant to catch. Raised rather than paid for by cutting the
          # feature: shrinking working architecture to fit a number that no
          # longer reflects the binary is the wrong trade. The band below still
          # gives ~4MB of warning before the next hard stop.
          #
          # Back to 90 on 2026-09-19, after one day at 95 (the copilot_sdk
          # provider's ~3MB of generated protocol types had taken a thin-LTO,
          # default-feature binary to 91MB). The raise was paying for two
          # mistakes in this job, not for the code: it built a profile
          # release.yml never tagged and a feature set nothing deployed. The
          # build step above now uses the image's fat-LTO invocation, which
          # measured 83MB for the shipped binary (the same tree links 82.2 →
          # 66.0MB locally, −20%), and the lockfile no longer carries a second
          # rustls provider or a second tungstenite. carnet#471 has the numbers.
          #
          # 115 on 2026-10-08: the shipped build carries lingua's language
          # models so a turn reads its own language without an LLM call
          # (carnet#839, a product decision). Measured 108MB here against 86MB
          # on main the run before — the 22MB is model data, not code. The
          # ceiling keeps roughly the old headroom over what ships.
          #
          # 2026-10-13: `release-lto` pins codegen-units = 1 (carnet#499). At
          # 16, the value `release` sets, this step read 111MB; at 1 the same
          # commit measures 98.8MB. The ceiling stays at 115, so dropping the
          # line again would pass here with only the warning below (111 is
          # inside the band), and scripts/ci/architectural-validation.sh
          # fails on it instead.
          #
          # server-e2e.yml checks the thin binary against this ceiling
          # scaled to that build (139), so a branch push that skips this job
          # is still sized against it. Move both together.
          MAX_SIZE_MB=115
          # Warn band at 95% of the ceiling. A bare pass/fail cliff gives no
          # signal until the build is already broken, and one fat dependency
          # can still cross the gap in a single change.
          WARN_SIZE_MB=$(( MAX_SIZE_MB * 95 / 100 ))

          echo "Binary size: ${BINARY_SIZE_MB}MB"

          if [ "$BINARY_SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "::error::Binary size (${BINARY_SIZE_MB}MB) exceeds limit (${MAX_SIZE_MB}MB)"
            exit 1
          fi

          if [ "$BINARY_SIZE_MB" -ge "$WARN_SIZE_MB" ]; then
            echo "::warning::Binary size ${BINARY_SIZE_MB}MB is within 5% of the ${MAX_SIZE_MB}MB ceiling. Check what this change pulled in (cargo tree, feature flags) before it becomes a hard failure for whoever pushes next."
          fi

          echo "Binary size (${BINARY_SIZE_MB}MB) within limit (<${MAX_SIZE_MB}MB)"

      - name: Basic smoke test of release binary
        run: |
          # `|| true` here meant a binary that segfaulted, hung past the
          # timeout, or was never produced still printed "executed
          # successfully". The exit status IS the smoke test, so read it — and
          # require the version line too, because a binary that exits 0 having
          # printed nothing has verified nothing.
          version_out="$(timeout 5 target/release-lto/pierre-mcp-server --version 2>&1)" || {
            status=$?
            echo "::error::Release binary failed its smoke test (exit ${status}):"
            echo "$version_out"
            exit 1
          }
          if [ -z "$version_out" ]; then
            echo "::error::Release binary exited 0 but printed no version — nothing was verified."
            exit 1
          fi
          echo "Release binary smoke test passed: ${version_out}"

      # publish-images.yml deploys a green main push, and builds its image from
      # these binaries instead of compiling release-lto a second time, after
      # this run already did. It finds them by the commit: the name carries the
      # sha, and only main pushes upload. They are the staged directory
      # server-binaries checked against the runtime's glibc. Three days covers
      # a deploy queued behind a burst; an older commit's redeploy compiles.
      - name: Upload the binaries for the image build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries-${{ github.sha }}
          path: ${{ steps.binaries.outputs.dir }}
          if-no-files-found: error
          retention-days: 3
          # A re-run attempt sees the first attempt's artifact of this name in
          # the same run, and without this the upload fails on it: re-running
          # a green main push would turn this job red. The binaries it replaces
          # are the same commit's.
          overwrite: true
