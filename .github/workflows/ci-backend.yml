# ABOUTME: Main backend CI pipeline with code quality, clippy, doc tests, and sharded integration tests.
# ABOUTME: Backend tests are split across 4 parallel runners for ~4x faster execution.
name: Backend CI

on:
  push:
    branches: [ "main", "debug/*", "feature/*", "claude/*", "copilot/*" ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/rust-setup/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/rust-setup/**'
  schedule:
    # Weekly release binary validation (Sundays at 2 AM UTC)
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Detect whether source code changed enough to warrant a release binary build.
  # On schedule (weekly), always outputs true to ensure full validation.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      release-worthy: ${{ steps.set-outputs.outputs.release-worthy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            release-worthy:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Set outputs (schedule runs everything)
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "release-worthy=true" >> $GITHUB_OUTPUT
          else
            echo "release-worthy=${{ steps.filter.outputs.release-worthy }}" >> $GITHUB_OUTPUT
          fi

  # Fast code quality gate — no Rust compilation, runs in ~15 seconds
  # Gates all other jobs to avoid wasting CI minutes on code that fails basic checks
  code-quality:
    name: Code Quality & Security Patterns
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Architectural Validation (Custom Patterns + Security Skills)
        run: ./scripts/ci/architectural-validation.sh --apply-skills

      - name: Secret Pattern Validation
        run: ./scripts/ci/validate-no-secrets.sh

  # Clippy linting with zero tolerance (includes cognitive complexity)
  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          free-disk-space: 'true'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (Zero Tolerance + Cognitive Complexity)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Security audit via cargo-deny — fast, no Rust compilation needed
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Security Audit (via deny.toml)
        run: cargo deny check

  # Doc test validation — compiles doctests and checks for ignored tests
  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup

      - name: Validate no ignored doctests
        run: |
          echo "Checking for ignored doctests..."
          DOCTEST_OUTPUT=$(cargo test --doc 2>&1 || true)
          IGNORED_COUNT=$(echo "$DOCTEST_OUTPUT" | grep -E "test result:.*ignored" | grep -oE "[0-9]+ ignored" | grep -oE "[0-9]+" | head -1 || echo "0")
          if [ "${IGNORED_COUNT:-0}" -gt 0 ]; then
            echo "ERROR: Found $IGNORED_COUNT ignored doctests!"
            echo "Doctests marked with 'ignore' are not compiled or tested."
            echo "Use 'no_run' if code should compile but not execute,"
            echo "or 'text' for documentation-only examples."
            echo ""
            echo "To find ignored doctests, run: cargo test --doc 2>&1 | grep -i ignore"
            exit 1
          fi
          echo "No ignored doctests found"
        env:
          DATABASE_URL: "sqlite::memory:"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

  # Backend integration tests (SQLite) — sharded across 4 parallel runners
  backend-tests:
    name: Backend Tests (SQLite ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          free-disk-space: 'true'

      - name: Setup Node.js (for SDK E2E tests runtime)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Bun (for SDK build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Build MCP SDK (required for E2E tests)
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          # Discover all integration test files, excluding:
          #   - helpers/ directory (shared utilities, not standalone test binaries)
          #   - common.rs (shared module, not a standalone test binary)
          #   - cache_redis_test (needs Redis, tested in ci-redis.yml)
          #   - database_plugins_postgresql_test (needs PostgreSQL feature flag)
          mapfile -t ALL_TESTS < <(
            find crates/pierre-server/tests -maxdepth 1 -name '*.rs' -printf '%f\n' \
              | sed 's/\.rs$//' \
              | grep -v '^common$' \
              | grep -v 'cache_redis_test' \
              | grep -v 'database_plugins_postgresql_test' \
              | sort
          )
          TOTAL=${#ALL_TESTS[@]}
          SHARD=${{ matrix.shard }}
          SHARDS=4

          # Assign tests to shards using modulo for even distribution
          SHARD_TESTS=()
          for i in "${!ALL_TESTS[@]}"; do
            if (( (i % SHARDS) + 1 == SHARD )); then
              SHARD_TESTS+=("${ALL_TESTS[$i]}")
            fi
          done

          echo "=== Shard $SHARD/$SHARDS: ${#SHARD_TESTS[@]} of $TOTAL test files ==="
          printf '  %s\n' "${SHARD_TESTS[@]}"
          echo ""

          FAILED=0
          for test_file in "${SHARD_TESTS[@]}"; do
            echo "::group::$test_file"
            if ! cargo test --test "$test_file" -- --test-threads=4; then
              echo "::error::Test file $test_file failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
        env:
          DATABASE_URL: "sqlite::memory:"
          ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

  # Release binary validation (runs on push/PR and weekly schedule)
  release-binary:
    name: Release Binary Validation
    runs-on: ubuntu-latest
    needs: [clippy, detect-changes]
    # Skip when only test files or scripts changed (no binary impact).
    # Always run on main and schedule.
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.release-worthy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          shared-key: release
          free-disk-space: 'true'

      # SDK build removed - release binary validation focuses on Rust binary only
      # Full test suite with SDK is covered by backend-tests job
      - name: Build release binary
        run: cargo build --release --verbose
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C opt-level=3"

      - name: Verify release binary exists
        run: |
          if [ -f "target/release/pierre-mcp-server" ]; then
            echo "Release binary built successfully"
            ls -lh target/release/pierre-mcp-server
          else
            echo "Release binary not found"
            exit 1
          fi

      - name: Check release binary size
        run: |
          BINARY_SIZE_BYTES=$(ls -l target/release/pierre-mcp-server | awk '{print $5}')
          BINARY_SIZE_MB=$((BINARY_SIZE_BYTES / 1024 / 1024))
          MAX_SIZE_MB=50

          echo "Binary size: ${BINARY_SIZE_MB}MB"

          if [ "$BINARY_SIZE_MB" -le "$MAX_SIZE_MB" ]; then
            echo "Binary size (${BINARY_SIZE_MB}MB) within limit (<${MAX_SIZE_MB}MB)"
          else
            echo "Binary size (${BINARY_SIZE_MB}MB) exceeds limit (${MAX_SIZE_MB}MB)"
            exit 1
          fi

      # Full test suite removed - SQLite backend-tests job provides comprehensive coverage
      # Release binary validation focuses on build success and binary size
      - name: Basic smoke test of release binary
        run: |
          timeout 5 target/release/pierre-mcp-server --version || true
          echo "Release binary executed successfully"

      - name: Upload release binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pierre-mcp-server-release-ubuntu
          path: target/release/pierre-mcp-server
          retention-days: 7
