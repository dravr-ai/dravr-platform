# ABOUTME: CI workflow that scans the MCP server config for security issues (the skills scan runs in dravr-savoir)
# ABOUTME: Uses Snyk Agent Scan (formerly mcp-scan) via uvx to detect prompt injection and tool poisoning

name: "Security: MCP Tool Scan"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - '.mcp.json'
      - '.github/workflows/mcp-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.mcp.json'
      - '.github/workflows/mcp-scan.yml'
  schedule:
    # Weekly scan (Sundays at 03:47 UTC)
    - cron: '47 3 * * 0'

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  # The event name is in the group because a weekly cron on main carries the
  # tip's sha: without it that run joins the tip's push-run group and cancels
  # that verdict mid-flight (ci-backend.yml records the same collision).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp-scan:
    name: Scan MCP Config & Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~20 s
    # SNYK_TOKEN is mapped at job level so each scan step can gate on its presence.
    # GitHub withholds repo secrets from dependabot/fork PRs, where the token is empty;
    # the scanner hard-exits without it, so those contexts skip rather than red. main and
    # first-party branches (push events) get the secret and run the full scan.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Scan MCP server configuration
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          # An exact release, bumped on purpose after reading its notes (carnet#951): the tool
          # runs with SNYK_TOKEN, so an unpinned "latest" would hand it to whatever PyPI serves.
          SNYK_AGENT_SCAN_VERSION: "0.6.8"
        run: uvx "snyk-agent-scan@${SNYK_AGENT_SCAN_VERSION}" .mcp.json

