# ABOUTME: CI workflow that scans MCP server config and Claude skills for security issues
# ABOUTME: Uses Snyk Agent Scan (formerly mcp-scan) via uvx to detect prompt injection and tool poisoning

name: "Security: MCP Tool Scan"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - '.mcp.json'
      - '.claude/skills/**'
      - '.github/workflows/mcp-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.mcp.json'
      - '.claude/skills/**'
      - '.github/workflows/mcp-scan.yml'
  schedule:
    # Weekly scan (Sundays at 3 AM UTC)
    - cron: '0 3 * * 0'

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp-scan:
    name: Scan MCP Config & Skills
    runs-on: ubuntu-latest
    # SNYK_TOKEN is mapped at job level so each scan step can gate on its presence.
    # GitHub withholds repo secrets from dependabot/fork PRs, where the token is empty;
    # the scanner hard-exits without it, so those contexts skip rather than red. main and
    # first-party branches (push events) get the secret and run the full scan.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Scan MCP server configuration
        if: ${{ env.SNYK_TOKEN != '' }}
        run: uvx snyk-agent-scan@latest .mcp.json

      - name: Scan Claude skills
        if: ${{ env.SNYK_TOKEN != '' }}
        run: uvx snyk-agent-scan@latest --skills .claude/skills
