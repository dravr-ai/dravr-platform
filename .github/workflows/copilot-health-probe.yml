# ABOUTME: Daily probe of the dev Copilot account — token validity, seat, and premium-request quota left
# ABOUTME: Reads GitHub's entitlement endpoint; spends NO model call. Opens an issue naming which of the three failed
#
# WHY THIS PROBE SENDS NO PROMPT
#
# The token it checks belongs to the account that serves athletes, so a probe
# that completes a prompt spends that account's premium requests — and can only
# report that a call WORKS, which stays true until the very call that exhausts
# the budget. On 2026-09-21 the quota ran out with no warning from anywhere and
# every athlete turn dead-ended (carnet#497).
#
# `GET /copilot_internal/user` answers all of it for free: 401 for a revoked
# token, the plan and `cli_enabled` for the seat, and
# `quota_snapshots.premium_interactions` for the budget — entitlement, remaining,
# percent_remaining — plus the reset date. So the probe warns while there is
# still quota to save, and its issue names which of the three failed: rotating a
# token does nothing for a spent quota.
name: "Monitor: Copilot Account Probe"

on:
  schedule:
    # Every day at 05:30 UTC (30 min before the version-drift check to isolate signals)
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: copilot-health-probe
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

env:
  # Open the issue while a quarter of the month's premium requests is left:
  # enough to act on before athletes are affected, late enough that a normal
  # month does not page.
  QUOTA_ALERT_PERCENT: "25"

jobs:
  probe-copilot-account:
    name: Probe Copilot Account
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch token from Secret Manager
        id: token
        run: |
          TOKEN=$(gcloud secrets versions access latest \
            --secret=dravr-mcp-server-copilot-github-token \
            --project="${GOOGLE_CLOUD_PROJECT:-$CLOUDSDK_CORE_PROJECT}")
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Secret Manager returned an empty token" >&2
            exit 1
          fi
          # Mask in logs, export for subsequent step
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Read entitlement and quota
        id: probe
        env:
          COPILOT_ACCOUNT_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          # The HTTP status is the verdict on the token; -f is deliberately
          # absent so a 401 is read as an answer rather than a curl failure.
          # A transport failure (no status at all) fails the job: that is the
          # absence of an observation, not a finding about the account.
          if ! STATUS=$(curl -sS -m 30 -o "$BODY" -w '%{http_code}' \
                 -H "Authorization: Bearer ${COPILOT_ACCOUNT_TOKEN}" \
                 -H 'Accept: application/json' \
                 https://api.github.com/copilot_internal/user); then
            echo "::error::could not reach api.github.com" >&2
            exit 1
          fi

          FAILED=false
          REASON=OK
          KIND=ok
          DETAIL=""
          if [ "$STATUS" != "200" ]; then
            FAILED=true
            KIND=auth
            REASON="GitHub answered HTTP ${STATUS} for the dev token — revoked, expired, or no Copilot seat"
          else
            # Every field is required. A response that has lost one is a shape
            # change, and reading it as "healthy" is how a gauge goes blind.
            if ! PARSED=$(jq -er '
                  .quota_snapshots.premium_interactions as $q
                  | [ (.copilot_plan | strings),
                      (.cli_enabled | booleans | tostring),
                      ($q.unlimited | booleans | tostring),
                      ($q.percent_remaining | numbers | tostring),
                      ($q.remaining | numbers | tostring),
                      ($q.entitlement | numbers | tostring),
                      (.quota_reset_date | strings) ]
                  | if length == 7 then join("\t") else error("missing field") end' "$BODY"); then
              echo "::error::/copilot_internal/user no longer has the shape this probe reads" >&2
              jq -r 'paths(scalars) | map(tostring) | join(".")' "$BODY" | head -60 >&2 || true
              exit 1
            fi
            IFS=$'\t' read -r PLAN CLI UNLIMITED PERCENT REMAINING ENTITLEMENT RESET <<< "$PARSED"
            DETAIL="plan=${PLAN} cli_enabled=${CLI} premium: ${REMAINING} of ${ENTITLEMENT} left (${PERCENT}%), resets ${RESET}"
            echo "$DETAIL"
            if [ "$CLI" != "true" ]; then
              FAILED=true
              KIND=seat
              REASON="the account's Copilot seat no longer includes the CLI (cli_enabled=${CLI}, plan=${PLAN})"
            elif [ "$UNLIMITED" != "true" ] && \
                 jq -en --argjson p "$PERCENT" --argjson t "$QUOTA_ALERT_PERCENT" '$p < $t' >/dev/null; then
              FAILED=true
              KIND=quota
              REASON="premium requests at ${PERCENT}% (${REMAINING} of ${ENTITLEMENT}), below the ${QUOTA_ALERT_PERCENT}% alert line; resets ${RESET}"
            fi
          fi
          rm -f "$BODY"

          {
            echo "failed=$FAILED"
            echo "kind=$KIND"
            echo "reason=$REASON"
            echo "detail=$DETAIL"
          } >> "$GITHUB_OUTPUT"
          if [ "$FAILED" = "true" ]; then
            # Not a job failure: the issue step below is the alert, and it
            # must run.
            echo "Probe FAILED ($KIND): $REASON"
          else
            echo "Probe OK"
          fi

      - name: Open or update tracking issue on probe failure
        if: steps.probe.outputs.failed == 'true'
        uses: actions/github-script@v9
        env:
          PROBE_REASON: ${{ steps.probe.outputs.reason }}
          PROBE_KIND: ${{ steps.probe.outputs.kind }}
          PROBE_DETAIL: ${{ steps.probe.outputs.detail }}
        with:
          script: |
            const title = 'Copilot account probe failing (dev)';
            const label = 'incident';
            const today = new Date().toISOString().split('T')[0];
            const reason = process.env.PROBE_REASON;
            const kind = process.env.PROBE_KIND;
            const detail = process.env.PROBE_DETAIL;
            // What to do depends on which of the three failed. Rotating a
            // token does nothing for a spent quota, and that is the advice
            // this issue gave on 2026-09-21.
            const remedy = kind === 'quota'
              ? [
                  `## What to do`,
                  ``,
                  `The token is fine; the month's premium requests are running out. Rotating it changes nothing.`,
                  ``,
                  `1. Find what is spending: the dev server's \`LLM call completed\` log lines by caller, any workflow that reads \`dravr-mcp-server-copilot-github-token\`, and any developer session (Claude Code, the Copilot CLI) signed in with the same account — on 2026-09-21 one improvement session drained the whole month.`,
                  `2. Until the reset date above, the fallback chain carries the traffic — check that its next tier is healthy.`,
                ]
              : [
                  `## Rotation runbook`,
                  ``,
                  `1. Create a new fine-grained PAT at https://github.com/settings/personal-access-tokens/new`,
                  `   - **Account permissions**: \`Copilot Chat: Read-only\` AND \`Copilot Requests: Read-only\``,
                  `   - **Expiration**: maximum (1 year)`,
                  `2. Rotate into Secret Manager:`,
                  `   \`\`\`bash`,
                  `   printf '%s' "<new_token>" | gcloud secrets versions add \\`,
                  `     dravr-mcp-server-copilot-github-token \\`,
                  `     --project=<dev-project> --data-file=-`,
                  `   \`\`\``,
                  `3. Force a new Cloud Run revision so the service picks up the secret:`,
                  `   \`\`\`bash`,
                  `   gcloud run services update dravr-mcp-server-api \\`,
                  `     --region=northamerica-northeast1 --project=<dev-project> \\`,
                  `     --update-labels=token-rotated=$(date +%s)`,
                  `   \`\`\``,
                  `4. Re-run this workflow via \`workflow_dispatch\` to confirm the probe is green.`,
                ];

            const body = [
              `# Copilot account probe failed — ${today}`,
              ``,
              `_Generated by [Monitor: Copilot Account Probe](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_`,
              ``,
              `## Signal`,
              ``,
              `- **Failed check**: \`${kind}\``,
              `- **Reason**: ${reason}`,
              `- **Account**: ${detail || 'not read — the token was refused'}`,
              `- **Secret**: \`dravr-mcp-server-copilot-github-token\` (latest version)`,
              ``,
              ...remedy,
              ``,
              `_This issue auto-updates each day. It closes when the next probe succeeds._`,
            ].join('\n');

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Production incident or outage',
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const existing = openIssues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: Close tracking issue on probe success
        if: steps.probe.outputs.failed != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Copilot account probe failing (dev)';
            const label = 'incident';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            const existing = openIssues.find(i => i.title === title);
            if (!existing) {
              core.info('No open probe-failure issue to close');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: 'Copilot account probe succeeded. Auto-closing.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed issue #${existing.number}`);
