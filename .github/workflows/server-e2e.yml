# ABOUTME: Every lane that drives a running server, from one thin-release build: Playwright integration and e2e-real, MCP compliance, the SDK suite and its type-drift check.
# ABOUTME: Each lane runs on its own path filter; a dispatch runs every push lane, the nightly cron runs MCP compliance.
name: "CI: Server E2E"

# These lanes were separate workflows until carnet#1115 — integration-tests.yml,
# mcp-compliance.yml and sdk-tests.yml — and between them they built the server
# several times a push. One
# job builds it here and the lanes download it. The SDK lanes ran a debug
# build before, so debug assertions are off there now; that was accepted.
#
# The trigger is the union of the four old filters, so no lane lost a trigger,
# and the `changes` job below holds each lane to its own filter. On a branch
# push that filter reads the branch's changes since it left main, as
# ci-backend-changes does, so a lane also runs on a later push of a branch that
# touched its paths earlier.
on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'sdk/**'
      - 'packages/mcp-types/**'
      - 'packages/eslint-config-pierre/testing/**'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - '.github/workflows/server-e2e.yml'
      # The binary reuse every server build goes through (carnet#1258).
      - '.github/actions/prebuilt-server/**'
      - 'scripts/ci/server-build-key.sh'
      - 'scripts/ci/proven-on-branch.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'sdk/**'
      - 'packages/mcp-types/**'
      - 'packages/eslint-config-pierre/testing/**'
      - 'scripts/ci/ensure-mcp-compliance.sh'
      - '.github/workflows/server-e2e.yml'
      # The binary reuse every server build goes through (carnet#1258).
      - '.github/actions/prebuilt-server/**'
      - 'scripts/ci/server-build-key.sh'
      - 'scripts/ci/proven-on-branch.sh'
  # Nightly on main: MCP compliance, the lane that had a cron of its own. It saves no cache: the build restores the one
  # mobile-e2e-android.yml writes (carnet#1114).
  schedule:
    - cron: '30 4 * * *'
  # The satellite and tronc bump gates dispatch this workflow for every bump
  # (satellites.toml [gates], tronc-bump.yml), so a dispatch runs every push
  # lane.
  workflow_dispatch:

concurrency:
  # One run going and one waiting, per lane and per ref (JF, 2026-11-19). A
  # running run always finishes, so main still turns green and deploys however
  # often it is pushed; a newer push takes the single waiting slot, replacing
  # the run that waited there, which GitHub cancels. The run that does go tests
  # a tree holding every skipped commit. Main used to keep one group per sha and
  # never cancel: 24 commits on 2026-11-19 queued ~600 jobs for a handful of
  # slots. Both costs are accepted: an intermediate main commit gets no verdict
  # of its own (the eviction carnet#169 once counted as a loss), and a branch
  # re-pushed mid-run finishes the superseded run (what carnet#1114 avoided),
  # bounded to one. The event name keeps a schedule or dispatch run out of the
  # push group. `cancel-in-progress` stays a literal: an expression there did
  # not hold on main (run 33026440559, see ci-backend.yml's history).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # path filtering only; no toolchain, no compile
    permissions:
      contents: read
      actions: read  # proven-on-branch.sh reads this workflow's branch runs
    outputs:
      build: ${{ steps.decide.outputs.build }}
      playwright: ${{ steps.decide.outputs.playwright }}
      mcp: ${{ steps.decide.outputs.mcp }}
      sdk: ${{ steps.decide.outputs.sdk }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Push and pull_request only: those name the range a filter judges.
      - name: Detect file changes
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # The server and the web app Playwright drives against it.
            playwright:
              - 'crates/**'
              - 'frontend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/server-e2e.yml'
              - '.github/actions/prebuilt-server/**'
              - 'scripts/ci/server-build-key.sh'
            # The MCP path and the bridge the compliance run drives.
            # pierre-mcp-transport is in scope even though it is a separate
            # crate: it holds the MCP path's JWT validation and tenant
            # resolution (tenant_isolation.rs), so a change there alters MCP
            # behaviour without touching pierre-server/src/mcp/.
            # packages/mcp-types is watched because the lane installs and runs
            # the SDK, which compiles against it.
            mcp:
              - 'crates/pierre-server/src/mcp/**'
              - 'crates/pierre-mcp-transport/**'
              - 'sdk/**'
              - 'packages/mcp-types/**'
              - 'scripts/ci/ensure-mcp-compliance.sh'
              - '.github/workflows/server-e2e.yml'
            # The SDK and the server, with its migrations, that its integration
            # and e2e tests start.
            sdk:
              - 'sdk/**'
              - 'packages/mcp-types/**'
              - 'packages/eslint-config-pierre/testing/**'
              - 'crates/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/server-e2e.yml'

      # A branch squashed onto an unchanged main lands the exact tree its
      # feature/, features/ or claude/ run already took through these lanes,
      # green: 12 main commits on Oct 22-29, 398 runner-minutes (carnet#1258).
      # A lane whose every job passed there is off on main. A lookup that
      # fails proves nothing, so every lane its filter selects runs.
      - name: Read which lanes a full-lane branch passed on this exact tree
        id: proven
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          proven="$(./scripts/ci/proven-on-branch.sh server-e2e.yml)" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Branch proof lookup failed::proven-on-branch.sh exited ${code}; running every lane the filter selects"
            proven=""
          fi
          has() { grep -qxF "$1" <<<"$proven"; }
          playwright=false; mcp=false; sdk=false
          has "Playwright Integration Tests (Real Server)" && playwright=true
          has "MCP Protocol Compliance" && mcp=true
          has "SDK Test Suite" && has "SDK Types Up-to-Date" && sdk=true
          {
            echo "playwright=${playwright}"
            echo "mcp=${mcp}"
            echo "sdk=${sdk}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Decide the lanes
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROVEN_PLAYWRIGHT: ${{ steps.proven.outputs.playwright }}
          PROVEN_MCP: ${{ steps.proven.outputs.mcp }}
          PROVEN_SDK: ${{ steps.proven.outputs.sdk }}
          PLAYWRIGHT: ${{ steps.filter.outputs.playwright }}
          MCP: ${{ steps.filter.outputs.mcp }}
          SDK: ${{ steps.filter.outputs.sdk }}
        run: |
          case "$EVENT_NAME" in
            push|pull_request)
              playwright="$PLAYWRIGHT"; mcp="$MCP"; sdk="$SDK" ;;
            workflow_dispatch)
              playwright=true; mcp=true; sdk=true ;;
            schedule)
              playwright=false; mcp=true; sdk=false ;;
            *)
              echo "::error::no lane plan for event '$EVENT_NAME'"
              exit 1 ;;
          esac
          # Lanes a full-lane branch already passed on this exact tree.
          if [ "$PROVEN_PLAYWRIGHT" = true ] && [ "$playwright" = true ]; then
            playwright=false; echo "::notice title=Lane proven on a branch::Playwright passed on a branch run of this tree"
          fi
          if [ "$PROVEN_MCP" = true ] && [ "$mcp" = true ]; then
            mcp=false; echo "::notice title=Lane proven on a branch::MCP compliance passed on a branch run of this tree"
          fi
          if [ "$PROVEN_SDK" = true ] && [ "$sdk" = true ]; then
            sdk=false; echo "::notice title=Lane proven on a branch::the SDK suite passed on a branch run of this tree"
          fi
          build=false
          for lane in "$playwright" "$mcp" "$sdk"; do
            [ "$lane" = true ] && build=true
          done
          {
            echo "playwright=${playwright:-false}"
            echo "mcp=${mcp:-false}"
            echo "sdk=${sdk:-false}"
            echo "build=$build"
          } | tee -a "$GITHUB_OUTPUT"

  build-server:
    name: Build Server (thin release)
    # The binary runs in the Playwright job below, pinned to 24.04: built on
    # 26.04 it needs GLIBC_2.43, which 24.04 lacks. The image is in the reuse
    # and cache keys, so a binary or build tree from another image never lands.
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 45  # a release build off the restored target/
    permissions:
      contents: read
      actions: read  # the prebuilt-server artifact lookup
    outputs:
      artifact: ${{ steps.prebuilt.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # A commit whose Rust inputs an earlier run already built downloads that
      # run's binaries instead of compiling: 26 of 217 builds on Oct 22-29
      # (carnet#1258). The size gate below still runs on what it downloaded.
      - name: Reuse a server built from the same inputs
        id: prebuilt
        uses: $/.github/actions/prebuilt-server
        with:
          prefix: server-e2e-binaries
          variant: ${{ runner.os }}-ubuntu-24.04-${{ runner.arch }}-release-default-features
          extra-paths: .github/workflows/server-e2e.yml
          path: target/release

      - name: Configure git for private deps
        if: steps.prebuilt.outputs.hit != 'true'
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        if: steps.prebuilt.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@1.100.0

      # Restore only. The build below is the one mobile-e2e-android.yml's server
      # job runs (`cargo build --release` of the whole workspace,
      # CARGO_INCREMENTAL=0, the same env), so features unify the same way and
      # this restores that lane's cache, which its nightly scheduled run on main
      # writes. A cache of its own, saved on every branch and every Cargo.lock
      # change, held up to 1.6 GB per branch of the repository's 10 GB quota.
      # No bare `Linux-cargo-` fallback: it matched any family on any toolchain,
      # downloaded a target/ this build cannot use, and by touching it kept the
      # dead Rust 1.98.1 entry alive for a day after the toolchain bump. It
      # cannot share ci-backend.yml's release cache: that build is release-lto
      # linked with mold, this one is the plain release profile.
      - name: Restore Rust build cache
        if: steps.prebuilt.outputs.hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ubuntu-24.04-cargo-mobile-server-1.100.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-cargo-mobile-server-1.100.0-

      - name: Build Pierre server and CLI (thin release)
        if: steps.prebuilt.outputs.hit != 'true'
        run: cargo build --release
        env:
          CARGO_INCREMENTAL: 0

      # The branch half of the binary size gate. ci-backend.yml's fat-LTO
      # Release Binary Validation sizes the binary that ships, but since
      # carnet#1114 a branch builds it only when the push touches a link input,
      # and 4 of its 5 failures in 60 days were this gate, not the build. This
      # job builds on most crates pushes anyway, so it carries the check. The
      # thin, default-feature binary is not the shipped one, so its ceiling is
      # the shipped ceiling scaled by the two measured on main on 2026-11-05:
      # fat 113 MB (ceiling 115, run 42080359585), thin 139 MB, so
      # 139 x 115/113 = 141. Re-scaled on 2026-11-06 from main's fat 114 MB
      # (runs 42323514435, 42316877305) and thin 141 MB: 141 x 115/114 = 142.
      # Re-scaled on 2026-11-11 from one commit's pair (27a5f46ad, the
      # workout-family landing): fat 115 MB passing its ceiling (run
      # 43079527898) and thin 143 MB (run 43079527897), so 143 x 115/115 =
      # 143. The shipped ceiling then moved to 118 for the families'
      # catalogue (ci-backend.yml); the per-sport coverage landing measured
      # fat 116 MB (run 43112901530) and thin 143 MB (run 43112910642), so
      # 143 x 118/116 = 145. On 2026-11-12 carnet#1425/#1445 measured thin
      # 146 MB (run 43336029155) with main exactly on 145, and ChefFamille
      # raised both ceilings by one MB: shipped 119, thin 146. Re-scaled on
      # 2026-11-14 from main's pair (fat 118 MB, run 43590984547; thin
      # 146 MB, run 43591039586): 146 x 119/118 = 147. The segment-history
      # branch measured fat 119 MB passing its unchanged ceiling (run
      # 43592399073) while this proxy read thin 147 against 146, stricter
      # than the gate it stands for. On 2026-11-14 carnet#1566 measured
      # thin 148 MB (run 43609078979) with main on 147 and fat on its 119,
      # and ChefFamille raised both ceilings by about 2MB: shipped 121, so
      # 147 x 121/119 = 149.5, rounded up to 150. On 2026-11-18 carnet#1561
      # measured thin 151 MB (run 44314583449) with main on 150 (run
      # 44307715156) and no new dependency, and ChefFamille raised both
      # ceilings by 2MB: shipped 123, thin 152. On 2026-11-19 carnet#1645
      # cut about 1.55MiB from the binary (a second reqwest, a second
      # dashmap, the locale catalogue compressed) with main on thin 148 MB
      # (run 44608023407) and fat 122 MB (run 44564706605), and both
      # ceilings came down: shipped 122 over an expected fat ~121. The
      # branch measured thin 149 MB on Linux (main had grown to 150 by
      # then), so 149 x 122/121 = 150.2, rounded up to 151. On 2026-11-21
      # carnet#1702 measured fat 123 MB against 122 (run 44944310962) and
      # thin 150 MB against 151 (run 44944310948); ChefFamille raised the
      # shipped ceiling to 125 and kept this one at 151, below this pair's
      # 150 x 125/123 = 152.4, so the proxy was stricter than the gate it
      # stands for. The same day ChefFamille moved it to that 152.4, rounded
      # up to 153, so a branch has the shipped gate's headroom. On 2026-11-25
      # carnet#1791 (the coach morning brief, no new dependency) measured thin
      # 154 MB against 153 (run 45631016824) with main exactly on 153 (run
      # 45626975943) and fat on 124 of 125; ChefFamille raised both ceilings
      # by 2MB: shipped 127, thin 155. Move both ceilings together.
      - name: Check the server binary size (thin release)
        run: |
          BINARY_SIZE_MB=$(( $(stat -c %s target/release/pierre-mcp-server) / 1024 / 1024 ))
          MAX_SIZE_MB=155
          WARN_SIZE_MB=$(( MAX_SIZE_MB * 95 / 100 ))
          echo "Thin release binary: ${BINARY_SIZE_MB}MB (ceiling ${MAX_SIZE_MB}MB)"
          if [ "$BINARY_SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "::error::Thin release binary (${BINARY_SIZE_MB}MB) exceeds ${MAX_SIZE_MB}MB, the shipped 125MB ceiling scaled to this build; the fat-LTO gate on main would fail this change. Check what it pulled in (cargo tree, feature flags)."
            exit 1
          fi
          if [ "$BINARY_SIZE_MB" -ge "$WARN_SIZE_MB" ]; then
            echo "::warning::Thin release binary ${BINARY_SIZE_MB}MB is within 5% of its ${MAX_SIZE_MB}MB ceiling."
          fi

      # Named after the build key, so a later run with the same inputs finds it
      # (the prebuilt step above). Three days, like server-binaries-<sha>.
      - name: Upload the server and CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          retention-days: 3
          if-no-files-found: error
          # A re-run attempt sees the first attempt's artifact of this name in
          # the same run, and without this the upload fails on it (the same
          # fix as ci-backend.yml's server-binaries). It replaces the same
          # commit's binaries.
          overwrite: true
          path: |
            target/release/pierre-mcp-server
            target/release/pierre-cli

  playwright:
    name: Playwright Integration Tests (Real Server)
    # Playwright ships no chromium for ubuntu-latest's 26.04 image
    # ("Playwright does not support chromium on ubuntu26.04-x64", 2026-11-10).
    runs-on: ubuntu-24.04
    needs: [changes, build-server]
    if: needs.changes.outputs.playwright == 'true'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The e2e-real seed clones the private dravr-contremaitre repo below.
      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      # Where the integration config and its pierre-cli helper look first
      # (frontend/integration/config, frontend/integration/helpers/db-setup.ts).
      - name: Download the server and CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-server.outputs.artifact }}
          path: target/release

      # An artifact does not keep the executable bit.
      - name: Mark the binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Create data directory
        run: mkdir -p data

      - name: Run integration tests
        working-directory: frontend
        run: bun run test:integration
        env:
          CI: true
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/integration-test.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          # The e2e control process registers each fresh account from this
          # runner's one address; the per-address sign-up window (5 a minute)
          # is pinned by the server's own tests, not by this lane.
          SIGN_UP_RATE_LIMIT_RPM: "100000"
          # The web app signs in through the hosted login page and receives its
          # code at <FRONTEND_URL>/auth/callback, which the server accepts only
          # on its configured web origin (carnet#787): the SPA Vite serves.
          FRONTEND_URL: "http://localhost:5173"
          RUST_LOG: "warn"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"

      # ---- Real-server e2e (frontend/e2e-real) ----
      # The e2e-real suite has NO playwright webServer by design (locally it
      # requires an already-running seeded stack); here CI seeds a fresh DB,
      # boots the release binary + Vite dev server explicitly, runs the suite,
      # and tears down. This is the only automated execution path for these
      # specs — without it the register→approve gate is human-run only.
      - name: Clone dravr-contremaitre (coach seed source)
        run: git clone --depth 1 https://github.com/dravr-ai/dravr-contremaitre.git ../dravr-contremaitre

      - name: Seed e2e-real database (admin + agents + demo + webtest)
        # Order matters: `seed demo-data` creates webtest@pierre.dev (see
        # crates/pierre-seeders/src/demo_data.rs), and webtest needs a
        # provider connection (synthetic-activities) or the onboarding
        # hard-gate hides the app UI the persona spec drives.
        run: |
          ./target/release/pierre-cli user create --email admin@example.com --password AdminPassword123 --force
          ./target/release/pierre-cli seed agents --agents-dir ../dravr-contremaitre/prompts/agents
          ./target/release/pierre-cli seed demo-data --days 30
          ./target/release/pierre-cli seed synthetic-activities --email webtest@pierre.dev --provider strava --count 30 --days 30
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/e2e-real.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="

      - name: Start Pierre server for e2e-real
        run: |
          nohup ./target/release/pierre-mcp-server > e2e-real-server.log 2>&1 &
          echo $! > e2e-real-server.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/health
        env:
          DATABASE_URL: "sqlite:${{ github.workspace }}/data/e2e-real.db"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          # The e2e control process registers each fresh account from this
          # runner's one address; the per-address sign-up window (5 a minute)
          # is pinned by the server's own tests, not by this lane.
          SIGN_UP_RATE_LIMIT_RPM: "100000"
          # The web app signs in through the hosted login page and receives its
          # code at <FRONTEND_URL>/auth/callback, which the server accepts only
          # on its configured web origin (carnet#787): the SPA Vite serves.
          FRONTEND_URL: "http://localhost:5173"
          RUST_LOG: "warn"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          # home-sync.real.spec.ts starts a scripted stand-in for the session-read
          # service on this port and connects its athlete's Strava through it.
          DRAVR_SCIOTTE_REMOTE_URL: "http://127.0.0.1:8097"
          # The route request's own bound, shortened so the spec's hung-detail
          # case answers in seconds; the spec reads the same value below.
          PIERRE_HOME_ROUTE_ANSWER_SECS: "5"

      - name: Start Vite dev server for e2e-real
        working-directory: frontend
        run: |
          nohup bun run dev > ../e2e-real-vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5173 > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:5173 > /dev/null

      - name: Run real-server e2e tests
        working-directory: frontend
        run: bun run test:e2e:real
        env:
          CI: true
          PIERRE_URL: "http://127.0.0.1:8081"
          FRONTEND_URL: "http://localhost:5173"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "AdminPassword123"
          # home-sync.real.spec.ts moves an athlete's last sync into the past
          # in the database the server above runs on.
          E2E_REAL_DATABASE_PATH: "${{ github.workspace }}/data/e2e-real.db"
          PIERRE_HOME_ROUTE_ANSWER_SECS: "5"

      - name: Stop e2e-real servers
        if: always()
        run: |
          kill "$(cat e2e-real-server.pid)" 2>/dev/null || true
          pkill -f 'vite' 2>/dev/null || true

      - name: Upload e2e-real server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-real-server-log
          path: e2e-real-server.log
          retention-days: 1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-report
          path: frontend/playwright-report/
          retention-days: 1

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-screenshots
          path: frontend/test-results/
          retention-days: 1

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-videos
          path: frontend/test-results/
          retention-days: 1

  mcp-compliance:
    name: MCP Protocol Compliance
    runs-on: ubuntu-24.04
    needs: [changes, build-server]
    if: needs.changes.outputs.mcp == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Download the server and CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-server.outputs.artifact }}
          path: target/release

      # An artifact does not keep the executable bit.
      - name: Mark the binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile

      - name: Build bridge
        working-directory: sdk
        run: bun run build

      - name: Validate SDK types exist
        working-directory: sdk
        run: |
          echo "🔍 Validating SDK TypeScript types..."
          if [ ! -f "src/types.ts" ]; then
            echo "❌ ERROR: src/types.ts not found"
            echo "📝 Run 'bun run generate-types' locally and commit the generated types"
            exit 1
          fi
          if grep -q "PLACEHOLDER" "src/types.ts"; then
            echo "⚠️  WARNING: types.ts contains placeholder content"
            echo "📝 Run 'bun run generate-types' with a running server and commit the real types"
            echo "   For CI: Types should be pre-generated and committed to the repository"
            exit 1
          fi
          echo "✅ SDK types validated successfully"

      - name: Run MCP compliance validation
        run: ./scripts/ci/ensure-mcp-compliance.sh
        env:
          # The shared release binary; the script otherwise looks in target/debug
          # first and cold-builds inline, which OOM-thrashed the runner (~90min+).
          PIERRE_SERVER_BINARY: ${{ github.workspace }}/target/release/pierre-mcp-server
          # CI detection variables for bridge
          CI: "true"
          GITHUB_ACTIONS: "true"
          # Pierre server configuration
          HTTP_PORT: 8080
          DATABASE_URL: "sqlite::memory:"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_ALLOW_INTERACTIVE_OAUTH: "false"
          PIERRE_RSA_KEY_SIZE: "2048"

      - name: Clean up validation artifacts
        if: always()
        run: |
          rm -rf validator/reports/*.md 2>/dev/null || true
          rm -rf /tmp/pierre-mcp-server-*.log 2>/dev/null || true

  sdk-types-check:
    name: SDK Types Up-to-Date
    runs-on: ubuntu-24.04
    needs: [changes, build-server]
    if: needs.changes.outputs.sdk == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Download the server and CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-server.outputs.artifact }}
          path: target/release

      # An artifact does not keep the executable bit.
      - name: Mark the binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Generate SDK types and check for drift
        run: |
          # Start server in background
          ./target/release/pierre-mcp-server &
          SERVER_PID=$!

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8081/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # GET /mcp/tools answers exactly like JSON-RPC tools/list, by role
          # (carnet#1511): the generated types describe what a human coach
          # with demo members is offered (Q15: the directory reviewer's
          # listing), so the generator signs in as the coach the coach-home
          # seeder makes, never as an admin, who is listed every tool. The
          # server has applied the migrations by now, so the CLI can write to
          # the same on-disk database.
          ./target/release/pierre-cli user create \
            --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --force
          ./target/release/pierre-cli seed coach-home \
            --coach-email "$SDK_COACH_EMAIL" --model sdk-types-ci

          # Sign in as the mobile app does: hosted login page, authorization
          # code, PKCE (the password grant is gone, carnet#787).
          PIERRE_ADMIN_TOKEN="$(printf '%s\n' "$SDK_COACH_PASSWORD" \
            | scripts/auth/first-party-sign-in.sh http://localhost:8081 "$SDK_COACH_EMAIL" - \
            | jq -r '.access_token // empty')"
          if [ -z "$PIERRE_ADMIN_TOKEN" ]; then
            echo "::error::Failed to mint the coach token for SDK type generation"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          export PIERRE_ADMIN_TOKEN

          # Generate types
          cd packages/mcp-types && bun run generate
          cd ../..

          # Stop server
          kill $SERVER_PID 2>/dev/null || true

          # Check for changes in all generated type files
          if ! git diff --exit-code packages/mcp-types/src/; then
            echo ""
            echo "::error::SDK types are out of sync with server schemas. Run 'bun run generate-types' in sdk/ and commit the result."
            echo ""
            exit 1
          fi

          echo "SDK types are up to date"
        env:
          # File-backed (not sqlite::memory:) so pierre-cli can create the admin
          # user in the same database the running server reads.
          DATABASE_URL: "sqlite:./sdk-types-ci.db?mode=rwc"
          ADMIN_EMAIL: "sdk-types-ci@pierre.dev"
          ADMIN_PASSWORD: "SdkTypesCi123!"
          # The coach-home seeder's coach and its dev-fixture password
          # (pierre-seeders coach_home.rs, COACH_PASSWORD).
          SDK_COACH_EMAIL: "coachhome@pierre.dev"
          SDK_COACH_PASSWORD: "CoachHome1234"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          HTTP_PORT: "8081"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          # A deployment with no USDA key leaves the food-database tools out of
          # tools/list (deployment_tools::retain_answerable), and the committed
          # types describe a deployment that holds one. Only listing reads it:
          # this run calls no tool, so the key is never sent to USDA.
          USDA_API_KEY: "sdk-types-ci-key-never-sent"

  sdk-tests:
    name: SDK Test Suite
    runs-on: ubuntu-24.04
    needs: [changes, build-server]
    if: needs.changes.outputs.sdk == 'true'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        # Node-hosted tools (vitest, tsc, eslint, jest, Metro, Playwright) run
        # on the repo's .nvmrc, not on whatever the runner image ships.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Download the server and CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-server.outputs.artifact }}
          path: target/release

      # An artifact does not keep the executable bit.
      - name: Mark the binaries executable
        run: chmod +x target/release/pierre-mcp-server target/release/pierre-cli

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile

      - name: Lint SDK code
        working-directory: sdk
        run: bun run lint

      - name: Type check SDK
        working-directory: sdk
        run: bun run type-check

      - name: Build SDK bridge
        working-directory: sdk
        run: bun run build

      - name: Run SDK unit tests
        working-directory: sdk
        run: bun run test:unit

      # The Claude Desktop bundle (.mcpb) ships with each SDK release; packing it
      # here smokes the staged tree (entry point runs, keychain loads) on the
      # change that would break it rather than on release day.
      - name: Pack Claude Desktop bundle
        working-directory: sdk
        run: node mcpb/build.mjs

      # Kept so a tester can install the exact bundle this commit was tested with,
      # from the run's Artifacts, without an SDK release being cut. ~3.5 MB per run.
      - name: Upload Claude Desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: dravr-mcpb
          path: sdk/build/dravr-*.mcpb
          if-no-files-found: error
          retention-days: 14

      # The helpers find the server and the CLI through these, the release
      # build above, so no step here compiles anything.
      - name: Run SDK integration tests
        working-directory: sdk
        run: bun run test:integration
        env:
          PIERRE_SERVER_BINARY: ${{ github.workspace }}/target/release/pierre-mcp-server
          PIERRE_CLI_BINARY: ${{ github.workspace }}/target/release/pierre-cli
          DATABASE_URL: "sqlite::memory:"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          # tools/list leaves the food-database tools out without a USDA key, and
          # these suites assert they are listed; none calls one, so the key is
          # never sent to USDA.
          USDA_API_KEY: "sdk-tests-ci-key-never-sent"

      - name: Run SDK E2E tests
        working-directory: sdk
        run: bun run test:e2e
        env:
          PIERRE_SERVER_BINARY: ${{ github.workspace }}/target/release/pierre-mcp-server
          PIERRE_CLI_BINARY: ${{ github.workspace }}/target/release/pierre-cli
          DATABASE_URL: "sqlite::memory:"
          AUTO_APPROVE_USERS: "true"
          PIERRE_MASTER_ENCRYPTION_KEY: "rEFe91l6lqLahoyl9OSzum9dKa40VvV5RYj8bHGNTeo="
          PIERRE_RSA_KEY_SIZE: "2048"
          STRAVA_CLIENT_ID: "test_client_id_ci"
          STRAVA_CLIENT_SECRET: "test_client_secret_ci"
          STRAVA_REDIRECT_URI: "http://localhost:8080/auth/strava/callback"
          # tools/list leaves the food-database tools out without a USDA key, and
          # these suites assert they are listed; none calls one, so the key is
          # never sent to USDA.
          USDA_API_KEY: "sdk-tests-ci-key-never-sent"

      - name: Upload SDK test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-results
          path: sdk/test-results/
          retention-days: 1
          if-no-files-found: ignore
