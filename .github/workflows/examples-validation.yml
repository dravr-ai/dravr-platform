# ABOUTME: GitHub Actions workflow for validating examples compile and pass tests
# ABOUTME: Runs on push/PR to examples/, nightly, and manual trigger

name: "CI: Examples Validation"

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    # The examples are standalone crates with their own lockfiles and no path
    # dependency on the server, so a server change cannot break their build.
    # The smoke test that runs one against the server lives in server-e2e.yml
    # (nightly, or on a dispatch that asks for it), beside the server it uses.
    paths:
      - 'examples/**'
      - '.github/workflows/examples-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - '.github/workflows/examples-validation.yml'
  schedule:
    - cron: '21 6 * * *'  # Nightly at 06:21 UTC
  workflow_dispatch:

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  # The event name is in the group because a nightly cron on main carries the
  # tip's sha: without it that run joins the tip's push-run group and cancels
  # that verdict mid-flight (ci-backend.yml records the same collision).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

# Security: Explicit permissions following principle of least privilege
permissions:
  contents: read

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  compile-rust-examples:
    name: Compile Rust Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20  # three cargo checks, ~1 min warm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache example dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            examples/agents/*/target/
          key: ${{ runner.os }}-examples-${{ hashFiles('examples/agents/*/Cargo.lock') }}

      - name: Check agent_discovery compiles
        working-directory: examples/agents/agent_discovery
        run: cargo check --quiet

      - name: Check task_manager compiles
        working-directory: examples/agents/task_manager
        run: cargo check --quiet

      - name: Check fitness_analyzer compiles
        working-directory: examples/agents/fitness_analyzer
        run: cargo check --quiet

  validate-python-examples:
    name: Validate Python Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~20 s
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r examples/mcp_clients/gemini_fitness_assistant/requirements.txt

      - name: Syntax validation
        run: python3 -m py_compile examples/mcp_clients/gemini_fitness_assistant/*.py

      - name: Import validation
        run: |
          cd examples/mcp_clients/gemini_fitness_assistant
          python3 -c "from gemini_fitness_assistant import PierreMCPClient, MCPTool; print('Imports OK')"

  test-rust-examples:
    name: Test Rust Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ~1 min warm
    needs: compile-rust-examples
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache example dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            examples/agents/*/target/
          key: ${{ runner.os }}-examples-${{ hashFiles('examples/agents/*/Cargo.lock') }}

      - name: Run fitness_analyzer tests
        working-directory: examples/agents/fitness_analyzer
        run: cargo test --quiet
