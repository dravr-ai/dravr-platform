name: "Security: Dependency Audit"

on:
  schedule:
    # Every Monday at 8 AM UTC (4 AM EDT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # embacle's copilot-sdk feature pulls github-copilot-sdk, whose build script
  # downloads ~130 MB and embeds the Copilot CLI unless told not to; the runtime
  # is a file COPILOT_RUNTIME_PATH names, never a payload in the binary.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: deps-check-

      - name: Install cargo-edit and cargo-audit
        run: cargo install cargo-edit cargo-audit --locked

      - name: Check compatible upgrades
        id: compatible
        run: |
          OUTPUT=$(cargo upgrade --dry-run 2>&1 || true)
          {
            echo 'COMPATIBLE<<ENDOFCOMPAT'
            echo "$OUTPUT"
            echo 'ENDOFCOMPAT'
          } >> "$GITHUB_OUTPUT"

      - name: Check incompatible upgrades
        id: incompatible
        run: |
          OUTPUT=$(cargo upgrade --dry-run --incompatible 2>&1 || true)
          {
            echo 'INCOMPATIBLE<<ENDOFINCOMPAT'
            echo "$OUTPUT"
            echo 'ENDOFINCOMPAT'
          } >> "$GITHUB_OUTPUT"

      - name: Run security audit
        id: audit
        run: |
          # `|| true` here would succeed before $? is read, making EXIT_CODE
          # always 0 and the advisory branch below unreachable — a real RUSTSEC
          # finding read as a clean audit. The status is captured first and the
          # step kept alive with `set +e`, so a non-zero audit still reports.
          set +e
          OUTPUT=$(cargo audit 2>&1)
          EXIT_CODE=$?
          set -e
          {
            echo 'AUDIT<<ENDOFAUDIT'
            echo "$OUTPUT"
            echo 'ENDOFAUDIT'
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Determine if updates exist
        id: check
        env:
          COMPAT: ${{ steps.compatible.outputs.COMPATIBLE }}
          INCOMPAT: ${{ steps.incompatible.outputs.INCOMPATIBLE }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          HAS_UPDATES=false

          # Check if compatible output contains actual upgrades (look for "new req" column)
          if echo "$COMPAT" | grep -qE '^\w.+\s+\d+\.\d+'; then
            HAS_UPDATES=true
          fi

          # Check if incompatible output contains actual upgrades
          if echo "$INCOMPAT" | grep -qE 'incompatible:\s+[1-9]'; then
            HAS_UPDATES=true
          fi

          # Security advisories always warrant an issue
          if [ "$AUDIT_EXIT" != "0" ]; then
            HAS_UPDATES=true
            echo "has_vulnerabilities=true" >> "$GITHUB_OUTPUT"
          fi

          echo "has_updates=$HAS_UPDATES" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v9
        env:
          # Cargo's output reaches the script through the environment, never
          # through `${{ }}`. An expression substitutes TEXTUALLY into the
          # JavaScript source before it is parsed, so a backtick, a `${` or a
          # `++` anywhere in an upgrade table or an advisory description is
          # compiled as code rather than read as text. That is what killed the
          # 2026-09-14 scheduled run ("SyntaxError: Invalid left-hand side
          # expression in postfix operation"), and since crate names and
          # advisory text come from the dependency graph it is an injection
          # surface in a job holding `issues: write`, not only a crash
          # (carnet#432: cargo-edit quotes flags as `--incompatible`).
          COMPATIBLE: ${{ steps.compatible.outputs.COMPATIBLE }}
          INCOMPATIBLE: ${{ steps.incompatible.outputs.INCOMPATIBLE }}
          AUDIT: ${{ steps.audit.outputs.AUDIT }}
          HAS_VULNS: ${{ steps.check.outputs.has_vulnerabilities }}
        with:
          script: |
            const title = '🔧 Dependency updates available';
            const label = 'dependencies';

            // Build issue body
            const compatible = process.env.COMPATIBLE || '';
            const incompatible = process.env.INCOMPATIBLE || '';
            const audit = process.env.AUDIT || '';
            const hasVulns = process.env.HAS_VULNS === 'true';

            const today = new Date().toISOString().split('T')[0];

            let body = `# Dependency Update Report — ${today}\n\n`;
            body += `_Generated by [dependency-check workflow](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_\n\n`;

            if (hasVulns) {
              body += `> **⚠️ Security vulnerabilities detected** — review the audit section below.\n\n`;
            }

            body += `## Compatible Upgrades (safe, semver-minor/patch)\n\n`;
            body += `\`\`\`\n${compatible}\n\`\`\`\n\n`;

            body += `## Incompatible Upgrades (semver-major, may require migration)\n\n`;
            body += `\`\`\`\n${incompatible}\n\`\`\`\n\n`;

            body += `## Security Audit\n\n`;
            body += `\`\`\`\n${audit}\n\`\`\`\n\n`;

            body += `## How to apply\n\n`;
            body += `\`\`\`bash\n`;
            body += `# Compatible upgrades (low risk)\n`;
            body += `cargo install cargo-edit\n`;
            body += `cargo upgrade\n\n`;
            body += `# Incompatible upgrades (review changelog first)\n`;
            body += `cargo upgrade --incompatible\n`;
            body += `\`\`\`\n`;

            const { upsertStandingIssue } = require('./scripts/ci/standing-issue.cjs');
            await upsertStandingIssue(github, core, {
              ...context.repo, label, title, body, onExisting: 'update',
              newLabel: { color: '0366d6', description: 'Dependency updates' },
            });

      - name: No updates needed
        if: steps.check.outputs.has_updates != 'true'
        run: echo "All dependencies are up to date. No issue created."
