name: "CI: Design System"

# DESIGN.md is one system with two renderers, so this gate spans web AND mobile
# and gets its own trigger set rather than riding either platform's test suite.
# It is compile-free (grep + counts), so it reports in seconds.

on:
  push:
    branches: [ "main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**" ]
    paths:
      - 'frontend/src/**'
      - 'frontend/DESIGN.md'
      - 'frontend/tailwind.config.cjs'
      - 'frontend-mobile/src/**'
      - 'frontend-mobile/*.css'
      - 'frontend-mobile/tailwind.config.js'
      - 'packages/shared-constants/src/design-system.ts'
      - 'scripts/ci/design-system-validation.sh'
      - '.github/workflows/design-system.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/src/**'
      - 'frontend/DESIGN.md'
      - 'frontend/tailwind.config.cjs'
      - 'frontend-mobile/src/**'
      - 'frontend-mobile/*.css'
      - 'frontend-mobile/tailwind.config.js'
      - 'packages/shared-constants/src/design-system.ts'
      - 'scripts/ci/design-system-validation.sh'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:

concurrency:
  # One run going and one waiting, per lane and per ref (JF, 2026-11-19). A
  # running run always finishes, so main still turns green and deploys however
  # often it is pushed; a newer push takes the single waiting slot, replacing
  # the run that waited there, which GitHub cancels. The run that does go tests
  # a tree holding every skipped commit. Main used to keep one group per sha and
  # never cancel: 24 commits on 2026-11-19 queued ~600 jobs for a handful of
  # slots. Both costs are accepted: an intermediate main commit gets no verdict
  # of its own (the eviction carnet#169 once counted as a loss), and a branch
  # re-pushed mid-run finishes the superseded run (what carnet#1114 avoided),
  # bounded to one. The event name keeps a schedule or dispatch run out of the
  # push group. `cancel-in-progress` stays a literal: an expression there did
  # not hold on main (run 33026440559, see ci-backend.yml's history).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  design-system:
    name: Design System Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # DESIGN.md token lint, seconds

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate DESIGN.md token and primitive discipline
        run: ./scripts/ci/design-system-validation.sh
