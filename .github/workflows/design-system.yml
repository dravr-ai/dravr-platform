name: "CI: Design System"

# DESIGN.md is one system with two renderers, so this gate spans web AND mobile
# and gets its own trigger set rather than riding either platform's test suite.
# It is compile-free (grep + counts), so it reports in seconds.

on:
  push:
    branches: [ "main", "debug/*", "feature/*", "fix/*", "claude/*", "copilot/*" ]
    paths:
      - 'frontend/src/**'
      - 'frontend/DESIGN.md'
      - 'frontend/tailwind.config.cjs'
      - 'frontend-mobile/src/**'
      - 'frontend-mobile/global.css'
      - 'frontend-mobile/tailwind.config.js'
      - 'packages/shared-constants/src/design-system.ts'
      - 'scripts/ci/design-system-validation.sh'
      - '.github/workflows/design-system.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/src/**'
      - 'frontend/DESIGN.md'
      - 'frontend/tailwind.config.cjs'
      - 'frontend-mobile/src/**'
      - 'frontend-mobile/global.css'
      - 'frontend-mobile/tailwind.config.js'
      - 'packages/shared-constants/src/design-system.ts'
      - 'scripts/ci/design-system-validation.sh'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:

concurrency:
  # On main the sha is part of the group, so every commit gets its own group
  # and nothing can cancel another commit's verdict. Branches share a group per
  # ref and keep cancelling, where fast feedback beats a stale result. The ref
  # test lives in `group` rather than in `cancel-in-progress` because only the
  # former is known to work here — see ci-backend.yml for the run that proved it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design-system:
    name: Design System Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate DESIGN.md token and primitive discipline
        run: ./scripts/ci/design-system-validation.sh
