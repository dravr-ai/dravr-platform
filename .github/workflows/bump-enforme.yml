# ABOUTME: The enforme lane — the shared bump spine (which moves the diamond), then the sciotte image and deploy
# ABOUTME: Everything version-shaped is in satellite-bump.yml and satellites.toml; this file is triggers and shipping

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# enforme-specific knowledge, and nothing else:
#
# * Why this listens to enforme rather than to sciotte. This repo pins dravr-sciotte
#   directly (pierre-logging, pierre-providers, pierre-routes-auth) and also depends
#   on dravr-enforme, which pins dravr-sciotte itself for its Garmin and Strava
#   scraping — a diamond. ci-backend.yml hard-fails any build where a dravr-* crate
#   resolves to two versions, so moving the sciotte pin alone produces a lockfile with
#   two dravr-sciotte entries and a branch that can never merge.
#
#   That is the real reason the pin sat on v0.8.0 through five sciotte releases. It
#   read as neglect and was actually a blocked edge with nothing reporting the block:
#   the old sciotte-pin-check.yml faithfully filed "the pin is behind" issues for a
#   bump that could not have succeeded.
#
#   So sciotte announces to enforme, enforme bumps and releases, and the spine moves
#   every arm of the diamond in one commit — taking each companion version from what
#   the released enforme pins, so they converge by construction rather than by two
#   workflows happening to agree. The diamond is wider than sciotte:
#   satellites.toml declares dravr-equilibre and dravr-riviere as companions too,
#   because carnet#323 was dravr-equilibre at 0.2.4 beside 0.2.5, in a run whose
#   sciotte and enforme counts both read one.
#
# * Ordering is the other safety property: the sciotte image is built and :latest
#   advanced only after main has merged. Building earlier would leave :latest pointing
#   at a version this repo never accepted, and since terraform's sciotte_image is that
#   moving tag, the next unrelated apply would deploy it.
#
# * There are TWO things to ship. This lane deploys the sciotte SERVICE, and it also
#   has to rebuild the platform binary — pierre-enforme compiles dravr-enforme in.
#   The lane once did not: it deployed sciotte and left main carrying an enforme the
#   running binary did not have. That is carnet#94's shape, and the platform dispatch
#   in the deploy job below is the fix.

name: "Enforme: Release Integration"

on:
  repository_dispatch:
    types: [enforme-released]
  schedule:
    # Weekly safety net, so a missed or failed dispatch still gets integrated.
    # Off :00 deliberately: the top of the hour is the most contended slot on
    # GitHub's scheduler, and this lane's 2026-08-31 firing landed 6h20m late
    # (19:20 UTC for a 13:00 slot), well after anyone would look for it. :11
    # also keeps it clear of bump-photograveur's :30 in the same hour.
    - cron: "11 13 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "dravr-enforme tag to integrate (defaults to the latest release)"
        required: false
        type: string
      dry_run:
        description: "Rehearse: resolve and rewrite, push nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # push the bump branch and the squash merge
  actions: write # dispatch the CI gates onto that branch
  id-token: write # WIF, for the image build and the deploy
  security-events: write # Trivy SARIF, uploaded by the image build

concurrency:
  group: enforme-bump
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/satellite-bump.yml
    with:
      satellite: dravr-enforme
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      DRAVR_PRIVATE_DEPS_TOKEN: ${{ secrets.DRAVR_PRIVATE_DEPS_TOKEN }}
      DRAVR_CARNET_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
  # ---------------------------------------------------------------------------
  # 5. Build the sciotte image — only now that main has accepted this version
  # ---------------------------------------------------------------------------
  image:
    name: Build and publish the sciotte image
    needs: bump
    # Runs whether or not a bump was needed, so the deployment converges on whatever
    # sciotte version main pins. Gating this on "a bump happened" instead meant a
    # re-run after a merge skipped everything, leaving no way to finish a deploy that
    # had failed after the bump already landed — which is precisely the state a
    # false-alarm rollback leaves behind.
    #
    # `state` is read, not just `result`, because two of the spine's clean outcomes
    # leave main pinning the OLD version: a stand-down and a dry run. Building either
    # would advance :latest to a sciotte this repo never accepted, and terraform's
    # sciotte_image is that moving tag — the next unrelated apply would deploy it.
    #
    # `!inputs.dry_run` is load-bearing, not belt-and-braces. dry_run suppresses the
    # PIN PUSH inside the spine, and when every pin is already current the spine skips
    # its bump job entirely — so `state` is 'current', this job's condition holds, and
    # a rehearsal builds an image and deploys sciotte to dev. That happened on
    # the first dispatch of this lane (run 34503834779): same source tag, so identical
    # bytes and no functional change, but a Cloud Run revision is not what "dry run"
    # means to whoever typed it.
    if: >-
      ${{ !cancelled()
          && !inputs.dry_run
          && needs.bump.result == 'success'
          && (needs.bump.outputs.state == 'pushed' || needs.bump.outputs.state == 'current') }}
    uses: ./.github/workflows/publish-sciotte-image.yml
    secrets: inherit
    with:
      # The spine resolves every companion off the released enforme's own manifest
      # and publishes them as JSON. v-prefixed here: the spine deals in bare cargo
      # versions, this wants a git ref.
      sciotte_ref: v${{ fromJSON(needs.bump.outputs.companions)['dravr-sciotte'] }}

  # ---------------------------------------------------------------------------
  # 6. Deploy sciotte, verify the bytes, roll back, tag, then ship the platform
  # ---------------------------------------------------------------------------
  #
  # deploy-satellite-cloud-run.yml carries the deploy, the digest assertion, the
  # rollback, the `deployed-dev` tag and the platform dispatch for every lane with
  # a service. What is sciotte's and enforme's alone is below.
  #
  # * The HTTP probe. sciotte enforces Cloud Run IAM (backend_sciotte_iam, on since
  #   118571ed3), so the probe mints an identity token. The audience mirrors
  #   terraform's local.sciotte_audience ("dravr-sciotte-${var.environment}"), and
  #   the suffix is "development", not "dev": the tfvars directory is named
  #   environments/dev/ but the `environment` variable inside it is "development".
  #   Guessing "dev" from the path yields a token Cloud Run rejects with 401 — a
  #   valid token for an audience the service does not accept, which looks nothing
  #   like the 403 an unauthenticated call gets. The probe asserts both scraping
  #   providers, because a build that lost one still boots.
  #
  # * The platform binary. dravr-enforme is a Rust crate compiled INTO
  #   dravr-mcp-server-api — `pierre-enforme` re-exports it and `server-production`
  #   turns on `health-sync`, so the Whoop, Garmin and Strava sync paths in the
  #   running binary are enforme's code. This lane once deployed sciotte and left
  #   main carrying an enforme the running binary did not have, until an unrelated
  #   push happened to rebuild it: carnet#94's shape, six green jobs and nothing
  #   shipped. The dispatch runs after the sciotte deploy because enforme talks to
  #   the sciotte service, so the service has to be on the version enforme expects
  #   before the binary that calls it starts up.
  deploy:
    needs: [bump, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    uses: ./.github/workflows/deploy-satellite-cloud-run.yml
    secrets: inherit
    with:
      service: sciotte
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      probe_audience: dravr-sciotte-development
      probe_providers: garmin strava
      ship_platform: ${{ needs.bump.outputs.state == 'pushed' }}
      release: enforme v${{ needs.bump.outputs.version }}
      platform_summary: |-
        The sciotte service is on **v${{ fromJSON(needs.bump.outputs.companions)['dravr-sciotte'] }}**; the platform binary that
        compiles dravr-enforme **v${{ needs.bump.outputs.version }}** and calls that service is now
        rebuilding to match.
