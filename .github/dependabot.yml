version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps):"
    # dtolnay/rust-toolchain keeps one branch per toolchain version, including
    # ones no Rust release has reached yet (1.120.0 existed in Oct 2026), and
    # Dependabot reads those branch names as versions. The toolchain moves by
    # hand with the workspace pin, and the move relocks actions.lock.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  # Move the committed Terraform provider locks (dev, prod, artifacts)
  - package-ecosystem: "terraform"
    directories:
      - "/infra/environments/dev"
      - "/infra/environments/prod"
      - "/infra/artifacts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps):"
